<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #tw-stage { position:absolute; inset:0; overflow:hidden; background:#05080f; }
  #tw-stage canvas { position:absolute; left:0; top:0; width:1920px; height:1080px; display:block; }
</style>
<!-- Stylised WebGL tornado. Copy per use; rename "g-tornado" everywhere in this file to the host's
     data-composition-id (two spots: this root and CONFIG.id). Edit CONFIG only. No text: labels
     go on a fixed HUD comp above this one. -->
<div id="root" data-composition-id="g-tornado" data-width="1920" data-height="1080" data-duration="12">
  <div id="tw-stage"><canvas width="1920" height="1080"></canvas></div>
</div>
<!-- three r170 rewrapped as a classic IIFE (window.THREE); sub-comp scripts run as classic scripts. -->
<script src="vendor/three.classic.js"></script>
<script>
(function () {
// ===================== CONFIG: the only block to edit =====================
const CONFIG = {
  id: "g-tornado",            // must equal the root + host data-composition-id
  duration: 12,               // s; match root + host data-duration
  scheme: "night",            // "day" (grey) | "night" (blue) | "dusk" (amber)
  funnelWidth: 6,             // top radius, world units (base is ~20 % of it)
  height: 30,                 // cloud base height, world units
  rotationSpeed: 2.2,         // rad/s at the funnel base
  path: { startX: -14, endX: 10 }, // base x at t=0 and t=duration (frame spans ~ -45..45)
  debrisDensity: 1,           // 0 = none, 1 = ~900 chunks, 2 = double
  seed: 1974,
  cameraMove: "static",       // "static" | "slow-push" | "orbit"
};
// ==========================================================================

const SCHEMES = {
  day:   { skyTop: 0x3a4148, horizon: 0x8e969e, glow: 0xc9cdd0, funnel: 0xb4b9be, shade: 0x40454b, wall: 0x22272c, ground: 0x4a5241, dust: 0x857866, debris: 0x16171a, fog: 0x7a828a },
  night: { skyTop: 0x0d1729, horizon: 0x2e4a78, glow: 0x6f97d6, funnel: 0xa4bbdc, shade: 0x1a2740, wall: 0x070c16, ground: 0x1a2944, dust: 0x4a5f82, debris: 0x04060a, fog: 0x263c62 },
  dusk:  { skyTop: 0x2a2229, horizon: 0xb4643a, glow: 0xf3a152, funnel: 0xa8968a, shade: 0x2c2320, wall: 0x140f10, ground: 0x3a2a1f, dust: 0x8a6645, debris: 0x120c09, fog: 0x8a5634 },
};

const THREE = window.THREE;
const W = 1920, H = 1080, C = CONFIG, S = SCHEMES[C.scheme];
const col = (hex) => new THREE.Color(hex);
const TAU = Math.PI * 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(C.seed);
const SEED = (C.seed % 997) * 0.173;

const root = document.querySelector('[data-composition-id="' + C.id + '"]');
const canvas = root.querySelector("canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 1200);

const NOISE = `
  float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
  float noise(vec3 x) {
    vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }
`;
// Shared per-frame uniforms (same objects referenced by every material).
const U = {
  uTime: { value: 0 }, uSeed: { value: SEED }, uBase: { value: new THREE.Vector3() },
  uFog: { value: col(S.fog) }, uGlow: { value: col(S.glow) },
};

// ---- sky dome: gradient + slow fbm cloud deck + horizon glow band ----
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { ...U, uTop: { value: col(S.skyTop) }, uHor: { value: col(S.horizon) } },
  vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: NOISE + `
    uniform float uTime, uSeed; uniform vec3 uTop, uHor, uGlow, uFog; varying vec3 vDir;
    void main() {
      float y = vDir.y;
      vec3 c = mix(uHor, uTop, smoothstep(-0.02, 0.55, y));
      vec2 uv = vDir.xz / (max(y, 0.0) + 0.12);
      float cl = fbm(vec3(uv * 0.9 + vec2(uTime * 0.03, 0.0), uSeed));
      c *= 0.55 + 0.75 * cl * smoothstep(0.0, 0.08, y);
      float band = exp(-abs(y - 0.012) * 40.0) * (0.35 + 0.65 * noise(vec3(vDir.x * 6.0, uSeed, 0.0)));
      c += uGlow * band * 0.55;
      gl_FragColor = vec4(y < 0.0 ? uFog : c, 1.0);
    }`,
}));
scene.add(sky);

// ---- ground: fbm fields, dust stain under the vortex, distance fog ----
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), new THREE.ShaderMaterial({
  uniforms: { ...U, uGround: { value: col(S.ground) }, uDust: { value: col(S.dust) }, uR: { value: C.funnelWidth } },
  vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: NOISE + `
    uniform float uTime, uSeed, uR; uniform vec3 uGround, uDust, uFog, uBase; varying vec3 vW;
    void main() {
      float n = fbm(vec3(vW.xz * 0.04, uSeed)), f = noise(vec3(vW.xz * 0.35, uSeed + 3.0));
      vec3 c = uGround * (0.7 + 0.5 * n + 0.15 * f);
      float d = length(vW.xz - uBase.xz);
      c = mix(c, uDust, smoothstep(uR * 2.2, 0.0, d) * 0.7);
      float fog = 1.0 - exp(-length(vW - cameraPosition) * 0.006);
      gl_FragColor = vec4(mix(c, uFog, fog), 1.0);
    }`,
}));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ---- vortex shell: open cylinder bent into a funnel in the vertex shader (funnel layers + dust skirt) ----
const shellGeo = new THREE.CylinderGeometry(1, 1, 1, 72, 56, true);
function vortex(o) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { ...U, uH: { value: o.h }, uR0: { value: o.r0 }, uR1: { value: o.r1 }, uPow: { value: o.pow },
      uLean: { value: o.lean || 0 }, uSpin: { value: C.rotationSpeed }, uAmp: { value: o.amp }, uAlpha: { value: o.alpha },
      uFade: { value: new THREE.Vector2(o.fadeLo, o.fadeHi) }, uCol: { value: col(o.col) }, uShade: { value: col(o.shade) } },
    vertexShader: NOISE + `
      uniform float uTime, uSeed, uH, uR0, uR1, uPow, uLean, uSpin, uAmp; uniform vec3 uBase;
      varying float vH, vA; varying vec3 vN, vW;
      void main() {
        float h = position.y + 0.5, a = atan(position.z, position.x);
        float sa = a - uTime * uSpin * (1.6 - 0.8 * h);
        float r = mix(uR0, uR1, pow(h, uPow));
        r *= 1.0 + uAmp * (noise(vec3(cos(sa) * 1.4, sin(sa) * 1.4, h * 5.0 - uTime * 0.9) + uSeed) - 0.5) * 2.0;
        float sway = uLean * pow(h, 1.6) + 0.9 * pow(1.0 - h, 1.5) * sin(uTime * 0.7 + uSeed + h * 2.5) * uR0 * 2.0;
        vec3 w = vec3(uBase.x + sway + cos(a) * r, uBase.y + h * uH, uBase.z + sin(a) * r);
        vH = h; vA = sa; vW = w; vN = normalize(vec3(cos(a), (uR0 - uR1) / uH, sin(a)));
        gl_Position = projectionMatrix * viewMatrix * vec4(w, 1.0);
      }`,
    fragmentShader: NOISE + `
      uniform float uTime, uSeed, uAlpha; uniform vec2 uFade; uniform vec3 uCol, uShade, uGlow, uFog;
      varying float vH, vA; varying vec3 vN, vW;
      void main() {
        float q = vA + vH * 4.0;
        float s = fbm(vec3(cos(q) * 3.0, sin(q) * 3.0, vH * 1.6 + uSeed));
        vec3 V = normalize(cameraPosition - vW);
        float ndv = abs(dot(vN, V));
        float lit = 0.55 + 0.45 * max(dot(vN, normalize(vec3(-0.5, 0.6, 0.6))), 0.0);
        vec3 c = mix(uShade, uCol, 0.25 + 0.75 * s) * lit + uGlow * pow(1.0 - ndv, 2.0) * 0.45;
        float alpha = uAlpha * (0.3 + 0.7 * smoothstep(0.0, 0.6, ndv)) * (0.45 + 0.55 * s)
                    * smoothstep(0.0, uFade.x, vH) * (1.0 - smoothstep(uFade.y, 1.0, vH));
        c = mix(c, uFog, 1.0 - exp(-length(vW - cameraPosition) * 0.004));
        gl_FragColor = vec4(c, alpha);
      }`,
  });
  const mesh = new THREE.Mesh(shellGeo, m);
  mesh.frustumCulled = false;
  mesh.renderOrder = o.order;
  scene.add(mesh);
}
const R0 = C.funnelWidth * 0.2, LEAN = Math.sign(C.path.endX - C.path.startX) * C.height * 0.12;
vortex({ order: 3, h: C.height, r0: R0 * 0.8, r1: C.funnelWidth * 0.8, pow: 2.4, lean: LEAN, amp: 0.10, alpha: 0.9, fadeLo: 0.04, fadeHi: 0.85, col: S.funnel, shade: S.shade });
vortex({ order: 4, h: C.height, r0: R0 * 1.25, r1: C.funnelWidth * 1.1, pow: 2.0, lean: LEAN, amp: 0.22, alpha: 0.45, fadeLo: 0.02, fadeHi: 0.8, col: S.funnel, shade: S.shade });
vortex({ order: 5, h: C.height * 0.16, r0: R0 * 3.4, r1: R0 * 1.4, pow: 0.7, amp: 0.3, alpha: 0.55, fadeLo: 0.05, fadeHi: 0.35, col: S.dust, shade: S.shade });

// ---- wall cloud (lowered, rotating disc) + wider cloud base, one shader ----
const ringGeo = new THREE.RingGeometry(0.001, 1, 96, 14);
function disc(o) {
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: { ...U, uR: { value: o.r }, uY: { value: o.y }, uDrop: { value: o.drop }, uX: { value: o.x },
      uSpin: { value: C.rotationSpeed * 0.12 }, uCol: { value: col(S.wall) }, uAlpha: { value: o.alpha } },
    vertexShader: NOISE + `
      uniform float uTime, uSeed, uR, uY, uDrop, uX, uSpin; uniform vec3 uBase;
      varying float vRho, vA; varying vec3 vW;
      void main() {
        float rho = length(position.xy), a = atan(position.y, position.x);
        vA = a - uTime * uSpin; vRho = rho;
        float y = uY - uDrop * pow(1.0 - rho, 2.0) - uDrop * 0.3 * noise(vec3(cos(vA) * 2.0, sin(vA) * 2.0, rho * 3.0 + uSeed));
        vW = vec3(uBase.x + uX + position.x * uR, y, uBase.z + position.y * uR);
        gl_Position = projectionMatrix * viewMatrix * vec4(vW, 1.0);
      }`,
    fragmentShader: NOISE + `
      uniform float uSeed, uAlpha; uniform vec3 uCol, uGlow, uFog; varying float vRho, vA; varying vec3 vW;
      void main() {
        float q = vA + vRho * 5.0;
        float s = fbm(vec3(cos(q) * 2.5, sin(q) * 2.5, vRho * 4.0 + uSeed));
        vec3 c = uCol * (0.6 + 0.8 * s) + uGlow * 0.08 * smoothstep(0.5, 1.0, vRho);
        c = mix(c, uFog, (1.0 - exp(-length(vW - cameraPosition) * 0.004)) * 0.6);
        float alpha = uAlpha * smoothstep(1.0, 0.55 + 0.3 * s, vRho);
        gl_FragColor = vec4(c, alpha);
      }`,
  });
  const mesh = new THREE.Mesh(ringGeo, m);
  mesh.frustumCulled = false;
  mesh.renderOrder = o.order;
  scene.add(mesh);
}
disc({ order: 1, r: C.funnelWidth * 9, y: C.height + 3, drop: 1.5, x: LEAN, alpha: 0.95 });
disc({ order: 2, r: C.funnelWidth * 2.6, y: C.height + 1.5, drop: 3.5, x: LEAN, alpha: 1.0 });

// ---- seeded debris chunks + soft dust puffs orbiting the base (points: zero triangles) ----
function cloud(o) {
  const n = Math.round(o.count), seeds = new Float32Array(n * 4);
  for (let i = 0; i < n * 4; i++) seeds[i] = rand();
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute("aS", new THREE.BufferAttribute(seeds, 4));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { ...U, uSpin: { value: C.rotationSpeed }, uR0: { value: o.r0 }, uR1: { value: o.r1 }, uY: { value: o.ymax },
      uSize: { value: o.size }, uSoft: { value: o.soft }, uCol: { value: col(o.col) }, uAlpha: { value: o.alpha } },
    vertexShader: `
      uniform float uTime, uSpin, uR0, uR1, uY, uSize; uniform vec3 uBase; attribute vec4 aS; varying float vFade;
      void main() {
        float y = uY * pow(aS.y, 2.2) + 0.3 * sin(uTime * 2.0 + aS.z * 40.0);
        float r = (uR0 + uR1 * aS.x) * (1.0 + 0.8 * y / uY);
        float a = aS.z * 6.28318 + uTime * uSpin * (0.6 + 1.2 * aS.w) / (0.5 + 0.1 * r);
        vec4 mv = viewMatrix * vec4(uBase + vec3(cos(a) * r, max(y, 0.05), sin(a) * r), 1.0);
        vFade = 1.0 - smoothstep(0.6, 1.0, aS.y);
        gl_PointSize = uSize * (0.4 + aS.w) * 900.0 / -mv.z;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform float uSoft, uAlpha; uniform vec3 uCol; varying float vFade;
      void main() {
        float d = length(gl_PointCoord - 0.5) * 2.0;
        float a = uSoft > 0.5 ? (1.0 - smoothstep(0.2, 1.0, d)) : step(d, 0.9);
        gl_FragColor = vec4(uCol, a * uAlpha * vFade);
      }`,
  });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  p.renderOrder = o.order;
  scene.add(p);
}
cloud({ order: 6, count: 260, r0: R0 * 1.5, r1: R0 * 4, ymax: 5, size: 1.6, soft: 1, col: S.dust, alpha: 0.22 });
cloud({ order: 7, count: 900 * C.debrisDensity, r0: R0 * 1.2, r1: R0 * 4.5, ymax: C.height * 0.4, size: 0.12, soft: 0, col: S.debris, alpha: 0.95 });

// ---- camera: all moves are pure functions of t ----
function placeCamera(t) {
  const k = Math.min(t / C.duration, 1);
  const look = new THREE.Vector3(0, 13, 0);
  if (C.cameraMove === "slow-push") camera.position.set(0, 4 + k, 82 - 28 * k);
  else if (C.cameraMove === "orbit") { const a = -0.35 + 0.7 * k; camera.position.set(Math.sin(a) * 72, 4.5, Math.cos(a) * 72); }
  else camera.position.set(0, 4, 72);
  camera.lookAt(look);
}

function render(t) {
  const k = Math.min(t / C.duration, 1);
  U.uTime.value = t;
  U.uBase.value.set(C.path.startX + (C.path.endX - C.path.startX) * k, 0, 0);
  placeCamera(t);
  renderer.render(scene, camera);
}

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: C.duration }, 0);
tl.eventCallback("onUpdate", () => render(tl.time()));
window.__timelines[C.id] = tl;
render(0);
})();
</script>
</template>
</body>
</html>
