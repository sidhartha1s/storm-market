render:
  hyperframes_version: "0.8.185"  # pinned; managed by scripts/pin_ritual.py — do not hand-edit
  # Currency is checked at episode kickoff (owner 26 Sep 26), never by render_preflight:
  # `python3 scripts/pin_ritual.py` A/B-renders episodes/demo-pin against scripts/pin_baseline.json
  # and bumps this pin (plus every live scripts/*.cmd) only on identical metrics. History in learnings/render.md.
  # The 30s ffprobe deadline (Date.now() + 3e4, since 0.7.81) is why media_budget.py exists.
  fps: 30
  quality: standard               # "high" silently picks libx265 CPU on this box (JP measured)
  crf: 16
  gpu: true                       # --gpu --browser-gpu --experimental-fast-capture=true
  resolution: landscape           # 1920x1080

channel:
  name: The Warning Hour   # owner-locked 2026-07-22
  niche: US weather/disaster documentaries
  target_minutes: [13, 23]
  tempo: 0.94                     # ffmpeg atempo, applied to every segment by tts_episode.py — CLAUDE.md
                                   # Voice + references/script-os.md "tempo BEFORE timing": docs and minis share it,
                                   # applied BEFORE transcription (tempo, then re-transcribe the sped wav).
                                   # 0.94 keeps the delivered pace the owner set with the old voice at 1.10: the Paul
                                   # clone speaks 197 wpm native against the old voice's 168 on the same 313 words
                                   # (8 Oct 26), so 1.10 x 168 / 197 = 0.94, about 185 wpm on that passage.
  tempo_by_prefix:                 # per-lane override, matched against the episode slug's prefix
    sh-: 0.99                     # shorts — references/shorts/PLAN.md "Pace" (owner 16 Sep 26: 1.16 on the old voice, same ratio)
  voice_captions:                 # owner 20-21 Oct 26: epN documentaries caption every outside voice and allow no hold over 4 s of bed alone (lint_timeline checks 7 and 8)
    exempt: [ep-nepal-floods-2026, ep1-joplin, ep2-2011-super-outbreak, ep5-california-2018, ep6-katrina-2005]   # shipped before the rules; never extended
  cta:                            # MUST-KEEP in every episode (owner order 2026-08-30) — DESIGN.md "CTA contract"
    file: assets/cta/paul-storm-ready-v10-oct23.mp4    # md5 5873b8fc2b7c0a503a679f295c0906fc (owner 23 Oct 26 devq moore_cta=v2: v9's audio +3 dB with a -1 dBFS limiter, picture untouched, so the ad sits within 2.5 dB of a -16 dB narration; v9 was 20 Oct 26 "go v5": new Paul shots from the locked sheets, no zoom, logo over the watermark, narrator voice via Chatterbox VC; QR opens /yt/?src=qr; 1080p24); swap = NEW versioned file + bump here, never overwrite; the old file leaves assets/cta/
    duration: 24.042              # the picture stream (577 frames at 24 fps); the audio stream is trimmed to end with it
    transcript: assets/cta/paul-storm-ready-v10-oct23.txt
    voice_ref_md5: ff03c38fefe26dc0b7adb08ea165f167   # the voice reference the CTA audio was made from; sweep_episode.py fails when it differs from external.voice_ref_md5
    exempt:                       # shipped BEFORE the contract (2026-08-30) — never extended; demo-* dirs skip by having no epN prefix
      [ep1-joplin, ep2-2011-super-outbreak, ep3-tristate, ep5-california-2018, ep6-katrina-2005,
       ms-elnino-texas, ms-krakatau-sirens, ms-krakatoa-1883]   # ms-*: shipped before the news-lane window_ms (17 Sep 26), CTA at the story break
    window: [0.40, 0.60]          # CTA data-start as a fraction of total runtime (deep epN lane): around the halfway mark, between a tease and its payoff (owner 7 Oct 26). A late spot is a per-episode entry below
    window_ms: [0.85, 0.95]       # news lane ms-* (owner 17 Sep 26): AVD dropped with the 35 % CTA; a spoken bridge line runs straight into the CTA at ~90 %, no dip in
    window_by_slug:               # per-episode windows: owner placements, plus episodes shipped under an earlier lane window (one-orange rule: the lane window stays until the owner moves it)
      ep-1974-super-outbreak: [0.85, 0.92]   # owner 21 Sep 26 after the draft: "keep around 85-90 % timeline in a fitting manner"
      ep-nepal-floods-2026: [0.84, 0.92]     # owner 29 Sep 26 after draft v3 (CTA at 84.5 %): "CTA placement is fine"
      ep-enderlin-2025: [0.85, 0.95]         # shipped at the late window
    dip_in: 1.0                   # black before/after, seconds (blackout table: dramatic punctuation)
    dip_out: 1.0
    srt_label: "[PAUL RAYMOND — STORM-READY HOME · paulraymond.online]"
    first_link: https://www.paulraymond.online/yt/?src=desc   # Paul says "the first link in the description" on camera; /yt/ is the page for video viewers, ?src=desc marks the sale as coming from a description
  end_ask:                        # Paul's sign-off ask, every ep- documentary from Joplin on (owner 19 Oct 26: "CTA is looking amazing. wire them to the videos for future") — DESIGN.md "End ask"
    files:                        # mounted back to back, in this order, staged into media/end-ask/; swap = NEW versioned files + bump here, never overwrite
      - {file: assets/end-ask/paul-end-ask-v1-oct19-a.mp4, duration: 9.083}   # md5 632818e077b958f22c719d580af0b41e
      - {file: assets/end-ask/paul-end-ask-v1-oct19-b.mp4, duration: 6.417}   # md5 7cd5caf06614e5c8fe1b2418f0e8e772
    last_s: 30                    # the ask starts within the last 30 s of the episode: just before Paul's signature line and the close card
    exempt: [ep-1974-super-outbreak, ep-enderlin-2025, ep-nepal-floods-2026, ep1-joplin, ep2-2011-super-outbreak, ep3-tristate,
             ep4-el-reno, ep5-california-2018, ep6-katrina-2005, ep8-krakatau-seabed]   # shipped or built before the ask; never extended
