# storm-market config — external tools + render settings (single source of truth)

external:
  # pocket-TTS runs from JP-market's isolated venv (runtime invocation only — zero imports;
  # same isolation pattern JP/FR use). If JP-market moves, update these three paths.
  pocket_venv_python: C:\Users\Sidhartha\Automation Projects\JP-market\.venv-pocket\Scripts\python.exe
  tts_clone_py: C:\Users\Sidhartha\Automation Projects\JP-market\engine\tts_clone.py
  voice_ref: C:\Users\Sidhartha\Automation Projects\storm-market\assets\voice\pharaoh_wisdom_bearer.mp3
  # md5 2d8ea8f14763932f3f76da67d7fd1612 — verify before every produce run (JP voice-ref gotcha)

render:
  hyperframes_version: "0.8.41"  # pinned; managed by scripts/pin_ritual.py — do not hand-edit
  # Staleness is machine-enforced (owner 2026-08-14): render_preflight.py hard-blocks FULL
  # renders when npm has a newer version; the unblock is `python3 scripts/pin_ritual.py`,
  # which A/B-renders demo-joplin-90 against scripts/pin_baseline.json and bumps this pin
  # (plus every live scripts/*.cmd) only on identical metrics. Pin history in LEARNINGS.md.
  # The 30s ffprobe deadline (Date.now() + 3e4, since 0.7.81) is why media_budget.py exists.
  fps: 30
  quality: standard               # "high" silently picks libx265 CPU on this box (JP measured)
  crf: 16
  gpu: true                       # --gpu --browser-gpu --experimental-fast-capture=true
  resolution: landscape           # 1920x1080

channel:
  name: The Warning Hour   # owner-locked 2026-07-22
  niche: US weather/disaster documentaries
  target_minutes: [13, 23]
  tempo: 1.10                     # ffmpeg atempo, applied to every segment by tts_episode.py — CLAUDE.md
                                   # Voice + references/script-os.md:96-99: docs and minis both run 1.10,
                                   # applied BEFORE transcription (tempo, then re-transcribe the sped wav)
  tempo_by_prefix:                 # per-lane override, matched against the episode slug's prefix
    sh-: 1.16                     # shorts — references/shorts/PLAN.md:47,55,174 (owner 16 Sep 26)
  cta:                            # MUST-KEEP in every episode (owner order 2026-08-30) — DESIGN.md "CTA contract"
    file: assets/cta/paul-storm-ready-v5-sep6.mp4     # md5 541db438ad6e948e41286ee9fb6245fb (owner 2026-09-08 "newest paul CTA sep 6", 1440p source transcoded to 1080p30); v4c md5 34b6b40bdf772d75d4c7ebf11a0e2a80 retired — swap = NEW versioned file + bump here, never overwrite
    duration: 15.139
    transcript: assets/cta/paul-storm-ready-v5-sep6.txt
    exempt:                       # shipped BEFORE the contract (2026-08-30) — never extended; demo-* dirs skip by having no epN prefix
      [ep1-joplin, ep2-2011-super-outbreak, ep3-tristate, ep5-california-2018, ep6-katrina-2005,
       ms-elnino-texas, ms-krakatau-sirens, ms-krakatoa-1883]   # ms-*: shipped before the news-lane window_ms (17 Sep 26), CTA at the story break
    window: [0.85, 0.95]          # CTA data-start as a fraction of total runtime (deep epN lane). Owner 23 Sep 26: late by default, the 30-40 % CTA was not converting and annoyed viewers
    window_ms: [0.85, 0.95]       # news lane ms-* (owner 17 Sep 26): AVD dropped with the 35 % CTA; a spoken bridge line runs straight into the CTA at ~90 %, no dip in
    window_by_slug:               # per-episode owner placements (one-orange rule: the lane window stays until the owner moves it)
      ep-1974-super-outbreak: [0.85, 0.92]   # owner 21 Sep 26 after the draft: "keep around 85-90 % timeline in a fitting manner"
    dip_in: 1.0                   # black before/after, seconds (blackout table: dramatic punctuation)
    dip_out: 1.0
    srt_label: "[PAUL RAYMOND — STORM-READY HOME · paulraymond.online]"
    first_link: https://paulraymond.online   # Paul says "the first link in the description" on camera
