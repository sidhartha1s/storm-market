render:
  hyperframes_version: "0.7.87"   # pinned; upgrade ritual = test render, diff, bump
  # 0.7.81→0.7.87 bumped 2026-08-01 at ep4 kickoff (owner order: version check at first prompt).
  # Diff review: research/hyperframes-081-to-087.md in ep4 — deadlines/timeouts/workers/encoder
  # byte-identical; additive only (--capture-budget flag, fast-capture short-band refinement).
  # Bumped 2026-07-29 from 0.7.64 (owner order). CHECK BEFORE EVERY PRODUCTION RUN:
  #   npm view hyperframes version   -> if newer, pull and bump here before starting.
  # 0.7.81 SHORTENS the ffprobe deadline from 120s to 30s (Date.now() + 3e4). That is the
  # deadline twelve ep3 v3 renders died on, so this version is STRICTER about heavy media,
  # not more forgiving. media_budget.py is what keeps it satisfied.
  fps: 30
  quality: standard               # "high" silently picks libx265 CPU on this box (JP measured)
  crf: 16
  gpu: true                       # --gpu --browser-gpu --experimental-fast-capture=true
  resolution: landscape           # 1920x1080

channel:
  name: The Warning Hour   # owner-locked 2026-07-22
  niche: US weather/disaster documentaries
