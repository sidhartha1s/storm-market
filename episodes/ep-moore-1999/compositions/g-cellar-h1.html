<script>
window.__timelines = window.__timelines || {};
(function () {
  const $ = id => document.getElementById(id);
  const GEO = __GEO__;
  /* camera: pinhole, pitch 52 deg down, looking north; one projection for map and door */
  const PITCH = 52 * Math.PI / 180, DIST = 84, F = 1500, CX = 880, CY = 600;
  const cp = Math.cos(PITCH), sp = Math.sin(PITCH), CAM = [0, -DIST * cp, DIST * sp];
  const P = (x, y, z = 0) => {
    const v0 = x - CAM[0], v1 = y - CAM[1], v2 = z - CAM[2];
    const d = v1 * cp - v2 * sp, u = v1 * sp + v2 * cp;
    return [CX + F * v0 / d, CY - F * u / d];
  };
  const pts = a => a.map(q => P(...q).map(n => n.toFixed(1)).join(',')).join(' ');
  const dpath = a => 'M' + a.map(q => P(q[0], q[1]).map(n => n.toFixed(1)).join(',')).join('L') + 'Z';
  for (const k of Object.keys(GEO)) $('gch-c-' + k).setAttribute('d', dpath(GEO[k]));
  $('gch-glit').setAttribute('d', dpath(GEO.Grady));
  $('gch-gfill').setAttribute('d', dpath(GEO.Grady));

  /* door */
  const W = 11, L = 13, DY = -1, C = 1.4, H = 1.0, T = 0.35, NS = 6, SH = 1.25;
  const y0 = DY - L / 2, y1 = DY + L / 2, hw = W / 2, ow = hw + C;
  const hole = [[-hw, y0, H], [hw, y0, H], [hw, y1, H], [-hw, y1, H]];
  $('gch-holecp').setAttribute('points', pts(hole));
  $('gch-south').setAttribute('points', pts([[-ow, y0 - C, 0], [ow, y0 - C, 0], [ow, y0 - C, H], [-ow, y0 - C, H]]));
  const outer = [[-ow, y0 - C, H], [ow, y0 - C, H], [ow, y1 + C, H], [-ow, y1 + C, H]];
  const ring = a => 'M' + a.map(q => P(...q).map(n => n.toFixed(1)).join(',')).join('L') + 'Z';
  $('gch-ring').setAttribute('d', ring(outer) + ring(hole));
  const zb = H - (NS + 1) * SH;
  $('gch-floor').setAttribute('points', pts([[-hw, y0, zb], [hw, y0, zb], [hw, y1, zb], [-hw, y1, zb]]));
  $('gch-wallw').setAttribute('points', pts([[-hw, y0, H], [-hw, y1, H], [-hw, y1, zb], [-hw, y0, zb]]));
  $('gch-walle').setAttribute('points', pts([[hw, y0, H], [hw, y1, H], [hw, y1, zb], [hw, y0, zb]]));
  $('gch-walln').setAttribute('points', pts([[-hw, y1, H], [hw, y1, H], [hw, y1, zb], [-hw, y1, zb]]));
  const gc = P(0, y1 - 1.6, zb + 0.5), ge = P(hw * 0.9, y1 - 1.6, zb + 0.5);
  const glow = $('gch-glow'); glow.setAttribute('cx', gc[0]); glow.setAttribute('cy', gc[1]);
  glow.setAttribute('rx', (ge[0] - gc[0]) * 1.2); glow.setAttribute('ry', (ge[0] - gc[0]) * 0.55);
  const tread = L / (NS + 1), sw = hw - 0.5, NSV = 'http://www.w3.org/2000/svg';
  for (let k = NS - 1; k >= 0; k--) {             /* deepest first: nearer, higher steps paint over */
    const ya = y0 + k * tread, yb = ya + tread, zt = H - (k + 1) * SH, zr = H - k * SH;
    const tr = document.createElementNS(NSV, 'polygon');
    tr.setAttribute('points', pts([[-sw, ya, zt], [sw, ya, zt], [sw, yb, zt], [-sw, yb, zt]]));
    tr.setAttribute('fill', k % 2 ? '#2a3644' : '#33414f'); $('gch-steps').appendChild(tr);
    const rs = document.createElementNS(NSV, 'polygon');
    rs.setAttribute('points', pts([[-sw, ya, zr], [sw, ya, zr], [sw, ya, zt], [-sw, ya, zt]]));
    rs.setAttribute('fill', '#121a23'); $('gch-steps').appendChild(rs);
  }
  const s0 = P(0, y0 + 0.2, H + 0.02), s1 = P(0, y1 - 0.2, H + 0.02);
  for (const id of ['gch-seam', 'gch-seamglow']) {
    const e = $(id); e.setAttribute('x1', s0[0]); e.setAttribute('y1', s0[1]); e.setAttribute('x2', s1[0]); e.setAttribute('y2', s1[1]);
  }
  const sc = P(0, DY, 0), sx = P(ow + 1.2, DY, 0), sy = P(0, y1 + C + 0.8, 0), sz = P(0, y0 - C - 0.8, 0);
  const sh = $('gch-shadow'); sh.setAttribute('cx', sc[0]); sh.setAttribute('cy', (sy[1] + sz[1]) / 2);
  sh.setAttribute('rx', sx[0] - sc[0]); sh.setAttribute('ry', (sz[1] - sy[1]) / 2);
  /* a leaf at angle th (deg, 0 closed, 90 upright) hinged on its outer long side; s = -1 west leaf, +1 east leaf */
  const camv = (x, y, z) => [CAM[0] - x, CAM[1] - y, CAM[2] - z];
  function leaf(s, th, ids) {
    const a = th * Math.PI / 180, c = Math.cos(a), n = Math.sin(a);
    const at = (r, y, t) => [s * (hw - r * c) + s * t * n, y, H + r * n + t * c];   /* t: offset along the leaf normal */
    const ya = y0 - 0.3, yb = y1 + 0.3;
    const top = [at(0, ya, T), at(hw, ya, T), at(hw, yb, T), at(0, yb, T)];
    const normal = [s * n, 0, c];
    const v = camv(...at(hw / 2, DY, T)); const up = normal[0] * v[0] + normal[2] * v[2] > 0;
    const face = up ? top : [at(0, ya, 0), at(hw, ya, 0), at(hw, yb, 0), at(0, yb, 0)];
    $(ids[0]).setAttribute('points', pts(face));
    $(ids[0]).setAttribute('fill', up ? 'url(#gch-leafg)' : '#1f2a35');
    $(ids[1]).setAttribute('points', pts([at(hw, ya, 0), at(hw, yb, 0), at(hw, yb, T), at(hw, ya, T)]));
    const tt = up ? T + 0.02 : -0.02;
    let d = '';
    for (const f of [0.22, 0.5, 0.78]) {
      const y = ya + (yb - ya) * f, p0 = P(...at(0.5, y, tt)), p1 = P(...at(hw - 0.5, y, tt));
      d += `M${p0[0].toFixed(1)},${p0[1].toFixed(1)}L${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    }
    $(ids[2]).setAttribute('d', d);
  }
  leaf(-1, 0, ['gch-lLface', 'gch-lLedge', 'gch-lLrib']);
  leaf(1, 0, ['gch-lRface', 'gch-lRedge', 'gch-lRrib']);
  /* leader from the label to Grady's east edge */
  const gp = GEO.Grady.map(q => P(q[0], q[1])).filter(q => q[1] > 330 && q[1] < 420);
  const east = gp.reduce((m, q) => q[0] > m[0] ? q : m, [0, 0]);
  const ld = $('gch-lead'); ld.setAttribute('x1', 1184); ld.setAttribute('y1', 345); ld.setAttribute('x2', east[0] + 6); ld.setAttribute('y2', east[1]);
  const glen = Math.ceil($('gch-glit').getTotalLength()) + 1;
  const llen = Math.ceil(Math.hypot(1184 - east[0] - 6, 345 - east[1])) + 1;

  const tl = gsap.timeline({ paused: true });
  const DOOR = [880, (P(0, DY, H)[1])];
  tl.set('#gch-cam', { transformOrigin: DOOR[0] + 'px ' + DOOR[1] + 'px', scale: 1, x: 0, y: 0 }, 0);
  tl.set(['#gch-chip', '#gch-lab', '#gch-src', '#gch-lead', '#gch-glit', '#gch-gfill'], { autoAlpha: 0 }, 0);
  tl.set('#gch-glit', { strokeDasharray: glen, strokeDashoffset: glen }, 0);
  tl.set('#gch-lead', { strokeDasharray: llen, strokeDashoffset: llen }, 0);

  /* hold drift for the whole window: slow push and a slight lateral slide */
  tl.to('#gch-cam', { scale: 1.045, x: -14, duration: 4.6, ease: 'none' }, 0);
  /* the light under the door breathes */
  tl.to('#gch-seamglow', { opacity: 0.8, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0);
  tl.to('#gch-seam', { opacity: 0.55, duration: 0.9, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0);

  /* "35" @0.10 (h1-s2 "all did" = host 7.00) */
  tl.fromTo('#gch-chip', { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.10);
  tl.fromTo('#gch-src', { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 0.50);

  /* "Grady" @1.975 (h1-s3 0.88): the county outline lights, then its name */
  tl.to('#gch-glit', { autoAlpha: 1, duration: 0.15, ease: 'none' }, 1.975);
  tl.to('#gch-glit', { strokeDashoffset: 0, duration: 0.9, ease: 'power3.out' }, 1.975);
  tl.to('#gch-gfill', { autoAlpha: 1, duration: 0.6, ease: 'power2.out' }, 2.15);
  tl.to('#gch-lead', { autoAlpha: 1, duration: 0.1, ease: 'none' }, 2.2);
  tl.to('#gch-lead', { strokeDashoffset: 0, duration: 0.45, ease: 'power3.out' }, 2.2);
  tl.fromTo('#gch-lab', { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 2.4);

  /* exit: HUD text leaves before the camera moves, then the camera pushes toward the door to the cut at 5.495 */
  tl.to(['#gch-lab', '#gch-lead'], { autoAlpha: 0, y: -16, duration: 0.35, ease: 'power3.in' }, 4.3);
  tl.to('#gch-chip', { x: -760, autoAlpha: 0, duration: 0.6, ease: 'power3.in' }, 4.5);
  tl.to('#gch-src', { y: 40, autoAlpha: 0, duration: 0.5, ease: 'power3.in' }, 4.5);
  tl.to('#gch-cam', { scale: 1.36, y: -30, duration: 0.895, ease: 'power2.in' }, 4.6);

  window.__timelines['g-cellar-h1'] = tl;
})();
