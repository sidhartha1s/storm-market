<template>
<!--
  g-path-map (BASE) · ep-moore-1999 · the 3 May 1999 A9 damage path, Amber to Midwest City.
  Built from library/inhouse/master-map-us-canada.html (kept: svg camera group, haloed .lab text style,
  scan-line ambient, dark radial ground, cam-then-labels-wait-for-settle rule). The basemap is new geometry.

  GEOMETRY (projected once by a script that is not committed; paths pasted, never traced):
    - Track: NWS Norman KML media/stills/oun-19990503_overview_filled.kml, geometry index 9 (ID A9, of 60).
      Swath = the KML polygon; centre line = the mean of its two long sides (37.1 mi long).
    - Counties: US Census cb_2018_us_county_500k, Oklahoma (FIPS 40). Roads: TIGER 2018 tl_2018_40_prisecroads,
      I-44 (incl. H E Bailey Tpke), I-35, I-40, I-240. Towns: Census 2018 place polygons (cb_2018_40_place_500k)
      and Gazetteer interior points (Amber; Oklahoma City = downtown INTPT 35.4671 N 97.5137 W).
    - Projection: equirectangular, x = (lon+98) * 56.5235 mi/deg (cos 35.2), y = (35.2-lat) * 69.05 mi/deg,
      then * PPM + offset. PPM (base, camera scale 1) = 10.664 px per mile: the one figure for the whole family.
      Base frame = the six counties (Grady, McClain, Cleveland, Oklahoma, Comanche, Caddo) fitted in the
      96/54 px text-safe box. "metro" camera = Bridge Creek to Midwest City filling the frame (computed below).
  Variants copy this file and change only the CUES / labels per act.
-->
<style>
  #g-path-map-root { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); }
  .gpm-svg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .gpm-lab { font-family:Arial, sans-serif; font-weight:700; paint-order:stroke; stroke:#04070c; stroke-linejoin:round; }
  .gpm-town { font-size:22px; fill:#dfe7ee; stroke-width:5px; letter-spacing:1px; }
  .gpm-ref { fill:#93a3b2; }
  .gpm-cty { font-size:26px; fill:#93a3b2; stroke-width:5px; letter-spacing:4px; }
  .gpm-mtown { font-size:30px; fill:#f2f5f8; stroke-width:6px; letter-spacing:1px; }
  .gpm-scan { position:absolute; left:0; top:0; width:1920px; height:2px; pointer-events:none;
    background:linear-gradient(90deg, rgba(127,178,229,0), rgba(127,178,229,0.22), rgba(127,178,229,0)); }
  .gpm-vig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, rgba(3,5,7,0) 60%, rgba(3,5,7,0.55) 100%); }
  #g-path-map-tlabs text, #g-path-map-clabs text, #g-path-map-mlabs text { opacity:0; visibility:hidden; }
</style>
<div id="g-path-map-root" data-composition-id="g-path-map" data-width="1920" data-height="1080" data-duration="20"
     data-type-ok="map labels only: county names (mid) and town names (small) per brief section 5, no headline by design">
  <svg class="gpm-svg" viewBox="0 0 1920 1080">
    <defs>
      <mask id="g-path-map-swm" maskUnits="userSpaceOnUse" x="-500" y="-500" width="3000" height="2200">
        <path id="g-path-map-swmp" d="__CL_D__" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
      </mask>
    </defs>
    <g id="g-path-map-cam">
      <!-- ground: every Oklahoma county in view, low contrast; the six named counties one step lighter -->
      <path id="g-path-map-allc" d="__ALL_D__" fill="#080c11" stroke="none"/>
      <path id="g-path-map-six" d="__SIX_D__" fill="#101820" stroke="none"/>
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
        <path id="g-path-map-roads" d="__ROADS_D__" stroke="#2a3644" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <path id="g-path-map-cline" d="__ALL_D__" stroke="#4a5560" stroke-opacity="0.55" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      </g>
      <!-- A9 damage path: glow, KML swath (masked draw-on), centre line, head -->
      <path id="g-path-map-glow" d="__CL_D__" fill="none" stroke="#d0121f" stroke-opacity="0.28" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <g mask="url(#g-path-map-swm)"><path id="g-path-map-swath" d="__SWATH_D__" fill="#c0392b" fill-opacity="0.9" stroke="none"/></g>
      <path id="g-path-map-track" d="__CL_D__" fill="none" stroke="#e74c3c" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- town dots: on-track crossings (Census place polygon x track) and the two off-track interior points -->
      <g id="g-path-map-dots" fill="#f2f5f8" stroke="#04070c" stroke-width="1.5">
        <circle id="g-path-map-d-amber" cx="957.8" cy="470.6" r="5"/>
        <circle id="g-path-map-d-bc" cx="1031.6" cy="437.5" r="5"/>
        <circle id="g-path-map-d-nc" cx="1115.2" cy="387.6" r="5"/>
        <circle id="g-path-map-d-moore" cx="1189.5" cy="324.5" r="5"/>
        <circle id="g-path-map-d-del" cx="1232.5" cy="274.6" r="5"/>
        <circle id="g-path-map-d-mwc" cx="1263.7" cy="250.8" r="5"/>
        <circle id="g-path-map-d-okc" cx="1179.9" cy="244.6" r="5" fill="#93a3b2"/>
      </g>
      <circle id="g-path-map-ring" cx="951.2" cy="494.7" r="7" fill="none" stroke="#e74c3c" stroke-width="2.5"/>
      <circle id="g-path-map-head" cx="951.2" cy="494.7" r="6.5" fill="#f2f5f8" stroke="#d0121f" stroke-width="3"/>
      <!-- base-frame labels (ride the world; fade out before the push) -->
      <g id="g-path-map-clabs">
        <text id="g-path-map-c-grady" class="gpm-lab gpm-cty" x="905" y="590" text-anchor="middle">Grady County</text>
        <text id="g-path-map-c-mcclain" class="gpm-lab gpm-cty" x="1183" y="608" text-anchor="middle">McClain County</text>
        <text id="g-path-map-c-cleveland" class="gpm-lab gpm-cty" x="1352" y="430" text-anchor="middle">Cleveland County</text>
        <text id="g-path-map-c-oklahoma" class="gpm-lab gpm-cty" x="1244" y="168" text-anchor="middle">Oklahoma County</text>
        <text id="g-path-map-c-comanche" class="gpm-lab gpm-cty" x="633" y="854" text-anchor="middle">Comanche County</text>
        <text id="g-path-map-c-caddo" class="gpm-lab gpm-cty" x="672" y="545" text-anchor="middle">Caddo County</text>
      </g>
      <g id="g-path-map-tlabs">
        <text id="g-path-map-t-amber" class="gpm-lab gpm-town" x="944" y="466" text-anchor="end">Amber</text>
        <text id="g-path-map-t-bc" class="gpm-lab gpm-town" x="1018" y="422" text-anchor="end">Bridge Creek</text>
        <text id="g-path-map-t-nc" class="gpm-lab gpm-town" x="1102" y="372" text-anchor="end">Newcastle</text>
        <text id="g-path-map-t-moore" class="gpm-lab gpm-town" x="1205" y="342">Moore</text>
        <text id="g-path-map-t-del" class="gpm-lab gpm-town" x="1248" y="292">Del City</text>
        <text id="g-path-map-t-mwc" class="gpm-lab gpm-town" x="1278" y="252">Midwest City</text>
        <text id="g-path-map-t-okc" class="gpm-lab gpm-town gpm-ref" x="1166" y="240" text-anchor="end">Oklahoma City</text>
      </g>
    </g>
    <!-- metro labels: fixed HUD layer, placed at the metro camera's projection of each dot (computed in script) -->
    <g id="g-path-map-mlabs">
      <text id="g-path-map-m-amber" class="gpm-lab gpm-mtown" text-anchor="end" data-for="amber" data-dx="-24" data-dy="10">Amber</text>
      <text id="g-path-map-m-bc" class="gpm-lab gpm-mtown" text-anchor="end" data-for="bc" data-dx="-22" data-dy="-16">Bridge Creek</text>
      <text id="g-path-map-m-nc" class="gpm-lab gpm-mtown" text-anchor="end" data-for="nc" data-dx="-22" data-dy="-18">Newcastle</text>
      <text id="g-path-map-m-moore" class="gpm-lab gpm-mtown" data-for="moore" data-dx="26" data-dy="30">Moore</text>
      <text id="g-path-map-m-del" class="gpm-lab gpm-mtown" data-for="del" data-dx="26" data-dy="32">Del City</text>
      <text id="g-path-map-m-mwc" class="gpm-lab gpm-mtown" data-for="mwc" data-dx="26" data-dy="10">Midwest City</text>
      <text id="g-path-map-m-okc" class="gpm-lab gpm-mtown gpm-ref" text-anchor="end" data-for="okc" data-dx="-22" data-dy="10">Oklahoma City</text>
    </g>
  </svg>
  <div class="gpm-vig" id="g-path-map-vig"></div>
  <div class="gpm-scan" id="g-path-map-scan"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-path-map", P = "#g-path-map-";
  const $ = s => document.querySelector(P + s);
  const DUR = 20;
  /* base demo cues (no narration yet; act variants re-anchor these to their words.json) */
  const CUES = { counties: 0.3, draw: 1.6, drawDur: 8.0, labelsOut: 11.2, push: 11.8, pushDur: 3.0, metro: 15.0 };

  /* log-space zoom (helpers.js logLerpScale), driven as a real scale tween so seeks in any order land exactly */
  function logLerpScale(a, b, t) { return Math.exp(Math.log(a) + (Math.log(b) - Math.log(a)) * t); }
  const easeIO = gsap.parseEase("power2.inOut");

  const trk = $("track"), L = trk.getTotalLength(), DASH = Math.ceil(L) + 1;
  const ptAt = f => trk.getPointAtLength(L * f);
  /* along-track fraction of the point nearest each dot (labels pop as the head passes) */
  const nearestFrac = (x, y) => { let best = 0, bd = 1e9; for (let i = 0; i <= 800; i++) { const p = ptAt(i / 800), d = Math.hypot(p.x - x, p.y - y); if (d < bd) { bd = d; best = i / 800; } } return best; };
  const TOWNS = ["amber", "bc", "nc", "moore", "del", "mwc", "okc"];
  const dot = {}; TOWNS.forEach(k => { const c = $("d-" + k); dot[k] = { x: +c.getAttribute("cx"), y: +c.getAttribute("cy") }; dot[k].f = nearestFrac(dot[k].x, dot[k].y); });

  /* metro camera: Bridge Creek to Midwest City (dots + track end) fitted in the text-safe box, kept clear of the presenter corner */
  const end = ptAt(1), keys = ["bc", "nc", "moore", "del", "mwc", "okc"];
  const xs = keys.map(k => dot[k].x).concat(end.x), ys = keys.map(k => dot[k].y).concat(end.y);
  const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
  const S = Math.min((1920 - 2 * 330) / (bx1 - bx0), (1080 - 2 * 170) / (by1 - by0));
  const cx = (bx0 + bx1) / 2, cy = (by0 + by1) / 2;
  const tx = 960 - cx * S, ty = 520 - cy * S;           /* metro: screen = S * world + t */
  const FX = tx / (1 - S), FY = ty / (1 - S);            /* fixed point: the push is a pure zoom about it */
  window.__gpm = { L, DASH, S, FX, FY, PPM: 10.664, dot };

  /* metro HUD labels at the metro projection of their dot */
  document.querySelectorAll(P + "mlabs text").forEach(t => {
    const d = dot[t.dataset.for];
    t.setAttribute("x", (S * d.x + tx + +t.dataset.dx).toFixed(1));
    t.setAttribute("y", (S * d.y + ty + +t.dataset.dy).toFixed(1));
  });

  const tl = gsap.timeline({ paused: true });
  tl.set(P + "cam", { svgOrigin: FX.toFixed(2) + " " + FY.toFixed(2), scale: 1 }, 0);
  tl.set([P + "track", P + "glow", P + "swmp"], { strokeDasharray: DASH, strokeDashoffset: DASH }, 0);
  tl.set([P + "head", P + "ring"], { autoAlpha: 0, attr: { cx: ptAt(0).x, cy: ptAt(0).y } }, 0);
  tl.set(P + "dots circle", { autoAlpha: 0 }, 0);
  tl.set(P + "clabs text, " + P + "tlabs text, " + P + "mlabs text", { autoAlpha: 0 }, 0);

  /* ambient: scan line the whole window, slow ground breathe */
  tl.fromTo(P + "scan", { y: 30 }, { y: 1050, duration: 9.8, ease: "none", repeat: 1, yoyo: true }, 0);
  tl.fromTo(P + "six", { attr: { "fill-opacity": 0.85 } }, { attr: { "fill-opacity": 1 }, duration: 2.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);

  /* counties name themselves */
  ["grady", "mcclain", "cleveland", "oklahoma", "comanche", "caddo"].forEach((c, i) =>
    tl.fromTo(P + "c-" + c, { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUES.counties + i * 0.15));

  /* draw-on: track, glow and swath mask share one clock; the head rides the same clock */
  [P + "track", P + "glow", P + "swmp"].forEach(s =>
    tl.fromTo(s, { strokeDashoffset: DASH }, { strokeDashoffset: DASH - L, duration: CUES.drawDur, ease: "none" }, CUES.draw));
  tl.fromTo([P + "head", P + "ring"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, CUES.draw - 0.2);
  const hp = { f: 0 };
  tl.fromTo(hp, { f: 0 }, { f: 1, duration: CUES.drawDur, ease: "none",
    onUpdate: () => { const p = ptAt(hp.f); gsap.set([P + "head", P + "ring"], { attr: { cx: p.x, cy: p.y } }); } }, CUES.draw);
  tl.fromTo(P + "ring", { attr: { r: 7 }, opacity: 0.9 }, { attr: { r: 22 }, opacity: 0, duration: 1.1, ease: "power2.out", repeat: 16, repeatDelay: 0.05 }, CUES.draw);

  /* towns pop as the head passes each (Amber at the touchdown, OKC when the head is nearest downtown) */
  TOWNS.forEach(k => {
    const at = CUES.draw + CUES.drawDur * dot[k].f;
    tl.fromTo(P + "d-" + k, { autoAlpha: 0, attr: { r: 0 } }, { autoAlpha: 1, attr: { r: 5 }, duration: 0.35, ease: "back.out(3)" }, at);
    tl.fromTo(P + "t-" + k, { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, at + 0.05);
  });

  /* push to metro: base labels leave first, camera zooms in log space, metro labels wait for the settle */
  tl.to(P + "clabs text, " + P + "tlabs text", { autoAlpha: 0, y: -8, duration: 0.45, ease: "power2.in" }, CUES.labelsOut);
  tl.fromTo(P + "cam", { scale: 1 }, { scale: S, duration: CUES.pushDur,
    ease: p => (logLerpScale(1, S, easeIO(p)) - 1) / (S - 1) }, CUES.push);
  /* world strokes and dots thin as the camera grows them, so 1080p weight stays constant */
  tl.fromTo(P + "track", { attr: { "stroke-width": 4.5 } }, { attr: { "stroke-width": 5 / S }, duration: CUES.pushDur, ease: "power2.inOut" }, CUES.push);
  tl.fromTo(P + "glow", { attr: { "stroke-width": 13 } }, { attr: { "stroke-width": 16 / S }, duration: CUES.pushDur, ease: "power2.inOut" }, CUES.push);
  tl.fromTo(P + "dots circle", { attr: { r: 5, "stroke-width": 1.5 } }, { attr: { r: 9 / S, "stroke-width": 2 / S }, duration: CUES.pushDur, ease: "power2.inOut" }, CUES.push);
  tl.fromTo(P + "head", { attr: { r: 6.5, "stroke-width": 3 } }, { attr: { r: 10 / S, "stroke-width": 4 / S }, duration: CUES.pushDur, ease: "power2.inOut" }, CUES.push);
  tl.set(P + "ring", { autoAlpha: 0 }, CUES.push);
  ["bc", "nc", "moore", "okc", "del", "mwc", "amber"].forEach((k, i) =>
    tl.fromTo(P + "m-" + k, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUES.metro + i * 0.18));
  /* metro hold: the head keeps a pulse at the end of the path */
  tl.fromTo(P + "head", { scale: 1, svgOrigin: end.x.toFixed(2) + " " + end.y.toFixed(2) }, { scale: 1.35, duration: 0.8, ease: "sine.inOut", repeat: 5, yoyo: true }, CUES.metro);
  tl.to({}, { duration: DUR }, 0);

  window.__timelines[ID] = tl;
})();
</script>
</template>
