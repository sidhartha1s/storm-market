<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  Format C status board (B2 "where things stand", Kauai one week after Lowell): five rows landing on spoken cues.
  Same glass recipe as the Indonesia status board. Host = b2-s1 start + 3.0. Cues rel. b2-s1: KIUC 6.7, 33,000 14.84,
  76% 20.78, 81 24.26, schools 36.88, Red Cross 46.68, federal 49.86, Lanai 55.2.
-->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; }
  .card { position:absolute; left:110px; top:130px; width:980px; box-sizing:border-box; padding:30px 40px 26px;
    background:rgba(10,16,24,0.60); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#d0121f; }
  .big { white-space:nowrap; font-family:'AbrilFig',Georgia,serif; font-size:56px; line-height:1; color:#f2f5f8; margin-top:8px; text-shadow:0 3px 14px rgba(0,0,0,0.8); }
  .sub0 { font-size:20px; color:#c8d3e0; margin-top:6px; letter-spacing:1px; }
  .row { display:flex; align-items:center; gap:18px; margin-top:18px; overflow:hidden; }
  .name { flex:0 0 300px; font-family:'Arial Black',Arial,sans-serif; font-size:32px; line-height:1.1; }
  .pill { flex:0 0 190px; text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:1px; padding:8px 0; border-radius:10px; }
  .ok { background:#2f8f5b; color:#fff; } .warn { background:#d8a13a; color:#1a1408; } .bad { background:#d0121f; color:#fff; }
  .today { font-size:23px; color:#e6ecf2; line-height:1.2; }
  .bar { position:absolute; left:40px; right:40px; bottom:14px; height:4px; background:linear-gradient(90deg,#d0121f,#2f8f5b); border-radius:2px; transform-origin:left; }
</style>
<div id="root" data-composition-id="recoveryboard" data-width="1920" data-height="1080">
  <div class="card" id="rb-card">
    <div class="eye" id="rb-eye">AS OF MONDAY MORNING · 14 SEP 26 · HAWAII TIME</div>
    <div class="big" id="rb-big">81% RESTORED · 8,000 STILL OUT</div>
    <div class="sub0">One week after Hurricane Lowell · KIUC, Kauai County, Hawaii EMA</div>
    <div class="row" id="rb-r1"><div class="name">POWER</div><div class="pill warn">81%</div><div class="today">33,000 of 36,000 lost it at the peak · 76% Saturday</div></div>
    <div class="row" id="rb-r2"><div class="name">SCHOOLS</div><div class="pill warn">2 CLOSED</div><div class="today">Kilauea and Hanalei elementary, no utilities</div></div>
    <div class="row" id="rb-r3"><div class="name">SHELTERS</div><div class="pill warn">3 OPEN</div><div class="today">Red Cross, residents who cannot go home yet</div></div>
    <div class="row" id="rb-r4"><div class="name">FEDERAL AID</div><div class="pill bad">PENDING</div><div class="today">Major Disaster Declaration requested, not approved</div></div>
    <div class="row" id="rb-r5"><div class="name">LANAI HARBOR</div><div class="pill warn">LIMITED</div><div class="today">Kaumalapau running again at limited capacity</div></div>
    <div class="bar" id="rb-bar"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#rb-";
  const rows = [P+"r1",P+"r2",P+"r3",P+"r4",P+"r5"];
  tl.set(rows, {autoAlpha:0, height:0, marginTop:0}, 0);
  tl.fromTo(P+"card", {x:-980, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.6, ease:"power3.out"}, 0);
  tl.fromTo(P+"big", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 0.5);
  const AT = [11.84, 33.88, 43.68, 46.86, 52.2]; /* cues − 3.0: 33,000 14.84 · schools 36.88 · Red Cross 46.68 · federal 49.86 · Lanai 55.2 */
  rows.forEach((r, i) => tl.fromTo(r, {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:18, duration:0.45, ease:"power3.out"}, AT[i]));
  tl.fromTo(P+"card", {y:0}, {y:-6, duration:1.4, ease:"sine.inOut", yoyo:true, repeat:39}, 0.6);
  tl.fromTo(P+"bar", {scaleX:0}, {scaleX:1, duration:55.8, ease:"none"}, 0.6);
  tl.to(".pill", {boxShadow:"0 0 18px rgba(255,255,255,0.45)", duration:0.9, yoyo:true, repeat:61, ease:"sine.inOut"}, 0.6);
  tl.to(P+"eye", {letterSpacing:"8px", duration:1.2, ease:"power3.out"}, 0.2);
  tl.to(P+"card", {x:-980, autoAlpha:0, duration:0.5, ease:"power3.in"}, 56.7); /* host 57.3 − 0.6 */
  window.__timelines["recoveryboard"] = tl;
})();
</script>
</template>
</body>
</html>
