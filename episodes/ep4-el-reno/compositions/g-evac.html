<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); font-family:Arial,sans-serif; }

  .map { position:absolute; left:400px; top:190px; width:1120px; height:700px; }
  .road { position:absolute; background:#2a3644; transform-origin:left center; }
  #g-evac-i35 { left:540px; top:0; width:14px; height:700px; }
  #g-evac-i40 { left:0; top:340px; width:1120px; height:14px; }
  #g-evac-i44 { left:120px; top:0; width:14px; height:700px; transform:rotate(18deg); }
  .roadlab { position:absolute; font-size:22px; color:#7fb2e5; font-weight:700; letter-spacing:2px; }
  #g-evac-lab35 { left:566px; top:8px; }
  #g-evac-lab40 { left:20px; top:352px; }
  #g-evac-lab44 { left:60px; top:640px; }
  .okc { position:absolute; left:518px; top:326px; width:60px; height:42px; background:#c0392b; }
  .okclab { position:absolute; left:518px; top:372px; font-size:20px; color:#dfe7ee; font-weight:700; letter-spacing:2px; }
  .pulse { position:absolute; width:60px; height:60px; border-radius:50%; background:#c0392b; opacity:0; }
  .card { position:absolute; left:0; right:0; bottom:110px; text-align:center; }
  .p1 { font-family:'Arial Black',Arial,sans-serif; font-size:50px; color:#f2f5f8; letter-spacing:1px; }
  .p2 { font-family:Georgia,serif; font-style:italic; font-size:28px; color:#d8a13a; margin-top:14px; }
</style>
<div id="root" data-composition-id="g-evac" data-width="1920" data-height="1080">
  <div class="hdr" id="g-evac-hdr">OKLAHOMA CITY METRO · EVACUATION SCHEMATIC</div>
  <div class="map" id="g-evac-map">
    <div class="road" id="g-evac-i40"></div>
    <div class="road" id="g-evac-i35"></div>
    <div class="road" id="g-evac-i44"></div>
    <div class="roadlab" id="g-evac-lab35">I-35</div>
    <div class="roadlab" id="g-evac-lab40">I-40</div>
    <div class="roadlab" id="g-evac-lab44">I-44</div>
    <div class="okc" id="g-evac-okc"></div>
    <div class="okclab" id="g-evac-okclab">OKLAHOMA CITY</div>
    <div class="pulse" id="g-evac-p1" style="left:534px; top:330px;"></div>
    <div class="pulse" id="g-evac-p2" style="left:520px; top:460px;"></div>
    <div class="pulse" id="g-evac-p3" style="left:500px; top:590px;"></div>
    <div class="pulse" id="g-evac-p4" style="left:290px; top:520px;"></div>
    <div class="pulse" id="g-evac-p5" style="left:230px; top:400px;"></div>
  </div>
  <div class="card" id="g-evac-card">
    <div class="p1" id="g-evac-p1txt">LARGEST TORNADO EVACUATION EVER MEASURED</div>
    <div class="p2" id="g-evac-p2txt">six US metros studied, 2011–2018</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-evac-hdr","#g-evac-map"], {autoAlpha:0}, 0);
  tl.set(["#g-evac-i35","#g-evac-i40","#g-evac-i44"], {scaleX:0}, 0);
  tl.set(["#g-evac-okc","#g-evac-okclab"], {autoAlpha:0}, 0);
  tl.set(["#g-evac-p1","#g-evac-p2","#g-evac-p3","#g-evac-p4","#g-evac-p5"], {autoAlpha:0, scale:0.3}, 0);
  tl.set(["#g-evac-card"], {autoAlpha:0}, 0);
  /* cued to audio/a4-s3.words.json: "researchers@1.66 studied@1.96 vehicle@2.52 movement@2.90 across@3.38 six@3.70
     American@4.04 metro@4.50 areas@4.86 hit@5.34" builds the schematic; the stat card lands after the buildup on
     "largest@11.90 tornado@12.32 evacuation@12.84 ever@13.62 measured@14.46 in@14.84 an@15.12 American@15.24 city.@15.64" */
  tl.fromTo("#g-evac-hdr", {autoAlpha:0, y:-16}, {autoAlpha:1, y:0, duration:0.5}, 0.6);
  tl.fromTo("#g-evac-map", {autoAlpha:0}, {autoAlpha:1, duration:0.3}, 1.7);
  tl.fromTo("#g-evac-i40", {scaleX:0}, {scaleX:1, duration:0.7, ease:"power2.out"}, 2.0);
  tl.fromTo("#g-evac-i35", {scaleY:0}, {scaleY:1, duration:0.7, ease:"power2.out"}, 2.5);
  tl.fromTo("#g-evac-i44", {scaleY:0}, {scaleY:1, duration:0.7, ease:"power2.out"}, 3.0);
  tl.fromTo(["#g-evac-okc","#g-evac-okclab"], {autoAlpha:0, scale:1.4}, {autoAlpha:1, scale:1, duration:0.4}, 4.5);
  const pulses = ["#g-evac-p1","#g-evac-p2","#g-evac-p3","#g-evac-p4","#g-evac-p5"];
  pulses.forEach((sel, i) => {
    tl.fromTo(sel, {autoAlpha:0.7, scale:0.3}, {autoAlpha:0, scale:2.6, duration:1.6, ease:"power1.out"}, 5.6 + i*1.0);
  });
  tl.to("#g-evac-map", {opacity:0.5, duration:0.6}, 11.6);
  tl.fromTo("#g-evac-card", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.6}, 12.0);
  /* continuous element for the remainder of the window: pulses keep rippling from OKC through to the cut */
  pulses.forEach((sel, i) => {
    tl.fromTo(sel, {autoAlpha:0.6, scale:0.3}, {autoAlpha:0, scale:2.8, duration:2.4, ease:"power1.out", repeat:6, repeatDelay:1.2}, 13.0 + i*0.8);
  });
  tl.to("#g-evac-card", {autoAlpha:0, y:-20, duration:0.6, ease:"power3.in"}, 35.9);
  tl.to("#g-evac-map", {autoAlpha:0, duration:0.6, ease:"power3.in"}, 35.9);
  window.__timelines["g-evac"] = tl;
})();
</script>
</template>
