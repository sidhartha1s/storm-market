<script>

(function () {
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("i6-grid");
  function ln(x1, y1, x2, y2, stroke, w) {
    const e = document.createElementNS(NS, "line");
    e.setAttribute("x1", x1); e.setAttribute("y1", y1); e.setAttribute("x2", x2); e.setAttribute("y2", y2);
    e.setAttribute("stroke", stroke); e.setAttribute("stroke-width", w); grid.appendChild(e);
  }
  /* half-mile field lines (260 px), faint; the mile lines are drawn above */
  [180, 440, 973].forEach(function (x) { ln(x, 0, x, 1080, "#16212c", 1.5); });  /* mile and half-mile west of US-81; midway US-81 to Alfadale */
  ln(1503.4, 345, 1503.4, 1080, "#16212c", 1.5);  /* midway Alfadale to Radio, starts below Reuter Road so it never runs through the crew tag */
  for (let y = 330 - 520 + 260; y < 1080; y += 260) ln(0, y, 1920, y, "#16212c", 1.5);

  const tl = gsap.timeline({ paused: true });
  const P = "#i6-";
  function show(id, at, vars) { tl.fromTo(P + id, Object.assign({ autoAlpha: 0 }, vars || {}), { autoAlpha: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at); }

  tl.fromTo(P + "sweep", { x: -560 }, { x: 1920, duration: 8.45, ease: "none", repeat: 1 }, 0);

  /* Not @0.00: the two roads draw, labels follow */
  tl.to(P + "r81", { strokeDashoffset: 0, duration: 1.1, ease: "power2.out" }, 0.0);
  tl.to(P + "rre", { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 0.15);
  show("eb", 0.2, { x: -30 });

  /* Two (of the vehicles) @2.86: marker 1 on US-81, heading south */
  tl.set(P + "m1", { x: 700, y: 420 }, 0);
  tl.fromTo(P + "m1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 2.86);
  tl.fromTo(P + "m1r", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 2.86);
  tl.to(P + "m1", { y: 760, duration: 11.5, ease: "none" }, 2.88);
  tl.fromTo(P + "m1p", { attr: { r: 12 }, opacity: 0.9 }, { attr: { r: 26 }, opacity: 0, duration: 1.4, ease: "power1.out", repeat: 9 }, 2.9);
  /* vehicles @3.18: marker 2 on Reuter Road, heading east */
  tl.set(P + "m2", { x: 1290, y: 330 }, 0);
  tl.fromTo(P + "m2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 3.18);
  tl.to(P + "m2", { x: 1500, duration: 13.6, ease: "none" }, 3.2);
  tl.fromTo(P + "m2p", { attr: { r: 12 }, opacity: 0.9 }, { attr: { r: 26 }, opacity: 0, duration: 1.4, ease: "power1.out", repeat: 9 }, 3.3);

  /* crews @6.28 */

  /* three (people in each) @7.24 */

  /* Weather (Channel SUV) @9.66: tag 1 names the vehicle */

  tl.fromTo(P + "t1b", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 9.66);
  /* Mike @12.16 */
  show("name", 12.16, { x: -40 });
  show("sub", 12.5, { x: -30 });  /* Betts @12.52 */

  /* threw @14.38: the marker is carried east, the measure draws; 200 @15.06 */
  tl.to(P + "m1", { x: 759.1, duration: 0.5, ease: "power3.out" }, 14.38);
  tl.to(P + "m1r", { rotation: 100, transformOrigin: "50% 50%", duration: 0.5, ease: "power3.out" }, 14.38);

  tl.fromTo(P + "yd", { scale: 1 }, { scale: 1.04, duration: 1.2, ease: "sine.inOut", transformOrigin: "0% 50%" }, 15.6);
