<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); font-family:Arial,sans-serif; }
  .stage { position:absolute; inset:0; display:grid; place-items:center; }
  .stack { text-align:center; }
  .eyebrow { font-size:20px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .l1 { font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:40px; color:#c0392b; letter-spacing:8px; margin-top:14px; }
  .l2 { font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:56px; color:#f2f5f8; letter-spacing:6px; margin-top:14px; }
  .main { font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:104px; color:#f2f5f8; letter-spacing:1px; line-height:1.06; margin-top:38px; }
  .sub { font-family:Georgia,serif; font-style:italic; font-size:30px; color:#d8a13a; margin-top:26px; letter-spacing:1px; }
</style>
<div id="root" data-composition-id="g-title" data-width="1920" data-height="1080">
  <div class="stage">
    <div class="stack">
      <div class="eyebrow" id="g-title-eyebrow">THE WARNING HOUR</div>
      <div class="l1" id="g-title-l1">EL RENO, OKLAHOMA</div>
      <div class="l2" id="g-title-l2">MAY 31, 2013</div>
      <div class="main" id="g-title-main"><div>THE WIDEST TORNADO</div><div>EVER RECORDED</div></div>
      <div class="sub" id="g-title-sub">2.6 miles wide, edge to edge · The Warning Hour</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-title-eyebrow","#g-title-l1","#g-title-l2","#g-title-main","#g-title-sub"], {autoAlpha:0}, 0);
  /* over cold-open insert audio (no per-word cues — insert clip, not narration); punctuated to land inside its
     8s window with match-cut energy on the reveal of "EVER RECORDED" */
  tl.fromTo("#g-title-eyebrow", {autoAlpha:0}, {autoAlpha:1, duration:0.3}, 0.0);
  tl.fromTo("#g-title-l1", {autoAlpha:0, scale:1.6}, {autoAlpha:1, scale:1, duration:0.3, ease:"power4.in"}, 0.3);
  tl.fromTo("#g-title-l2", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out"}, 1.6);
  tl.fromTo("#g-title-main", {autoAlpha:0, scale:1.18}, {autoAlpha:1, scale:1, duration:0.6, ease:"power2.out"}, 3.1);
  tl.fromTo("#g-title-sub", {autoAlpha:0}, {autoAlpha:1, duration:0.5}, 4.6);
  /* continuous element for the whole 16s window: slow scale drift on the title block, ease:none */
  tl.fromTo(".stack", {scale:1}, {scale:1.04, duration:16, ease:"none"}, 0);
  tl.to(".stack", {autoAlpha:0, duration:0.7}, 7.1);
  window.__timelines["g-title"] = tl;
})();
</script>
</template>
</body>
</html>
