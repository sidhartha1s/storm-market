<script>
window.__timelines = window.__timelines || {};
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("s1-grid");
  function ln(x1, y1, x2, y2, stroke, w) {
    const e = document.createElementNS(NS, "line");
    e.setAttribute("x1", x1); e.setAttribute("y1", y1); e.setAttribute("x2", x2); e.setAttribute("y2", y2);
    e.setAttribute("stroke", stroke); e.setAttribute("stroke-width", w); grid.appendChild(e);
  }
  /* section lines every mile (300 px) west of US-81 and south of Reno Road; half-mile field lines, faint */
  ln(460, 0, 460, 1080, "#34434f", 2); ln(160, 0, 160, 1080, "#34434f", 2); ln(0, 30, 1920, 30, "#34434f", 2); ln(0, 930, 1920, 930, "#34434f", 2);
  [10, 310, 610, 917.5, 1223.5, 1522, 1822].forEach(function (x) { ln(x, 0, x, 1080, "#16212c", 1.5); });
  for (let y = 180; y < 1080; y += 300) ln(0, y, 1920, y, "#16212c", 1.5);

  const tl = gsap.timeline({ paused: true });
  const P = "#s1-";
  function show(id, at, vars) { tl.fromTo(P + id, Object.assign({ autoAlpha: 0 }, vars || {}), { autoAlpha: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at); }
  gsap.set(P + "panel", { x: 820 });
  tl.fromTo(P + "sweep", { x: -560 }, { x: 1920, duration: 6.6, ease: "none", repeat: 2 }, 0);
  tl.fromTo(P + "halo", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 130, duration: 19.7, ease: "none" }, 0);

  /* The @0.00: the ring comes in from the west; 6 (.19) @3.42: its centre is on US-81 near Reno Road by 4.4 */
  tl.fromTo(P + "ring", { x: 40, y: 630 }, { x: 760, y: 630, duration: 4.4, ease: "power1.out" }, 0);
  tl.to(P + "ring", { x: 820, y: 622, duration: 15.3, ease: "none" }, 4.4);
  tl.fromTo(P + "time", { autoAlpha: 0, scale: 1.5, transformOrigin: "0% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 3.42);
  show("tsub", 3.9, { x: -30 });
  tl.fromTo(P + "ctr", { attr: { r: 7 } }, { attr: { r: 15 }, duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, 4.3);

  /* Weather (Channel SUV) @5.60: its mark on US-81, inside the ring's north edge */
  tl.set(P + "m", { x: 760, y: 252 }, 0);
  tl.fromTo(P + "m", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 5.6);
  tl.fromTo(P + "mr", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2.4)" }, 5.6);
  tl.fromTo(P + "mp", { attr: { r: 14 }, opacity: 0.9 }, { attr: { r: 60 }, opacity: 0, duration: 1.4, ease: "power1.out", repeat: 9 }, 5.7);
  /* heading @8.12, south @8.36: it moves south */
  tl.to(P + "m", { y: 300, duration: 2.5, ease: "none" }, 5.62);
  tl.to(P + "m", { y: 560, duration: 11.4, ease: "none" }, 8.12);

  /* Mike @9.50 · Austin @11.00, driving @11.72 · Brad @12.72, camera @13.70 */
  tl.fromTo(P + "panel", { x: 820 }, { x: 0, duration: 0.7, ease: "power3.out" }, 8.7);
  show("eb", 9.2, { x: 40 });
  show("n1", 9.5, { x: 60 });
  show("r1", 9.9, { x: 40 });
  show("n2", 11.0, { x: 60 });
  show("r2", 11.72, { x: 40 });
  show("n3", 12.72, { x: 60 });
  show("r3", 13.58, { x: 40 });

  /* they (were trying to get through) @16.26: the way south draws; south (side) @18.22 */
  tl.fromTo(P + "way", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 16.26);
  tl.fromTo(P + "wayl", { strokeDashoffset: 0 }, { strokeDashoffset: -104, duration: 3.3, ease: "none" }, 16.26);
  tl.fromTo(P + "south", { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 18.22);

  window.__timelines["g-a3s1-roads"] = tl;
})();
