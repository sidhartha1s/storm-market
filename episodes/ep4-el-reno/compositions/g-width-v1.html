                P+"rk2",P+"nm2",P+"sb2",P+"rl2",P+"n2",P+"u2",
                P+"rk3",P+"nm3",P+"sb3",P+"rl3",P+"n3",P+"u3",
                P+"tk0",P+"tk1",P+"tk2",P+"tk3",P+"tk4",P+"tk5",P+"tk6",P+"kicker",P+"foot",P+"src"];
  tl.set(HIDE, {autoAlpha:0}, 0);
  tl.set([P+"rail1",P+"rail2",P+"rail3",P+"bar1",P+"bar2",P+"bar3",P+"axis"], {scaleX:0}, 0);

    tl.to(obj, {v:val, duration:dur, ease:ease||"power3.out", onUpdate:function(){
      const e = document.getElementById(id); if (e) e.textContent = obj.v.toFixed(1); }}, at);
  }
  const V1 = {v:0}, V2 = {v:0}, V3 = {v:0};
  /* CONTINUOUS: the ruler grid drifts for the whole window */
  tl.to(P+"grid", {x:-260, duration:47.0, ease:"none"}, 0.2);

  /* masthead — "Watch what happens in the sixteen minutes after touchdown" 0.0–2.5 */
  tl.fromTo(P+"eb",     {autoAlpha:0, x:-34}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"hl",     {autoAlpha:0, y:-26}, {autoAlpha:1, y:0, duration:0.55, ease:"power3.out"}, 0.55);
  tl.fromTo(P+"topsub", {autoAlpha:0, x:-28}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 1.10);
  tl.fromTo(P+"rlabel", {autoAlpha:0, y:-18}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 1.60);
  tl.fromTo(P+"stamp",  {autoAlpha:0, scale:1.5}, {autoAlpha:1, scale:1, duration:0.36, ease:"power4.in"}, 2.00);
  tl.fromTo(P+"rsub",   {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 2.50);
  /* axis + ticks land under "At 6:03" 3.7 */

  tl.fromTo([P+"tk0",P+"tk1",P+"tk2",P+"tk3",P+"tk4",P+"tk5",P+"tk6"], {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out", stagger:0.09}, 3.3);

  /* ---- EL RENO row: "At 6:03, the tornado is a few hundred yards across. Ordinary." ---- */

  tl.fromTo(P+"nm1",   {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.45, ease:"power3.out"}, 4.1);

  tl.fromTo(P+"clock", {autoAlpha:0, y:10}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 4.6);

  ctr("gw1-n1", V1, 0.2, 6.1, 0.9);

  /* "Half a mile wide" 14.3 · "Then a full mile" 16.6 · "Then two" 18.3 */
  tl.to(P+"bar1", {scaleX:0.5/2.6, duration:0.7, ease:"power2.out"}, 14.3);  ctr("gw1-n1", V1, 0.5, 14.3, 0.7, "power2.out");

  tl.fromTo(P+"pulse1", {autoAlpha:0, scaleY:1}, {autoAlpha:0.85, scaleY:1.28, duration:0.85, ease:"sine.inOut", yoyo:true, repeat:3}, 25.4);
  tl.to(P+"n1", {scale:1.14, duration:0.55, ease:"power3.out", yoyo:true, repeat:1}, 25.6);

  /* ---- MANHATTAN row: "Edge to edge, that is wider than the island of Manhattan" 25.9–29.4 ---- */
  tl.fromTo(P+"rk2",   {autoAlpha:0, scale:1.9}, {autoAlpha:1, scale:1, duration:0.32, ease:"power4.in"}, 28.0);

  /* ---- HALLAM row: "The old record, set in Nebraska nine years earlier, was gone." 38.7–42.5 ---- */
  tl.fromTo(P+"rk3",   {autoAlpha:0, scale:1.9}, {autoAlpha:1, scale:1, duration:0.32, ease:"power4.in"}, 38.9);

  tl.to([P+"bar3",P+"n3",P+"nm3"], {opacity:0.45, duration:0.6}, 42.4);

  tl.to("#root > *", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in", stagger:0.0}, 46.9);
