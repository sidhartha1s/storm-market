<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family: Arial, sans-serif; }
  .panel { position:absolute; right:0; top:0; bottom:0; width:820px; box-sizing:border-box;
    background: linear-gradient(270deg, rgba(6,9,13,0.94) 72%, rgba(6,9,13,0)); padding: 90px 70px 0 170px; }
  .eyebrow { font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .tname { font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#f2f5f8; line-height:1.05; margin-top:14px; }
  .tsub { font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:10px; }
  .stamp { display:inline-block; margin-top:34px; font-family:'Arial Black',Arial,sans-serif; font-size:96px; color:#fff;
    background:#8e2020; padding:2px 30px; letter-spacing:2px; }
  .row { font-size:30px; color:#dfe7ee; font-weight:700; letter-spacing:1px; margin-top:22px; }
  .row .lab { display:block; font-size:19px; color:#93a3b2; letter-spacing:4px; font-weight:700; }
  #g-stat-elreno-deaths { font-family:'Courier New',monospace; font-size:84px; color:#e74c3c; font-weight:700; margin-top:26px; }
  .dlab { font-size:20px; color:#c8d3e0; letter-spacing:6px; font-weight:700; }
</style>
<div id="root" data-composition-id="g-stat-elreno" data-width="1920" data-height="1080">
  <div class="panel" id="g-stat-elreno-panel">
    <div class="eyebrow">OFFICIAL RECORD · NWS/NCEI</div>
    <div class="tname">EL RENO, OK</div>
    <div class="tsub">Canadian County · May 31, 2013</div>
    <div><span class="stamp" id="g-stat-elreno-stamp">EF3</span></div>
    <div class="row" id="g-stat-elreno-width"><span class="lab">WIDTH</span>2.6 MILES · RECORD</div>
    <div class="row" id="g-stat-elreno-path"><span class="lab">PATH</span>16.3 MILES</div>
    <div class="row" id="g-stat-elreno-wind"><span class="lab">RADAR WINDS</span>290+ MPH</div>
    <div id="g-stat-elreno-deaths">0</div>
    <div class="dlab" id="g-stat-elreno-dlab">LIVES LOST</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-stat-elreno-";
  tl.set([P+"deaths",P+"dlab",P+"width",P+"path",P+"wind",P+"stamp"], {autoAlpha:0}, 0);
  tl.fromTo(P+"panel", {x:660}, {x:0, duration:0.7, ease:"power3.out"}, 0.0);

  /* "rated EF3" — the stamp cues on the words "EF3" @5.64 (a6-s1.words.json) */
  tl.fromTo(P+"stamp", {scale:2.6, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.35, ease:"power4.in"}, 5.7);

  /* "A tornado 2.6 miles wide" @7.06-9.46 */
  tl.fromTo(P+"width", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 9.5);

  /* path is a standing fact of record — lands right behind width, same beat family */
  tl.fromTo(P+"path", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 11.0);

  /* "with radar measured winds near 300 miles per hour" @10.08-13.0 */
  tl.fromTo(P+"wind", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 13.1);

  /* counter rolls after the record numbers land, before the panel's exit */
  const cnt = {v:0};
  tl.set(P+"deaths", {autoAlpha:1}, 15.5);
  tl.set(P+"dlab", {autoAlpha:1}, 15.5);
  tl.to(cnt, {v:8, duration:0.9, ease:"power4.out", onUpdate:function() {
      const el = document.getElementById("g-stat-elreno-deaths"); if (el) el.textContent = Math.round(cnt.v);
  } }, 15.5);

  /* comp duration covers the ~34s host window plus the full a6-s1 narration tail (38.18s) */
  tl.to(P+"panel", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 38.6);

  window.__timelines["g-stat-elreno"] = tl;
})();
</script>
</template>
</body>
</html>
