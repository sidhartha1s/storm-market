<script>
window.__timelines = window.__timelines || {};
(function () {

  const DUR = 18.75;
  const tl = gsap.timeline({ paused: true });
  /* hidden from the first frame: set now (a paused timeline has not rendered its time-0 sets yet) and again at 0 */
  const HIDE = [P + "ctr", P + "ctrlead", P + "t-ctr", P + "t-ctr2", P + "t-build", P + "carry", P + "end", P + "t-20", P + "t-650", P + "t-end", P + "dim", P + "t-580", P + "l1", P + "v1", P + "s1"];
  gsap.set(HIDE, { autoAlpha: 0 });
  gsap.set(P + "sv", { x: 975, y: 430 });
  /* pivots set once, outside the timeline, so a pulse scales about the same point whatever was seeked before */
  gsap.set(P + "car", { svgOrigin: "940 430" });
  gsap.set(P + "n3", { svgOrigin: "200 650" });
  tl.set(HIDE, { autoAlpha: 0 }, 0);
  tl.set(P + "sv", { x: 975, y: 430 }, 0);

  /* whole window: the sub-vortex spins counter-clockwise and only trembles in place; echoes drift */
  tl.fromTo(P + "rim", { rotation: 0, svgOrigin: "0 0" }, { rotation: -1125, duration: DUR, ease: "none" }, 0);
  tl.to(P + "sv", { x: 978, y: 428, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0);
  tl.fromTo(P + "e1", { x: -80, y: 30 }, { x: 60, y: -30, duration: DUR, ease: "none" }, 0);
  tl.fromTo(P + "e2", { x: -60, y: 20 }, { x: 80, y: -40, duration: DUR, ease: "none" }, 0);
  tl.fromTo(P + "e3", { x: -70, y: 30 }, { x: 70, y: -20, duration: DUR, ease: "none" }, 0);
  tl.fromTo([P + "bar", P + "t-bar", P + "t-own"], { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.06 }, 0.1);

  /* center @0.56, just east @1.62: the centre mark, east of the car marker */
  tl.fromTo(P + "ctr", { autoAlpha: 0, scale: 3, svgOrigin: "0 0" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power3.out" }, CUES.center);
  tl.fromTo([P + "ctrlead", P + "t-ctr"], { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.center + 0.2);
  tl.fromTo(P + "t-ctr2", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.east);
  tl.fromTo(P + "car", { scale: 1.7, svgOrigin: "940 430" }, { scale: 1, duration: 0.5, ease: "back.out(2)", immediateRender: false }, CUES.east + 0.6);

  tl.fromTo(P + "v1", { autoAlpha: 0, scale: 1.5, svgOrigin: "96 240" }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power4.in" }, CUES.n180 - 0.35);

  /* especially heavy @9.46: the paper's words on the car */
  tl.to([P + "ctrlead", P + "t-ctr", P + "t-ctr2"], { autoAlpha: 0, duration: 0.3 }, CUES.heavy - 0.6);
  tl.fromTo(P + "t-build", { autoAlpha: 0, x: 24 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.heavy);

  /* 20 seconds @12.84, carried @13.96, 650 yards @14.48: the line from the start mark to the end mark */
  tl.fromTo(P + "t-20", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.n20);
  tl.fromTo(P + "n3", { scale: 1.15, svgOrigin: "200 650" }, { scale: 1, duration: 0.35, ease: "power3.out", immediateRender: false }, CUES.n20);
  tl.fromTo(P + "carry", { autoAlpha: 0, scale: 0, svgOrigin: "940 430" }, { autoAlpha: 1, scale: 1, duration: 0.9, ease: "power2.inOut" }, CUES.carried - 0.4);

  tl.fromTo(P + "end", { autoAlpha: 0, scale: 0.2, svgOrigin: "1374 390" }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2.5)" }, CUES.n650 + 0.05);

  /* past the crossroads @15.88, Radio Road @17.32 */
  tl.fromTo(P + "t-end", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.past);
  tl.fromTo(P + "dim", { autoAlpha: 0, scaleX: 0, svgOrigin: "940 520" }, { autoAlpha: 1, scaleX: 1, duration: 0.6, ease: "power3.out" }, CUES.past + 0.56);
  tl.fromTo(P + "t-580", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.past + 0.9);
  tl.to(P + "radio", { attr: { "stroke-width": 11 }, duration: 0.35, ease: "power2.out", yoyo: true, repeat: 1 }, CUES.radio);
