<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:#030507; font-family:Arial,sans-serif; }
  .hdr { position:absolute; left:0; right:0; top:80px; text-align:center; font-weight:700; font-size:26px; letter-spacing:8px; color:#93a3b2; }
  .row { position:absolute; left:0; right:0; text-align:center; }
  #g-num2-r1 { top:150px; } #g-num2-r2 { top:460px; } #g-num2-r3 { top:710px; }
  .val { font-family:'Courier New',monospace; font-weight:700; font-size:150px; color:#7fb2e5; }
  #g-num2-v2 { color:#e74c3c; }
  #g-num2-v3 { color:#e8c56a; }
  .lab { font-size:28px; letter-spacing:5px; color:#c8d3e0; font-weight:700; margin-top:6px; }
  .sub { position:absolute; left:0; right:0; top:970px; text-align:center; font-family:Georgia,serif; font-style:italic; font-size:32px; color:#d8a13a; }
  .mid { position:absolute; left:0; right:0; top:400px; text-align:center; font-size:22px; letter-spacing:4px; color:#93a3b2; font-weight:700; }
  .ring { position:absolute; left:50%; top:50%; width:900px; height:900px; margin:-450px 0 0 -450px;
    border:2px solid #1c2732; border-radius:50%; }
</style>
<div id="root" data-composition-id="g-numbers" data-width="1920" data-height="1080">
  <div class="ring" id="g-num2-ring"></div>
  <div class="hdr" id="g-num2-hdr">EL RENO · MAY 31, 2013 · THE FULL RECKONING</div>
  <div class="row" id="g-num2-r1"><div class="val" id="g-num2-v1">0</div><div class="lab">DROWNED IN THE FLOOD</div></div>
  <div class="mid" id="g-num2-mid">PUBLIC ATTENTION WAS ON THE TORNADO</div>
  <div class="row" id="g-num2-r2"><div class="val" id="g-num2-v2">0</div><div class="lab">KILLED BY THE TORNADO</div></div>
  <div class="row" id="g-num2-r3"><div class="val" id="g-num2-v3">0</div><div class="lab">THE FULL NUMBER FOR THAT NIGHT</div></div>
  <div class="sub" id="g-num2-sub">THE LARGER HALF FELL ON THE DISASTER NOBODY WAS WATCHING</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-num2-hdr","#g-num2-r1","#g-num2-mid","#g-num2-r2","#g-num2-r3","#g-num2-sub"], {autoAlpha:0}, 0);
  /* cued to audio/a5-s2.words.json: "13@0.00 people@0.66 drowned@1.14" opens the segment (flood count lands first,
     matching the narration order). The original cue math ("8@39.40 dead.@39.76" tornado count, "21,@42.42" total,
     "larger@43.96..watching.@46.58" closing sub-line) assumed a ~47s host window — the actual host window is
     32.0s, so the reveals below are compressed proportionally (~0.67x) to land inside that shorter cut. */
  tl.fromTo("#g-num2-hdr", {autoAlpha:0}, {autoAlpha:1, duration:0.5}, 0.0);
  function counter(sel, target, at, dur, fmt) {
    const o={v:0};
    tl.to(o, {v:target, duration:dur, ease:"power4.out", onUpdate:()=>{
      const e=document.querySelector(sel); if(e) e.textContent = fmt(Math.round(o.v));
    }}, at);
  }
  tl.fromTo("#g-num2-r1", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 0.0);
  counter("#g-num2-v1", 13, 0.0, 1.0, v=>v+"");
  tl.fromTo("#g-num2-mid", {autoAlpha:0}, {autoAlpha:1, duration:0.6}, 16.6);
  tl.fromTo("#g-num2-r2", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 26.3);
  counter("#g-num2-v2", 8, 26.3, 0.5, v=>v+"");
  tl.fromTo("#g-num2-r3", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 28.3);
  counter("#g-num2-v3", 21, 28.3, 0.7, v=>v+"");
  tl.fromTo("#g-num2-sub", {autoAlpha:0}, {autoAlpha:1, duration:0.7}, 29.5);
  /* continuous element bridging the gap between the flood count and the tornado count — a slow decorative
     ring rotation spanning the full 32.0s window, per contract §5's continuous-motion rule */
  tl.to("#g-num2-ring", {rotation:70, duration:31.8, ease:"none"}, 0.0);
  window.__timelines["g-numbers"] = tl;
})();
</script>
</template>
</body>
</html>
