<script>
window.__timelines = window.__timelines || {};
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const grid = document.getElementById("r3-grid");
  function ln(x1, y1, x2, y2, stroke, w) {
    const e = document.createElementNS(NS, "line");
    e.setAttribute("x1", x1); e.setAttribute("y1", y1); e.setAttribute("x2", x2); e.setAttribute("y2", y2);
    e.setAttribute("stroke", stroke); e.setAttribute("stroke-width", w); grid.appendChild(e);
  }
  /* section-line roads east of US-81 (x 700), from OpenStreetMap: Alfadale 1.05 mi = x 931, Radio 2.04 mi = x 1148.8, then one mile apart */
  [931, 1148.8, 1368.8, 1588.8, 1808.8].forEach(function (x) { ln(x, 0, x, 1080, "#34434f", 2); });
  for (let y = 760 - 660; y < 1080; y += 220) if (y !== 760) ln(560, y, 1920, y, "#34434f", 2);

  const tl = gsap.timeline({ paused: true });
  const P = "#r3-";
  function show(id, at, vars) { tl.fromTo(P + id, Object.assign({ autoAlpha: 0 }, vars || {}), { autoAlpha: 1, x: 0, y: 0, duration: 0.5, ease: "power3.out" }, at); }
  tl.fromTo(P + "sweep", { x: 500 }, { x: 1920, duration: 7.2, ease: "none", repeat: 2 }, 0);

  /* but @0.00: the wide circulation sits over Reuter Road, turning */
  gsap.set(P + "ring", { x: 1080, y: 730 });
  gsap.set([P + "ba", P + "bb"], { scaleX: 0, transformOrigin: "0% 50%" });
  tl.set(P + "ring", { x: 1080, y: 730 }, 0);
  tl.fromTo(P + "halo", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 150, duration: 21.5, ease: "none" }, 0);
  tl.fromTo(P + "core", { scale: 0.9, transformOrigin: "50% 50%" }, { scale: 1, duration: 1.4, ease: "power2.out" }, 0.0);
  tl.set(P + "ba", { scaleX: 0, transformOrigin: "0% 50%" }, 0);
  tl.set(P + "bb", { scaleX: 0, transformOrigin: "0% 50%" }, 0);

  /* Dan @4.90: his mark on Reuter Road, eastbound at 60 px/s; core @6.52 (enters x 946 at 6.0); out @10.86 (leaves x 1214 at 10.47) */
  tl.set(P + "rob", { x: 880, y: 760 }, 0);
  tl.fromTo(P + "rob", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 4.9);
  tl.to(P + "rob", { x: 1420, duration: 9.0, ease: "none" }, 4.9);
  tl.to(P + "path", { strokeDashoffset: 0, duration: 9.0, ease: "none" }, 4.9);
  tl.fromTo(P + "robp", { attr: { r: 12 }, opacity: 0.9 }, { attr: { r: 46 }, opacity: 0, duration: 1.3, ease: "power1.out", repeat: 6 }, 4.9);
  show("la", 4.9, { x: -30 });
  /* about @8.00, 45 @8.24 */
  show("va", 8.0, { x: -30 });
  tl.to(P + "ba", { scaleX: 1, duration: 0.6, ease: "power3.out" }, 8.24);
  /* side @11.40: he is out of the core; the mark leaves the ring (x 1364 at 12.97) */
  tl.to(P + "rob", { autoAlpha: 0, duration: 0.5 }, 13.4);
  tl.to(P + "path", { opacity: 0.35, duration: 0.8 }, 13.4);

  /* Later @12.50: the time stamp; north (of Interstate 40) @13.22: the ring jumps ahead in time */
  show("time", 12.5, { x: -30 });
  show("lb", 13.22, { x: -30 });
  tl.to(P + "ring", { x: 1300, y: 318, duration: 2.6, ease: "power2.inOut" }, 13.0);
  tl.to(P + "trail", { strokeDashoffset: 0, duration: 2.6, ease: "power2.inOut" }, 13.0);
  /* slowed @15.64: from here the ring creeps at 7 px/s (60 px/s = about 45 mph, so under 10 mph is under 13 px/s) */
  tl.to(P + "ring", { x: 1330, y: 290, duration: 5.9, ease: "none" }, 15.6);
  /* less (than) @16.32, 10 @17.00 */
  show("vb", 16.32, { x: -30 });
  tl.to(P + "bb", { scaleX: 1, duration: 0.6, ease: "power3.out" }, 17.0);
  show("src", 17.3, { x: -20 });
  /* fast (part) @19.02: one small bright spot moving inside the ring */
  tl.fromTo(P + "fast", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 19.02);
  tl.fromTo(P + "fast", { rotation: -40, svgOrigin: "0 0" }, { rotation: 320, duration: 2.5, ease: "none" }, 19.0);

  window.__timelines["g-a2s3-ring"] = tl;
})();
</script>
