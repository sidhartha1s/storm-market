<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#g-intro-8-track-";
  const $ = function (n) { return document.getElementById("g-intro-8-track-" + n); };
  const proj = function (lon, lat) { return [(lon + 100) * 90, (41 - lat) * 103.95]; };
  const GAL = proj(-94.80, 29.30), HAV = proj(-82.38, 23.13), WAS = proj(-77.04, 38.90);

  /* HURDAT2 AL011900, 6-hourly fixes Sept 2 00Z (index 0) .. Sept 8 18Z (index 27); index = (day - 2) * 4 + hour / 6 */
  const TRK = [[-70.3,18.3],[-71.3,18.7],[-72.3,19.0],[-73.2,19.3],[-74.1,19.5],[-75.0,19.7],[-76.0,20.0],[-76.6,20.3],[-77.2,20.6],[-77.7,21.0],[-78.3,21.3],[-78.9,21.6],[-79.5,22.0],[-80.1,22.4],[-80.7,23.0],[-81.5,23.5],[-82.3,24.1],[-83.2,24.8],[-84.1,25.5],[-85.2,26.1],[-86.2,26.5],[-87.4,26.8],[-88.7,27.0],[-89.7,27.2],[-90.6,27.4],[-91.5,27.6],[-92.4,27.8],[-93.5,28.2]]
    .map(function (p) { return proj(p[0], p[1]); });
  const CUM = [0];
  for (let i = 1; i < TRK.length; i++) CUM.push(CUM[i - 1] + Math.hypot(TRK[i][0] - TRK[i - 1][0], TRK[i][1] - TRK[i - 1][1]));
  const TLC = Math.ceil(CUM[CUM.length - 1]) + 1;                                /* dash lengths: ceil(len)+1 */
  function pointAt(d) {
    let i = 0;
    while (i < CUM.length - 2 && CUM[i + 1] < d) i++;
    const u = Math.max(0, Math.min(1, (d - CUM[i]) / (CUM[i + 1] - CUM[i])));
    return [TRK[i][0] + (TRK[i + 1][0] - TRK[i][0]) * u, TRK[i][1] + (TRK[i + 1][1] - TRK[i][1]) * u];
  }
  /* ring legs [start, end, from fix, to fix, ease]; holds between legs. Fix 12 = Sept 5 00Z (evening of Sept 4, Cuban
     local time, over central Cuba); 15 = Sept 5 18Z (Florida Straits); 19 = Sept 6 18Z (the Louisiana); 27 = Sept 8 18Z (offshore) */
  const LEGS = [[0, 1.80, 0, 12, "none"], [3.14, 4.70, 12, 15, "power1.inOut"], [14.134, 17.774, 15, 19, "power1.inOut"], [20.09, 22.27, 19, 27, "power1.inOut"]]
    .map(function (g) { return [g[0], g[1], CUM[g[2]], CUM[g[3]], gsap.parseEase(g[4])]; });
  function dAt(t) {
    let d = 0;
    for (let k = 0; k < LEGS.length; k++) {
      const g = LEGS[k];
      if (t >= g[1]) { d = g[3]; continue; }
      if (t > g[0]) d = g[2] + (g[3] - g[2]) * g[4]((t - g[0]) / (g[1] - g[0]));
      break;
    }
    return d;
  }

  /* camera: pure function of comp time */
  const io = gsap.parseEase("power2.inOut");
  const lerp = function (a, b, u) { return a + (b - a) * u; };
  function logLerpScale(fromScale, toScale, t) {                              /* from library/inhouse/snippets/helpers.js logZoom */
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  function camAt(t) {
    if (t < 6.674) return [1800, 1900, 0.85 * (1 + 0.02 * t / 6.674)];                  /* V-CUBA, drift +2 % */
    if (t < 8.474) { const u = io((t - 6.674) / 1.8);                                   /* WILLIS S2 0.00: to V-GULF */
      return [lerp(1800, 1150, u), lerp(1900, 1550, u), lerp(0.867, 0.75, u)]; }
    if (t < 22.99) return [1150, 1550, 0.75 * (1 + 0.02 * (t - 8.474) / 14.516)];       /* V-GULF, drift +2 % */
    if (t < 23.99) { const u = io(t - 22.99);                                           /* AND S3 2.90: logZoom to V-WIRE */
      return [lerp(1150, 1267, u), lerp(1550, 1000, u), logLerpScale(0.765, 0.5, u)]; }
    return [1267, 1000, 0.5 + 0.01 * Math.min(1, (t - 23.99) / 2.9)];                  /* V-WIRE, drift */
  }

  const HAV_MID = [(HAV[0] + GAL[0]) / 2, (HAV[1] + GAL[1]) / 2];
  const TICKS = [[2, "tk2"], [6, "tk3"], [10, "tk4"], [14, "tk5"], [18, "tk6"], [22, "tk7"], [26, "tk8"]];
  const marks = [[$("hav-at"), HAV], [$("was-at"), WAS], [$("gal-at"), GAL], [$("xm-at"), HAV_MID], [$("ship-at"), TRK[19]]]
    .concat(TICKS.map(function (k) { return [$(k[1] + "-at"), TRK[k[0]]]; }));
  const camEl = $("cam"), trkEl = $("trk"), ringAt = $("ring-at");
  trkEl.style.strokeDasharray = TLC + " " + TLC;
  function render(t) {
    const c = camAt(t), cx = c[0], cy = c[1], s = c[2];
    const at = function (p) { return "translate(" + (960 + (p[0] - cx) * s).toFixed(2) + "," + (540 + (p[1] - cy) * s).toFixed(2) + ")"; };
    camEl.setAttribute("transform", "translate(" + (960 - cx * s).toFixed(2) + "," + (540 - cy * s).toFixed(2) + ") scale(" + s.toFixed(5) + ")");
    for (let i = 0; i < marks.length; i++) marks[i][0].setAttribute("transform", at(marks[i][1]));
    const d = dAt(t);
    ringAt.setAttribute("transform", at(pointAt(d)));                           /* ring = track head, same d */
    trkEl.setAttribute("stroke-width", (5 / s).toFixed(3));
    trkEl.style.strokeDashoffset = (TLC - d).toFixed(2);
    for (let k = 0; k < TICKS.length; k++) $(TICKS[k][1]).setAttribute("opacity", d >= CUM[TICKS[k][0]] - 0.01 ? 1 : 0);
  }
  render(0);

  /* arrowheads: tip 20 plate px past the curve end along its end tangent (end - control) */
  function head(id, end, ctl, len, half) {
    const dl = Math.hypot(end[0] - ctl[0], end[1] - ctl[1]), dx = (end[0] - ctl[0]) / dl, dy = (end[1] - ctl[1]) / dl;
    const tip = [end[0] + dx * 20, end[1] + dy * 20], base = [tip[0] - dx * len, tip[1] - dy * len];
    $(id).setAttribute("points", [tip, [base[0] - dy * half, base[1] + dx * half], [base[0] + dy * half, base[1] - dx * half]]
      .map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));
