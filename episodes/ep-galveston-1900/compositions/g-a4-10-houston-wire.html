    X = (lon + 100) * 90, Y = (41 - lat) * 103.95 (g-intro-4 projection, also g-a4-2's plate units).

      <path d="M0,-30 L9,4 L0,-3 L-9,4Z" fill="#93a3b2"/>
      <text x="0" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#93a3b2">N</text>
    </g>
    <g id="g-a4-10-houston-wire-gsvg" class="ga410-hide">
      <g stroke="#93a3b2" stroke-width="2">
        <line x1="1430" y1="600" x2="1448" y2="600"/><line x1="1430" y1="540" x2="1448" y2="540"/><line x1="1430" y1="480" x2="1448" y2="480"/>
        <line x1="1430" y1="420" x2="1448" y2="420"/><line x1="1430" y1="360" x2="1448" y2="360"/><line x1="1430" y1="300" x2="1448" y2="300"/>
      </g>
      <g font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#93a3b2">
        <text x="1508" y="606">0</text><text x="1508" y="546">1</text><text x="1508" y="486">2</text>
        <text x="1508" y="426">3</text><text x="1508" y="366">4</text><text x="1508" y="306">5</text>
      </g>
      <rect id="g-a4-10-houston-wire-bar" x="1456" y="600" width="40" height="0" fill="#7fb2e5" fill-opacity="0.9"/>
    </g>
  </svg>

  <div class="ga410-geo" id="g-a4-10-houston-wire-geo1" style="left:780px; top:228px; width:240px;">Galveston Bay</div>
  <div class="ga410-geo" id="g-a4-10-houston-wire-geo2" style="left:760px; top:889px; width:400px;">Gulf of Mexico</div>
  <div class="ga410-lab ga410-hide" id="g-a4-10-houston-wire-office-lab" style="left:1086px; top:452px; width:190px; text-align:right;">Telegraph offices</div>
  <div class="ga410-small" id="g-a4-10-houston-wire-note" style="left:96px; top:1000px;">Street grid: schematic</div>

  <div class="ga410-card ga410-hide" id="g-a4-10-houston-wire-card"></div>
  <div class="ga410-big ga410-hide" id="g-a4-10-houston-wire-depth">2 TO 4 FT</div>

  <div class="ga410-lab ga410-hide" id="g-a4-10-houston-wire-gal-lab">Galveston</div>
  <div class="ga410-lab ga410-hide" id="g-a4-10-houston-wire-hou-lab">Houston</div>
  <div class="ga410-lab ga410-hide" id="g-a4-10-houston-wire-was-lab">Washington</div>

  <div class="ga410-src" id="g-a4-10-houston-wire-src">Isaac Cline, Monthly Weather Review, September 1900, pp. 372 and 373</div>
  <div class="ga410-chip ga410-hide" id="g-a4-10-houston-wire-c1">
    <div class="ga410-main">ONE WIRE TO HOUSTON</div>
    <div class="ga410-tag">long-distance telephone</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-a4-10-houston-wire";
  const P = "#" + ID + "-";
  const $ = function (n) { return document.getElementById(ID + "-" + n); };
  const root = $("root");
  const D = 11.70;   /* host: A4-S6 2.60 to 14.30 */

  /* g-intro-4 projection (plate units) */
  const proj = function (lon, lat) { return [(lon + 100) * 90, (41 - lat) * 103.95]; };
  const GAL = proj(-94.80, 29.30), HOU = proj(-95.37, 29.76), WAS = proj(-77.04, 38.90);

  /* island framing, as g-a4-2: NE tip at (2120, 850), s 135, island turned level */
  const SW = [439.51, 1238.15], NE = [474.80, 1212.77];
  const SA = 135;
  const L = Math.hypot(NE[0] - SW[0], NE[1] - SW[1]);
  const UX = (NE[0] - SW[0]) / L, UY = (NE[1] - SW[1]) / L;
  const bA = Math.atan2(-UY, UX), cb = Math.cos(bA), sb = Math.sin(bA);
  const vx = (2120 - 960) / SA, vy = (850 - 540) / SA;
  const cA = [NE[0] - (cb * vx + sb * vy), NE[1] - (-sb * vx + cb * vy)];   /* R^T v */
  const CAM_A = { s: SA, b: bA, c: cA };
  const CAM_H = { s: 8, b: 0, c: [430, 1192] };
  const CAM_W = { s: 0.5, b: 0, c: [1267, 1000] };

  const lerp = function (a, b, u) { return a + (b - a) * u; };
  const ease = gsap.parseEase("power2.inOut");
  function mix(c1, c2, u) {   /* zoom in log space (helpers.js logZoom form) */
    return { s: Math.exp(lerp(Math.log(c1.s), Math.log(c2.s), u)), b: lerp(c1.b, c2.b, u),
      c: [lerp(c1.c[0], c2.c[0], u), lerp(c1.c[1], c2.c[1], u)] };
  }
  function camAt(t) {
    if (t <= 6.16) return CAM_A;
    if (t < 7.16) return mix(CAM_A, CAM_H, ease(t - 6.16));
    if (t <= 10.08) return CAM_H;
    if (t < 10.78) return mix(CAM_H, CAM_W, ease((t - 10.08) / 0.7));
    return CAM_W;
  }
  /* affine [a,b,c,d,e,f] (SVG order) */
  function mat(cam) {
    const cs = cam.s * Math.cos(cam.b), sn = cam.s * Math.sin(cam.b);
    return [cs, sn, -sn, cs, 960 - (cs * cam.c[0] - sn * cam.c[1]), 540 - (sn * cam.c[0] + cs * cam.c[1])];
  }
  function ap(m, p) { return [m[0] * p[0] + m[2] * p[1] + m[4], m[1] * p[0] + m[3] * p[1] + m[5]]; }
  function inv(m) {
    const det = m[0] * m[3] - m[1] * m[2];
    return [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det, (m[2] * m[5] - m[3] * m[4]) / det, (m[1] * m[4] - m[0] * m[5]) / det];
  }
  function mul(p, q) {   /* p after q */
    return [p[0] * q[0] + p[2] * q[1], p[1] * q[0] + p[3] * q[1], p[0] * q[2] + p[2] * q[3], p[1] * q[2] + p[3] * q[3],
      p[0] * q[4] + p[2] * q[5] + p[4], p[1] * q[4] + p[3] * q[5] + p[5]];
  }
  const fmt = function (m) { return "matrix(" + m.map(function (n) { return n.toFixed(5); }).join(",") + ")"; };
  const MAinv = inv(mat(CAM_A));
  const plate = $("plate"), world = $("world");
  const marks = [[$("gal-at"), GAL], [$("hou-at"), HOU], [$("was-at"), WAS]];
  function draw(t) {
    const m = mat(camAt(t));
    plate.setAttribute("transform", fmt(m));
    world.setAttribute("transform", fmt(mul(m, MAinv)));
    marks.forEach(function (k) { const p = ap(m, k[1]); k[0].setAttribute("transform", "translate(" + p[0].toFixed(2) + "," + p[1].toFixed(2) + ")"); });
  }
  draw(0);

  /* north arrow (island framing) */
  $("north").setAttribute("transform", "translate(132,936) rotate(" + (Math.atan2(-UY, UX) * 180 / Math.PI).toFixed(2) + ")");

  /* HUD labels: fixed screen positions taken from the settled camera states */
  const mH = mat(CAM_H), mW = mat(CAM_W);
  const place = function (el, p) { el.style.left = (p[0] + 18).toFixed(0) + "px"; el.style.top = (p[1] - 13).toFixed(0) + "px"; };
  place($("gal-lab"), ap(mH, GAL)); place($("hou-lab"), ap(mH, HOU)); place($("was-lab"), ap(mW, WAS));

  /* phone lines in plate units */
  const l1 = $("l1"), l2 = $("l2");
  l1.setAttribute("x1", GAL[0]); l1.setAttribute("y1", GAL[1]); l1.setAttribute("x2", GAL[0]); l1.setAttribute("y2", GAL[1]);
  l2.setAttribute("x1", HOU[0]); l2.setAttribute("y1", HOU[1]); l2.setAttribute("x2", HOU[0]); l2.setAttribute("y2", HOU[1]);

  const dl = function (el) { return Math.ceil(el.getTotalLength()) + 1; };
  const poles = Array.prototype.slice.call(root.querySelectorAll(".ga410-pole"));
  const wires = Array.prototype.slice.call(root.querySelectorAll(".ga410-wire"));
  poles.concat(wires).forEach(function (el) { const n = dl(el); el.style.strokeDasharray = n + " " + n; el.style.strokeDashoffset = n; el._n = n; });

  const tl = gsap.timeline({ paused: true });

  /* camera: a pure function of timeline time (seek-safe), runs the whole window */
  tl.to({ t: 0 }, { t: 1, duration: D, ease: "none", onUpdate: function () { draw(this.time()); } }, 0);

  /* whole part A: ripples drift (HUD layer, off by 6.40) */
  tl.set([P + "rp1", P + "rp2", P + "rp3", P + "rp4"], { x: 0 }, 0);
  tl.to(P + "rp1", { x: 90, duration: 6.4, ease: "none" }, 0);
  tl.to(P + "rp2", { x: -80, duration: 6.4, ease: "none" }, 0);
  tl.to(P + "rp3", { x: 70, duration: 6.4, ease: "none" }, 0);
  tl.to(P + "rp4", { x: 80, duration: 6.4, ease: "none" }, 0);

  /* JOSEPH @4.50 (1.90): figure in at row 2; WADED @4.86 (2.26): walks north 2.26 to 5.20, legs bob */
  tl.set(P + "fig", { x: 1275, y: 654 }, 0);
  tl.fromTo(P + "fig", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 1.9);
  tl.to(P + "fig", { y: 444, duration: 2.94, ease: "none" }, 2.26);
  tl.fromTo(P + "legl", { rotation: -22, svgOrigin: "7 30", smoothOrigin: false },
    { rotation: 22, svgOrigin: "7 30", smoothOrigin: false, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 6 }, 2.26);
  tl.fromTo(P + "legr", { rotation: 22, svgOrigin: "11 30", smoothOrigin: false },
    { rotation: -22, svgOrigin: "11 30", smoothOrigin: false, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 6 }, 2.26);

  /* TELEGRAPH @5.54 (2.94): poles and broken wires draw 0.6 s, office outline pulses, label in */
  tl.set(poles.concat(wires), { autoAlpha: 1 }, 2.94);
  tl.to(poles.concat(wires), { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 2.94);
  tl.fromTo(P + "pc1", { rotation: 0, svgOrigin: "0 0", smoothOrigin: false }, { rotation: 55, svgOrigin: "0 0", smoothOrigin: false, duration: 0.5, ease: "power2.in" }, 3.54);
  tl.fromTo(P + "pc2", { rotation: 0, svgOrigin: "0 0", smoothOrigin: false }, { rotation: -55, svgOrigin: "0 0", smoothOrigin: false, duration: 0.5, ease: "power2.in" }, 3.54);
  tl.fromTo(P + "office", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "none" }, 2.94);
  tl.to(P + "office", { opacity: 0.3, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 3.14);
  tl.fromTo(P + "office-lab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.94);

  /* TWO @7.02 (4.42): gauge and label in (from 4.20 so the label reads 1.5 s before it goes); bar rises to 2 ft (y 480), then
     FOUR @7.54 (4.94) swings to 4 ft (y 360) and wavers between 4 ft and 3.3 ft (never above 4, never below 2) */
  tl.fromTo([P + "card", P + "gsvg"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 4.2);
  tl.fromTo(P + "depth", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.2);
  tl.to(P + "bar", { attr: { y: 480, height: 120 }, duration: 0.5, ease: "power2.out" }, 4.42);
  tl.to(P + "bar", { attr: { y: 360, height: 240 }, duration: 0.5, ease: "sine.inOut" }, 4.94);
  tl.to(P + "bar", { attr: { y: 402, height: 198 }, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.44);

  /* ONE @8.76 (6.16): part A text and gauge off (HUD text is gone before the camera has moved), zoom 6.16 to 7.16 (camAt) */
  tl.to([P + "card", P + "gsvg", P + "depth", P + "office-lab", P + "note", P + "north", P + "ripples", P + "geo1", P + "geo2"],
    { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 6.1);
  tl.to(P + "partA", { autoAlpha: 0, duration: 0.6, ease: "power1.inOut" }, 6.4);

  /* WIRE @9.40 to HOUSTON @10.50 (7.20 to 7.90): Galveston to Houston draws 0.7 s; Galveston dot and label at the settled camera */
  tl.fromTo(P + "gal", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 7.2);
  tl.fromTo(P + "gal-lab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.2);
  tl.set(P + "l1", { autoAlpha: 1 }, 7.2);
  tl.fromTo(P + "l1", { attr: { x2: GAL[0], y2: GAL[1] } }, { attr: { x2: HOU[0], y2: HOU[1] }, duration: 0.7, ease: "power2.inOut" }, 7.2);
  tl.fromTo(P + "hou", { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 7.5);
  tl.fromTo(P + "hou-lab", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.9);
  /* line glow pulse (opacity 0.7 to 1, 0.8 s) */
  tl.fromTo(P + "glow", { opacity: 1 }, { opacity: 0.7, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 4 }, 7.5);

  /* chip in 8.10, readable from 8.55, out at 10.08 (1.5 s) */
  tl.fromTo(P + "c1", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 8.1);

  /* MESSAGE @12.68 (10.08): chip out, labels off before the move, zoom to Washington 10.08 to 10.78 (camAt) */
  tl.to(P + "c1", { x: 980, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 10.08);
  tl.to([P + "gal-lab", P + "hou-lab"], { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 9.8);

  /* WESTERN UNION @13.38 (10.78): Houston pin flashes (r, no scale origin to drift); Houston to Washington draws 10.80 to 11.40 */
  tl.to(P + "houc", { attr: { r: 16 }, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 10.78);
  tl.set(P + "l2", { autoAlpha: 1 }, 10.8);
  tl.fromTo(P + "l2", { attr: { x2: HOU[0], y2: HOU[1] } }, { attr: { x2: WAS[0], y2: WAS[1] }, duration: 0.6, ease: "power2.inOut" }, 10.8);
  tl.fromTo(P + "was", { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 10.8);
  tl.fromTo(P + "was-lab", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 10.8);

  window.__timelines[ID] = tl;
})();
</script>
</template>
