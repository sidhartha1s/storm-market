<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a1-8-cline-picture-";
  const q = function(id) { return document.querySelector(P + id); };
  /* a1-s4.words.json, comp-local = S4 time - 4.62 (host starts at "He" 4.62).
     Host: nx-a1-s4 154.523 + 4.62 = 159.143 to nx-a1-s5 178.762 -> 19.619 s.
     north 6.14 -> 1.52 · lower 7.20 -> 2.58 · (pan settles 7.54 -> 2.92) · spread 9.00 -> 4.38 · it. 9.70 -> 5.08
     In 10.30 -> 5.68 · picture, 10.58 -> 5.96 · storm 11.48 -> 6.86 · Gulf 12.96 -> 8.34 · run 13.50 -> 8.88
     that 14.22 -> 9.60 · country 15.16 -> 10.54 · thin 15.40 -> 10.78 · city. 20.28 -> 15.66 · Cyclone 20.54 -> 15.92
     Timeline ends 19.619; fade-through to A1-S5 in the last 0.4 s. */
  const END = 19.619;

  /* --- water paths (Gulf wavelength 60, Bay 80), long enough for the whole phase drift --- */
  const wave = function(x0, x1, half, amp) {
    let d = "M" + x0 + ",780 q" + (half / 2) + "," + (-2 * amp) + " " + half + ",0";
    for (let x = x0 + half; x < x1; x += half) d += " t" + half + ",0";
    return d;
  };
  const gd = wave(-680, 420, 30, 6), bd = wave(1480, 2720, 40, 3);
  q("wgulfs").setAttribute("d", gd);
  q("wgulff").setAttribute("d", gd + " L420,1000 L-680,1000 Z");
  q("wbays").setAttribute("d", bd);
  q("wbayf").setAttribute("d", bd + " L2720,1000 L1480,1000 Z");

  /* --- houses on the island profile, evenly by arc length (x 560 to 1360), exactly as g-intro-6 --- */
  const PTS = [[360,780],[520,640],[720,620],[900,432],[1020,432],[1200,620],[1400,640],[1560,780]];
  const yAt = function(x) {
    for (let i = 0; i < PTS.length - 1; i++) {
      const a = PTS[i], b = PTS[i + 1];
      if (x >= a[0] && x <= b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
    return 780;
  };
  const xs = [], arc = [0];
  for (let x = 560; x <= 1360; x += 0.5) xs.push(x);
  for (let i = 1; i < xs.length; i++) arc.push(arc[i - 1] + Math.hypot(0.5, yAt(xs[i]) - yAt(xs[i - 1])));
  const total = arc[arc.length - 1];
  const houses = [];
  for (let k = 0, j = 0; k < 22; k++) {
    const want = total * k / 21;
    while (j < arc.length - 1 && arc[j] < want) j++;
    houses.push(q("h" + k));
    tl.set(houses[k], {x: xs[j], y: yAt(xs[j]), scale: 1, transformOrigin: "50% 100%"}, 0);
  }

  /* --- camera: screen = (960 + (X - cx)*s, 540 + (Y - cy)*s), pure function of comp time --- */
  const io2 = gsap.parseEase("power2.inOut"), io1 = gsap.parseEase("power1.inOut");
  const clamp = function(u) { return Math.max(0, Math.min(1, u)); };
  const camAt = function(t) {
    if (t < 1.52) return [960, 540, 1];                                   /* V0: g-intro-6 framing */
    if (t < 2.92) return [960 + 1540 * io2(clamp((t - 1.52) / 1.4)), 540, 1]; /* V1 pan north */
    if (t < 5.68) return [2500, 540, 1];
    if (t < 6.68) {                                                       /* V2 pull-out 2x, log space (helpers.js logZoom) */
      const u = io1(clamp((t - 5.68) / 1.0));
      return [2500 - 800 * u, 540 + 60 * u, Math.exp(Math.log(0.5) * u)];
    }
    return [1700, 600, 0.5 + 0.02 * clamp((t - 6.68) / (END - 6.68))];   /* V2 drift 0.50 -> 0.52 */
  };
  const cam = q("cam");
  const applyCam = function() {
    const c = camAt(tl.time()), s = c[2];
    cam.setAttribute("transform", "matrix(" + s + ",0,0," + s + "," + (960 - c[0] * s) + "," + (540 - c[1] * s) + ")");
  };
  applyCam();
  tl.eventCallback("onUpdate", applyCam);

  /* --- start states --- */
  tl.set([P+"src", P+"note", P+"lmain", P+"llow", P+"brow", P+"lcyc", P+"chip",
          P+"level", P+"tick", P+"spread", P+"storm", P+"wind", P+"mound", P+"sheet"], {autoAlpha: 0}, 0);
  tl.set([P+"lmain", P+"llow", P+"brow", P+"chip"], {xPercent: -50}, 0);
  tl.set(P+"mound", {scaleY: 0, x: 0, transformOrigin: "50% 100%"}, 0);
  tl.set(P+"spin", {rotation: 0, transformOrigin: "50% 50%"}, 0);
  tl.set(P+"windm", {x: 0}, 0);
  tl.set(P+"bayrise", {y: 0}, 0);

  /* --- whole-window motion: water phase (ease none) --- */
  tl.to(P+"wgulf", {x: 390, duration: END, ease: "none"}, 0);
  tl.to(P+"wbay", {x: -260, duration: END, ease: "none"}, 0);

  /* HE SAID @4.62 (local 0): plate on at V0; source line and note in, then drift */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0);
  tl.to(P+"src", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 7}, 0.5);
  tl.fromTo(P+"note", {autoAlpha: 0, x: -20}, {autoAlpha: 1, x: 0, duration: 0.4, ease: "power2.out"}, 0);
  tl.to(P+"note", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 7}, 0.4);

  /* NORTH @6.14: chip in on the HUD while the V1 pan runs (1.52 to 2.92) */
  tl.fromTo(P+"chip", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 1.52);
  tl.to(P+"chip", {y: -4, duration: 1.55, ease: "sine.inOut", yoyo: true, repeat: 1}, 1.97);

  /* LOWER @7.20: level line draws left to right (0.8 s), then the down-tick to the mainland top at x 3000 */
  tl.set(P+"level", {autoAlpha: 1}, 2.58);
  tl.fromTo(P+"clevr", {attr: {width: 0}}, {attr: {width: 2590}, duration: 0.8, ease: "none"}, 2.58);
  tl.set(P+"tick", {autoAlpha: 1}, 3.19);
  tl.fromTo(P+"ctickr", {attr: {height: 0}}, {attr: {height: 292}, duration: 0.3, ease: "power2.out"}, 3.19);
  /* labels in once the pan has settled (7.54 -> 2.92) */
  tl.fromTo(P+"llow", {autoAlpha: 0, y: 14}, {autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out"}, 2.92);
  tl.fromTo(P+"lmain", {autoAlpha: 0, y: 14}, {autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out"}, 3.02);
  tl.to(P+"llow", {y: -4, duration: 1.76, ease: "sine.inOut"}, 3.32);
  tl.to(P+"lmain", {y: -4, duration: 1.66, ease: "sine.inOut"}, 3.42);

  /* SPREAD @9.00: spread arrow draws left to right along the mainland (0.7 s) */
  tl.set(P+"spread", {autoAlpha: 1}, 4.38);
  tl.fromTo(P+"csprr", {attr: {width: 0}}, {attr: {width: 1016}, duration: 0.7, ease: "power1.inOut"}, 4.38);

  /* it. @9.70 to 10.10: chip out (diagram exit), labels out (0.3 s), before the pull-out */
  tl.to(P+"chip", {y: -24, autoAlpha: 0, duration: 0.4, ease: "power2.in"}, 5.08);
  tl.to([P+"llow", P+"lmain"], {autoAlpha: 0, duration: 0.3, ease: "power2.in"}, 5.08);

  /* IN @10.30: V2 pull-out 5.68 to 6.68 (camAt). HIS PICTURE @10.58: eyebrow starts on "In" so a Cline tag is
     on every frame from 10.30 (§4.4) and lands on "picture," */
  tl.fromTo(P+"brow", {autoAlpha: 0, y: 14}, {autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out"}, 5.66);
