  g-a2-8-belen-line · A2-S7 (whole, 0.00 to 20.517) · ep-galveston-1900 · DEEP (Opus) · brief: briefs/a2/g-a2-8-belen-line.md
  Claim: Gangoiti, at Belen, observed a new storm on Monday 3 September and read it by Viñes's model. The Americans
  could hear him (letters both ways since late 1898); Galveston could not: his forecast never left Havana, while
  Galveston stayed lit by Washington's line alone. No storm symbol, track or position anywhere (unsourced).

  PLATE, BASEMAP, projection and pin markup copied from compositions/g-intro-4-wire-map.html (g-a2-5 not yet on disk
  when this was built; its plate is the same g-intro-4 plate). Mini-cards: text and paper stock per briefs g-a2-3 / g-a2-4.
  PLATE (the one coordinate system; every point on this map is computed by this formula, never placed by eye):
    X = (lon + 100) * 90        Y = (41 - lat) * 103.95        (equirectangular, 30 deg latitude stretch, north up)
    The nominal plate is 2700 x 2703 (lon -100..-70, lat 15..41). The drawn geometry runs wider, lon -110..-62,
    lat 8..46 (X -900..3420, Y -520..3430), so no camera state used here shows an edge. The land polygon's outer ring
    follows that box: a camera wider than about s 0.45 centred on the Gulf would show it.
  BASEMAP (between BASEMAP markers, path data in plate units, do not hand-edit):
    land   = Natural Earth 10m coastline (public domain), polygonised against the box, water faces dropped
             (seeds: Gulf, Atlantic, Caribbean, Pacific), simplified 0.025 deg. Fill #15202b, coast stroke #5a768f 2 px.
    border = US-Mexico land border: NE 50m admin-1 US outline minus anything within 0.12 deg of the 10m coast.
    states = NE 10m admin-1 lines touching Texas, Louisiana or Florida.
    Source files: cartopy cache ne_10m_coastline.shp, ne_10m_admin_1_states_provinces_lines.shp;
    ep-mayfield-2021 research/geo/ne50m/ne_50m_admin_1_states_provinces_lakes.geojson. One-shot transform, not committed.
  PINS (plate px, by the formula): Galveston (-94.80, 29.30) = (468.0, 1216.2); Havana (-82.38, 23.13) = (1585.8, 1857.6);
    Washington (-77.04, 38.90) = (2066.4, 218.3).
    Belen line 60 % point: Havana + 0.6 * (Galveston - Havana) = (915.1, 1472.8) (brief rounds to 915.9, 1473.6;
    0.5 screen px apart at s 0.5) = screen (784, 776) in V-WIRE, 257 px short of the Galveston pin.
  CAMERA: screen = (960 + (X - cx) * s, 540 + (Y - cy) * s). camAt(t) below is a pure function of comp time
    (seek-safe). V-HAV cx 1100 cy 1560 s 1.00 -> 1.03 drift 0 to 9.0; hold to 9.32; pull 9.32 -> 10.40 to V-WIRE
    cx 1267 cy 1000 s 0.5 (a 2x pull-out: s interpolates in log space, logLerpScale from
    library/inhouse/snippets/helpers.js logZoom); V-WIRE holds to the end (pins stay on their HUD labels).
  LAYERS: #...-cam holds plate-unit geometry (land, wires, letters line, Belen line, return dot) and is the only
    element the camera transforms. #...-pins holds screen-size marks; camAt places each mark's outer <g> on its
    projected point. #...-hud holds every map label at fixed screen positions, shown only while the camera is still.
    Cards and chip are HTML on top of the SVG, V-HAV only.
