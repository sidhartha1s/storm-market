<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a5-1-film-";
  /* a5-s1.words.json cues are segment-local; host starts at segment 0.16, so comp-local = segment time - 0.16.
     Sunday @0.16 -> 0.00 | 9th, @0.96 -> 0.80 | island. @4.24 -> 4.08 | In @7.54 -> 7.38 | a @8.78 -> 8.62 | film @8.88 -> 8.72
     24th @15.00 -> 14.84 | Library @16.66 -> 16.50 | segment end 18.64 -> 18.48; host = 19.48 (land time 1.0) */
  tl.set([P+"src", P+"scrim", P+"pop", P+"big", P+"sub", P+"chip"], {autoAlpha:0}, 0);
  tl.set(".g-a5-1-film-ch", {autoAlpha:0}, 0);

  /* SUNDAY @0.00: popfig in (scale 1.35 -> 1), sub rises in 0.15 s after (a scaled sub overlapped the big line mid-entrance); wrapper just un-hides */
  tl.set(P+"pop", {autoAlpha:1}, 0);
  tl.to(P+"scrim", {autoAlpha:1, duration:0.4, ease:"power2.out"}, 0);
  tl.fromTo(P+"big", {autoAlpha:0, scale:1.35}, {autoAlpha:1, scale:1, duration:0.5, ease:"power4.out"}, 0);
  tl.fromTo(P+"sub", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 0.15);
  /* 9th, @0.80: red line pulse 1 -> 1.05 -> 1 */
  tl.to(P+"big", {scale:1.05, duration:0.15, ease:"power2.out"}, 0.8);
  tl.to(P+"big", {scale:1, duration:0.15, ease:"power2.in"}, 0.95);
  /* popfig drift 0.50 to 3.94 */
  tl.to(P+"pop", {y:-4, duration:1.72, ease:"sine.inOut", yoyo:true, repeat:1}, 0.5);
  /* island. @4.08: popfig out 3.94 to 4.39 (gone well before the film cut at 7.38) */
  tl.to(P+"pop", {scale:0.92, autoAlpha:0, duration:0.45, ease:"power2.in"}, 3.94);
  tl.to(P+"scrim", {autoAlpha:0, duration:0.45, ease:"power2.in"}, 3.94);

  /* In @7.38: film starts on the lower track; source line in at 7.54 */
  tl.fromTo(P+"src", {autoAlpha:0, y:8}, {autoAlpha:0.8, y:0, duration:0.4, ease:"power2.out"}, 7.54);
  tl.to(P+"src", {y:-4, duration:2.4, ease:"sine.inOut", yoyo:true, repeat:3}, 7.94);

  /* a/film @8.62: chip main line in (tag line waits for 24th) */
  tl.fromTo(P+"chip", {autoAlpha:0, y:24, scale:0.94}, {autoAlpha:1, y:0, scale:1, duration:0.45, ease:"back.out(1.6)"}, 8.62);
  tl.to(P+"chip", {y:-4, duration:2.4, ease:"sine.inOut", yoyo:true, repeat:2}, 9.07);

  /* 24th @14.84: tag types on over 0.4 s, 15 characters */
  tl.to(".g-a5-1-film-ch", {autoAlpha:1, duration:0.01, ease:"none", stagger:0.4/15}, 14.84);

  /* Library @16.50: source line brightens */
  tl.to(P+"src", {opacity:1, duration:0.3, ease:"power2.out"}, 16.5);

  /* exit: chip slides out in the last 0.6 s of the narration (ends 18.48); source fades in the last 0.3 s */
  tl.to(P+"chip", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 17.88);
  tl.to(P+"src", {autoAlpha:0, duration:0.3, ease:"power2.in"}, 18.18);
  /* land time to the host end 19.48 */
  tl.to(P+"scrim", {y:0, duration:0.01, ease:"none"}, 19.47);
  window.__timelines["g-a5-1-film"] = tl;
})();
