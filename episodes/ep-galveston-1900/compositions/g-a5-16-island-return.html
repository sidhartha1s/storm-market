  tl.to(P+"wgulf", {x: 240, duration: END, ease: "none"}, 0);

  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0.16);

  tl.to(P+"cam", {scale: 1.0, duration: 2.90, ease: "none"}, 0.22);
  tl.to(P+"cam", {scale: 1.03, duration: END - 3.12, ease: "none"}, 3.12);

  tl.to(P+"sand", {autoAlpha: 0.25, duration: 0.6, ease: "power2.out"}, 2.90);
  tl.to(P+"sand", {autoAlpha: 0, duration: 0.44, ease: "power2.in"}, 3.50);

  tl.to([P+"bracket", P+"tick0", P+"lsea"], {autoAlpha: 1, duration: 0.25, ease: "power2.out"}, 3.94);

  tl.to(P+"gold", {autoAlpha: 1, duration: 0.35, ease: "power2.out"}, 5.0);

  tl.to(P+"c1", {y: -4, duration: 1.2, ease: "sine.inOut"}, 5.51);
  /* with @16.02: C1 dims */
  tl.to(P+"c1", {opacity: 0.6, duration: 0.3, ease: "power2.out"}, 6.08);

  tl.fromTo(wrecks, {opacity: 0.7}, {opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.02, immediateRender: false}, 6.52);

  tl.fromTo(P+"c2", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 6.94);
  tl.to(P+"c2", {y: -4, duration: 0.67, ease: "sine.inOut"}, 7.39);

  tl.to([P+"c1", P+"c2"], {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 8.06);

  tl.to(P+"gulfhi", {autoAlpha: 0, duration: 0.5, ease: "power2.in"}, 9.50);
