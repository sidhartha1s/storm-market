  Claim: the Monthly Weather Review of September 1900 (the issue that carried Cline's report) says September hurricanes
  sometimes recurve north and northeast along the Atlantic coast and disappear past Newfoundland, and others pass
  westward over the Gulf of Mexico. Source: MWR Sept 1900 p. 395 (E. B. Garriott). Textbook roads, not the 1900 track:
  no date and no "1900" on the map part.

  Part A (0 to 7.98): MWR p. 395 scan (media/candidates/a3/A3-S2_c1_mwr-sept1900-p395_recurve-statement.png, 1150 x 1566).
    Crop = right text column, image x 575..1060, y 434..787, shown at 2.557 x in a 1240 x 903 box (left 280, top 120, centred x 900).
    Top and bottom box edges fade out (mask) so a partly shown line is never read; left/right keep whole lines at the
    full 1.06 push (margin 43 px each side, the push adds at most 19 px).
    Measured on the scan (image px): quoted sentence = line 536-549 from x ~893 ("The hurricanes of", start x read by eye) to 1037;
    lines 553-599 full width 592-1037; last line 603-616 from 592 to ~826 ("over the Gulf of Mexico.", end x read by eye).
