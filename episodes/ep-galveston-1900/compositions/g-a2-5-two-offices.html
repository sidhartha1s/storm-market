  Claim: after the 1898 war the Weather Bureau moved its hurricane warning center from Jamaica to Havana; its office there
  (Stockman) kept the islands and ships informed. Havana had two weather offices and only the Bureau's answered to Washington;
  the Washington line was the one Galveston listened to. The war is dated, the move is not: 1898 is never on screen with the arrow.

  BASE OF THE a2 MAP FAMILY: g-a2-7 and g-a2-8 copy this extended plate, the pins and the wire layer.
  PLATE (one coordinate system, same as g-intro-4; every point computed by the formula, never placed by eye):
    X = (lon + 100) * 90        Y = (41 - lat) * 103.95        (equirectangular, north up)
    Drawn box EXTENDED east and south for the Caribbean: lon -110..-50, lat 5..46 (X -900..4500, Y -520..3742).
  BASEMAP (between BASEMAP markers, path data in plate units, do not hand-edit):

<script>

(function () {
  const P = "#g-a2-5-two-offices-";
  const $ = function (n) { return document.getElementById("g-a2-5-two-offices-" + n); };
  const proj = function (lon, lat) { return [(lon + 100) * 90, (41 - lat) * 103.95]; };
  const GAL = proj(-94.80, 29.30), HAV = proj(-82.38, 23.13), WAS = proj(-77.04, 38.90);
  const KIN = proj(-76.79, 17.99), PAP = proj(-72.34, 18.54), SDO = proj(-69.93, 18.47), SJU = proj(-66.11, 18.47);
  const SHP = proj(-70.00, 23.50);
  const DUR = 24.092;

  /* camera: pure function of comp time */
  const ease = gsap.parseEase("power2.inOut");
  const lerp = function (a, b, u) { return a + (b - a) * u; };
  function logLerpScale(fromScale, toScale, t) {
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  const marks = [[$("hav-at"), HAV], [$("kin-at"), KIN], [$("pap-at"), PAP], [$("sdo-at"), SDO], [$("sju-at"), SJU],
                 [$("shp-at"), SHP], [$("was-at"), WAS], [$("gal-at"), GAL]];
  const camEl = $("cam");
  function camAt(t) {
    let cx = 2376, cy = 2204.5, s;
    if (t < 8.8) { s = 0.80 + 0.02 * (t / 8.8); }                                /* V-CARIB drift 0.80 -> 0.82, ease none */
    else if (t < 19.30) { s = 0.82; }
    else if (t < 20.40) {                                                       /* pull-out to V-ALL, log-space scale */
      const u = ease((t - 19.30) / 1.10);
      s = logLerpScale(0.82, 0.42, u); cx = lerp(2376, 1760, u); cy = lerp(2204.5, 1305, u);
    }
    else { cx = 1760; cy = 1305; s = 0.42; }                                     /* V-ALL */
    camEl.setAttribute("transform", "translate(" + (960 - cx * s).toFixed(2) + "," + (540 - cy * s).toFixed(2) + ") scale(" + s.toFixed(5) + ")");
    for (let i = 0; i < marks.length; i++) {
      const p = marks[i][1];
      marks[i][0].setAttribute("transform", "translate(" + (960 + (p[0] - cx) * s).toFixed(2) + "," + (540 + (p[1] - cy) * s).toFixed(2) + ")");
    }
  }
  camAt(0);

  /* arrowhead at Havana: tip 9 units short of the end (the pin's edge) along the end tangent (end - control), 39 long, 39 wide (32 px at s 0.82) */
  const END = HAV, CTL = [1990, 1990];
  const dl = Math.hypot(END[0] - CTL[0], END[1] - CTL[1]);
  const dx = (END[0] - CTL[0]) / dl, dy = (END[1] - CTL[1]) / dl;
  const tip = [END[0] - dx * 9, END[1] - dy * 9], base = [tip[0] - dx * 39, tip[1] - dy * 39];
  $("head").setAttribute("points", [tip, [base[0] - dy * 19.5, base[1] + dx * 19.5], [base[0] + dy * 19.5, base[1] - dx * 19.5]]
    .map(function (q) { return q[0].toFixed(1) + "," + q[1].toFixed(1); }).join(" "));

  const AL = Math.ceil($("arrow").getTotalLength()) + 1;                         /* dash lengths: ceil(len)+1 */
  const WL = Math.ceil(Math.hypot(WAS[0] - GAL[0], WAS[1] - GAL[1])) + 1;
  const PULSE_DASH = "95 " + (WL + 200);

  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()) } }, 0);

  /* 0.00: plate in V-CARIB from frame 0, Havana and Jamaica pins pulsing with labels on; source line slides in */

  tl.set(P + "pulse", { strokeDasharray: PULSE_DASH, strokeDashoffset: 95 }, 0);

  tl.fromTo(P + "kin-ring", { scale: 1, opacity: 0.8, transformOrigin: "50% 50%" }, { scale: 2.2, opacity: 0, transformOrigin: "50% 50%", duration: 1.4, ease: "power1.out", repeat: 16 }, 0.0);

  /* WAR @1.28: chip 1 rises, landing as "1898." is said at 2.20; floats; exits up on "Cuba," 5.52 -> 5.92 */

  tl.to(P + "chip1", { autoAlpha: 0, y: -24, duration: 0.4, ease: "power2.in" }, 5.52);

  tl.to(P + "chip2", { y: 4, duration: 0.95, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.20);
  /* FROM @8.86: arrow draws Jamaica -> Havana, head lands on "Havana." 9.80, Havana gains its blue outer ring */
  tl.set(P + "arrow", { autoAlpha: 1 }, 8.86);
  tl.to(P + "arrow", { strokeDashoffset: 0, duration: 0.94, ease: "power2.inOut" }, 8.86);
  tl.fromTo(P + "head", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.18, ease: "back.out(2)" }, 9.62);
  tl.fromTo(P + "hav-blue", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, 9.80);
  tl.to(P + "chip2", { autoAlpha: 0, y: -24, duration: 0.4, ease: "power2.in" }, 10.24);

  tl.fromTo(P + "inset", { autoAlpha: 0, scale: 0.94, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.45, ease: "back.out(1.4)" }, 10.64);
  tl.fromTo(P + "leader", { autoAlpha: 1, attr: { x2: 316, y2: 270 } }, { autoAlpha: 1, attr: { x2: 340, y2: 541 }, duration: 0.45, ease: "power2.out" }, 10.64);
  tl.to(P + "inset", { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 11.10);

  /* STOCKMAN @12.38: inset row 1 (Bureau pin, name, Stockman) */
  tl.fromTo(P + "row1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.38);

  /* ISLANDS @14.26: lines from Havana, 0.15 s apart, 0.5 s each; each pin and label in as its line lands */

  tl.fromTo(P + "lpap", { autoAlpha: 1, attr: { x2: HAV[0], y2: HAV[1] } }, { autoAlpha: 1, attr: { x2: PAP[0], y2: PAP[1] }, duration: 0.5, ease: "power2.out" }, 14.41);
  tl.fromTo(P + "lsdo", { autoAlpha: 1, attr: { x2: HAV[0], y2: HAV[1] } }, { autoAlpha: 1, attr: { x2: SDO[0], y2: SDO[1] }, duration: 0.5, ease: "power2.out" }, 14.56);
  tl.fromTo(P + "lsju", { autoAlpha: 1, attr: { x2: HAV[0], y2: HAV[1] } }, { autoAlpha: 1, attr: { x2: SJU[0], y2: SJU[1] }, duration: 0.5, ease: "power2.out" }, 14.71);
  tl.fromTo(P + "pap", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 14.91);
  tl.fromTo(P + "sdo", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 15.06);
  tl.fromTo(P + "sju", { autoAlpha: 0, scale: 0, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.25, ease: "back.out(2)" }, 15.21);
  tl.fromTo(P + "lhai", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 14.91);
  tl.fromTo(P + "lsdl", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 15.06);
  tl.fromTo(P + "lpr", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 15.21);

  /* SHIPS @15.00: ships line, glyph and label; the steamer bobs +-3 px */
  tl.fromTo(P + "lshp", { autoAlpha: 1, attr: { x2: HAV[0], y2: HAV[1] } }, { autoAlpha: 1, attr: { x2: SHP[0], y2: SHP[1] }, duration: 0.5, ease: "power2.out" }, 15.00);
  tl.fromTo(P + "shp", { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(2)" }, 15.40);
  tl.fromTo(P + "lshl", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power3.out" }, 15.45);
  tl.fromTo(P + "shp", { y: -3 }, { y: 3, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 8, immediateRender: false }, 15.70);

  /* TWO OFFICES @17.40: inset row 2 (Belen) */
  tl.fromTo(P + "row2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 17.40);

  /* ONLY @18.86: the Bureau pin flashes; then every V-CARIB label, the inset and the leader clear 18.96 -> 19.30 */
  tl.to(P + "ipin1", { scale: 1.5, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 18.86);
  tl.to([P + "lhav", P + "ljam", P + "lhai", P + "lsdl", P + "lpr", P + "lshl", P + "inset", P + "leader"],
        { autoAlpha: 0, duration: 0.34, ease: "power2.in" }, 18.96);

  /* 19.30 -> 20.40: camera pulls V-CARIB -> V-ALL (camAt) */
  /* WASHINGTON @20.12: pin drops in at its moving point; Havana -> Washington wire draws to 20.80 */
  tl.fromTo(P + "was", { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 20.12);
  tl.fromTo(P + "whw", { autoAlpha: 1, attr: { x2: HAV[0], y2: HAV[1] } }, { autoAlpha: 1, attr: { x2: WAS[0], y2: WAS[1] }, duration: 0.68, ease: "power2.inOut" }, 20.12);
  /* 20.40: settled; Galveston pin (unlit) fades in; V-ALL labels in */
  tl.fromTo(P + "gal", { autoAlpha: 0, scale: 0.5, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.out" }, 20.40);
  tl.fromTo(P + "lwas", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 20.40);
  tl.fromTo(P + "lgal", { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 20.40);
  tl.fromTo(P + "lhav2", { autoAlpha: 0, x: 16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 20.40);
  tl.fromTo(P + "was-ring", { scale: 1, opacity: 0.8, transformOrigin: "50% 50%" }, { scale: 2.2, opacity: 0, transformOrigin: "50% 50%", duration: 1.4, ease: "power1.out", repeat: 1 }, 20.60);

  tl.fromTo(P + "wwg", { autoAlpha: 1, attr: { x2: WAS[0], y2: WAS[1] } }, { autoAlpha: 1, attr: { x2: GAL[0], y2: GAL[1] }, duration: 0.82, ease: "power2.inOut" }, 21.38);

  tl.set(P + "pulse", { autoAlpha: 1 }, 22.90);
  tl.to(P + "pulse", { strokeDashoffset: -WL, duration: 0.72, ease: "power1.inOut" }, 22.90);
  tl.to(P + "gal-dot", { attr: { r: 7 }, fill: "#f2f5f8", duration: 0.25, ease: "power2.out" }, 23.45);
  tl.to(P + "gal", { scale: 1.6, transformOrigin: "50% 50%", duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 23.45);
  tl.fromTo(P + "gal-glow", { autoAlpha: 0 }, { autoAlpha: 0.6, duration: 0.25, ease: "power2.out" }, 23.45);

  /* exit: cut to the A2-S5 desk, whole root fades over the last 0.35 s */
  tl.to(P + "root", { autoAlpha: 0, duration: 0.35, ease: "power1.in" }, 23.742);

  window.__timelines["g-a2-5-two-offices"] = tl;
})();
