<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a1-4-overflow-";
  const q = function(id) { return document.querySelector(P + id); };
  /* a1-s3.words.json, host = segment start (A1-S3 0.00 to 5.46), comp-local = word time.
     sand 0.64 · Gulf, 1.60 · high 3.12 · over 4.14 · swept 3.86 · beachfront. 4.52 · Down 5.46 (cut).
     Timeline ends 5.50; the fade-through sits in the last 0.3 s. */

  /* --- place the 22 houses on the profile, evenly by arc length (x 560 to 1360), visible from frame 0 --- */
  const PTS = [[360,780],[520,640],[720,620],[900,432],[1020,432],[1200,620],[1400,640],[1560,780]];
  const yAt = function(x) {
    for (let i = 0; i < PTS.length - 1; i++) {
      const a = PTS[i], b = PTS[i + 1];
      if (x >= a[0] && x <= b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
    return 780;
  };
  const xs = [], arc = [0];
  for (let x = 560; x <= 1360; x += 0.5) xs.push(x);
  for (let i = 1; i < xs.length; i++) arc.push(arc[i - 1] + Math.hypot(0.5, yAt(xs[i]) - yAt(xs[i - 1])));
  const total = arc[arc.length - 1];
  for (let k = 0, j = 0; k < 22; k++) {
    const want = total * k / 21;
    while (j < arc.length - 1 && arc[j] < want) j++;
    tl.set(q("h" + k), {x: xs[j], y: yAt(xs[j])}, 0);
  }

  /* --- start states --- */
  tl.set([P+"src", P+"lgulf", P+"head", P+"tag", P+"sheet", P+"leader"], {autoAlpha: 0}, 0);
  tl.set([P+"lgulf", P+"head"], {xPercent: -50}, 0);
  tl.set(P+"cam", {svgOrigin: "960 780"}, 0);

  /* --- whole-window motion: waves (phase as x, ease none) and a slow camera push 1.00 -> 1.03 about the datum foot --- */
  /* host window is 6.75 (index.html mount), so the whole-window motion runs to 6.75 */
  const HOST = 6.75;
  tl.to(P+"wgulf", {x: 135, duration: HOST, ease: "none"}, 0);
  tl.to(P+"wbay", {x: -91, duration: HOST, ease: "none"}, 0);
  tl.to(P+"cam", {scale: 1.037, duration: HOST, ease: "none"}, 0);

  /* ISLAND @0.00: finished cross-section on frame 0; source line in, then drifts */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out"}, 0);
  tl.to(P+"src", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1}, 0.4);

  /* sand @0.64: headline in, then drifts */
  tl.fromTo(P+"head", {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out"}, 0.64);
  tl.to(P+"head", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1}, 0.99);

  /* Gulf @1.60: water label in, then drifts */
  tl.fromTo(P+"lgulf", {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out"}, 1.6);
  tl.to(P+"lgulf", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1}, 1.95);

  /* OVERFLOW @3.86: sheet runs up the beach slope from "high" 3.12 to x 451 on "beachfront." 4.52, back down 4.60 to 5.30 */
  tl.set(P+"sheet", {autoAlpha: 1}, 3.12);
  tl.fromTo(P+"csheetr", {attr: {width: 0}}, {attr: {width: 91}, duration: 1.4, ease: "power2.out"}, 3.12);
  tl.to(P+"csheetr", {attr: {width: 0}, duration: 0.7, ease: "power2.in"}, 4.6);

  /* swept @3.86: tag and leader in; tag stays, drifts */
  tl.fromTo(P+"tag", {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out"}, 3.86);
  tl.set(P+"leader", {autoAlpha: 1}, 3.86);
  tl.to(P+"leader", {strokeDashoffset: 0, duration: 0.4, ease: "power2.out"}, 3.86);
  tl.to(P+"tag", {y: -4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1}, 4.21);
  /* hold 5.46 to the host end: head, label and tag keep floating so the finished plate never freezes */
  tl.to([P+"head", P+"lgulf"], {y: 0, duration: 1.2, ease: "sine.inOut"}, 5.46);
  tl.to(P+"tag", {y: -4, duration: 0.9, ease: "sine.inOut"}, 5.61);

  /* exit: fade-through to the coast map at the host end, root to 0 over the last 0.3 s */
  tl.to(P+"root", {autoAlpha: 0, duration: 0.3, ease: "power1.in"}, HOST - 0.3);
  window.__timelines["g-a1-4-overflow"] = tl;
})();
</script>
