    The plate is turned so the island lies level (bay on top, Gulf at the bottom, as the brief's grid and labels need);

      <rect id="g-a4-2-half-city-zbay" class="ga42-zone ga42-hide" x="314" y="318" width="1292" height="168"/>
      <rect id="g-a4-2-half-city-zgulf" class="ga42-zone ga42-hide" x="314" y="662" width="1292" height="168"/>

      <!-- buggy route on the street between columns 6 and 7 (x 952..968, centre 960) -->
      <line id="g-a4-2-half-city-trail" class="ga42-hide" x1="960" y1="300" x2="960" y2="848" stroke="#e8c56a" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round"/>
    </svg>

    <!-- map labels (ride the push) -->
    <div class="ga42-geo" id="g-a4-2-half-city-bay" style="left:780px; top:228px; width:240px;">Galveston Bay</div>
    <div class="ga42-geo" id="g-a4-2-half-city-gulf" style="left:760px; top:889px; width:400px;">Gulf of Mexico</div>
    <div class="ga42-lab ga42-hide" id="g-a4-2-half-city-baylab" style="left:300px; top:280px;">Bay side</div>
    <div class="ga42-lab ga42-hide" id="g-a4-2-half-city-gulflab" style="left:300px; top:840px;">Gulf side</div>

    <!-- buggy: 48 x 32 side view, centred on x 960; moves by GSAP y only -->
    <svg class="ga42-buggy ga42-hide" id="g-a4-2-half-city-buggy" viewBox="0 0 48 32" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="9" width="26" height="10" rx="2" fill="#e8c56a"/>
      <rect x="24" y="1" width="5" height="10" rx="1" fill="#e8c56a"/>
      <line x1="32" y1="14" x2="47" y2="12" stroke="#e8c56a" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="13" cy="24" r="7" fill="none" stroke="#e8c56a" stroke-width="2.5"/>
      <circle cx="31" cy="26" r="5" fill="none" stroke="#e8c56a" stroke-width="2.5"/>
    </svg>

    <!-- pin at (1014, 617), centre of block col 7 row 3 (schematic) -->
    <svg class="ga42-pin ga42-hide" id="g-a4-2-half-city-pin" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
      <circle id="g-a4-2-half-city-halo" cx="30" cy="30" r="13" fill="none" stroke="#f2f5f8" stroke-width="2" opacity="0"/>
      <circle cx="30" cy="30" r="11" fill="#d0121f" stroke="#f2f5f8" stroke-width="4"/>
    </svg>
    <div class="ga42-lab ga42-hide" id="g-a4-2-half-city-pinlab" style="left:1040px; top:600px;">25th St &amp; Q</div>
  </div>

  <!-- HUD (fixed): leader, north arrow, notes, source line, chips -->
  <svg class="ga42-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <line id="g-a4-2-half-city-lead" class="ga42-hide" x1="0" y1="0" x2="1014" y2="617" stroke="#d8a13a" stroke-width="1"/>
    <g id="g-a4-2-half-city-north">
      <path d="M0,-30 L9,4 L0,-3 L-9,4Z" fill="#93a3b2"/>
      <text x="0" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="19" fill="#93a3b2">N</text>
    </g>
  </svg>
  <div class="ga42-small" id="g-a4-2-half-city-note" style="left:96px; top:1000px;">Street grid: schematic</div>
  <div class="ga42-src" id="g-a4-2-half-city-src">Isaac Cline, Monthly Weather Review, September 1900, p. 373</div>

  <div class="ga42-chip ga42-hide" id="g-a4-2-half-city-c1" style="left:96px;">
    <div class="ga42-main" id="g-a4-2-half-city-c1m">ABOUT HALF THE CITY</div>
    <div class="ga42-tag" id="g-a4-2-half-city-c1t">streets under water · p. 373</div>
  </div>
  <div class="ga42-chip ga42-hide" id="g-a4-2-half-city-c2" style="right:96px;">
    <div class="ga42-main" id="g-a4-2-half-city-c2m">CLINE'S HOUSE, 1900: 5.2 FT</div>
    <div class="ga42-tag" id="g-a4-2-half-city-c2t">ground elevation, his report</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-a4-2-half-city";
  const P = "#" + ID + "-";
  const $ = function (n) { return document.getElementById(ID + "-" + n); };
  const root = $("root");
  const D = 7.03;   /* host: 625.205 to 632.238 (nx-a4-s2 start) */

  /* PROJECTION (header): island axis from the ring's own SW and NE tips, NE tip pinned at (XT, YT) */
  const SW = [439.51, 1238.15], NE = [474.80, 1212.77];
  const S = 135, XT = 2120, YT = 850;
  const L = Math.hypot(NE[0] - SW[0], NE[1] - SW[1]);
  const UX = (NE[0] - SW[0]) / L, UY = (NE[1] - SW[1]) / L;   /* along the island, to the NE tip */
  const VX = -UY, VY = UX;                                      /* across it, toward the Gulf */
  $("plate").setAttribute("transform", "matrix(" + [S * UX, S * VX, S * UY, S * VY,
    XT - S * (UX * NE[0] + UY * NE[1]), YT - S * (VX * NE[0] + VY * NE[1])].map(function (n) { return n.toFixed(4); }).join(",") + ")");
  /* north arrow: plate north (0,-1) on screen, bottom-left in the Gulf, clear of notes */
  const northDeg = Math.atan2(-UY, UX) * 180 / Math.PI;
  $("north").setAttribute("transform", "translate(132,936) rotate(" + northDeg.toFixed(2) + ")");

  /* self-check: grid corners and pin must sit on the island polygon (screen -> plate, then isPointInFill) */
  const isl = $("isl");
  if (isl.isPointInFill) {
    [[320, 324], [1600, 324], [320, 824], [1600, 824], [1014, 617]].forEach(function (q) {
      const a = (q[0] - XT) / S, b = (q[1] - YT) / S;
      const pt = new DOMPoint(NE[0] + a * UX + b * VX, NE[1] + a * UY + b * VY);
      if (!isl.isPointInFill(pt)) console.error(ID + ": grid point " + q + " is off the island polygon");
    });
  }

  /* dash lengths: ceil(len)+1 from the shapes themselves */
  const dl = function (el) { return Math.ceil(el.getTotalLength()) + 1; };
  const blocks = root.querySelectorAll(".ga42-blk");
  const DB = dl(blocks[0]), DZ = dl($("zbay")), DT = dl($("trail"));

  /* C2 leader: from C2's bottom-left corner (layout box, unaffected by transforms) to the pin, which the push moves */
  const c2 = $("c2"), lead = $("lead");
  const LX = c2.offsetLeft, LY = c2.offsetTop + c2.offsetHeight;
  lead.setAttribute("x1", LX); lead.setAttribute("y1", LY);
  const PIN = [1014, 617], PUSH = 0.03;
  function pinAt(k) {
    const x = 960 + (PIN[0] - 960) * k, y = 540 + (PIN[1] - 540) * k;
    lead.setAttribute("x2", x.toFixed(2)); lead.setAttribute("y2", y.toFixed(2));
  }
  pinAt(1);
  const DL = Math.ceil(Math.hypot(960 + (PIN[0] - 960) * (1 + PUSH) - LX, 540 + (PIN[1] - 540) * (1 + PUSH) - LY)) + 1;

  const tl = gsap.timeline({ paused: true });

  /* whole window: map push 1.00 -> 1.03 (linear, under 1.5x), ripples drift */
  tl.set(P + "map", { scale: 1, transformOrigin: "960px 540px" }, 0);
  tl.to(P + "map", { scale: 1 + PUSH, duration: D, ease: "none",
    onUpdate: function () { pinAt(1 + PUSH * this.progress()); } }, 0);
  tl.set([P + "rp1", P + "rp2", P + "rp3", P + "rp4"], { x: 0 }, 0);
  tl.to(P + "rp1", { x: 90, duration: D, ease: "none" }, 0);
  tl.to(P + "rp2", { x: -80, duration: D, ease: "none" }, 0);
  tl.to(P + "rp3", { x: 70, duration: D, ease: "none" }, 0);
  tl.to(P + "rp4", { x: 80, duration: D, ease: "none" }, 0);

  /* START @4.58: grid strokes draw in row by row, bay to Gulf, 0 to 0.4 */
  tl.set(blocks, { strokeDasharray: DB + " " + DB, strokeDashoffset: DB }, 0);
  ["r6", "r5", "r4", "r3", "r2", "r1"].forEach(function (r, i) {
    tl.to(root.querySelectorAll(P + r + " rect"), { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, i * 0.04);
  });
  tl.set([P + "zbay", P + "zgulf"], { strokeDasharray: DZ + " " + DZ, strokeDashoffset: DZ }, 0);
  tl.set(P + "trail", { strokeDasharray: DT + " " + DT, strokeDashoffset: DT }, 0);
  tl.set(P + "buggy", { y: 0 }, 0);
  tl.set(P + "pin", { y: -40 }, 0);
  tl.set(P + "lead", { strokeDasharray: DL + " " + DL, strokeDashoffset: DL }, 0);

  /* BAY @5.24 (0.66): buggy at the top street end, bay outline draws and pulses twice, label in */
  tl.fromTo(P + "buggy", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.66);
  tl.fromTo(P + "zbay", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1, ease: "none" }, 0.66);
  tl.to(P + "zbay", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.66);
  tl.to(P + "zbay", { opacity: 0.3, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0.96);
  tl.fromTo(P + "baylab", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.66);

  /* THEN @6.52 (1.94): buggy runs south along x 960 to (960, 848), trail draws with it */
  tl.set(P + "trail", { autoAlpha: 1 }, 1.94);
  tl.to(P + "buggy", { y: 548, duration: 0.68, ease: "power2.inOut" }, 1.94);
  tl.to(P + "trail", { strokeDashoffset: 0, duration: 0.68, ease: "power2.inOut" }, 1.94);

  /* GULF @6.82 (2.24): Gulf outline draws and pulses twice, label in */
  tl.fromTo(P + "zgulf", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1, ease: "none" }, 2.24);
  tl.to(P + "zgulf", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.24);
  tl.to(P + "zgulf", { opacity: 0.3, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.54);
  tl.fromTo(P + "gulflab", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.24);

  /* FLOOD @7.00 (2.42): 36 blocks, rows 1-3 from the Gulf up, stagger 0.02, last lands 3.22 (= 7.80) */
  tl.fromTo(root.querySelectorAll(".ga42-fl"), { autoAlpha: 0, scaleY: 0, transformOrigin: "50% 100%" },
    { autoAlpha: 1, scaleY: 1, transformOrigin: "50% 100%", duration: 0.1, ease: "power2.out", stagger: 0.02 }, 2.42);
  /* C1 @7.00 */
  tl.fromTo(P + "c1", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.42);
  /* HIS @7.92 (3.34): C1 out */
  tl.to(P + "c1", { x: 980, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 3.34);

  /* HOUSE @8.20 (3.62): pin drops in, label in, ring pulses every 1.2 s */
  tl.fromTo(P + "pin", { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 3.62);
  tl.fromTo(P + "pinlab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.72);
  tl.fromTo(P + "halo", { scale: 1, opacity: 0.9, svgOrigin: "30 30" },
    { scale: 2, opacity: 0, svgOrigin: "30 30", duration: 1.2, ease: "power1.out", repeat: 2 }, 4.12);

  /* 5.2 @10.06 (5.48): C2 in, leader draws to the pin */
  tl.fromTo(P + "c2", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.48);
  tl.set(P + "lead", { autoAlpha: 1 }, 5.58);
  tl.to(P + "lead", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.58);

  /* EXIT: C2 slides out in the last 0.6 s, leader goes with it; cut to A4-S2 */
  tl.to(P + "c2", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, D - 0.6);
  tl.to(P + "lead", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, D - 0.6);

  window.__timelines[ID] = tl;
})();
</script>
</template>
