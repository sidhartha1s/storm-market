<script>
window.__timelines = window.__timelines || {};
(function() {
  /* comp-local time = a3-s4 word time - 8.06; host 8.06 to 14.20 plus 0.94 s land = 7.14 s */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a3-5-barometer-";
  const N = P + "needle";
  const ROT = { svgOrigin: "760 560" };

  tl.set(N, { rotation: 0, svgOrigin: "760 560" }, 0);
  tl.set(P + "stack", { x: 0, y: 0 }, 0);

  /* THEN @8.06: finished dial on the cut, source line and row 1 in, needle at 29.87 (-40.05 deg) */
  tl.fromTo(P + "src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 0);
  tl.fromTo(P + "r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
  tl.to(N, Object.assign({ rotation: 0.4, duration: 0.45, ease: "sine.inOut" }, ROT), 0.1);
  tl.to(N, Object.assign({ rotation: 0, duration: 0.39, ease: "sine.inOut" }, ROT), 0.55);
  /* cards drift y +-4 for the whole window (sine, 1.2 s halves, 5 legs; 2.4 s would leave one turn in a 6.5 s window) */
  tl.to(P + "stack", { y: -4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0.4);

  /* BAROMETER @9.00: needle shivers +-1 deg */
  tl.to(N, Object.assign({ rotation: -1, duration: 0.1, ease: "sine.inOut" }, ROT), 0.94);
  tl.to(N, Object.assign({ rotation: 1, duration: 0.14, ease: "sine.inOut" }, ROT), 1.04);
  tl.to(N, Object.assign({ rotation: -0.6, duration: 0.14, ease: "sine.inOut" }, ROT), 1.18);
  tl.to(N, Object.assign({ rotation: 0.5, duration: 0.18, ease: "sine.inOut" }, ROT), 1.32);
  tl.to(N, Object.assign({ rotation: 0, duration: 0.48, ease: "sine.inOut" }, ROT), 1.5);

  /* FALL @10.04: needle to 29.60 (-76.50 deg, delta -36.45) 10.04 to 10.60; row 2 lands with the needle */
  tl.to(N, Object.assign({ rotation: -36.45, duration: 0.56, ease: "power2.inOut" }, ROT), 1.98);
  tl.to(P + "trail", { strokeDashoffset: 461.4, duration: 0.56, ease: "power2.inOut" }, 1.98);
  tl.fromTo(P + "r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.54);
  /* BY @10.76: needle to 29.25 (-123.75 deg, delta -83.70) 10.76 to 11.38; row 3 lands with the needle */
  tl.to(N, Object.assign({ rotation: -83.7, duration: 0.62, ease: "power2.inOut" }, ROT), 2.7);
  tl.to(P + "trail", { strokeDashoffset: 271.4, duration: 0.62, ease: "power2.inOut" }, 2.7);
  tl.fromTo(P + "r3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.32);
  /* needle settles at 29.25 (within +-0.5 deg) until "28" */
  tl.to(N, Object.assign({ rotation: -83.2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, ROT), 3.4);

  /* 28.75 @12.52: needle to 28.75 (-191.25 deg, delta -151.20) 12.52 to 13.30, power2.out */
  tl.to(N, Object.assign({ rotation: -151.2, duration: 0.78, ease: "power2.out" }, ROT), 4.46);
  tl.to(P + "trail", { strokeDashoffset: 0, duration: 0.78, ease: "power2.out" }, 4.46);
  /* .75 @13.02: row 4 enters (needle at about 28.81 here); fully landed at 13.32 as the needle lands */
  tl.fromTo(P + "r4", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.96);
  /* 13.30: reading turns red, small punch */
  tl.to(P + "v4", { color: "#d0121f", duration: 0.25, ease: "power2.out" }, 5.24);
  tl.fromTo(P + "v4", { scale: 1 }, { scale: 1.08, transformOrigin: "left center", duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 5.24);
  /* needle settles at 28.75 (within +-0.5 deg) to the end */
  tl.to(N, Object.assign({ rotation: -150.7, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, ROT), 5.3);
  tl.to(N, Object.assign({ rotation: -151.6, duration: 0.42, ease: "sine.inOut", yoyo: true, repeat: 1 }, ROT), 6.1);

  /* exit: cards slide out in the last 0.6 s (6.54 to 7.14), dial holds to the cut into A3-S5's sea */
  tl.to(P + "stack", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 6.54);

  window.__timelines["g-a3-5-barometer"] = tl;
})();
