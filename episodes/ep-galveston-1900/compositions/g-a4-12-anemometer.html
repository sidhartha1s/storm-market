  <div id="g-a4-12-anemometer-cw2" class="g-a4-12-cw"><div id="g-a4-12-anemometer-c2" class="g-a4-12-chip"><div class="g-a4-12-main">AT LEAST 120 MPH</div><div class="g-a4-12-tag">Cline's estimate, before 8 PM</div></div></div>

<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a4-12-anemometer-";
  /* TIMING: audio/a4-s7.words.json, host starts at segment 8.86, comp-local = word time - 8.86 (host 0.00 to 10.40).
     At @8.86 (ROOF, local 0.00) ; 6 @8.98 ; .15 @9.22 (local 0.36, spin speeds up) ; clocked @12.02 (local 3.16, C1 in) ;
     84 @12.42 (3.56) ; Then @14.20 (5.34, C1 out) ; blew @14.90 (6.04, tear-off) ; the @16.56 (7.70, C2 in) ;
     least @17.78 (8.92) ; hour. ends @19.26 (10.40) */

  /* hidden states (CSS hides them too); transforms start here */
  tl.set(P+"src", {autoAlpha:0}, 0);
  tl.set(P+"note", {autoAlpha:0}, 0);
  tl.set(P+"flash", {autoAlpha:0}, 0);
  tl.set([P+"c1", P+"c2"], {autoAlpha:0, y:24, x:0, scale:0.94}, 0);
  tl.set([P+"cw1", P+"cw2"], {y:0}, 0);
  tl.set(P+"rotor", {x:0, y:0, rotation:0, svgOrigin:"760 400"}, 0);
  tl.set(P+"mast", {rotation:0, svgOrigin:"760 820"}, 0);

  /* frame 0: roof, mast, spinning rotor; source line and note come in */
  tl.to(P+"src", {autoAlpha:1, duration:0.4, ease:"power2.out"}, 0);
  tl.to(P+"note", {autoAlpha:1, duration:0.4, ease:"power2.out"}, 0);

  /* rotor spin: one angle drives the 4 cups on the 260 x 70 ellipse (front cups drawn larger).
     1 rev per 0.6 s (600 deg/s) to .15 @0.36, then 1 rev per 0.35 s (1028.57 deg/s) until the tear-off ends at 6.94 */
  const A = { a: 0 };
  const draw = function() {
    for (let k = 0; k < 4; k++) {
      const th = (A.a + 90 * k) * Math.PI / 180;
      const x = 760 + 130 * Math.cos(th), y = 400 + 35 * Math.sin(th);
      const cup = document.getElementById("g-a4-12-anemometer-cup" + (k + 1));
      const arm = document.getElementById("g-a4-12-anemometer-arm" + (k + 1));
      if (cup) { cup.setAttribute("cx", x.toFixed(1)); cup.setAttribute("cy", y.toFixed(1)); cup.setAttribute("r", (22 + 4 * Math.sin(th)).toFixed(1)); }
      if (arm) { arm.setAttribute("x2", x.toFixed(1)); arm.setAttribute("y2", y.toFixed(1)); }
    }
  };
  tl.to(A, { a: 216, duration: 0.36, ease: "none", onUpdate: draw }, 0);
  tl.to(A, { a: 6984, duration: 6.58, ease: "none", onUpdate: draw }, 0.36);

  /* rain throughout: 8 groups, each one phase of a 1.3 s fall (x +560, y +1200). First leg finishes the cycle the group
     starts in, then the group loops (repeat 9, runs past the host end). Streaks start and end off-frame, so no pop shows. */
  tl.to(P+"r0", {x:560, y:1200, duration:1.3, ease:"none", repeat:9}, 0);
  tl.fromTo(P+"r1", {x:70, y:150}, {x:560, y:1200, duration:1.1375, ease:"none"}, 0);
  tl.fromTo(P+"r1", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 1.1375);
  tl.fromTo(P+"r2", {x:140, y:300}, {x:560, y:1200, duration:0.975, ease:"none"}, 0);
  tl.fromTo(P+"r2", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.975);
  tl.fromTo(P+"r3", {x:210, y:450}, {x:560, y:1200, duration:0.8125, ease:"none"}, 0);
  tl.fromTo(P+"r3", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.8125);
  tl.fromTo(P+"r4", {x:280, y:600}, {x:560, y:1200, duration:0.65, ease:"none"}, 0);
  tl.fromTo(P+"r4", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.65);
  tl.fromTo(P+"r5", {x:350, y:750}, {x:560, y:1200, duration:0.4875, ease:"none"}, 0);
  tl.fromTo(P+"r5", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.4875);
  tl.fromTo(P+"r6", {x:420, y:900}, {x:560, y:1200, duration:0.325, ease:"none"}, 0);
  tl.fromTo(P+"r6", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.325);
  tl.fromTo(P+"r7", {x:490, y:1050}, {x:560, y:1200, duration:0.1625, ease:"none"}, 0);
  tl.fromTo(P+"r7", {x:0, y:0}, {x:560, y:1200, duration:1.3, ease:"none", repeat:9, immediateRender:false}, 0.1625);

  /* clocked @3.16: C1 in (84 follows at 3.56); readable 1.7 s before it leaves; drifts until it leaves */
  tl.fromTo(P+"c1", {autoAlpha:0, y:24, scale:0.94}, {autoAlpha:1, y:0, scale:1, duration:0.45, ease:"back.out(1.6)", immediateRender:false}, 3.16);
  tl.to(P+"cw1", {y:-4, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1}, 3.61);
  /* Then @5.34: C1 slides out by 5.94, before the rotor goes */
  tl.to(P+"c1", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 5.34);

  /* blew @6.04: rotor tears off (6.04 to 6.94), beat-accent flash 0.1 s; path stays above y 680 and leaves on the right */
  tl.to(P+"flash", {autoAlpha:0.35, duration:0.04, ease:"power2.out"}, 6.04);
  tl.to(P+"flash", {autoAlpha:0, duration:0.06, ease:"power2.in"}, 6.08);
  tl.to(P+"rotor", {x:1500, duration:0.9, ease:"power2.in"}, 6.04);
  tl.to(P+"rotor", {y:-300, duration:0.9, ease:"power3.out"}, 6.04);
  tl.to(P+"rotor", {rotation:540, duration:0.9, ease:"none"}, 6.04);
  /* the bare mast whips: 3 cycles of +-6 deg, then settles and sways slightly */
  tl.to(P+"mast", {rotation:6, duration:0.12, ease:"power2.out"}, 6.04);
  tl.to(P+"mast", {rotation:-6, duration:0.24, ease:"sine.inOut"}, 6.16);
  tl.to(P+"mast", {rotation:6, duration:0.24, ease:"sine.inOut"}, 6.40);
  tl.to(P+"mast", {rotation:-6, duration:0.24, ease:"sine.inOut"}, 6.64);
  tl.to(P+"mast", {rotation:6, duration:0.24, ease:"sine.inOut"}, 6.88);
  tl.to(P+"mast", {rotation:0, duration:0.4, ease:"power2.out"}, 7.12);
  tl.to(P+"mast", {rotation:0.8, duration:1.2, ease:"sine.inOut", yoyo:true, repeat:2}, 7.52);

  /* the @7.70: C2 in, after the rotor is gone (6.94); readable 1.65 s before its exit; the tag says estimate */
  tl.fromTo(P+"c2", {autoAlpha:0, y:24, scale:0.94}, {autoAlpha:1, y:0, scale:1, duration:0.45, ease:"back.out(1.6)", immediateRender:false}, 7.70);
  tl.to(P+"cw2", {y:-4, duration:0.85, ease:"sine.inOut", yoyo:true, repeat:1}, 8.15);

  /* exit 9.80 to 10.40: C2 slides out, cut to g-a4-13 at 10.40 */
  tl.to(P+"c2", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 9.80);

  window.__timelines["g-a4-12-anemometer"] = tl;
})();
</script>
