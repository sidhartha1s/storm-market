<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-a1-12-seawall-line · A1-S8 (whole, 10.311 s) · timeline 1891 to 1904, bar NO SEAWALL to 1900, marker 1904.
  Axis: y 600, x 200 (1891) to 1560 (1904), 104.615 px/year: 1891 x 200.0, 1900 x 1141.5, 1904 x 1560.0.
  The designed frame lives in #sw12-stage (fades 7.12 to 8.12); the Beach Hotel photo (orchestrator, lower track) shows through.
  From 8.12 only the source line is this comp's. Source image needed: media/a1/gdn-1891-p5-full.jpg (846 x 1080).
-->
<template>
<style>
  #g-a1-12-seawall-line-root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#dfe7ee; }
  #sw12-stage { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016, #030507 78%); }

  .sw12-glass { background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14); }

  /* source line, top-left, two cards swapped at 7.62 */
  .sw12-src { position:absolute; left:96px; top:54px; max-width:900px; box-sizing:border-box; padding:6px 14px; border-radius:12px;
    font-family:Arial,sans-serif; font-weight:700; font-size:19px; color:#c8d3e0; opacity:0; visibility:hidden; }

  /* axis, ticks, labels */
  #sw12-axis { position:absolute; left:200px; top:598.5px; width:1360px; height:3px; background:#93a3b2; opacity:0; visibility:hidden; }
  .sw12-tick { position:absolute; top:590px; width:3px; height:20px; background:#93a3b2; opacity:0; visibility:hidden; }
  #sw12-t1891 { left:198.5px; }
  #sw12-t1900 { left:1140px; }
  #sw12-t1904 { left:1558.5px; }
  .sw12-yr { position:absolute; top:628px; width:160px; text-align:center; line-height:30px; font-family:Arial,sans-serif; font-weight:700; font-size:30px;
    color:#dfe7ee; opacity:0; visibility:hidden; }
  #sw12-y1891 { left:120px; }
  #sw12-y1900 { left:1061.5px; }

  /* page thumbnail at 1891 */
  #sw12-page { position:absolute; left:140px; top:417px; width:120px; height:153px; box-sizing:border-box;
    border:1px solid rgba(255,255,255,.3); box-shadow:0 10px 24px rgba(0,0,0,.5); opacity:0; visibility:hidden; }

  /* red bar and its label */
  #sw12-bar { position:absolute; left:200px; top:593px; width:941.5px; height:14px; background:#c0392b; opacity:0; visibility:hidden; }
  #sw12-nowrap { position:absolute; left:370px; top:499px; width:600px; }
  #sw12-no { text-align:center; line-height:52px; font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:52px; color:#f2f5f8; opacity:0; visibility:hidden; }

  /* 1904 marker and chip */
  #sw12-mark { position:absolute; left:1558.5px; top:470px; width:3px; height:130px; background:#d8a13a; opacity:0; visibility:hidden; }
  #sw12-chipwrap { position:absolute; right:96px; top:360px; }
  #sw12-chip { display:table; box-sizing:border-box; padding:22px 32px; border-radius:28px; white-space:nowrap; line-height:50px;
    font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:44px; color:#f2f5f8; opacity:0; visibility:hidden; }
</style>
<div id="g-a1-12-seawall-line-root" data-composition-id="g-a1-12-seawall-line" data-width="1920" data-height="1080">
  <div id="sw12-stage">
    <div id="sw12-axis"></div>
    <div class="sw12-tick" id="sw12-t1891"></div>
    <div class="sw12-tick" id="sw12-t1900"></div>
    <div class="sw12-tick" id="sw12-t1904"></div>
    <div class="sw12-yr" id="sw12-y1891">1891</div>
    <div class="sw12-yr" id="sw12-y1900">1900</div>
    <img id="sw12-page" src="media/a1/gdn-1891-p5-full.jpg" alt="Galveston Daily News, July 16, 1891, page 5">
    <div id="sw12-bar"></div>
    <div id="sw12-nowrap"><div id="sw12-no">NO SEAWALL</div></div>
    <div id="sw12-mark"></div>
    <div id="sw12-chipwrap"><div class="sw12-glass" id="sw12-chip">FIRST SECTION FINISHED &middot; 1904</div></div>
  </div>
  <div class="sw12-glass sw12-src" id="sw12-src1">Galveston History Center, seawall exhibit</div>
  <div class="sw12-glass sw12-src" id="sw12-src2">Beach Hotel, Galveston &middot; Wikimedia Commons</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#sw12-";

  /* AXIS @0.00 ("When") */
  tl.set(P+"axis", { autoAlpha: 1 }, 0);
  tl.fromTo(P+"axis", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0);
  tl.set(P+"t1891", { autoAlpha: 1 }, 0);
  tl.fromTo(P+"t1891", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(1.6)" }, 0);
  tl.fromTo(P+"src1", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0);
  tl.to(P+"src1", { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.6);

  /* 1891 @0.60 ("article") */
  tl.fromTo(P+"page", { autoAlpha: 0, y: -20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 0.6);
  tl.fromTo(P+"y1891", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.6);

  /* 1900 @1.84 ("Galveston") */
  tl.set(P+"t1900", { autoAlpha: 1 }, 1.84);
  tl.fromTo(P+"t1900", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.84);
  tl.fromTo(P+"y1900", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.84);

  /* NO SEAWALL @2.34 ("no"); label @2.58 ("seawall.") */
  tl.set(P+"bar", { autoAlpha: 1 }, 2.34);
  tl.fromTo(P+"bar", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.86, ease: "power2.inOut" }, 2.34);
  tl.fromTo(P+"no", { autoAlpha: 0, scale: 1.25, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 2.58);
  tl.to(P+"nowrap", { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 3.0);

  /* 1904 marker draws @3.60 ("first"); chip @5.62 ("1904.") */
  tl.set(P+"mark", { autoAlpha: 1 }, 3.6);
  tl.fromTo(P+"mark", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.7, ease: "power2.out" }, 3.6);
  tl.set(P+"t1904", { autoAlpha: 1 }, 4.3);
  tl.fromTo(P+"t1904", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "back.out(1.6)" }, 4.3);
  tl.fromTo(P+"chip", { y: 24, scale: 0.94, autoAlpha: 0, transformOrigin: "50% 50%" }, { y: 0, scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(1.6)" }, 5.62);
  tl.to(P+"chipwrap", { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.62);

  /* PHOTO @7.12 ("So"): designed frame fades out, photo shows through */
  tl.to(P+"stage", { autoAlpha: 0, scale: 0.98, transformOrigin: "50% 50%", duration: 1.0, ease: "power1.inOut" }, 7.12);

  /* source line swap @7.62 */
  tl.to(P+"src1", { autoAlpha: 0, x: -30, duration: 0.25, ease: "power2.in" }, 7.62);
  tl.fromTo(P+"src2", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.87);
  tl.to(P+"src2", { y: 4, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.12);

  /* exit: source line fades over the last 0.3 s (host 10.311) */
  tl.to(P+"src2", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 10.011);

  window.__timelines["g-a1-12-seawall-line"] = tl;
})();
</script>
