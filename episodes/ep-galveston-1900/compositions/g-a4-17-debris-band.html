  $("north").setAttribute("transform", "translate(132,936) rotate(" + northDeg.toFixed(2) + ")");

  const isl = $("isl");
  if (isl.isPointInFill) {
    [[320, 324], [1600, 324], [320, 824], [1600, 824]].forEach(function (q) {
      const a = (q[0] - XT) / S, b = (q[1] - YT) / S;
      const pt = new DOMPoint(NE[0] + a * UX + b * VX, NE[1] + a * UY + b * VY);
      if (!isl.isPointInFill(pt)) console.error(ID + ": grid point " + q + " is off the island polygon");
    });
  }

  const arrows = root.querySelectorAll(".ga417-ar");
  const tl = gsap.timeline({ paused: true });

  /* PART A (0 to 5.44): chip over the photo. Wrapper floats the whole part A (slow rise). */
  tl.set(P + "wa", { y: 0 }, 0);
  tl.to(P + "wa", { y: -10, duration: 5.44, ease: "none" }, 0);
  /* NO @0.24 */
  tl.fromTo(P + "ca", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0.24);
  /* WRECKAGE @4.46: out by 5.06 */
  tl.to(P + "ca", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 4.46);

  /* PART B @5.44: plate on, source line swaps */
  tl.set([P + "bg", P + "map", P + "hud", P + "note", P + "srcb"], { autoAlpha: 1 }, 5.44);
  tl.set(P + "srca", { autoAlpha: 0 }, 5.44);
  tl.set([P + "rp1", P + "rp2", P + "rp3", P + "rp4"], { x: 0 }, 0);
  tl.to(P + "rp1", { x: 90, duration: D, ease: "none" }, 0);
  tl.to(P + "rp2", { x: -80, duration: D, ease: "none" }, 0);
  tl.to(P + "rp3", { x: 70, duration: D, ease: "none" }, 0);
  tl.to(P + "rp4", { x: 80, duration: D, ease: "none" }, 0);

  /* PILED @5.54: band opens east to west 5.54 to 6.82 */
  tl.set(P + "cr", { attr: { x: 1600, width: 0 } }, 0);
  tl.to(P + "cr", { attr: { x: 320, width: 1280 }, duration: 1.28, ease: "power2.inOut" }, 5.54);

  /* four @6.08 to blocks @6.82: row numbers 4, 5, 6 flash in, then rest at 0.9 */
  [["n4", 6.08], ["n5", 6.42], ["n6", 6.76]].forEach(function (r) {
    tl.fromTo(P + r[0], { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.22, ease: "back.out(2)" }, r[1]);
  });

  /* chip B in 6.12 (brief cue 7.72); fully readable from 6.57 to its exit at 8.12 */
  tl.fromTo(P + "cb", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 6.12);

  /* BEACH @7.14: arrows push north 7.12 to 7.92 and stop at tip y 568 (830 - 262), then pulse y +4 against the band */
  tl.set(arrows, { y: 0 }, 0);
  tl.fromTo(arrows, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "none", stagger: 0.04 }, 7.12);
  tl.to(arrows, { y: -262, duration: 0.8, ease: "power2.out" }, 7.12);
  tl.to(arrows, { y: -258, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.92);

  /* EXIT: chip B slides out in the last 0.4 s; cut to g-a4-18 */
  tl.to(P + "cb", { x: 980, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 8.12);

  window.__timelines[ID] = tl;
})();
</script>
