  tl.to(P + "chipin", { y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 3.81);
  /* EIGHT @10.62 (5.16): " · 8 BUILDINGS UNDAMAGED" */
