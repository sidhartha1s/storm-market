<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a4-11-house-40-";
  const q = function(id) { return document.querySelector(P + id); };
  /* a4-s7.words.json, comp starts at 0.00 ("At"), so comp-local = word time.
     At 0.00 · water 1.62 · waist ("waste") 2.52 · He 3.60 · bringing 3.94 · 40 6.62 · inside 7.84 · (8.28) · next segment word 8.86.
     Host window 0 to 8.86; timeline ends 8.86 with the chip exit. */

  /* --- start states --- */
  tl.set([P+"src", P+"c0", P+"c1", P+"glow"], {autoAlpha: 0}, 0);
  tl.set(P+"tick", {svgOrigin: "560 702", smoothOrigin: false}, 0);
  const wins = [0, 1, 2, 3, 4, 5].map(function(k) { return q("w" + k); });
  tl.set(wins, {opacity: 0.6}, 0);

  /* --- filing people: queue in the water at x 680 - 60*i (feet y 804), conveyor at 187.5 px/s to the step foot (700),
         climb 0.70 s to the sill (760,644), 0.213 s through the door to x 800 while fading.
         Entry times = 3.94 + (20 + 60 i)/187.5 + 0.913: i 0 -> 4.96 ... i 9 -> 7.84 ("inside"), 0.32 s apart. */
  const V = 187.5, CLIMB = 0.70, DOOR = 0.213, GO = 3.94;
  const ppl = [];
  for (let i = 0; i < 10; i++) {
    const p = q("p" + i), x0 = 680 - 60 * i, walk = (700 - x0) / V, atStep = GO + walk, entry = atStep + CLIMB + DOOR;
    ppl.push(p);
    tl.set(p, {x: x0, y: 804, autoAlpha: 0}, 0);
    /* He started @3.60: the queue fades in, nearest the steps first */
    tl.to(p, {autoAlpha: 1, duration: 0.3, ease: "power2.out"}, 3.60 + 0.03 * i);
    /* BRINGING @3.94: wade to the step foot */
    tl.to(p, {x: 700, duration: walk, ease: "none"}, GO);
    /* climb the steps to the door sill */
    tl.to(p, {x: 760, y: 644, duration: CLIMB, ease: "none"}, atStep);
    /* through the door, gone at the door */
    tl.to(p, {x: 800, autoAlpha: 0, duration: DOOR, ease: "power1.in"}, atStep + CLIMB);
    /* door glow as each one enters (0.30 s, inside the 0.32 s spacing) */
    tl.to(P+"glow", {autoAlpha: 0.7, duration: 0.1, ease: "power2.out"}, entry - 0.1);
    tl.to(P+"glow", {autoAlpha: 0, duration: 0.2, ease: "power2.in"}, entry);
  }

  /* --- whole-window motion: water ripple, 1.2 s period (0.6 s each way), finite repeats to 8.40 --- */
  const wf = q("wfill"), ws = q("wsurf");
  const flip = function(d) { return d.replace("q24,-6", "q24,6"); };
  tl.to(wf, {attr: {d: flip(wf.getAttribute("d"))}, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 13}, 0);
  tl.to(ws, {attr: {d: flip(ws.getAttribute("d"))}, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 13}, 0);

  /* window flicker (lamps), scattered across the window */
  [[0, 1.30], [3, 2.90], [1, 4.40], [5, 5.60], [2, 6.90], [0, 7.40], [4, 8.00]].forEach(function(f) {
    tl.to(wins[f[0]], {opacity: 0.25, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1}, f[1]);
  });

  /* AT HOME @0.00: plate on frame 0; source line slides in, then drifts */

  tl.to(P+"src", {y: -4, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 3}, 0.5);

  /* WAIST @2.52: chip 0 in, tick pulses */

  tl.to(P+"tick", {scaleX: 1.6, svgOrigin: "560 702", smoothOrigin: false, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 3}, 2.52);
  tl.to(P+"c0", {y: -4, duration: 0.37, ease: "sine.inOut"}, 2.97);
  /* He started @3.60: chip 0 out by 3.94 */
  tl.to(P+"c0", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 3.34);

  /* 40 TO 50 @6.62: chip in (text, no count-up) */
  tl.fromTo(P+"c1", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 6.62);
  tl.to(P+"c1", {y: -4, duration: 1.19, ease: "sine.inOut"}, 7.07);
  /* exit 8.26 to 8.86, then cut to g-a4-12 */
  tl.to(P+"c1", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 8.26);

  window.__timelines["g-a4-11-house-40"] = tl;
})();
