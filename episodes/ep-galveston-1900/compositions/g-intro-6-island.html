<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-intro-6-island-";
  const q = function(id) { return document.querySelector(P + id); };
  /* t1-s1.words.json, comp-local = word time - 0.88 (host starts at "island" 0.88).
     coast 2.14 -> 1.26 · home 2.90 -> 2.02 · 38 3.48 -> 2.60 · people 4.50 -> 3.62 · Its 5.28 -> 4.40
     highest 5.42 -> 4.54 · nine 6.74 -> 5.86 · (8.40 -> 7.52) · warned 9.22 -> 8.34 · few 10.86 -> 9.98
     Timeline ends 11.82 (= the 12.70 cap - 0.88); the fade-through sits in the last 0.4 s. */

  /* --- place houses and person dots on the profile, evenly by arc length (x 560 to 1360, symmetric about the bracket at 960) --- */
  const PTS = [[360,780],[520,640],[720,620],[900,432],[1020,432],[1200,620],[1400,640],[1560,780]];
  const yAt = function(x) {
    for (let i = 0; i < PTS.length - 1; i++) {
      const a = PTS[i], b = PTS[i + 1];
      if (x >= a[0] && x <= b[0]) return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
    return 780;
  };
  const xs = [], arc = [0];
  for (let x = 560; x <= 1360; x += 0.5) xs.push(x);
  for (let i = 1; i < xs.length; i++) arc.push(arc[i - 1] + Math.hypot(0.5, yAt(xs[i]) - yAt(xs[i - 1])));
  const total = arc[arc.length - 1];
  const homes = [];
  for (let k = 0, j = 0; k < 22; k++) {
    const want = total * k / 21;
    while (j < arc.length - 1 && arc[j] < want) j++;
    homes.push([xs[j], yAt(xs[j])]);
  }
  const houses = [], dots = [];
  for (let k = 0; k < 22; k++) {
    houses.push(q("h" + k));
    dots.push(q("d" + k));
    tl.set(houses[k], {x: homes[k][0], y: homes[k][1], scale: 0, autoAlpha: 0, transformOrigin: "50% 100%"}, 0);
    tl.set(dots[k], {x: homes[k][0] + 20, y: yAt(homes[k][0] + 20) - 6, autoAlpha: 0}, 0);
  }

  /* --- start states --- */
  tl.set([P+"src", P+"lgulf", P+"lbay", P+"lsea", P+"note", P+"c1", P+"c2", P+"c3", P+"c4",
          P+"arrow", P+"bracket", P+"tick0", P+"gold"], {autoAlpha: 0}, 0);
  tl.set([P+"c1", P+"c3", P+"c4"], {xPercent: -50}, 0);
  tl.set(P+"cam", {svgOrigin: "960 780"}, 0);

  /* --- whole-window motion: waves (phase as x, ease none) and a slow camera push 1.00 -> 1.04 about the sea-level foot of the bracket --- */
  tl.to(P+"wgulf", {x: 240, duration: 11.82, ease: "none"}, 0);
  tl.to(P+"wbay", {x: -160, duration: 11.82, ease: "none"}, 0);
  tl.to(P+"cam", {scale: 1.04, duration: 11.82, ease: "none"}, 0);

  /* ISLAND @0.88 (local 0): finished cross-section on frame 0; source line in, then drifts */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0);
  tl.to(P+"src", {y: -4, duration: 2.83, ease: "sine.inOut", yoyo: true, repeat: 3}, 0.5);

  /* coast @2.14: water labels */
  tl.fromTo(P+"lgulf", {autoAlpha: 0, y: 14, xPercent: -50}, {autoAlpha: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power3.out"}, 1.26);
  tl.fromTo(P+"lbay", {autoAlpha: 0, y: 14, xPercent: -50}, {autoAlpha: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power3.out"}, 1.56);

  /* home @2.90: houses pop left to right from their base, each with its person dot */
  tl.to(houses, {scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(2.2)", stagger: 0.03}, 2.02);
  tl.to(dots, {autoAlpha: 1, duration: 0.2, ease: "power2.out", stagger: 0.03}, 2.22);

  /* 38,000 @3.48: C1 in, figure counts 10,000 -> 38,000 (3.48 to 4.38), lands with "people" 4.50 */
  tl.fromTo(P+"c1", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 2.6);
  const cnt = {v: 10000};
  tl.to(cnt, {v: 38000, duration: 0.9, ease: "power3.out", onUpdate: function() {
      const el = document.getElementById("g-intro-6-island-num");
      if (el) el.textContent = (Math.round(cnt.v / 100) * 100).toLocaleString("en-US");
  }}, 2.6);
  tl.to(P+"c1", {y: -4, duration: 1.35, ease: "sine.inOut"}, 3.05);
  /* Its @5.28: C1 slides out right */
  tl.to(P+"c1", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 4.4);

  /* HIGHEST @5.42: bracket draws up from sea level to the crest (5.42 to 6.70), crest brightens on arrival */
  tl.to([P+"bracket", P+"tick0", P+"lsea"], {autoAlpha: 1, duration: 0.25, ease: "power2.out"}, 4.54);
  tl.fromTo(P+"cbrr", {attr: {y: 782, height: 0}}, {attr: {y: 428, height: 354}, duration: 1.28, ease: "power2.out"}, 4.54);
  tl.to(P+"gold", {autoAlpha: 1, duration: 0.35, ease: "power2.out"}, 5.55);

  /* nine @6.74: C2 in to the right of the bracket top, scale note fades in */
  tl.fromTo(P+"c2", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 5.86);
  tl.fromTo(P+"note", {autoAlpha: 0, x: -20}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power2.out"}, 5.86);
  tl.to(P+"c2", {y: -4, duration: 1.21, ease: "sine.inOut"}, 6.31);
  /* 8.40: C2 out before "The" 8.46 */
  tl.to(P+"c2", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 7.52);

  /* WARNED @9.22: C3 in at C1's spot */
  tl.fromTo(P+"c3", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 8.34);
  tl.to(P+"c3", {y: -4, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1}, 8.79);

  /* FEW @10.86: C4 under C3, C3 dims, 3 of 22 dots leave along the arrow (10.86 to 11.70) */
  tl.fromTo(P+"c4", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 9.98);
  tl.to(P+"c3", {opacity: 0.6, duration: 0.3, ease: "power2.out"}, 9.98);
  tl.to(P+"c4", {y: -4, duration: 1.39, ease: "sine.inOut"}, 10.43);
  tl.set(P+"arrow", {autoAlpha: 1}, 9.98);
  tl.fromTo(P+"carrr", {attr: {width: 0}}, {attr: {width: 460}, duration: 0.45, ease: "power2.out"}, 9.98);
  /* path follower, per-leg tweens: leg 1 house -> arrow tail (1380,600), leg 2 along the arrow (slope 100/420) */
  const along = function(f) { return {x: 1380 + 420 * f, y: 600 + 100 * f}; };
  tl.to(dots[21], {x: 1380, y: 600, duration: 0.18, ease: "power1.in"}, 9.98);
  tl.to(dots[21], {x: along(0.96).x, y: along(0.96).y, duration: 0.66, ease: "power1.inOut"}, 10.16);
  tl.to(dots[20], {x: 1380, y: 600, duration: 0.22, ease: "power1.in"}, 10.06);
  tl.to(dots[20], {x: along(0.78).x, y: along(0.78).y, duration: 0.54, ease: "power1.inOut"}, 10.28);
