    XT - S * (UX * NE[0] + UY * NE[1]), YT - S * (VX * NE[0] + VY * NE[1])].map(function (n) { return n.toFixed(4); }).join(",") + ")");
  const northDeg = Math.atan2(-UY, UX) * 180 / Math.PI;
  $("north").setAttribute("transform", "translate(132,936) rotate(" + northDeg.toFixed(2) + ")");

  const isl = $("isl");
  if (isl.isPointInFill) {
    [[320, 324], [1600, 324], [320, 824], [1600, 824], [1014, 617]].forEach(function (q) {
      const a = (q[0] - XT) / S, b = (q[1] - YT) / S;
      const pt = new DOMPoint(NE[0] + a * UX + b * VX, NE[1] + a * UY + b * VY);
      if (!isl.isPointInFill(pt)) console.error(ID + ": grid point " + q + " is off the island polygon");
    });
  }

  const dl = function (el) { return Math.ceil(el.getTotalLength()) + 1; };
  const DBOX = dl($("box"));
  const dots = Array.prototype.slice.call(root.querySelectorAll(".ga49-dot"));

  const tl = gsap.timeline({ paused: true });

  /* whole window: ripples drift, dots breathe (r 5 to 6 = scale 1.2) */
  tl.set([P + "rp1", P + "rp2", P + "rp3", P + "rp4"], { x: 0 }, 0);
  tl.to(P + "rp1", { x: 90, duration: D, ease: "none" }, 0);
  tl.to(P + "rp2", { x: -80, duration: D, ease: "none" }, 0);
  tl.to(P + "rp3", { x: 70, duration: D, ease: "none" }, 0);
  tl.to(P + "rp4", { x: 80, duration: D, ease: "none" }, 0);
  tl.to(dots, { attr: { r: 6 }, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 9, stagger: 0.02 }, 0);

  tl.set(P + "box", { strokeDasharray: DBOX + " " + DBOX, strokeDashoffset: DBOX }, 0);
  tl.set(P + "pin", { x: 0, y: 0 }, 0);

  /* THOUSANDS @8.20: chip 1 in */
  tl.fromTo(P + "c1", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 0);

  /* BEACH @8.94 (0.74): beach rows tint */
  tl.fromTo(P + "tint", { autoAlpha: 0 }, { autoAlpha: 0.2, duration: 0.2, ease: "power2.out" }, 0.74);

  /* MOVED @10.56 (2.36): dots go up the nearest street, then across into the centre box */
  tl.fromTo(P + "trails", { autoAlpha: 0 }, { autoAlpha: 0.5, duration: 0.3, ease: "power2.out" }, 2.36);
  dots.forEach(function (d, i) {
    const sx = +d.getAttribute("cx");
    const c = Math.round((sx - 366) / 108);
    const onStreet = (sx - 420) % 108 === 0;
    const xs = onStreet ? sx : (c === 11 ? 1500 : 420 + 108 * c);
    const tx = 680 + 64 * (i % 10), ty = 468 + 36 * Math.floor(i / 10);
    const sy = +d.getAttribute("cy");
    const t0 = 2.36 + 0.04 * i;
    tl.set(d, { x: 0, y: 0 }, 0);
    tl.to(d, { x: xs - sx, duration: 0.12, ease: "power2.inOut" }, t0);
    tl.to(d, { y: ty - sy, duration: 0.5, ease: "power2.inOut" }, t0 + 0.12);
    tl.to(d, { x: tx - sx, duration: 0.28, ease: "power2.inOut" }, t0 + 0.62);
  });

  /* CENTER @12.26 (4.06): box outline draws, label in */
  tl.fromTo(P + "box", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.1, ease: "none" }, 4.06);
  tl.to(P + "box", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 4.06);
  tl.fromTo(P + "boxlab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.16);

  /* chip 1 out (cue 13.10 = 4.90 pulled to 4.00 so chip 2 can be readable 1.5 s before its exit) */
  tl.to(P + "c1", { x: 980, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 4.0);

  /* ISAAC'S @13.62 (5.42; chip starts 4.60, fully in by 5.05): chip 2 in */
  tl.fromTo(P + "c2", { autoAlpha: 0, y: 24, scale: 0.94 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 4.6);

  /* STAYED @14.50 (6.30): ring pulse on the pin (svgOrigin + smoothOrigin on both ends); next pulse would land at 7.50, past the cut */
  tl.fromTo(P + "halo", { scale: 1, opacity: 0.9, svgOrigin: "30 30", smoothOrigin: false },
    { scale: 2.2, opacity: 0, svgOrigin: "30 30", smoothOrigin: false, duration: 0.62, ease: "power1.out" }, 6.3);

  /* EXIT: chip 2 slides out in the last 0.37 s; cut to A4-S6 rain footage */
  tl.to(P + "c2", { x: 980, autoAlpha: 0, duration: 0.37, ease: "power3.in" }, 6.55);

  window.__timelines[ID] = tl;
})();
</script>
</template>
