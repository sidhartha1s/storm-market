<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });

  /* one launch = one crossing: x 0 -> 2800 (left -450 -> 2350), tumbling rotation, constant speed */

  tl.to(P+"src", {y:-4, duration:2.4, ease:"sine.inOut", yoyo:true, repeat:1}, 0.5);

  /* first two boards @0.14 (15.40) */

  fly("b2", 0.30, 0.8, 322, -540);

  /* ROOFS @1.14 (16.40): burst of 6 sheets */

  fly("s2", 1.20, 1.2, 285, -360);
  fly("s3", 1.26, 1.3, 360, 720);
  fly("s4", 1.32, 0.9, 110, -540);
  fly("s5", 1.38, 1.1, 450, 360);
  fly("s6", 1.44, 1.4, 225, -720);

  /* TIMBERS @1.46 (16.72): 4 more boards */

  fly("b4", 1.56, 0.7, 153, -360);

  fly("s1", 2.30, 1.1, 125, -540);
  fly("b8", 2.60, 0.75, 473, -450);

  fly("b4", 4.10, 0.7, 343, 360);
  fly("s4", 4.40, 0.9, 200, 540);
  fly("b5", 4.70, 1.2, 210, -540);
  fly("s5", 5.00, 0.9, 430, -360);
