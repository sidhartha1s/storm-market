  /* a6-s4.words.json, comp-local = word time - 7.06 (host starts at "The" 7.06).
     surge 7.20 -> 0.14 · 16 7.76 -> 0.70 · waves 9.84 -> 2.78 · 21 10.74 -> 3.68 · A 12.08 -> 5.02
     WAVES-out 13.20 -> 6.14 · thrown 13.28 -> 6.22 · pounded 14.58 -> 7.52 · it. 15.96 -> 8.90 · (16.30 -> 9.24)
     wall 16.64 -> 9.58 · two 18.10 -> 11.04 · small 18.44 -> 11.38 · wav end 19.403 -> 12.343
     Timeline 12.94 = 12.343 + 0.6 land time; root fades over the last 0.4 s. */
  const END = 12.94;
  const SURGE_Y = 316.8 - 900;   /* 16.2 ft x 36 px above the calm surface */

  /* --- start states --- */
  tl.set([P+"src", P+"ldatum", P+"note", P+"c1", P+"c2", P+"c3", P+"arc", P+"sch",

  tl.set(P+"rise", {y: 0}, 0);
  tl.set([P+"r0", P+"r1"], {scale: 0.3, transformOrigin: "50% 50%"}, 0);
  const dots = [];
  for (let i = 0; i < 12; i++) { dots.push(q("d" + i)); tl.set(dots[i], {x: 1150, y: 300, autoAlpha: 0}, 0); }

  /* --- whole-window motion: surface phase (finite repeats, 10 x 1.294 s = END) and a linear push 1.00 -> 1.03.
         Push origin (1156,300) keeps 16.2 ft, 17 ft and 21 ft within 5 px of their heights at full push. --- */
  tl.to(P+"wv", {x: 60, duration: END / 10, ease: "none", repeat: 9}, 0);
  tl.to(P+"cam", {scale: 1.03, duration: END, ease: "none"}, 0);

  /* 7.06: source line and datum label in; source drifts */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0);
  tl.to(P+"src", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 4}, 0.5);
  tl.fromTo(P+"ldatum", {autoAlpha: 0, y: 10}, {autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out"}, 0);

  /* SURGE @7.20: sea rises 0.14 to 1.84 to y 316.8; surface swells from 6 to 10 px; datum label goes under */

  tl.to(P+"wvhi", {autoAlpha: 1, duration: 1.2, ease: "power1.inOut"}, 0.5);
  tl.to(P+"wvlo", {autoAlpha: 0, duration: 1.2, ease: "power1.inOut"}, 0.5);
  tl.to(P+"ldatum", {autoAlpha: 0, y: 10, duration: 0.4, ease: "power2.in"}, 0.4);
  /* 16 @7.76: chip SURGE 16.2 FT */
  tl.fromTo(P+"c1", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 0.7);
  tl.to(P+"c1", {y: -4, duration: 1.9, ease: "sine.inOut", yoyo: true, repeat: 1}, 1.15);
  /* surge line draws as the water lands */
  tl.set(P+"sline", {autoAlpha: 1}, 1.5);
  tl.fromTo(P+"cslr", {attr: {width: 0}}, {attr: {width: 1060}, duration: 0.6, ease: "power2.out"}, 1.5);

  /* --- one wave break: crest k rides from fromX to the face (impact at peak - 0.35), spray peaks at y 144 on `peak`,
         falls over the wall top to the land side (x 1340 to 1600, 300 px down) by peak + 0.45 --- */
  const SPRAY = [ /* [peakX, peakY, endX] : peak 144 is the 21 ft lead drop */
    [1275,144,1600],[1240,156,1360],[1290,162,1520],[1220,175,1345],[1260,150,1450],[1285,185,1580],
    [1205,196,1340],[1250,168,1400],[1270,205,1480],[1230,190,1380],[1280,158,1550],[1215,212,1420]];
  const arc = q("arc");
  const arcLen = Math.ceil(arc.getTotalLength()) + 1;
  tl.set(arc, {strokeDasharray: arcLen, strokeDashoffset: arcLen}, 0);

    const crest = q("k" + k), hit = peak - 0.35;
    tl.set(crest, {x: fromX, y: 0, scaleY: 1, transformOrigin: "50% 100%", autoAlpha: 0}, t0);
    tl.to(crest, {autoAlpha: 0.85, duration: 0.2, ease: "power1.out"}, t0);
    tl.to(crest, {x: 1150, duration: hit - t0, ease: "power1.in"}, t0);
    tl.to(crest, {scaleY: 2.2, autoAlpha: 0, duration: 0.3, ease: "power2.out"}, hit);
    tl.set(arc, {strokeDashoffset: arcLen, autoAlpha: 0.9}, hit);
    tl.to(arc, {strokeDashoffset: 0, duration: 0.6, ease: "power2.out"}, hit);
    tl.to(arc, {autoAlpha: 0, duration: 0.3, ease: "power1.in"}, peak + 0.2);
    for (let i = 0; i < 12; i++) {
      const s = SPRAY[i];
      tl.set(dots[i], {x: 1145 + (i % 4) * 4, y: 302, autoAlpha: 1}, hit);
      tl.to(dots[i], {x: s[0], y: s[1], duration: 0.35, ease: "power2.out"}, hit);
      tl.to(dots[i], {x: s[2], y: s[1] + 300, autoAlpha: 0, duration: 0.45, ease: "power1.in"}, peak);

  tl.to(P+"sch", {rotation: -6, duration: 0.355, ease: "sine.inOut", yoyo: true, repeat: 1}, 5.02);
  tl.to(P+"sch", {x: 1120, y: 250, rotation: -14, duration: 0.49, ease: "power2.out"}, 5.73);
  tl.to(P+"c2", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 6.14);
  tl.to(P+"sch", {x: 1190, y: 200, rotation: -4, duration: 0.28, ease: "power2.out"}, 6.22);
  tl.to(P+"sch", {x: 1246, y: 288, rotation: 0, duration: 0.34, ease: "power2.in"}, 6.5);

  /* POUNDED @14.58 to "it." 15.96: break 3 hits it, it tilts and shakes, then breaks into 4 and slides off the land side by 9.24 */
  brk(2, 7.58, 600, 8.48);
  tl.to(P+"sch", {rotation: 7, duration: 0.5, ease: "power2.out"}, 7.52);
  tl.to(P+"schk", {x: 6, duration: 0.11, ease: "power1.inOut", yoyo: true, repeat: 7}, 7.52);
