(function() {
  const tl = gsap.timeline({ paused: true });
  const A = "#a47-";

  // ---- time 0 states (hidden things are also hidden in CSS) ----
  tl.set(A+"sway", {transformOrigin:"50% 100%"}, 0);
  tl.set([A+"legL", A+"legR"], {scaleY:0, transformOrigin:"50% 100%", autoAlpha:0}, 0);
  tl.set(A+"brk-v", {scaleY:0, transformOrigin:"50% 100%"}, 0);
  tl.set([A+"tick-t", A+"tick-b"], {scaleX:0}, 0);
  tl.set(A+"ftline-in", {x:-600}, 0);
  tl.set(A+"ft-text", {transformOrigin:"left center"}, 0);
  tl.set([A+"w1",A+"w2",A+"w3",A+"w4",A+"w5",A+"w6"], {x:0, autoAlpha:0}, 0);
  tl.set([A+"p1",A+"p2",A+"p3",A+"p4"], {scale:0.3, autoAlpha:0}, 0);

  // ---- ambient motes in the window light, the whole window ----
  const motes = [A+"m1",A+"m2",A+"m3",A+"m4",A+"m5",A+"m6"];
  motes.forEach(function(m, i) {
    tl.to(m, {y: (i % 2 ? -22 : 22), duration:(10.962 - i * 0.1) / 4, ease:"sine.inOut", yoyo:true, repeat:3}, i * 0.1); /* ends at host end 10.962 */
  });

  // ---- 0.78 "Strand" @9.48 : chip in; out by 3.90 ("advised" @12.14 -> 3.44) ----
  tl.fromTo(A+"chip", {y:24, scale:0.94, autoAlpha:0}, {y:0, scale:1, autoAlpha:1, duration:0.45, ease:"back.out(1.6)"}, 0.78);
  tl.to(A+"chip-in", {y:-4, duration:1.1, ease:"sine.inOut", yoyo:true, repeat:1}, 1.2);
  tl.to(A+"chip", {x:-700, autoAlpha:0, duration:0.5, ease:"power3.in"}, 3.4);

  // ---- 4.48 "lift" @13.18 : stack + plank rise 240 px to 1.0 s (power2.inOut), trestles grow ----
  tl.to(A+"lift", {y:-240, duration:1.0, ease:"power2.inOut"}, 4.48);
  tl.to([A+"legL", A+"legR"], {autoAlpha:1, scaleY:1, duration:1.0, ease:"power2.inOut"}, 4.48);

  // ---- 5.14 "three" @13.84 : 3 FT line draws ----
  tl.set(A+"ftline", {autoAlpha:1}, 5.14);
  tl.to(A+"ftline-in", {x:0, duration:0.5, ease:"power2.out"}, 5.14);

  // ---- 5.48 "feet" @14.18 : bracket and label in ----

  tl.to(A+"brk-v", {scaleY:1, duration:0.5, ease:"power2.out"}, 5.48);
  tl.to([A+"tick-t", A+"tick-b"], {scaleX:1, duration:0.35, ease:"power2.out"}, 5.48);
  tl.fromTo(A+"ftlabel", {x:-24, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.45, ease:"power3.out"}, 5.48);
  tl.to(A+"ftlabel", {y:-4, duration:1.2, ease:"sine.inOut", yoyo:true, repeat:2}, 6.0);

  // ---- 5.48 to 8.78 : the top three crates sway +-1 deg, 1.2 s a cycle, until the wind ----
  tl.to(A+"sway", {rotation:1, duration:0.3, ease:"sine.out"}, 5.48);
  tl.to(A+"sway", {rotation:-1, duration:0.6, ease:"sine.inOut", yoyo:true, repeat:4}, 5.78);

  // ---- 7.84 "had" @16.54 : label pulses once ----
  tl.to(A+"ft-text", {scale:1.12, duration:0.25, ease:"power2.out", yoyo:true, repeat:1}, 7.84);

  // ---- 8.78 "wind" @17.48 : streaks cross from the right window leftward ----
  ["w1","w2","w3","w4","w5","w6"].forEach(function(w, i) {
    const t = 8.78 + i * 0.09;
    tl.to(A+w, {autoAlpha:0.5, duration:0.12}, t);
    tl.to(A+w, {x:-1000, duration:0.8, ease:"power1.in"}, t);
    tl.to(A+w, {autoAlpha:0, duration:0.25}, t + 0.6);

  // ---- 9.00 "blew" @17.70 : top three crates tip and fall left to 9.70 (power2.in); one sack slides ----
  tl.to(A+"c4", {rotation:-35, x:-230, y:293, duration:0.7, ease:"power2.in"}, 9.0);

    tl.to(A+p, {scale:1.6, y:-40, duration:0.8, ease:"power1.out"}, t);
    tl.to(A+p, {autoAlpha:0, duration:0.3}, t + 0.4);
  });

  tl.to([A+"ftline", A+"bracket", A+"ftlabel"], {autoAlpha:0, duration:0.4, ease:"power1.in"}, 9.86);
