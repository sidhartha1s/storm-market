  const tl = gsap.timeline({ paused: true });

  const q = function(id) { return document.querySelector(P + id); };
  /* a4-s11.words.json: host words 8.52 ("By") to 14.20; comp starts 8.52, comp-local = word time - 8.52. Window 0 to 5.68.

     Deviation: chip 2 in at 3.74 (not 4.56) so it is readable 1.5 s before the cut; it holds into the cut, no slide-out. */

  /* --- start states --- */
  tl.set([P+"src", P+"c0", P+"c1", P+"dA", P+"dB", P+"dC", P+"k0", P+"k1"], {autoAlpha: 0}, 0);

  tl.set(P+"dC", {x: 2000, y: 420}, 0);
  tl.set(P+"rA", {rotation: -6, svgOrigin: "0 0", smoothOrigin: false}, 0);
  tl.set(P+"rB", {rotation: 8, svgOrigin: "0 0", smoothOrigin: false}, 0);
  tl.set(P+"rC", {rotation: 6, svgOrigin: "0 0", smoothOrigin: false}, 0);
  tl.set([P+"k0", P+"k1"], {x: 1900, y: 358}, 0);
  const wins = [0, 1, 2].map(function(k) { return q("w" + k); });

  /* --- whole-window motion: water ripple, amplitude 12 px, 0.9 s period (0.45 s each way), finite repeats past 5.68 --- */
  const wf = q("wfill"), ws = q("wsurf");
  const flip = function(d) { return d.replace("q24,-24", "q24,24"); };

  tl.to(ws, {attr: {d: flip(ws.getAttribute("d"))}, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 12}, 0);

  /* upper-storey lamp flicker */
  tl.to(wins[0], {opacity: 0.15, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1}, 0.90);
  tl.to(wins[2], {opacity: 0.15, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1}, 2.30);
  tl.to(wins[1], {opacity: 0.15, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1}, 3.20);
  tl.to(wins[0], {opacity: 0.15, duration: 0.12, ease: "power1.inOut", yoyo: true, repeat: 1}, 4.60);

  /* source line slides in at 0, then drifts */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0);
  tl.to(P+"src", {y: -4, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1}, 0.5);

  tl.to(P+"c0", {y: -4, duration: 2.0, ease: "sine.inOut"}, 0.61);
  tl.to(P+"c0", {x: -980, autoAlpha: 0, duration: 0.45, ease: "power3.in"}, 2.99);

  /* drifting @1.24: house A slides in from the east, lodges at the wall (centre x 1352), rotation settles to 4 deg */
  tl.set(P+"dA", {autoAlpha: 1}, 1.24);
  tl.to(P+"dA", {x: 1352, duration: 0.88, ease: "power2.out"}, 1.24);
  tl.fromTo(P+"rA", {rotation: -6, svgOrigin: "0 0", smoothOrigin: false}, {rotation: 4, svgOrigin: "0 0", smoothOrigin: false, duration: 0.88, ease: "power2.out"}, 1.24);
  /* houses @1.50: house B rides in behind A (centre x 1420, y 316), rest -8 deg */

  tl.to(P+"dB", {x: 1420, duration: 0.88, ease: "power2.out"}, 1.50);
  tl.fromTo(P+"rB", {rotation: 8, svgOrigin: "0 0", smoothOrigin: false}, {rotation: -8, svgOrigin: "0 0", smoothOrigin: false, duration: 0.88, ease: "power2.out"}, 1.50);
  /* lodged @2.12: house C from the south-east, a diagonal from lower right, lands 2.74 (centre x 1428, y 346), rest 12 deg */
  tl.set(P+"dC", {autoAlpha: 1}, 2.12);
  tl.to(P+"dC", {x: 1428, y: 346, duration: 0.62, ease: "power2.out"}, 2.12);
  tl.fromTo(P+"rC", {rotation: 6, svgOrigin: "0 0", smoothOrigin: false}, {rotation: 12, svgOrigin: "0 0", smoothOrigin: false, duration: 0.62, ease: "power2.out"}, 2.12);
  /* the lodged pile bobs on the water between hits */
  tl.to(P+"rA", {y: -5, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3}, 2.74);
  tl.to(P+"rB", {y: -6, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3}, 2.74);

  tl.to(P+"k0", {autoAlpha: 0, duration: 0.25, ease: "power1.out"}, 3.74);

  tl.to(P+"k1", {x: 1560, duration: 0.60, ease: "power1.in"}, 4.24);
