<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-a6-4-grade-";
  /* a6-s3.words.json; host 0.00 to 21.46, comp-local = word time.
     bigger 0.84 · 1903 2.10 · dredges 3.54 · harbor 4.78 · city 5.82 · one 6.56 · 2,000 8.90 · jacked 10.16
     sand 12.28 · In 13.64 · rose 14.56 · 11 15.50 · church 16.84 · 3,000 17.70 · services 19.52 · up 21.22 (ends 21.40) */
  const SAND = [];
  for (let k = 0; k < 18; k++) SAND.push(P + "s" + k);
  const CHIPS = [P+"c1", P+"c2", P+"c3", P+"c4"];
  const JACKS = [P+"j0", P+"j1", P+"j2", P+"j3"];
  const CJACKS = [P+"cj0", P+"cj1", P+"cj2", P+"cj3"];

  /* sand blocks grow upward by attr y/height from each cell's own bottom edge (absolute user units). The scaleY +
     percent transformOrigin form drew the settled blocks about one row (122 px) above the grid in the r4 frames
     (origin taken from a bbox GSAP measured before layout; that read is not reproduced, so no bbox is used now). */
  const SAND_Y = SAND.map(function (s, k) { return 380 + 126 * (k % 3); });   /* rows y 380 / 506 / 632, as the markup */

  /* --- start states --- */
  tl.set([P+"src", P+"lharb", P+"flash", P+"dots", P+"jacks", P+"fill", P+"bracket", P+"church"].concat(CHIPS), {autoAlpha: 0}, 0);
  tl.set(SAND, {autoAlpha: 0, attr: {y: function (i) { return SAND_Y[i] + 120; }, height: 0}}, 0);
  tl.set(JACKS, {scaleY: 0, transformOrigin: "50% 100%"}, 0);
  tl.set(CJACKS, {scaleY: 1, transformOrigin: "50% 100%"}, 0);
  tl.set(P+"fill", {scaleY: 0, transformOrigin: "50% 100%"}, 0);
  tl.set(P+"dikes", {opacity: 0.6}, 0);
  tl.set(P+"cam", {svgOrigin: "1010 340", scale: 1}, 0);

  /* --- whole-window motion: water hatching drifts, sand dots run the pipe (visible from 4.40) --- */
  tl.to(P+"waves", {x: 96, duration: 21.46, ease: "none"}, 0);
  tl.fromTo(P+"dots", {attr: {"stroke-dashoffset": 0}}, {attr: {"stroke-dashoffset": -1288}, duration: 21.46, ease: "none"}, 0);

  /* plan push in the gaps, about the harbor entrance so the pipe head holds still */
  tl.to(P+"cam", {scale: 1.012, duration: 2.10, ease: "none"}, 0);
  tl.to(P+"cam", {scale: 1.03, duration: 3.64, ease: "none"}, 13.20);

  /* source line in at 0.20, drifts */
  tl.fromTo(P+"src", {autoAlpha: 0, x: -30}, {autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out"}, 0.2);
  tl.to(P+"src", {y: -4, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 7}, 0.7);

  /* bigger @0.84: dikes pulse once 0.6 -> 1 -> 0.8 */
  tl.to(P+"dikes", {opacity: 1, duration: 0.3, ease: "power2.out"}, 0.84);
  tl.to(P+"dikes", {opacity: 0.8, duration: 0.4, ease: "power2.in"}, 1.14);

  /* 1903 @2.10: C1 in */
  tl.fromTo(P+"c1", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 2.1);
  tl.to(P+"c1", {y: -4, duration: 2.0, ease: "sine.inOut", yoyo: true, repeat: 1}, 2.55);

  /* SAND @3.54: pipe draws from the entrance 3.54 to 4.40, then the dots show */
  tl.to(P+"pipe", {attr: {"stroke-dashoffset": 0}, duration: 0.86, ease: "power2.inOut"}, 3.54);
  tl.fromTo(P+"dots", {autoAlpha: 0}, {autoAlpha: 1, duration: 0.3, ease: "power2.out"}, 4.4);
  /* harbor @4.78 */
  tl.fromTo(P+"lharb", {autoAlpha: 0, y: 12}, {autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out"}, 4.78);

  /* city @5.82: sections fill one after another, 0.35 s each, all done by 8.20 */
  tl.fromTo(SAND, {autoAlpha: 0, attr: {y: function (i) { return SAND_Y[i] + 120; }, height: 0}},
    {autoAlpha: 1, attr: {y: function (i) { return SAND_Y[i]; }, height: 120}, duration: 0.35, ease: "power2.out", stagger: 0.119412}, 5.82);

  /* one @6.56: C1 out; the section starting to fill flashes its dike */
  tl.to(P+"c1", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 6.56);
  tl.fromTo(P+"flash", {autoAlpha: 0}, {autoAlpha: 1, duration: 0.15, ease: "power2.out"}, 6.56);
  tl.to(P+"flash", {autoAlpha: 0, duration: 0.5, ease: "power2.in"}, 7.1);

  /* 2,000 @8.90: C2 in */
  tl.fromTo(P+"c2", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 8.9);
  tl.to(P+"c2", {y: -4, duration: 2.1, ease: "sine.inOut", yoyo: true, repeat: 1}, 9.35);

  /* JACKS @10.16: screws rise into place under the house */
  tl.set(P+"jacks", {autoAlpha: 1}, 10.16);
  tl.to(JACKS, {scaleY: 1, duration: 0.3, ease: "power3.out", stagger: 0.02}, 10.16);
  /* 10.54 to 11.80: house goes up 220 px, screws stretch 60 -> 280 px from their base (same ease, so tops stay under the house) */
  tl.to(P+"house", {y: -220, duration: 1.26, ease: "power2.inOut"}, 10.54);
  tl.to(JACKS, {scaleY: 4.666667, duration: 1.26, ease: "power2.inOut"}, 10.54);

  /* so @11.94 / sand @12.28: sand rises under the raised house 12.28 to 13.20 */
  tl.set(P+"fill", {autoAlpha: 1}, 12.28);
  tl.to(P+"fill", {scaleY: 1, duration: 0.92, ease: "power2.out"}, 12.28);

  /* In @13.64: C2 out */
  tl.to(P+"c2", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 13.64);

  /* rose @14.56: bracket draws up 14.56 to 15.40 */
  tl.set(P+"bracket", {autoAlpha: 1}, 14.56);
  tl.fromTo(P+"cbrr", {attr: {y: 822, height: 0}}, {attr: {y: 598, height: 224}, duration: 0.84, ease: "power2.out"}, 14.56);
  /* 11 FT @15.50: C3 in, out at 16.40 */
  tl.fromTo(P+"c3", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 15.5);
  tl.to(P+"c3", {x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, 16.4);

  /* CHURCH @16.84: house cross-fades to the church (0.5 s); the bracket goes with it */
  tl.to([P+"house", P+"jacks", P+"bracket"], {autoAlpha: 0, duration: 0.5, ease: "power1.inOut"}, 16.84);
  tl.fromTo([P+"church", P+"cjacks"], {autoAlpha: 0}, {autoAlpha: 1, duration: 0.5, ease: "power1.inOut"}, 16.84);

  /* 3,000 @17.70: C4 in, floats to the end */
  tl.fromTo(P+"c4", {autoAlpha: 0, y: 24, scale: 0.94}, {autoAlpha: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)"}, 17.7);
  tl.to(P+"c4", {y: -4, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1}, 18.15);

  /* services @19.52: church goes up 30 px on its jacks while the windows glow, 19.52 to 21.10 */
  tl.to(P+"church", {y: -30, duration: 1.58, ease: "none"}, 19.52);
  tl.to(CJACKS, {scaleY: 2, duration: 1.58, ease: "none"}, 19.52);
  tl.fromTo(P+"win", {opacity: 0.4}, {opacity: 0.8, duration: 1.2, ease: "sine.inOut"}, 19.52);

  /* exit: cut to g-a6-5, root fades to 0 over the last 0.4 s (21.06 to 21.46) */
  tl.to(P+"root", {autoAlpha: 0, duration: 0.4, ease: "power1.in"}, 21.06);
  window.__timelines["g-a6-4-grade"] = tl;
})();
