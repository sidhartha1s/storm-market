<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  Format C status board, Kauai day 2 (B2 "where things stand"): six rows landing on spoken cues. Same glass recipe as
  recoveryboard.html (video 1). Host = b2-s1 start + 3.0 (33.35), 61.38 s. Cues rel. b2-s1: 81% 7.2 · 1,850 9.8 ·
  5,000 13.7 · 100 workers 25.0 · 460→550 45.0 · death toll 48.6 · no federal 60.2. Rows land at cue − 3.0.
-->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; }
  .card { position:absolute; left:110px; top:120px; width:980px; box-sizing:border-box; padding:28px 40px 26px;
    background:rgba(10,16,24,0.60); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#d0121f; }
  .big { white-space:nowrap; font-family:'AbrilFig',Georgia,serif; font-size:56px; line-height:1; color:#f2f5f8; margin-top:8px; text-shadow:0 3px 14px rgba(0,0,0,0.8); }
  .sub0 { font-size:20px; color:#c8d3e0; margin-top:6px; letter-spacing:1px; }
  .row { display:flex; align-items:center; gap:18px; margin-top:16px; overflow:hidden; }
  .name { flex:0 0 280px; font-family:'Arial Black',Arial,sans-serif; font-size:30px; line-height:1.1; }
  .pill { flex:0 0 200px; text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:1px; padding:8px 0; border-radius:10px; }
  .ok { background:#2f8f5b; color:#fff; } .warn { background:#d8a13a; color:#1a1408; } .bad { background:#d0121f; color:#fff; }
  .today { font-size:22px; color:#e6ecf2; line-height:1.2; }
  .bar { position:absolute; left:40px; right:40px; bottom:14px; height:4px; background:linear-gradient(90deg,#d0121f,#2f8f5b); border-radius:2px; transform-origin:left; }
</style>
<div id="root" data-composition-id="day2board" data-width="1920" data-height="1080">
  <div class="card" id="db-card">
    <div class="eye" id="db-eye">AS OF MONDAY EVENING · 15 SEP 26 · HAWAII TIME</div>
    <div class="big" id="db-big">81% RESTORED · ABOUT 5,000 TO GO</div>
    <div class="sub0">Day 8 after Hurricane Lowell · KIUC, Kauai County, Hawaii News Now</div>
    <div class="row" id="db-r1"><div class="name">POWER</div><div class="pill warn">81%</div><div class="today">Unchanged overnight · 1,850 more customers back on Sunday</div></div>
    <div class="row" id="db-r2"><div class="name">NORTH SHORE</div><div class="pill bad">~5,000 OUT</div><div class="today">All on one damaged transmission line · no full date</div></div>

    <div class="row" id="db-r4"><div class="name">REPORTS</div><div class="pill warn">550+</div><div class="today">Resident damage reports, up from about 460</div></div>
    <div class="row" id="db-r5"><div class="name">DEATHS</div><div class="pill bad">3</div><div class="today">2 on Kauai, 1 on Oahu · unchanged</div></div>
    <div class="row" id="db-r6"><div class="name">FEDERAL AID</div><div class="pill bad">PENDING</div><div class="today">Neither declaration approved, Lowell or Lala</div></div>
    <div class="bar" id="db-bar"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#db-";
  const rows = [P+"r1",P+"r2",P+"r3",P+"r4",P+"r5",P+"r6"];
  tl.set(rows, {autoAlpha:0, height:0, marginTop:0}, 0);
  tl.fromTo(P+"card", {x:-980, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.6, ease:"power3.out"}, 0);
  tl.fromTo(P+"big", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 0.5);
  const AT = [4.2, 10.7, 22.0, 42.0, 45.6, 57.2]; /* cues − 3.0: 81% 7.2 · 5,000 13.7 · 100 workers 25.0 · reports 45.0 · deaths 48.6 · federal 60.2 */
  rows.forEach((r, i) => tl.fromTo(r, {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:16, duration:0.45, ease:"power3.out"}, AT[i]));
  tl.fromTo(P+"card", {y:0}, {y:-6, duration:1.4, ease:"sine.inOut", yoyo:true, repeat:42}, 0.6);
  tl.fromTo(P+"bar", {scaleX:0}, {scaleX:1, duration:60.0, ease:"none"}, 0.6);
  tl.to(".pill", {boxShadow:"0 0 18px rgba(255,255,255,0.45)", duration:0.9, yoyo:true, repeat:66, ease:"sine.inOut"}, 0.6);
  tl.to(P+"eye", {letterSpacing:"8px", duration:1.2, ease:"power3.out"}, 0.2);
  tl.to(P+"card", {x:-980, autoAlpha:0, duration:0.5, ease:"power3.in"}, 60.78); /* host 61.38 − 0.6 */
  window.__timelines["day2board"] = tl;
})();
</script>
