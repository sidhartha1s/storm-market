<script>
window.__timelines = window.__timelines || {};
(function() {
  const P = "#g-compare-";
  const tl = gsap.timeline({ paused: true });

  const HIDE = [P+"eb",P+"hl",P+"topsub",P+"rlabel",P+"stamp",P+"rsub",
                P+"rk1",P+"nm1",P+"sb1",P+"rl1",P+"n1",P+"u1",
                P+"rk2",P+"nm2",P+"sb2",P+"rl2",P+"n2",P+"u2",
                P+"rk3",P+"nm3",P+"sb3",P+"rl3",P+"n3",P+"u3",P+"badge",P+"pulse3",
                P+"tk0",P+"tk1",P+"tk2",P+"tk3",P+"tk4",P+"tk5",P+"tk6",
                P+"kicker",P+"foot",P+"src"];
  tl.set(HIDE, {autoAlpha:0}, 0);
  tl.set([P+"rail1",P+"rail2",P+"rail3",P+"bar1",P+"bar2",P+"bar3",P+"axis"], {scaleX:0}, 0);

  function ctr(id, obj, val, at, dur) {
    tl.to(obj, {v:val, duration:dur, ease:"power3.out", onUpdate:function(){
      const e = document.getElementById(id); if (e) e.textContent = Math.round(obj.v);
    }}, at);
  }
  const V1 = {v:0}, V2 = {v:0}, V3 = {v:0};

  /* CONTINUOUS: the ruler grid drifts left for the whole window */
  tl.to(P+"grid", {x:-178, duration:25.8, ease:"none"}, 0.2);

  /* masthead */
  tl.fromTo(P+"eb",     {autoAlpha:0, x:-34}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"hl",     {autoAlpha:0, y:-26}, {autoAlpha:1, y:0, duration:0.55, ease:"power3.out"}, 0.40);
  tl.fromTo(P+"topsub", {autoAlpha:0, x:-28}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.70);
  tl.fromTo(P+"rlabel", {autoAlpha:0, y:-18}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 0.95);
  tl.fromTo(P+"stamp",  {autoAlpha:0, scale:1.5}, {autoAlpha:1, scale:1, duration:0.36, ease:"power4.in"}, 1.20);
  tl.fromTo(P+"rsub",   {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 1.60);

  /* axis + ruler ticks */
  tl.fromTo(P+"axis", {scaleX:0}, {scaleX:1, duration:0.7, ease:"power3.out"}, 1.90);
  tl.fromTo([P+"tk0",P+"tk1",P+"tk2",P+"tk3",P+"tk4",P+"tk5",P+"tk6"],
            {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out", stagger:0.11}, 2.20);

  /* ---- RANK 03 · CAROLINAS 1984 · 42 mi ---- */
  tl.fromTo(P+"rk1",   {autoAlpha:0, scale:1.9}, {autoAlpha:1, scale:1, duration:0.32, ease:"power4.in"}, 3.30);
  tl.fromTo(P+"nm1",   {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.45, ease:"power3.out"}, 3.60);
  tl.fromTo(P+"sb1",   {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 3.90);
  tl.fromTo(P+"rail1", {scaleX:0}, {scaleX:1, duration:0.45, ease:"power3.out"}, 4.20);
  tl.fromTo(P+"rl1",   {autoAlpha:0, y:-14}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out"}, 4.45);
  tl.fromTo(P+"bar1",  {scaleX:0}, {scaleX:1, duration:1.10, ease:"power3.out"}, 4.75);
  tl.set([P+"n1",P+"u1"], {autoAlpha:1}, 4.75);
  ctr("g-compare-n1", V1, 42, 4.75, 1.10);
  tl.fromTo(P+"u1", {y:16}, {y:0, duration:0.4, ease:"power3.out"}, 5.95);

  /* ---- RANK 02 · WOODWARD 1947 · 100 mi ---- */
  tl.fromTo(P+"rk2",   {autoAlpha:0, scale:1.9}, {autoAlpha:1, scale:1, duration:0.32, ease:"power4.in"}, 7.60);
  tl.fromTo(P+"nm2",   {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.45, ease:"power3.out"}, 7.90);
  tl.fromTo(P+"sb2",   {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 8.20);
  tl.fromTo(P+"rail2", {scaleX:0}, {scaleX:1, duration:0.45, ease:"power3.out"}, 8.50);
  tl.fromTo(P+"rl2",   {autoAlpha:0, y:-14}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out"}, 8.75);
  tl.fromTo(P+"bar2",  {scaleX:0}, {scaleX:1, duration:1.55, ease:"power3.out"}, 9.05);
  tl.set([P+"n2",P+"u2"], {autoAlpha:1}, 9.05);
  ctr("g-compare-n2", V2, 100, 9.05, 1.55);
  tl.fromTo(P+"u2", {y:16}, {y:0, duration:0.4, ease:"power3.out"}, 10.70);

  /* ---- RANK 01 · TRI-STATE 1925 · 151 mi ---- */
  tl.fromTo(P+"rk3",   {autoAlpha:0, scale:1.9}, {autoAlpha:1, scale:1, duration:0.32, ease:"power4.in"}, 12.60);
  tl.fromTo(P+"nm3",   {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.45, ease:"power3.out"}, 12.90);
  tl.fromTo(P+"sb3",   {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 13.25);
  tl.fromTo(P+"rail3", {scaleX:0}, {scaleX:1, duration:0.45, ease:"power3.out"}, 13.55);
  tl.fromTo(P+"rl3",   {autoAlpha:0, y:-14}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out"}, 13.80);
  tl.fromTo(P+"bar3",  {scaleX:0}, {scaleX:1, duration:2.30, ease:"power3.out"}, 14.10);
  tl.set([P+"n3",P+"u3"], {autoAlpha:1}, 14.10);
  ctr("g-compare-n3", V3, 151, 14.10, 2.30);
  tl.fromTo(P+"u3", {y:16}, {y:0, duration:0.4, ease:"power3.out"}, 16.55);

  /* the record stamp lands on the winner, then the bar breathes */
  tl.fromTo(P+"badge", {autoAlpha:0, scale:1.7}, {autoAlpha:1, scale:1, duration:0.34, ease:"power4.in"}, 17.30);
  tl.fromTo(P+"pulse3", {autoAlpha:0, scaleY:1}, {autoAlpha:0.85, scaleY:1.28, duration:0.85,
            ease:"sine.inOut", yoyo:true, repeat:3}, 18.10);
  tl.to(P+"n3", {scale:1.14, duration:0.55, ease:"power3.out", yoyo:true, repeat:3}, 19.20);

  /* close */
  tl.fromTo(P+"kicker", {autoAlpha:0, scale:1.22}, {autoAlpha:1, scale:1, duration:0.42, ease:"power4.in"}, 21.00);
  tl.fromTo(P+"foot",   {autoAlpha:0, y:22}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 22.20);
  tl.fromTo(P+"src",    {autoAlpha:0, y:18}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 23.10);
  /* closing pulse ends ON — the record bar is still glowing on the last frame */
  tl.to(P+"pulse3", {autoAlpha:0.9, scaleY:1.22, duration:0.65, ease:"sine.inOut", yoyo:true, repeat:2}, 24.00);
  tl.to(P+"kicker", {scale:1.05, duration:0.6, ease:"power3.out", yoyo:true, repeat:1}, 24.60);

  window.__timelines["g-compare"] = tl;
})();
</script>
