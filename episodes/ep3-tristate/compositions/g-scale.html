<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });

  function feetUpd(){ const e=document.getElementById("g-scale-feetv"); if(e) e.textContent = Math.round(FEET.v).toLocaleString("en-US"); }
  function spdUpd(){ const e=document.getElementById("g-scale-spd"); if(e) e.textContent = Math.round(SPD.v); }

  /* --- header --- */
  tl.fromTo(P+"eb",  {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"hl",  {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.40);

  tl.fromTo(P+"rule", {attr:{x2:88}}, {attr:{x2:1840}, duration:0.8, ease:"power3.out"}, 1.20);
  tl.fromTo(P+"base", {attr:{x2:88}}, {attr:{x2:1856}, duration:1.0, ease:"power3.out"}, 1.45);

  /* --- ACT 1: what they expected (a rope funnel, ~100 ft) --- */
  /* NOTE: at most ONE svgOrigin tween per SVG node — stacking two compounds the baked
     origin matrix and throws the element out of frame. Entrances use plain translates. */
  tl.fromTo(P+"funnelw", {autoAlpha:0, y:52}, {autoAlpha:1, y:0, duration:0.7, ease:"power3.out"}, 1.90);
  tl.fromTo(P+"explab", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 2.40);
  tl.fromTo(P+"expname", {autoAlpha:0, scale:1.45}, {autoAlpha:1, scale:1, duration:0.35, ease:"power4.in"}, 2.90);
  tl.fromTo(P+"expw", {autoAlpha:0, y:18}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 3.40);
  tl.fromTo(".cor", {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out", stagger:0.08}, 4.10);
  /* the rope sways from its base for the rest of the window */
  tl.to(P+"funnel", {rotation:2.6, duration:5.5, yoyo:true, repeat:3, ease:"sine.inOut", svgOrigin:"213 818"}, 4.60);

  /* --- ACT 2: what arrived. The wall grows out of the centre to a mile wide. --- */
  tl.fromTo(P+"wall", {attr:{x:1150, width:0}}, {attr:{x:460, width:1380}, duration:1.2, ease:"power3.out"}, 5.20);
  /* two continuous debris rotors carry the whole middle of the window */
  tl.fromTo(P+"swirl",  {autoAlpha:0, rotation:0}, {autoAlpha:0.95, rotation:220,  duration:21.3, ease:"none", svgOrigin:"1560 622"}, 5.90);
  tl.fromTo(P+"swirl2", {autoAlpha:0, rotation:0}, {autoAlpha:0.85, rotation:-200, duration:20.0, ease:"none", svgOrigin:"770 700"}, 6.50);
  tl.fromTo(P+"arrlab", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 6.60);
  tl.fromTo(P+"arrname", {autoAlpha:0, scale:1.35}, {autoAlpha:1, scale:1, duration:0.4, ease:"power4.in"}, 7.30);
  tl.fromTo(P+"arrsub", {autoAlpha:0, y:18}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 8.20);
  tl.fromTo(".wst", {attr:{height:0}}, {attr:{height:408}, duration:0.5, ease:"power3.out", stagger:0.1}, 8.60);
  tl.fromTo(".wsk", {attr:{width:0}}, {attr:{width:660}, duration:0.6, ease:"power3.out", stagger:0.12}, 9.20);

  /* --- the dimension line draws itself across the wall --- */
  tl.to(P+"dim", {strokeDashoffset:0, duration:2.2, ease:"power3.out"}, 9.60);
  tl.fromTo(P+"tickl", {attr:{y1:372, y2:372}}, {attr:{y1:348, y2:396}, duration:0.4, ease:"power4.in"}, 9.70);
  tl.fromTo(".hs", {autoAlpha:0, y:12}, {autoAlpha:1, y:0, duration:0.35, ease:"power3.out", stagger:0.045}, 11.40);
  tl.fromTo(P+"tickr", {attr:{y1:372, y2:372}}, {attr:{y1:348, y2:396}, duration:0.4, ease:"power4.in"}, 11.80);
  tl.fromTo(P+"mile", {autoAlpha:0, scale:2.0}, {autoAlpha:1, scale:1, duration:0.4, ease:"power4.in"}, 12.10);
  tl.fromTo(P+"feet", {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 12.60);

  tl.fromTo(".pp", {autoAlpha:0, y:7}, {autoAlpha:1, y:0, duration:0.3, ease:"power3.out", stagger:0.07}, 13.60);
  tl.fromTo(P+"scalelab", {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.4, ease:"power3.out"}, 14.10);
  tl.fromTo(P+"dust", {autoAlpha:0, attr:{cx:760}}, {autoAlpha:0.6, attr:{cx:1560}, duration:13.0, ease:"sine.inOut"}, 14.60);
  tl.fromTo(P+"dimlab", {autoAlpha:0, x:-24}, {autoAlpha:1, x:0, duration:0.4, ease:"power3.out"}, 15.00);

  /* --- ACT 3: the speed beat. Car runs; the wall front reels it in.
     The MPH readout is withheld until this act — no number sits on screen un-rolled. --- */
  tl.fromTo(P+"road", {attr:{x2:88}}, {attr:{x2:1856}, duration:0.8, ease:"power3.out"}, 15.40);
  tl.fromTo(P+"spd", {autoAlpha:0, x:34}, {autoAlpha:1, x:0, duration:0.4, ease:"power3.out"}, 15.90);
  tl.fromTo(P+"spdlab", {autoAlpha:0, x:34}, {autoAlpha:1, x:0, duration:0.4, ease:"power3.out"}, 15.95);
