<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 46% 52%, #0d141c 0%, #04070a 76%); }

  /* ---- one clean header: names what is on screen, one date, one place ---- */
  .hdr { position:absolute; left:0; right:0; top:96px; text-align:center;
    font-size:26px; letter-spacing:10px; color:#93a3b2; font-weight:700; }
  .hsub { position:absolute; left:0; right:0; top:138px; text-align:center;
    font-family:'Courier New',monospace; font-weight:700; font-size:40px; color:#e8c56a; }
  .rule { position:absolute; left:560px; top:212px; width:800px; height:2px; background:#22303d;
    transform:scaleX(0); transform-origin:center center; }

  /* ---- the forecast slip: the five words, verbatim ---- */
  .slip { position:absolute; left:310px; top:262px; width:1300px; height:150px; box-sizing:border-box;
    border:2px solid #2a3644; background:linear-gradient(180deg,#111a24 0%,#080d13 100%); overflow:hidden; }
  .qline { position:absolute; left:0; right:0; top:36px; height:70px; line-height:70px; text-align:center;
    font-family:'Courier New',monospace; font-weight:700; font-size:60px; color:#f2f5f8; }
  .cursor { display:inline-block; width:22px; height:52px; background:#e8c56a; vertical-align:-6px; margin-left:8px; }
  .sweep { position:absolute; left:0; top:0; width:300px; height:150px; transform:translateX(-340px);
    background:linear-gradient(90deg, rgba(232,197,106,0) 0%, rgba(232,197,106,0.18) 50%, rgba(232,197,106,0) 100%); }
  .fivewords { position:absolute; left:0; right:0; top:436px; text-align:center; }
  .stamp { display:inline-block; background:#8e2020; padding:4px 26px; font-family:'Arial Black',Arial,sans-serif;
    font-size:44px; letter-spacing:4px; color:#fff; }

  /* ---- what did not exist: three items, no captions ---- */
  .sechdr { position:absolute; left:0; right:0; top:560px; text-align:center; font-size:24px; letter-spacing:8px;
    color:#93a3b2; font-weight:700; }
  .arow { position:absolute; top:632px; width:460px; text-align:center; }
  .abar { position:absolute; left:80px; top:0; width:300px; height:4px; background:#c0392b;
    transform:scaleX(0); transform-origin:center center; }
  .abig { position:absolute; left:0; right:0; top:22px; font-family:'Arial Black',Arial,sans-serif;
    font-size:64px; line-height:70px; color:#f2f5f8; }
  #g-forecast-a1 { left:170px; } #g-forecast-a2 { left:730px; } #g-forecast-a3 { left:1290px; }

  /* ---- teleprinter tape (continuous motion the whole window) ---- */
  .tape { position:absolute; left:0; top:900px; width:1920px; height:52px; }
</style>
<div id="root" data-composition-id="g-forecast" data-width="1920" data-height="1080">

  <div class="hdr" id="g-forecast-hdr">OFFICIAL FORECAST</div>
  <div class="hsub" id="g-forecast-hsub">ILLINOIS &middot; MARCH 18, 1925</div>
  <div class="rule" id="g-forecast-rule"></div>

  <div class="slip" id="g-forecast-slip">
    <div class="sweep" id="g-forecast-sweep"></div>
    <div class="qline" id="g-forecast-qline"><span id="g-forecast-typed"></span><span class="cursor" id="g-forecast-cursor"></span></div>
  </div>

  <div class="fivewords" id="g-forecast-fivewords"><span class="stamp">FIVE WORDS</span></div>

  <div class="sechdr" id="g-forecast-sechdr">WHAT DID NOT EXIST</div>
  <div class="arow" id="g-forecast-a1"><div class="abar" id="g-forecast-a1bar"></div><div class="abig">NO WATCHES</div></div>
  <div class="arow" id="g-forecast-a2"><div class="abar" id="g-forecast-a2bar"></div><div class="abig">NO SIRENS</div></div>
  <div class="arow" id="g-forecast-a3"><div class="abar" id="g-forecast-a3bar"></div><div class="abig">NO RADAR</div></div>

  <svg class="tape" id="g-forecast-tape" viewBox="0 0 1920 52">
    <g id="g-forecast-tapeg">
      <rect x="-200" y="8" width="2800" height="36" fill="#0a1017" stroke="#1b2733" stroke-width="2"/>
      <rect x="-200" y="6" width="2800" height="2" fill="#22303d"/>
      <rect x="-200" y="44" width="2800" height="2" fill="#22303d"/>
      <circle cx="-48" cy="26" r="5" fill="#243140"/><circle cx="48" cy="26" r="5" fill="#243140"/><circle cx="144" cy="26" r="5" fill="#243140"/><circle cx="240" cy="26" r="5" fill="#243140"/><circle cx="336" cy="26" r="5" fill="#243140"/><circle cx="432" cy="26" r="5" fill="#243140"/><circle cx="528" cy="26" r="5" fill="#243140"/><circle cx="624" cy="26" r="5" fill="#243140"/><circle cx="720" cy="26" r="5" fill="#243140"/><circle cx="816" cy="26" r="5" fill="#243140"/><circle cx="912" cy="26" r="5" fill="#243140"/><circle cx="1008" cy="26" r="5" fill="#243140"/><circle cx="1104" cy="26" r="5" fill="#243140"/><circle cx="1200" cy="26" r="5" fill="#243140"/><circle cx="1296" cy="26" r="5" fill="#243140"/><circle cx="1392" cy="26" r="5" fill="#243140"/><circle cx="1488" cy="26" r="5" fill="#243140"/><circle cx="1584" cy="26" r="5" fill="#243140"/><circle cx="1680" cy="26" r="5" fill="#243140"/><circle cx="1776" cy="26" r="5" fill="#243140"/><circle cx="1872" cy="26" r="5" fill="#243140"/>
      <rect x="0" y="12" width="3" height="14" fill="#8e2020"/><rect x="192" y="12" width="3" height="14" fill="#8e2020"/><rect x="384" y="12" width="3" height="14" fill="#8e2020"/><rect x="576" y="12" width="3" height="14" fill="#8e2020"/><rect x="768" y="12" width="3" height="14" fill="#8e2020"/><rect x="960" y="12" width="3" height="14" fill="#8e2020"/><rect x="1152" y="12" width="3" height="14" fill="#8e2020"/><rect x="1344" y="12" width="3" height="14" fill="#8e2020"/><rect x="1536" y="12" width="3" height="14" fill="#8e2020"/><rect x="1728" y="12" width="3" height="14" fill="#8e2020"/><rect x="1920" y="12" width="3" height="14" fill="#8e2020"/>
    </g>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const P = "#g-forecast-";
  /* the forecast, verbatim — FIVE words, never seven */
  const PH = "rains and strong shifting winds";
  const T = { n: 0 };
  function typeUpd() {
    const e = document.getElementById("g-forecast-typed");
    if (!e) return;
    const n = Math.max(0, Math.min(PH.length, Math.round(T.n)));
    e.textContent = "“" + PH.slice(0, n) + (n >= PH.length ? "”" : "");
  }

  const tl = gsap.timeline({ paused: true });
  tl.set([P+"hdr",P+"hsub",P+"slip",P+"cursor",P+"fivewords",P+"sechdr",
          P+"a1",P+"a2",P+"a3",P+"tape"], {autoAlpha:0}, 0);

  /* --- header + the tape that runs the whole window (narration 0-8s: "the entire forecast") --- */
  tl.fromTo(P+"hdr",   {autoAlpha:0, y:-16}, {autoAlpha:1, y:0, duration:0.50, ease:"power3.out"}, 0.30);
  tl.fromTo(P+"hsub",  {autoAlpha:0, y:-12}, {autoAlpha:1, y:0, duration:0.50, ease:"power3.out"}, 0.70);
  tl.fromTo(P+"tape",  {autoAlpha:0, y:40},  {autoAlpha:1, y:0, duration:0.60, ease:"power3.out"}, 0.30);
  tl.fromTo(P+"tapeg", {x:0},                {x:-390, duration:21.00, ease:"none"}, 0.60);
  tl.fromTo(P+"rule",  {scaleX:0},           {scaleX:1, duration:0.70, ease:"power3.out"}, 1.00);
  tl.fromTo(P+"slip",  {autoAlpha:0, y:24},  {autoAlpha:1, y:0, duration:0.55, ease:"power3.out"}, 2.60);
  tl.to(P+"cursor",    {autoAlpha:1, duration:0.20}, 3.10);
  tl.to(P+"cursor",    {autoAlpha:0.05, duration:0.42, repeat:40, yoyo:true, ease:"none"}, 3.30);

  /* --- the phrase types AS it is spoken (narration 8.3s: "rains and strong shifting winds") --- */
  tl.to(T, {n:31, duration:2.40, ease:"none", onUpdate:typeUpd}, 8.30);

  /* --- "five words for the deadliest tornado day" (11.1s) --- */
  tl.fromTo(P+"fivewords", {scale:2.4, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.36, ease:"power4.in"}, 11.20);
  tl.to(P+"fivewords", {scale:1.05, duration:0.40, yoyo:true, repeat:1, ease:"power2.inOut"}, 12.60);

  /* --- "no watches, no sirens, no radar" — each strikes as it is spoken (15.5 / 16.7 / 17.7) --- */
  tl.fromTo(P+"sechdr", {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 14.80);
  tl.fromTo(P+"a1",    {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.36, ease:"power3.out"}, 15.50);
  tl.fromTo(P+"a1bar", {scaleX:0},          {scaleX:1, duration:0.40, ease:"power3.out"}, 15.66);
  tl.fromTo(P+"a2",    {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.36, ease:"power3.out"}, 16.70);
  tl.fromTo(P+"a2bar", {scaleX:0},          {scaleX:1, duration:0.40, ease:"power3.out"}, 16.86);
  tl.fromTo(P+"a3",    {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.36, ease:"power3.out"}, 17.70);
  tl.fromTo(P+"a3bar", {scaleX:0},          {scaleX:1, duration:0.40, ease:"power3.out"}, 17.86);

  /* --- hold on "walked into this day completely blind" (18.9s): a sweep across the slip --- */
  tl.fromTo(P+"sweep", {x:-340}, {x:1340, duration:1.60, ease:"power2.inOut"}, 19.20);
  tl.to([P+"a1bar",P+"a2bar",P+"a3bar"], {scaleY:2.0, duration:0.45, yoyo:true, repeat:1, ease:"power2.out"}, 20.40);

  window.__timelines["g-forecast"] = tl;
})();
</script>
</template>
</body>
</html>
