<script>
window.__timelines = window.__timelines || {};
(function() {
  const P = "#g-forecast-";
  /* the forecast, verbatim — FIVE words, never seven */
  const PH = "rains and strong shifting winds";
  const T = { n: 0 };
  function typeUpd() {
    const e = document.getElementById("g-forecast-typed");
    if (!e) return;
    const n = Math.max(0, Math.min(PH.length, Math.round(T.n)));
    e.textContent = "“" + PH.slice(0, n) + (n >= PH.length ? "”" : "");
  }

  const tl = gsap.timeline({ paused: true });
  tl.set([P+"eb",P+"hl",P+"datewrap",P+"slip",P+"sliplab",P+"cursor",P+"stampwrap",P+"serifsub",
          P+"sechdr",P+"r1",P+"r2",P+"r3",P+"banned",P+"foot",P+"tape"], {autoAlpha:0}, 0);

  /* --- header + the tape that runs the whole window --- */
  tl.fromTo(P+"eb",       {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.50, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"tape",     {autoAlpha:0, y:40},  {autoAlpha:1, y:0, duration:0.60, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"hl",       {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.50, ease:"power3.out"}, 0.35);
  tl.fromTo(P+"tapeg",    {x:0},                {x:-430, duration:21.50, ease:"none"}, 0.50);
  tl.fromTo(P+"datewrap", {autoAlpha:0, x:34},  {autoAlpha:1, x:0, duration:0.50, ease:"power3.out"}, 0.60);
  tl.fromTo(P+"rule",     {scaleX:0},           {scaleX:1, duration:0.70, ease:"power3.out"}, 0.80);

  /* --- the slip, then the phrase typed word by word --- */
  tl.fromTo(P+"slip",     {autoAlpha:0, y:26},  {autoAlpha:1, y:0, duration:0.55, ease:"power3.out"}, 1.00);
  tl.fromTo(P+"sliplab",  {autoAlpha:0, y:14},  {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 1.25);
  tl.to(P+"cursor",       {autoAlpha:1, duration:0.20}, 1.45);
  tl.to(P+"cursor",       {autoAlpha:0.05, duration:0.42, repeat:45, yoyo:true, ease:"none"}, 1.55);

  tl.to(T, {n:5,  duration:1.10, ease:"none", onUpdate:typeUpd}, 1.60);   /* rains    */
  tl.fromTo(P+"b1", {scaleX:0}, {scaleX:1, duration:0.30, ease:"power3.out"}, 2.80);
  tl.to(T, {n:9,  duration:0.60, ease:"none", onUpdate:typeUpd}, 2.95);   /* and      */
  tl.fromTo(P+"b2", {scaleX:0}, {scaleX:1, duration:0.30, ease:"power3.out"}, 3.65);
  tl.to(T, {n:16, duration:0.95, ease:"none", onUpdate:typeUpd}, 3.85);   /* strong   */
  tl.fromTo(P+"b3", {scaleX:0}, {scaleX:1, duration:0.30, ease:"power3.out"}, 4.90);
  tl.to(T, {n:25, duration:1.25, ease:"none", onUpdate:typeUpd}, 5.15);   /* shifting */
  tl.fromTo(P+"b4", {scaleX:0}, {scaleX:1, duration:0.30, ease:"power3.out"}, 6.50);
  tl.to(T, {n:31, duration:0.80, ease:"none", onUpdate:typeUpd}, 6.75);   /* winds    */
  tl.fromTo(P+"b5", {scaleX:0}, {scaleX:1, duration:0.30, ease:"power3.out"}, 7.65);

  /* --- the slam --- */
  tl.fromTo(P+"stampwrap", {scale:2.6, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.35, ease:"power4.in"}, 8.20);
  tl.fromTo(P+"serifsub",  {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 8.75);

  /* --- what 1925 did not have --- */
  tl.fromTo(P+"sechdr", {autoAlpha:0, x:-24}, {autoAlpha:1, x:0, duration:0.45, ease:"power3.out"}, 9.60);
  tl.fromTo(P+"r1",    {autoAlpha:0}, {autoAlpha:1, duration:0.01}, 10.28);
  tl.fromTo(P+"r1bar", {scaleX:0},          {scaleX:1, duration:0.45, ease:"power3.out"}, 10.30);
  tl.fromTo(P+"r1big", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 10.50);
  tl.fromTo(P+"r1sub", {autoAlpha:0},       {autoAlpha:1, duration:0.40}, 10.75);
  tl.fromTo(P+"r2",    {autoAlpha:0}, {autoAlpha:1, duration:0.01}, 11.98);
  tl.fromTo(P+"r2bar", {scaleX:0},          {scaleX:1, duration:0.45, ease:"power3.out"}, 12.00);
  tl.fromTo(P+"r2big", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 12.20);
  tl.fromTo(P+"r2sub", {autoAlpha:0},       {autoAlpha:1, duration:0.40}, 12.45);
  tl.fromTo(P+"r3",    {autoAlpha:0}, {autoAlpha:1, duration:0.01}, 13.68);
  tl.fromTo(P+"r3bar", {scaleX:0},          {scaleX:1, duration:0.45, ease:"power3.out"}, 13.70);
  tl.fromTo(P+"r3big", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 13.90);
  tl.fromTo(P+"r3sub", {autoAlpha:0},       {autoAlpha:1, duration:0.40}, 14.15);

  tl.fromTo(P+"banned", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 15.40);
  tl.to(".ffill", {scaleY:2.2, duration:0.40, yoyo:true, repeat:1, ease:"power2.out"}, 16.60);
  tl.to(P+"stamp", {scale:1.06, duration:0.45, yoyo:true, repeat:1, ease:"power2.inOut"}, 17.60);
  tl.fromTo(P+"foot", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.45, ease:"power3.out"}, 18.60);
  tl.fromTo(P+"sweep", {x:-340}, {x:1780, duration:1.40, ease:"power2.inOut"}, 19.60);
  tl.fromTo(P+"uline", {scaleX:0}, {scaleX:1, duration:0.80, ease:"power3.out"}, 20.70);

  window.__timelines["g-forecast"] = tl;
})();
</script>
