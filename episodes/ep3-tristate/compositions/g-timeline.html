<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-timeline-";
  const LEAD = { v: 0 };
  function leadUpd() { const e = document.getElementById("g-timeline-cnum"); if (e) e.textContent = Math.round(LEAD.v); }

  /* everything that reveals starts hidden */
  tl.set([P+"eb",P+"hl",P+"sb",P+"cwrap",P+"barwrap",P+"scwrap",
          P+"m0t",P+"m0y",P+"m0d",P+"m1t",P+"m1y",P+"m1d",P+"m2t",P+"m2y",P+"m2d",
          P+"m3t",P+"m3y",P+"m3d",P+"m4t",P+"m4y",P+"m4d",P+"m5t",P+"m5y",P+"m5d",
          P+"m0r",P+"m1r",P+"m2r",P+"m3r",P+"m4r",P+"m5r",
          P+"photo",P+"cap1",P+"cap2",P+"rlab",P+"flab",
          P+"cdiv",P+"s1925",P+"ct1",P+"arw",P+"ahd",P+"stoday",P+"ct2",P+"kick"], {autoAlpha:0}, 0);
  tl.set([P+"barfill",P+"m0r",P+"m1r",P+"m2r",P+"m3r",P+"m4r",P+"m5r",P+"cdiv",P+"arw"],
         {scaleX:0, transformOrigin:"left center"}, 0);

  /* ---- header ---- */
  tl.fromTo(P+"eb",    {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.50, ease:"power3.out"}, 0.15);
  tl.fromTo(P+"hl",    {autoAlpha:0, x:-36}, {autoAlpha:1, x:0, duration:0.55, ease:"power3.out"}, 0.35);
  tl.fromTo(P+"sb",    {autoAlpha:0, y:20},  {autoAlpha:1, y:0, duration:0.50, ease:"power3.out"}, 0.60);
  tl.fromTo(P+"cwrap", {autoAlpha:0, x:34},  {autoAlpha:1, x:0, duration:0.55, ease:"power3.out"}, 1.00);
  tl.fromTo(P+"barwrap",{autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 1.35);
  tl.fromTo(P+"scwrap", {autoAlpha:0, y:14}, {autoAlpha:1, y:0, duration:0.40, ease:"power3.out"}, 1.65);

  /* ---- the continuous axis: draws across almost the whole window ---- */
  tl.to(P+"axis", {strokeDashoffset:0, duration:29.20, ease:"none"}, 0.80);
  tl.fromTo(P+"head", {attr:{r:0}}, {attr:{r:16}, duration:0.40, ease:"power4.in"}, 0.80);
  tl.fromTo(P+"hring", {autoAlpha:0}, {autoAlpha:0.45, duration:0.40}, 0.80);

  /* head rides the axis, arriving on each milestone as it fires */
  const SEG = [[0.80,2.20,190],[3.00,4.00,500],[7.00,5.50,810],[12.50,4.00,1120],
               [16.50,4.00,1430],[20.50,4.00,1740],[24.50,5.50,1810]];
  SEG.forEach(function(s) {
    tl.to(P+"head",  {attr:{cx:s[2]}, duration:s[1], ease:"none"}, s[0]);
    tl.to(P+"hring", {attr:{cx:s[2]}, duration:s[1], ease:"none"}, s[0]);
  });

  /* ---- six milestones ---- */
  const MS = [{i:0,t:3.00},{i:1,t:7.00},{i:2,t:12.50},{i:3,t:16.50},{i:4,t:20.50},{i:5,t:24.50}];
  MS.forEach(function(m) {
    const i = m.i, t = m.t;
    tl.to(P+"n"+i, {attr:{r:11}, duration:0.30, ease:"power4.in"}, t);
    tl.fromTo(P+"g"+i, {attr:{r:12}, autoAlpha:0.95}, {attr:{r:58}, autoAlpha:0, duration:0.90, ease:"power2.out"}, t+0.05);
