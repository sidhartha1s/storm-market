    if (T < C.push) { z = Z0 * Math.pow(1.01, T / C.push); fx = FS[0]; fy = FS[1]; sx = SS[0]; sy = SS[1]; }
    else if (T < C.land) {

      fx = FS[0] + (FE[0] - FS[0]) * u; fy = FS[1] + (FE[1] - FS[1]) * u;

    gsap.set(world, { x: sx - fx * z, y: sy - fy * z, scale: z });

  tl.set(world, { transformOrigin: "0px 0px", x: SS[0] - FS[0] * Z0, y: SS[1] - FS[1] * Z0, scale: Z0 }, 0);

  tl.fromTo(P + "row2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.newer);
  /* AS PROTECTED @18.76 */
  tl.fromTo(P + "sub", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.prot);
