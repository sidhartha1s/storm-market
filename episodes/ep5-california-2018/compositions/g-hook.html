<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; overflow:hidden;
    background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); }
  .hdr { position:absolute; left:0; right:0; top:64px; text-align:center; font-weight:700;
    font-size:26px; letter-spacing:8px; color:#93a3b2; opacity:0; }
  /* state 1: the picture in your head */
  #g-hook-picture { position:absolute; left:0; right:0; top:150px; text-align:center; }
  #g-hook-pichead { font-family:Georgia,serif; font-style:italic; font-size:40px; color:#c8d3e0; opacity:0; }
  #g-hook-road { position:absolute; left:50%; top:250px; width:520px; height:200px; margin-left:-260px;
    background:linear-gradient(180deg,#141a20,#0a0e13); border-left:3px solid #2a3644; border-right:3px solid #2a3644;
    transform:perspective(500px) rotateX(52deg); opacity:0; }
  .car { position:absolute; width:26px; height:14px; border-radius:3px; background:#e07a4a; box-shadow:0 0 10px #e07a4a; }
  /* state 2: the grid of the dead */
  #g-hook-grid { position:absolute; left:110px; top:300px; width:1000px; opacity:0;
    background:rgba(16,24,32,0.45); border:1px solid rgba(42,54,68,0.6); border-radius:8px; padding:14px; }
  .cell { display:inline-block; width:70px; height:64px; margin:5px; position:relative; vertical-align:top; }
  .house { position:absolute; left:14px; top:14px; width:42px; height:30px; background:#33404d; }
  .house:before { content:""; position:absolute; left:-6px; top:-16px; border-left:27px solid transparent;
    border-right:27px solid transparent; border-bottom:16px solid #33404d; }
  .cell.home .house, .cell.home .house:before { }
  .ring { position:absolute; inset:0; border:2px solid transparent; border-radius:6px; }
  .bignum { position:absolute; left:1230px; top:280px; opacity:0; }
  #g-hook-count { font-family:'Courier New',monospace; font-weight:700; font-size:140px; color:#e8c56a; line-height:0.9; }
  .bigsub { font-family:'Arial Black',Arial,sans-serif; font-size:30px; color:#f2f5f8; margin-top:6px; width:560px; }
  .rows { position:absolute; left:1230px; top:600px; opacity:0; width:580px; }
  .r { font-size:26px; color:#dfe7ee; font-weight:700; letter-spacing:1px; margin-top:14px; }
  .r .k { display:inline-block; width:70px; font-family:'Courier New',monospace; color:#e74c3c; }
  .r .kh { color:#e8c56a; }
  .kicker { position:absolute; left:0; right:0; bottom:80px; text-align:center;
    font-family:'Arial Black',Arial,sans-serif; font-size:46px; color:#f2f5f8; opacity:0; letter-spacing:1px; }
  .legend { position:absolute; left:1230px; top:448px; font-size:20px; color:#93a3b2; opacity:0; line-height:1.65; }
  .dot { display:inline-block; width:16px; height:16px; border-radius:3px; margin-right:10px; vertical-align:middle; }
</style>
<div data-hf-id="hf-4img" id="root" data-composition-id="g-hook" data-width="1920" data-height="1080">
  <div data-hf-id="hf-3swo" class="hdr" id="g-hook-hdr">WHO DIED IN PARADISE — AND WHERE</div>
  <div data-hf-id="hf-87mt" id="g-hook-picture">
    <div data-hf-id="hf-nmct" id="g-hook-pichead">You picture them trapped in the cars, on the road out.</div>
    <div data-hf-id="hf-jhgn" id="g-hook-road"></div>
  </div>
  <div data-hf-id="hf-9rtd" id="g-hook-grid"></div>
  <div data-hf-id="hf-npso" class="bignum" id="g-hook-bignum"><div data-hf-id="hf-f7zy" id="g-hook-count">0</div><div data-hf-id="hf-uobf" class="bigsub">Of 84 died at home</div></div>
  <div data-hf-id="hf-1njm" class="legend" id="g-hook-legend">
    <div data-hf-id="hf-rdsl"><span data-hf-id="hf-06yv" class="dot" style="background:#e8c56a"></span>Inside the house (58)</div>
    <div data-hf-id="hf-sthm"><span data-hf-id="hf-5tux" class="dot" style="background:#e07a4a"></span>At the front door (13)</div>
    <div data-hf-id="hf-d86g"><span data-hf-id="hf-6u0q" class="dot" style="background:#e74c3c"></span>Fleeing (10)</div>
    <div data-hf-id="hf-yjh5"><span data-hf-id="hf-2ud6" class="dot" style="border:2px solid #4ecdc4; background:transparent"></span>Couldn't leave without help (15)</div>
  </div>
  <div data-hf-id="hf-7joa" class="rows" id="g-hook-rows">
    <div data-hf-id="hf-p8rh" class="r"><span data-hf-id="hf-60mp" class="k" style="color:#e8c56a">58</span>Inside the house</div>
    <div data-hf-id="hf-rkk5" class="r"><span data-hf-id="hf-n87u" class="k" style="color:#e07a4a">13</span>At the front door</div>
    <div data-hf-id="hf-fm9o" class="r"><span data-hf-id="hf-ouac" class="k" style="color:#e74c3c">10</span>Fleeing — 8 in cars</div>
    <div data-hf-id="hf-80ui" class="r"><span data-hf-id="hf-a63v" class="k" style="color:#4ecdc4">15</span>Couldn't leave without help</div>
  </div>
  <div data-hf-id="hf-ut5r" class="kicker" id="g-hook-kicker">The traffic did not kill Paradise. Staying did.</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const grid = document.getElementById("g-hook-grid");
  const cells=[];
  // 84 cells, color-coded by category (owner v4): 58 inside amber, 13 front-door orange,
  // 10 fleeing red, 3 other gray. The 15 who couldn't leave without help cross-cut the home
  // groups — they carry a TEAL ring (a color, not the old white outline).
  const mobility = new Set([2,7,11,15,19,23,28,31,36,40,44,49,53,60,66]);
  for(let i=0;i<84;i++){ const c=document.createElement("div"); c.className="cell";
    const h=document.createElement("div"); h.className="house"; const r=document.createElement("div"); r.className="ring";
    c.appendChild(h); c.appendChild(r);
    let col = i<58 ? "#e8c56a" : (i<71 ? "#e07a4a" : (i<81 ? "#e74c3c" : "#5a768f"));
    c._col=col; c._mob = i<71 && mobility.has(i);
    grid.appendChild(c); cells.push(c); }
  // road cars
  const road=document.getElementById("g-hook-road");
  for(let i=0;i<10;i++){ const car=document.createElement("div"); car.className="car";
    car.style.left=(30+ (i%2)*60)+"px"; car.style.top=(20+i*16)+"px"; road.appendChild(car); }

  const tl=gsap.timeline({paused:true});
  const P="#g-hook-";
  /* beats vs A5-S4 words.json (mount 1337.65, window 60.0): "hold the picture"@1.2 "gets wrong"@11.9
     "DA wrote the report"@13.5 "name by name"@20.3 "10 died trying to flee"@24.8 "71 in their own homes"@30.3
     "front doors"@34.6 "58 never made it out"@35.8 "15 ... wheelchairs or walkers"@38.8-46.1
     "no help could reach them"@49.7 "traffic did not kill Paradise"@51.8 tail ends ~59.2 */
  tl.set([P+"hdr",P+"pichead",P+"road",P+"grid",P+"bignum",P+"legend",P+"rows",P+"kicker"],{autoAlpha:0},0);
  tl.fromTo(P+"hdr",{autoAlpha:0,y:-16},{autoAlpha:1,y:0,duration:0.6},0.4);
  // state 1 — the wrong picture
  tl.to(P+"pichead",{autoAlpha:1,duration:0.6},1.6);
  tl.to(P+"road",{autoAlpha:1,duration:0.8},2.2);
  tl.to(".car",{y:"+=26",duration:1.3,ease:"sine.inOut",yoyo:true,repeat:7},2.4); // traffic creeps until the flip
  tl.to(P+"grid",{y:"-=8",duration:2.2,ease:"sine.inOut",yoyo:true,repeat:19},13.4); // grid breathes through the reveal
  // flip on "gets wrong": dismiss the road, reveal the grid dim
  tl.to([P+"pichead",P+"road"],{autoAlpha:0,duration:0.7},12.2);
  tl.to(P+"grid",{autoAlpha:1,duration:0.25},13.38); // reveal lands with the first cells — container never sits empty
  cells.forEach((c,i)=>{ tl.fromTo(c,{autoAlpha:0,scale:0.4},{autoAlpha:1,scale:1,duration:0.25,ease:"power2.out"},13.4+i*0.02); });
  // fleeing light up on "10 died trying to flee" (the small truth), then home floods on "71"
  tl.to(P+"legend",{autoAlpha:1,duration:0.5},23.5);
  cells.forEach((c,i)=>{ if(i>=71){ tl.to(c.querySelector(".house"),{backgroundColor:c._col,duration:0.3},24.8+(i-71)*0.05);
    tl.set(c.querySelector(".house"),{boxShadow:"0 0 12px "+c._col},24.8+(i-71)*0.05); }});
  cells.forEach((c,i)=>{ if(i<71){ tl.to(c.querySelector(".house"),{backgroundColor:c._col,duration:0.3},30.3+i*0.05); }});
  const cnt={v:0}; tl.to(P+"bignum",{autoAlpha:1,duration:0.5},30.3);
  tl.to(cnt,{v:71,duration:3.4,ease:"power2.out",onUpdate:function(){
    const el=document.getElementById("g-hook-count"); if(el) el.textContent=Math.round(cnt.v);}},30.3);
  // rows land with their spoken numbers — a list to follow, not a paragraph to read
  tl.set(P+"rows",{autoAlpha:1},35.5);
  const rowEls=document.querySelectorAll(".r"), rowAt=[35.7,37.0,38.0,38.9];
  rowEls.forEach((r,i)=>{ tl.fromTo(r,{autoAlpha:0,x:24},{autoAlpha:1,x:0,duration:0.4},rowAt[i]); });
  // the 15 teal rings draw exactly on "used wheelchairs or walkers or oxygen tanks"
  cells.forEach((c)=>{ if(c._mob) tl.to(c.querySelector(".ring"),{borderColor:"#4ecdc4",duration:0.4},39.0); });
  cells.forEach((c)=>{ if(c._mob) tl.to(c.querySelector(".ring"),{boxShadow:"0 0 10px #4ecdc4",duration:0.9,ease:"sine.inOut",yoyo:true,repeat:9},40.0); }); // pulse through "no help could reach them"
  tl.fromTo(P+"kicker",{autoAlpha:0,scale:1.15},{autoAlpha:1,scale:1,duration:0.7,ease:"power3.out"},51.6);
  // soft exit before the hard cut at 60.0
  tl.to([P+"grid",P+"bignum",P+"legend",P+"rows",P+"hdr"],{autoAlpha:0,duration:0.8},58.2);
  tl.to(P+"kicker",{autoAlpha:0,duration:0.6},58.8);
  window.__timelines["g-hook"]=tl;
})();
</script>
</template>
</body>
</html>
