<!DOCTYPE html>

<style>

    <div data-hf-id="hf-yeow"><span data-hf-id="hf-ccpz" class="stamp" id="g-stat-carr-stamp">EF3</span></div>

<script>
window.__timelines = window.__timelines || {};
(function() {
  /* beats tuned to A3-S8 read: "38 days @0; 229k acres @4; 1,604 @7; 8 lives @11; $1.6B @16"
     exit anchored to comp end (host window ~24s) minus 0.6 — retune when wiring index. */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-stat-carr-";
  tl.set([P+"deaths",P+"dlab",P+"wind",P+"acres",P+"bldg",P+"cost",P+"stamp"], {autoAlpha:0}, 0);
  tl.fromTo(P+"panel", {x:660}, {x:0, duration:0.7, ease:"power3.out"}, 0.0);
  tl.fromTo(P+"stamp", {scale:2.6, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.35, ease:"power4.in"}, 0.9);
  tl.to(P+"stamp", {scale:1.05, duration:1.1, ease:"sine.inOut", yoyo:true, repeat:17}, 1.3); // pulses end before the slide-out
  tl.fromTo(P+"wind", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 2.2);
  tl.fromTo(P+"acres", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 4.2);
  tl.fromTo(P+"bldg", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 6.8);

  tl.set([P+"deaths",P+"dlab"], {autoAlpha:1}, 10.4);
  tl.to(cnt, {v:8, duration:0.9, ease:"power4.out", onUpdate:function() {
      const el = document.getElementById("g-stat-carr-deaths"); if (el) el.textContent = Math.round(cnt.v);

  tl.fromTo(P+"cost", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 15.5);

  window.__timelines["g-stat-carr"] = tl;
})();
