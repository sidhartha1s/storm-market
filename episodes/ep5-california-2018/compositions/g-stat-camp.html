<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family: Arial, sans-serif;
    background: radial-gradient(ellipse at 50% 45%, #0b1016, #030507 78%); }
  .panel { position:absolute; right:0; top:0; bottom:0; width:820px; box-sizing:border-box;
    background: linear-gradient(270deg, rgba(6,9,13,0.94) 72%, rgba(6,9,13,0)); padding: 84px 70px 0 170px; }
  .eyebrow { font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .tname { font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#f2f5f8; line-height:1.05; margin-top:14px; }
  .tsub { font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:10px; }
  .stamp { display:inline-block; margin-top:30px; font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#fff;
    background:#8e2020; padding:8px 26px; letter-spacing:3px; }
  .row { font-size:30px; color:#dfe7ee; font-weight:700; letter-spacing:1px; margin-top:20px; }
  .row .lab { display:block; font-size:19px; color:#93a3b2; letter-spacing:4px; font-weight:700; }
  #g-stat-camp-deaths { font-family:'Courier New',monospace; font-size:84px; color:#e74c3c; font-weight:700; margin-top:24px; }
  .dlab { font-size:20px; color:#c8d3e0; letter-spacing:6px; font-weight:700; }
  .gone { font-family:Georgia,serif; font-style:italic; font-size:28px; color:#e8c56a; margin-top:22px; }
</style>
<div id="root" data-composition-id="g-stat-camp" data-width="1920" data-height="1080">
  <div class="panel" id="g-stat-camp-panel">
    <div class="eyebrow">CAL FIRE INCIDENT · FINAL</div>
    <div class="tname">THE CAMP FIRE</div>
    <div class="tsub">Paradise, California · November 8, 2018</div>
    <div><span class="stamp" id="g-stat-camp-stamp">CALIFORNIA'S DEADLIEST</span></div>
    <div class="row" id="g-stat-camp-bldg"><span class="lab">DESTROYED</span>18,804 BUILDINGS</div>
    <div class="row" id="g-stat-camp-acres"><span class="lab">BURNED</span>153,336 ACRES</div>
    <div class="row" id="g-stat-camp-cost"><span class="lab">COST</span>$16.5 BILLION</div>
    <div id="g-stat-camp-deaths">0</div>
    <div class="dlab" id="g-stat-camp-dlab">LIVES LOST</div>
    <div class="gone" id="g-stat-camp-gone">A town of 27,000 &mdash; gone in a morning.</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* beats tuned to A5-S7 read: "18,804 @1; 153k @4; $16.5B @7; 85 lives @11; town gone @16"
     exit anchored to comp end (host window ~22s) minus 0.6 — retune when wiring index. */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-stat-camp-";
  tl.set([P+"deaths",P+"dlab",P+"bldg",P+"acres",P+"cost",P+"gone",P+"stamp"], {autoAlpha:0}, 0);
  tl.fromTo(P+"panel", {x:660}, {x:0, duration:0.7, ease:"power3.out"}, 0.0);
  tl.fromTo(P+"stamp", {scale:2.2, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.35, ease:"power4.in"}, 0.9);
  tl.fromTo(P+"bldg", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 1.8);
  tl.fromTo(P+"acres", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 4.2);
  tl.fromTo(P+"cost", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.4}, 6.8);
  const cnt = {v:0};
  tl.set([P+"deaths",P+"dlab"], {autoAlpha:1}, 10.6);
  tl.to(cnt, {v:85, duration:1.4, ease:"power3.out", onUpdate:function() {
      const el = document.getElementById("g-stat-camp-deaths"); if (el) el.textContent = Math.round(cnt.v);
  } }, 10.6);
  tl.fromTo(P+"gone", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.5}, 15.5);
  tl.to(P+"panel", {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 20.0);
  window.__timelines["g-stat-camp"] = tl;
})();
</script>
</template>
</body>
</html>
