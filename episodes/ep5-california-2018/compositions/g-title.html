<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; }
  /* transparent root — the title rides the cold-open footage, no black hold */
  .scrim { position:absolute; inset:0;
    background:radial-gradient(ellipse at 50% 55%, rgba(3,5,7,0.62) 0%, rgba(3,5,7,0.18) 62%, rgba(3,5,7,0) 100%); }
  .stage { position:absolute; inset:0; display:grid; place-items:center; }
  .stack { text-align:center; }
  .main { font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:124px; color:#f2f5f8; letter-spacing:6px;
    line-height:1.02; text-shadow:0 4px 30px rgba(0,0,0,0.85); }
  .main .yr { color:#e8c56a; }
  .sub { font-family:Georgia,serif; font-style:italic; font-size:36px; color:#e8c56a; margin-top:26px;
    text-shadow:0 2px 14px rgba(0,0,0,0.8); }
  .rule { width:0px; height:4px; margin:22px auto 0; background:linear-gradient(90deg, rgba(232,197,106,0), #e8c56a 30%, #e07a4a 70%, rgba(224,122,74,0)); }
</style>
<div id="root" data-composition-id="g-title" data-width="1920" data-height="1080">
  <div class="scrim" id="g-title-scrim"></div>
  <div class="stage">
    <div class="stack">
      <div class="main" id="g-title-main">CALIFORNIA <span class="yr">&middot; 2018</span></div>
      <div class="rule" id="g-title-rule"></div>
      <div class="sub" id="g-title-sub">The fire that made its own tornado</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-title-main","#g-title-sub"], {autoAlpha:0}, 0);
  tl.fromTo("#g-title-scrim", {autoAlpha:0}, {autoAlpha:1, duration:0.5}, 0);
  // the window opens ON the boom (riser peaks at 24.2) — the title SLAMS, it does not fade
  tl.fromTo("#g-title-main", {autoAlpha:0, scale:1.45}, {autoAlpha:1, scale:1, duration:0.28, ease:"power4.out"}, 0.15);
  tl.to("#g-title-main", {x:6, duration:0.05, yoyo:true, repeat:5, ease:"none"}, 0.43); // impact shake
  tl.set("#g-title-main", {x:0}, 0.73);
  tl.to("#g-title-rule", {width:760, duration:0.7, ease:"power2.out"}, 0.9);
  tl.fromTo("#g-title-sub", {autoAlpha:0, y:10}, {autoAlpha:1, y:0, duration:0.6}, 1.5);
  tl.to("#g-title-main", {scale:1.04, duration:4.4, ease:"none"}, 1.2); // slow push, never frozen
  tl.to(".stack", {autoAlpha:0, duration:0.9}, 7.2);
  tl.to("#g-title-scrim", {autoAlpha:0, duration:0.9}, 7.4); /* ends 8.3 — inside the 8.72s host window */
  window.__timelines["g-title"] = tl;
})();
</script>
</template>
</body>
</html>
