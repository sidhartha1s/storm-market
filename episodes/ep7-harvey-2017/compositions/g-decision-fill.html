<!doctype html>
<html>

<body>
<template>
<style>

<div id="root" data-composition-id="g-decision-fill" data-width="1920" data-height="1080">

<div class="eyebrow" id="g-df-eb">INSIDE THE DAMS · AUGUST 25–28, 2017</div>

<div class="sub" id="g-df-sb">the storm they planned around, arrived at last</div>

</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* a5-s3 words: inside the dams@1.94-2.6 · 31 inches@7.52-8.06 · design storm@10.86-12.36 ·
     almost to the inch@14.34-15.32 · lakes rising@17.84-18.2 · half a foot every hour@19.12-20.02 ·
     passed every level@21.7-22.78 · oldest trade@26.84-27.14 · hold the water@28.96-29.48 ·
     open the gates@32.56-32.98 · on purpose@34.86-35.14 */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-df-";
  tl.set([P+"ds",P+"rate",P+"choice",P+"lvlA",P+"lvlB"], {autoAlpha:0}, 0);
  tl.fromTo(P+"eb", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.3);
  tl.fromTo(P+"hl", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 1.9);   // "inside the dams"
  tl.fromTo(P+"sb", {autoAlpha:0, x:-24}, {autoAlpha:1, x:0, duration:0.5}, 2.3);
  tl.fromTo([P+"colA",P+"colB"], {autoAlpha:0, y:30}, {autoAlpha:1, y:0, duration:0.6, ease:"power3.out", stagger:0.2}, 2.2);
  /* design-storm numbers ON "31 inches" @7.52 and "design storm" @10.86 */
  tl.fromTo(P+"ds", {autoAlpha:0, scale:1.1}, {autoAlpha:1, scale:1, duration:0.6, ease:"power3.out"}, 7.4);
  /* water rises continuously from "lakes rising" @17.84 to the end of the comp (the continuous element) */
  tl.fromTo(P+"wA", {attr:{y:860, height:0}}, {attr:{y:392, height:468}, duration:16.5, ease:"power1.in"}, 16.6);
  tl.fromTo(P+"wB", {attr:{y:860, height:0}}, {attr:{y:406, height:454}, duration:16.5, ease:"power1.in"}, 16.6);
  /* rate readout ON "half a foot every hour" @19.12 */
  tl.fromTo(P+"rate", {autoAlpha:0, x:40}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 19.0);
  /* record lines cross ON "passed every level ever recorded" @21.7 */
  tl.fromTo([P+"recA",P+"recAlab"], {opacity:0}, {opacity:1, duration:0.4}, 21.6);
  tl.fromTo([P+"recB",P+"recBlab"], {opacity:0}, {opacity:1, duration:0.4}, 22.0);
  tl.fromTo(P+"lvlA", {autoAlpha:0}, {autoAlpha:1, duration:0.4}, 23.2);
  tl.fromTo(P+"lvlB", {autoAlpha:0}, {autoAlpha:1, duration:0.4}, 23.6);
  /* the two choices land ON their spoken halves */
  tl.fromTo(P+"cha", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 28.9);  // "hold the water"
  tl.fromTo(P+"chb", {autoAlpha:0, y:24}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 32.5);  // "open the gates"
  tl.set(P+"choice", {autoAlpha:1}, 28.8);
  /* "on purpose" pulse @34.86 */
  tl.fromTo(P+"chb", {boxShadow:"0 0 0 rgba(231,76,60,0)"}, {boxShadow:"0 0 46px rgba(231,76,60,0.55)", duration:0.5, ease:"power2.out"}, 34.8);
  /* exit on the final 0.6s */
  tl.to([P+"hl",P+"sb",P+"eb",P+"rate",P+"choice"], {x:980, autoAlpha:0, duration:0.55, ease:"power3.in"}, 35.8);
  tl.to(P+"svg", {autoAlpha:0, duration:0.5}, 35.9);
  window.__timelines["g-decision-fill"] = tl;
})();
</script>
