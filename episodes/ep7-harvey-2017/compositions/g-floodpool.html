<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); overflow:hidden; }
  /* real plate: USGS US Topo "Addicks TX" quad 2022 (PD-FED), cropped to the reservoir band
     (media/maps/floodpool-plate.png, 1920x1440, shown y 120-1200). Landmarks used for anchoring:
     Katy Fwy red line at screen y≈754; Addicks greenbelt upper-right; Barker Reservoir green
     lower-center-right with its dam along the east edge; subdivision grid west (left half). */
  .plateband { position:absolute; inset:0; overflow:hidden; }
  .plate { position:absolute; left:0; top:-120px; width:1920px;
    opacity:0.80; filter:grayscale(0.22) brightness(0.66) contrast(1.10); }
  .platefade { position:absolute; inset:0; pointer-events:none; background:
    linear-gradient(180deg, rgba(4,7,10,0.95) 0%, rgba(4,7,10,0) 20%, rgba(4,7,10,0) 80%, rgba(4,7,10,0.95) 100%); }
  .platevig { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 55% 55%, rgba(4,7,10,0) 44%, rgba(4,7,10,0.74) 98%); }
  .eyebrow { position:absolute; left:96px; top:76px; font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .hl { position:absolute; left:96px; top:112px; font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#f2f5f8; }
  .sub { position:absolute; left:96px; top:196px; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; }
  .maplab { font-family:Arial,sans-serif; font-weight:700; font-size:24px; fill:#e8eef4; letter-spacing:2px;
    paint-order:stroke; stroke:rgba(4,7,10,0.85); stroke-width:6px; }
  .poollab { font-family:Arial,sans-serif; font-weight:700; font-size:27px; fill:#7fb2e5; letter-spacing:3px;
    paint-order:stroke; stroke:rgba(4,7,10,0.85); stroke-width:6px; }
  .rdg { position:absolute; left:96px; top:300px; }
  .rdgnum { font-family:'Courier New',monospace; font-size:84px; color:#e74c3c; font-weight:700; line-height:1; text-shadow:0 2px 20px rgba(0,0,0,0.9); }
  .rdglab { font-size:19px; letter-spacing:4px; color:#93a3b2; font-weight:700; margin-top:6px; text-shadow:0 2px 12px #000; }
  .foot { position:absolute; left:96px; bottom:84px; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; text-shadow:0 2px 14px #000; }
</style>
<div id="root" data-composition-id="g-floodpool" data-width="1920" data-height="1080">
<div class="plateband"><img class="plate" id="g-fp-plate" src="media/maps/floodpool-plate.png" alt=""><div class="platefade"></div><div class="platevig"></div></div>
<svg id="g-fp-svg" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
  <defs>
    <filter id="fpglow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- dam lines: Addicks along its S edge (above Katy Fwy), Barker along its E edge -->
  <path id="g-fp-damA" d="M 900 640 L 1500 668 L 1860 640" fill="none" stroke="#93a3b2" stroke-width="8" stroke-linecap="round" opacity="0"/>
  <text id="g-fp-damAlab" x="1330" y="628" text-anchor="middle" class="maplab" opacity="0">ADDICKS DAM</text>
  <path id="g-fp-damB" d="M 1428 812 L 1436 1070" fill="none" stroke="#93a3b2" stroke-width="8" stroke-linecap="round" opacity="0"/>
  <text id="g-fp-damBlab" x="1310" y="1046" text-anchor="middle" class="maplab" opacity="0">BARKER DAM</text>
  <!-- flood-pool boundaries (design extent, traced on the plate's greenbelt + fringe; approximate
       by nature — the design pool reaches past the government land into the street grid, which is
       the story's mechanism per the court record) -->
  <path id="g-fp-poolA" d="M 900 640 C 810 520 820 330 900 200 C 1060 90 1350 60 1640 90 C 1800 110 1880 200 1872 380 C 1866 520 1878 600 1860 640 C 1600 690 1150 680 900 640 Z"
        fill="rgba(90,140,190,0.15)" stroke="#7fb2e5" stroke-width="5" stroke-dasharray="3400" stroke-dashoffset="3400"/>
  <path id="g-fp-poolB" d="M 1428 812 C 1300 770 1050 764 900 800 C 800 826 770 900 780 1000 C 786 1050 810 1080 840 1080 L 1436 1080 C 1438 1000 1436 900 1428 812 Z"
        fill="rgba(90,140,190,0.15)" stroke="#7fb2e5" stroke-width="5" stroke-dasharray="2300" stroke-dashoffset="2300"/>
  <text id="g-fp-poolAlab" x="1300" y="330" text-anchor="middle" class="poollab" opacity="0">THE FLOOD POOL</text>
  <text id="g-fp-poolBlab" x="1080" y="950" text-anchor="middle" class="poollab" opacity="0">THE FLOOD POOL</text>
  <!-- subdivision clusters INSIDE the pool fringe (the grid the plate shows on the west edges) -->
  <g id="g-fp-homes" filter="url(#fpglow)">
    <g id="g-fp-hg1" opacity="0"><rect x="856" y="300" width="16" height="12" fill="#e8c56a"/><rect x="878" y="302" width="16" height="12" fill="#e8c56a"/><rect x="900" y="298" width="16" height="12" fill="#e8c56a"/><rect x="866" y="320" width="16" height="12" fill="#e8c56a"/><rect x="890" y="322" width="16" height="12" fill="#e8c56a"/></g>
    <g id="g-fp-hg2" opacity="0"><rect x="880" y="430" width="16" height="12" fill="#e8c56a"/><rect x="902" y="432" width="16" height="12" fill="#e8c56a"/><rect x="924" y="428" width="16" height="12" fill="#e8c56a"/><rect x="890" y="450" width="16" height="12" fill="#e8c56a"/><rect x="914" y="452" width="16" height="12" fill="#e8c56a"/><rect x="938" y="448" width="16" height="12" fill="#e8c56a"/></g>
    <g id="g-fp-hg3" opacity="0"><rect x="960" y="170" width="16" height="12" fill="#e8c56a"/><rect x="982" y="172" width="16" height="12" fill="#e8c56a"/><rect x="1004" y="168" width="16" height="12" fill="#e8c56a"/></g>
    <g id="g-fp-hg4" opacity="0"><rect x="820" y="840" width="16" height="12" fill="#e8c56a"/><rect x="842" y="842" width="16" height="12" fill="#e8c56a"/><rect x="864" y="838" width="16" height="12" fill="#e8c56a"/><rect x="830" y="860" width="16" height="12" fill="#e8c56a"/><rect x="854" y="862" width="16" height="12" fill="#e8c56a"/></g>
    <g id="g-fp-hg5" opacity="0"><rect x="810" y="960" width="16" height="12" fill="#e8c56a"/><rect x="832" y="962" width="16" height="12" fill="#e8c56a"/><rect x="854" y="958" width="16" height="12" fill="#e8c56a"/><rect x="822" y="980" width="16" height="12" fill="#e8c56a"/></g>
  </g>
  <text id="g-fp-inside" x="620" y="740" text-anchor="middle" class="maplab" fill="#e8c56a" opacity="0" font-size="28">BUILT INSIDE THE LINES</text>
  <!-- Buffalo Bayou leaving Barker's outlet toward downtown (off-frame east) -->
  <path id="g-fp-bayou" d="M 1436 940 C 1560 900 1700 850 1880 820" fill="none" stroke="#5a768f" stroke-width="5" stroke-dasharray="520" stroke-dashoffset="520" opacity="0.95"/>
  <text id="g-fp-bayoulab" x="1590" y="870" class="maplab" opacity="0" font-style="italic" fill="#7fb2e5">BUFFALO BAYOU</text>
  <g id="g-fp-dt" opacity="0">
    <path d="M 1790 780 L 1874 780 M 1854 764 L 1878 780 L 1854 796" fill="none" stroke="#93a3b2" stroke-width="6" stroke-linecap="round"/>
    <text x="1878" y="746" text-anchor="end" class="maplab">DOWNTOWN · 20 MI</text>
  </g>
</svg>
<div class="eyebrow" id="g-fp-eb">U.S. ARMY CORPS OF ENGINEERS · DESIGNED INUNDATION</div>
<div class="hl" id="g-fp-hl">THE LINES ON THE MAP</div>
<div class="sub" id="g-fp-sb">the land the water is designed to cover</div>
<div class="rdg" id="g-fp-rdg"><div class="rdgnum">~<span id="g-fp-homesnum">0</span></div><div class="rdglab">HOMES BUILT INSIDE THE FLOOD POOLS</div></div>
<div class="foot" id="g-fp-ft">dry almost all the time — soccer fields, hiking trails, subdivisions</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* a4-s1 words: Addicks and Barker@3.88-4.76 · hold back two reservoirs@9.48 · dry almost all the
     time@11.4-12.74 · soccer fields/trails@14.42-15.72 · government's own maps@17.36-18.06 ·
     line around each one@18.96-19.8 · Flood Pool@20.6-20.82 · designed to cover@23.0-23.6 ·
     by 2017@26.38-27.24 · 14,000@29.12-29.68 · built inside those lines@31.08-32.04 ·
     subdivisions@33.28 · inside the pool@37.08-37.74 */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-fp-";
  tl.set([P+"rdg",P+"ft"], {autoAlpha:0}, 0);
  /* continuous: slow plate push the whole comp */
  tl.fromTo(P+"plate", {scale:1.0}, {scale:1.07, duration:39.0, ease:"none", transformOrigin:"60% 55%"}, 0);
  tl.fromTo(P+"eb", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.3);
  tl.fromTo(P+"hl", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.6);
  tl.fromTo(P+"sb", {autoAlpha:0, x:-24}, {autoAlpha:1, x:0, duration:0.5}, 0.9);
  /* dams ON "Addicks and Barker" @3.88 */
  tl.fromTo(P+"damA", {opacity:0}, {opacity:1, duration:0.5}, 3.8);
  tl.fromTo(P+"damAlab", {opacity:0}, {opacity:1, duration:0.4}, 4.0);
  tl.fromTo(P+"damB", {opacity:0}, {opacity:1, duration:0.5}, 4.5);
  tl.fromTo(P+"damBlab", {opacity:0}, {opacity:1, duration:0.4}, 4.7);
  /* bayou + downtown pointer ON "hold back two reservoirs" @9.48 (what the dams protect) */
  tl.to(P+"bayou", {strokeDashoffset:0, duration:1.6, ease:"power2.inOut"}, 9.4);
  tl.fromTo(P+"bayoulab", {opacity:0}, {opacity:0.9, duration:0.5}, 10.2);
  tl.fromTo(P+"dt", {opacity:0}, {opacity:1, duration:0.5}, 10.7);
  /* footer ON "dry enough for soccer fields" @13.62 */
  tl.fromTo(P+"ft", {autoAlpha:0, y:18}, {autoAlpha:1, y:0, duration:0.5}, 13.6);
  /* pool boundaries trace ON "a line around each one" @18.96; labels ON "Flood Pool" @20.6 */
  tl.to(P+"poolA", {strokeDashoffset:0, duration:2.8, ease:"power2.inOut"}, 18.9);
  tl.to(P+"poolB", {strokeDashoffset:0, duration:2.4, ease:"power2.inOut"}, 19.5);
  tl.fromTo(P+"poolAlab", {opacity:0}, {opacity:1, duration:0.5}, 20.6);
  tl.fromTo(P+"poolBlab", {opacity:0}, {opacity:1, duration:0.5}, 21.0);
  /* pools breathe (continuous through the back half) */
  tl.fromTo([P+"poolA",P+"poolB"], {attr:{"fill-opacity":0.09}}, {attr:{"fill-opacity":0.24}, duration:2.6, yoyo:true, repeat:6, ease:"sine.inOut"}, 21.4);
  /* homes counter ON "by 2017, roughly 14,000" @26.38-29.68 */
  const H={v:0};
  tl.fromTo(P+"rdg", {autoAlpha:0, x:-40}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 28.6);
  tl.to(H, {v:14000, duration:2.6, ease:"power3.out", onUpdate:function(){
    const e=document.getElementById("g-fp-homesnum"); if(e) e.textContent=Math.round(H.v).toLocaleString("en-US");
  }}, 28.9);
  /* home clusters appear inside the lines ON "built inside those lines" @31.08 → "subdivisions" @33.28 */
  tl.fromTo(P+"hg1", {opacity:0}, {opacity:1, duration:0.35}, 31.0);
  tl.fromTo(P+"hg2", {opacity:0}, {opacity:1, duration:0.35}, 31.5);
  tl.fromTo(P+"hg3", {opacity:0}, {opacity:1, duration:0.35}, 32.0);
  tl.fromTo(P+"hg4", {opacity:0}, {opacity:1, duration:0.35}, 33.3);
  tl.fromTo(P+"hg5", {opacity:0}, {opacity:1, duration:0.35}, 33.9);
  /* the landing line ON "inside the pool" @37.08 */
  tl.fromTo(P+"inside", {opacity:0}, {opacity:1, duration:0.5}, 37.0);
  /* exit on the final 0.6s */
  tl.to([P+"hl",P+"sb",P+"eb",P+"rdg",P+"ft"], {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 38.4);
  tl.to([P+"svg",P+"plate"], {autoAlpha:0, duration:0.5}, 38.5);
  window.__timelines["g-floodpool"] = tl;
})();
</script>
</template>
</body>
</html>
