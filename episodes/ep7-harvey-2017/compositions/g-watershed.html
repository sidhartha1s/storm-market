<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); overflow:hidden; }
  .eyebrow { position:absolute; left:96px; top:76px; font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .hl { position:absolute; left:96px; top:112px; font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#f2f5f8; }
  .sub { position:absolute; left:96px; top:196px; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; }
  .halflab { font-family:Arial,sans-serif; font-weight:700; font-size:26px; fill:#e8eef4; letter-spacing:3px; }
  .small { font-size:19px; letter-spacing:4px; fill:#93a3b2; font-weight:700; }
  .verdrow { position:absolute; left:96px; bottom:110px; }
  .verdrow .big { font-family:'Arial Black',Arial,sans-serif; font-size:44px; color:#f2f5f8; }
  .verdrow .it { font-family:Georgia,serif; font-style:italic; font-size:25px; color:#e8c56a; margin-top:8px; }
</style>
<div id="root" data-composition-id="g-watershed" data-width="1920" data-height="1080">
<svg viewBox="0 0 1920 1080" style="position:absolute;inset:0">
  <defs>
    <linearGradient id="wsrain" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fb2e5"/><stop offset="100%" stop-color="#5a768f"/></linearGradient>
    <clipPath id="wsclipL"><rect x="180" y="330" width="640" height="420"/></clipPath>
    <clipPath id="wsclipR"><rect x="1100" y="330" width="640" height="420"/></clipPath>
  </defs>
  <!-- LEFT: prairie absorbs -->
  <g id="g-ws-left">
    <rect x="180" y="640" width="640" height="110" rx="8" fill="#2e4a2e"/>
    <path d="M 180 640 Q 340 610 500 640 T 820 640" fill="none" stroke="#4a7a4a" stroke-width="6"/>
    <text x="500" y="800" text-anchor="middle" class="halflab">PRAIRIE</text>
    <text x="500" y="836" text-anchor="middle" class="small">ONE ACRE · DRINKS THE RAIN</text>
    <g clip-path="url(#wsclipL)" id="g-ws-rainL">
      <line x1="300" y1="330" x2="280" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="420" y1="330" x2="400" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="540" y1="330" x2="520" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="660" y1="330" x2="640" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
    </g>
    <!-- absorption arrows: rain sinks IN -->
    <path id="g-ws-sink1" d="M 400 660 v 60" stroke="#7fb2e5" stroke-width="6" marker-end="none" opacity="0"/>
    <path id="g-ws-sink2" d="M 560 660 v 60" stroke="#7fb2e5" stroke-width="6" opacity="0"/>
  </g>
  <!-- RIGHT: concrete sheds -->
  <g id="g-ws-right">
    <rect x="1100" y="640" width="640" height="110" rx="8" fill="#3a4048"/>
    <rect x="1150" y="560" width="90" height="80" fill="#4a525c"/>
    <rect x="1290" y="530" width="110" height="110" fill="#4a525c"/>
    <rect x="1450" y="575" width="80" height="65" fill="#4a525c"/>
    <rect x="1570" y="545" width="100" height="95" fill="#4a525c"/>
    <text x="1420" y="800" text-anchor="middle" class="halflab">CONCRETE</text>
    <text x="1420" y="836" text-anchor="middle" class="small">TWO ACRES OF NEW HOUSES · SHEDS IT ALL</text>
    <g clip-path="url(#wsclipR)" id="g-ws-rainR">
      <line x1="1220" y1="330" x2="1200" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="1340" y1="330" x2="1320" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="1460" y1="330" x2="1440" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
      <line x1="1580" y1="330" x2="1560" y2="640" stroke="url(#wsrain)" stroke-width="4" opacity="0.7"/>
    </g>
    <!-- runoff arrow: grows scaleX toward the bayou -->
    <path id="g-ws-runoff" d="M 1150 770 H 1740" stroke="#e74c3c" stroke-width="10" stroke-linecap="round" opacity="0.95"/>
    <text id="g-ws-runofflab" x="1445" y="745" text-anchor="middle" class="halflab" fill="#e74c3c" opacity="0">RUNOFF · NOWHERE TO GO</text>
  </g>
  <!-- design standard bar: 100-yr vs 1000-yr -->
  <g id="g-ws-std">
    <rect x="180" y="920" width="1560" height="10" fill="rgba(147,163,178,0.25)"/>
    <rect id="g-ws-std100" x="180" y="908" width="156" height="34" fill="#5a768f"/>
    <text id="g-ws-std100lab" x="180" y="890" class="small" opacity="0">BUILT FOR: 100-YEAR STORM</text>
    <rect id="g-ws-std1000" x="180" y="908" width="0" height="34" fill="#c0392b" opacity="0.9"/>
    <text id="g-ws-std1000lab" x="1740" y="890" text-anchor="end" class="small" fill="#e74c3c" opacity="0">HARVEY: 1,000-YEAR STORM</text>
  </g>
</svg>
<div class="eyebrow" id="g-ws-eb">HARRIS COUNTY FLOOD CONTROL DISTRICT · OWN RESEARCH</div>
<div class="hl" id="g-ws-hl">THE MATH THE COUNTY DID</div>
<div class="sub" id="g-ws-sb">one acre of prairie offsets two acres of new houses</div>
<div class="verdrow" id="g-ws-vd"><div class="big">UNDER-DESIGNED BY AN ORDER OF MAGNITUDE</div><div class="it">its leadership disputed the finding · the building went on</div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* a2-s2 words: done the math@2.48-2.84 · single acre prairie@4.52-5.5 · soaks up@5.94 ·
     two acres new houses@8.08-9.14 · disputed@11.64 · building went on@13.7-14.4 ·
     100-year storm@19.6-20.36 · 1,000-year storm@22.16-23.04 · order of magnitude@28.62-29.1 */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-ws-";
  tl.set([P+"left",P+"right",P+"std",P+"vd",P+"runoff"], {autoAlpha:0}, 0);
  tl.fromTo(P+"eb", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 0.3);
  tl.fromTo(P+"hl", {autoAlpha:0, x:-30}, {autoAlpha:1, x:0, duration:0.5, ease:"power3.out"}, 2.4);  // "done the math"
  tl.fromTo(P+"sb", {autoAlpha:0, x:-24}, {autoAlpha:1, x:0, duration:0.5}, 3.9);                     // "single acre"
  /* prairie half ON "single acre of prairie" @4.5 */
  tl.fromTo(P+"left", {autoAlpha:0, y:34}, {autoAlpha:1, y:0, duration:0.6, ease:"power3.out"}, 4.4);
  /* continuous rain fall on both halves (loops the whole comp) */
  tl.fromTo(P+"rainL line", {y:-90}, {y:60, duration:1.1, repeat:22, ease:"none", stagger:0.16}, 4.6);
  tl.fromTo([P+"sink1",P+"sink2"], {opacity:0, y:-14}, {opacity:0.9, y:10, duration:1.3, repeat:16, ease:"sine.in", stagger:0.4}, 5.9); // "soaks up"
  /* concrete half ON "two acres of new houses" @8.08 */
  tl.fromTo(P+"right", {autoAlpha:0, y:34}, {autoAlpha:1, y:0, duration:0.6, ease:"power3.out"}, 8.0);
  tl.fromTo(P+"rainR line", {y:-90}, {y:60, duration:1.1, repeat:18, ease:"none", stagger:0.16}, 8.3);
  /* runoff arrow grows ON the concrete beat, pulses through "building went on" */
  tl.fromTo(P+"runoff", {autoAlpha:0, scaleX:0, transformOrigin:"left center"}, {autoAlpha:1, scaleX:1, duration:0.8, ease:"power2.out"}, 9.3);
  tl.fromTo(P+"runofflab", {opacity:0}, {opacity:1, duration:0.5}, 9.8);
  tl.to(P+"runoff", {opacity:0.55, duration:0.9, yoyo:true, repeat:8, ease:"sine.inOut"}, 10.6);
  /* the standard bar: 100-yr ON @19.6, Harvey bar races past ON @22.16 */
  tl.fromTo(P+"std", {autoAlpha:0}, {autoAlpha:1, duration:0.4}, 19.4);
  tl.fromTo(P+"std100lab", {opacity:0}, {opacity:1, duration:0.4}, 19.6);
  tl.fromTo(P+"std1000", {attr:{width:0}}, {attr:{width:1560}, duration:2.6, ease:"power2.in"}, 22.1);
  tl.fromTo(P+"std1000lab", {opacity:0}, {opacity:1, duration:0.4}, 23.6);
  /* verdict ON "order of magnitude" @28.62 */
  tl.fromTo(P+"vd", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.55, ease:"power3.out"}, 27.9);
  /* exit on the final 0.6s */
  tl.to([P+"hl",P+"sb",P+"eb",P+"vd"], {x:980, autoAlpha:0, duration:0.55, ease:"power3.in"}, 30.0);
  tl.to("svg", {autoAlpha:0, duration:0.5}, 30.1);
  window.__timelines["g-watershed"] = tl;
})();
</script>
</template>
</body>
</html>
