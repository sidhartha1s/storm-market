     Written by hand. Times come from the wav lengths, audio/*.words.json and a silence scan of every wav:
     - Paul speaks H1-S1 on camera (ins-paul-1, his own sound, no narration under it; audio/h1-s1.wav is not mounted). His sound ends
       at 9.71 s of the clip, so the clip is cut at 9.72 and the toll graphic starts on that frame, never on black.
     - Every narration wav opens with 0.17 to 0.55 s of silence and closes with 0.24 to 0.44 s of it (silencedetect at -35 dB), and
       words.json writes 0.00 for the first word. So a first word is timed from the scan, every other word from words.json.
     - Gaps: the first wav starts 0.15 s after Paul's clip ends. After that, the silence from the last sound of one segment to the first
       sound of the next is the land time the graphic's brief names (1.0 s; 0.8 s after I1-S2; 1.2 s after I1-S3; 1.5 s after I1-S6
       and I1-S9), and 0.8 s inside a graphic that runs across segments. The wavs are placed to give that silence, never more than
       0.75 s apart (lint allows 0.8 s), which holds the gap after I1-S9 to 1.33 s. T1-S2 to T1-S3 is set by hand to 0.65 s between
       wavs: the eight rows need 1.57 s after "list" before "State" is read.
     - Every graphic host starts on the first sound of its first segment and ends where the next one starts. Two follow their briefs
       instead: g-t1s1-toll starts on the cut from Paul (0.58 s before "Two"), and g-t1s3-list starts on the word "list" of T1-S2
       (match cut out of g-t1s2-warning).
     - Every graphic in this set is full frame with its own ground (mg_specs/00-design-sheet.md section 3), so no still is mounted here.
     - This cut ends on the 0.7 s blackout after I1-S10. No book ad and no chapter card in it.
     PRESENTER CIRCLE: not mounted in this cut (the face is made later on the ZBook). It would run from 37.60 to 112.48, I1-S1's first
     word to the end of the list question: face on track 7, ring on track 9, as references/mg-quickref.md "Corner circle". It stays off
