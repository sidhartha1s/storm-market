<script>

  /* ---- camera block (as the map bases): the viewBox is the camera. The push is geometric (the logZoom maths of
          library/inhouse/snippets/helpers.js: the width runs w0 x (w1 / w0)^p). Every viewBox number and every dot radius is
          a straight line in that width, so one ease on a plain attr tween moves them together and lands the end values
          exactly; no onUpdate, so a seek with events off lands the camera too. ratio = w1 / w0 ---- */
  var map = $("map"), dots = map.querySelectorAll(".brm-dot");
  function camEase(ratio, ease) { var e = gsap.parseEase(ease); return function (p) { return (1 - Math.pow(ratio, e(p))) / (1 - ratio); }; }
  function cam(viewBox, dotR, ratio, t, d, ease) {
    tl.to(map, { attr: { viewBox: viewBox }, duration: d, ease: camEase(ratio, ease) }, t);
    tl.to(dots, { attr: { r: dotR }, duration: d, ease: camEase(ratio, ease) }, t);        /* a dot stays 6 px on screen */
  }
  /* the box is tall while the lower band is free (plan rule 22) and the briefed 716, 62, 1080 x 450 while the strip is there */
  var OPEN = "polygon(716px 62px, 1796px 62px, 1796px 660px, 1580px 660px, 1580px 1000px, 716px 1000px)";

  dash(mic); dash(house); dash(p1); dash(p2);

  s0($("adraw"), { strokeDasharray: 666, strokeDashoffset: 666 });     /* the arc is 664.5 px long */
