<div id="fpl-root" data-composition-id="g-a6s02-floorplan" data-width="1920" data-height="1080" data-duration="10.15">

  <svg class="fpl-svg" viewBox="0 0 1920 1080" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <g stroke="#dfe7ee" stroke-width="4">

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a6s02-floorplan", P = "fpl", D = 10.15;
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  /* ---- draw-on: a dash restarts on every sub-path, so a shape of several lines is dashed by its longest one ---- */
  function longest(e) {
    if (e.tagName !== "path") return e.getTotalLength();
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path"), max = 0;
    e.getAttribute("d").split("M").forEach(function (s) { if (!s.trim()) return; p.setAttribute("d", "M" + s); max = Math.max(max, p.getTotalLength()); });
    return max;
  }
  function draw(id, t, d) {                                 /* longest line first, all lines done d after t */
    var lines = Array.prototype.slice.call($(id).children);
    lines.sort(function (a, b) { return b.getTotalLength() - a.getTotalLength(); });
    var step = d * 0.4 / lines.length;
    lines.forEach(function (e, i) {
      var L = Math.ceil(longest(e)) + 1; s0(e, { strokeDasharray: L, strokeDashoffset: L });
      tl.set(e, { autoAlpha: 1 }, t + i * step);
      tl.to(e, { strokeDashoffset: 0, duration: d - i * step, ease: "power2.out" }, t + i * step);
    });
  }
  function rise(id, t) { s0($(id), { y: 16 }); tl.to($(id), { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, t); }

  var WHITE = "#f2f5f8", GREY = "#93a3b2", AMBER = "#e8c56a";
  var wire = $("wire"), lamp = $("lamp"), strip = $("strip");

  /* rest states, set at 0 */
  s0(wire, { strokeDasharray: 791, strokeDashoffset: 791 });   /* the wire is 790 px long */
  s0(strip, { y: 60 });
  s0([$("d1"), $("d2"), $("d3")], { stroke: GREY });

  /* 0 · "The" @0.00: ground, the empty plan with its three doors, the schematic line, the source line */

  /* 1 · teletypes @1.23: the teletype draws on in the left room; its label rises under it */
  draw("tty", 1.23, 0.5);
  rise("lab1", 1.23);

  /* 2 · doors @2.57: the three doors pulse left to right, 0.2 s apart: Label grey to Headline white and back, stroke only */
  ["d1", "d2", "d3"].forEach(function (id, i) {
    tl.to($(id), { stroke: WHITE, duration: 0.15, ease: "none" }, 2.57 + i * 0.2);
    tl.to($(id), { stroke: GREY, duration: 0.25, ease: "none" }, 2.72 + i * 0.2);
  });

  /* 3 · announcer. @3.45: the microphone draws on in the right room; its label rises under it */
  draw("mic", 3.45, 0.5);
  rise("lab2", 3.45);

  /* 4 · stations @4.93: the source line leaves; the quote strip rises (it carries the attribution) */
  tl.to($("src"), { autoAlpha: 0, duration: 0.2, ease: "none" }, 4.93);
  tl.to(strip, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.93);

  /* 5 · alarm @5.79: the bell mark draws on above the teletype */
  draw("bell", 5.79, 0.4);

  /* 6 · one @7.13: the wire runs from the teletype through the three doors to the lamp (arrives @8.03); the lamp's outline
     fades in as it arrives */
  tl.set(wire, { autoAlpha: 1 }, 7.13);
  tl.to(wire, { strokeDashoffset: 0, duration: 0.9, ease: "none" }, 7.13);
  tl.to(lamp, { autoAlpha: 1, duration: 0.2, ease: "none" }, 7.83);

  /* 7 · announcer @8.25: the lamp lights, after the wire has reached it: fill Amber 2, stroke Headline white */
  tl.to(lamp, { fill: AMBER, stroke: WHITE, duration: 0.25, ease: "power2.out" }, 8.25);

  /* the hold: the lamp's fill steps to 0.55 and back, twice (0.4 s each way), a fill change only */
  tl.to(lamp, { fillOpacity: 0.55, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.5);

  tl.to({}, { duration: 0.01 }, D - 0.01);

  window.__timelines[ID] = tl;
})();
</script>
