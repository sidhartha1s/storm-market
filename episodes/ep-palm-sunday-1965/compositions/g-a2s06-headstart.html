     block lift out whole.

     screen y unchanged), so both panels share one set of rules. Clock: media/drawings/wall-clock.svg (DR-09) inline at 1.5.
     Bars: 40 px per minute from a zero tick that stands for the 5:43 PM warning; widths are set from the minutes in the script.

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a2s06-headstart", P = "hs";
  var PXM = 40, HEAD_L = 2, HEAD_R = 17, DELAY = 10, LINE = 3;   /* px per minute; minutes; the head start bar's outline */
  var HUB = "62 62";                                             /* the hands turn about the face centre, in the drawing's own units */
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */
  function fade(id, t, d) { tl.to($(id), { autoAlpha: 1, duration: d, ease: "none" }, t); }
  function rise(id, t, d) { tl.to($(id), { y: 0, autoAlpha: 1, duration: d, ease: "power3.out" }, t); }
  function grow(id, t, d, ease) { tl.set($(id), { autoAlpha: 1 }, t); tl.to($(id), { scaleX: 1, duration: d, ease: ease }, t); }

  /* bar lengths from the minutes: head starts 80 and 680 px, delay 400 px in both panels, washes 80 and 400 px less the outline */
  $("l-head").style.width = (HEAD_L * PXM) + "px";
  $("r-head").style.width = (HEAD_R * PXM) + "px";
  $("l-delay").style.width = (DELAY * PXM) + "px";
  $("r-delay").style.width = (DELAY * PXM) + "px";
  $("l-wash").style.width = (HEAD_L * PXM - 2 * LINE) + "px";
  $("r-wash").style.width = (DELAY * PXM - LINE) + "px";

  /* rest states, set at 0 */
  s0($("l-hour"), { rotation: 172.5, svgOrigin: HUB });    /* 5:45: hour hand just short of 6 */
  s0($("l-min"), { rotation: 240, svgOrigin: HUB });       /* sweeps its last 30 degrees onto the 9 */
  s0($("r-hour"), { rotation: 180, svgOrigin: HUB });      /* 6:00: hour hand on 6 */
  s0($("r-min"), { rotation: 330, svgOrigin: HUB });       /* sweeps its last 30 degrees onto 12 */
  s0([$("l-time"), $("r-time"), $("l-place"), $("r-place")], { y: 16 });
  s0($("frame-src"), { y: 12 });
  s0([$("l-tick"), $("r-tick")], { scaleY: 0, transformOrigin: "50% 0%" });
  s0([$("l-head"), $("r-head"), $("l-wash"), $("r-wash"), $("l-delay"), $("r-delay")], { scaleX: 0, transformOrigin: "left center" });

  /* 0 · "The" @0.00: both panels, rule and face without hands; the right panel at 0.45 */
  fade("l-src", 0.09, 0.3);                                /* 1 · Weather @0.09 */

  /* 2 · 545 @3.01: the left hands, the minute hand's sweep, the time */
  tl.to([$("l-hour"), $("l-min")], { autoAlpha: 1, duration: 0.15, ease: "none" }, 3.01);
  tl.to($("l-min"), { rotation: 270, duration: 0.5, ease: "power3.out" }, 3.01);
  rise("l-time", 3.01, 0.35);
  rise("l-place", 4.51, 0.3);                              /* 3 · Stark @4.51: Starke County */

  /* 4 · 1966 @6.13: the right panel to full, its source line with it */
  tl.to($("r"), { opacity: 1, duration: 0.3, ease: "none" }, 6.13);
  fade("r-src", 6.13, 0.3);
  tl.to($("r-about"), { autoAlpha: 1, duration: 0.2, ease: "power2.out" }, 8.95);   /* 5 · about @8.95, mostly up before the time starts @9.13 */

  /* 6 · 6 @9.13: the right hands, the minute hand's sweep, the time */
  tl.to([$("r-hour"), $("r-min")], { autoAlpha: 1, duration: 0.15, ease: "none" }, 9.13);
  tl.to($("r-min"), { rotation: 360, duration: 0.5, ease: "power3.out" }, 9.13);
  rise("r-time", 9.13, 0.35);
  rise("r-place", 10.21, 0.3);                             /* 7 · Marshall @10.21 */

  /* 8 · "A" @11.69: both zero ticks draw, both tick labels and the frame source line in */

  tl.to([$("l-tick"), $("r-tick")], { scaleY: 1, duration: 0.25, ease: "power2.out" }, 11.69);
  fade("l-ticklab", 11.69, 0.12); fade("r-ticklab", 11.69, 0.12);   /* up before the bars start @11.82 */
  rise("frame-src", 11.69, 0.3);

  grow("l-delay", 11.82, 0.5, "power2.out"); grow("r-delay", 11.82, 0.5, "power2.out");
  fade("l-delaylab", 12.12, 0.2); fade("r-delaylab", 12.12, 0.2);

  /* 10 · 2 @13.46: the left head start bar and its label; 11 · head @13.86: the wash covers all of it */
  grow("l-head", 13.46, 0.3, "power2.out"); fade("l-headlab", 13.46, 0.3);
  grow("l-wash", 13.86, 0.3, "none");

  /* 12 · 17 @15.60: the right head start bar and its label; 13 · one @16.22: the wash stops at 400 of its 680 px */
  grow("r-head", 15.60, 0.5, "power2.out"); fade("r-headlab", 15.60, 0.3);
  grow("r-wash", 16.22, 0.4, "none");

  /* hold to the last frame @17.66 */
  tl.to({}, { duration: 0.01 }, 17.65);

  window.__timelines[ID] = tl;
