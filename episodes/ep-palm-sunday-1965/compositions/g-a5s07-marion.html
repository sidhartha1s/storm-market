<script>

(function () {
  var ID = "g-a5s07-marion", P = "mrn";
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  var map = $("map");

  s0($("hh"), { rotation: 280, svgOrigin: "95 100" });      /* 9:20: hour hand a third of the way from 9 to 10 */
  s0($("mh"), { rotation: 90, svgOrigin: "95 100" });       /* minute hand sweeps its last 30 degrees onto the 4 */

  /* ================= A5-S7: the path, Marion, the 9:20 message ================= */
  /* 0 · "That" @0.00: ground, the map in EAST (lines only), Fort Wayne's dot and label, OHIO */

  /* 1 · "storm" @0.51: the path draws west to east (1.2 s, to @1.71); Linn Grove's dot and name as the line reaches it (82 %) */

  show([$("pt-linn-grove"), $("lg")], 1.35, 0.2);

  /* 2 · "Marion." @1.85: Marion's dot and name; the dot's stroke flashes Headline white once; the path caption */
  show([$("pt-marion"), $("mar"), $("cap")], 1.85);
  tl.to($("mdot"), { attr: { "stroke-opacity": 1 }, duration: 0.1, ease: "none" }, 2.15);
  tl.to($("mdot"), { attr: { "stroke-opacity": 0 }, duration: 0.4, ease: "power1.out" }, 2.25);

  /* 3 · "nine twenty" @3.31: the map's box closes to its left edge; the stamp slides in from the left, the minute hand lands on the 4 */

  tl.fromTo($("stamp"), { autoAlpha: 0, x: -660 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 3.31);
  tl.to($("mh"), { rotation: 120, duration: 0.5, ease: "power3.out" }, 3.51);

  /* 4 · "wire," @5.07: the map's box closes to its briefed size; the page slides in from the right; its source fades in after */
  tl.to(map, { clipPath: BOX, duration: 0.3, ease: "power2.out" }, 5.07);
  tl.fromTo($("page"), { autoAlpha: 0, x: 660 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 5.07);
  tl.fromTo($("doc"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 5.47);

  /* 5 · "three" @6.03: the rest of the page goes unlit; the underline draws under the message's words */
  tl.to($("unlit"), { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 6.03);
  tl.to($("ul"), { scaleX: 1, duration: 0.7, ease: "none" }, 6.03);

  /* ================= A5-S8: an hour and twenty minutes, and the stopped clock ================= */
  /* 6 · "Marion" @9.96: the source fades, the page leaves to the right, the map's box opens down again; the chip beside Marion's dot */
  tl.to($("doc"), { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, 9.96);
  tl.to($("page"), { x: 1600, duration: 0.4, ease: "power3.in" }, 9.96);
  tl.set($("page"), { autoAlpha: 0 }, 10.36);
  tl.to(map, { clipPath: OPEN, duration: 0.5, ease: "power2.inOut" }, 9.96);
  show($("chip"), 9.96);

  /* 7 · "Fort" @12.50: the map dims and its box closes; every map label, the caption and the chip go; the stamp's three
         lines fade, the stamp slides to left 986, its lines return */
  tl.to(map, { opacity: 0.2, clipPath: BOX, duration: 0.4, ease: "power2.out" }, 12.50);
  tl.to([$("fw"), $("mar"), $("lg"), $("oh"), $("cap"), $("chip")], { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 12.50);
  tl.to([$("s1"), $("s2"), $("s3")], { autoAlpha: 0, duration: 0.15, ease: "power2.out" }, 12.50);
  tl.to($("stamp"), { x: 890, duration: 0.5, ease: "power2.inOut" }, 12.65);
  tl.to([$("s1"), $("s2"), $("s3")], { autoAlpha: 1, duration: 0.2, ease: "power2.out" }, 13.15);

  /* 8 · "full" @13.76: the quote strip rises in: the quote, then its attribution */
  tl.to($("strip"), { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 13.76);
  show($("att"), 13.96);

  /* 9 · "clock" @16.22: the hospital clock card slides in from the left, hands already at 8:10, no time yet */
  tl.fromTo($("hosp"), { autoAlpha: 0, x: -660 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 16.22);

  /* 10 · "eight" @18.20: the time on the card, and the clock's label under it; hold to the last frame */
  show($("h2"), 18.20, 0.25);
  show($("clab"), 18.20);

  tl.to({}, { duration: 0.01 }, 19.89);                     /* holds to the last frame @19.90 */

  window.__timelines[ID] = tl;
