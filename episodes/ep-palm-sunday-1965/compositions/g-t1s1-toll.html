<script>
window.__timelines = window.__timelines || {};
(function () {

  var tl = gsap.timeline({ paused: true });

  /* 0 · hard cut from Paul @0.00: P1 on at full brightness, its place chip slides in */
  tl.fromTo($("p1-soft"), { scale: 1.1 }, { scale: 1.16, duration: 2.61, ease: "none" }, 0);

  tl.fromTo(num, { autoAlpha: 0, scale: 1.3 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power4.out", immediateRender: false }, 0.58);

  tl.fromTo(num, { y: -4 }, { y: 4, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 2, immediateRender: false }, 1.55);

  tl.fromTo($("lab"), { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.01);
