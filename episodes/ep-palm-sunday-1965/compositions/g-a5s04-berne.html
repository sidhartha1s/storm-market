<!-- g-a5s04-berne (A5-S4, A5-S5): the tornado reaches the Ohio line in 12 minutes; the warning ran 30 to 60. The tornado mark

     Brief: mg_specs/briefs/g-a5s04-berne.md; map facts: media/maps/README.md.
     Map family: copies the base g-a2s14-six (mount, inlining, push maths, dot radius), the ring of g-a2s01-radar, the bars on
     one stated scale of g-a2s06-headstart, the tornado mark's mount of the family's track comps.
     Map: media/maps/indiana-counties.svg (BM-1), ids prefixed brn-. The SVG fills the frame; its viewBox is the camera.
       EAST  box 716, 62, 1080 x 450   2.8125 px per unit   viewBox 75.4222 261.9556 682.6667 384   (screen x = 2.8125u - 212.125, y = 2.8125u - 736.75)
       LINE  same box                  4 px per unit        viewBox 371 312.5 480 270               (screen x = 4u - 1484, y = 4u - 1250)
     The push EAST to LINE is 1.422 times (ratio 0.703125); dot r 2.1333 units in EAST, 1.5 in LINE (6 px in both).
     Every number below is computed from media/data/points.csv and the st-in path:

       Linn Grove (619.0, 379.1) LINE (992.0, 266.4); Indiana's east line x 648.4 units, LINE x 1109.6.

     The leg from Linn Grove to the state line is SCHEMATIC: the survey gives two places and two times, not a surveyed track.
     Coverage (plan rule 22): until the bars need the lower band (13.36) the map's box runs on down at the same camera (to
     y 660 across its width, to y 1000 left of x 1580; the corner x >= 1600, y >= 680 stays bare). In EAST it also opens
     left to x 620 (Indiana's west line). In LINE the whole picture waits 300 px right of its briefed place (camera
     viewBox 296 312.5 480 270, the state line at x 1409.6, the box open left to x 96) and moves home on the guides' cue.
     MAP BLOCK: BM-1's groups map-neighbours, map-counties and map-state, every path element that crosses what the two
     cameras show copied whole and unchanged from the file by one mechanical copy that added the id prefix and nothing else.

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a5s04-berne", P = "brn";
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */
  function show(e, t, d) { tl.to(e, { autoAlpha: 1, duration: d || 0.3, ease: "power2.out" }, t); }
  function rise(e, t) { tl.fromTo(e, { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t); }

  var map = $("map"), dots = map.querySelectorAll(".brn-dot");
  /* a geometric push: the viewBox width goes w0 to w0 * ratio at a steady zoom rate under the named ease */
  function camEase(ratio, ease) { var e = gsap.parseEase(ease); return function (p) { return (1 - Math.pow(ratio, e(p))) / (1 - ratio); }; }
  function cam(viewBox, dotR, ratio, t, d, ease) {
    tl.to(map, { attr: { viewBox: viewBox }, duration: d, ease: camEase(ratio, ease) }, t);
    tl.to(dots, { attr: { r: dotR }, duration: d, ease: camEase(ratio, ease) }, t);
  }
  var OPEN = "polygon(96px 62px, 1796px 62px, 1796px 660px, 1580px 660px, 1580px 1000px, 96px 1000px)";
  var BOX = "polygon(716px 62px, 1796px 62px, 1796px 512px, 1580px 512px, 1580px 512px, 716px 512px)";

  s0($("stage"), { x: 300 });                               /* the LINE picture waits 300 px right (plan rule 22) */
  s0($("rw"), { rotation: 0, svgOrigin: "1489.7 98.6" });
  s0($("trail"), { strokeDasharray: 124, strokeDashoffset: 124 });   /* the leg is 123.6 px */
  s0([$("a1"), $("a2"), $("r1")], { scaleX: 0, transformOrigin: "left center" });

  /* ================= A5-S4: Curran's recollection, then the survey's two times ================= */
  /* 0 · "Curran" @0.00: ground, the map in EAST, Fort Wayne's dot, label and resting ring, Berne's dot and label */

  /* 1 · "later" @0.24: the recollection chip */
  rise($("rec"), 0.24);

  /* 2 · "straight" @3.96: the ring's sweep line makes one turn, to @5.76 */
  tl.to($("rw"), { rotation: 360, duration: 1.8, ease: "none" }, 3.96);

  /* 3 · "The" @5.94: the chip, the ring and both town labels fade; from @6.14 the push EAST to LINE (0.8 s); then Berne's
         name returns at its LINE place and the source line fades in */
  tl.to([$("rec"), $("ring"), $("fw"), $("be1")], { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, 5.94);
  cam("296 312.5 480 270", 1.5, 0.703125, 6.14, 0.8, "power2.inOut");
  tl.to(map, { clipPath: OPEN, duration: 0.8, ease: "power2.inOut" }, 6.14);
  show([$("be2"), $("src")], 6.94);

  /* 4 · "Linn" @8.34: Linn Grove's dot and name, the tornado mark over it */
  show([$("pt-linn-grove"), $("lg"), $("mark")], 8.34);

  /* 5 · "eight forty" @9.08: the first time chip */
  rise($("c1"), 9.08);

  /* 6 · "across" @10.14: the mark moves to the state line (1.1 s, to @11.24); the trail draws behind it */
  tl.to($("trail"), { autoAlpha: 1, duration: 0.05, ease: "none" }, 10.14);
  tl.to($("trail"), { strokeDashoffset: 0, duration: 1.1, ease: "power1.inOut" }, 10.14);
  tl.to($("mark"), { x: 117.6, y: -37.9, duration: 1.1, ease: "power1.inOut" }, 10.14);

  /* 7 · "Ohio" @10.60: the two state names; the line's highlight comes on */
  show([$("in"), $("oh"), $("hl")], 10.60);

  /* 8 · "eight fifty two" @11.48: the second time chip */
  rise($("c2"), 11.48);

  /* ================= A5-S5: the two bars on the map's own scale ================= */
  /* 9 · "A" @13.36: the picture moves home (the camera pans 75 units, the group 300 px, together) and the map's box closes
         to its briefed size; the two guides draw down from the map */
  tl.to(map, { attr: { viewBox: "371 312.5 480 270" }, duration: 0.5, ease: "power2.inOut" }, 13.36);
  tl.to($("stage"), { x: 0, duration: 0.5, ease: "power2.inOut" }, 13.36);
  tl.to(map, { clipPath: BOX, duration: 0.3, ease: "power2.out" }, 13.36);
  tl.to($("grow"), { attr: { height: 230 }, duration: 0.4, ease: "power2.out" }, 13.36);

  /* 10 · "warning" @13.49: the amber bar grows from Linn Grove's x: to 30 minutes in 0.6 s, then the lighter part to 60 in
          0.6 s; its label and the two tick labels fade in */
  tl.set([$("a1"), $("a2")], { autoAlpha: 1 }, 13.49);
  tl.to($("a1"), { scaleX: 1, duration: 0.6, ease: "none" }, 13.49);
  tl.to($("a2"), { scaleX: 1, duration: 0.6, ease: "power2.out" }, 14.09);
  show($("al"), 13.49);
  show($("t30"), 14.09);
  show($("t60"), 14.69);

  /* 11 · "twelve" @16.03: the red bar grows to the state line's x; its label fades in; hold to the last frame */
  tl.set($("r1"), { autoAlpha: 1 }, 16.03);
  tl.to($("r1"), { scaleX: 1, duration: 0.4, ease: "power2.out" }, 16.03);
  show($("rl"), 16.03);

  tl.to({}, { duration: 0.01 }, 18.69);                     /* holds to the last frame @18.70 */

  window.__timelines[ID] = tl;
})();
</script>
