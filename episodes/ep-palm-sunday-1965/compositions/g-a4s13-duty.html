<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a4s13-duty", P = "duty", D = 13.98;
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  /* ---- bands ---- */
  function lit(e, t) { tl.set(e, { visibility: "visible" }, t); tl.to(e, { scaleX: 1, duration: 0.3, ease: "power2.out" }, t); }
  function pulse(e, t) {                                    /* wipes across the row from the left in 0.12 s, fades in 0.13 s, leaves nothing */
    tl.set(e, { visibility: "visible", scaleX: 0, opacity: 0.25 }, t);
    tl.to(e, { scaleX: 1, duration: 0.12, ease: "none" }, t);
    tl.to(e, { opacity: 0, duration: 0.13, ease: "none" }, t + 0.12);
    tl.set(e, { visibility: "hidden" }, t + 0.25);
  }

  /* ---- camera: Beside is the brief's state; until the strip needs the left of the frame the sheet sits centred and enlarged,
          on a slow push (acts-plan rule 22). Scale, x and y move together, so the sheet's centre stays put in the push ---- */
  var BESIDE = { scale: 1.1, x: 669.6, y: 44 };
  var SCX = (64 + 824) / 2, SCY = (60 + 650) / 2, BIG = 1.25, PUSH = 1.03;   /* sheet centre in world px */
  function centred(s) { return { scale: s, x: 960 - s * SCX, y: 540 - s * SCY, force3D: false }; }
  var world = $("world"), lit3 = $("lit3"), lit6 = $("lit6");
  var run = [$("p1"), $("p2"), $("p3"), $("p4"), $("p5"), $("p7"), $("p8")];

  /* rest states, set at 0 */
  s0(world, { transformOrigin: "0 0" });
  s0(world, centred(BIG));
  s0([lit3, lit6].concat(run), { scaleX: 0, transformOrigin: "left center" });
  s0($("strip"), { y: 60 });
  s0($("q2"), { y: 220 });
  s0($("sweep"), { x: -520 });

  /* 0 · "Police" @0.00: ground, the list with eight plain rows, its source line; @0.10 one pulse crosses City Police Departments */
  tl.to($("sweep"), { x: 1920, duration: D, ease: "none" }, 0);
  var pushed = centred(BIG * PUSH); pushed.duration = 4.71; pushed.ease = "none";
  tl.to(world, pushed, 0);
  pulse($("p3"), 0.10);

  /* 1 · police @4.71: the Lit band wipes onto City Police Departments and stays; the sheet goes to its Beside place, landing
     @5.21, before the strip arrives (the two never touch) */
  lit(lit3, 4.71);
  tl.to(world, { scale: BESIDE.scale, x: BESIDE.x, y: BESIDE.y, duration: 0.5, ease: "power3.out", force3D: false }, 4.71);

  /* 2 · said @5.33: the strip rises with quote 1 and its attribution; the list's source line fades out */
  tl.to($("strip"), { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.33);
  tl.to($("src"), { autoAlpha: 0, duration: 0.3, ease: "none" }, 5.33);

  /* 3 · duty. @7.45: the light jumps: the police band leaves to the right, the stations band wipes on 0.1 s later */
  tl.set(lit3, { transformOrigin: "right center" }, 7.45);
  tl.to(lit3, { scaleX: 0, duration: 0.2, ease: "power2.in" }, 7.45);
  tl.set(lit3, { visibility: "hidden" }, 7.65);
  lit(lit6, 7.55);

  /* 4 · No @8.65: the strip changes: quote 1 slides up behind the mask while quote 2 rises into place; the attribution changes
     (out, then in: the two lines share one place and are never on together) */
  tl.to($("q1"), { y: -220, duration: 0.4, ease: "power3.inOut" }, 8.65);
  tl.set($("q2"), { autoAlpha: 1 }, 8.65);
  tl.to($("q2"), { y: 0, duration: 0.4, ease: "power3.inOut" }, 8.65);
  tl.set($("q1"), { autoAlpha: 0 }, 9.05);
  tl.to($("a1"), { autoAlpha: 0, duration: 0.15, ease: "none" }, 8.65);
  tl.to($("a2"), { autoAlpha: 1, duration: 0.15, ease: "none" }, 8.80);

  /* 5 · office @8.89: a pulse crosses slots 1, 2, 3, 4, 5, 7, 8 from top to bottom, 0.10 s apart; the last is gone @9.74.
     The stations band does not move */
  run.forEach(function (e, i) { pulse(e, 8.89 + i * 0.10); });

  /* 6 · radio @11.09: the stations band brightens once, 35 % to 55 % and back. Hold to 13.98: one lit row, quote 2 */
  tl.to(lit6, { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 11.09);
  tl.to(lit6, { opacity: 0.35, duration: 0.3, ease: "power2.inOut" }, 11.39);

  tl.to({}, { duration: 0.01 }, D - 0.01);

  window.__timelines[ID] = tl;
})();
</script>
