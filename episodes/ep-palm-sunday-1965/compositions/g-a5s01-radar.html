<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a5s01-radar", P = "fwr";
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */
  function show(e, t, d) { tl.to(e, { autoAlpha: 1, duration: d || 0.3, ease: "power2.out" }, t); }
  function dash(e, len) { s0(e, { strokeDasharray: len, strokeDashoffset: len }); }
  function draw(e, t, d) {
    tl.to(e, { autoAlpha: 1, duration: 0.05, ease: "none" }, t);
    tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
  }

  /* the teletype's lines are non-scaling, so their dashes are screen px: 0.75 px per drawing unit in NORTH */
  var lns = $("map").querySelectorAll(".fwr-ln");
  for (var i = 0; i < lns.length; i++) dash(lns[i], Math.ceil(lns[i].getTotalLength() * 0.75) + 1);
  dash($("r1"), 290);                                       /* circumference of r 46 is 289.0 px */
  dash($("r2"), 164);                                       /* of r 26, 163.4 px */
  dash($("rim"), 617);                                      /* of r 98 units, 615.8 units */
  dash($("screen"), 542);                                   /* of r 86 units, 540.4 units */
  s0($("rw"), { rotation: 0, svgOrigin: "1643.3 455" });
  s0($("sweep"), { rotation: 0, svgOrigin: "1220 340" });   /* the mount position plus the pivot times the scale */
  s0($("scopeview"), { x: -120, y: 260 });                  /* the scope waits lower and left, centre (1100, 600) (plan rule 22) */
  s0($("ul"), { scaleX: 0, transformOrigin: "left center" });
  /* clock hands: degrees clockwise from 12, about the face centre (95, 100) */
  s0($("hh"), { rotation: 260, svgOrigin: "95 100" });      /* 8:40: hour hand two thirds of the way from 8 to 9 */
  s0($("mh"), { rotation: 210, svgOrigin: "95 100" });      /* minute hand sweeps its last 30 degrees onto the 8 */

  /* ================= A5-S1: the office with a radar ================= */
  /* 0 · "Fort" @0.00: ground, the map in NORTH, Fort Wayne's dot and label */

  /* 1 · "Wayne" @0.19: the office chip */
  tl.fromTo($("chip"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 0.19);

  /* 2 · "office" @0.77: the teletype draws on beside the dot, unlit */
  tl.to($("tty"), { autoAlpha: 1, duration: 0.05, ease: "none" }, 0.77);
  tl.to(lns, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.77);

  /* 3 · "South" @4.73: South Bend's dot and name, then "no radar" */
  show([$("pt-south-bend"), $("sb")], 4.73);
  show($("nr"), 4.88);

  /* 4 · "radar" @6.51: the ring rises round Fort Wayne, outer circle then inner; the sweep line makes one turn, to @8.91 */
  draw($("r1"), 6.51, 0.25);
  draw($("r2"), 6.66, 0.25);
  show($("rw"), 6.51, 0.2);
  tl.to($("rw"), { rotation: 360, duration: 2.4, ease: "none" }, 6.51);

  /* ================= A5-S2: John Curran's recollection of the set ================= */
  /* 5 · "A" @8.33: the office chip fades */
  tl.to($("chip"), { autoAlpha: 0, duration: 0.2, ease: "power2.out" }, 8.33);

  /* 6 · "John" @9.82: the name card slides in from the left: name, the two lines under it, then the credit */
  tl.fromTo($("card"), { autoAlpha: 0, x: -660 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 9.82);
  show($("name"), 10.07);
  show([$("sub1"), $("sub2")], 10.22);
  show([$("sm1"), $("sm2")], 10.37);

  /* 7 · "set" @11.64: the map view fades out; the scope draws on, rim first, then the screen circle, then the centre dot
         and the sweep line at rest pointing up; no wedge yet */
  tl.to($("mapview"), { autoAlpha: 0, duration: 0.4, ease: "power2.out" }, 11.64);
  tl.to($("scope"), { autoAlpha: 1, duration: 0.2, ease: "power2.out" }, 11.64);
  tl.to($("rim"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 11.64);
  tl.to($("screen"), { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 11.99);
  show([$("hub"), $("sweep")], 12.14, 0.2);

  /* 8 · "Its" @14.98: the afterglow wedge fades in and the sweep starts: one tween, 6.75 turns, ends @31.18 pointing west */
  show($("glow"), 14.98);
  tl.to($("sweep"), { rotation: 2430, duration: 16.2, ease: "none" }, 14.98);

  /* 9 · "picture" @17.26: the smear lights as the line crosses it;  10 · "faded" @17.60: it fades, gone @18.30 */
  tl.to($("smear"), { opacity: 0.8, duration: 0.1, ease: "none" }, 17.26);
  tl.to($("smear"), { opacity: 0, duration: 0.7, ease: "power1.out" }, 17.60);

  /* ================= A5-S3: 8:40 PM, the hook west of Berne ================= */
  /* 11 · "At" @19.48: the name card leaves to the left */
  tl.to($("card"), { x: -700, autoAlpha: 0, duration: 0.3, ease: "power3.in" }, 19.48);

  /* 12 · ".40" @19.86: the clock stamp slides in from the left, the minute hand lands on the 8 */
  tl.fromTo($("stamp"), { autoAlpha: 0, x: -660 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 19.86);
  tl.to($("mh"), { rotation: 240, duration: 0.5, ease: "power3.out" }, 20.06);

  /* 13 · "hook" @21.52: the hook fades in on the scope */
  show($("hook"), 21.52);

  /* 14 · "Berne," @24.00: Berne's dot, then our label for it */
  show($("bdot"), 24.00);
  show($("berne"), 24.10);

  /* 15 · "take" @27.46: the scope moves to its briefed place as the page slides in from the right; its source fades in after */
  tl.to($("scopeview"), { x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 27.46);
  tl.fromTo($("page"), { autoAlpha: 0, x: 660 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 27.46);

  tl.to($("unlit"), { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 28.66);
  tl.to($("ul"), { scaleX: 1, duration: 0.6, ease: "none" }, 28.66);

  tl.to({}, { duration: 0.01 }, 31.66);                     /* holds to the last frame @31.67 */

  window.__timelines[ID] = tl;
