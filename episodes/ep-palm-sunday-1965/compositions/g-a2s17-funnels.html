<!-- g-a2s17-funnels (A2-S17, A2-S18): the twin funnels photograph, whole and slowly nearer; one number in the grass under it;
     then a hard cut to a small print of what the evening left. Brief: mg_specs/briefs/g-a2s17-funnels.md.
     BASE OF THE PHOTOGRAPH FAMILY. Three blocks lift out whole (CSS and markup are marked): the fitted picture over a soft
     copy of itself, the place chip, the toll on a glass card.
     Photograph 1: media/stills/c1-elkhart-twin-funnel.jpg, 1188 x 1068, Paul Huffman, The Elkhart Truth, 6:32 PM, April 11, 1965.
       Fitted to the frame's height (1080 / 1068 = 1.0112: 1201 x 1080 at left 359), never at cover. Pushed 1.00 to 1.05 about (960, 540).
       Below file y 772 the picture is dark road and grass: every label of ours sits there or left of the picture.
     Photograph 2: media/stills/c2-dunlap-sunnyside-damage.jpg, 800 x 647, Sunnyside subdivision, Dunlap. Shown as a print at its own
       size or smaller (0.95 to 1.00 about file point 400, 326.2); the window 722 x 574 never shows the file's faded edge.
     Cues: audio/a2-s17.words.json seconds minus 0.50, audio/a2-s18.words.json seconds plus 12.74 (mg_specs/timeline-map.md table 5). -->
<template>
<style>
  #fun-root { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(ellipse at 50% 45%, #0b1016, #030507 78%); font-family:Arial, sans-serif; }
  .fun-h { opacity:0; visibility:hidden; }
  .fun-layer { position:absolute; left:0; top:0; width:1920px; height:1080px; }

  /* ---- FAMILY BLOCK 1: the fitted picture over a soft copy of itself ---- */
  .fun-soft { position:absolute; left:-40px; top:-40px; width:2000px; height:1160px; object-fit:cover; object-position:50% 50%; }
  .fun-soft-a { filter:blur(22px) brightness(0.6); }
  .fun-soft-b { filter:blur(9px) brightness(0.7); }
  .fun-dim { position:absolute; inset:0; background:rgba(3,5,8,0.45); }
  .fun-fit { position:absolute; left:359px; top:0; width:1201px; height:1080px; box-shadow:0 0 60px rgba(0,0,0,0.6); }

  /* ---- FAMILY BLOCK 2: the place chip (glass, one line, names what the photograph shows) ---- */
  .fun-chip { position:absolute; left:110px; bottom:110px; padding:14px 26px; font:900 34px 'Arial Black', Arial, sans-serif; color:#f2f5f8; white-space:nowrap; line-height:1;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14); border-radius:28px; }

  /* ---- FAMILY BLOCK 3: a toll on a glass card (figure, two-line label, source) ---- */
  .fun-toll { position:absolute; left:1010px; top:792px; width:560px; height:200px; }
  .fun-toll-card { position:absolute; inset:0; box-sizing:border-box; background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15);

  .fun-toll-num { position:absolute; left:30px; top:40px; font:120px 'AbrilFig', Georgia, serif; color:#d0121f; letter-spacing:0.04em; white-space:nowrap; line-height:1;

  .fun-toll-lab { position:absolute; left:214px; font:900 34px 'Arial Black', Arial, sans-serif; color:#f2f5f8; letter-spacing:0.12em; white-space:nowrap; line-height:1;

  .fun-toll-src { position:absolute; left:214px; top:130px; font:700 22px Arial, sans-serif; color:rgba(244,240,232,0.88); letter-spacing:0.04em; white-space:nowrap; line-height:1;

  .fun-credit { position:absolute; left:96px; bottom:60px; font:700 22px Arial, sans-serif; color:rgba(244,240,232,0.88); letter-spacing:0.04em; white-space:nowrap; line-height:1;

  .fun-print img { position:absolute; left:-39px; top:-39.2px; width:800px; height:647px; }   /* 2.2 px higher than centred: the window's top is file y 24.1 at 0.95, under the near-white rows */
</style>
<div id="fun-root" data-composition-id="g-a2s17-funnels" data-width="1920" data-height="1080">

  <!-- LAYER A (A2-S17): on from frame 0, off on the cut at 13.10 -->
  <div class="fun-layer" id="fun-a">

    <div class="fun-dim"></div>

      <div class="fun-toll-card fun-h" id="fun-toll-card"></div>

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a2s17-funnels", P = "fun", D = 18.96, CUT = 13.10;
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  /* start states: hidden in CSS (fun-h), transforms set here at 0; every move from rest below is a plain to() */
  s0($("fit"), { scale: 1, transformOrigin: "50% 50%" });
  s0($("clock"), { x: -40 });
  s0($("chip1"), { x: -60 });
  s0($("chip2"), { x: -60 });
  s0($("toll-num"), { y: 24 });
  s0($("print-img"), { scale: 0.95, transformOrigin: "400px 326.2px" });   /* the window's centre in file px: at 0.95 it shows file x 20.0 to 780.0, y 24.1 to 628.3 */

  /* ---- layer A ---- */
  tl.to($("fit"), { scale: 1.05, duration: CUT, ease: "none" }, 0);                                         /* At @0.00: the push, 1.00 to 1.05, carries the whole of A2-S17 */
  tl.to($("clock"), { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.26);                       /* 6 (.32) @0.26 */
  tl.to($("chip1"), { x: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 1.44);                       /* this @1.44 */
                                                                                                            /* The @4.72: nothing new, the photograph is the subject */
  tl.to($("toll-card"), { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 9.24);                         /* Fourteen @9.24 */
  tl.to($("toll-num"), { y: 0, autoAlpha: 1, duration: 0.35, ease: "power4.out" }, 9.24);
  tl.to([$("toll-l1"), $("toll-l2"), $("toll-src")], { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 9.49);

  /* ---- the cut: one frame, nothing of layer A after it ---- */
  tl.set($("a"), { autoAlpha: 0 }, CUT);                                                                    /* And @13.10 */
  tl.set($("b"), { autoAlpha: 1 }, CUT);

  /* ---- layer B ---- */
  tl.to($("print-img"), { scale: 1, duration: D - CUT, ease: "none" }, CUT);                                /* the print comes to its own size, never past it */
  tl.to($("chip2"), { x: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 13.70);                      /* Sunnyside @13.70 */

  window.__timelines[ID] = tl;
})();
</script>
