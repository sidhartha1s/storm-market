<script>

  function fade(id, t, d) { tl.to($(id), { autoAlpha: 1, duration: d || 0.3, ease: "none" }, t); }

  /* ---- draw-on: a dash restarts on every sub-path, so a shape of several lines is dashed by its longest one; a body's
          fill comes up with its line ---- */
  function longest(e) {
    if (e.tagName !== "path") return e.getTotalLength();
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path"), max = 0;
    e.getAttribute("d").split("M").forEach(function (s) { if (!s.trim()) return; p.setAttribute("d", "M" + s); max = Math.max(max, p.getTotalLength()); });
    return max;

    var L = Math.ceil(longest(e)) + 1; s0(e, { strokeDasharray: L, strokeDashoffset: L, fillOpacity: 0 });
    tl.set(e, { autoAlpha: 1 }, t);

  gsap.set(office, { svgOrigin: "760 820" });

  s0(gen.querySelectorAll("." + P + "-ink"), { stroke: BODY });
  s0($("olab"), { y: 16 });
  s0([$("card8"), $("card5")], { y: 60 });
  s0(p2, { x: SHIFT });
  s0([$("rsweep"), $("ssweep")], { rotation: 0 });
  s0($("cable"), { strokeDasharray: 81, strokeDashoffset: 81 });

  /* 0 · "Power" @0.00: ground, floor line, the dark room with its lamp, desk and teletype (all Label grey), the source line */

  tl.to(gen.querySelectorAll("." + P + "-lamp"), { fill: AMBER, duration: 0.2, ease: "power2.out" }, 3.15);
  tl.to(gen.querySelectorAll("." + P + "-ink"), { stroke: INK, duration: 0.2, ease: "power2.out" }, 3.15);
  tl.set($("cable"), { autoAlpha: 1 }, 3.15);

  tl.to([$("room"), $("desk"), $("tty")], { stroke: BODY, duration: 0.3, ease: "power2.out" }, 3.50);
  tl.to([$("shade"), $("paper")], { fill: AMBER, duration: 0.3, ease: "power2.out" }, 3.50);

  tl.to($("card8"), { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.83);

  tl.to(p2, { autoAlpha: 1, duration: 0.4, ease: "none" }, 5.29);

  tl.to(p2, { x: 0, duration: 0.5, ease: "power3.out" }, 10.05);

  drawOne($("leader"), 10.05, 0.4);
  tl.to($("linkrect"), { attr: { width: 395 }, duration: 0.5, ease: "none" }, 10.05);

  tl.to($("rsweep"), { rotation: 720, duration: 1.4, ease: "none" }, 10.91);
  tl.to($("ssweep"), { rotation: 360, duration: 1.4, ease: "none" }, 10.91);
