<script>
window.__timelines = window.__timelines || {};

  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */
  function el(tag, a, parent) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); parent.appendChild(e); return e; }
  function under(e, t, d) { tl.to(e, { scaleX: 1, duration: d, ease: "power2.out" }, t); }

  var face = $("face"), CX = 95, CY = 100, RR = 62, O = CX + " " + CY;

  for (var i = 0; i < 12; i++) { var a = pt(i * 30, RR - 7), b = pt(i * 30, RR - (i % 3 ? 15 : 21));
    el("line", { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: "#dfe7ee", "stroke-width": 3, "stroke-linecap": "round" }, face); }
  var hh = el("line", { x1: CX, y1: CY, x2: CX, y2: CY - 34, stroke: "#f2f5f8", "stroke-width": 5, "stroke-linecap": "round" }, face);
  var mh = el("line", { x1: CX, y1: CY, x2: CX, y2: CY - 52, stroke: "#f2f5f8", "stroke-width": 5, "stroke-linecap": "round" }, face);
  el("circle", { cx: CX, cy: CY, r: 5, fill: "#e8c56a" }, face);
  s0(hh, { rotation: 225, svgOrigin: O });                  /* 7:30: hour hand half way between 7 and 8 */
  s0(mh, { rotation: 180, svgOrigin: O });                  /* minute hand on the 6. Set once, never tweened */

  /* start states: hidden in CSS (eyes-h) or by scaleX 0; transforms set here at 0; every move from rest below is a plain to() */
  s0($("ul1"), { scaleX: 0, transformOrigin: "left center" });

  /* 0 · "He" @0.00: the cut out of the book ad. Ground, open window on the operations room, frame, film label. The film is the

  tl.to($("label"), { y: 6, duration: CUT / 3, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);

  /* 1 · "in" @3.15: hard cut. The hole closes for good; frame and film label off; chip, card with its unlit page, stamp and source line on */
  tl.set($("cover"), { autoAlpha: 1 }, CUT);
  tl.set([$("frame"), $("label")], { autoAlpha: 0 }, CUT);
  tl.set($("page"), { autoAlpha: 1 }, CUT);

  tl.to({}, { duration: 0.01 }, D - 0.01);
  window.__timelines[ID] = tl;
})();
