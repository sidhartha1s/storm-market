<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a5s15-dark", P = "drk", D = 7.71;
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  /* ---- draw-on: a dash restarts on every sub-path, so a shape of several lines is dashed by its longest one ---- */
  function longest(e) {
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path"), max = 0;
    e.getAttribute("d").split("M").forEach(function (s) { if (!s.trim()) return; p.setAttribute("d", "M" + s); max = Math.max(max, p.getTotalLength()); });
    return max;
  }
  function dash(e) { var L = Math.ceil(longest(e)) + 1; s0(e, { strokeDasharray: L, strokeDashoffset: L }); return e; }
  function drawOn(e, t, d) { tl.set(e, { autoAlpha: 1 }, t); tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t); }
  function house(n, t) {                                   /* longest line first, all lines done 0.5 s after t */
    var lines = Array.prototype.slice.call($("h" + n).children);
    lines.sort(function (a, b) { return b.getTotalLength() - a.getTotalLength(); });
    lines.forEach(dash);
    lines.forEach(function (e, i) { drawOn(e, t + i * 0.03, 0.5 - i * 0.03); });
  }

  var WHITE = "#f2f5f8", GREY = "#93a3b2";
  var layer = $("layer"), stage = $("stage"), tower = $("tower");

  /* origins, set once at build and never again: a second svgOrigin on an element that is already scaled and moved is read
     through that transform and lands somewhere else. The tower turns about its right foot, where the right leg meets the
     ground: (70, 160) in the drawing's own units = screen (1470, 820) (the brief's (1500, 820) is the box's corner, 30 px
     right of the leg, and lifts the foot 6 px). The stage scales about the middle of the tower's feet, screen (1380, 820),
     so the tower always stands on the ground line */
  var BIG = 1.4, PUSH = 1.03;
  gsap.set(tower, { svgOrigin: "70 160" });
  gsap.set(stage, { svgOrigin: "1380 820" });

  /* rest states, set at 0 */
  s0(tower, { rotation: 0 });
  s0(stage, { scale: BIG, x: 960 - 1380 });
  s0(layer, { scale: 1, transformOrigin: "960px 540px", force3D: false });

  /* 0 · "Curran" @0.00: ground, ground line, the recollection line, the tower upright in Body light, centred, on a slow push */
  tl.to(stage, { scale: BIG * PUSH, duration: 5.08, ease: "none" }, 0);

  /* 1 · one @1.18: the tower's lines go Body light to Headline white: the one company's line */
  tl.to(tower, { stroke: WHITE, duration: 0.3, ease: "power2.out" }, 1.18);

  /* 2 · lost @3.06: the tower tips 12 degrees about its right foot; then its lines go to Label grey */
  tl.to(tower, { rotation: 12, duration: 0.7, ease: "power2.in" }, 3.06);
  tl.to(tower, { stroke: GREY, duration: 0.4, ease: "power2.out" }, 3.76);

  /* 3 · none @5.08: the tower goes to its briefed place and size; house 1 draws on, house 2 from 5.28, house 3 from 5.48
     (all complete @5.98), all dark */
  tl.to(stage, { scale: 1, x: 0, duration: 0.5, ease: "power3.out" }, 5.08);
  house(1, 5.08);
  house(2, 5.28);
  house(3, 5.48);

  /* 4 · customers @5.50: no new mark. From 5.98 the whole drawing layer drifts 1.00 to 1.02 about the frame centre */
  tl.to(layer, { scale: 1.02, duration: D - 5.98, ease: "none", force3D: false }, 5.98);

  tl.to({}, { duration: 0.01 }, D - 0.01);

  window.__timelines[ID] = tl;
})();
