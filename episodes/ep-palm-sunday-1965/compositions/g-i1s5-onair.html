<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-i1s5-onair", P = "air";
  var CLOSE = { scale: 1.6, x: 147.6, y: -66 };   /* design sheet section 5: the sheet at x 250 to 1466, y 30 to 974 */
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  var band = $("band"), line = $("lamp-line"), fill = $("lamp-fill"), txt = $("lamp-txt"), lamp = $("lamp");
  var L = Math.ceil(line.getTotalLength()) + 1;

  s0($("world"), { scale: CLOSE.scale, x: CLOSE.x, y: CLOSE.y, transformOrigin: "0 0" });
  s0(band, { scaleX: 0, transformOrigin: "left center" });
  s0(line, { strokeDasharray: L, strokeDashoffset: L, autoAlpha: 0 });

  /* 0 · "The" @0.00: ground and sheet on in the Close state */
  tl.fromTo($("bg"), { scale: 1 }, { scale: 1.05, duration: 4.64, ease: "none" }, 0);
  tl.fromTo($("src"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);

  /* 1 · "stations" @0.07: the lit band wipes across the stations' row, then breathes between 30 % and 38 % */
  tl.to(band, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 0.07);
  tl.fromTo(band, { opacity: 0.38 }, { opacity: 0.30, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 0.62);

  /* 2 · "expected" @1.55: the lamp's outline draws on in 0.4 s, its letters with the last of the line */
  tl.set(line, { autoAlpha: 1 }, 1.55);
  tl.to(line, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 1.55);
  tl.fromTo(txt, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15, ease: "none", immediateRender: false }, 1.80);

  /* 3 · "public" @3.21: the lamp fills Popfig red with Headline white letters for 0.5 s, then back to the outline in 0.3 s */
  tl.fromTo(fill, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08, ease: "none", immediateRender: false }, 3.21);
  tl.to(txt, { color: "#f2f5f8", duration: 0.08, ease: "none" }, 3.21);
  tl.fromTo(lamp, { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 3.21);
  tl.to(fill, { autoAlpha: 0, duration: 0.3, ease: "power1.inOut" }, 3.71);
  tl.to(txt, { color: "#d0121f", duration: 0.3, ease: "power1.inOut" }, 3.71);

  /* 4 · hold @3.64: band breathing and ground push; 5 · exit: the sheet slides down, ending on the hard cut to 09 @4.64 */
  tl.to($("paper"), { y: 1100, duration: 0.6, ease: "power3.in" }, 4.04);
  tl.to($("src"), { autoAlpha: 0, duration: 0.12, ease: "none" }, 4.04);   /* gone before the sliding paper reaches it @4.18 */
  tl.to({}, { duration: 0.01 }, 4.63);

  window.__timelines[ID] = tl;
})();
</script>
