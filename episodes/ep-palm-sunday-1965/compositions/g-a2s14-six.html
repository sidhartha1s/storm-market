  <div class="six-card six-h" id="six-card">
    <img class="six-crop" src="media/docs/survey-p39-600pm-crop.png" alt="">
    <!-- the unlit page: the whole crop except the box round "during the next 30 to 60 minutes." (card x 855 to 1443, y 243 to 281) -->
    <div class="six-unlit six-h" id="six-unlit">
      <div class="six-dim" style="left:10px;top:10px;width:1460px;height:233px"></div>

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a2s14-six", P = "six";
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */

  /* ---- camera block: the viewBox is the camera. A push is geometric (the logZoom maths of library/inhouse/snippets/helpers.js:
          the width runs w0 x (w1 / w0)^p). Every viewBox number and every dot radius is a straight line in that width, so one
          ease on a plain attr tween moves them all together and lands the end values exactly; no onUpdate, so a seek with
          events off lands the camera too. ratio = w1 / w0 ---- */
  var map = $("map"), dots = map.querySelectorAll(".six-dot");
  function camEase(ratio, ease) { var e = gsap.parseEase(ease); return function (p) { return (1 - Math.pow(ratio, e(p))) / (1 - ratio); }; }
  function cam(viewBox, dotR, ratio, t, d, ease) {
    tl.to(map, { attr: { viewBox: viewBox }, duration: d, ease: camEase(ratio, ease) }, t);
    tl.to(dots, { attr: { r: dotR }, duration: d, ease: camEase(ratio, ease) }, t);        /* a dot stays 6 px on screen */
  }

  /* ---- lit-county block: the family's lit value is Amber 2 at 0.45, a fill change on the county's own path ---- */
  function light(county, t) { tl.to($("co-in-" + county), { fill: "#e8c56a", fillOpacity: 0.45, duration: 0.3, ease: "power2.out" }, t); }

  /* ---- clock hands: degrees clockwise from 12, about the face centre (95, 100) ---- */
  s0($("hh"), { rotation: 180, svgOrigin: "95 100" });      /* 6:00: hour hand straight down */
  s0($("mh"), { rotation: 330, svgOrigin: "95 100" });      /* minute hand sweeps its last 30 degrees onto the 12 */
  s0($("ul"), { scaleX: 0, transformOrigin: "left center" });

  /* 0 · "At" @0.00: ground and the map in NORTH, lines only */

  /* 1 · "6" @0.12: the clock stamp slides in from the left, the minute hand lands on the 12 */
  tl.fromTo($("stamp"), { autoAlpha: 0, x: -660 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, 0.12);
  tl.to($("mh"), { rotation: 360, duration: 0.5, ease: "power3.out" }, 0.32);

  /* 2 · "South" @0.96: the place line rises in the stamp; South Bend's dot and label come on */
  tl.fromTo($("place"), { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 0.96);
  tl.to($("pt-south-bend"), { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 0.96);
  tl.to($("sb"), { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 0.96);

  /* 3 · "four" @1.64: the four counties fill in the entry's order, 0.12 s apart, each with its name */
  light("st-joseph", 1.64);
  light("marshall", 1.76);
  light("elkhart", 1.88);
  light("kosciusko", 2.00);
  tl.fromTo($("n1"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.64);
  tl.fromTo($("n2"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.76);
  tl.fromTo($("n3"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 1.88);
  tl.fromTo($("n4"), { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 2.00);   /* settled @2.30 */

  /* 4 · "take" @2.54: the page slides in from the right; its source fades in once it is nearly home */
  tl.fromTo($("card"), { autoAlpha: 0, x: 660 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out", immediateRender: false }, 2.54);
  tl.fromTo($("src"), { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, 2.94);

  /* 5 · "for" @3.86: the rest of the page goes unlit; the underline draws left to right under "during the next 30 to 60 minutes." */
  tl.to($("unlit"), { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 3.86);
  tl.to($("ul"), { scaleX: 1, duration: 0.6, ease: "none" }, 3.86);

  /* 6 · "That" @6.42: the county names and South Bend's label fade before the map moves; the fills stay */
  tl.to([$("n1"), $("n2"), $("n3"), $("n4"), $("sb")], { autoAlpha: 0, duration: 0.2, ease: "power2.in" }, 6.42);

  /* 7 · "was" @6.66: push NORTH to MARSHALL, 2.0 times in 0.8 s, ends @7.46 */
  cam("373 216 180 75", 1, 0.5, 6.66, 0.8, "power2.inOut");

  /* 8 · "tornadoes" @7.50: Plymouth, Argos, Donaldson in the entry's order, 0.15 s apart: dot, mark, then its label 0.1 s later */
  function place(dot, mark, label, t) {
    tl.to(dot, { autoAlpha: 1, duration: 0.15, ease: "power2.out" }, t);
    tl.fromTo(mark, { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, t);
    tl.to(label, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, t + 0.1);
  }
  place($("pt-plymouth"), $("m1"), $("t1"), 7.50);
  place($("pt-argos"), $("m2"), $("t2"), 7.65);
  place($("pt-donaldson"), $("m3"), $("t3"), 7.80);   /* last label settled @8.20 */

  tl.to({}, { duration: 0.01 }, 10.38);                     /* holds to the last frame @10.39 */

  window.__timelines[ID] = tl;
})();
</script>
