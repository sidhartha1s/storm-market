     window that empties to a microphone with its lamp off; then the lamp comes on, a house gets the word, and two strips of paper
     show how little a forecast said beside a warning. Brief: mg_specs/briefs/g-a1s15-offices.md.
     BASE OF THE FILM FAMILY. The film is not this comp's: index.html mounts it on track 1 (class filmwin, left 480, top 150,
     960 x 720) and this comp sits above it with a transparent hole. The film view (ground with hole, frame, label chip, the cover
     that closes the hole in one frame) is one CSS block and one markup block, marked, so a copy is a paste.
     Views: ROOM 0.00 to 12.99 (a14-05, dimmed from 6.63), ANNOUNCER 12.99 to 21.45 (a14-09, first angle only), DRAWN 21.45 to 34.71.
     The announcer mount ends at 22.43: the hole is covered from 21.45 and never opens again.
     While any film pixel shows, "Civil defense training film, 1967" is the only glass chip in the frame.
     Cues: words.json seconds plus the wav start inside the comp: a1-s15 +0.15, a1-s16 +12.65, a1-s17 +23.91; a segment's first word is

<script>
window.__timelines = window.__timelines || {};
(function () {
  var ID = "g-a1s15-offices", P = "off", D = 34.71, CUT1 = 12.99, CUT2 = 21.45;
  var $ = function (s) { return document.getElementById(P + "-" + s); };
  var tl = gsap.timeline({ paused: true });
  function s0(e, v) { gsap.set(e, v); tl.set(e, v, 0); }   /* a paused timeline does not render a set at 0 until it is seeked past it */
  function draw(e, t, d) {                                  /* a line drawn on: dash = ceil(len)+1, hidden until its start */
    var L = Math.ceil(e.getTotalLength()) + 1;
    s0(e, { strokeDasharray: L, strokeDashoffset: L, autoAlpha: 0 });
    tl.set(e, { autoAlpha: 1 }, t);
    tl.to(e, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
  }
  function stripIn(e, t) { tl.to(e, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, t); }

  /* start states: hidden in CSS (off-h), transforms set here at 0; every move from rest below is a plain to() */
  s0($("strip-a"), { y: 60 });
  s0($("q-a"), { y: 16 });
  s0($("strip-b"), { y: 60 });
  s0($("strip-c"), { y: 60 });
  s0($("strip-d"), { y: 60 });
  s0($("micg"), { x: 450 });                                /* the microphone waits at centre, where the announcer was */

  /* ================= view ROOM: 0.00 to 12.99 ================= */
  /* 0 · "The" @0.00 (voice @0.47): ground, open window on the operations room, frame, film label. The film is the motion */

  /* 1 · "Many" @6.63: the window dims */
  tl.to($("dim"), { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 6.63);

  /* 2 · "researcher's" @9.99: strip A enters with its attribution, no word yet */
  stripIn($("strip-a"), 9.99);

  /* 3 · "in" @11.53 ("in" + "action." in the transcript): the one word lands */
  tl.to($("q-a"), { y: 0, autoAlpha: 1, duration: 0.3, ease: "power3.out" }, 11.53);

  /* ================= view ANNOUNCER: 12.99 to 21.45 ================= */
  /* 4 · "That" @12.99: hard cut. Dim and strip A off in one frame; frame and film label stay */
  tl.set([$("dim"), $("strip-a")], { autoAlpha: 0 }, CUT1);

  /* ================= view DRAWN: 21.45 to 34.71 ================= */
  /* 5 · "A" @21.45: hard cut. The hole closes for good; frame and film label off; the microphone draws on, longest line first */
  tl.set($("cover"), { autoAlpha: 1 }, CUT2);
  tl.set([$("frame"), $("label")], { autoAlpha: 0 }, CUT2);
  draw($("m-cap"), 21.45, 0.3); draw($("m-base"), 21.50, 0.3); draw($("m-grille"), 21.58, 0.25);
  draw($("m-neck"), 21.64, 0.25); draw($("m-lamp"), 21.70, 0.25);
  tl.to($("lamp"), { autoAlpha: 1, duration: 0.4, ease: "power1.out" }, 21.65);          /* ON AIR in the off state: grey outline and letters, no fill */

  /* 6 · "few" @21.55: strip B enters */
  stripIn($("strip-b"), 21.55);

  /* 7 · "Many" @24.28: strip B leaves right; the microphone group slides left to rest */
  tl.to($("strip-b"), { x: 1900, duration: 0.5, ease: "power3.in" }, 24.28);
  tl.set($("strip-b"), { autoAlpha: 0 }, 24.78);                                         /* parked outside the frame: not visible there */
  tl.to($("micg"), { x: 0, duration: 0.6, ease: "power2.inOut" }, 24.28);

  /* 8 · "air" @25.89: the lamp turns on by fill and colour only; the microphone's own small lamp with it */
  tl.to($("lamp-fill"), { autoAlpha: 1, duration: 0.15, ease: "none" }, 25.89);
  tl.to($("lamp-txt"), { color: "#f2f5f8", duration: 0.15, ease: "none" }, 25.89);
  tl.to($("lamp-line"), { stroke: "#d0121f", duration: 0.15, ease: "none" }, 25.89);
  tl.to($("m-lamp"), { fill: "#d0121f", duration: 0.15, ease: "none" }, 25.89);

  /* 9 · "in" @26.11: the dotted link grows from the microphone to the house; the house draws on over the same 0.6 s */
  tl.to($("linkrect"), { attr: { width: 490 }, duration: 0.6, ease: "none" }, 26.11);
  draw($("h-wall"), 26.11, 0.3); draw($("h-roof"), 26.15, 0.3); draw($("h-door"), 26.22, 0.26);
  draw($("h-win1"), 26.27, 0.26); draw($("h-win2"), 26.30, 0.26); draw($("h-bar1"), 26.33, 0.26); draw($("h-bar2"), 26.35, 0.26);
  draw($("h-chim"), 26.38, 0.26); draw($("h-aer"), 26.42, 0.26);

  /* 10 · "act," @26.83: the left window turns amber (Amber 2 at 30 %); the right one stays dark */
  tl.to($("h-win1"), { fill: "#e8c56a", fillOpacity: 0.3, duration: 0.3, ease: "power2.out" }, 26.83);

  /* 11 · "forecast" @28.05: strip C; 12 · "half" @28.89: its chip */
  stripIn($("strip-c"), 28.05);
  tl.to($("chip-c"), { autoAlpha: 1, duration: 0.3, ease: "power1.out" }, 28.89);

  /* 13 · "warning" @30.85: strip D; 14 · "Counties" @31.49: its chip. Hold to the last frame */
  stripIn($("strip-d"), 30.85);
  tl.to($("chip-d"), { autoAlpha: 1, duration: 0.3, ease: "power1.out" }, 31.49);

  tl.to({}, { duration: 0.01 }, D - 0.01);
  window.__timelines[ID] = tl;
})();
</script>
