  function draw(e, t, d) {                                  /* a line drawn on: dash = ceil(len)+1, hidden until its start */

  /* Close to Everything is a 1.6x move: scale runs on the log curve (helpers.js logLerpScale) and x, y stay linear in scale,

  function logEase(p) { return (Math.pow(R, inOut(p)) - 1) / (R - 1); }

  var world = $("world"), paper = $("paper"), cur = $("cur"), lamp = $("m-lamp");
