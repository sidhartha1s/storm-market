<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:#030507; font-family:Arial,sans-serif; }
  .hdr { position:absolute; left:0; right:0; top:80px; text-align:center; font-weight:700; font-size:26px; letter-spacing:8px; color:#93a3b2; }
  .row { position:absolute; left:0; right:0; text-align:center; }
  #g-num-r1 { top:200px; } #g-num-r2 { top:400px; } #g-num-r3 { top:640px; } #g-num-r4 { top:820px; }
  .val { font-family:'Courier New',monospace; font-weight:700; font-size:150px; color:#e8c56a; }
  #g-num-v2 { color:#e74c3c; }
  .lab { font-size:30px; letter-spacing:6px; color:#c8d3e0; font-weight:700; margin-top:4px; }
  .small .val { font-size:88px; } .small .lab { font-size:23px; }
  .cite { position:absolute; left:0; right:0; bottom:60px; text-align:center; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#5d6d7c; }
  .split { display:inline-block; margin:0 60px; }
</style>
<div id="root" data-composition-id="g-numbers" data-width="1920" data-height="1080">
  <div class="hdr" id="g-num-hdr">APRIL 25 – 28, 2011 · THE OFFICIAL RECORD</div>
  <div class="row" id="g-num-r1"><div class="val" id="g-num-v1">0</div><div class="lab">TORNADOES · THE LARGEST OUTBREAK EVER RECORDED</div></div>
  <div class="row" id="g-num-r2"><div class="val" id="g-num-v2">0</div><div class="lab">LIVES LOST TO THE TORNADOES</div></div>
  <div class="row small" id="g-num-r3">
    <span class="split"><span class="val" id="g-num-v3" style="color:#e74c3c">0</span><div class="lab">APRIL 27 ALONE</div></span>
    <span class="split"><span class="val" id="g-num-v4" style="color:#e74c3c">0</span><div class="lab">OF THEM IN ALABAMA</div></span>
  </div>
  <div class="row small" id="g-num-r4"><span class="val" id="g-num-v5">$0</span><div class="lab">IN DAMAGE · 2011 DOLLARS</div></div>
  <div class="cite" id="g-num-cite">Source: NWS Service Assessment, "The Historic Tornadoes of April 2011" · NOAA/NCEI</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-num-hdr","#g-num-r1","#g-num-r2","#g-num-r3","#g-num-r4","#g-num-cite"], {autoAlpha:0}, 0);
  /* slot = a8-s1 start + 1.0 → rel = cue - 1.0. n360@5.72, n324@11.58, n316@18.14, n234@20.84, 10b@24.58, assess@34.98 */
  tl.fromTo("#g-num-hdr", {autoAlpha:0}, {autoAlpha:1, duration:0.6}, 0.4);
  function counter(sel, target, at, dur, fmt) {
    const o={v:0};
    tl.set(sel.replace("-v","-r").replace(/-v(\d)/, "-r$1"), {}, at); /* noop guard */
    tl.to(o, {v:target, duration:dur, ease:"power4.out", onUpdate:()=>{
      const e=document.querySelector(sel); if(e) e.textContent = fmt(Math.round(o.v));
    }}, at);
  }
  tl.fromTo("#g-num-r1", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 4.3);
  counter("#g-num-v1", 368, 4.5, 2.2, v=>v+"");
  tl.fromTo("#g-num-r2", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 10.3);
  counter("#g-num-v2", 324, 10.5, 2.4, v=>v+"");
  tl.fromTo("#g-num-r3", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 16.9);
  counter("#g-num-v3", 316, 17.1, 1.6, v=>v+"");
  counter("#g-num-v4", 234, 19.6, 1.6, v=>v+"");
  tl.fromTo("#g-num-r4", {autoAlpha:0, y:26}, {autoAlpha:1, y:0, duration:0.5}, 23.3);
  counter("#g-num-v5", 10.2*10, 23.5, 1.8, v=>"$"+(v/10).toFixed(1)+"B");
  tl.fromTo("#g-num-cite", {autoAlpha:0}, {autoAlpha:1, duration:0.8}, 33.6);
  window.__timelines["g-numbers"] = tl;
})();
</script>
</template>
</body>
</html>
