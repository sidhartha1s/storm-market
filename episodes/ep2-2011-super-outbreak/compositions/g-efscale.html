<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); font-family:Arial,sans-serif; }
  .hdr { position:absolute; left:0; right:0; top:74px; text-align:center; font-weight:700; font-size:26px; letter-spacing:8px; color:#93a3b2; }
  .sub { position:absolute; left:0; right:0; top:118px; text-align:center; font-family:Georgia,serif; font-style:italic; font-size:28px; color:#d8a13a; }
  .dis { position:absolute; left:170px; top:210px; width:900px; }
  .di { position:relative; float:left; width:100px; height:88px; margin:0 10px 10px 0; background:#101820; border:2px solid #2a3644; display:grid; place-items:center; font-size:15px; color:#9db0c2; font-weight:700; text-align:center; line-height:1.2; }
  .dislab { position:absolute; left:170px; top:700px; width:900px; font-size:24px; color:#dfe7ee; font-weight:700; letter-spacing:1px; }
  .ladder { position:absolute; right:150px; top:210px; width:480px; }
  .ladlab { font-size:22px; letter-spacing:4px; color:#93a3b2; font-weight:700; margin-bottom:18px; }
  .rung { position:relative; height:74px; margin-bottom:10px; background:#101820; border-left:10px solid #2a3644; }
  .rung .r { position:absolute; left:22px; top:16px; font-family:'Arial Black',Arial,sans-serif; font-size:34px; color:#dfe7ee; }
  .rung .w { position:absolute; right:20px; top:22px; font-family:'Courier New',monospace; font-size:24px; color:#93a3b2; }
  #g-ef-r5 { border-left-color:#8e2020; }
  #g-ef-verdict { position:absolute; right:150px; top:760px; width:480px; }
  .stamp4 { display:inline-block; font-family:'Arial Black',Arial,sans-serif; font-size:84px; color:#fff; background:#8e2020; padding:2px 28px; }
  .vsub { font-size:26px; color:#e8c56a; font-weight:700; margin-top:14px; }
  .close { position:absolute; left:0; right:0; bottom:64px; text-align:center; font-family:Georgia,serif; font-style:italic; font-size:32px; color:#b8c6d4; }
</style>
<div id="root" data-composition-id="g-efscale" data-width="1920" data-height="1080">
  <div class="hdr" id="g-ef-hdr">HOW A TORNADO IS ACTUALLY RATED</div>
  <div class="sub" id="g-ef-sub">nobody measures the wind — engineers read the damage</div>
  <div class="dis" id="g-ef-dis"></div>
  <div class="dislab" id="g-ef-dislab">28 DAMAGE INDICATORS — homes, schools, towers, big-box stores — each with defined DEGREES OF DAMAGE</div>
  <div class="ladder" id="g-ef-ladder">
    <div class="ladlab">RATING = WORST DAMAGE THE EVIDENCE SUPPORTS</div>
    <div class="rung" id="g-ef-r0"><span class="r">EF0–EF1</span><span class="w">65–110 MPH</span></div>
    <div class="rung" id="g-ef-r2"><span class="r">EF2–EF3</span><span class="w">111–165 MPH</span></div>
    <div class="rung" id="g-ef-r4"><span class="r">EF4</span><span class="w">166–200 MPH</span></div>
    <div class="rung" id="g-ef-r5"><span class="r">EF5</span><span class="w">200+ MPH · open-ended</span></div>
  </div>
  <div id="g-ef-verdict">
    <span class="stamp4" id="g-ef-stamp">EF4</span>
    <div class="vsub" id="g-ef-vsub">TUSCALOOSA · 190 MPH — flashes of EF5, not corroborated consistently</div>
  </div>
  <div class="close" id="g-ef-close">The scale measures what a storm did to what it hit — an EF4 through a city can kill far more than an EF5 through farmland.</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* build 28 DI tiles synchronously */
  const names = ["MOBILE HOME","1-2 FAM HOME","APT BLDG","MOTEL","MASONRY","SCHOOL","HIGH SCHOOL","LOW-RISE","MID-RISE","HIGH-RISE","INST BLDG","METAL BLDG","BARN","WAREHOUSE","TRANS TOWER","STRIP MALL","BIG BOX","AUTO SHOWRM","SVC STATION","CHURCH","FREESTAND TWR","POLE","TREE HW","TREE SW","JR HIGH","SM RETAIL","SM PROF","CANOPY"];
  const dis = document.getElementById("g-ef-dis");
  for (let i=0;i<28;i++) { const d=document.createElement("div"); d.className="di"; d.id="g-ef-di"+i; d.textContent=names[i]; dis.appendChild(d); }
  const tl = gsap.timeline({ paused: true });
  tl.set(["#g-ef-hdr","#g-ef-sub","#g-ef-dis","#g-ef-dislab","#g-ef-ladder","#g-ef-verdict","#g-ef-close"], {autoAlpha:0}, 0);
  /* slot = a6-s3 start + 1.5 → rel = cue - 1.5. ef4@2.08, dis28@18.06, dod@23.68, 190@43.9, farmland@58.74 */
  tl.fromTo("#g-ef-hdr", {autoAlpha:0, y:-16}, {autoAlpha:1, y:0, duration:0.5}, 0.5);
  tl.fromTo("#g-ef-sub", {autoAlpha:0}, {autoAlpha:1, duration:0.5}, 3.6);
  tl.set("#g-ef-dis", {autoAlpha:1}, 8.4);
  for (let i=0;i<28;i++) {
    tl.fromTo("#g-ef-di"+i, {autoAlpha:0, scale:0.7}, {autoAlpha:1, scale:1, duration:0.18}, 8.5+i*0.34);
  }
  tl.fromTo("#g-ef-dislab", {autoAlpha:0}, {autoAlpha:1, duration:0.5}, 21.5);
  tl.fromTo("#g-ef-ladder", {autoAlpha:0, x:30}, {autoAlpha:1, x:0, duration:0.6}, 26.0);
  tl.fromTo("#g-ef-verdict", {autoAlpha:0}, {autoAlpha:1, duration:0.2}, 41.6);
  tl.fromTo("#g-ef-stamp", {scale:2.4}, {scale:1, duration:0.35, ease:"power4.in"}, 41.7);
  tl.fromTo("#g-ef-close", {autoAlpha:0}, {autoAlpha:1, duration:0.7}, 55.5);
  window.__timelines["g-efscale"] = tl;
})();
</script>
</template>
</body>
</html>
