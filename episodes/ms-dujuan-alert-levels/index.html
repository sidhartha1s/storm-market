<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const DUR = 529.776;
  function kb(sel, at, dur, s0, s1, x0, x1, y0, y1) {
    tl.fromTo(sel, { scale: s0, x: x0, y: y0, transformOrigin: "center" }, { scale: s1, x: x1, y: y1, duration: dur, ease: "none" }, at);
  }
  function pop(sel, at, hold) {
    tl.fromTo(sel, { scale: 2.2, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.35, ease: "power4.in" }, at);
    tl.to(sel, { autoAlpha: 0, y: -26, duration: 0.28, ease: "power2.in" }, at + hold - 0.28);
  }
  function lab(sel, at, hold) {
    tl.fromTo(sel, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, at);
    tl.to(sel, { autoAlpha: 0, duration: 0.3 }, at + hold - 0.3);
  }
  function bug(strip, hl, at, dur, lines) {
    tl.fromTo(strip, { y: 96 }, { y: 0, duration: 0.45, ease: "power3.out" }, at);
    const n = Math.floor((dur - 0.6) / 14);
    for (let i = 0; i < n; i++) {
      const t = at + 0.3 + i * 14, text = lines[i % lines.length];
      if (i > 0) tl.to(hl, { y: 40, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, t - 0.25);
      tl.set(hl, { textContent: text }, t);
      tl.fromTo(hl, { y: -40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "power2.out" }, t);
    }
