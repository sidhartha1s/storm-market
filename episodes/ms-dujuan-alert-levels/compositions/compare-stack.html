<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- compare-stack.html — B7 "the bigger difference: one ladder vs. several systems". Two-column mapping
     card: JAPAN's single coordinated ladder (left) vs. the US stack of three uncoordinated pieces
     (right, rows land on cue), with connecting lines drawn once Japan's single-package point lands.
     Mount: track 2, host start = episode-abs 346.873, duration 53.782 (B7 window is 59.782s; a 6.0s
     lead-in still plays before this comp mounts; shifted 15.539s earlier 17 Sep 26 when the CTA moved
     out of the old B3/B4 seam).

     ROUND 2 (owner: "sitting still", 2/10, 17 Sep 26) — the build finished at ~26.8s then the panel held
     static for the remaining ~24s. Added .cs-note (parked at top:850, clear of the two columns and the
     connector) with four more word-cued beats from b7-s1.words.json covering the rest of the segment:
     both agencies required to coordinate, level four meaning two things at once, the one-package
     warning+order, and no single US system doing both. Plus .cs-bgplate for continuous background drift.

     Cues word-synced from audio/b7-s1.words.json
     (segment-abs minus this comp's mount). Font: 'AbrilFig' relies on index.html's single @font-face (a
     per-comp duplicate false-triggers css_collision.py on the shared ".ttf" url() token). All classes AND
     the GSAP selectors carry the cs- comp tag so no name is shared with index.html or a sibling comp. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .cs-bgplate { position:absolute; inset:-60px; background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; }
  .cs-note { position:absolute; left:50%; top:850px; transform:translateX(-50%); max-width:1100px; box-sizing:border-box;
    text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:25px; letter-spacing:1px; color:#f4f0e8;
    background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14); border-left:6px solid #d8a13a;
    border-radius:10px; padding:14px 30px; white-space:nowrap; }
  .cs-eye { position:absolute; left:0; right:0; top:90px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:24px; letter-spacing:5px; color:#d8a13a; }
  .cs-colhead { position:absolute; top:150px; font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:3px; text-align:center; }
  .cs-col-l { left:170px; width:620px; color:#d0121f; }
  .cs-col-r { right:170px; width:620px; color:#8fb4d8; }
  .cs-stack { position:absolute; top:210px; width:620px; box-sizing:border-box; }
  .cs-stack-l { left:170px; }
  .cs-stack-r { right:170px; }
  .cs-jpcard { padding:26px 30px; border-radius:16px; background:rgba(208,18,31,0.14); border:2px solid #d0121f;
    text-align:center; }
  .cs-jpcard .cs-big { font-family:'AbrilFig',Georgia,serif; font-size:54px; line-height:1.2; margin-top:12px; }
  .cs-jpcard .cs-sub { margin-top:10px; font-size:19px; color:#f4b8bc; }
  .cs-usrow { margin-top:16px; padding:16px 24px; border-radius:12px; background:rgba(10,16,24,0.5);
    border:1px solid rgba(143,180,216,0.3); font-family:'Arial Black',Arial,sans-serif; font-size:24px; }
  .cs-usrow .cs-t { font-size:24px; }
  .cs-usrow .cs-h { margin-top:6px; font-family:'AbrilFig',Georgia,serif; font-size:30px; color:#8fb4d8; }
  .cs-connector { position:absolute; left:820px; top:420px; width:280px; height:4px; background:#d8a13a;
    box-shadow:0 0 16px rgba(216,161,58,0.8); transform-origin:left center; transform:scaleX(0); }
  .cs-connlab { position:absolute; left:830px; top:382px; width:260px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:19px; letter-spacing:1px; color:#d8a13a; }
</style>
<div id="root" data-composition-id="compare-stack" data-width="1920" data-height="1080">
  <div class="cs-bgplate" id="cs-bgplate"></div>
  <div class="cs-eye" id="cs-eye">ONE NUMBER VS. THREE SYSTEMS</div>
  <div class="cs-colhead cs-col-l">JAPAN</div>
  <div class="cs-colhead cs-col-r">UNITED STATES</div>
  <div class="cs-stack cs-stack-l" id="cs-l">
    <div class="cs-jpcard">
      <div style="font-family:'Arial Black',Arial,sans-serif;font-size:20px;letter-spacing:2px;color:#f4b8bc">SINGLE ALERT LEVEL</div>
      <div class="cs-big">Weather Trigger + Order</div>
      <div class="cs-sub">Same agency day, by policy</div>
    </div>
  </div>
  <div class="cs-stack cs-stack-r" id="cs-r">
    <div class="cs-usrow" id="cs-r1"><div class="cs-t">HURRICANE WATCH</div><div class="cs-h">48 HOURS OUT</div></div>
    <div class="cs-usrow" id="cs-r2"><div class="cs-t">HURRICANE WARNING</div><div class="cs-h">36 HOURS OUT</div></div>
    <div class="cs-usrow" id="cs-r3"><div class="cs-t">LOCAL EVACUATION ORDER</div><div class="cs-h">SEPARATE TIMELINE</div></div>
  </div>
  <div class="cs-connector" id="cs-conn"></div>
  <div class="cs-connlab" id="cs-connlab">ONE LADDER, ONE DAY</div>
  <div class="cs-note" id="cs-note" style="visibility:hidden"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const HOST_WINDOW = 53.782; // this episode's compare-stack mount: 346.873-400.655
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  const CONTENT_BEATS = [];
  function note(text, at, hold) {
    tl.set("#cs-note", { visibility: "visible", textContent: text }, at);
    tl.fromTo("#cs-note", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35 }, at);
    tl.to("#cs-note", { autoAlpha: 0, duration: 0.3 }, at + hold - 0.3);
    CONTENT_BEATS.push(at);
  }

  tl.to("#cs-bgplate", { scale: 1.06, duration: 53.782, ease: "none" }, 0);

  tl.set(["#cs-r1","#cs-r2","#cs-r3","#cs-connlab","#cs-note"], { autoAlpha: 0 }, 0);
  tl.set("#cs-note", { visibility: "hidden" }, 0);
  tl.fromTo("#cs-eye", { autoAlpha:0, y:-16 }, { autoAlpha:1, y:0, duration:0.5 }, 0); CONTENT_BEATS.push(0);
  tl.fromTo("#cs-l", { x:-60, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, 0.2);
  tl.fromTo("#cs-r", { x:60, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, 0.2); CONTENT_BEATS.push(0.2);
  /* continuous ambient motion so neither column sits frozen through the long hold */
  tl.to(".cs-jpcard", { y: -6, duration: 2.8, ease: "sine.inOut", repeat: repeatsToFit(1.0, 2.8), yoyo: true }, 1.0);
  tl.fromTo("#cs-r1", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 3.46); CONTENT_BEATS.push(3.46);
  tl.fromTo("#cs-r2", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 8.90); CONTENT_BEATS.push(8.90);
  tl.fromTo("#cs-r3", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 15.46); CONTENT_BEATS.push(15.46);
  tl.to(".cs-usrow", { opacity: 0.85, duration: 2.4, ease: "sine.inOut", repeat: repeatsToFit(18.0, 2.4), yoyo: true }, 18.0); CONTENT_BEATS.push(18.0);
  tl.to("#cs-conn", { scaleX: 1, duration: 0.6, ease: "power2.out" }, 22.22); CONTENT_BEATS.push(22.22);
  tl.fromTo("#cs-connlab", { autoAlpha:0, y:-10 }, { autoAlpha:1, y:0, duration:0.4 }, 29.36); CONTENT_BEATS.push(29.36);
  /* "Both come from agencies required by policy to coordinate." — 32.24s */
  note("BOTH REQUIRED BY POLICY TO COORDINATE", 32.24, 3.94);
  /* "...level four should understand two things happening together." — 36.18s */
  note("LEVEL 4 MEANS TWO THINGS AT ONCE", 36.18, 6.22);
  /* "A warning tied to specific rainfall and wind thresholds and an order to leave right now issued as one package." — 42.40s */
  note("ONE PACKAGE: WARNING + ORDER TO LEAVE", 42.40, 6.36);
  /* "No single American watch or warning does both jobs at once." — 48.76s */
  note("NO SINGLE US SYSTEM DOES BOTH", 48.76, 4.42);
  tl.to(["#cs-eye","#cs-l","#cs-r","#cs-conn","#cs-connlab"], { autoAlpha:0, duration:0.5 }, 53.18); CONTENT_BEATS.push(53.18);

  const sorted = CONTENT_BEATS.slice().sort((a,b)=>a-b);
  let maxGap = 0; for (let i=1;i<sorted.length;i++) maxGap = Math.max(maxGap, sorted[i]-sorted[i-1]);
  console.log("[gap-check] compare-stack content beats:", sorted.map(n=>n.toFixed(2)), "max gap:", maxGap.toFixed(2), "s");
  window.__timelines["compare-stack"] = tl;
})();
</script>
</template>
</body>
</html>
