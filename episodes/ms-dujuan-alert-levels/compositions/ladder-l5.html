  note("EVACUATION ITSELF MAY NO LONGER BE SAFE", 3.58, 2.84);
  /* "Japan's own cabinet office admits this level is rarely issued." — 6.42s */

  tl.to("#l5-pf", { autoAlpha:0, y:-24, duration:0.35 }, 13.6); CONTENT_BEATS.push(13.6);

  /* round 4 (owner: freeze_scan static 23.5-29.5s comp-local, 17 Sep 26) — same bug: this caption held
     its text past its own words while the narration moved on to "It is the National Weather Service's
     extreme wind warning" (28.26-31.76), the exact fact the card reveals a beat later. Split so the
     second clause gets its own caption and bridges straight into the card. */
  /* round 4b (owner: freeze_scan static 23.5-28.5s comp-local at hold=5, 17 Sep 26) — the split above
     landed the whole clause on one caption, exactly at the 5s cadence limit with nothing else moving.
     Split again on the clause's own sub-boundary ("America's closest match" / "is not a hurricane
     watch or warning") so no single caption ever holds a full 5s by itself. */
  /* "America's closest match..." — 23.26s */
  note("AMERICA'S CLOSEST MATCH", 23.26, 2.04);
  /* "...is not a hurricane watch or a hurricane warning at all." — 25.30s */

  tl.set("#l5-card", { visibility: "visible" }, 29.44);
  tl.fromTo("#l5-card", { autoAlpha:0, y:30 }, { autoAlpha:1, y:0, duration:0.5, ease:"power3.out" }, 29.44); CONTENT_BEATS.push(29.44);
  // card ambient (glow pulse + y-bob) runs from reveal straight through to exit so the 29.44-54.02 span

  tl.fromTo("#l5-cardglow", { opacity: 0.15 }, { opacity: 0.85, duration: 1.4, ease: "sine.inOut", repeat: repeatsToFit(29.94, 1.4), yoyo: true }, 29.94);
  tl.to("#l5-card", { y: -6, duration: 1.8, ease: "sine.inOut", repeat: repeatsToFit(29.94, 1.8), yoyo: true }, 29.94);
  /* round 5 (owner: "0 <1 before 115 <1", hard rule: no count-ups, land final value on its word) - final

  tl.fromTo("#l5-n1", { opacity: 0 }, { opacity: 1, duration: 0.15 }, 34.0); CONTENT_BEATS.push(34.0);

  const sorted = CONTENT_BEATS.slice().sort((a,b)=>a-b);

  console.log("[gap-check] ladder-l5 content beats:", sorted.map(n=>n.toFixed(2)), "max gap:", maxGap.toFixed(2), "s");
