<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- split-panel.html — B2 "where the storm stands right now". JMA card (left, static reference: the B1
     numbers) beside a JTWC card (right, its own independent reading counts up on cue), a motion arrow for
     heading, a TS-threshold countdown chip, an SST chip, and a closing status chip. Mount: track 2, host
     start = episode-abs 61.582, duration 51.491 (B2 window is 57.491s; a 6.0s Odaiba lead-in plays before
     this comp mounts). Cues word-synced from audio/b2-s1.words.json (segment-abs minus this comp's mount;
     comp-relative = audio-relative - 6.0; the heading cue lands just before mount, so it reveals at mount
     instead). Font: 'AbrilFig' relies on index.html's single @font-face. All classes carry the sp- comp
     tag so no class name is shared with index.html or a sibling composition.

     ROUND 2 (owner: "sitting still", 2/10, 17 Sep 26) — this comp used to go 19s+ between content
     changes after the JTWC count-up finished. Fixes: (1) .sp-bgplate — a dedicated background layer
     (separate from #root, which now just holds a flat fallback colour) gets a continuous scale
     1.00->1.06 drift across the whole window, so the frame is never a flat static gradient. (2) .sp-note
     — a running-caption chip that swaps text on six more narration beats pulled straight from
     b2-s1.words.json (JTWC as a second reading, the 25th-named-system upgrade, the five-day forecast
     limit, staying over open water, why the detail matters), closing every gap above 8s. (3) the exit
     fade used to fire at 50.89 while #sp-chip-status was still mid-reveal (started 50.82) and wasn't
     even in the fade-out list — a flicker bug, not a style choice. Chip-status now reveals earlier
     (50.32, on "none" — earlier in "none has been issued") and the exit fade (all elements, chip-status
     included) is retimed to 51.0-51.491, landing exactly on the comp's own end with no naked-background
     gap before the 113.073 blackout. That naked gap plus the excluded chip-status is what read as "two
     solid black tiles" at ~109.7s/~112.7s episode-abs (comp-relative ~48.1s/~51.1s). -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .sp-bgplate { position:absolute; inset:-60px; background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; }
  .sp-eye { position:absolute; left:0; right:0; top:90px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:24px; letter-spacing:5px; color:#d8a13a; }
  .sp-card { position:absolute; top:190px; width:760px; box-sizing:border-box; padding:36px 40px; text-align:center;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .sp-card-l { left:150px; border-bottom:5px solid #8fb4d8; }
  .sp-card-r { right:150px; border-bottom:5px solid #d0121f; }
  .sp-tag { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:4px; }
  .sp-card-l .sp-tag { color:#8fb4d8; } .sp-card-r .sp-tag { color:#d0121f; }
  .sp-num { font-family:'AbrilFig',Georgia,serif; font-size:110px; line-height:1.2; margin-top:14px;
    min-width:3ch; font-variant-numeric:tabular-nums; }
  .sp-card-l .sp-num { color:#8fb4d8; } .sp-card-r .sp-num { color:#d0121f; }
  .sp-unit { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:1px; margin-top:14px; }
  .sp-sub { margin-top:12px; font-family:Georgia,serif; font-style:italic; font-size:19px; color:#c8d3e0; }
  .sp-arrow { position:absolute; left:50%; top:150px; transform:translateX(-50%); font-family:'Arial Black',Arial,sans-serif;
    font-size:20px; letter-spacing:1px; color:#d8a13a; text-align:center; }
  .sp-arrow .sp-glyph { font-size:44px; display:block; }
  .sp-chiprow { position:absolute; left:0; right:0; bottom:150px; display:flex; justify-content:center; gap:24px; }
  .sp-chip { font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:1px; color:#f4f0e8;
    background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14); border-left:6px solid #d0121f;
    border-radius:10px; padding:12px 24px; }
  .sp-note { position:absolute; left:50%; top:700px; transform:translateX(-50%); max-width:920px; box-sizing:border-box;
    text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:1px; color:#f4f0e8;
    background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14); border-left:6px solid #8fb4d8;
    border-radius:10px; padding:16px 34px; white-space:nowrap; overflow:hidden; }
  .sp-rule { position:absolute; left:0; bottom:0; width:40%; height:5px; background:linear-gradient(90deg,rgba(143,180,216,0),#8fb4d8,rgba(143,180,216,0)); box-shadow:0 0 12px rgba(143,180,216,0.7); }
</style>
<div id="root" data-composition-id="split-panel" data-width="1920" data-height="1080">
  <div class="sp-bgplate" id="sp-bgplate"></div>
  <div class="sp-eye" id="sp-eye">TWO AGENCIES, SAME STORM</div>
  <div class="sp-arrow" id="sp-arrow" style="visibility:hidden"><span class="sp-glyph">&#8599;</span>9 MPH &middot; 15 KM/H &middot; NNE</div>
  <div class="sp-card sp-card-l" id="sp-l">
    <div class="sp-tag">JMA</div>
    <div class="sp-num">998</div>
    <div class="sp-unit">HPA CENTRAL PRESSURE</div>
    <div class="sp-sub">34 MPH &middot; 55 KM/H sustained</div>
  </div>
  <div class="sp-card sp-card-r" id="sp-r">
    <div class="sp-tag">JTWC (US NAVY)</div>
    <div class="sp-num" id="sp-r-num" style="opacity:0">35</div>
    <div class="sp-unit">MPH SUSTAINED</div>
    <div class="sp-sub" id="sp-r-sub" style="opacity:0">gusting near 46 mph &middot; 74 km/h</div>
  </div>
  <div class="sp-chiprow">
    <div class="sp-chip" id="sp-chip-ts" style="visibility:hidden">TS THRESHOLD: 12H</div>
    <div class="sp-chip" id="sp-chip-sst" style="visibility:hidden">SST 85&deg;F</div>
    <div class="sp-chip" id="sp-chip-status" style="visibility:hidden">NO ALERT LEVEL ISSUED YET</div>
  </div>
  <div class="sp-note" id="sp-note" style="visibility:hidden"><span class="sp-notetext" id="sp-notetext"></span><span class="sp-rule" id="sp-rule"></span></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const HOST_WINDOW = 51.491; // this episode's split-panel mount: 61.582-113.073
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  const CONTENT_BEATS = []; // owner round-2 gap check: real content changes only, never ambient drift
  const R = { n: 0 }; const rEl = document.getElementById("sp-r-num");
  const noteEl = document.getElementById("sp-note");
  function note(text, at) {
    // textContent on the parent wipes the .sp-rule child span — text goes on its own child span (round 3c fix)
    tl.set("#sp-note", { visibility: "visible" }, at);
    tl.set("#sp-notetext", { textContent: text }, at);
    tl.fromTo("#sp-note", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35 }, at);
    CONTENT_BEATS.push(at);
  }

  // continuous background drift so the frame is never a flat static gradient (owner round-2)
  tl.to("#sp-bgplate", { scale: 1.06, duration: 51.491, ease: "none" }, 0);

  tl.set(["#sp-arrow","#sp-chip-ts","#sp-chip-sst","#sp-chip-status"], { visibility: "hidden", autoAlpha: 0 }, 0);
  tl.fromTo("#sp-eye", { autoAlpha:0, y:-16 }, { autoAlpha:1, y:0, duration:0.5 }, 0); CONTENT_BEATS.push(0);
  tl.fromTo("#sp-l", { autoAlpha:0, x:-40 }, { autoAlpha:1, x:0, duration:0.5 }, 0.2);
  tl.fromTo("#sp-r", { autoAlpha:0, x:40 }, { autoAlpha:1, x:0, duration:0.5 }, 0.2); CONTENT_BEATS.push(0.2);
  tl.set("#sp-arrow", { visibility: "visible" }, 0.4);
  tl.fromTo("#sp-arrow", { autoAlpha:0 }, { autoAlpha:1, duration:0.4 }, 0.4); CONTENT_BEATS.push(0.4);
  // round 3 (owner: "no caption for the first 6s / 61.7-64.7s", 17 Sep 26) — the .sp-note chip sat empty
  // from mount to 1.58s; "...moving north-northeast at nine miles per hour" (audio 4.82-6.96) lands its
  // last word right at mount, so the first caption now lands there instead of waiting for the JTWC line.
  note("MOVING NNE AT 9 MPH", 0.1);
  // "The United States Navy's Joint Typhoon Warning Center tracks the same system independently" (audio 1.58s)
  note("JTWC: A SECOND, INDEPENDENT READING", 1.58);
  // continuous sweeping rule under sp-note (round 3, owner: "moving element through every hold") — this
  // chip has no per-beat fade like the other comps' notes, so one repeating sweep covers every text swap.
  tl.set("#sp-rule", { xPercent: -150 }, 0.1);
  tl.to("#sp-rule", { xPercent: 250, duration: 2.2, ease: "none", repeat: repeatsToFit(0.1, 2.2), yoyo: false }, 0.1);
  /* continuous ambient motion so both cards never sit frozen through the long hold */
  tl.to("#sp-l", { y: -6, duration: 2.6, ease: "sine.inOut", repeat: repeatsToFit(0.8, 2.6), yoyo: true }, 0.8);
  tl.to("#sp-r", { y: -6, duration: 2.6, ease: "sine.inOut", repeat: repeatsToFit(1.1, 2.6), yoyo: true }, 1.1);
  tl.to(R, { n: 35, duration: 1.0, ease: "power1.out", onUpdate: () => rEl.textContent = Math.round(R.n) }, 8.72); CONTENT_BEATS.push(8.72);
  /* comp_lint R2 fix (owner 17 Sep 26): text pre-authored in the markup (hidden via opacity:0), revealed
     on the timeline instead of set inside an onStart the seek-based QC never fires. */
  tl.fromTo("#sp-r-sub", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 11.10); CONTENT_BEATS.push(11.10);
  // "Neither agency calls this a typhoon yet." (audio 17.42s)
  note("NEITHER AGENCY CALLS IT A TYPHOON — YET", 17.42);
  tl.set("#sp-chip-ts", { visibility: "visible" }, 24.46);
  tl.fromTo("#sp-chip-ts", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.35 }, 24.46); CONTENT_BEATS.push(24.46);
  // "...becomes this year's 25th named system." (audio 26.9s)
  note("BECOMES THIS YEAR'S 25TH NAMED SYSTEM", 26.9);
  tl.set("#sp-chip-sst", { visibility: "visible" }, 31.82);
  tl.fromTo("#sp-chip-sst", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.35 }, 31.82); CONTENT_BEATS.push(31.82);
  // "That same forecast runs all the way out to its five-day limit." (audio 35.64s)
  note("FORECAST HOLDS TO ITS FIVE-DAY LIMIT", 35.64);
  // "...keeps the storm in open water east of Japan..." (audio 41.46s)
  note("STAYS OPEN WATER, EAST OF JAPAN", 41.46);
  // "That single detail already matters for which Japanese alert level applies here" (audio 44.36s)
  note("THIS DETAIL DECIDES THE ALERT LEVEL", 44.36);
  // "...none has been issued." (audio "none" starts 50.32s) — chip reveals here, in time to be read
  // before the exit fade, instead of the old 50.82 (which collided with the fade-out start)
  tl.set("#sp-chip-status", { visibility: "visible" }, 50.32);
  tl.fromTo("#sp-chip-status", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.35 }, 50.32); CONTENT_BEATS.push(50.32);
  tl.to("#sp-note", { autoAlpha: 0, duration: 0.3 }, 50.32);
  // exit fade lands exactly on the comp's own end (51.491) — no naked-background gap before the cut
  tl.to(["#sp-eye","#sp-l","#sp-r","#sp-arrow","#sp-chip-ts","#sp-chip-sst","#sp-chip-status"], { autoAlpha:0, duration:0.491 }, 51.0); CONTENT_BEATS.push(51.0);

  const sorted = CONTENT_BEATS.slice().sort((a,b)=>a-b);
  let maxGap = 0; for (let i=1;i<sorted.length;i++) maxGap = Math.max(maxGap, sorted[i]-sorted[i-1]);
  console.log("[gap-check] split-panel content beats:", sorted.map(n=>n.toFixed(2)), "max gap:", maxGap.toFixed(2), "s");
  window.__timelines["split-panel"] = tl;
})();
</script>
</template>
</body>
</html>
