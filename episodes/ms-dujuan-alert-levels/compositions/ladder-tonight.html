<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- ladder-tonight.html — B8 "where this storm sits on that ladder tonight". Mini-ladder with a marker
     pinned BELOW level 1 ("still a TD"), a real map plate (Natural Earth basemap crop, Japan mainland to
     the Izu-Ogasawara chain) with a schematic pin for JMA's +117h forecast point, and the wind stat
     count-up. Mount: track 2, host start = episode-abs 422.794, duration 36.836 (B8 window is 48.836s: a
     6.0s lead-in still plays before mount, a 6.0s Himawari return clip plays after). Cues word-synced from
     audio/b8-s1.words.json (segment-abs minus this comp's mount; mount shifted 15.539s earlier 17 Sep
     26 when the CTA moved out of the old B3/B4 seam).

     ROUND 2 (owner: "sitting still", 2/10, 17 Sep 26) — the 67/89 card sat unchanged for ~18s after its
     count-up, and the map plate's motion was too subtle to register as "moving." Added .lt-note (parked
     under the card, left:920 top:520-820, clear of the mini-ladder/marker column) with five more
     word-cued beats from b8-s1.words.json spanning the whole window, and a continuous scale 1.00->1.06
     tween directly on .lt-mapwrap (on top of its existing pan) plus .lt-bgplate behind everything, so the
     background is never reading as a flat static frame.

     Map pin is schematic (interpolated
     between the basemap's own Tokyo/Ogasawara/Guam reference pixels), not a to-scale plot. Font:
     'AbrilFig' relies on index.html's single @font-face (a per-comp duplicate false-triggers
     css_collision.py on the shared ".ttf" url() token). All classes carry the lt- comp tag so no class
     name is shared with index.html or a sibling composition. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .lt-bgplate { position:absolute; inset:-60px; background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; }
  .lt-note { position:absolute; left:920px; top:520px; width:820px; box-sizing:border-box; text-align:center;
    font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:0.5px; line-height:1.35; color:#f4f0e8;
    background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14); border-left:6px solid #d8a13a;
    border-radius:10px; padding:18px 30px; overflow:hidden; }
  .lt-rule { position:absolute; left:0; bottom:0; width:40%; height:5px; background:linear-gradient(90deg,rgba(216,161,58,0),#d8a13a,rgba(216,161,58,0)); box-shadow:0 0 12px rgba(216,161,58,0.7); }
  .lt-mini { position:absolute; left:80px; top:120px; width:300px; }
  .lt-mini .lt-r { display:flex; align-items:center; gap:10px; padding:8px 14px; margin-top:7px; border-radius:8px;
    background:rgba(10,16,24,0.5); border:1px solid rgba(255,255,255,0.1); opacity:0.35; font-size:16px; font-family:'Arial Black',Arial,sans-serif; }
  .lt-mini .lt-r .lt-n { font-family:'AbrilFig',Georgia,serif; font-size:22px; color:#8fb4d8; }
  .lt-marker { position:absolute; left:80px; top:420px; width:300px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:15px; letter-spacing:1px; color:#f4b8bc; background:rgba(208,18,31,0.18); border-left:3px solid #d0121f;
    padding:8px 10px; border-radius:8px; }
  .lt-mapwrap { position:absolute; left:430px; top:70px; width:420px; height:900px; border-radius:20px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.16); box-shadow:0 20px 60px rgba(0,0,0,0.6); }
  .lt-mapwrap img { position:absolute; left:-90px; top:-260px; width:600px; height:1254px; }
  .lt-pin { position:absolute; width:20px; height:20px; border-radius:50%; background:#d0121f; box-shadow:0 0 0 6px rgba(208,18,31,0.3), 0 0 18px rgba(208,18,31,0.9); }
  .lt-pinlab { position:absolute; font-family:'Arial Black',Arial,sans-serif; font-size:17px; letter-spacing:1px; color:#f4f0e8;
    background:rgba(5,8,12,0.75); padding:6px 12px; border-radius:8px; white-space:nowrap; }
  .lt-card { position:absolute; left:920px; top:180px; width:820px; box-sizing:border-box; padding:34px 44px;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:26px; }
  .lt-card .lt-eye { font-family:'Arial Black',Arial,sans-serif; font-size:32px; letter-spacing:5px; color:#d8a13a; }
  .lt-card .lt-row { display:flex; gap:60px; margin-top:26px; }
  .lt-card .lt-stat .lt-num { font-family:'AbrilFig',Georgia,serif; font-size:72px; color:#f4f0e8; min-width:2.5ch;
    font-variant-numeric:tabular-nums; }
  .lt-card .lt-stat .lt-u { margin-top:8px; font-family:'Arial Black',Arial,sans-serif; font-size:19px; letter-spacing:1px; color:#c8d3e0; }
  .lt-card .lt-foot { margin-top:26px; font-size:22px; color:#c8d3e0; font-family:Georgia,serif; font-style:italic; }
</style>
<div id="root" data-composition-id="ladder-tonight" data-width="1920" data-height="1080">
  <div class="lt-bgplate" id="lt-bgplate"></div>
  <div class="lt-note" id="lt-note" style="visibility:hidden"><span class="lt-notetext" id="lt-notetext"></span><span class="lt-rule" id="lt-rule"></span></div>
  <div class="lt-mini" id="lt-mini">
    <div class="lt-r"><div class="lt-n">1</div>RISING RISK</div>
    <div class="lt-r"><div class="lt-n">2</div>ADVISORY ISSUED</div>
    <div class="lt-r"><div class="lt-n">3</div>ELDERLY EVACUATE</div>
    <div class="lt-r"><div class="lt-n">4</div>EVACUATION INSTRUCTION</div>
    <div class="lt-r"><div class="lt-n">5</div>EMERGENCY SAFETY</div>
  </div>
  <div class="lt-marker" id="lt-marker" style="visibility:hidden">TONIGHT: BELOW THE LADDER &middot; STILL A TD</div>
  <div class="lt-mapwrap" id="lt-mapwrap">
    <img src="../media/maps/westpac_corridor.png" alt="">
    <div class="lt-pin" id="lt-pin" style="left:250px; top:170px; visibility:hidden"></div>
    <div class="lt-pinlab" id="lt-pinlab" style="left:270px; top:150px; visibility:hidden">EAST OF JAPAN</div>
  </div>
  <div class="lt-card" id="lt-card">
    <div class="lt-eye">5-DAY FORECAST POINT</div>
    <div class="lt-row">
      <div class="lt-stat"><div class="lt-num" id="lt-n1" style="opacity:0">67</div><div class="lt-u">MPH &middot; 108 KM/H SUSTAINED</div></div>
      <div class="lt-stat"><div class="lt-num" id="lt-n2" style="opacity:0">89</div><div class="lt-u">MPH &middot; 144 KM/H GUST</div></div>
    </div>
    <div class="lt-foot">Natural Earth basemap &middot; pin position is schematic, not a to-scale plot</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const HOST_WINDOW = 36.836; // this episode's ladder-tonight mount: 407.255-444.091
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  const CONTENT_BEATS = [];
  function note(text, at, hold) {
    // textContent on the parent wipes the .lt-rule child span — text goes on its own child span (round 3c fix)
    tl.set("#lt-note", { visibility: "visible" }, at);
    tl.set("#lt-notetext", { textContent: text }, at);
    tl.set("#lt-rule", { xPercent: -150 }, at);
    tl.fromTo("#lt-note", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35 }, at);
    tl.to("#lt-rule", { xPercent: 250, duration: Math.max(hold - 0.3, 0.6), ease: "none" }, at + 0.05);
    tl.to("#lt-note", { autoAlpha: 0, duration: 0.3 }, at + hold - 0.3);
    CONTENT_BEATS.push(at);
  }

  tl.to("#lt-bgplate", { scale: 1.06, duration: 36.836, ease: "none" }, 0);
  /* continuous scale drift directly on the map plate (owner round-2: "background plate looks static") */
  tl.fromTo("#lt-mapwrap", { scale: 1.0 }, { scale: 1.06, duration: 36.836, ease: "none" }, 0);

  /* round 5 (owner: "fully empty mount" pattern, 17 Sep 26) - #lt-mapwrap/#lt-card were missing from
     this initial hide, so they were briefly visible at default opacity before their own fromTo() (start
     0.3/0.5) snapped them invisible then faded back in - the same pop-glitch bug found in compare-stack
     and split-panel. */
  tl.set(["#lt-mapwrap","#lt-card","#lt-marker","#lt-pin","#lt-pinlab","#lt-note"], { visibility: "hidden", autoAlpha: 0 }, 0);
  tl.fromTo("#lt-mini", { autoAlpha:0, x:-40 }, { autoAlpha:1, x:0, duration:0.5 }, 0); CONTENT_BEATS.push(0);
  tl.fromTo("#lt-mapwrap", { autoAlpha:0 }, { autoAlpha:1, duration:0.5 }, 0.3);
  tl.fromTo("#lt-card", { autoAlpha:0, x:40 }, { autoAlpha:1, x:0, duration:0.5 }, 0.5); CONTENT_BEATS.push(0.5);
  /* continuous ambient motion: slow map pan so the plate never sits frozen through the long hold */
  tl.to("#lt-mapwrap img", { y: "-=40", duration: 6.0, ease: "sine.inOut", repeat: repeatsToFit(0.8, 6.0), yoyo: true }, 0.8);
  /* "Japan's longest published forecast, five days out, places the storm east of the country's main islands." — 4.2s */
  note("JAPAN'S LONGEST FORECAST: FIVE DAYS OUT", 4.2, 3.8);
  tl.set(["#lt-pin","#lt-pinlab"], { visibility: "visible" }, 9.16);
  tl.fromTo("#lt-pin", { scale:2.2, autoAlpha:0 }, { scale:1, autoAlpha:1, duration:0.35, ease:"power4.in" }, 9.16); CONTENT_BEATS.push(9.16);
  tl.to("#lt-pin", { scale: 1.35, duration: 0.9, ease: "sine.inOut", repeat: repeatsToFit(9.6, 0.9), yoyo: true }, 9.6);
  tl.fromTo("#lt-pinlab", { autoAlpha:0, y:-10 }, { autoAlpha:1, y:0, duration:0.4 }, 9.4); CONTENT_BEATS.push(9.4);
  tl.to(N1, { n: 67, duration: 1.0, ease: "power1.out", onUpdate: () => n1El.textContent = Math.round(N1.n) }, 12.90); CONTENT_BEATS.push(12.90);
  tl.to(N2, { n: 89, duration: 1.0, ease: "power1.out", onUpdate: () => n2El.textContent = Math.round(N2.n) }, 14.92); CONTENT_BEATS.push(14.92);
  /* "That position sits offshore, past any coastline." — 16.02s */
  note("SITS OFFSHORE, PAST ANY COASTLINE", 16.02, 2.54);
  /* round 3 (owner: "static 425.7-431.7s / 9s", 17 Sep 26) — this used to be one 7.1s static hold;
     split on the clause boundary into two beats ("it also falls one full grade below the point" / "where
     Japan even calls a system a typhoon", audio 26.04/29.18). */
  note("IT ALSO FALLS ONE FULL GRADE", 18.56, 3.6);
  note("BELOW WHERE JAPAN CALLS IT A TYPHOON", 22.16, 3.5);
  /* "If the track holds exactly where that forecast shows it tonight, coastal Japan may never reach level 3..." — 25.66s */
  note("IF THE TRACK HOLDS: BELOW LEVEL 3", 25.66, 3.72);
  /* "...if the track shifts west toward Kanto instead. That math changes..." — 29.38s */
  note("IF IT SHIFTS TOWARD KANTO: THE MATH CHANGES", 29.38, 2.02);
  tl.set("#lt-marker", { visibility: "visible" }, 31.40);
  tl.fromTo("#lt-marker", { autoAlpha:0, y:-10 }, { autoAlpha:1, y:0, duration:0.4 }, 31.40); CONTENT_BEATS.push(31.40);
  tl.to(["#lt-mini","#lt-mapwrap","#lt-card","#lt-marker"], { autoAlpha:0, duration:0.5 }, 36.24); CONTENT_BEATS.push(36.24);

  const sorted = CONTENT_BEATS.slice().sort((a,b)=>a-b);
  let maxGap = 0; for (let i=1;i<sorted.length;i++) maxGap = Math.max(maxGap, sorted[i]-sorted[i-1]);
  console.log("[gap-check] ladder-tonight content beats:", sorted.map(n=>n.toFixed(2)), "max gap:", maxGap.toFixed(2), "s");
  window.__timelines["ladder-tonight"] = tl;
})();
</script>
</template>
</body>
</html>
