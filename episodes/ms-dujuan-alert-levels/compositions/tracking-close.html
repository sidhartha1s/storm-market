<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- tracking-close.html — B9 "what's still open tonight". Two open-thread rows (track, strength) plus a
     travel-season chip and the highlight on JMA's next advisory. Mount: track 2, host start =
     episode-abs 480.456, duration 40.582 (B9 window is 46.582s; a 6.0s Himawari-return lead-in still plays
     before this comp mounts; shifted 8.226s later 17 Sep 26 now that the CTA sits right before it instead
     of after old B3). Cues word-synced from audio/b9-s1.words.json (segment-abs minus this comp's
     mount; the track-row cue lands during the lead-in, so it reveals at mount instead).

     ROUND 2 (owner: "sitting still", 2/10, 17 Sep 26) — the card sat unchanged for ~24s after the
     travel chip landed. Added .tc-note (below the card, top:850, clear of it whichever centered size it
     renders at) with five more word-cued beats from b9-s1.words.json: checking a forecast that updates
     hourly, check the advisory directly, whichever level triggers, more than a wind-speed reading, and
     JMA's next advisory within hours. Plus .tc-bgplate for continuous background drift.

     Font: 'AbrilFig'
     relies on index.html's single @font-face (a per-comp duplicate false-triggers css_collision.py on the
     shared ".ttf" url() token). All classes carry the tc- comp tag so no class name is shared with
     index.html or a sibling composition. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .tc-bgplate { position:absolute; inset:-60px; background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; }
  .tc-note { position:absolute; left:50%; top:850px; transform:translateX(-50%); max-width:1100px; box-sizing:border-box;
    text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:1px; color:#f4f0e8;
    background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14); border-left:6px solid #d8a13a;
    border-radius:10px; padding:16px 34px; white-space:nowrap; overflow:hidden; }
  .tc-rule { position:absolute; left:0; bottom:0; width:40%; height:5px; background:linear-gradient(90deg,rgba(216,161,58,0),#d8a13a,rgba(216,161,58,0)); box-shadow:0 0 12px rgba(216,161,58,0.7); }
  .tc-card { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1100px; box-sizing:border-box;
    padding:44px 60px; text-align:center; background:rgba(10,16,24,0.6); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .tc-eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#c8d3e0; }
  .tc-rows { display:flex; gap:30px; margin-top:26px; }
  .tc-orow { flex:1; padding:22px 20px; border-radius:16px; background:rgba(208,18,31,0.14); border:1px solid rgba(208,18,31,0.4); }
  .tc-orow .tc-t { font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:1px; }
  .tc-orow .tc-s { margin-top:10px; font-family:'AbrilFig',Georgia,serif; font-size:54px; color:#f4b8bc; }
  .tc-chip2 { margin-top:26px; display:inline-block; font-family:'Arial Black',Arial,sans-serif; font-size:28px;
    letter-spacing:1px; color:#f4f0e8; background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14);
    border-left:6px solid #d8a13a; border-radius:10px; padding:14px 26px; }
  .tc-hl { margin-top:26px; padding:20px 26px; background:rgba(216,161,58,0.14); border:2px solid #d8a13a; border-radius:16px; }
  .tc-hl .tc-lab { font-family:'Arial Black',Arial,sans-serif; font-size:26px; color:#f4f0e8; }
</style>
<div id="root" data-composition-id="tracking-close" data-width="1920" data-height="1080">
  <div class="tc-bgplate" id="tc-bgplate"></div>
  <div class="tc-note" id="tc-note" style="visibility:hidden"><span class="tc-notetext" id="tc-notetext"></span><span class="tc-rule" id="tc-rule"></span></div>
  <div class="tc-card" id="tc-card">
    <div class="tc-eye">TONIGHT'S OPEN THREADS</div>
    <div class="tc-rows">
      <div class="tc-orow" id="tc-r1"><div class="tc-t">TRACK</div><div class="tc-s">STILL OPEN</div></div>
      <div class="tc-orow" id="tc-r2" style="visibility:hidden"><div class="tc-t">STRENGTH</div><div class="tc-s">STILL OPEN</div></div>
    </div>
    <div class="tc-chip2" id="tc-chip" style="visibility:hidden">MILLIONS TRAVELING JAPAN THIS WEEK</div>
    <div class="tc-hl" id="tc-hl"><div class="tc-lab">NEXT: JMA'S NEXT ADVISORY, WITHIN HOURS</div></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const HOST_WINDOW = 40.582; // this episode's tracking-close mount: 480.456-521.038
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  const CONTENT_BEATS = [];
  function note(text, at, hold) {
    // textContent on the parent wipes the .tc-rule child span — text goes on its own child span (round 3c fix)
    tl.set("#tc-note", { visibility: "visible" }, at);
    tl.set("#tc-notetext", { textContent: text }, at);
    tl.set("#tc-rule", { xPercent: -150 }, at);
    tl.fromTo("#tc-note", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35 }, at);
    tl.to("#tc-rule", { xPercent: 250, duration: Math.max(hold - 0.3, 0.6), ease: "none" }, at + 0.05);
    tl.to("#tc-note", { autoAlpha: 0, duration: 0.3 }, at + hold - 0.3);
    CONTENT_BEATS.push(at);
  }

  tl.to("#tc-bgplate", { scale: 1.06, duration: 40.582, ease: "none" }, 0);

  tl.set(["#tc-r2","#tc-chip","#tc-note"], { visibility: "hidden", autoAlpha: 0 }, 0);
  tl.fromTo("#tc-card", { autoAlpha:0, scale:0.94 }, { autoAlpha:1, scale:1, duration:0.6, ease:"power3.out" }, 0); CONTENT_BEATS.push(0);
  tl.fromTo("#tc-r1", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.4 }, 0.3); CONTENT_BEATS.push(0.3);
  /* continuous ambient motion so the card never sits frozen through the hold */
  tl.to("#tc-card", { y: -6, duration: 2.7, ease: "sine.inOut", repeat: repeatsToFit(0.8, 2.7), yoyo: true }, 0.8);
  tl.set("#tc-r2", { visibility: "visible" }, 5.56);
  tl.fromTo("#tc-r2", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.4 }, 5.56); CONTENT_BEATS.push(5.56);
  tl.set("#tc-chip", { visibility: "visible" }, 10.98);
  tl.fromTo("#tc-chip", { autoAlpha:0, y:16 }, { autoAlpha:1, y:0, duration:0.4 }, 10.98); CONTENT_BEATS.push(10.98);
  /* round 3 (owner: "static 492.7-501.7s / 12s", 17 Sep 26) — this chip used to set its text once and
     never change again; split on the clause boundary ("for one of its biggest holidays in more than a
     decade," audio 19.98-22.3, comp-rel 13.98-16.3) into a second beat. */
  tl.to("#tc-chip", { duration:0.01, onStart: () => { document.getElementById("tc-chip").textContent = "ONE OF ITS BIGGEST HOLIDAYS IN A DECADE"; } }, 13.98); CONTENT_BEATS.push(13.98);
  /* round 3c (owner: "sits static ~21s while the lower line rotates", 17 Sep 26) — this chip had no exit;
     drop it shortly after its own clause finishes (audio ends comp-rel 16.3) instead of holding for the
     rest of the comp while .tc-note keeps changing underneath it. */
  tl.to("#tc-chip", { autoAlpha: 0, duration: 0.4 }, 17.3); CONTENT_BEATS.push(17.3);
  /* "They are checking a forecast that updates by the hour." — 16.98s */
  note("CHECKING A FORECAST THAT UPDATES HOURLY", 16.98, 3.5);
  /* "Anyone traveling through Japan this week should check that advisory directly..." — 20.48s */
  note("CHECK THE ADVISORY DIRECTLY", 20.48, 6.22);
  /* "Whichever alert level this storm eventually triggers... that number will tell them more." — 26.70s */
  note("WHICHEVER LEVEL IT TRIGGERS, IT WILL TELL YOU MORE", 26.70, 6.24);
  /* "It says more than any single wind speed reading ever could." — 32.94s */
  note("MORE THAN ANY WIND SPEED READING", 32.94, 3.86);
  /* "Japan's weather agency issues its next advisory within hours." — 36.80s */
  note("JMA'S NEXT ADVISORY: WITHIN HOURS", 36.80, 3.18);
  tl.to("#tc-hl", { boxShadow: "0 0 34px rgba(216,161,58,0.5)", duration: 1.3, ease: "sine.inOut", repeat: repeatsToFit(15.0, 1.3), yoyo: true }, 15.0);
  tl.to("#tc-hl", { scale: 1.03, duration: 0.6, ease: "power2.out" }, 38.58); CONTENT_BEATS.push(38.58);
  tl.to("#tc-card", { autoAlpha:0, duration:0.5 }, 39.98); CONTENT_BEATS.push(39.98);

  const sorted = CONTENT_BEATS.slice().sort((a,b)=>a-b);
  let maxGap = 0; for (let i=1;i<sorted.length;i++) maxGap = Math.max(maxGap, sorted[i]-sorted[i-1]);
  console.log("[gap-check] tracking-close content beats:", sorted.map(n=>n.toFixed(2)), "max gap:", maxGap.toFixed(2), "s");
  window.__timelines["tracking-close"] = tl;
})();
</script>
</template>
</body>
</html>
