<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<!-- H1 beat 1 HUD (abs 1.54-5.99, under S1 "no American tornado was rated EF5, the top of the scale"):
     right-hand EF ladder over the night wedge, EF5 rung empty. Fixed HUD: never rides the camera orbit. -->
<style>
  #lad-root { position:absolute; inset:0; font-family:Arial,sans-serif; overflow:hidden; }
  #lad-panel { position:absolute; right:0; top:0; bottom:0; width:820px; box-sizing:border-box;
    background:linear-gradient(270deg, rgba(4,7,10,0.72) 62%, rgba(4,7,10,0)); }
  #lad-body { position:absolute; left:0; top:0; width:820px; height:1080px; }
  .lad-eb { position:absolute; left:96px; top:150px; font-size:22px; font-weight:700; letter-spacing:6px; color:#93a3b2; }
  .lad-rung { position:absolute; left:96px; width:280px; height:64px; box-sizing:border-box; background:#15202b; border:1px solid #2a3644; }
  .lad-fill { position:absolute; inset:0; background:#5a768f; transform-origin:left center; }
  .lad-lab { position:absolute; left:18px; top:0; line-height:64px; font-family:'Arial Black',Arial,sans-serif; font-size:30px; color:#dfe7ee; }
  #lad-ef5 { background:rgba(208,18,31,0.08); border:3px dashed #d0121f; }
  #lad-ef5 .lad-lab { font-size:52px; line-height:60px; color:#f2f5f8; }
  #lad-lead { position:absolute; left:376px; top:251px; width:70px; height:2px; background:#c8d3e0; transform-origin:left center; }
  #lad-dot { position:absolute; left:370px; top:246px; width:12px; height:12px; border-radius:50%; background:#d0121f; }
  #lad-note { position:absolute; left:458px; top:214px; width:280px; }
  #lad-note .n1 { font-size:22px; font-weight:700; letter-spacing:4px; color:#93a3b2; }
  #lad-note .n2 { font-size:30px; font-weight:700; letter-spacing:1px; color:#dfe7ee; margin-top:4px; }
  #lad-note .n3 { font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:4px; }
</style>
<div id="lad-root" data-composition-id="g-ladder-hud" data-width="1920" data-height="1080">
  <div id="lad-panel">
    <div id="lad-body">
      <div class="lad-eb" id="lad-eb">EF SCALE</div>
      <div class="lad-rung" id="lad-ef5" style="top:220px"><div class="lad-lab">EF5</div></div>
      <div class="lad-rung" id="lad-r4" style="top:298px"><div class="lad-fill" id="lad-f4"></div><div class="lad-lab">EF4</div></div>
      <div class="lad-rung" id="lad-r3" style="top:376px"><div class="lad-fill" id="lad-f3"></div><div class="lad-lab">EF3</div></div>
      <div class="lad-rung" id="lad-r2" style="top:454px"><div class="lad-fill" id="lad-f2"></div><div class="lad-lab">EF2</div></div>
      <div class="lad-rung" id="lad-r1" style="top:532px"><div class="lad-fill" id="lad-f1"></div><div class="lad-lab">EF1</div></div>
      <div class="lad-rung" id="lad-r0" style="top:610px"><div class="lad-fill" id="lad-f0"></div><div class="lad-lab">EF0</div></div>
      <div id="lad-lead"></div>
      <div id="lad-dot"></div>
      <div id="lad-note"><div class="n1">LAST ONE</div><div class="n2">May 2013</div><div class="n3">Moore, Oklahoma</div></div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-ladder-hud", DUR = 4.45;
  /* CUES: h1-s1.words.json, mounted at abs 1.54 (host start) -> local = word.start - 1.54 */
  const C = { rated: 1.30 /* "rated" 2.84 */, ef5: 1.58 /* "EF5" 3.12 */, top: 2.94 /* "top" 4.48 */ };
  const tl = gsap.timeline({ paused: true });
  const rungs = ["#lad-r0", "#lad-r1", "#lad-r2", "#lad-r3", "#lad-r4"];
  const fills = ["#lad-f0", "#lad-f1", "#lad-f2", "#lad-f3", "#lad-f4"];
  tl.set([...rungs, "#lad-ef5", "#lad-eb", "#lad-note", "#lad-dot"], { autoAlpha: 0 }, 0);
  tl.set(fills, { scaleX: 0 }, 0);
  tl.set("#lad-lead", { scaleX: 0 }, 0);
  tl.fromTo("#lad-panel", { x: 820 }, { x: 0, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo("#lad-eb", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.3 }, 0.3);
  // the rungs rise from EF0 on "rated"
  rungs.forEach((r, i) => tl.fromTo(r, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power2.out" }, C.rated - 0.6 + i * 0.1));
  fills.forEach((f, i) => tl.to(f, { scaleX: 1, duration: 0.3, ease: "power2.out" }, C.rated - 0.5 + i * 0.1));
  // EF5: the empty rung lands on the word
  tl.fromTo("#lad-ef5", { autoAlpha: 0, scale: 1.25 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.in" }, C.ef5 - 0.25);
  tl.to("#lad-ef5", { opacity: 0.55, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 4 }, C.ef5 + 0.1); // empty rung breathes, ends 2.35+... < exit
  // leader + note on "top of the scale"
  tl.fromTo("#lad-dot", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.2 }, C.top - 0.2);
  tl.to("#lad-lead", { scaleX: 1, duration: 0.3, ease: "power2.out" }, C.top - 0.1);
  tl.fromTo("#lad-note", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out" }, C.top + 0.1);
  // slow float of the whole ladder so the panel never sits still
  tl.fromTo("#lad-body", { y: 6 }, { y: -6, duration: DUR, ease: "sine.inOut" }, 0);
  // exit after "scale." (abs 5.26): slide out right before the cut on "Then," (abs 5.99)
  tl.to("#lad-panel", { x: 980, autoAlpha: 0, duration: 0.45, ease: "power3.in" }, 3.9);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
