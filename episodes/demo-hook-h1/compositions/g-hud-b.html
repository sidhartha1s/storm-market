<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<!-- H1 beat 2 HUD (abs 5.99-14.55, over g-tornado-b, under S2 "Then, on a June night in 2025, one crossed the farms...").
     Time tag on "night", then the ground track drawn behind the moving base on "crossed", labelled on "farms".
     Track head follows g-tornado-b's base: static camera (0,4,72) -> ground z=0 sits at y~812, x = 960 + 20.6*X. -->
<style>
  #hb-root { position:absolute; inset:0; font-family:Arial,sans-serif; overflow:hidden; }
  #hb-time { position:absolute; left:96px; top:90px; padding:18px 26px 20px 22px; border-left:4px solid #7fb2e5;
    background:linear-gradient(90deg, rgba(4,7,10,0.62), rgba(4,7,10,0)); }
  #hb-time .e { font-size:22px; font-weight:700; letter-spacing:6px; color:#93a3b2; }
  #hb-time .t { font-family:'Courier New',monospace; font-weight:700; font-size:56px; color:#f2f5f8; margin-top:6px; }
  #hb-track { position:absolute; top:810px; height:4px; width:0; border-radius:2px;
    background:repeating-linear-gradient(90deg, #e8c56a 0 18px, rgba(232,197,106,0) 18px 30px); box-shadow:0 0 10px rgba(232,197,106,0.55); }
  #hb-lead { position:absolute; top:816px; width:2px; height:52px; background:#c8d3e0; transform-origin:center top; }
  #hb-lab { position:absolute; top:872px; padding:10px 18px 12px 16px; background:rgba(4,7,10,0.55); }
  #hb-lab .v { font-size:30px; font-weight:700; letter-spacing:1px; color:#dfe7ee; }
  #hb-lab .s { font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:4px; }
</style>
<div id="hb-root" data-composition-id="g-hud-b" data-width="1920" data-height="1080">
  <div id="hb-time"><div class="e">FRIDAY NIGHT</div><div class="t">11:02 PM CDT</div></div>
  <div id="hb-track"></div>
  <div id="hb-lead"></div>
  <div id="hb-lab"><div class="v">12.1-mile path</div><div class="s">up to 1.05 miles wide</div></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-hud-b", DUR = 8.56;
  /* CUES: h1-s2.words.json; host starts at abs 5.99 = segment start, so local = word.start */
  const C = { night: 1.46, crossed: 3.78, farms: 4.30, out: 6.75 };
  // must match g-tornado-b CONFIG: path -18 -> 14 over 8.56 s, static camera
  const sx = (t) => 960 + 20.6 * (-18 + 32 * Math.min(t / DUR, 1));
  const X0 = sx(0), LEADX = sx(C.crossed) - 150;
  document.getElementById("hb-track").style.left = X0 + "px";
  document.getElementById("hb-lead").style.left = LEADX + "px";
  document.getElementById("hb-lab").style.left = (LEADX - 16) + "px";

  const tl = gsap.timeline({ paused: true });
  tl.set(["#hb-time", "#hb-lab"], { autoAlpha: 0 }, 0);
  tl.set("#hb-lead", { scaleY: 0 }, 0);
  tl.set("#hb-track", { width: 0 }, 0);
  // time tag on "night"
  tl.fromTo("#hb-time", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, C.night - 0.15);
  tl.fromTo("#hb-time", { y: 0 }, { y: -8, duration: 2.0, ease: "sine.inOut" }, C.night + 0.25);
  tl.to("#hb-time", { autoAlpha: 0, x: -24, duration: 0.35, ease: "power2.in" }, C.crossed - 0.5);
  // ground track draws up to the base on "crossed", then rides the base to the end of the shot
  tl.to("#hb-track", { width: sx(C.crossed + 0.6) - X0, duration: 0.6, ease: "power2.out" }, C.crossed);
  tl.to("#hb-track", { width: sx(DUR) - X0, duration: DUR - C.crossed - 0.6, ease: "none" }, C.crossed + 0.6);
  // leader + label on "farms"
  tl.to("#hb-lead", { scaleY: 1, duration: 0.3, ease: "power2.out" }, C.farms - 0.1);
  tl.fromTo("#hb-lab", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power2.out" }, C.farms + 0.1);
  tl.fromTo("#hb-lab", { x: 0 }, { x: 6, duration: 2.2, ease: "sine.inOut" }, C.farms + 0.45);
  // clear before the "3 KILLED" popfig (abs 13.07 = local 7.08)
  tl.to(["#hb-lab", "#hb-lead", "#hb-track"], { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, C.out);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
