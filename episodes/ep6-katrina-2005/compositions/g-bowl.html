<!DOCTYPE html>

  .gb-hull b { color:#d8a13a; font-style:normal; font-family:'Arial Black',Arial,sans-serif; }

<div id="root" data-composition-id="g-bowl" data-width="1920" data-height="1080">

  <div class="gb-sub" id="g-bowl-sub">the shape of New Orleans, side-on</div>
  <svg id="g-bowl-svg" width="1700" height="620" viewBox="0 0 1700 620">

    <path id="g-bowl-lakewater" d="M1440,290 Q1550,278 1660,290 L1660,420 L1440,420 Z" fill="#1d4a63" opacity="0"/>

    <path id="g-bowl-ground" d="M60,420 L200,420 Q300,255 390,255 Q460,255 560,330 Q850,505 1140,470 Q1330,440 1400,268 Q1450,252 1520,265 L1660,420 L1660,600 L60,600 Z"

<script>
window.__timelines = window.__timelines || {};
(function() {
  /* host 38.78-67.18 (28.4s). Word cues (segment-relative): bowl 1.6, river 3.28,
     pontchartrain 6.1, "below the level" 11.16, "ten feet below" ~16.1, pumped 21.56,
     walls 24.82, hull 27.74. New info every 2-3s; nothing sits still. */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-bowl-";
  tl.set([P+"hull"], { autoAlpha: 0 }, 0);
  tl.fromTo(P+"title", { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.2);
  tl.fromTo(P+"sub", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.7);
  /* the bowl draws itself on "bowl" */
  tl.fromTo(P+"ground", { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.6);
  tl.fromTo(P+"sealine", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 2.0);
  tl.fromTo(P+"sealab", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 2.7);
  /* river on its word */
  tl.fromTo(P+"riverwater", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 3.3);
  tl.fromTo(P+"lab-river", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.45 }, 3.5);
  /* lake on its word */
  tl.fromTo(P+"lakewater", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 6.1);
  tl.fromTo(P+"lab-lake", { autoAlpha: 0, x: 14 }, { autoAlpha: 1, x: 0, duration: 0.45 }, 6.3);
  /* city label as "most of the city lies between them" */
  tl.fromTo(P+"lab-city", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 9.2);
  /* depth callout on "below" */
  tl.fromTo(P+"depthline", { scaleY: 0, transformOrigin: "top center", autoAlpha: 1 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 15.8);
  tl.fromTo(P+"depth", { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power4.in" }, 16.3);
  tl.fromTo(P+"depthsm", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 16.8);
  /* pumps on "pumped" — arrow dash crawls so the motion never dies */
  tl.fromTo(P+"pump", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 21.5);
  tl.to(P+"pump path", { strokeDashoffset: -140, duration: 6.4, ease: "none" }, 21.5);
  /* rims + hull line on "walls" */
  tl.fromTo([P+"rim-l", P+"rim-r"], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.12 }, 24.7);
  tl.fromTo([P+"lab-rims", P+"lab-rims2"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, stagger: 0.12 }, 25.0);
  tl.fromTo(P+"hull", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 26.4);
  /* slow whole-diagram drift so no frame is static */
  tl.fromTo(P+"svg", { scale: 1.0, transformOrigin: "center" }, { scale: 1.035, duration: 28.0, ease: "none" }, 0.3);
  /* exit: fade down into the cut at window end */
  tl.to("#root", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 28.0);
  window.__timelines["g-bowl"] = tl;
})();
</script>
