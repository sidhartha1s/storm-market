<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:#04070c; overflow:hidden; font-family:Arial,sans-serif; }
  #g-track-cam { position:absolute; left:0; top:0; width:2700px; height:1669px; transform-origin:0 0; }
  #g-track-cam img { position:absolute; left:0; top:0; width:2700px; height:1669px; }
  /* traveling storm ring (positions in plate pixels) */
  #g-track-ring { position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:6px solid rgba(240,245,248,0.9); box-shadow:0 0 40px rgba(240,245,248,0.5), inset 0 0 30px rgba(240,245,248,0.25); }
  #g-track-cat { position:absolute; left:50%; top:-58px; transform:translateX(-50%); white-space:nowrap;
    font-family:'Arial Black',Arial,sans-serif; font-size:34px; color:#fff; background:#8e2020; padding:4px 18px; letter-spacing:2px; }
  .g-track-chip { position:absolute; white-space:nowrap; font-weight:700; font-size:26px; color:#f2f5f8;
    background:rgba(5,8,12,0.72); padding:10px 20px; letter-spacing:1px; border-left:5px solid #d8a13a; }
  .g-track-chip .sm { display:block; font-weight:400; font-size:19px; color:#c8d3e0; letter-spacing:2px; margin-top:4px; }
  .gtr-title { position:absolute; left:110px; top:88px; z-index:5; font-family:'Arial Black',Arial,sans-serif;
    font-size:56px; color:#f2f5f8; background:rgba(5,8,12,0.62); padding:8px 24px; letter-spacing:2px; }
  .gtr-src { position:absolute; right:40px; bottom:34px; z-index:5; font-size:19px; color:rgba(200,211,224,0.75);
    background:rgba(5,8,12,0.55); padding:5px 12px; }
</style>
<div id="root" data-composition-id="g-track" data-width="1920" data-height="1080">
  <div class="gtr-title" id="g-track-title">Katrina's Road to the Gulf</div>
  <div id="g-track-cam">
    <img src="../media/maps/baseplate-gulf-track-map-katrina2005.png" alt="">
    <div id="g-track-ring" style="left:1769px; top:1364px;"><div id="g-track-cat">DEPRESSION</div></div>
    <div class="g-track-chip" id="g-track-chip-bah" style="left:1820px; top:1290px;">BORN OVER THE BAHAMAS<span class="sm">AUGUST 23 · TROPICAL DEPRESSION TWELVE</span></div>
    <div class="g-track-chip" id="g-track-chip-fl" style="left:1290px; top:1250px;">FLORIDA LANDFALL<span class="sm">AUGUST 25 · SIX LIVES</span></div>
    <div class="g-track-chip" id="g-track-chip-gulf" style="left:1030px; top:1370px;">INTO THE GULF<span class="sm">HOT, DEEP WATER AHEAD</span></div>
  </div>
  <div class="gtr-src" id="g-track-src">TRACK: NOAA BEST TRACK · BASE: NASA BLUE MARBLE</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* host 202.42-253.80 (51.38s = a2-s1 + a2-s2). Cues (rel): Aug23 depression 8.7, "a name" ~20,
     Florida crossing 30.5-34, "six people died" ~37, "slid into the Gulf" 42.4. Camera follows
     the burned-in NOAA track; ring + cat label carry the state. */
  const tl = gsap.timeline({ paused: true });
  const cam = "#g-track-cam", ring = "#g-track-ring";
  /* camera clamp: the plate (2700x1669) must always cover the 1920x1080 viewport —
     unclamped centering on near-edge points left a ~200px black band (owner nit, 04:09) */
  function camPos(px, py, z) {
    const x = Math.min(0, Math.max(1920 - 2700 * z, 960 - px * z));
    const y = Math.min(0, Math.max(1080 - 1669 * z, 540 - py * z));
    return { x: x, y: y };
  }
  function look(px, py, z, at, dur, ease) {
    const p = camPos(px, py, z);
    tl.to(cam, { scale: z, x: p.x, y: p.y, duration: dur, ease: ease || "power1.inOut" }, at);
  }
  function ringAt(px, py, at, dur) {
    tl.to(ring, { left: px, top: py, duration: dur, ease: "power1.inOut" }, at);
  }
  /* open on the Bahamas birth point */
  tl.set(cam, { scale: 1.1, x: 960 - 1769 * 1.1, y: 540 - 1364 * 1.1 }, 0);
  tl.set(["#g-track-chip-fl", "#g-track-chip-gulf"], { autoAlpha: 0 }, 0);
  tl.fromTo("#g-track-title", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 0.3);
  tl.fromTo("#g-track-src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.8);
  /* ring pulses continuously (motion floor) */
  tl.fromTo(ring, { scale: 0.92 }, { scale: 1.1, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 55 }, 0);
  tl.fromTo("#g-track-chip-bah", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 8.6);
  /* "a day later it had a name" — slow drift while the depression idles */
  look(1700, 1330, 1.12, 4.0, 8.0, "none");
  tl.to("#g-track-chip-bah", { autoAlpha: 0, duration: 0.5 }, 26.0);
  /* march to Florida with the voice */
  ringAt(1472, 1188, 27.5, 5.0);
  look(1472, 1188, 1.18, 27.5, 5.0);
  tl.set("#g-track-cat", { textContent: "CATEGORY 1" }, 30.0);
  tl.fromTo("#g-track-chip-fl", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 32.0);
  /* six died — hold on Florida a beat, then slide off the coast */
  tl.to("#g-track-chip-fl", { autoAlpha: 0, duration: 0.5 }, 41.0);
  ringAt(1180, 1290, 42.2, 4.6);
  look(1180, 1290, 0.92, 42.2, 4.6);
  tl.fromTo("#g-track-chip-gulf", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 46.4);
  /* end wide: the whole Gulf waits */
  look(1150, 1200, 0.78, 48.2, 2.9, "power1.in");
  tl.to("#root", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 51.0);
  window.__timelines["g-track"] = tl;
})();
</script>
</template>
</body>
</html>
