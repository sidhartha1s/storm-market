  <svg id="g-surge-svg" width="1000" height="640" viewBox="0 0 1000 640">

<script>
window.__timelines = window.__timelines || {};
(function() {
  /* host 633.26-678.66 (45.4s). Cues (rel): 9:45 @0.42, "Gulf stood up" ~8, surge word 13.22,
     27.8ft ~15.5, towns: waveland 22.46, bay ~24, pass ~25.5, long beach ~27, gulfport 28.68,
     biloxi 29.92, "blocks removed" ~33-37, slabs stayed ~38-42. */
  const tl = gsap.timeline({ paused: true });
  const P = "#g-surge-";
  tl.set([P+"measure", P+"verdict"], { autoAlpha: 0 }, 0);
  tl.set([P+"t1",P+"t2",P+"t3",P+"t4",P+"t5",P+"t6"], { autoAlpha: 0.35 }, 0);
  tl.fromTo(P+"title", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 0.2);
  tl.fromTo(P+"sub", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.6);
  tl.fromTo(P+"svg", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.2);
  tl.fromTo(P+"towns", { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.7 }, 1.6);
  /* the water stands up on "the Gulf stood up and walked onto the land" */
  tl.to(P+"waterrect", { attr: { y: 230, height: 410 }, duration: 6.5, ease: "power2.inOut" }, 8.0);
  /* wave top undulates for the entire window (motion floor) */
  tl.to(P+"wavetop", { x: -160, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: 11 }, 8.0);
  /* the number lands with the spoken figure */
  tl.fromTo(P+"measure", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 14.8);
  tl.fromTo(P+"num", { scale: 1.45, transformOrigin: "left bottom" }, { scale: 1, duration: 0.35, ease: "power4.in" }, 15.3);
  /* towns ping on their names */
  [["t1",22.3],["t2",23.9],["t3",25.4],["t4",26.9],["t5",28.5],["t6",29.8]].forEach(function(x) {
    tl.to(P+x[0], { autoAlpha: 1, color: "#f2f5f8", duration: 0.25 }, x[1]);
    tl.fromTo(P+x[0], { x: 0 }, { x: 14, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, x[1]);
  });
  /* verdict on "removed" */
  tl.fromTo(P+"verdict", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 34.0);
  /* slow global drift */
  tl.fromTo("#root", { scale: 1.0, transformOrigin: "center" }, { scale: 1.035, duration: 45.8, ease: "none" }, 0);
  tl.to("#root", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, 45.75);
  window.__timelines["g-surge-ms"] = tl;
})();
</script>
