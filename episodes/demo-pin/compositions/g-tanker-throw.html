<!--
  g-tanker-throw (showcase build). Enderlin, 20 June 2025. 14.0 s, 1920x1080.
  Needs GSAP 3.14.2 + DrawSVGPlugin, CustomEase, SplitText loaded by the host page (index.html head).

  FACTS (fact_sheet.md §3): one empty tanker car, ~72,000 lb (~32,600 kg), lofted ~475.7 ft (145 m).
  Miller et al. 2024: lofting a large compact object > 50 m (~164 ft) generally indicates EF5 (>=210 mph).
  475.7 / 164 = 2.9 -> "nearly three times". 33 cars derailed. Credit: NWS Grand Forks · Miller et al. 2024.
  Football field = 300 ft goal line to goal line (unit comparison, not an event fact).

  WORLD (layer #w-world, camera-driven): datum X0 = 400 (tanker centre at rest), K = 2.8 px/ft, ground y 800.
  164 ft -> 859.2 · 300 ft -> 1240 · 328 ft -> 1318.4 · 475.7 ft -> 1732 · 492 ft -> 1777.6 · 500 ft -> 1800.
  Horizontal distance is to scale; arc height is schematic (no published loft height).

  CAMERA: one proxy {fx, fy, z} = world point placed at screen centre and zoom. Every layer derives its own
  transform from it with a depth factor p (bg 0.4, world 1, fg 1.4) plus a sum-of-sines handheld drift.
  All per-frame DOM writes happen in the master timeline's onUpdate (after every child tween has rendered),
  so any seek order gives the same frame. Randomness = mulberry32 with fixed seeds.
-->

(function () {

  const X0 = 400, K = 2.8, XL = X0 + 475.7 * K, YC = 761, H = 420; /* tanker centre at rest / landing, schematic apex height */

  const tk = { r: 0, lift: 0, set: 0 };

  const R = rng(20250620);
  const rain = [];

    const d = document.createElement('div'); d.className = 'rain';
    $('w-rain').appendChild(d);
    rain.push({ el: d, x: R() * 2200, y: R() * 1200, v: 1100 + R() * 700, o: 0.35 + R() * 0.65 });
  }
  const swirl = [];
  for (let i = 0; i < 16; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    c.setAttribute('width', 4 + R() * 6); c.setAttribute('height', 2 + R() * 3);

    swirl.push({ el: c, h: 200 + R() * 560, a: R() * 6.283, w: 1.6 + R() * 2.2, rx: 90 + R() * 170 });
  }
  const ghosts = [];
  for (let i = 0; i < 3; i++) {
    const g = document.createElement('div'); g.className = 'tk-ghost';
    g.innerHTML = $('tk-svg').outerHTML.replace('id="tk-svg"', '').replace('id="tk-body"', '');
    $('tt-ghosts').appendChild(g); ghosts.push(g);
  }
  /* dust + debris at the landing point */
  const RD = rng(475);
  for (let i = 0; i < 34; i++) {
    const d = document.createElement('div'); d.className = 'dust'; $('tt-dustwrap').appendChild(d);
    const x0 = XL + (RD() - 0.5) * 120, dx = (RD() - 0.25) * 420, dy = -(30 + RD() * 150), s = 0.8 + RD() * 2.2, dur = 1.6 + RD() * 1.8;
    tl.set(d, { x: x0, y: 796, scale: 0.3, autoAlpha: 0.75 + RD() * 0.25 }, 7.35);
    tl.to(d, { x: x0 + dx, y: 796 + dy, scale: s, duration: dur, ease: 'power3.out' }, 7.35);
    tl.to(d, { autoAlpha: 0, duration: dur * 0.8, ease: 'power1.in' }, 7.35 + dur * 0.35);
  }
  for (let i = 0; i < 14; i++) {
    const c = document.createElement('div'); c.className = 'chip'; $('tt-dustwrap').appendChild(c);
    const dx = (RD() - 0.3) * 360, up = 60 + RD() * 150, dur = 0.55 + RD() * 0.45;
    tl.set(c, { x: XL + (RD() - 0.5) * 60, y: 792, autoAlpha: 1, rotation: 0 }, 7.35);
    tl.to(c, { x: '+=' + dx, rotation: (RD() - 0.5) * 900, duration: dur, ease: 'none' }, 7.35);
    tl.to(c, { y: 792 - up, duration: dur * 0.45, ease: 'power2.out' }, 7.35);
    tl.to(c, { y: 798, duration: dur * 0.55, ease: 'power2.in' }, 7.35 + dur * 0.45);
    tl.to(c, { autoAlpha: 0, duration: 0.6 }, 7.35 + dur + 0.6);
  }
  /* film grain: 6 seeded tiles, cycled at 24 fps */
  const gctx = $('tt-grain').getContext('2d');
  const tiles = [];
  const RG = rng(99);
  for (let k = 0; k < 6; k++) {
    const im = gctx.createImageData(960, 540), a = im.data;
    for (let p = 0; p < a.length; p += 4) { const v = 128 + (RG() + RG() - 1) * 120; a[p] = a[p + 1] = a[p + 2] = v; a[p + 3] = 255; }
    tiles.push(im);
  }
  let lastTile = -1;

  /* ---------- initial states ---------- */
  tl.set(['#tt-hdr', '#tt-p33', '#tt-p72', '#tt-cnt', '#tt-credit', '#tt-note'], { autoAlpha: 0 }, 0);
  tl.set('#tt-cntsub', { autoAlpha: 0 }, 0);
  tl.set(['#tt-ruler', '#tt-ticks', '#tt-thr', '#tt-lead', '#tt-fieldpath'], { drawSVG: '0%' }, 0);
  tl.set('#tt-tlabs', { autoAlpha: 0 }, 0);
  tl.set(['#tt-b1', '#tt-b2', '#tt-b3'], { scaleX: 0, transformOrigin: '0% 50%' }, 0);
  tl.set(['#tt-bl1', '#tt-bl2', '#tt-bl3'], { autoAlpha: 0 }, 0);
  tl.set('#tt-land', { scaleY: 0, transformOrigin: '50% 0%' }, 0);
  tl.set('#tt-wash', { scaleX: 0, transformOrigin: '0% 50%' }, 0);
  const split = new SplitText('#tt-pay', { type: 'words' });
  tl.set('#tt-pay', { autoAlpha: 1 }, 0);
  tl.set(split.words, { autoAlpha: 0, y: 46, rotationX: -70, transformOrigin: '50% 100%' }, 0);

  /* ---------- master clock: guarantees render() covers 0..14 ---------- */
  tl.to({}, { duration: 14 }, 0);

  /* ---------- SETUP 0-2.5: storm, train rocking, slow push ---------- */
  tl.to(cam, { fx: 360, fy: 700, z: 2.18, duration: 5.4, ease: 'sine.inOut' }, 0);
  tl.fromTo('#tt-hdr', { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 0.25);
  tl.fromTo(['#tt-credit', '#tt-note'], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.6, stagger: 0.1 }, 0.9);
  ['#tt-car0', '#tt-car1', '#tt-car2', '#tt-car3'].forEach((c, i) => {
    tl.to(c, { rotation: 2.2 + i * 0.4, duration: 0.3 + i * 0.04, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.1 + i * 0.07);
  });
  tl.to(tk, { r: 2.5, duration: 0.33, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.15);
  /* lightning on the derail */
  tl.fromTo('#tt-flash', { opacity: 0 }, { opacity: 1, duration: 0.05, ease: 'none', yoyo: true, repeat: 3 }, 2.2);
  tl.to('#tt-flash', { opacity: 0, duration: 0.3 }, 2.4);

  /* 2.37 "Thirty-three cars came off the tracks" */
  tl.to('#tt-car0', { rotation: -28, x: -26, y: 10, duration: 0.45, ease: 'power3.out' }, 2.37);
  tl.to('#tt-car1', { rotation: 22, x: 20, y: 6, duration: 0.45, ease: 'power3.out' }, 2.43);
  tl.to('#tt-car2', { rotation: -17, x: -10, y: 4, duration: 0.45, ease: 'power3.out' }, 2.5);
  tl.to('#tt-car3', { rotation: 31, x: 24, y: 12, duration: 0.45, ease: 'power3.out' }, 2.56);
  tl.to(tk, { r: -7, duration: 0.4, ease: 'power3.out' }, 2.6);
  tl.to(sh, { keyframes: [{ x: 7, y: -5, r: 0.25 }, { x: -6, y: 4, r: -0.2 }, { x: 3, y: -2, r: 0.1 }, { x: 0, y: 0, r: 0 }], duration: 0.4, ease: 'none' }, 2.37);
  tl.fromTo('#tt-p33', { autoAlpha: 0, scale: 1.9 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'slam' }, 2.37);
  tl.to('#tt-p33', { autoAlpha: 0, y: -30, duration: 0.3, ease: 'power2.in' }, 3.7);

  /* 3.9 "One empty tanker car" : leader line draws, body turns red */
  tl.to('#tk-body', { attr: { stroke: '#ff3b44' }, duration: 0.3 }, 3.9);
  tl.fromTo('#tk-pos', { '--g': 0 }, { '--g': 1, duration: 0.3 }, 3.9);
  tl.set('#tt-leaddot', { opacity: 1 }, 3.9);
  tl.to('#tt-lead', { drawSVG: '100%', duration: 0.45, ease: 'power2.inOut' }, 3.92);
  tl.fromTo('#tt-leadtx', { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.35, ease: 'power3.out' }, 4.25);
  /* 4.75 "seventy-two thousand pounds" */
  tl.fromTo('#tt-p72', { autoAlpha: 0, scale: 1.9 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'slam' }, 4.75);
  tl.to('#tt-p72', { autoAlpha: 0, y: -30, duration: 0.3, ease: 'power2.in' }, 5.45);
  tl.to('#tt-hdr', { autoAlpha: 0, y: -30, duration: 0.4, ease: 'power2.in' }, 5.3);
  tl.to(['#tt-lead', '#tt-leadtx', '#tt-leaddot'], { opacity: 0, duration: 0.25 }, 5.35);
  /* wind grabs it: lift + tilt (anticipation) */
  tl.to(tk, { lift: -10, r: -12, duration: 0.3, ease: 'power2.out' }, 5.38);
  tl.to('#tk-sq', { scaleY: 0.9, scaleX: 1.05, duration: 0.18, ease: 'power2.in' }, 5.52);
  tl.to('#tk-sq', { scaleY: 1.06, scaleX: 0.96, duration: 0.14, ease: 'power2.out' }, 5.7);
  tl.to('#tk-sq', { scaleY: 1, scaleX: 1, duration: 0.4, ease: 'sine.out' }, 5.84);

  /* ---------- THROW 5.7-7.35: flight, counter, camera pulls out and tracks ---------- */
  tl.to(cam, { fx: 1010, fy: 560, z: 1.0, duration: 1.7, ease: 'power2.out' }, 5.6);
  tl.to(fly, { u: 1, duration: 1.65, ease: 'drag' }, 5.7);
  tl.to(tk, { lift: 0, duration: 0.3 }, 5.7);
  tl.to('#tt-mbb', { attr: { stdDeviation: '9 2' }, duration: 0.2, ease: 'power2.out' }, 5.7);
  tl.to('#tt-mbb', { attr: { stdDeviation: '2 0.5' }, duration: 0.6, ease: 'sine.inOut' }, 6.2);
  tl.to('#tt-mbb', { attr: { stdDeviation: '5 1' }, duration: 0.4, ease: 'power2.in' }, 6.85);
  tl.to('#tt-mbb', { attr: { stdDeviation: '0 0' }, duration: 0.12 }, 7.35);
  tl.fromTo('#tt-cnt', { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 5.75);

  /* ---------- LANDING 7.35: squash, shake, dust, ring ---------- */
  tl.to('#tk-sq', { scaleY: 0.72, scaleX: 1.16, duration: 0.07, ease: 'power2.out' }, 7.35);
  tl.to('#tk-sq', { scaleY: 1, scaleX: 1, duration: 0.7, ease: 'elastic.out(1.1,0.35)' }, 7.42);
  tl.to(tk, { set: 1, duration: 0.6, ease: 'back.out(3)' }, 7.35);
  const RS = rng(7);
  const kf = [];
  for (let i = 0; i < 9; i++) { const a = 24 * Math.pow(0.7, i); kf.push({ x: (RS() - 0.5) * 2 * a, y: (RS() - 0.5) * 2 * a, r: (RS() - 0.5) * a * 0.05 }); }
  kf.push({ x: 0, y: 0, r: 0 });
  tl.to(sh, { keyframes: kf, duration: 0.6, ease: 'none' }, 7.35);
  tl.set('#tt-ring', { opacity: 0.9, attr: { rx: 20, ry: 3 } }, 7.35); tl.to('#tt-ring', { opacity: 0, attr: { rx: 260, ry: 22 }, duration: 0.9, ease: 'power2.out' }, 7.35);
  tl.set('#tt-cnt', { scale: 1.18 }, 7.35); tl.to('#tt-cnt', { scale: 1, duration: 0.5, ease: 'elastic.out(1,0.4)' }, 7.35);
  tl.fromTo('#tt-cntsub', { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35 }, 7.45);
  tl.to('#tt-land', { scaleY: 1, duration: 0.4, ease: 'power3.out' }, 7.5);

  /* ---------- MEASURE 7.6-11: ruler, football field, threshold, wash, bands ---------- */
  tl.to(cam, { fx: 1070, fy: 592, z: 1.045, duration: 5.7, ease: 'sine.inOut' }, 7.6);
  tl.to('#tt-ruler', { drawSVG: '100%', duration: 0.7, ease: 'power2.inOut' }, 7.6);
  tl.to('#tt-ticks', { drawSVG: '100%', duration: 0.7, ease: 'power2.inOut' }, 7.7);
  tl.fromTo('#tt-tlabs', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4 }, 8.0);
  tl.set('#tt-field', { opacity: 1 }, 8.2);
  tl.to('#tt-fieldpath', { drawSVG: '100%', duration: 0.5, ease: 'power2.out' }, 8.2);
  tl.fromTo('#tt-field rect', { scaleX: 0, transformOrigin: '0% 50%' }, { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 8.2);
  tl.fromTo('#tt-field text', { opacity: 0 }, { opacity: 1, duration: 0.35 }, 8.45);
  tl.to('#tt-field', { opacity: 0.28, duration: 0.4 }, 9.45);
  tl.to('#tt-tor-g', { attr: { opacity: 0.22 }, duration: 1.6, ease: 'sine.inOut' }, 7.6);
  tl.to('#tt-cnt', { scale: 0.62, y: -58, duration: 0.6, ease: 'power3.inOut', transformOrigin: '50% 0%' }, 9.1);
  tl.to('#tt-cntsub', { autoAlpha: 0, duration: 0.25 }, 9.1);
  tl.to('#tt-thr', { drawSVG: '100%', duration: 0.5, ease: 'power3.out' }, 9.3);
  tl.fromTo('#tt-thrlab', { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 9.45);
  tl.to('#tt-wash', { scaleX: 1, duration: 0.8, ease: 'power3.out' }, 9.9);
  tl.fromTo('#tt-washlab', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 10.05);
  tl.to('#tt-b1', { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 10.4);
  tl.to('#tt-b2', { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 10.58);
  tl.to('#tt-b3', { scaleX: 1, duration: 0.3, ease: 'power2.out' }, 10.76);
  tl.fromTo('#tt-bl1', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.25 }, 10.5);
  tl.fromTo('#tt-bl2', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.25 }, 10.68);
  tl.fromTo('#tt-bl3', { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.25 }, 10.86);
  tl.to('#tt-washlab', { opacity: 0, duration: 0.3 }, 10.9);

  /* ---------- PAYOFF 11.0-13.3: word by word, settled by 12.0 ---------- */
  tl.to(split.words, { autoAlpha: 1, y: 0, rotationX: 0, duration: 0.5, stagger: 0.12, ease: 'back.out(1.6)' }, 11.0);
  tl.fromTo('#tt-land', { stroke: '#eef2f6' }, { stroke: '#ff3b44', duration: 0.3 }, 11.2);

  /* ---------- EXIT 13.3-14 ---------- */
  tl.to(['#tt-pay', '#tt-cnt'], { y: '-=60', autoAlpha: 0, duration: 0.45, ease: 'power3.in', stagger: 0.05 }, 13.3);
  tl.to(['#tt-credit', '#tt-note'], { y: 30, autoAlpha: 0, duration: 0.4, ease: 'power3.in' }, 13.35);
  tl.to(cam, { fx: 1500, fy: 700, z: 1.5, duration: 0.7, ease: 'power3.in' }, 13.3);
  tl.to('#tt-black', { opacity: 1, duration: 0.5, ease: 'power2.in' }, 13.48);

  /* ---------- per-frame render (after all children rendered) ---------- */
  const layers = [[$('w-bg'), 0.4], [$('w-world'), 1], [$('w-fg'), 1.4]];
  const tkEl = $('tk-pos'), tkRot = $('tk-rot'), clip = $('tt-cliprect'), cntv = $('tt-cntv'), shake = $('tt-shake');
  function pose(u) { return { x: X0 + (XL - X0) * u, y: YC - 4 * H * u * (1 - u) }; }
  function render() {
    const t = tl.time();
    const dx = 4 * Math.sin(0.9 * t) + 2.2 * Math.sin(2.3 * t + 1.2), dy = 3 * Math.sin(1.1 * t + 0.5) + 1.6 * Math.sin(2.9 * t + 2.1);
    for (const [el, p] of layers) {
      const z = 1 + (cam.z - 1) * p, fx = 960 + (cam.fx - 960) * p, fy = 540 + (cam.fy - 540) * p;
      el.style.transform = 'translate(' + (960 - fx * z + dx * p) + 'px,' + (540 - fy * z + dy * p) + 'px) scale(' + z + ')';
    }
    shake.style.transform = 'translate(' + sh.x + 'px,' + sh.y + 'px) rotate(' + (sh.r + 0.15 * Math.sin(0.7 * t)) + 'deg)';
    /* tanker */
    const u = fly.u, P = pose(u);
    const rot = tk.r + 352 * u + 10 * tk.set;
    tkEl.style.transform = 'translate(' + (P.x - 75) + 'px,' + (P.y - 39 + tk.lift) + 'px)';
    tkRot.style.transform = 'rotate(' + rot + 'deg)';
    const glow = parseFloat(gsap.getProperty(tkEl, "--g")) || 0;
    tkRot.style.filter = glow ? 'drop-shadow(0 0 ' + (16 * glow) + 'px rgba(255,59,68,' + (0.85 * glow) + '))' : 'none';
    clip.setAttribute('width', String(P.x));
    ghosts.forEach((g, i) => {
      const ug = Math.max(0, u - 0.028 * (i + 1)), Q = pose(ug);
      const on = u > 0.02 && u < 0.985 ? 1 : 0;
      g.style.opacity = String(on * (0.3 - i * 0.09));
      g.style.transform = 'translate(' + (Q.x - 75) + 'px,' + (Q.y - 39) + 'px) rotate(' + (tk.r + 352 * ug) + 'deg)';
    });
    cntv.textContent = u >= 1 ? '475.7 ft' : Math.floor(475.7 * u) + ' ft';
    /* storm life */
    for (const r of rain) {
      const yy = ((r.y + t * r.v) % 1240) - 70, xx = ((r.x + t * r.v * 0.36) % 2200) - 140;
      r.el.style.transform = 'translate(' + xx + 'px,' + yy + 'px) rotate(-19.8deg)';
      r.el.style.opacity = r.o;
    }
    const tx = 40 * t;
    $('tt-tor-g').setAttribute('transform', 'translate(' + tx + ',0)');
    const stri = $('tt-stri').children;
    for (let i = 0; i < stri.length; i++) stri[i].setAttribute('transform', 'translate(' + (18 * Math.sin(t * 5.5 + i * 1.3)) + ',0)');
    for (const s of swirl) {
      const a = s.a + t * s.w, x = 535 + tx + Math.cos(a) * s.rx * (0.45 + s.h / 1400), y = s.h + Math.sin(a) * 14;
      s.el.setAttribute('x', x); s.el.setAttribute('y', y); s.el.setAttribute('opacity', Math.sin(a) > 0 ? 0.9 : 0.35);
    }
    const f = Math.floor(t * 24) % 6;
    if (f !== lastTile) { gctx.putImageData(tiles[f], 0, 0); lastTile = f; }
  }
  tl.eventCallback('onUpdate', render);
  render();

  window.__timelines['g-tanker-throw'] = tl;
})();
</script>
</template>
