<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-slope (PATH A, full-fidelity first pass) — A3-S1 payoff: the underwater slope the flank fell from was 27°; after the collapse it is 16°.
     Cues (A3-S1, ~30 s): "gentler" @0.4 · "twenty seven" @4.2 · "sixteen" @6.4 · "lower, wider ramp" @9.8 · "different ground" @15.5 · "that single number" @20.5 · exit @29.4 -->
<template>
<style>
  #root { position:absolute; inset:0; font-family: Arial, sans-serif; color:#f2f5f8; overflow:hidden; }
  .stage { position:absolute; left:0; top:0; width:1180px; height:1080px; }
  .panel { position:absolute; right:0; top:0; bottom:0; width:740px; padding:96px 70px 0 120px; box-sizing:border-box;
    background:linear-gradient(270deg, rgba(6,9,13,0.94) 72%, rgba(6,9,13,0)); }
  .eye { font-weight:700; font-size:22px; letter-spacing:6px; color:#93a3b2; }
  .head { font-family:'Arial Black', Arial, sans-serif; font-size:52px; line-height:1.05; margin-top:18px; }
  .sub { font-family:Georgia, serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:14px; }
  .row { display:flex; align-items:baseline; gap:18px; margin-top:34px; }
  .row .v { font-family:'Arial Black', Arial, sans-serif; font-size:84px; line-height:1; }
  .row .v.before { color:#7fb2e5; } .row .v.after { color:#e74c3c; }
  .row .l { font-weight:700; font-size:19px; letter-spacing:4px; color:#93a3b2; }
  .row .m { font-weight:700; font-size:30px; color:#dfe7ee; letter-spacing:1px; }
  .note { margin-top:40px; font-size:26px; color:#dfe7ee; line-height:1.35; }
  .note b { color:#e8c56a; }
  .lab { position:absolute; font-weight:700; font-size:22px; letter-spacing:3px; color:#93a3b2; }
</style>
<div id="root" data-composition-id="g-slope-a" data-width="1920" data-height="1080">
  <div class="stage">
    <svg id="slp-svg" viewBox="0 0 1180 1080" width="1180" height="1080">
      <defs>
        <linearGradient id="slp-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d3b57" stop-opacity="0.85"/><stop offset="1" stop-color="#07131f" stop-opacity="0.95"/></linearGradient>
        <linearGradient id="slp-rock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b4a3f"/><stop offset="1" stop-color="#2a221d"/></linearGradient>
      </defs>
      <!-- sea body -->
      <rect x="0" y="420" width="1180" height="660" fill="url(#slp-sea)"/>
      <!-- sea surface, drifting continuously -->
      <path id="slp-wave" d="M-200 420 q60 -10 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" fill="none" stroke="#7fb2e5" stroke-width="3" opacity="0.9"/>
      <!-- caldera floor -->
      <path d="M0 980 L1180 980" stroke="#3a4b5c" stroke-width="2" stroke-dasharray="8 8"/>
      <!-- BEFORE profile: tall cone (338 m) with the steep 27° SW flank going under water to the floor -->
      <path id="slp-before" d="M1180 420 L1180 980 L600 980 L700 560 L780 300 L860 260 L960 420 Z" fill="url(#slp-rock)" opacity="0.95"/>
      <!-- 27° angle guide -->
      <path id="slp-a27" d="M600 980 L700 560" stroke="#7fb2e5" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>
      <!-- the block that falls -->
      <path id="slp-block" d="M700 560 L780 300 L860 260 L880 340 L760 640 Z" fill="#8e2020" opacity="0"/>
      <!-- AFTER profile: shorter cone (110 m) with a gentler 16° ramp -->
      <path id="slp-after" d="M1180 420 L1180 980 L380 980 L820 400 L880 340 L960 420 Z" fill="url(#slp-rock)" opacity="0"/>
      <path id="slp-a16" d="M380 980 L820 400" stroke="#e74c3c" stroke-width="4" stroke-dasharray="10 8" opacity="0"/>
      <!-- fallen debris pile on the floor -->
      <path id="slp-debris" d="M260 980 L330 940 L410 950 L470 920 L540 960 L600 980 Z" fill="#8e2020" opacity="0"/>
      <!-- height ticks -->
      <line id="slp-h338" x1="1010" y1="260" x2="1010" y2="420" stroke="#d8a13a" stroke-width="3" opacity="0"/>
      <line id="slp-h110" x1="1010" y1="340" x2="1010" y2="420" stroke="#d8a13a" stroke-width="3" opacity="0"/>
    </svg>
    <div class="lab" id="slp-labsea" style="left:40px; top:380px;">SEA LEVEL</div>
    <div class="lab" id="slp-lab27" style="left:560px; top:760px; color:#7fb2e5; opacity:0;">27°</div>
    <div class="lab" id="slp-lab16" style="left:520px; top:640px; color:#e74c3c; opacity:0;">16°</div>
    <div class="lab" id="slp-lab338" style="left:1030px; top:300px; color:#d8a13a; opacity:0;">338 M</div>
    <div class="lab" id="slp-lab110" style="left:1030px; top:350px; color:#d8a13a; opacity:0;">110 M</div>
    <div class="lab" id="slp-labfloor" style="left:40px; top:990px;">CALDERA FLOOR</div>
  </div>
  <div class="panel" id="slp-panel">
    <div class="eye">THE SLOPE IT FELL FROM</div>
    <div class="head" id="slp-head">It was gentler.</div>
    <div class="sub">the fall took the steep face and left a ramp</div>
    <div class="row" id="slp-r1"><div class="v before">27°</div><div><div class="l">BEFORE</div><div class="m">steep, overloaded</div></div></div>
    <div class="row" id="slp-r2"><div class="v after">16°</div><div><div class="l">AFTER</div><div class="m">lower, wider ramp</div></div></div>
    <div class="note" id="slp-note">The island growing back today is growing on <b>different ground</b> than the one that fell.</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const P = "#slp-";
  tl.set([P+"r1", P+"r2", P+"note"], { autoAlpha: 0 }, 0);
  /* continuous: sea surface drift for the whole window */
  tl.fromTo(P+"wave", { x: 0 }, { x: -240, duration: 30, ease: "none" }, 0);
  /* panel in */
  tl.fromTo(P+"panel", { x: 660, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0);
  tl.fromTo(P+"head", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5 }, 0.4);      /* "gentler" */
  /* before: 338 m tick + 27° guide */
  tl.to([P+"h338", P+"lab338"], { opacity: 1, duration: 0.4 }, 2.0);
  tl.to([P+"a27", P+"lab27"], { opacity: 1, duration: 0.4 }, 4.0);                              /* "twenty seven" */
  tl.fromTo(P+"r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4 }, 4.2);
  /* the block detaches and slides down the 27° face into the basin */
  tl.to(P+"block", { opacity: 1, duration: 0.3 }, 5.2);
  tl.to(P+"block", { x: -420, y: 400, rotation: -18, transformOrigin: "50% 50%", duration: 1.2, ease: "power2.in" }, 5.6);
  tl.to(P+"before", { opacity: 0, duration: 0.6 }, 6.0);
  tl.to(P+"after", { opacity: 0.95, duration: 0.6 }, 6.0);
  tl.to(P+"block", { opacity: 0, duration: 0.3 }, 6.7);
  tl.to(P+"debris", { opacity: 1, duration: 0.5 }, 6.7);
  tl.to([P+"h338", P+"lab338", P+"a27", P+"lab27"], { opacity: 0.35, duration: 0.5 }, 6.4);
  tl.to([P+"a16", P+"lab16"], { opacity: 1, duration: 0.4 }, 6.6);                              /* "sixteen" */
  tl.to([P+"h110", P+"lab110"], { opacity: 1, duration: 0.4 }, 7.2);
  tl.fromTo(P+"r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4 }, 6.6);
  /* ramp emphasis pulse on "lower, wider ramp" */
  tl.fromTo(P+"a16", { strokeWidth: 4 }, { strokeWidth: 9, duration: 0.6, yoyo: true, repeat: 1 }, 9.8);
  tl.fromTo(P+"note", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 15.5);   /* "different ground" */
  /* slow push on the stage so the diagram never idles */
  tl.fromTo(P+"svg", { scale: 1.0, transformOrigin: "60% 70%" }, { scale: 1.06, duration: 28, ease: "none" }, 0);
  /* exit on the cut */
  tl.to(P+"panel", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 29.4);
  tl.to(".stage", { autoAlpha: 0, duration: 0.5 }, 29.5);
  window.__timelines["g-slope-a"] = tl;
})();
</script>
</template>
</body>
</html>
