<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  BREAKING-LANE TEMPLATE: stat-card.html
  WHAT IT IS: left-side glass list card (up to 4 numbered rows) that reveals one row per spoken cue
  over track-1 footage. Used for checklists ("4 things to do") and NOT/YES splits. Lineage:
  inhouse/stat-panel.html (glass recipe) — narrower, left-anchored so the popfig zone (top 38%)
  and the bottom-left chip/bug stay clear.

  PARAMS (EDIT-ME): eyebrow, rows (n, label, sub), the four `at` reveal times (word-synced).
  EXIT: slide left (x:-900) + autoAlpha 0, 0.5 s, ~0.6 s before the host window ends.
  COPY into episodes/<slug>/compositions/ and re-prefix ids per instance.
-->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; }
  .card { position:absolute; left:110px; top:150px; width:860px; box-sizing:border-box; padding:34px 44px 30px;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#d0121f; }
  .row { display:flex; align-items:flex-start; gap:22px; margin-top:22px; overflow:hidden; }
  .n { flex:0 0 64px; font-family:'AbrilFig',Georgia,serif; font-size:64px; line-height:1; color:#d0121f; text-shadow:0 3px 14px rgba(0,0,0,0.8); }
  .lab { font-family:'Arial Black',Arial,sans-serif; font-size:36px; line-height:1.1; }
  .sub { font-size:22px; color:#c8d3e0; margin-top:6px; line-height:1.3; }
</style>
<div id="root" data-composition-id="chain" data-width="1920" data-height="1080">
  <div class="card" id="chain-card">
    <div class="eye" id="chain-eye">WHAT A SIREN LISTENS FOR</div>
    <div class="row" id="chain-r1"><div class="n">1</div><div><div class="lab">THE GROUND SHAKES</div><div class="sub">every warning starts with an earthquake</div></div></div>
    <div class="row" id="chain-r2"><div class="n">2</div><div><div class="lab">THE COMPUTER</div><div class="sub">matches it to a library of pre-run scenarios</div></div></div>
    <div class="row" id="chain-r3"><div class="n">3</div><div><div class="lab">55 SIRENS · SMS · TV</div><div class="sub">if the sea floor moved enough</div></div></div>
    <div class="row" id="chain-r4"><div class="n">4</div><div><div class="lab">UNDER 5 MINUTES</div><div class="sub">Indonesia can do it, and has</div></div></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#chain-";
  tl.set([P+"r1",P+"r2",P+"r3",P+"r4"], {autoAlpha:0, height:0, marginTop:0}, 0);
  tl.fromTo(P+"card", {x:-900, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.6, ease:"power3.out"}, 0);
  /* EDIT-ME: re-anchor each `at` to words.json */
  tl.fromTo(P+"r1", {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:22, duration:0.4}, 1.7);
  tl.fromTo(P+"r2", {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:22, duration:0.4}, 7.46);
  tl.fromTo(P+"r3", {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:22, duration:0.4}, 12.28);
  tl.fromTo(P+"r4", {autoAlpha:0, y:24, height:0, marginTop:0}, {autoAlpha:1, y:0, height:"auto", marginTop:22, duration:0.4}, 20.48);
  tl.to(P+"card", {x:-900, autoAlpha:0, duration:0.5, ease:"power3.in"}, 24.58); /* EDIT-ME: host end − 0.6 */
  tl.fromTo(P+"card", {y:0}, {y:-6, duration:1.4, ease:"sine.inOut", yoyo:true, repeat:16}, 0.6); /* breathing so the card never idles */
  tl.to(P+"eye", {letterSpacing:"8px", duration:1.2, ease:"power3.out"}, 0.2);
  window.__timelines["chain"] = tl;
})();
</script>
</template>
</body>
</html>
