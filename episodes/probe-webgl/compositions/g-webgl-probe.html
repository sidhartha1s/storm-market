<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #wp-stage { position:absolute; inset:0; overflow:hidden; background:#0d141d; }
  #wp-canvas { position:absolute; left:0; top:0; width:1920px; height:1080px; display:block; }
  #wp-title { position:absolute; left:96px; top:76px; font-family:Arial,sans-serif; font-weight:700; font-size:22px; letter-spacing:6px; color:#c8d3e0; }
  #wp-sub { position:absolute; left:96px; top:112px; font-family:Georgia,serif; font-style:italic; font-size:30px; color:#d8a13a; }
  #wp-label { position:absolute; left:1180px; top:830px; width:360px; font-family:'Courier New',monospace; font-weight:700; font-size:56px; color:#ffffff; text-align:right; }
  .wp-bit { position:absolute; top:930px; width:26px; height:40px; background:#000; }
</style>
<div id="root" data-composition-id="g-webgl-probe" data-width="1920" data-height="1080" data-duration="10">
  <div id="wp-stage">
    <canvas id="wp-canvas" width="1920" height="1080"></canvas>
    <div id="wp-title">WEBGL PROBE &middot; INSTANCED FIELD</div>
    <div id="wp-sub">Seeded, time-driven, no animation loop</div>
    <div id="wp-label">FRAME 000</div>
    <div class="wp-bit" id="wp-bit0" style="left:1250px"></div>
    <div class="wp-bit" id="wp-bit1" style="left:1282px"></div>
    <div class="wp-bit" id="wp-bit2" style="left:1314px"></div>
    <div class="wp-bit" id="wp-bit3" style="left:1346px"></div>
    <div class="wp-bit" id="wp-bit4" style="left:1378px"></div>
    <div class="wp-bit" id="wp-bit5" style="left:1410px"></div>
    <div class="wp-bit" id="wp-bit6" style="left:1442px"></div>
    <div class="wp-bit" id="wp-bit7" style="left:1474px"></div>
    <div class="wp-bit" id="wp-bit8" style="left:1506px"></div>
  </div>
</div>
<!-- three r170 ESM rewrapped as a classic IIFE (window.THREE): hyperframes 0.8.41 runs
     sub-composition scripts as classic scripts, so `import` there throws. -->
<script src="../vendor/three.classic.js"></script>
<script>
(function () {
const THREE = window.THREE;
const ID = "g-webgl-probe";
const FPS = 30, DUR = 10, W = 1920, H = 1080;
const BG_A = new THREE.Color(0x1a2433);   // storm slate, t < 5
const BG_B = new THREE.Color(0x3a1c12);   // ember, t >= 5

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1974);

const canvas = document.getElementById("wp-canvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 400);

// ---- instanced field: 500 pillars, heights pulse with uTime ----
const COUNT = 500;
const fieldU = { uTime: { value: 0 }, uFog: { value: BG_A.clone() } };
const geo = new THREE.BoxGeometry(1, 1, 1);
geo.translate(0, 0.5, 0);
const fieldMat = new THREE.ShaderMaterial({
  uniforms: fieldU,
  vertexShader: `
    uniform float uTime;
    varying vec3 vN; varying float vH; varying float vDepth; varying float vTop;
    void main() {
      vec3 base = (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
      float d = length(base.xz);
      float wave = 0.55 + 0.45 * sin(uTime * 1.6 - d * 0.32);
      vec3 p = position;
      p.y *= wave;
      vec4 wp = modelMatrix * instanceMatrix * vec4(p, 1.0);
      vN = normalize(mat3(modelMatrix * instanceMatrix) * normal);
      vH = wp.y; vTop = position.y;
      vec4 mv = viewMatrix * wp;
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uFog;
    varying vec3 vN; varying float vH; varying float vDepth; varying float vTop;
    void main() {
      vec3 L = normalize(vec3(-0.4, 0.8, 0.35));
      float diff = max(dot(normalize(vN), L), 0.0);
      vec3 low = vec3(0.10, 0.16, 0.22), high = vec3(0.55, 0.78, 0.95);
      vec3 col = mix(low, high, clamp(vH / 7.0, 0.0, 1.0));
      col *= 0.35 + 0.85 * diff;
      col += vec3(0.9, 0.6, 0.25) * smoothstep(0.96, 1.0, vTop) * (0.25 + 0.25 * sin(uTime * 3.0 + vH));
      float fog = smoothstep(18.0, 70.0, vDepth);
      gl_FragColor = vec4(mix(col, uFog, fog), 1.0);
    }`,
});
const field = new THREE.InstancedMesh(geo, fieldMat, COUNT);
const m = new THREE.Matrix4();
for (let i = 0; i < COUNT; i++) {
  const r = 26 * Math.sqrt(rand()), a = rand() * Math.PI * 2;
  const s = 0.9 + rand() * 0.9, h = 1.5 + rand() * rand() * 7.5;
  m.makeScale(s, h, s);
  m.setPosition(Math.cos(a) * r, 0, Math.sin(a) * r);
  field.setMatrixAt(i, m);
}
scene.add(field);

// ---- ground with a rotating radar sweep ----
const groundU = { uTime: { value: 0 }, uFog: { value: BG_A.clone() } };
const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160), new THREE.ShaderMaterial({
  uniforms: groundU,
  vertexShader: `
    varying vec2 vXZ; varying float vDepth;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vXZ = wp.xz;
      vec4 mv = viewMatrix * wp; vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform float uTime; uniform vec3 uFog;
    varying vec2 vXZ; varying float vDepth;
    void main() {
      float r = length(vXZ);
      float ang = atan(vXZ.y, vXZ.x);
      float sweep = mod(ang - uTime * 0.9, 6.28318);
      float trail = exp(-sweep * 2.2) * smoothstep(30.0, 4.0, r);
      float rings = smoothstep(0.08, 0.0, abs(fract(r / 4.0) - 0.5) - 0.44);
      vec3 col = vec3(0.03, 0.05, 0.07) + vec3(0.12, 0.55, 0.35) * trail + vec3(0.05, 0.09, 0.12) * rings;
      float fog = smoothstep(18.0, 70.0, vDepth);
      gl_FragColor = vec4(mix(col, uFog, fog), 1.0);
    }`,
}));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// ---- HUD pass: frame quad, r = frame % 256 (top), 9-bit frame barcode (bottom) ----
const hud = new THREE.Scene();
const ortho = new THREE.OrthographicCamera(0, W, H, 0, -1, 1);
const quadU = { uF: { value: 0 } };
const quad = new THREE.Mesh(new THREE.PlaneGeometry(240, 160), new THREE.ShaderMaterial({
  uniforms: quadU,
  depthTest: false,
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uF; varying vec2 vUv;
    void main() {
      if (vUv.y > 0.35) { gl_FragColor = vec4(mod(uF, 256.0) / 255.0, 0.0, 0.0, 1.0); return; }
      float i = floor(vUv.x * 9.0);
      float bit = mod(floor(uF / exp2(8.0 - i)), 2.0);
      gl_FragColor = vec4(vec3(bit), 1.0);
    }`,
}));
// screen rect x 1580..1820, y 820..980 (top-left origin); ortho is y-up
quad.position.set(1700, H - 900, 0);
hud.add(quad);

const label = document.getElementById("wp-label");
const bits = Array.from({ length: 9 }, (_, i) => document.getElementById("wp-bit" + i));

function render(t) {
  const frame = Math.round(t * FPS);
  const bg = t >= 5.0 ? BG_B : BG_A;
  scene.background = bg;
  fieldU.uFog.value.copy(bg); groundU.uFog.value.copy(bg);
  fieldU.uTime.value = t; groundU.uTime.value = t;
  const ang = 0.6 + t * 0.14;
  camera.position.set(Math.cos(ang) * 38, 15 + 2 * Math.sin(t * 0.5), Math.sin(ang) * 38);
  camera.lookAt(0, 2, 0);
  quadU.uF.value = frame;
  label.textContent = "FRAME " + String(frame).padStart(3, "0");
  for (let i = 0; i < 9; i++) bits[i].style.background = (frame >> (8 - i)) & 1 ? "#ffffff" : "#000000";
  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false;
  renderer.clearDepth();
  renderer.render(hud, ortho);
}

window.__timelines = window.__timelines || {};
const tl = gsap.timeline({ paused: true });
tl.to({}, { duration: DUR }, 0);
tl.eventCallback("onUpdate", () => render(tl.time()));
window.__timelines[ID] = tl;
render(0);
})();
</script>
</template>
</body>
</html>
