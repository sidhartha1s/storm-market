<script>
window.__timelines = window.__timelines || {};
(function() {
/* ---- computed table ----
   T5/T6 1974 (dim #7a3030, no dash animation -- drawn complete from t=0, this comp opens already deep into
   the story): same points as g-map-a4 (T6 already carries its -8.5,-8.5 NW visibility offset for consistency
   with that file, satisfying "the second lies west of the first" everywhere it is drawn).
   T-2011 EF5: explicit lat/lon -> px: Hackleburg (34.28,-87.83) 360.3,741.1; Phil Campbell (34.35,-87.71)
     368.0,735.5; then Tanner 415.4,705.0; Harvest 429.7,695.2 (towns_geo). Passes through Tanner as required.
   Limestone County ring: explicit (34.81,-86.98) -> 414.8,698.7.
   Zoom: same ep6 camAt as g-map-a4, scale 2.2 on Tanner (415.4,705.0), screen anchor (560,560):
     x=-353.88, y=-991.00 -- set static from t=0 (brief: "map at 2.2x on Tanner from 0").
   QC fix (2026-09-21): screen anchor y raised 120px (560->440), same as g-map-a4, so the tracks/ring clear
     the bottom frame edge -- y=-1111.00. x unchanged.
   Host = a6-s1 only, duration 49.072s (audio/manifest.json, real).
   CUES (from a6-s1.words.json, all real):
     april: "April"@3.72        limestone: "Limestone"@19.44        matched: "matched"@43.86
*/
  const tl = gsap.timeline({ paused: true });
  const P = "#g-map-a6-";

  // Root-cause fix (QC 2026-09-21): headline text length varies (1-3 lines at 52px Arial Black in a
  // 540px column) but the sub-line/row/ticker below it was pinned to a fixed CSS top, so a 2-line
  // headline pushed its own second line under the next element. Measure the actual rendered box of the
  // element ABOVE and place the element BELOW it there, instead of guessing a fixed offset.
  function stackBelow(aboveSel, belowSel, gap) {
    const a = document.querySelector(aboveSel), b = document.querySelector(belowSel);
    const root = document.querySelector("#root");
    if (!a || !b || !root) return;
    const ar = a.getBoundingClientRect(), rr = root.getBoundingClientRect();
    b.style.top = (ar.bottom - rr.top + gap) + "px";
  }

  stackBelow("#g-map-a6-hl", "#g-map-a6-sb", 16);
  const CUES = { april: 3.72, limestone: 19.44, matched: 43.86 };
  const DUR = 49.072;

  tl.fromTo(P+"drift", { y: -60 }, { y: 60, duration: DUR, ease: "none" }, 0);
  tl.set(P+"mapgroup", { scale: 2.2, x: -353.88, y: -1111.00 }, 0);
  tl.to(P+"mapgroup", { scale: 2.26, duration: DUR, ease: "none" }, 0); // continuous element: slow creep-in

  // QC fix (2026-09-21): this comp is zoomed 2.2x on Tanner for its ENTIRE run (measured via
  // getBoundingClientRect: WV/VA land inside the eyebrow/headline rail box, AL/GA/MS/OH/MI push out of the
  // 1920x1080 frame). The headline already names Alabama, so the abbreviations are redundant -- hide them
  // for the whole comp instead of chasing a moving target.
  tl.set(P+"stlabels", { opacity: 0 }, 0);

  tl.fromTo(P+"eb", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
  tl.fromTo(P+"hl", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);

  // CUES.april: T-2011 draws in blue over 4s
  tl.set(P+"t2011", { opacity: 1 }, CUES.april);
  tl.fromTo(P+"t2011dot", { attr: { r: 0 } }, { attr: { r: 9 }, duration: 0.3, ease: "back.out(2)" }, CUES.april);
  tl.fromTo(P+"t2011", { attr: { "stroke-dashoffset": 83.2 } }, { attr: { "stroke-dashoffset": 0 }, duration: 4, ease: "none" }, CUES.april);

  // CUES.limestone: pulsing ring
  tl.fromTo(P+"limring", { attr: { r: 0 }, opacity: 0.9 }, { attr: { r: 44 }, opacity: 0.3, duration: 1.1, ease: "power2.out", repeat: 2, yoyo: true }, CUES.limestone);

  // CUES.matched: the two paths (1974 T6, 2011) flash alternately twice
  tl.fromTo(P+"sb", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, CUES.matched - 0.4);
  for (let i = 0; i < 2; i++) {
    const t0 = CUES.matched + i * 1.0;
    tl.to(P+"t6", { stroke: "#e74c3c", strokeWidth: 9, duration: 0.22, ease: "power2.out" }, t0);
    tl.to(P+"t6", { stroke: "#7a3030", strokeWidth: 6, duration: 0.3, ease: "power2.in" }, t0 + 0.25);
    tl.to(P+"t2011", { stroke: "#e8f2ff", strokeWidth: 9, duration: 0.22, ease: "power2.out" }, t0 + 0.5);
    tl.to(P+"t2011", { stroke: "#7fb2e5", strokeWidth: 6, duration: 0.3, ease: "power2.in" }, t0 + 0.75);
  }

  // exit
  tl.to([P+"hl", P+"sb"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, DUR - 0.6);

  window.__timelines["g-map-a6"] = tl;
})();
