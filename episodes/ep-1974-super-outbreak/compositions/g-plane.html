<script>
window.__timelines = window.__timelines || {};
(function() {
/* ---- computed table ----
   Desaturated base per brief: .st fill #0b1219 / stroke #26333f (overrides the shared base-map palette for
   this comp only); 127-dot field present and dim (opacity .30, muted per-rating colors), no interaction.
   Plane loop, 10 waypoints (9 legs), points and per-leg durations computed by summed Euclidean length /
   total length * DUR(28.163s), ease none (matches "sequence of to x/y tweens ... ease none"):
     wp0 Huffman(T1 start) 429.6,437.4 -> wp1 Xenia(T3 start) 602.8,312.4      leg0 3.60s  (end 3.60)
     wp1 -> wp2 Georgia(TG start) 538.7,723.5                                  leg1 7.02s  (end 10.62)
     wp2 -> wp3 Tanner 415.4,705.0                                             leg2 2.10s  (end 12.72)
     wp3 -> wp4 Guin(T7 start) 341.0,777.2                                     leg3 1.75s  (end 14.47)
     wp4 -> wp5 Decatur 414.2,717.6                                            leg4 1.59s  (end 16.06)
     wp5 -> wp6 Brandenburg(T2 start) 443.7,464.7                              leg5 4.29s  (end 20.35)
     wp6 -> wp7 Louisville(TL start) 493.7,427.0                               leg6 1.06s  (end 21.41)
     wp7 -> wp8 Monticello(TM start) 405.2,242.7                               leg7 3.45s  (end 24.85)
     wp8 -> wp9 Huffman (loop closes) 429.6,437.4                              leg8 3.31s  (end 28.16)
   Track reveal = plane's arrival at (or departure from) the nearest waypoint, so every stroke appears only
   after the plane has passed near it (must-be-true #3): T1@0.3 (plane starts there), T3@3.60, TG@10.62,
   T6@12.72 (Tanner-area pass, stands in for both Tanner tornadoes), T7@14.47, T2@20.35, TL@21.41, TM@24.85.
   Trail: one path through all 10 waypoints, length 1670.3px (sum of the 9 legs above), dasharray/dashoffset
   drawn 1:1 with elapsed time over the full 28.163s duration.
   Host = a5-s1 only, duration 28.163s (audio/manifest.json, real).
   CUES (from a5-s1.words.json, all real): ten@14.92  miles@17.12  hand@20.72  damage(2nd "damage")@25.82
   Date ticker: 11 steps (APR,MAY,JUN,JUL,AUG,SEP,OCT,NOV,DEC 1974, JAN,FEB 1975) from CUES.ten to DUR,
   10 intervals of (DUR-CUES.ten)/10 = 1.3243s each.
*/
  const tl = gsap.timeline({ paused: true });
  const P = "#g-plane-";

  // Root-cause fix (QC 2026-09-21): headline text length varies (1-3 lines at 52px Arial Black in a
  // 540px column) but the sub-line/row/ticker below it was pinned to a fixed CSS top, so a 2-line
  // headline pushed its own second line under the next element. Measure the actual rendered box of the
  // element ABOVE and place the element BELOW it there, instead of guessing a fixed offset.
  function stackBelow(aboveSel, belowSel, gap) {
    const a = document.querySelector(aboveSel), b = document.querySelector(belowSel);
    const root = document.querySelector("#root");
    if (!a || !b || !root) return;
    const ar = a.getBoundingClientRect(), rr = root.getBoundingClientRect();
    b.style.top = (ar.bottom - rr.top + gap) + "px";
  }

  // QC fix (2026-09-21): the eyebrow "DAMAGE SURVEY - APRIL 1974 -> FEBRUARY 1975" wraps to two lines at
  // 520px width + 6px letter-spacing, pushing into the headline's fixed top (154px); the cascade also pushed
  // "148 TRACKS DRAWN BY HAND" (r2) into the italic footer's own fixed top (430px), since r2/r1/hl/ft all
  // overlap on screen together from CUES.damage to the exit. Chain everything off the eyebrow's real height.
  stackBelow("#g-plane-eb", "#g-plane-hl", 10);
  stackBelow("#g-plane-hl", "#g-plane-ticker", 16);
  stackBelow("#g-plane-ticker", "#g-plane-r1", 14);
  stackBelow("#g-plane-r1", "#g-plane-r2", 14);
  stackBelow("#g-plane-r2", "#g-plane-ft", 24);
  const CUES = { ten: 14.92, miles: 17.12, hand: 20.72, damage: 25.82 };
  const DUR = 28.163;
  const WPS = [
    [429.6,437.4],[602.8,312.4],[538.7,723.5],[415.4,705.0],[341.0,777.2],
    [414.2,717.6],[443.7,464.7],[493.7,427.0],[405.2,242.7],[429.6,437.4]
  ];
  const LEGDUR = [3.60,7.02,2.10,1.75,1.59,4.29,1.06,3.45,3.31];

  tl.fromTo(P+"drift", { y: -60 }, { y: 60, duration: DUR, ease: "none" }, 0);

  tl.fromTo(P+"eb", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.2);
  tl.fromTo(P+"hl", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.4);

  // the plane's loop: sequential leg-by-leg translate, ease none (the continuous element for the whole comp)
  let t = 0;
  for (let i = 0; i < LEGDUR.length; i++) {
    const [x, y] = WPS[i + 1];
    tl.to(P+"plane", { x: x - WPS[0][0], y: y - WPS[0][1], duration: LEGDUR[i], ease: "none" }, t);
    t += LEGDUR[i];
  }
  tl.to(P+"trail", { strokeDashoffset: 0, duration: DUR, ease: "none" }, 0);

  // track reveals timed to the plane's pass
  const REVEALS = [["t1",0.3],["t3",3.60],["tg",10.62],["t6",12.72],["t7",14.47],["t2",20.35],["tl",21.41],["tm",24.85]];
  REVEALS.forEach(([id, at]) => {
    tl.fromTo(P+id, { opacity: 0 }, { opacity: 0.85, duration: 0.5, ease: "power2.out" }, at);
  });

  // rail: date ticker (11 steps) from CUES.ten to DUR
  const MONTHS = ["APR 1974","MAY 1974","JUN 1974","JUL 1974","AUG 1974","SEP 1974","OCT 1974","NOV 1974","DEC 1974","JAN 1975","FEB 1975"];
  tl.fromTo(P+"ticker", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, CUES.ten);
  const step = (DUR - CUES.ten) / (MONTHS.length - 1);
  MONTHS.forEach((m, i) => {
    tl.call(() => { const e = document.querySelector(P+"ticker"); if (e) e.textContent = m; }, null, CUES.ten + i * step);
  });

  tl.fromTo(P+"r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4 }, CUES.miles);
  tl.fromTo(P+"r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4 }, CUES.hand);
  tl.fromTo(P+"ft", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.6 }, CUES.damage);

  // exit
  tl.to([P+"hl", P+"r1", P+"r2", P+"ft", P+"ticker"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, DUR - 0.6);

  window.__timelines["g-plane"] = tl;
})();
