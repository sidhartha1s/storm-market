<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-person-pearson-hook — H, cold-open flash: photo only, film-frame, ZERO text
     (owner: "no description"). Photo: media/act-h-a2/allen-pearson-portrait-3x.png (3x lanczos
     upscale of the sourced 166x352 portrait, team-lead 21 Sep 26), provenance.csv row on the 1x
     file confirms shot names Allen Pearson, usable for beat H and I. */
  #root { position:absolute; inset:0; background:transparent; overflow:hidden; }
  .g-person-pearson-hook-frame { position:absolute; left:50%; top:50%; width:320px; height:520px;
    margin:-260px 0 0 -160px; background:#1a1a1a; padding:14px 14px 14px 26px; box-sizing:border-box; }
  .g-person-pearson-hook-sprockets { position:absolute; left:0; top:0; bottom:0; width:14px;
    background-image: repeating-linear-gradient(180deg, #3d3d3d 0 8px, #1a1a1a 8px 16px); }
  .g-person-pearson-hook-photowrap { position:relative; width:100%; height:100%; background:#000;
    display:flex; align-items:center; justify-content:center; overflow:hidden; }
  /* Team-lead 21 Sep 26: source 1x portrait was only 166x352 — use the 3x lanczos upscale
     (media/act-h-a2/allen-pearson-portrait-3x.png, 498x1056) for sharpness, displayed height
     capped <=500px. Same source has a baked-in "Allen Pearson / (Director 1965-1979)" caption
     strip in its bottom ~14% — QC flagged this as text on a card that must show ZERO text.
     aspect-ratio 166/300 + max-height crop out that strip; cover+top keeps the head/shoulders. */
  .g-person-pearson-hook-photocrop { width:100%; aspect-ratio: 166 / 300; max-height:490px; overflow:hidden; position:relative; }
  .g-person-pearson-hook-photocrop img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  /* ambient motion (owner 21 Sep 26): this card has zero text and no underline (cold-open flash,
     "no description"), so the moving element is a soft glint that travels down the sprocket
     strip, finite repeat sized to DUR below (never repeat:-1) — touches nothing but the sprockets. */
  .g-person-pearson-hook-glint { position:absolute; left:0; top:0; width:14px; height:40px;
    background:linear-gradient(180deg, transparent, rgba(232,197,106,0.85), transparent); }
</style>
<div id="root" data-composition-id="g-person-pearson-hook" data-width="1920" data-height="1080">
  <div class="g-person-pearson-hook-frame" id="g-person-pearson-hook-frame">
    <div class="g-person-pearson-hook-sprockets"></div>
    <div class="g-person-pearson-hook-glint" id="g-person-pearson-hook-glint"></div>
    <div class="g-person-pearson-hook-photowrap">
      <div class="g-person-pearson-hook-photocrop">
        <img id="g-person-pearson-hook-photo" src="media/act-h-a2/allen-pearson-portrait-3x.png" alt="" />
      </div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-person-pearson-hook-";
  const DUR = 3.0;
  /* enter: quick punch-in scale (no fromTo/CSS transform conflict — initial state set inside the tween) */
  tl.fromTo(P+"frame", { autoAlpha: 0, scale: 1.1 }, { autoAlpha: 1, scale: 1.02, duration: 0.35, ease: "power4.in" }, 0.05);
  /* continuous element for the whole 3s window: a slow settle/drift on the frame */
  tl.to(P+"frame", { scale: 1.06, duration: DUR - 0.6, ease: "sine.inOut" }, 0.4);
  /* ambient blip: a glint travels down the sprocket strip the whole window, finite repeat sized to
     DUR (owner 21 Sep 26: blank_scan caught the previous Math.ceil version running past DUR) */
  tl.fromTo(P+"glint", { top: -40 }, { top: 480, duration: 0.9, ease: "sine.inOut",
    repeat: Math.floor(DUR / 0.9) - 1 }, 0);
  tl.to(P+"frame", { autoAlpha: 0, duration: 0.35, ease: "power2.in" }, DUR - 0.35);
  window.__timelines["g-person-pearson-hook"] = tl;
})();
</script>
</template>
</body>
</html>
