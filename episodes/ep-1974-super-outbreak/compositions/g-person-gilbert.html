<style>

  #root { position:absolute; inset:0; background:transparent; font-family:Arial,sans-serif; }

    border-radius:28px; box-sizing:border-box; box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); }
  .g-person-gilbert-card { position:absolute; left:96px; top:700px; width:1180px; height:280px;

  .g-person-gilbert-mono { flex:0 0 220px; width:220px; height:260px; border-left:6px solid #8e2020;
    background:rgba(20,26,34,0.5); display:flex; align-items:center; justify-content:center; }
  .g-person-gilbert-mono span { font-family:Georgia,serif; font-weight:700; font-size:120px; color:#2a3644; }

</style>
<div id="root" data-composition-id="g-person-gilbert" data-width="1920" data-height="1080">
  <div class="g-person-gilbert-card glasscard" id="g-person-gilbert-card">
    <div class="g-person-gilbert-mono"><span>DG</span></div>
    <div class="g-person-gilbert-text">
      <div class="g-person-gilbert-name" id="g-person-gilbert-name">DICK GILBERT</div>
      <div class="g-person-gilbert-role" id="g-person-gilbert-role">WHAS radio, helicopter traffic reporter</div>
      <!-- brief: third line appears at CUES.commendation, not with the rest of the card -->
      <div class="g-person-gilbert-line3" id="g-person-gilbert-line3">COMMENDED BY THE PRESIDENT</div>
    </div>
    <div class="g-person-gilbert-underline" id="g-person-gilbert-underline"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* A3-S3 span, audio/a3-s3.words.json exact (current on disk, unchanged this session).
     CUES.commendation: {"text":"commendation","start":39.08,"end":39.8} */
  const CUES = { commendation: 26.8 /* "commendation" */ };
  const DUR = 28.3; // host window set by the orchestrator (index.html)
  const tl = gsap.timeline({ paused: true });
  const P = "#g-person-gilbert-";
  tl.set(P+"underline", { scaleX: 0 }, 0);
  tl.set(P+"line3", { autoAlpha: 0 }, 0);
  tl.fromTo(P+"card", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 0.2);
  tl.to(P+"underline", { scaleX: 1, duration: DUR, ease: "none" }, 0.2);
  /* third line lands on the spoken word, not with the card entrance */
  tl.fromTo(P+"line3", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power2.out" }, CUES.commendation);
  tl.to(P+"card", { x: -120, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.6);
  window.__timelines["g-person-gilbert"] = tl;
})();
</script>
