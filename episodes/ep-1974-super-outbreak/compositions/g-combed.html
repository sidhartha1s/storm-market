<template>
<style>

  .panel { position:absolute; top:300px; width:800px; height:560px; background:rgba(16,24,32,0.35); border:1px solid rgba(42,54,68,0.5); }

  .redx .x1 { transform:rotate(45deg); } .redx .x2 { transform:rotate(-45deg); }
  .comb { position:absolute; top:-8px; left:0px; width:220px; height:80px; }
  .inset { position:absolute; right:20px; bottom:20px; width:320px; height:230px; background:rgba(8,12,17,0.7); border:1px solid rgba(93,118,143,0.5); opacity:0;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:12px; box-sizing:border-box; }
  .insetsvg { width:300px; height:96px; display:block; }
  .insetlabel { width:290px; font-weight:700; font-size:21px; color:#dfe7ee; text-align:center; line-height:1.3; margin-top:8px; }
  .footer { position:absolute; left:96px; right:96px; bottom:60px; text-align:center; font-size:19px; color:#93a3b2; letter-spacing:1px; }
</style>
<div id="root" data-composition-id="g-combed" data-width="1920" data-height="1080">
  <div class="panel" id="g-combed-panel-l">
    <div class="plabel" id="g-combed-lab-l">A TORNADO</div>
    <div class="swirl" id="g-combed-swirl">
      <svg viewBox="0 0 300 300" width="300" height="300">
        <path d="M 150 40 A 110 110 0 1 1 65 220" fill="none" stroke="#d8a13a" stroke-width="4" opacity="0.6"/>
        <polygon points="65,220 90,205 78,235" fill="#d8a13a" opacity="0.6"/>
      </svg>
    </div>
    <div class="redx" id="g-combed-redx"><div class="x1"></div><div class="x2"></div></div>

  <div class="panel" id="g-combed-panel-r">
    <div class="plabel" id="g-combed-lab-r">WHAT FUJITA FOUND</div>
    <div class="comb" id="g-combed-comb">
      <svg viewBox="0 0 220 80" width="220" height="80">
        <rect x="0" y="0" width="220" height="14" fill="#93a3b2"/>
        <g stroke="#93a3b2" stroke-width="6">
          <line x1="8" y1="14" x2="8" y2="70"/><line x1="26" y1="14" x2="26" y2="70"/><line x1="44" y1="14" x2="44" y2="70"/>
          <line x1="62" y1="14" x2="62" y2="70"/><line x1="80" y1="14" x2="80" y2="70"/><line x1="98" y1="14" x2="98" y2="70"/>
          <line x1="116" y1="14" x2="116" y2="70"/><line x1="134" y1="14" x2="134" y2="70"/><line x1="152" y1="14" x2="152" y2="70"/>
          <line x1="170" y1="14" x2="170" y2="70"/><line x1="188" y1="14" x2="188" y2="70"/><line x1="206" y1="14" x2="206" y2="70"/>
        </g>
      </svg>
    </div>
    <div class="inset" id="g-combed-inset">
      <svg class="insetsvg" viewBox="0 0 300 96">
        <line x1="150" y1="4" x2="150" y2="70" stroke="#7fb2e5" stroke-width="6"/>
        <polygon points="150,80 138,60 162,60" fill="#7fb2e5"/>
        <path d="M 150 72 Q 90 72 40 44" fill="none" stroke="#7fb2e5" stroke-width="4"/>
        <polygon points="40,44 58,42 50,58" fill="#7fb2e5"/>
        <path d="M 150 72 Q 210 72 260 44" fill="none" stroke="#7fb2e5" stroke-width="4"/>
        <polygon points="260,44 242,42 250,58" fill="#7fb2e5"/>
        <line x1="20" y1="74" x2="280" y2="74" stroke="#5a768f" stroke-width="3"/>

      <div class="insetlabel">MICROBURST &middot; A DOWNDRAFT THAT SPREADS ON THE GROUND</div>

</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const panelL = document.getElementById("g-combed-panel-l");
  const panelR = document.getElementById("g-combed-panel-r");

  function treeSVG() {
    // 20px trunk (spec calls for 12px; lengthened so the rotation is actually legible at this
    // scale — a 12px trunk under a 26px canopy read as visually uniform regardless of angle,
    // per QC + direct screenshot review 2026-09-21) + 26px canopy circle at the far end.
    return '<svg viewBox="0 0 56 56" width="56" height="56">' +
      '<line x1="18" y1="28" x2="38" y2="28" stroke="#93a3b2" stroke-width="4"/>' +
      '<circle cx="38" cy="28" r="13" fill="#3f7d44"/></svg>';
  }

  const leftTrees = [];
  const rightTrees = [];
  const cols = 8, rows = 6;
  const marginX = 70, marginY = 70;
  const spanX = (800 - marginX*2) / (cols-1);
  const spanY = (560 - marginY*2) / (rows-1);
  const cx = 400, cy = 280;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = marginX + c*spanX;
      const y = marginY + r*spanY;
      // LEFT: tangential spiral pattern — perpendicular to the radius, +20 deg inward. Not parallel.
      const dx = x - cx, dy = y - cy;
      const radialAngle = Math.atan2(dy, dx);
      const tangentDeg = (radialAngle * 180/Math.PI) + 90 + 20;
      const tl = document.createElement("div");
      tl.className = "treemark";
      tl.style.left = (x-28) + "px"; tl.style.top = (y-28) + "px";
      tl.style.transform = "rotate(" + tangentDeg + "deg)";
      tl.style.opacity = 0;
      tl.innerHTML = treeSVG();
      panelL.appendChild(tl); leftTrees.push(tl);
      // RIGHT: all fall the same direction — parallel, 20 deg off horizontal
      const tr = document.createElement("div");
      tr.className = "treemark";
      tr.style.left = (x-20) + "px"; tr.style.top = (y-20) + "px";
      tr.style.transform = "rotate(-20deg)";
      tr.style.opacity = 0;
      tr.innerHTML = treeSVG();
      panelR.appendChild(tr); rightTrees.push(tr);
    }
  }

  const tl = gsap.timeline({ paused: true });
  const P = "#g-combed-";

  tl.set([P+"lab-l", P+"lab-r", P+"swirl", P+"redx", P+"footer", P+"comb"], {autoAlpha:0}, 0);
  tl.set(P+"inset", {autoAlpha:0}, 0);

  tl.fromTo(P+"lab-l", {autoAlpha:0, y:-16}, {autoAlpha:1, y:0, duration:0.5}, 0.3);
  tl.fromTo(P+"lab-r", {autoAlpha:0, y:-16}, {autoAlpha:1, y:0, duration:0.5}, 0.5);
  tl.fromTo(P+"footer", {autoAlpha:0}, {autoAlpha:1, duration:0.6}, 0.8);
  tl.to(leftTrees, {autoAlpha:1, duration:0.02, stagger:0.02}, 0.6);
  tl.to(rightTrees, {autoAlpha:1, duration:0.02, stagger:0.02}, 0.9);
  tl.fromTo(P+"swirl", {autoAlpha:0}, {autoAlpha:1, duration:0.6}, 1.6);

  // continuous 1.02 scale breathing on both panels — FINITE repeat (was repeat:-1, which made
  // tl.duration() infinite and broke hyperframes seeking): 6 legs of 3.9s = 23.4s, ends at 23.8,
  // safely inside the 24.1s window.
  tl.to(["#g-combed-panel-l", "#g-combed-panel-r"], {scale:1.02, duration:3.9, ease:"sine.inOut", yoyo:true, repeat:5, transformOrigin:"center center"}, 0.4);

  /* FINAL cues from audio/a5-s4.words.json, mount = A5-S4 start, DUR 24.1 (orchestrator 2026-09-21):
     combed 7.59 · cant 9.09 · microburst 17.89 */
  // comb starts hidden at the RIGHT panel's own left edge (x:0) and slides to its right edge — never touches the left panel
  tl.fromTo(P+"comb", {autoAlpha:0, x:0}, {autoAlpha:1, x:580, duration:1.2, ease:"power2.inOut"}, 7.59);

  tl.fromTo(P+"redx", {autoAlpha:0}, {autoAlpha:1, duration:0.2}, 9.09);
  tl.to(P+"redx", {autoAlpha:0, duration:0.3}, 10.09);

  tl.fromTo(P+"inset", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.5}, 17.89);

  // pin exact duration at 24.1
  tl.to({}, {duration:0.01}, 24.09);

  window.__timelines["g-combed"] = tl;
})();
</script>
