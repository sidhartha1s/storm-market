  #root { position:absolute; inset:0; background:transparent; font-family:Arial,sans-serif; }
  .glasscard { background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15);

    border-radius:28px; box-sizing:border-box; box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); }
  .g-person-pearson-card { position:absolute; left:96px; top:700px; width:1180px; height:280px;

  .g-person-pearson-sprockets { position:absolute; left:0; top:0; bottom:0; width:10px;

  .g-person-pearson-photowrap { width:100%; height:100%; background:#000; display:flex;

  .g-person-pearson-photocrop { width:100%; aspect-ratio: 166 / 300; overflow:hidden; position:relative; }

<script>
window.__timelines = window.__timelines || {};
(function() {
  /* I-1 span, audio/i-1.words.json (exact, current on disk). No word-tied cue needed here —
     standard lower-third: enters together, holds, slides out. Duration = segment span. */
  const DUR = 45.946; // audio/manifest.json i-1.duration
  const tl = gsap.timeline({ paused: true });
  const P = "#g-person-pearson-";
  tl.set(P+"underline", { scaleX: 0 }, 0);
  tl.fromTo(P+"card", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 0.2);
  /* continuous element: underline grows the full duration */
  tl.to(P+"underline", { scaleX: 1, duration: DUR, ease: "none" }, 0.2);
  tl.to(P+"card", { x: -120, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.6);
  window.__timelines["g-person-pearson"] = tl;
})();
</script>
