<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#g-tnrm-";

  tl.set(P+"eyebrow", {autoAlpha:0}, 0);
  tl.set([P+"row1", P+"row2", P+"row3"], {autoAlpha:0, x:40}, 0);
  tl.set(P+"footer", {autoAlpha:0}, 0);

  tl.fromTo(P+"eyebrow", {autoAlpha:0, y:-14}, {autoAlpha:1, y:0, duration:0.5}, 0.05);

  // continuous faint funnel silhouette drift, capped inside the 10.56s window — single finite
  // drift instead of an infinite yoyo (repeat:-1 made tl.duration() infinite and broke seeking).
  // ease:"none" (not sine.inOut) so velocity stays constant to the very end of the window --
  // sine.inOut decelerates to near-zero speed at both endpoints, which read as frozen after ~8s.
  tl.to(P+"funnelbg", {y:36, x:-26, duration:10.4, ease:"none"}, 0);

  /* FINAL cues from audio/a6-s3.words.json, mount 0.2s before "storm shelter", DUR 10.56 (orchestrator 2026-09-21):
     shelter 0.2 · room 1.7 · car 4.5 · cant("past") 4.7 · know 6.3 */
  tl.fromTo(P+"row1", {autoAlpha:0, x:40}, {autoAlpha:1, x:0, duration:0.5}, 0.2);
  tl.to(P+"row1", {borderColor:"#e8c56a", duration:0.4}, 0.5);

  tl.fromTo(P+"row2", {autoAlpha:0, x:40}, {autoAlpha:1, x:0, duration:0.5}, 1.7);
  tl.to(P+"row2", {borderColor:"#e8c56a", duration:0.4}, 2.0);

  tl.fromTo(P+"row3", {autoAlpha:0, x:40}, {autoAlpha:1, x:0, duration:0.3}, 4.5);

  // CUES.cant @4.7 (word "past" in "...does not get a car past a mile-wide tornado")
  tl.fromTo(P+"strike", {scaleX:0}, {scaleX:1, duration:0.3, ease:"power2.out"}, 4.7);
  tl.to(P+"row3", {autoAlpha:0.6, duration:0.4}, 5.0);

  tl.fromTo(P+"footer", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.5}, 6.3);

  // pin exact duration at 10.56
  tl.to({}, {duration:0.01}, 10.55);

  window.__timelines["g-thennow-rooms"] = tl;
})();
