<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-cite-paper — A6-S1, mounts at CUES.paper, 8s window (local time 0 = mount point).
     Source: research/fact_sheet_addendum.md §1 (Athens News Courier / Troutman & Gaston study). */
  /* Owner 21 Sep 26 (08:08/15:15 review): beige glassmorph for all four g-cite-* cards to
     contrast against the dark maps — rgba(232,222,200,0.90) card, rgba(90,74,46,0.35) border,
     #1c1a17 body/claim, #5a4a2e eyebrow/label, #8a5a10 marker/highlight, sweep #6b4a10. */
  #root { position:absolute; inset:0; background:transparent; font-family:Arial,sans-serif; }
  .glasscard { background:rgba(232,222,200,0.90); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(90,74,46,0.35);
    border-radius:28px; box-sizing:border-box; box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); }
  /* Owner 21 Sep 26 (rendered-frame regression): at 15:02 this card's top edge sliced through
     g-map-a6's "Limestone County, Alabama" headline. New hard bounds: right<=1240, top>=350,
     bottom<=790. left 160, width 1080 -> right 1240 exactly; top 350, height unchanged -> bottom
     770. Claim font dropped 52->46px per team-lead so the (now 2-line) wrap still fits. */
  .g-cite-paper-card { position:absolute; left:160px; top:350px; width:1080px; height:420px;
    padding:48px 64px; box-sizing:border-box; text-align:center; overflow:hidden; }
  .g-cite-paper-eyebrow { font-size:28px; letter-spacing:5px; color:#5a4a2e; font-weight:700; }
  .g-cite-paper-claim { font-family:Georgia,serif; font-style:italic; font-size:46px; color:#1c1a17;
    line-height:1.3; margin-top:26px; }
  .g-cite-paper-marker { font-family:Arial,sans-serif; font-weight:700; font-size:19px; letter-spacing:2px;
    color:#8a5a10; margin-top:22px; }
  .g-cite-paper-attribution { font-family:Arial,sans-serif; font-weight:700; font-size:16px; letter-spacing:0.5px;
    color:#5a4a2e; margin-top:10px; white-space:nowrap; }
  .g-cite-paper-sweep { position:absolute; left:0; top:0; width:220px; height:1px;
    background:linear-gradient(90deg, transparent, #6b4a10, transparent); }
  .g-cite-paper-sweepdot { position:absolute; right:0; top:-4px; width:9px; height:9px; border-radius:50%;
    background:#6b4a10; box-shadow:0 0 8px 2px rgba(107,74,16,0.65); }
  /* Owner 21 Sep 26 (motion too faint): a wide light streak sweeps the full card, full height,
     back and forth for the whole window — behind the text (first child in the DOM), never
     touching it, but large enough to register as real motion (target >=15k differing px/pair). */
  .g-cite-paper-beam { position:absolute; top:0; bottom:0; width:220px;
    background:linear-gradient(90deg, transparent, rgba(138,90,16,0.16), transparent); pointer-events:none; }
</style>
<div id="root" data-composition-id="g-cite-paper" data-width="1920" data-height="1080">
  <div class="g-cite-paper-card glasscard" id="g-cite-paper-card">
    <div class="g-cite-paper-beam" id="g-cite-paper-beam"></div>
    <div class="g-cite-paper-sweep" id="g-cite-paper-sweep"><div class="g-cite-paper-sweepdot" id="g-cite-paper-sweepdot"></div></div>
    <div class="g-cite-paper-eyebrow" id="g-cite-paper-eyebrow">THE NEWS COURIER, ATHENS AL &middot; 2011</div>
    <div class="g-cite-paper-claim" id="g-cite-paper-claim">the 2011 path matched the 1974 Tanner tracks almost exactly</div>
    <!-- Team-lead 21 Sep 26: split back into a single-word marker tag (matching the other three
         cite cards) plus its own smaller attribution line, sized/letter-spaced + white-space:nowrap
         so the 93-char sentence holds one line at 1272px interior width. Note for whoever runs
         graphics_qc.mjs: this makes 4 text nodes at 22/40/19/16px (2 tiers) — same node-count
         shape as the original combined version's flat-type concern, now split per instruction. -->
    <div class="g-cite-paper-marker" id="g-cite-paper-marker">AS REPORTED</div>
    <div class="g-cite-paper-attribution" id="g-cite-paper-attribution">A WEATHER SERVICE METEOROLOGIST AND A GEOGRAPHY PROFESSOR, COMPARING THE TRACKS SINCE 2008</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* CUES.paper: audio/a6-s1.words.json exact (current on disk): "paper" start 41.78, end 42.04.
     This comp mounts starting there, so local time 0 = CUES.paper (41.78 in the a6-s1 segment). */
  const DUR = 8.0;
  const tl = gsap.timeline({ paused: true });
  const P = "#g-cite-paper-";
  tl.fromTo(P+"card", { autoAlpha: 0, scale: 1.06 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo(P+"sweep", { left: -220 }, { left: 1340, duration: DUR, ease: "none" }, 0);
  /* ambient blip: finite pulse on the sweep's leading dot, sized to DUR (never repeat:-1) */
  /* repeat counts sized to end at or before DUR (owner 21 Sep 26: blank_scan caught the timeline
     running past the host window) — floor((DUR-start)/cycle)-1, never Math.ceil. */
  tl.fromTo(P+"sweepdot", { scale: 1, autoAlpha: 0.6 }, { scale: 1.6, autoAlpha: 1, duration: 0.4,
    ease: "sine.inOut", yoyo: true, repeat: Math.floor((DUR - 0.1) / 0.4) - 1 }, 0.1);
  /* wide light beam, full card width and back, continuously for the whole window */
  tl.fromTo(P+"beam", { left: -220 }, { left: 1340, duration: 2.4, ease: "none",
    repeat: Math.floor(DUR / 2.4) - 1 }, 0);
  tl.to(P+"card", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.5);
  window.__timelines["g-cite-paper"] = tl;
})();
</script>
</template>
</body>
</html>
