<!doctype html><html><head><meta charset="UTF-8">
<script src="../gsap.min.js"></script></head><body style="margin:0;background:#000">
<style>
  #root { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); font-family:Arial,sans-serif; overflow:hidden; }
  .eyebrow { position:absolute; left:96px; top:76px; font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .sub { position:absolute; left:96px; top:112px; font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; }
  .bars { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .bar { position:absolute; top:340px; width:150px; height:520px; }
  .unlit { position:absolute; inset:0; background:#1a222b; border:1px solid #2a3644; }
  .lit { position:absolute; inset:0; background:#8e2020; }
  .cap { position:absolute; top:0; left:0; right:0; height:8px; background:#e74c3c; }
  .f5 { position:absolute; top:14px; left:0; right:0; text-align:center; font-family:'Arial Black',Arial,sans-serif; font-size:52px; color:#f2f5f8; }
  .town { position:absolute; top:550px; left:-20px; right:-20px; text-align:center; font-family:Arial,sans-serif; font-weight:700; font-size:19px; line-height:1.15; color:#dfe7ee; letter-spacing:0px; }
  .time { position:absolute; top:600px; left:-20px; right:-20px; text-align:center; font-family:'Courier New',monospace; font-size:22px; color:#93a3b2; }
  .sweepline { position:absolute; left:315px; width:1290px; height:2px; top:340px; background:#e8c56a; box-shadow:0 0 14px 2px #e8c56a; opacity:0.55; }
  .bracket { position:absolute; left:315px; top:300px; width:1290px; height:24px; }
  .bracket .line { position:absolute; left:0; right:0; top:16px; height:2px; background:#93a3b2; transform-origin:left center; }
  .bracket .tick { position:absolute; top:8px; width:2px; height:16px; background:#93a3b2; }
  .bracket .lab { position:absolute; left:0; right:0; top:-22px; text-align:center; font-family:Arial,sans-serif; font-weight:700; font-size:22px; color:#93a3b2; }
</style>
<div id="root" data-composition-id="g-scale-a4" data-width="1920" data-height="1080">
  <div class="eyebrow" id="g-scale-a4-eyebrow">SEVEN F5 TORNADOES &middot; APRIL 3, 1974</div>
  <div class="sub" id="g-scale-a4-sub">the set closes over Alabama</div>
  <div class="bars" id="g-scale-a4-bars"></div>
  <div class="sweepline" id="g-scale-a4-sweep"></div>
  <div class="bracket" id="g-scale-a4-bracket">
    <div class="tick" style="left:0"></div>
    <div class="tick" style="right:0"></div>
    <div class="line" id="g-scale-a4-bracketline"></div>
    <div class="lab" id="g-scale-a4-bracketlab">FROM 2:16 PM TO 10:57 PM</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const ID = 'g-scale-a4';
  const TOWNS = ["DEPAUW &middot; IN","BRANDENBURG &middot; KY","XENIA &middot; OH","SAYLER PARK &middot; OH","TANNER &middot; AL","TANNER &middot; AL","GUIN &middot; AL"];
  const TIMES = ["2:16 PM CDT","3:30 PM CDT","4:32 PM EDT","5:28 PM EDT","6:20 PM CDT","7:30 PM CDT","8:25 PM CDT"];
  const wrap = document.getElementById(ID + '-bars');
  for (let i = 0; i < 7; i++) {
    const x = 315 + i * 190;
    const d = document.createElement('div');
    d.className = 'bar';
    d.id = ID + '-bar' + i;
    d.style.left = x + 'px';
    d.innerHTML =
      '<div class="unlit"></div>' +
      '<div class="lit" id="' + ID + '-lit' + i + '"><div class="cap"></div><div class="f5">F5</div></div>' +
      '<div class="town">' + TOWNS[i] + '</div>' +
      '<div class="time">' + TIMES[i] + '</div>';
    wrap.appendChild(d);
  }

  /* a4-s3.txt has no words.json (no wav rendered yet). PROVISIONAL, window-anchored:
     the comp opens right before "seventh" (word 32 of a4-s3.txt) is spoken, so that cue
     sits near t=0 of this 8s window. The brief names a second cue "CUES.nine" with the
     comment "hours" — no such word exists in the current a4-s3.txt ("...eleven at night,
     from Indiana to Alabama..."). Substituting the nearest matching word, "night" (word 44),
     which completes the same clause ("the set complete"); flagged for the team lead / owner
     to confirm against the intended script line. Gap seventh->night = 12 words @ 185.6 wpm
     (episode mean, audio/manifest.json) = ~3.9s. */
  const CUES = {
    seventh: 0.40, // "seventh" — PROVISIONAL, window-anchored
    night: 4.30    // "night" — PROVISIONAL, substituted for brief's unmatched "CUES.nine (hours)"
  };

  const tl = gsap.timeline({ paused: true });
  const DUR = 8.0;
  tl.set('#' + ID + '-eyebrow', { autoAlpha: 1 }, 0);
  tl.set('#' + ID + '-sub', { autoAlpha: 1 }, 0);
  tl.set('#' + ID + '-bracket', { autoAlpha: 0 }, 0);
  tl.set('#' + ID + '-bracketline', { scaleX: 0 }, 0);
  for (let i = 0; i < 7; i++) {
    tl.set('#' + ID + '-bar' + i, { scaleY: 1 }, 0);
    tl.set('#' + ID + '-lit' + i, { autoAlpha: 0 }, 0);
  }
  tl.set(['#' + ID + '-lit0', '#' + ID + '-lit1', '#' + ID + '-lit2', '#' + ID + '-lit3', '#' + ID + '-lit4', '#' + ID + '-lit5'], { autoAlpha: 1 }, 0);
  tl.fromTo('#' + ID + '-sweep', { top: 340 }, { top: 860, duration: DUR, ease: 'none' }, 0);

  tl.fromTo('#' + ID + '-lit6', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.08 }, CUES.seventh);
  tl.fromTo('#' + ID + '-bar6', { scale: 1 }, { scale: 1.12, duration: 0.175, ease: 'power2.out' }, CUES.seventh)
    .to('#' + ID + '-bar6', { scale: 1, duration: 0.175, ease: 'power2.in' }, CUES.seventh + 0.175);

  tl.to('#' + ID + '-bracket', { autoAlpha: 1, duration: 0.2 }, CUES.night);
  tl.to('#' + ID + '-bracketline', { scaleX: 1, duration: 0.4, ease: 'power2.out' }, CUES.night);
  tl.fromTo('#' + ID + '-bracketlab', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, CUES.night + 0.3);

  window.__timelines[ID] = tl;
})();
</script>
</body></html>
