<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  #root { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); font-family:Arial,sans-serif; overflow:hidden; }
  .eyebrow { position:absolute; left:96px; top:76px; font-size:22px; letter-spacing:6px; color:#93a3b2; font-weight:700; }
  .rangebox { position:absolute; left:96px; top:120px; }
  .rangenum { font-family:'Courier New',monospace; font-weight:700; font-size:76px; color:#5a768f; line-height:1; }
  .rangelab { font-size:19px; letter-spacing:4px; color:#93a3b2; font-weight:700; margin-top:4px; }
  .northlab { font-family:Arial,sans-serif; font-weight:700; font-size:26px; letter-spacing:3px; fill:#3a7a52; }
  .blob { fill:#2fd66b; opacity:0.85; }
  .hook { stroke:#7dffb0; stroke-width:4; fill:none; stroke-linecap:round; }
</style>
<div id="root" data-composition-id="g-radar-hook" data-width="1920" data-height="1080">
  <div class="eyebrow" id="g-radar-hook-eyebrow">CINCINNATI &middot; WSR-57 &middot; BUILT 1960</div>
  <div class="rangebox" id="g-radar-hook-sub"><div class="rangenum">125</div><div class="rangelab">MILE RANGE</div></div>
  <svg viewBox="0 0 1920 1080" style="position:absolute;inset:0" id="g-radar-hook-svg">
    <defs>
      <linearGradient id="g-radar-hook-grad" gradientUnits="userSpaceOnUse" x1="960" y1="560" x2="960" y2="150">
        <stop offset="0%" stop-color="#37f07a" stop-opacity="0.85"/>
        <stop offset="100%" stop-color="#37f07a" stop-opacity="0"/>
      </linearGradient>
      <filter id="g-radar-hook-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <g id="g-radar-hook-scope">
      <circle cx="960" cy="560" r="410" fill="#04110a" stroke="#1e5a33" stroke-width="2"/>
      <circle cx="960" cy="560" r="360" fill="none" stroke="#1e5a33" stroke-width="1"/>
      <circle cx="960" cy="560" r="270" fill="none" stroke="#1e5a33" stroke-width="1"/>
      <circle cx="960" cy="560" r="180" fill="none" stroke="#1e5a33" stroke-width="1"/>
      <circle cx="960" cy="560" r="90" fill="none" stroke="#1e5a33" stroke-width="1"/>
      <text x="960" y="164" text-anchor="middle" class="northlab">NORTH</text>
      <g id="g-radar-hook-sweepgrp">
        <path d="M960,560 L819.7,174.7 A410,410 0 0,1 1100.3,174.7 Z" fill="url(#g-radar-hook-grad)"/>
      </g>
      <g id="g-radar-hook-blobs">
        <g id="g-radar-hook-b0" transform="translate(1150,420)"><ellipse id="g-radar-hook-ell0" class="blob" rx="36" ry="30" filter="url(#g-radar-hook-blur)"/><g class="hook" transform="translate(-27,22) rotate(135)"><path d="M0,0 C -14,-6 -22,4 -18,16 C -14,26 2,24 8,14"/></g></g>
        <g id="g-radar-hook-b1" transform="translate(840,360)"><ellipse id="g-radar-hook-ell1" class="blob" rx="32" ry="27" filter="url(#g-radar-hook-blur)"/><g class="hook" transform="translate(-24,20) rotate(135)"><path d="M0,0 C -14,-6 -22,4 -18,16 C -14,26 2,24 8,14"/></g></g>
        <g id="g-radar-hook-b2" transform="translate(1180,650)"><ellipse id="g-radar-hook-ell2" class="blob" rx="30" ry="25" filter="url(#g-radar-hook-blur)"/><g class="hook" transform="translate(-22,18) rotate(135)"><path d="M0,0 C -14,-6 -22,4 -18,16 C -14,26 2,24 8,14"/></g></g>
        <g id="g-radar-hook-b3" transform="translate(760,700)"><ellipse id="g-radar-hook-ell3" class="blob" rx="34" ry="28" filter="url(#g-radar-hook-blur)"/><g class="hook" transform="translate(-25,21) rotate(135)"><path d="M0,0 C -14,-6 -22,4 -18,16 C -14,26 2,24 8,14"/></g></g>
        <g id="g-radar-hook-b4" transform="translate(980,730)"><ellipse id="g-radar-hook-ell4" class="blob" rx="28" ry="24" filter="url(#g-radar-hook-blur)"/><g class="hook" transform="translate(-21,17) rotate(135)"><path d="M0,0 C -14,-6 -22,4 -18,16 C -14,26 2,24 8,14"/></g></g>
      </g>
    </g>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const ID = 'g-radar-hook';
  const DUR = 5.0;

  /* h.txt has no words.json yet (no wav rendered). "Five" (the hooks line, word 24 of
     h.txt) is PROVISIONAL, window-anchored — this short single-cue graphic opens right
     as the word lands. */
  const CUES = { five: 0.30 /* "Five" — PROVISIONAL */ };

  const tl = gsap.timeline({ paused: true });
  tl.set('#' + ID + '-eyebrow', { autoAlpha: 1 }, 0);
  tl.set('#' + ID + '-sub', { autoAlpha: 1 }, 0);
  const blobIds = ['b0', 'b1', 'b2', 'b3', 'b4'];
  blobIds.forEach((b) => tl.set('#' + ID + '-' + b, { opacity: 0.15, scale: 0.85, transformOrigin: 'center' }, 0));

  /* continuous element: the sweep rotates for the whole window, never stopping */
  tl.fromTo('#' + ID + '-sweepgrp', { rotation: 0 }, { rotation: 360 * (DUR / 4), duration: DUR, ease: 'none', svgOrigin: '960 560' }, 0);

  blobIds.forEach((b, i) => {
    tl.fromTo('#' + ID + '-' + b, { opacity: 0.15, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, CUES.five + i * 0.18);
  });

  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
