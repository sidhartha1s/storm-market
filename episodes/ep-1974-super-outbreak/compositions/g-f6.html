<script>
window.__timelines = window.__timelines || {};
(function() {
  const ID = 'g-f6';
  const DUR = 12.56; // mounted 2.44 s into A3-S1 after the real-footage payoff cut

  /* a3-s1.words.json exists — CONFIRMED exact word timestamps, not provisional. */
  const CUES = {
    six: 4.40,      // "F6."
    tookback: 9.04 // "took" (of "took it back")
  };

  const strike = document.getElementById(ID + '-strike');
  const len = strike.getTotalLength();
  strike.style.strokeDasharray = len;
  strike.style.strokeDashoffset = len;

  const tl = gsap.timeline({ paused: true });
  tl.set('#' + ID + '-label', { autoAlpha: 1 }, 0);
  tl.set('#' + ID + '-f6', { clipPath: 'inset(0px 100% 0px 0px)' }, 0);
  tl.set('#' + ID + '-f5', { autoAlpha: 0 }, 0);
  tl.set('#' + ID + '-footer', { autoAlpha: 1 }, 0);

  /* continuous element: the whole card slowly pushes in for the full duration */
  tl.fromTo('#' + ID + '-card', { scale: 1.0 }, { scale: 1.06, duration: DUR, ease: 'none', transformOrigin: '50% 50%' }, 0);

  tl.fromTo('#' + ID + '-f6', { clipPath: 'inset(0px 100% 0px 0px)' }, { clipPath: 'inset(0px 0% 0px 0px)', duration: 0.5, ease: 'power2.out' }, CUES.six);
  tl.to('#' + ID + '-strike', { strokeDashoffset: 0, duration: 0.35, ease: 'power2.out' }, CUES.tookback);
  tl.fromTo('#' + ID + '-f5', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, CUES.tookback + 0.35 + 0.5);

  window.__timelines[ID] = tl;
})();
</script>
