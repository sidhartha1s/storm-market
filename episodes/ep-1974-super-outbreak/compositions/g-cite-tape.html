<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-cite-tape — A4-S2, mounts at CUES.tape, runs to CUES.house (local time 0 = mount point).
     Waveform derived from the real file: media/act-a3-a4/lindley_waveform.png, generated this
     session via ffmpeg showwavespic (1400x220, #7dffb0 on transparent) from
     media/act-a3-a4/lindley_guin_tape_tornadotalk.mp3 — not a random/fake pattern (brief §"Must
     be true" 3). */
  #root { position:absolute; inset:0; background:transparent; font-family:Arial,sans-serif; }
  .glasscard { background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14);
    border-radius:28px; box-sizing:border-box; box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); }
  .g-cite-tape-card { position:absolute; left:260px; top:330px; width:1400px; height:360px;
    padding:44px 65px; box-sizing:border-box; text-align:center; overflow:hidden; }
  .g-cite-tape-eyebrow { font-size:22px; letter-spacing:5px; color:#93a3b2; font-weight:700; }
  .g-cite-tape-wave { position:relative; margin:28px auto 0; width:1270px; height:200px; }
  .g-cite-tape-wave img { width:100%; height:100%; display:block; }
  .g-cite-tape-playhead { position:absolute; top:0; bottom:0; left:0; width:2px; background:#f2f5f8;
    box-shadow:0 0 10px 2px rgba(242,245,248,0.7); }
  .g-cite-tape-caption { font-family:Georgia,serif; font-style:italic; font-size:26px; color:#d8a13a; margin-top:22px; }
  .g-cite-tape-sweep { position:absolute; left:0; top:0; width:220px; height:1px;
    background:linear-gradient(90deg, transparent, #e8c56a, transparent); }
</style>
<div id="root" data-composition-id="g-cite-tape" data-width="1920" data-height="1080">
  <div class="g-cite-tape-card glasscard" id="g-cite-tape-card">
    <div class="g-cite-tape-sweep" id="g-cite-tape-sweep"></div>
    <div class="g-cite-tape-eyebrow" id="g-cite-tape-eyebrow">ALLEN LINDLEY &middot; GUIN, ALABAMA &middot; APRIL 3, 1974</div>
    <div class="g-cite-tape-wave" id="g-cite-tape-wave">
      <img src="media/act-a3-a4/lindley_waveform.png" alt="" />
      <div class="g-cite-tape-playhead" id="g-cite-tape-playhead"></div>
    </div>
    <div class="g-cite-tape-caption" id="g-cite-tape-caption">A MINUTE OF IT COMING &middot; EIGHTEEN SECONDS GOING OVER THE HOUSE</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* CUES.tape / CUES.house: audio/a4-s2.words.json not present on disk yet (segment
     mid-regeneration). PROVISIONAL: "tape" (word ~68) and the first "house" mention after it
     (word ~90), of ~171 words in the current a4-s2.txt, at manifest wpm 191.9, bracket roughly
     13s of the ~50.3s segment. This comp mounts at CUES.tape, so local time 0 = CUES.tape and
     local end (DUR) = CUES.house. */
  const DUR = 13.0; // PROVISIONAL window length (CUES.house - CUES.tape)
  const tl = gsap.timeline({ paused: true });
  const P = "#g-cite-tape-";
  tl.fromTo(P+"card", { autoAlpha: 0, scale: 1.06 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
  tl.fromTo(P+"sweep", { left: -220 }, { left: 1400, duration: DUR, ease: "none" }, 0);
  /* continuous element: the playhead moves across the waveform for the whole duration */
  tl.fromTo(P+"playhead", { left: 0 }, { left: 1268, duration: DUR, ease: "none" }, 0);
  tl.to(P+"card", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.5);
  window.__timelines["g-cite-tape"] = tl;
})();
</script>
</template>
</body>
</html>
