<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-cite-warning — A3-S2, mounts at CUES.fourofive, 8s window (local time 0 = mount point).
     Verbatim clause from research/fact_sheet_addendum.md §6, WSO Cincinnati preliminary report,
     9 April 1974. Only this cite card carries quotation marks (brief §"Must be true" 1). */
  /* Owner 21 Sep 26 (08:08/15:15 review): beige glassmorph for all four g-cite-* cards to
     contrast against the dark maps — rgba(232,222,200,0.90) card, rgba(90,74,46,0.35) border,
     #1c1a17 body/claim, #5a4a2e eyebrow, #8a5a10 marker/highlight, sweep a darker gold #6b4a10. */
  #root { position:absolute; inset:0; background:transparent; font-family:Arial,sans-serif; }
  .glasscard { background:rgba(232,222,200,0.90); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(90,74,46,0.35);
    border-radius:28px; box-sizing:border-box; box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10); }
  /* Owner 21 Sep 26 (presenter zone): the Paul circle occupies x 1632-1888 / y 700-956 (ring),
     no card may enter x>=1600 with y>=680 — shifted up 10px and narrowed 60px to clear it
     (right edge now exactly 1600, bottom exactly 680). */
  .g-cite-warning-card { position:absolute; left:260px; top:320px; width:1340px; height:360px;
    padding:48px 64px; box-sizing:border-box; text-align:center; overflow:hidden; }
  .g-cite-warning-eyebrow { font-size:22px; letter-spacing:5px; color:#5a4a2e; font-weight:700; }
  .g-cite-warning-claim { font-family:Georgia,serif; font-style:italic; font-size:40px; color:#1c1a17;
    line-height:1.35; margin-top:30px; }
  .g-cite-warning-marker { font-family:Arial,sans-serif; font-weight:700; font-size:19px; letter-spacing:4px;
    color:#8a5a10; margin-top:26px; }
  .g-cite-warning-sweep { position:absolute; left:0; top:0; width:220px; height:1px;
    background:linear-gradient(90deg, transparent, #6b4a10, transparent); }
  /* ambient motion (owner: "give the dots blip-blip") — a small dot rides the sweep's leading
     edge (child of .sweep, so it inherits the parent's left-tween for free) and pulses in place;
     finite repeat sized to DUR in the script below, never repeat:-1. Sits on the card's top edge,
     well clear of all text. */
  .g-cite-warning-sweepdot { position:absolute; right:0; top:-4px; width:9px; height:9px; border-radius:50%;
    background:#6b4a10; box-shadow:0 0 8px 2px rgba(107,74,16,0.65); }
  /* Owner 21 Sep 26 (motion too faint): a wide light streak sweeps the full card, full height,
     back and forth for the whole window — behind the text (first child in the DOM), never
     touching it, but large enough to register as real motion (target >=15k differing px/pair). */
  .g-cite-warning-beam { position:absolute; top:0; bottom:0; width:220px;
    background:linear-gradient(90deg, transparent, rgba(138,90,16,0.16), transparent); pointer-events:none; }
</style>
<div id="root" data-composition-id="g-cite-warning" data-width="1920" data-height="1080">
  <div class="g-cite-warning-card glasscard" id="g-cite-warning-card">
    <div class="g-cite-warning-beam" id="g-cite-warning-beam"></div>
    <div class="g-cite-warning-sweep" id="g-cite-warning-sweep"><div class="g-cite-warning-sweepdot" id="g-cite-warning-sweepdot"></div></div>
    <div class="g-cite-warning-eyebrow" id="g-cite-warning-eyebrow">WSO CINCINNATI &middot; TORNADO WARNING &middot; 4:05 PM EDT</div>
    <div class="g-cite-warning-claim" id="g-cite-warning-claim">&ldquo;based again on hook echoes on CVG Radar and Indiana NAWAS reports of funnels&rdquo;</div>
    <div class="g-cite-warning-marker" id="g-cite-warning-marker">VERBATIM</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  /* CUES.fourofive: audio/a3-s2.words.json not present on disk right now (segment mid-regeneration).
     PROVISIONAL: word position of "four oh five" (word ~54 of ~148 in the current a3-s2.txt) at
     manifest wpm 202.0 puts it ~1/3 into the ~38s segment — this comp mounts starting there, so
     local time 0 = CUES.fourofive. */
  const DUR = 8.0;
  const tl = gsap.timeline({ paused: true });
  const P = "#g-cite-warning-";
  tl.fromTo(P+"card", { autoAlpha: 0, scale: 1.06 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 0);
  /* continuous element: slow light sweep along the top border for the whole duration */
  tl.fromTo(P+"sweep", { left: -220 }, { left: 1340, duration: DUR, ease: "none" }, 0);
  /* ambient blip: finite pulse on the sweep's leading dot, sized to DUR (never repeat:-1) */
  tl.fromTo(P+"sweepdot", { scale: 1, autoAlpha: 0.6 }, { scale: 1.6, autoAlpha: 1, duration: 0.4,
    ease: "sine.inOut", yoyo: true, repeat: Math.ceil(DUR / 0.4) + 2 }, 0.1);
  /* wide light beam, full card width and back, continuously for the whole window */
  tl.fromTo(P+"beam", { left: -220 }, { left: 1340, duration: 2.4, ease: "none",
    repeat: Math.ceil(DUR / 2.4) + 1 }, 0);
  tl.to(P+"card", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, DUR - 0.5);
  window.__timelines["g-cite-warning"] = tl;
})();
</script>
</template>
</body>
</html>
