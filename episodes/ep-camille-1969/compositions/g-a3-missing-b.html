<template>
<style>

<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const DUR = 14.4;
  /* all cues are a3-s7.words.json time minus the 2.50 s OFFSET (see header) */
  const aShaft = document.querySelector("#bm-ashaft"), aHead = document.querySelector("#bm-ahead");
  const sLen = Math.ceil(aShaft.getTotalLength()) + 1, hLen = Math.ceil(aHead.getTotalLength()) + 1;
  gsap.set("#bm-ashaft", { strokeDasharray: sLen, strokeDashoffset: sLen });
  gsap.set("#bm-ahead", { strokeDasharray: hLen, strokeDashoffset: hLen });
  tl.set(["#bm-st1", "#bm-st2", "#bm-src1", "#bm-src2", "#bm-v109", "#bm-vc"], { autoAlpha: 0 }, 0);

  tl.fromTo("#bm-scan", { x: -40 }, { x: 1560, duration: DUR, ease: "none" }, 0);
  /* the panels are on from frame 0 (the hard cut lands on the opening state); the rule draws and the slot pulses */
  tl.fromTo("#bm-rl", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.05);
  tl.fromTo("#bm-rr", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.2);
  tl.fromTo("#bm-sl", { opacity: 0.35 }, { opacity: 1, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.3);
  /* stamp + AP source on "Associated" @0.52 */
  tl.fromTo("#bm-st1", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.52);
  tl.fromTo("#bm-src1", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.72);
  /* 110+ -> 109 on "109." @2.02 */

  tl.fromTo("#bm-v109", { autoAlpha: 0, y: 70 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "back.out(2)" }, 2.22);
  /* UPI: stamp + source swap on "United" @4.52 */
  tl.to(["#bm-st1", "#bm-src1"], { x: -980, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 4.3);
  tl.fromTo("#bm-st2", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.52);
  tl.fromTo("#bm-src2", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.72);
  /* 109 -> 89 on "89." @5.68 (counts down) */
  const cnt = { v: 109 };
  tl.to("#bm-v109", { autoAlpha: 0, duration: 0.15 }, 5.6);
  tl.set("#bm-vc", { autoAlpha: 1 }, 5.68);
  tl.to(cnt, { v: 89, duration: 1.0, ease: "power3.out", onUpdate: () => { document.querySelector("#bm-vc").textContent = Math.round(cnt.v); } }, 5.68);
  tl.fromTo("#bm-vc", { scale: 1.12 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 6.7);
  /* KNOWN LOST arrow climbs on "kept climbing" @12.80 (no number) */
  tl.set("#bm-sl", { opacity: 1 }, 12.8);
  tl.to("#bm-ashaft", { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 12.8);
  tl.to("#bm-ahead", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 13.0);
  tl.fromTo("#bm-arrow", { y: 40 }, { y: -14, duration: 1.0, ease: "power3.out" }, 12.8);
  /* float so the hold keeps moving */
  tl.fromTo(["#bm-pl", "#bm-pr"], { y: 0 }, { y: -6, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 7 }, 2.8);
  /* exit, last 0.6 s */
  tl.to("#bm-pl", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 13.8);
  tl.to("#bm-pr", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 13.8);
  tl.to(["#bm-st2", "#bm-src2"], { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 13.8);
  window.__timelines["g-a3-missing-b"] = tl;
})();
</script>
