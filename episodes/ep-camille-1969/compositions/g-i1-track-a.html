  let toLF = 0; for (let i = 0; i < 3; i++) toLF += seg[i];
  const fLF = toLF / tot;
  const clamp = (u) => Math.max(0, Math.min(1, u));
  const o2 = gsap.parseEase("power2.out");
  function headAt(f) {
    let d = f * tot, pts = [TR[0]], i = 0;
    while (i < seg.length && d > seg[i]) { d -= seg[i]; i++; pts.push(TR[i]); }
    if (i >= seg.length) return { pts: pts, head: TR[TR.length - 1] };
    const a = TR[i], b = TR[i + 1], u = d / seg[i], h = [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u];
    pts.push(h); return { pts: pts, head: h };
  }
  const scr = (c, p) => [(p[0] - c.cx) * c.s + c.sx, (p[1] - c.cy) * c.s + c.sy];
  function frame(t) {
    // slow push toward the 06Z point (about 8 % over the beat, linear: a small move)
    const k = 1 + 0.08 * clamp(t / END);
    const c = { s: V0.s * k, cx: V0.cx + (TR[TR.length - 1][0] - V0.cx) * 0.3 * clamp(t / END), cy: V0.cy + (TR[TR.length - 1][1] - V0.cy) * 0.3 * clamp(t / END), sx: V0.sx, sy: V0.sy };
    gsap.set(P + "cam", { attr: { transform: "translate(" + c.sx + " " + c.sy + ") scale(" + c.s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")" } });
    // reaches the landfall point on "ashore", then edges inland toward the 06Z point so the Waveland marker shows
    const f = t < C.ashore ? fLF * o2(clamp((t - 0.3) / (C.ashore - 0.3))) : fLF + (1 - fLF) * 0.6 * clamp((t - C.ashore) / (END - C.ashore));
    const h = headAt(f);
    const sp = h.pts.map(p => scr(c, p));
    gsap.set(P + "track", { attr: { d: "M" + sp.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") } });
    const hp = scr(c, h.head);
    gsap.set(P + "sym", { attr: { transform: "translate(" + hp[0].toFixed(1) + " " + hp[1].toFixed(1) + ") rotate(" + (-t * 140).toFixed(1) + ")" } });
    const wp = scr(c, WAV);
    gsap.set(P + "wav", { attr: { transform: "translate(" + wp[0].toFixed(1) + " " + wp[1].toFixed(1) + ")" } });
  }
  const clk = { t: 0 };
  tl.to(clk, { t: END, duration: END, ease: "none", onUpdate: function () { frame(clk.t); } }, 0);
  tl.to(P + "time", { y: -2, duration: 0.3, ease: "sine.inOut" }, END); /* host 6.24: timeline must outlast it */
  tl.set([P + "date", P + "time"], { autoAlpha: 0 }, 0);
  tl.to(P + "wav", { opacity: 1, duration: 0.35, ease: "power2.out" }, C.ashore);
  tl.fromTo(P + "wav-ring", { attr: { r: 6 } }, { attr: { r: 22 }, duration: 0.9, ease: "power2.out", repeat: 2 }, C.ashore);
  tl.fromTo(P + "date", { autoAlpha: 0, scale: 0.8 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)", transformOrigin: "left center" }, C.august);
  tl.fromTo(P + "time", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.august + 0.35);
  frame(0);
  window.__timelines["g-i1-track-a"] = tl;
})();
</script>
