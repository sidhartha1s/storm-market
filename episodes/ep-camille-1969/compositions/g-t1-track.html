    const tf = { attr: { transform: "translate(" + c.sx + " " + c.sy + ") scale(" + c.s + ") translate(" + (-c.cx) + " " + (-c.cy) + ")" } };
    gsap.set(P + "cam", tf); gsap.set(P + "cam2", { attr: { transform: tf.attr.transform } });
    const f = o3(clamp((t - C.hurricane) / 1.9));
    const h = headAt(f);
    const sp = h.pts.map(p => svg(c, p));
    gsap.set(P + "track", { attr: { d: f > 0 ? "M" + sp.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L") : "" } });
    const hp = svg(c, h.head);
    const symOn = t >= C.hurricane - 0.2 && t < C.nelson + 0.6 ? 1 : Math.max(0, 1 - (t - C.nelson - 0.6) / 0.4);
    gsap.set(P + "sym", { attr: { transform: "translate(" + hp[0].toFixed(1) + " " + hp[1].toFixed(1) + ") rotate(" + (-t * 140).toFixed(1) + ")" }, opacity: t < C.hurricane - 0.2 ? 0 : symOn });
    gsap.set(P + "hu", { opacity: h.st === "HU" ? 1 : 0 });
    gsap.set(P + "ts", { opacity: h.st === "TS" ? 1 : 0 });
    gsap.set(P + "td", { opacity: h.st === "TD" ? 1 : 0 });
    gsap.set(P + "track", { opacity: t < C.nelson + 0.8 ? 1 : Math.max(0.35, 1 - (t - C.nelson - 0.8) / 0.6) });
  }
  const clk = { t: 0 };
  tl.to(clk, { t: END, duration: END, ease: "none", onUpdate: function () { frame(clk.t); } }, 0);
  // rivers and outline draw once the push lands
  const RL = { tye: 760, rock: 618, james: 3412 };   // ceil(len)+1 from nelson-px.json river_len
  tl.set(P + "tye", { strokeDasharray: RL.tye, strokeDashoffset: RL.tye }, 0);
  tl.set(P + "rock", { strokeDasharray: RL.rock, strokeDashoffset: RL.rock }, 0);
  tl.set(P + "james", { strokeDasharray: RL.james, strokeDashoffset: RL.james }, 0);
  tl.set(P + "nelson", { opacity: 0 }, 0);
  tl.set([P + "nlab", P + "gauge"], { autoAlpha: 0 }, 0);
  tl.to(P + "nelson", { opacity: 1, duration: 0.6, ease: "power2.out" }, C.nelson + 1.0);
  tl.to(P + "tye", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, C.virginia);
  tl.to(P + "rock", { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, C.virginia + 0.15);
  tl.to(P + "james", { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, C.virginia + 0.1);
  tl.fromTo(P + "nlab", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.virginia);
  tl.fromTo(P + "gauge", { autoAlpha: 0, scale: 0.7 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, C.how);
  tl.to(P + "gauge", { y: -3, duration: 0.35, ease: "sine.inOut" }, END); /* host 8.033: timeline must outlast it */
  frame(0);
  window.__timelines["g-t1-track"] = tl;
})();
</script>
</template>
