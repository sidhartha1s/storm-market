    { attr: { d: "M1330,641 L1400,641 L1385,670 L1345,670 Z" }, fill: "#6b4f35", duration: 0.5, ease: "power3.out" }, CUES.creek + 0.3);

    tl.fromTo(l, { x: 0, rotation: i * 25, svgOrigin: "0 0" }, { x: 420, rotation: i * 25 + 140, svgOrigin: "0 0", duration: SLOW, ease: "none", repeat: Math.ceil((DUR - tSlow) / SLOW) }, tSlow + off);
  });
  tl.fromTo(P + "flow", { strokeDashoffset: 0, autoAlpha: 0 }, { strokeDashoffset: -52 * Math.round((tSlow - CUES.surge) / 0.35), autoAlpha: 1, duration: tSlow - CUES.surge, ease: "none" }, CUES.surge);
  tl.fromTo(P + "flow", { strokeDashoffset: 0 }, { strokeDashoffset: -52 * Math.round((DUR - tSlow) / 0.875), duration: DUR - tSlow, ease: "none" }, tSlow);

  /* WOODS MILL: the gauge staff, then the water climbs 5 ticks on "5 ... 20" */
