<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const DUR = 14.8;
  /* mark drop times (s): Floyd's slide 2.2 3.5 4.6 · "People said ... more often" 6.5 7.4 7.9 8.4 8.8 9.1 9.4 · "four" 11.3 · after the mist, two more 12.9 13.5 */
  const T = [2.2, 3.5, 4.6, 6.5, 7.4, 7.9, 8.4, 8.8, 9.1, 9.4, 11.3, 12.9, 13.5];
  tl.set(["#ack-chip", "#ack-stamp"], { autoAlpha: 0 }, 0);

  tl.set("#ack-axis", { attr: { x2: 200 } }, 0);

  tl.fromTo("#ack-scan", { x: -40 }, { x: 1560, duration: DUR, ease: "none" }, 0);
  /* axis draws on "B. R." and runs to "Floyd" */
  tl.to("#ack-axis", { attr: { x2: 1400 }, duration: 1.9, ease: "power3.out" }, 0.1);
  tl.fromTo("#ack-hollow", { opacity: 0.25 }, { opacity: 0.6, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.2);
  T.forEach((t, i) => {
    const n = i + 1;
    const cx = document.querySelector("#ack-r" + n).getAttribute("cx");
    tl.set("#ack-m" + n, { svgOrigin: cx + " 850" }, 0);
    tl.set("#ack-r" + n, { svgOrigin: cx + " 820" }, 0);
    tl.fromTo("#ack-m" + n, { autoAlpha: 0, scaleY: 0 }, { autoAlpha: 1, scaleY: 1, duration: 0.3, ease: "back.out(2)" }, t);
    tl.fromTo("#ack-d" + n, { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, t);
    tl.fromTo("#ack-r" + n, { autoAlpha: 0.9, scale: 1 }, { autoAlpha: 0, scale: 4, duration: 0.7, ease: "power2.out" }, t + 0.1);
  });
  /* chip on "three minutes" @5.06 */
  tl.fromTo("#ack-chip", { autoAlpha: 0, scale: 0.8, transformOrigin: "0% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 5.06);
  tl.to("#ack-chip", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 9.8);
  /* stamp on "four in the morning" @11.28 */

  tl.fromTo("#ack-stamp", { y: 0 }, { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.9);
  /* exit, last 0.6 s */

  tl.to(["#ack-marks", "#ack-axis"], { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 14.2);

})();
