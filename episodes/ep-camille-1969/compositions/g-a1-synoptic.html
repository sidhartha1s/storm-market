  }
  const PIV = "1204.8 482.2"; /* Massies Mill (USGS GNIS 1495911), the push pivot */
  const dash = (sel) => { const el = $(sel); const L = Math.ceil(el.getTotalLength()) + 1;
    tl.set(el, { strokeDasharray: L + " " + L, strokeDashoffset: L }, 0); return L; };

  /* opening state */
  tl.set("#syn-cam", { scale: 1, svgOrigin: PIV }, 0);
  tl.set("#syn-sw-pos", { x: 330, y: 527.3 }, 0);
  tl.set("#syn-sw-tight", { scale: 0, svgOrigin: "0 0" }, 0);
  tl.set("#syn-sw-rot", { rotation: 0, svgOrigin: "0 0" }, 0);
  tl.set("#syn-band", { x: -70, y: -120, autoAlpha: 0 }, 0);
  tl.set(["#syn-sw-pos", "#syn-trk0", "#syn-trk1", "#syn-head", "#syn-inflow", "#syn-moist", "#syn-ah1", "#syn-ah2", "#syn-ah3", "#syn-headtip", "#syn-d-roa", "#syn-d-lyn", "#syn-rring-g", "#syn-rdot", "#syn-lead"], { autoAlpha: 0 }, 0);
  tl.set("#syn-moist", { x: 0, y: 0, scale: 0.8, svgOrigin: "1430 650" }, 0);
  tl.set("#syn-br", { autoAlpha: 0.35 }, 0);
  const L0 = dash("#syn-trk0"), L1 = dash("#syn-trk1"), LH = dash("#syn-head-m");
  const LI = ["#syn-in1", "#syn-in2", "#syn-in3"].map(dash);

  /* the spin runs the whole window (counterclockwise, northern hemisphere) */
  tl.to("#syn-sw-rot", { rotation: -900, duration: DUR, ease: "none" }, 0);
  tl.to("#syn-src", { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 0.6);

  /* EIGHT @0.3: 8 PM, the remnant over Kentucky (HURDAT2 20 Aug 00Z, 37.6N 84.0W) */
  tl.fromTo("#syn-st-8", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.eight);
  tl.to("#syn-trk0", { autoAlpha: 1, duration: 0.05 }, C.eight);
  tl.to("#syn-sw-pos", { autoAlpha: 1, duration: 0.05 }, C.eight + 0.5);
  tl.to("#syn-trk0", { strokeDashoffset: 0, duration: 0.9, ease: "power2.out" }, C.eight);
  tl.to("#syn-sw-tight", { scale: 1, duration: 0.8, ease: "back.out(1.8)" }, C.eight + 0.5);
  tl.fromTo("#syn-t-ky", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.eight + 0.9);
  tl.fromTo("#syn-t-rem", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.eight + 1.5);

  /* BAND @7.7: the band of heavy storms is already over Virginia, pushed in from the north and northwest */
  tl.to("#syn-band", { x: 0, y: 0, autoAlpha: 1, duration: 1.6, ease: "power2.out" }, C.band);
  ["#syn-c1", "#syn-c2", "#syn-c3", "#syn-c4", "#syn-c5", "#syn-c6", "#syn-c7", "#syn-c8"].forEach((s, i) => {
    const e = $(s), rx = +e.getAttribute("rx"), ry = +e.getAttribute("ry");

      ease: "sine.inOut", yoyo: true, repeat: Math.floor((DUR - C.band) / (1.1 + (i % 3) * 0.2)) - 1 }, C.band + 0.2 + i * 0.13);
  });
  tl.fromTo("#syn-t-band", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, C.band + 1.0);

  /* NEAR MIDNIGHT @11.9: the centre crosses into Virginia along HURDAT2 (interpolated KY/VA/WV line at about 11:30 PM) */
  tl.to("#syn-st-8", { autoAlpha: 0, y: -20, duration: 0.35, ease: "power2.in" }, C.mid - 0.4);
  tl.fromTo("#syn-st-mid", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.mid);
  tl.to("#syn-t-rem", { autoAlpha: 0, duration: 0.3 }, C.mid - 0.3);
  tl.to("#syn-sw-pos", { x: 677.1, y: 557.0, duration: 2.4, ease: "power1.inOut" }, C.mid);
  tl.to("#syn-trk1", { autoAlpha: 1, duration: 0.05 }, C.mid);
  tl.to("#syn-trk1", { strokeDashoffset: L1 - 348.9 * L1 / 437.9, duration: 2.4, ease: "power1.inOut" }, C.mid);
  tl.to("#syn-sw-pos", { x: 766.3, y: 564.6, duration: C.fast - C.stren, ease: "none" }, C.mid + 2.4);
  tl.to("#syn-trk1", { strokeDashoffset: 0, duration: C.fast - C.stren, ease: "none" }, C.mid + 2.4);
  tl.fromTo("#syn-t-va", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, C.mid + 1.6);
  tl.fromTo(["#syn-d-roa", "#syn-d-lyn"], { autoAlpha: 0, attr: { r: 0 } }, { autoAlpha: 1, attr: { r: 6 }, duration: 0.4, ease: "back.out(2.5)", stagger: 0.25 }, C.mid + 0.6);
  tl.fromTo("#syn-t-roa", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.mid + 0.8);
  tl.fromTo("#syn-t-lyn", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.mid + 1.05);
  /* STRENGTHEN @14.3: the swirl tightens; the 1970 track runs on south of Roanoke and Lynchburg */
  tl.to("#syn-sw-tight", { scale: 0.85, duration: 1.2, ease: "power2.out" }, C.stren);
  tl.to("#syn-head", { autoAlpha: 1, duration: 0.05 }, C.stren + 0.3);
  tl.to("#syn-head-m", { strokeDashoffset: 0, duration: 1.6, ease: "power2.inOut" }, C.stren + 0.3);
  tl.fromTo("#syn-headtip", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, C.stren + 1.8);

  /* SOUTHEAST @17.8: moist air southeast of Nelson, pulled northwest toward it */
  tl.to("#syn-moist", { autoAlpha: 1, scale: 1, duration: 1.2, ease: "power2.out" }, C.se);
  tl.to("#syn-moist", { x: -34, y: -26, duration: DUR - C.se - 1.2, ease: "none" }, C.se + 1.2);
  tl.to("#syn-inflow", { autoAlpha: 1, duration: 0.05 }, C.se + 0.3);
  ["#syn-in1", "#syn-in2", "#syn-in3"].forEach((s, i) => {
    tl.to(s, { strokeDashoffset: 0, duration: 1.1, ease: "power2.inOut" }, C.se + 0.3 + i * 0.25);

  tl.fromTo("#syn-t-moist", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, C.se + 1.0);

  tl.to("#syn-br", { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, C.br);

  tl.to(["#syn-t-ky", "#syn-t-va", "#syn-t-band", "#syn-t-roa", "#syn-t-lyn", "#syn-t-moist", "#syn-t-br"], { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, C.fast - 0.5);
  tl.to("#syn-band", { autoAlpha: 0.55, duration: 0.8 }, C.fast - 0.3);
  tl.to(["#syn-band-edge", "#syn-br", "#syn-d-roa", "#syn-d-lyn"], { autoAlpha: 0, duration: 0.6 }, C.fast - 0.5);

  tl.to(["#syn-inflow", "#syn-ah1", "#syn-ah2", "#syn-ah3", "#syn-moist"], { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, C.fast - 0.5);

  tl.fromTo("#syn-t-tye", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, C.fast + 2.0);

  tl.fromTo("#syn-rdot", { autoAlpha: 0, attr: { r: 0 } }, { autoAlpha: 1, attr: { r: 9 }, duration: 0.45, ease: "back.out(2.5)" }, C.raines);

  logZoom("#syn-cam", C.fast + 1.9, DUR - C.fast - 1.9, 2.6, 2.72, "sine.out", PIV);

  window.__timelines[ID] = tl;
