<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-i1-gulf: I1-S1 second sentence ("A hundred forty-three people lost their lives on the Gulf Coast."), glass bar over M01 (NARA Gulfport/Biloxi).
     Comp time 0 = first word of that second sentence. Cues are estimated (words.json for I1-S1 not on disk yet): CUE-PENDING.
     One bar only (no Virginia bar). Bar track is a fixed 600 px. Presenter corner x >= 1600, y >= 680 stays empty. */
  #g-i1-gulf-root { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif; color:#f2f5f8; }
  .i1g-card { position:absolute; left:96px; top:700px; width:900px; height:290px; box-sizing:border-box;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; box-shadow:inset 0 1px 0 rgba(255,255,255,0.10); }
  .i1g-lab { position:absolute; left:48px; top:34px; font-weight:700; font-size:34px; letter-spacing:6px; color:#c8d3e0; white-space:nowrap; }
  .i1g-track { position:absolute; left:48px; top:112px; width:600px; height:56px; background:rgba(255,255,255,0.10); border-radius:6px; }
  .i1g-fill { position:absolute; left:48px; top:112px; width:600px; height:56px; border-radius:6px; transform-origin:left center;
    background:linear-gradient(90deg, #8e2020, #c0392b 70%, #e74c3c); box-shadow:0 0 30px rgba(231,76,60,0.45); }
  .i1g-sheen { position:absolute; left:48px; top:112px; width:140px; height:56px; border-radius:6px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.28), rgba(255,255,255,0)); }
  .i1g-val { position:absolute; left:676px; top:84px; font-family:'Courier New', monospace; font-weight:700; font-size:110px; line-height:110px; color:#e74c3c; text-shadow:0 2px 14px rgba(0,0,0,0.6); }
  .i1g-src { position:absolute; left:48px; bottom:34px; font-weight:700; font-size:22px; letter-spacing:4px; color:#93a3b2; }
</style>
<div id="g-i1-gulf-root" data-composition-id="g-i1-gulf" data-width="1920" data-height="1080" data-duration="3.7">
  <div class="i1g-card" id="i1g-card">
    <div class="i1g-lab" id="i1g-lab">Gulf Coast</div>
    <div class="i1g-track" id="i1g-track"></div>
    <div class="i1g-fill" id="i1g-fill"></div>
    <div class="i1g-sheen" id="i1g-sheen"></div>
    <div class="i1g-val" id="i1g-val">0</div>
    <div class="i1g-src" id="i1g-src">NWS</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const cnt = { v: 0 };
  const val = document.getElementById("i1g-val");
  tl.set(["#i1g-card", "#i1g-lab", "#i1g-val", "#i1g-src", "#i1g-sheen"], { autoAlpha: 0 }, 0);
  tl.set("#i1g-fill", { scaleX: 0, transformOrigin: "left center" }, 0);

  /* "hundred forty-three" @0.35 (CUE-PENDING 143): card in, bar fills to 600 px, counter lands on 143 */
  tl.fromTo("#i1g-card", { autoAlpha: 0, x: -140 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2);
  tl.fromTo("#i1g-lab", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.45);
  tl.fromTo("#i1g-val", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "power2.out" }, 0.6);
  tl.to("#i1g-fill", { scaleX: 1, duration: 1.3, ease: "power3.out" }, 0.6);
  tl.to(cnt, { v: 143, duration: 1.3, ease: "power3.out", onUpdate: () => { val.textContent = String(Math.round(cnt.v)); } }, 0.6);
  tl.fromTo("#i1g-src", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 1.9);
  /* light sweep across the finished bar, then the whole card floats */
  tl.fromTo("#i1g-sheen", { autoAlpha: 1, x: 0 }, { x: 460, duration: 1.4, ease: "power1.inOut" }, 1.9);
  tl.fromTo("#i1g-card", { y: 0 }, { y: -8, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.9);
  /* exit, last 0.6 s */
  tl.to("#i1g-card", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 2.67);
  window.__timelines["g-i1-gulf"] = tl;
})();
</script>
</template>
</body>
</html>
