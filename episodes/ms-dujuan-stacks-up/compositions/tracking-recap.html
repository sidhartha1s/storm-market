<template>

<script>
window.__timelines = window.__timelines || {};
(function () {

  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#tr-r2","#tr-hl"], { visibility: "hidden", autoAlpha: 0 }, 0);
  tl.fromTo("#tr-card", { autoAlpha:0, scale:0.94 }, { autoAlpha:1, scale:1, duration:0.6, ease:"power3.out" }, 0);
