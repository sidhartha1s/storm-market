    tl.to(H, { n: hpa, duration: 0.9, ease: "power1.out", onUpdate: () => hpaEl.textContent = Math.round(H.n) }, at + 0.15);
    tl.to(M, { n: mph, duration: 0.9, ease: "power1.out", onUpdate: () => mphEl.textContent = Math.round(M.n) }, at + 0.15);
    /* continuous ambient motion on the row once it lands, so no row sits perfectly frozen through the rest of the hold */
    tl.to(id, { y: -3, duration: 2.6, ease: "sine.inOut", repeat: repeatsToFit(at + 1.1, 2.6), yoyo: true }, at + 1.1);
  }
  landRow("#bt-r1", 14.36, 940, 105);
