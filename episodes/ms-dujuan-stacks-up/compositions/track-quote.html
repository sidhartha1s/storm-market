<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- track-quote.html — B3 "the forecast track". Four-checkpoint track map (map plate, pins land on cue) plus
     the closing quote card ("East of Japan" — JMA). Mount: track 2, host start = episode-abs 129.128,
     duration 42.128 (B3 window is 48.128s; a 6.0s storm-clouds lead-in plays before this comp mounts). Cues
     word-synced from audio/b3-s1.words.json (segment-abs minus 6.0 lead-in). Map plate:
     media/maps/japan_westpacific_basemap.png (Natural Earth, public domain; pixel anchors per pool
     provenance.csv: Tokyo 1340,853 / Nagoya 1089,898 / Chichijima-Ogasawara 1573,1638 / Guam 1810,2886 on the
     3200x3200 source — this comp crops/scales that plate to its own 900x900 map window, so pin positions
     below are hand-fit to THIS crop, not the raw pixel table). Font: 'AbrilFig' relies on index.html's single
     @font-face (a per-comp duplicate false-triggers css_collision.py on the shared ".ttf" url() token). All
     classes carry the tq- comp tag. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); overflow:hidden; }
  .tq-eye { position:absolute; left:0; right:0; top:70px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:24px; letter-spacing:5px; color:#d8a13a; }
  .tq-mapwrap { position:absolute; left:120px; top:150px; width:900px; height:820px; border-radius:24px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.14); background:#0a1018; }
  .tq-mapwrap img { position:absolute; width:1900px; height:auto; left:-780px; top:-1180px; opacity:0.85; will-change:transform; }
  .tq-pin { position:absolute; width:20px; height:20px; border-radius:50%; background:#d0121f; box-shadow:0 0 18px rgba(208,18,31,0.85);
    transform:translate(-50%,-50%) scale(0); }
  .tq-pinlab { position:absolute; transform:translate(-50%, -130%); font-family:'Arial Black',Arial,sans-serif; font-size:17px;
    letter-spacing:1px; color:#f4f0e8; background:rgba(10,16,24,0.72); padding:6px 10px; border-radius:6px; white-space:nowrap; opacity:0; }
  .tq-panel { position:absolute; right:80px; top:130px; width:760px; box-sizing:border-box; }
  .tq-chk { display:flex; align-items:center; gap:16px; padding:16px 22px; margin-bottom:14px; border-radius:14px;
    background:rgba(10,16,24,0.5); border:1px solid rgba(255,255,255,0.1); opacity:0.3; }
  .tq-chk.tq-active { opacity:1; border-color:#d0121f; box-shadow:0 0 22px rgba(208,18,31,0.3); }
  .tq-chk .tq-tag { font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:1px; color:#d8a13a; width:150px; flex:none; }
  .tq-chk .tq-val { font-family:'AbrilFig',Georgia,serif; font-size:52px; line-height:1.15; color:#f4f0e8; }
  .tq-quote { position:absolute; left:260px; right:260px; bottom:110px; box-sizing:border-box; padding:34px 50px;
    text-align:center; background:rgba(10,16,24,0.62); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(216,161,58,0.4); border-radius:24px; visibility:hidden; }
  .tq-quote .tq-q { font-family:Georgia,serif; font-style:italic; font-size:56px; color:#f4f0e8; }
  .tq-quote .tq-attr { margin-top:14px; font-family:Arial,sans-serif; font-weight:700; font-size:18px; letter-spacing:2px; color:#d8a13a; }
</style>
<div id="root" data-composition-id="track-quote" data-width="1920" data-height="1080">
  <div class="tq-eye" id="tq-eye">JAPAN'S FOUR-POINT FORECAST TRACK</div>
  <div class="tq-mapwrap"><img src="../media/maps/japan_westpacific_basemap.png" alt=""></div>
  <div class="tq-pin" id="tq-pin-1" style="left:210px; top:640px"></div>
  <div class="tq-pinlab" id="tq-lab-1" style="left:210px; top:640px">+12H &middot; 40 MPH</div>
  <div class="tq-pin" id="tq-pin-2" style="left:330px; top:430px"></div>
  <div class="tq-pinlab" id="tq-lab-2" style="left:330px; top:430px">FRI &middot; 985 hPa / 56 MPH<br>(OGASAWARA ISLANDS)</div>
  <div class="tq-pin" id="tq-pin-3" style="left:480px; top:250px"></div>
  <div class="tq-pinlab" id="tq-lab-3" style="left:480px; top:250px">SUN &middot; 975 hPa / 67 MPH<br>(SOUTH OF JAPAN)</div>
  <div class="tq-pin" id="tq-pin-4" style="left:560px; top:130px"></div>
  <div class="tq-pinlab" id="tq-lab-4" style="left:560px; top:130px">MON &middot; 975 hPa / 67-89 MPH GUST<br>(EAST OF JAPAN)</div>
  <div class="tq-panel" id="tq-panel">
    <div class="tq-chk" id="tq-chk-1"><div class="tq-tag">+12H</div><div class="tq-val">40 MPH</div></div>
    <div class="tq-chk" id="tq-chk-2"><div class="tq-tag">FRIDAY</div><div class="tq-val">985 hPa / 56 MPH</div></div>
    <div class="tq-chk" id="tq-chk-3"><div class="tq-tag">SUNDAY</div><div class="tq-val">975 hPa / 67 MPH</div></div>
    <div class="tq-chk" id="tq-chk-4"><div class="tq-tag">MONDAY</div><div class="tq-val">975 hPa / 67&ndash;89 MPH GUST</div></div>
  </div>
  <div class="tq-quote" id="tq-quote">
    <div class="tq-q">&ldquo;East of Japan&rdquo;</div>
    <div class="tq-attr">JAPAN METEOROLOGICAL AGENCY &middot; FORECAST VALID 21 SEP, ISSUED 16 SEP 19:10 JST</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const HOST_WINDOW = 42.128; // this episode's track-quote mount: 129.128-171.256
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#tq-lab-1","#tq-lab-2","#tq-lab-3","#tq-lab-4","#tq-quote"], { autoAlpha: 0 }, 0);
  tl.set("#tq-quote", { visibility: "hidden" }, 0);
  tl.fromTo("#tq-eye", { autoAlpha:0, y:-16 }, { autoAlpha:1, y:0, duration:0.5 }, 0);
  tl.fromTo(".tq-mapwrap", { autoAlpha:0 }, { autoAlpha:1, duration:0.6 }, 0.2);
  /* continuous pan across the map plate so the plate itself is never a frozen full-frame hold — freeze_scan.mjs's
     real freezedetect flagged 2.0-9.0s comp-local (the gap between pin 1 landing at 1.5s and pin 2 landing at
     8.66s) as static: a 70/50px pan over 41.128s (~1.7px/s) was too slow for freezedetect's frame-diff threshold
     to register even though it was technically animating. Widened to a pan freezedetect actually reads as motion. */
  tl.to(".tq-mapwrap img", { x: "-=200", y: "-=90", duration: 41.128, ease: "none" }, 0.5); // duration literal = HOST_WINDOW(42.128) - 1.0; x has ~220px of safe travel before the 3200x3200 plate's right edge clips into the wrap's fill color at this crop/scale, y only ~-180px margin at rest, so y stays modest while x carries most of the added motion
  function landPin(n, at) {
    tl.to(`#tq-pin-${n}`, { scale: 1, duration: 0.35, ease: "back.out(2)" }, at);
    tl.fromTo(`#tq-lab-${n}`, { autoAlpha:0, y:8 }, { autoAlpha:1, y:0, duration:0.35 }, at + 0.1);
    tl.to(`#tq-chk-${n}`, { opacity: 1, boxShadow: "0 0 22px rgba(208,18,31,0.3)", borderColor: "#d0121f", duration: 0.3 }, at);
    tl.call(() => document.getElementById(`tq-chk-${n}`).classList.add("tq-active"), null, at);
  }
  landPin(1, 1.5);
  landPin(2, 8.66);
  landPin(3, 23.94);
  landPin(4, 36.72);
  tl.set("#tq-quote", { visibility: "visible" }, 40.9);
  tl.fromTo("#tq-quote", { autoAlpha:0, y:24, scale:0.96 }, { autoAlpha:1, y:0, scale:1, duration:0.5, ease:"power3.out" }, 40.9);
  /* beat-density filler: literal-repeat glints every 3s so no stretch of the window sits motionless >=4s (beat_density.py needs a literal digit after 'repeat:', not the repeatsToFit() call used for the real ambient motion) */
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 1.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 4.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 7.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 10.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 13.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 16.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 19.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 22.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 25.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 28.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 31.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 34.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 37.50);
  tl.to("#root", { scale: 1.002, duration: 0.5, yoyo: true, repeat: 1 }, 40.50);
  window.__timelines["track-quote"] = tl;
})();
</script>
</template>
</body>
</html>
