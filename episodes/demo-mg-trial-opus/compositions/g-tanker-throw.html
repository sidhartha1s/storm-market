<script>

(function() {
  const CUES = { cars: 2.37, one: 3.9, lb: 4.75, thrown: 6.03, researchers: 7.55, thr: 10.32, winds: 11.6, went: 12.28, three: 13.13 };
  const DUR = 14.0;
  const tl = gsap.timeline({ paused: true });

  /* continuous wind: 12 streaks cross the sky once each over the whole window (finite, no repeat) */
  const sky = document.getElementById('tt-sky');
  const streaks = [];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.className = 'tt-streak';
    s.style.top = (250 + ((i * 197) % 500)) + 'px';
    s.style.width = (160 + (i * 53) % 220) + 'px';
    s.style.left = (-2200 + i * 190) + 'px';
    sky.appendChild(s);
    streaks.push(s);
  }
  streaks.forEach((s) => { tl.to(s, { x: 3400, duration: 13.9, ease: 'none' }, 0.05); });

  tl.set(['#tt-hdr', '#tt-tag', '#tt-pop33', '#tt-pop72', '#tt-pop475', '#tt-pop3x', '#tt-thrlab', '#tt-washlab', '#tt-landtick', '#tt-credit', '#tt-note'], { autoAlpha: 0 }, 0);
  tl.set(['#tt-band1', '#tt-band2', '#tt-band3'], { autoAlpha: 0 }, 0);
  tl.set(['#tt-dust1', '#tt-dust2', '#tt-dust3'], { autoAlpha: 0, scale: 0.3 }, 0);
  tl.set('#tt-thr', { scaleY: 0 }, 0);
  tl.set('#tt-wash', { scaleX: 0 }, 0);

  /* opening: header, ruler draws, credit; train rocks in the wind ("caught a freight train") */
  tl.fromTo('#tt-hdr', { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: 'power3.out' }, 0.2);
  tl.fromTo('#tt-ruler', { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: 'power3.out' }, 0.4);
  tl.fromTo(['#tt-t0', '#tt-t1', '#tt-t2', '#tt-t3', '#tt-t4', '#tt-t5'], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.3, stagger: 0.1 }, 0.6);
  tl.fromTo(['#tt-credit', '#tt-note'], { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.5 }, 1.0);
  tl.to(['#tt-car1', '#tt-car2', '#tt-tanker'], { rotation: 2.5, duration: 0.35, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 0.2);

  /* CUES.cars — "Thirty-three cars came off the tracks": hoppers topple, tanker jolts */
  tl.to('#tt-car1', { rotation: -24, x: -30, y: 8, duration: 0.5, ease: 'power3.out' }, 2.37);
  tl.to('#tt-car2', { rotation: 16, x: 18, y: 4, duration: 0.5, ease: 'power3.out' }, 2.47);
  tl.to('#tt-tanker', { rotation: -6, x: 6, duration: 0.4, ease: 'power3.out' }, 2.52);
  tl.fromTo('#tt-pop33', { autoAlpha: 0, scale: 2.2 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'power4.in' }, 2.37);
  tl.to('#tt-pop33', { autoAlpha: 0, y: -26, duration: 0.3, ease: 'power2.in' }, 3.75);

  /* CUES.one — "One empty tanker car": highlight + tag */
  tl.to('#tt-tkbody', { attr: { stroke: '#e74c3c' }, duration: 0.3 }, 3.9);
  tl.fromTo('#tt-tanker', { filter: 'drop-shadow(0 0 0px rgba(231,76,60,0))' }, { filter: 'drop-shadow(0 0 14px rgba(231,76,60,0.85))', duration: 0.4 }, 3.9);
  tl.fromTo('#tt-tag', { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 3.95);
  /* CUES.lb — "seventy-two thousand pounds of steel" */
  tl.fromTo('#tt-pop72', { autoAlpha: 0, scale: 2.2 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'power4.in' }, 4.75);
  tl.to('#tt-pop72', { autoAlpha: 0, y: -26, duration: 0.3, ease: 'power2.in' }, 5.7);
  tl.to('#tt-tag', { autoAlpha: 0, y: -12, duration: 0.3, ease: 'power2.in' }, 5.75);

  /* CUES.thrown — the flight. One proxy drives position, tumble, trail and the distance counter so
     the counter always equals the drawn distance: x = 260 + 1218u (to scale), y = 761 - 1120u(1-u). */
  const fly = { u: 0 };
  const tk = document.getElementById('tt-tanker');
  const clip = document.getElementById('tt-cliprect');
  const cnt = document.getElementById('tt-count');
  function flyUpd() {
    const u = fly.u;
    gsap.set(tk, { x: 6 + 1212 * u, y: -1120 * u * (1 - u), rotation: -6 + 348 * u });
    clip.setAttribute('width', String(260 + 1218 * u));
    cnt.textContent = Math.round(475 * u) + ' ft';
  }
  tl.fromTo('#tt-pop475', { autoAlpha: 0, scale: 1.6 }, { autoAlpha: 1, scale: 1, duration: 0.35, ease: 'power3.out' }, 6.03);
  tl.fromTo(fly, { u: 0 }, { u: 1, duration: 1.4, ease: 'power1.out', onUpdate: flyUpd }, 6.03);
  /* landing @7.43: dust, landing tick, a small settle rock */
  tl.fromTo(['#tt-dust1', '#tt-dust2', '#tt-dust3'], { autoAlpha: 0.9, scale: 0.3 }, { autoAlpha: 0, scale: 3.2, duration: 2.4, stagger: 0.12, ease: 'power2.out' }, 7.43);
  tl.fromTo('#tt-landtick', { autoAlpha: 0, scaleY: 0 }, { autoAlpha: 1, scaleY: 1, duration: 0.35, ease: 'power3.out' }, 7.5);
  tl.to('#tt-tanker', { rotation: 336, duration: 0.5, ease: 'back.out(3)' }, 7.43);
  tl.fromTo('#tt-landtick', { scaleY: 1 }, { scaleY: 1.35, duration: 0.5, ease: 'sine.inOut', yoyo: true, repeat: 5 }, 8.0);

  tl.to('#tt-pop475', { autoAlpha: 0, y: -26, duration: 0.3, ease: 'power2.in' }, 9.6);
  /* CUES.thr — "one hundred and sixty-four feet": threshold line rises, band 1 draws track -> line */
  tl.to('#tt-thr', { scaleY: 1, duration: 0.5, ease: 'power3.out' }, 10.32);
  tl.fromTo('#tt-thrlab', { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 10.55);
  tl.fromTo('#tt-band1', { autoAlpha: 1, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: 'power3.out' }, 10.4);
  /* CUES.winds — "takes EF5 winds": everything past the line washes red */
  tl.to('#tt-wash', { scaleX: 1, duration: 0.7, ease: 'power3.out' }, 11.6);
  tl.fromTo('#tt-washlab', { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 11.7);
  /* CUES.went / CUES.three — the same 164 ft laid end to end: two copies slide out of band 1 */
  tl.set(['#tt-band2', '#tt-band3'], { autoAlpha: 1 }, 12.28);
  tl.fromTo('#tt-band2', { x: 0 }, { x: 419.9, duration: 0.4, ease: 'power3.out' }, 12.28);
  tl.fromTo('#tt-band3', { x: 0 }, { x: 839.8, duration: 0.7, ease: 'power3.out' }, 12.28);
  tl.fromTo('#tt-pop3x', { autoAlpha: 0, scale: 2.2 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'power4.in' }, 13.0);

  /* exit, last 0.6 s: upper layer slides right, the ground diagram drops away (never a vanish) */
  tl.to(['#tt-hdr', '#tt-pop3x', '#tt-thrlab', '#tt-thr', '#tt-wash', '#tt-washlab'], { x: 980, autoAlpha: 0, duration: 0.6, ease: 'power3.in' }, 13.4);
  tl.to(['#tt-diagram', '#tt-tanker', '#tt-credit', '#tt-note', '.tt-arc', '#tt-landtick'], { y: 320, autoAlpha: 0, duration: 0.6, ease: 'power3.in' }, 13.4);
  tl.to({}, { duration: 0.01 }, 13.99);

  window.__timelines['g-tanker-throw'] = tl;
})();
