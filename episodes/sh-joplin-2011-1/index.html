<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920">
  <title>135 Were Inside. The Warning Hour short (sh-joplin-2011-1, 17 Oct 26)</title>
  <script src="gsap.min.js"></script>
  <style>
    body { margin: 0; background: #000; font-family: Arial, sans-serif; }
    #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #04070c; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .clip { position: absolute; inset: 0; }
    .still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    @font-face { font-family: 'AbrilFig'; src: url('fonts/AbrilFatface-Regular.ttf'); }

    /* one card at a time, top zone above the picture band: one big line, one small support line */
    .quotecard { position: absolute; left: 60px; width: 840px; top: 250px; z-index: 6; box-sizing: border-box; padding: 38px 44px 40px;
      background: rgba(10,16,24,0.62); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15);
      border: 1px solid rgba(255,255,255,0.14); border-left: 8px solid #d0121f; border-radius: 26px; box-shadow: 0 14px 48px rgba(0,0,0,0.45); }
    .quotecard .q { font-family: 'Arial Black', Arial, sans-serif; font-size: 76px; line-height: 1.06; color: #f4f0e8; }
    .quotecard .q.num { font-family: 'AbrilFig', Georgia, serif; font-size: 132px; line-height: 1; color: #e2202e; letter-spacing: 0.02em; }
    .quotecard .lab { margin-top: 18px; font-family: Georgia, serif; font-style: italic; font-size: 40px; line-height: 1.2; color: #e6d8bf; }
    .hid { opacity: 0; visibility: hidden; }

    #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 90; background: radial-gradient(ellipse at 50% 48%, transparent 58%, rgba(0,0,0,0.5) 100%); }
  </style>
</head>
<body>
<div id="root" data-composition-id="sh-joplin-2011-1" data-start="0.0" data-width="1080" data-height="1920" data-duration="28.4" data-fps="30">

  <!-- ============ NARRATION: parent ep-joplin-2011 wavs, cut on word boundaries (s1-s1 = h1-s1 from 0.68 s, s1-s2 = i1-s1 to 10.0 s) ============ -->
  <audio id="nx-s1s1" src="audio/s1-s1.wav" data-start="0.0" data-duration="16.47" data-volume="1"></audio>
  <audio id="nx-s1s2" src="audio/s1-s2.wav" data-start="16.8" data-duration="10.0" data-volume="1"></audio>

  <!-- ============ BED + SIREN (siren under "A tornado siren goes off", ends before "In 2011") ============ -->
  <audio id="sx-bed" src="media/bed-rumble.mp3" data-bed="" data-start="0.0" data-duration="28.4" data-volume="0.13"></audio>
  <audio id="sx-siren" src="media/siren-waver.ogg" data-bed="" data-start="0.0" data-duration="4.8" data-media-start="2" data-volume="0.16"></audio>

  <!-- ============ TRACK 1: pictures (pre-framed 1080x1920: blurred fill + the picture as a centred band) ============ -->
  <video id="vx-1-path" src="media/aerial-path-wide.mp4" data-start="0.0" data-duration="5.02" data-media-start="0" data-track-index="1" muted></video>
  <section class="clip" id="c-2-flattened" data-start="5.02" data-duration="4.26" data-track-index="1"><img class="still" id="kb-2" src="media/usace-flattened.jpg" alt=""></section>
  <video id="vx-3-flattened" src="media/aerial-flattened.mp4" data-start="9.28" data-duration="4.18" data-media-start="2" data-track-index="1" muted></video>
  <section class="clip" id="c-4-slab" data-start="13.46" data-duration="3.34" data-track-index="1"><img class="still" id="kb-4" src="media/nist-slab.jpg" alt=""></section>
  <video id="vx-5-tarp" src="media/aerial-tarp.mp4" data-start="16.8" data-duration="3.52" data-media-start="0" data-track-index="1" muted></video>
  <section class="clip" id="c-6-debris" data-start="20.32" data-duration="2.62" data-track-index="1"><img class="still" id="kb-6" src="media/usace-debris.jpg" alt=""></section>
  <video id="vx-7-rangeline" src="media/aerial-rangeline.mp4" data-start="22.94" data-duration="5.46" data-media-start="0" data-track-index="1" muted></video>

  <!-- ============ CARDS (track 3; each start = the spoken word in the cut words.json) ============ -->
  <!-- hook, frame 1 is the thumbnail; holds to "135" @6.22 -->
  <section class="clip" id="p-c0" data-start="0.0" data-duration="6.22" data-track-index="3">
    <div class="quotecard" id="c0"><div class="q" id="c0-q">135 WERE INSIDE.</div><div class="lab" id="c0-l">No sign anyone was below ground.</div></div>
  </section>
  <!-- "135" @6.22 to "not" @13.46 (facts T3) -->
  <section class="clip" id="p-c1" data-start="6.22" data-duration="7.24" data-track-index="3">
    <div class="quotecard hid" id="c1"><div class="q num" id="c1-q">135</div><div class="lab" id="c1-l">of the 155 lost were inside a building</div></div>
  </section>
  <!-- "not" @13.46 to the cut 16.8 (facts H5) -->
  <section class="clip" id="p-c2" data-start="13.46" data-duration="3.34" data-track-index="3">
    <div class="quotecard hid" id="c2"><div class="q" id="c2-q">NO SIGN ANYONE WAS BELOW GROUND</div><div class="lab" id="c2-l">NIST, Finding 46</div></div>
  </section>
  <!-- "8" 16.8 + 3.62 = 20.42 to "And" 16.8 + 6.14 = 22.94 (facts H1) -->
  <section class="clip" id="p-c3" data-start="20.42" data-duration="2.52" data-track-index="3">
    <div class="quotecard hid" id="c3"><div class="q num" id="c3-q">8 IN 10</div><div class="lab" id="c3-l">Joplin homes had no basement</div></div>
  </section>
  <!-- "public" 16.8 + 7.06 = 23.86 to the voice end 26.8 -->
  <section class="clip" id="p-c4" data-start="23.86" data-duration="2.94" data-track-index="3">
    <div class="quotecard hid" id="c4"><div class="q" id="c4-q">NO PUBLIC SHELTER</div><div class="lab" id="c4-l">in a town of about 50,000</div></div>
  </section>
  <!-- loop-safe close: the hook again, held to the last frame -->
  <section class="clip" id="p-c5" data-start="26.8" data-duration="1.6" data-track-index="3">
    <div class="quotecard hid" id="c5"><div class="q" id="c5-q">135 WERE INSIDE.</div><div class="lab" id="c5-l">No sign anyone was below ground.</div></div>
  </section>

  <div id="vignette"></div>
</div>

<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });

  // stills: slow push for the whole window (never a frozen hold)
  for (const [id, at, dur] of [["#kb-2", 5.02, 4.26], ["#kb-4", 13.46, 3.34], ["#kb-6", 20.32, 2.62]]) {
    tl.to(id, { scale: 1.05, duration: dur, ease: "none" }, at);
  }

  // hook card: on screen at frame 1, drifts, leaves before "135"
  tl.to("#c0", { y: -8, duration: 5.6, ease: "none" }, 0);
  tl.to("#c0", { y: -22, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, 5.97);

  // cards: big line rises on its word, support line follows, slow drift, out at the window end
  const cards = [["#c1", 6.22, 7.24], ["#c2", 13.46, 3.34], ["#c3", 20.42, 2.52], ["#c4", 23.86, 2.94]];
  for (const [id, at, dur] of cards) {
    tl.fromTo(id, { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, at);
    tl.fromTo(id + "-l", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power2.out" }, at + 0.18);
    tl.to(id, { y: -8, duration: dur - 0.65, ease: "none" }, at + 0.4);
    tl.to(id, { y: -22, autoAlpha: 0, duration: 0.25, ease: "power2.in" }, at + dur - 0.25);
  }
  // number cards pop
  tl.fromTo("#c1-q", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "left center" }, 6.22);
  tl.fromTo("#c3-q", { scale: 0.7 }, { scale: 1, duration: 0.35, ease: "back.out(2)", transformOrigin: "left center" }, 20.42);

  // close: the hook returns and holds (the last frame reads as the first)
  tl.fromTo("#c5", { y: 30, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 26.8);
  tl.to("#c5", { y: -4, duration: 1.25, ease: "none" }, 27.15);

  window.__timelines["sh-joplin-2011-1"] = tl;
})();
</script>
</body>
</html>
