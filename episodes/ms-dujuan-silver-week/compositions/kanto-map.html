<!--
  DUJUAN B6 MG: kanto-map.html — full-bleed regional basemap card (media/maps/basemap-kanto.png
  as a CSS background, not a raster <img> beat, so this long B6 hold reads as a designed graphic
  rather than a static photo). Mounted once for 372.639-422.384 (49.745s). Continuous slow push
  (explicit long duration, ease none, single pass -- NOT gsap repeat, which sweep_episode's static
  timeline-length check cannot see through) keeps the hold from reading frozen.

  PIN/LEADER/LABEL MIGRATION (team-lead direction, 17 Sep 26): the Yokosuka/Yokota/Tokyo pins used
  to be index.html-level overlays, absolutely positioned in frame coordinates while #km-img (this
  file's basemap) scaled 1.0->1.1 and drifted -30/-14px underneath them -- reasoned through (no
  render needed): a host-level element does not inherit a comp-level element's CSS transform, so
  over the full 49.7s hold the pins would visibly drift off their real Yokosuka/Yokota/Tokyo
  points by tens of pixels. Fixed by moving the pins/leaders/labels INTO this file, nested inside
  #km-mapwrap alongside #km-img, with the scale/drift transform now applied to the WRAPPER so the
  basemap and every pin move together as one rigid unit -- positions and look are unchanged (same
  literal pixel coordinates, same visual style, now under km- prefixed classes instead of the
  host's .kanto-pin/.kanto-lab to keep this comp's classes disjoint from index.html, css_collision's
  own gate).
-->
<template>
<style>
  #kn-root { position:absolute; inset:0; overflow:hidden; background:#04070c; }
  #km-mapwrap { position:absolute; inset:0; width:100%; height:100%; }
  #km-img { position:absolute; inset:-6%; width:112%; height:112%; background-image:url('../media/maps/basemap-kanto.png');
    background-size:cover; background-position:center; filter:saturate(0.9) brightness(0.85); }
  #km-scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(4,7,12,0.55) 0%, rgba(4,7,12,0.1) 30%, rgba(4,7,12,0.1) 70%, rgba(4,7,12,0.65) 100%); }

  .km-pin { position:absolute; z-index:6; }
  .km-pin-dot { width:18px; height:18px; border-radius:50%; background:#d0121f; border:3px solid #050b12; box-shadow:0 0 14px rgba(208,18,31,0.7); }
  .km-lab { position:absolute; z-index:6; font-family:'Arial Black',Arial,sans-serif; font-size:22px; color:#f4f0e8; white-space:nowrap;
    text-shadow:0 0 10px rgba(0,0,0,0.95), 0 2px 6px #000; background:rgba(10,16,24,0.6); padding:6px 12px; border-radius:6px; border-left:4px solid #d0121f; }
  /* Reader QC on U1 draft 2 (team-lead, 17 Sep 26): index.html's host-level "~55,000/ACTIVE-DUTY
     15 BASES" popfig (p-pf-55k, track 5, was 391.001-394.201) landed directly on top of the
     Yokosuka/Yokota pin dots and leader lines -- confirmed on a pulled frame at host 392s, text
     sitting across both leader lines and a pin dot. Popfig removed from index.html; the same fact
     now lives HERE as a real in-comp label, in open sea on the right side of this basemap crop
     (clear of every pin/leader/label -- checked against the same basemap image the pins use),
     landing on its own word ("55" in "about 55,000 active duty..." -- audio/b6-s1.words.json,
     comp t=0 = host abs 356.2, matches the popfig's own old start time). */
  .kn-stat { position:absolute; right:110px; top:460px; text-align:right; }
  .kn-stat-num { font-family:'AbrilFig',Georgia,serif; font-size:56px; line-height:1; color:#d0121f; text-shadow:0 3px 14px rgba(0,0,0,0.85); }
  .kn-stat-sub { margin-top:10px; font-family:'Arial Black',Arial,sans-serif; font-size:19px; letter-spacing:2px; color:#f2f5f8; text-shadow:0 2px 10px rgba(0,0,0,0.8); }
</style>

<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set("#km-eyebrow", { autoAlpha: 0 }, 0);
  tl.set("#km-stat-55k", { autoAlpha: 0, x: 24 }, 0);
  tl.fromTo("#km-eyebrow", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.6 }, 0.3);
  /* scale/drift now targets the WRAPPER (see file header pin-migration note), not #km-img alone,
     so the pins move rigidly with the basemap instead of drifting off Yokosuka/Yokota/Tokyo. */
  tl.fromTo("#km-mapwrap", { scale: 1.0, x: 0, y: 0 }, { scale: 1.1, x: -30, y: -14, duration: 49.7, ease: "none" }, 0);
  /* the ~55,000 stat lands here, replacing the old host-level popfig (see file header) -- on its
     own word, same 34.8 comp-relative cue the eyebrow used to only pulse for. */
  tl.fromTo("#km-stat-55k", { autoAlpha: 0, x: 24 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 34.8);

  /* Pins/leaders/labels (migrated from index.html, see file header): same word-synced beats as

  tl.fromTo("#km-pin-tokyo", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 18.78);
  tl.fromTo(["#km-lab-tokyo", "#km-leader-tokyo"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 18.78);
  tl.fromTo("#km-pin-yokosuka", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 23.26);
  tl.fromTo(["#km-lab-yokosuka", "#km-leader-yokosuka"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 23.26);
  tl.fromTo("#km-pin-yokota", { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 27.94);
  tl.fromTo(["#km-lab-yokota", "#km-leader-yokota"], { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 27.94);
  tl.to(["#km-pin-tokyo", "#km-pin-yokosuka", "#km-pin-yokota", "#km-lab-tokyo", "#km-lab-yokosuka", "#km-lab-yokota", "#km-leader-tokyo", "#km-leader-yokosuka", "#km-leader-yokota"], { autoAlpha: 0, duration: 0.4 }, 49.261);
  /* 8s max-gap rule (team-lead direction, 17 Sep 26): this comp's own eyebrow was the only
     content tween (index.html's own pf-427m/chip-noalert popfigs + the pin/label overlays carry
     most of B6's facts on tracks 4/5/6, but that left this FILE with a single reveal in a 49.7s
     window). Word-anchored pulses on the eyebrow itself, all re-based to this comp's mount (host
     abs 356.2 = b6-s1.words.json t=28.0): "Americans already traveling" (4.6), "forecast they're
     checking" (11.96), "Kanto region" (18.78), "Fleet Activities Yokosuka" (23.26), "Yokota Air
     Base" (27.94), "standard readiness system" (39.84), "storm specific alert" (45.26). The
     34.8 "55,000...bases" beat is now the real #km-stat-55k reveal above, not a pulse. */
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.6);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 11.96);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 18.78);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 23.26);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 27.94);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 39.84);
  tl.fromTo("#km-eyebrow", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 45.26);
  window.__timelines["kanto-map"] = tl;
})();
</script>
