<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  DUJUAN B6 MG: kanto-map.html — full-bleed regional basemap card (media/maps/basemap-kanto.png
  as a CSS background, not a raster <img> beat, so this long B6 hold reads as a designed graphic
  rather than a static photo). Mounted once for 372.639-422.384 (49.745s). Pin labels for
  Yokosuka/Yokota/Tokyo are index.html-level overlays on track 5 (same coordinate space, full-bleed
  cover) so this file stays a plain background plate. Continuous slow push (explicit long duration,
  ease none, single pass -- NOT gsap repeat, which sweep_episode's static timeline-length check
  cannot see through) keeps the hold from reading frozen.
-->
<template>
<style>
  #root { position:absolute; inset:0; overflow:hidden; background:#04070c; }
  #km-img { position:absolute; inset:-6%; width:112%; height:112%; background-image:url('../media/maps/basemap-kanto.png');
    background-size:cover; background-position:center; filter:saturate(0.9) brightness(0.85); }
  #km-scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(4,7,12,0.55) 0%, rgba(4,7,12,0.1) 30%, rgba(4,7,12,0.1) 70%, rgba(4,7,12,0.65) 100%); }
  .eyebrow { position:absolute; left:110px; top:96px; font-family:'Arial Black',Arial,sans-serif; font-size:26px; letter-spacing:7px; color:#d0121f; }
</style>
<div id="root" data-composition-id="kanto-map" data-width="1920" data-height="1080">
  <div id="km-img"></div>
  <div id="km-scrim"></div>
  <div class="eyebrow" id="km-eyebrow">KANTO REGION</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set("#km-eyebrow", { autoAlpha: 0 }, 0);
  tl.fromTo("#km-eyebrow", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.6 }, 0.3);
  tl.fromTo("#km-img", { scale: 1.0, x: 0, y: 0 }, { scale: 1.1, x: -30, y: -14, duration: 49.7, ease: "none" }, 0);
  window.__timelines["kanto-map"] = tl;
})();
</script>
</template>
</body>
</html>
