<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  DUJUAN B7 MG: scale-ladder.html — full-bleed 1920x1080 card, mounted once for the whole B7
  window (422.984-484.184 in the host index.html, duration 61.2s). Shows how JMA's typhoon
  scale compares to the US NHC standard and where Dujuan's own forecast sits. Reveal times
  below are re-anchored to this episode's own audio/b7-s1.words.json cues (mount start = comp
  t=0 = absolute 422.984). Continuous motion: slow gradient drift, explicit long single-pass
  duration (not gsap repeat, which sweep_episode's static timeline-length check cannot see
  through) so the composition's own perceived duration covers the full 61.2s host window.
-->
<template>
<style>
  /* AbrilFig @font-face is declared once in index.html; hyperframes mounts this template
     into that same document so the family is already registered -- a per-comp duplicate here
     is what css_collision.py's class-name regex was matching on the .ttf url extension
     (a false positive, not a real leak; ../fonts/AbrilFatface-Regular.ttf still used standalone
     via the host doc). */
  #sl-root { position:absolute; inset:0; overflow:hidden; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 30% 70%, #142235 0%, #04070c 70%); }
  #sl-drift { position:absolute; inset:-8%; background:radial-gradient(ellipse at 70% 20%, rgba(208,18,31,0.08) 0%, rgba(0,0,0,0) 55%); }
  /* height is EXPLICIT and overflow:hidden -- not auto/content-derived. 580px (my hand-computed
     line-item sum) clipped the real content: browser measurement at t=47s put the readout bottom
     at 800 and the caption at 830-854, both past a 790 card bottom. Set from that MEASUREMENT,
     not another estimate: 854 (measured caption bottom) + 40 (padding-bottom) - 210 (card top)
     = 684, rounded to 690. Card bottom = 210+690 = 900. */
  .sl-card { position:absolute; left:260px; top:210px; width:1400px; height:690px; padding:40px 56px; box-sizing:border-box;
    overflow:hidden; z-index:6; background:rgba(10,16,24,0.6); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14); border-radius:24px; }
  .sl-eyebrow { font-family:'Arial Black',Arial,sans-serif; font-size:24px; line-height:1; letter-spacing:6px; color:#d0121f; margin-bottom:26px; }
  .sl-band { display:flex; align-items:center; gap:24px; margin-top:18px; position:relative; }
  .sl-band .sl-lab { flex:0 0 340px; font-family:'Arial Black',Arial,sans-serif; font-size:30px; }
  .sl-band .sl-bar { flex:1; height:46px; border-radius:8px; background:rgba(255,255,255,0.08); position:relative; overflow:visible; }
  .sl-band .sl-fill { position:absolute; inset:0; border-radius:8px; }
  /* dim: a 4th rung below the official JMA "Strong+" scale, added so the forecast (Severe
     Tropical Storm, 67 mph) has an honest home instead of sharing a band it will not reach */
  .sl-band.sl-dim { opacity: 0.7; }
  .sl-band.sl-dim .sl-lab { color: #c8d3e0; }
  .sl-marker { position:absolute; top:-14px; width:6px; height:74px; background:#f4f0e8; border-radius:3px; box-shadow:0 0 14px rgba(244,240,232,0.8); }
  /* Owner review (team-lead, 17 Sep 26): "no footage 7:02-7:18" -- the faint-outline fix (below)
     still read as a header + empty ladder to a real viewer. Real fix: every number/agency name/
     scale name/comparison b7-s1.words.json actually speaks in 0-19s lands as its own short label,
     inside the SEVERE bar's own already-approved box (position:relative on .sl-bar, so this is an
     overlay, not a new row -- nothing else on the card moves). Right-aligned so it never crosses
     the marker at left:8%. */
  .sl-bar-note { position:absolute; inset:0; display:flex; align-items:center; justify-content:flex-end;
    padding-right:24px; box-sizing:border-box; font-family:'Arial Black',Arial,sans-serif; font-size:19px;
    letter-spacing:0.5px; color:#f4f0e8; text-shadow:0 2px 8px rgba(0,0,0,0.85); }
  /* readout: a dedicated row below all four bands (not floating text pinned above the marker,
     which crossed the rung above it in a stacked card this compact) -- big(58px)/mid(30px)
     tiers, own bounding box, nothing else shares it */
  .sl-readout { display:flex; align-items:baseline; gap:22px; margin-top:26px; padding-top:22px; border-top:1px solid rgba(255,255,255,0.12); }
  .sl-readout-num { font-family:'AbrilFig',Georgia,serif; font-size:58px; line-height:1; color:#f4f0e8; text-shadow:0 2px 12px rgba(0,0,0,0.7); }
  .sl-readout-unit { font-family:'Arial Black',Arial,sans-serif; font-size:30px; color:#f4f0e8; letter-spacing:1px; }
  .sl-caption { margin-top:30px; font-family:Georgia,serif; font-style:italic; font-size:24px; line-height:1; color:#93a3b2; white-space:nowrap; }
</style>
<div id="sl-root" data-composition-id="scale-ladder" data-width="1920" data-height="1080">
  <div id="sl-drift"></div>
  <div class="sl-card" id="sl-card">
    <div class="sl-eyebrow" id="sl-eyebrow">HOW JAPAN MEASURES A TYPHOON</div>
    <div class="sl-band sl-dim" id="sl-band-severe"><div class="sl-lab">SEVERE TROPICAL STORM &middot; 55&ndash;73 MPH</div><div class="sl-bar"><div class="sl-fill" style="background:rgba(224,134,47,0.28); width:100%;"></div>
      <div class="sl-marker" id="sl-marker" style="left:8%;"></div>
      <div class="sl-bar-note" id="sl-bar-note-1">JAPAN vs U.S. &middot; DIFFERENT WIND MEASURES</div>
      <div class="sl-bar-note" id="sl-bar-note-2">JMA (JAPAN) &middot; 10-MINUTE AVERAGE WIND</div>
      <div class="sl-bar-note" id="sl-bar-note-3">JTWC (U.S.) &middot; 1-MINUTE AVERAGE</div>
      <div class="sl-bar-note" id="sl-bar-note-4">= ROUGHLY 12% HIGHER FOR THE SAME STORM</div>
      <div class="sl-bar-note" id="sl-bar-note-5">JAPAN'S SCALE &middot; 3 BANDS ABOVE TYPHOON STRENGTH</div>
    </div></div>
    <div class="sl-band" id="sl-band-strong"><div class="sl-lab">STRONG &middot; 74&ndash;98 MPH</div><div class="sl-bar"><div class="sl-fill" style="background:rgba(224,134,47,0.55); width:100%;"></div></div></div>
    <div class="sl-band" id="sl-band-verystrong"><div class="sl-lab">VERY STRONG &middot; 99&ndash;121 MPH</div><div class="sl-bar"><div class="sl-fill" style="background:rgba(176,13,26,0.55); width:100%;"></div></div></div>
    <div class="sl-band" id="sl-band-violent"><div class="sl-lab">VIOLENT &middot; 121+ MPH</div><div class="sl-bar"><div class="sl-fill" style="background:rgba(138,0,16,0.55); width:100%;"></div></div></div>
    <div class="sl-readout" id="sl-readout">
      <div class="sl-readout-num">67</div>
      <div class="sl-readout-unit">MPH &middot; JMA 10-MIN</div>
    </div>
    <div class="sl-caption">Japan reports a 10-minute average wind; the U.S. reports a 1-minute peak.</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#sl-card", "#sl-readout"], { autoAlpha: 0 }, 0);
  tl.set(["#sl-band-severe", "#sl-band-strong", "#sl-band-verystrong", "#sl-band-violent"], { autoAlpha: 0, x: -20 }, 0);
  tl.set(".sl-bar-note", { autoAlpha: 0 }, 0);
  /* #sl-marker used to be invisible only because its ancestor #sl-band-severe stayed autoAlpha:0
     until 33.5s; now that severe is visible from 0.3s (to host the bar-notes above), the marker
     needs its own explicit hide/reveal so it doesn't sit there statically for 33s. */
  tl.set("#sl-marker", { autoAlpha: 0 }, 0);
  /* Card used to fade in at +17.02s -- 17 seconds of nothing but the background gradient right
     after B7's narration starts (owner-flagged 17 Sep 26: no window may show only its
     background for more than 2s). B7's very first line is Japan-vs-US measurement, exactly
     what this card is titled, so it now mounts with its frame + eyebrow at the comp's own mount
     instead of holding on an empty gradient. */
  tl.fromTo("#sl-card", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
  /* Reader QC on U1 draft 2 (team-lead, 17 Sep 26): "header-only ~406-424s (18s) before the first
     bar; first rung within 2s" -- confirmed on pulled frames at host 410/420s, just the eyebrow +
     caption, no bands, because the script itself doesn't NAME a band until "Strong" at 18.96s (the
     existing reveal already lands exactly on that word -- the problem was the 18.6s of nothing
     before it, not the sync). Fixed by giving the ladder's own SHAPE real content within 2s of
     mount: all four bands fade up to a faint outline at 1.2s (comp mount 0.3s + 0.9s), well inside
     the 2s window and BEFORE any band is individually named -- the eyebrow's own point ("Japan's
     scale has three bands above typhoon strength", 15.22-18.34) now has something to point at.
     Each band then brightens to full strength on its OWN word, same cues as before, animating FROM
     the faint state (plain .to(), not .fromTo(), so it doesn't reset to invisible first). */
  /* #sl-band-severe pulled out of the shared 1.2s faint-reveal and moved to FULL alpha at 0.3s --
     same instant as the card itself -- because it now hosts the bar-notes below: CSS opacity
     compounds through a subtree, so a note at its own autoAlpha:1 would still render at only 30%
     visible inside a 0.3-alpha parent. Its real word at 33.5s (below) is now a scale pulse instead
     of a reveal, since the row is already on screen by then. */
  tl.to("#sl-band-severe", { autoAlpha: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.3);
  tl.to(["#sl-band-strong", "#sl-band-verystrong", "#sl-band-violent"], { autoAlpha: 0.3, x: 0, duration: 0.5, ease: "power2.out" }, 1.2);
  /* Owner review (team-lead, 17 Sep 26): the faint-outline fade-up above still read as empty for
     19s. Card now mounts WITH a real fact (bar-note-1 lands at the same 0.3s as the card itself)
     and every number/agency name/comparison b7-s1.words.json speaks before "Strong" (18.96, the
     first band's own word, unchanged) lands on ITS word, max ~6s apart, inside the severe bar's
     own approved box (see file header) -- one note visible at a time, sequential swap. Replaces
     the two eyebrow pulses this round (same facts, now real text instead of a scale pulse). */
  tl.fromTo("#sl-bar-note-1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 0.3);   /* "Japan and the United States measure typhoon winds differently" */
  tl.to("#sl-bar-note-1", { autoAlpha: 0, duration: 0.3 }, 6.3);
  tl.fromTo("#sl-bar-note-2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 6.3);   /* "Japan's agency reports a 10-minute average wind" */
  tl.to("#sl-bar-note-2", { autoAlpha: 0, duration: 0.3 }, 10.62);
  tl.fromTo("#sl-bar-note-3", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 10.62); /* "American forecasters report a 1-minute average" */
  tl.to("#sl-bar-note-3", { autoAlpha: 0, duration: 0.3 }, 12.86);
  tl.fromTo("#sl-bar-note-4", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 12.86); /* "which runs roughly 12% higher for the same storm" */
  tl.to("#sl-bar-note-4", { autoAlpha: 0, duration: 0.3 }, 16.3);
  tl.fromTo("#sl-bar-note-5", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power3.out" }, 16.3);  /* "Japan's scale has three bands above typhoon strength" */
  tl.to("#sl-bar-note-5", { autoAlpha: 0, duration: 0.3 }, 18.96);
  tl.to("#sl-band-strong", { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 18.96);
  tl.to("#sl-band-verystrong", { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 22.52);
  tl.to("#sl-band-violent", { autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 26.22);
  tl.fromTo("#sl-band-severe", { scale: 1 }, { scale: 1.03, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 33.5); /* "the severe tropical storm range" -- row already on screen since 0.3s */
  tl.set("#sl-marker", { left: "8%" }, 33.5);
  tl.fromTo("#sl-marker", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 33.5);
  tl.to("#sl-marker", { left: "66.7%", duration: 0.8, ease: "power2.out" }, 40.68); /* "67" (mph) -- 67 mph within the 55-73 mph Severe Tropical Storm band: (67-55)/(73-55) */
  tl.fromTo("#sl-readout", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 40.68); /* lands with the marker, own row, clear of every rung */
  /* the readout's own 67 pulses again when the narration reinterprets that same number: "75 mph"
     US-equivalent (43.76) and "Category 1 hurricane" threshold (51.4) -- closes the tail gap to
     the 59.62s exit without inventing a new fact/element (layout risk: this card's height was
     hand-measured from a real overflow bug, see file header). */
  tl.fromTo("#sl-readout", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 43.76);
  tl.fromTo("#sl-readout", { scale: 1 }, { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 51.4);
  /* "Japan has not called this storm a hurricane, because Japan does not use that word" (55.56)
     -- the caption's own point, closes the last gap before the 59.62s exit under 8s. */
  tl.fromTo(".sl-caption", { scale: 1 }, { scale: 1.03, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 55.56);
  tl.to("#sl-card", { autoAlpha: 0, y: -20, duration: 0.5 }, 59.62);
  tl.to("#sl-drift", { rotation: 1080, duration: 61.2, ease: "none", transformOrigin: "50% 50%" }, 0);
  window.__timelines["scale-ladder"] = tl;
})();
</script>
</template>
</body>
</html>
