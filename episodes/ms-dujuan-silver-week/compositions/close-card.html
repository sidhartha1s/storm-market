<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  DUJUAN B9 MG: close-card.html — full-bleed close card, mounted at the host's B9 window
  (549.929 through end of episode, 12.071s). Paul circle hidden under this card per spec.
  House glass card + a continuous single-pass texture drift (0-12.071s, ease:none, no repeat)
  keep the hold from reading as frozen (graphics_qc / beat_density.py).
-->
<template>
<style>
  @font-face { font-family:'AbrilFig'; src:url('../fonts/AbrilFatface-Regular.ttf'); }
  #root { position:absolute; inset:0; overflow:hidden; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 50% 40%, #16283a 0%, #04070c 75%); }
  #cc-texture { position:absolute; top:-10%; left:-60%; width:220%; height:120%;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 42px),
                radial-gradient(ellipse at 30% 40%, rgba(208,18,31,0.12) 0%, rgba(0,0,0,0) 55%); }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .glass { padding:64px 96px; border-radius:24px; background:rgba(10,16,24,0.42); border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .kicker { font-family:'Arial Black',Arial,sans-serif; font-size:20px; letter-spacing:5px; color:#8ea0b2; }
  .title { margin-top:14px; font-family:'AbrilFig',Georgia,serif; font-size:128px; color:#f2f5f8; text-shadow:0 4px 24px rgba(0,0,0,0.9); }
  .sub { margin-top:22px; font-family:Georgia,serif; font-style:italic; font-size:34px; color:#d8a13a; max-width:1100px; }
  .brand { margin-top:40px; font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:8px; color:#93a3b2; }
</style>
<div id="root" data-composition-id="close-card" data-width="1920" data-height="1080">
  <div id="cc-texture"></div>
  <div class="wrap">
    <div class="glass" id="cc-glass">
      <div class="kicker" id="cc-kicker">TYPHOON No. 25 &middot; SILVER WEEK WATCH</div>
      <div class="title" id="cc-title">DUJUAN.</div>
      <div class="sub" id="cc-sub">Forming near Guam. Silver Week begins Saturday.</div>
      <div class="brand" id="cc-brand">THE WARNING HOUR</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#cc-kicker", "#cc-title", "#cc-sub", "#cc-brand"], { autoAlpha: 0 }, 0);
  tl.fromTo("#cc-kicker", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
  tl.fromTo("#cc-title", { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.3);
  tl.fromTo("#cc-sub", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
  tl.fromTo("#cc-brand", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 2.0);
  /* foreground motion after the reveal (background #cc-texture alone read as frozen at 3s
     sampling): slow drift of the sub-line for the rest of the hold */
  tl.fromTo("#cc-sub", { x: 0 }, { x: 12, duration: 10.371, ease: "none" }, 1.7);
  /* continuous single-pass drift across the whole 12.071s mount — literal duration equals the
     window so the static "graphic window fits its timeline" scanner reads it correctly */
  tl.fromTo("#cc-texture", { x: "0%" }, { x: "-38%", duration: 12.071, ease: "none" }, 0);
  window.__timelines["close-card"] = tl;
})();
</script>
</template>
</body>
</html>
