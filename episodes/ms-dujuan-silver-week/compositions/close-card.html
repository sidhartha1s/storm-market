<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  DUJUAN B9 MG: close-card.html — full-bleed close card, mounted at the host's B9 window
  (556.439 through end of episode, 12.051s; moved 17 Sep 26, CTA relocation). Paul circle hidden under this card per spec.
  House glass card + a continuous single-pass texture drift (0-12.051s, ease:none, no repeat)
  keep the hold from reading as frozen (graphics_qc / beat_density.py).
-->
<template>
<style>
  /* AbrilFig @font-face is declared once in index.html; hyperframes mounts this template
     into that same document so the family is already registered -- a per-comp duplicate here
     is what css_collision.py's class-name regex was matching on the .ttf url extension
     (a false positive, not a real leak; ../fonts/AbrilFatface-Regular.ttf still used standalone
     via the host doc). */
  #cc-root { position:absolute; inset:0; overflow:hidden; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 50% 40%, #16283a 0%, #04070c 75%); }
  #cc-texture { position:absolute; top:-10%; left:-60%; width:220%; height:120%;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 2px, transparent 2px, transparent 42px),
                radial-gradient(ellipse at 30% 40%, rgba(208,18,31,0.12) 0%, rgba(0,0,0,0) 55%); }
  .cc-wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .cc-glass { padding:64px 96px; border-radius:24px; background:rgba(10,16,24,0.42); border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 20px 60px rgba(0,0,0,0.5); }
  .cc-kicker { font-family:'Arial Black',Arial,sans-serif; font-size:20px; letter-spacing:5px; color:#8ea0b2; }
  .cc-title { margin-top:14px; font-family:'AbrilFig',Georgia,serif; font-size:128px; color:#f2f5f8; text-shadow:0 4px 24px rgba(0,0,0,0.9); }
  .cc-sub { margin-top:22px; font-family:Georgia,serif; font-style:italic; font-size:34px; color:#d8a13a; max-width:1100px; }
  .cc-brand { margin-top:40px; font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:8px; color:#93a3b2; }
</style>
<div id="cc-root" data-composition-id="close-card" data-width="1920" data-height="1080">
  <div id="cc-texture"></div>
  <div class="cc-wrap">
    <div class="cc-glass" id="cc-glass">
      <div class="cc-kicker" id="cc-kicker">TYPHOON No. 25 &middot; SILVER WEEK WATCH</div>
      <div class="cc-title" id="cc-title">DUJUAN.</div>
      <div class="cc-sub" id="cc-sub">Forming near Guam. Silver Week begins Saturday.</div>
      <div class="cc-brand" id="cc-brand">THE WARNING HOUR</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#cc-kicker", "#cc-title", "#cc-sub", "#cc-brand"], { autoAlpha: 0 }, 0);
  tl.fromTo("#cc-kicker", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.1);
  tl.fromTo("#cc-title", { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.3);
  tl.fromTo("#cc-sub", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
  tl.fromTo("#cc-brand", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 2.0);
  /* foreground motion after the reveal (background #cc-texture alone read as frozen at 3s
     sampling): slow drift of the sub-line for the rest of the hold */
  tl.fromTo("#cc-sub", { x: 0 }, { x: 28, duration: 10.371, ease: "none" }, 1.7);
  /* 8s max-gap rule (team-lead direction, 17 Sep 26): nothing new landed between the 2.0s brand
     reveal and the 12.051s end (10.05s hole). Two pulses on real B9 word cues
     (audio/b9-s1.words.json): "Subscribe" (6.24) on the channel brand line, and "Japan gives
     this storm its name" (8.72) on the title itself -- DUJUAN. is literally the name being
     named, a direct echo, not an arbitrary pulse. */
  tl.fromTo("#cc-brand", { scale: 1 }, { scale: 1.06, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 6.24);
  tl.fromTo("#cc-title", { scale: 1 }, { scale: 1.02, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, 8.72);
  /* continuous single-pass drift across the whole 12.051s mount — literal duration equals the
     window so the static "graphic window fits its timeline" scanner reads it correctly */
  tl.fromTo("#cc-texture", { x: "0%" }, { x: "-38%", duration: 12.051, ease: "none" }, 0);
  window.__timelines["close-card"] = tl;
})();
</script>
</template>
</body>
</html>
