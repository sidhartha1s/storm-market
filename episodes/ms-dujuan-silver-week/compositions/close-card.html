<!doctype html>
<html>

<body>
<!--

<template>
<style>

  #root { position:absolute; inset:0; overflow:hidden; font-family:Arial,sans-serif; color:#f2f5f8;

  #cc-bg { position:absolute; inset:-6%; background:radial-gradient(ellipse at 60% 30%, rgba(208,18,31,0.14) 0%, rgba(0,0,0,0) 55%); }
  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }

</style>
<div id="root" data-composition-id="close-card" data-width="1920" data-height="1080">
  <div id="cc-bg"></div>
  <div class="wrap">
    <div class="title" id="cc-title">DUJUAN.</div>
    <div class="sub" id="cc-sub">Forming near Guam. Silver Week begins Saturday.</div>
    <div class="brand" id="cc-brand">THE WARNING HOUR</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#cc-title", "#cc-sub", "#cc-brand"], { autoAlpha: 0 }, 0);
  tl.fromTo("#cc-title", { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 0.2);
  tl.fromTo("#cc-sub", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);
  tl.fromTo("#cc-brand", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.6 }, 1.9);
  tl.to("#cc-bg", { rotation: 30, duration: 12, ease: "none", repeat: 3, transformOrigin: "50% 50%" }, 0);
  window.__timelines["close-card"] = tl;
})();
</script>
