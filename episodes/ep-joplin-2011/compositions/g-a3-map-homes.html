<body>
<!-- g-a3-map-homes: A3-S1 tail + A3-S3, host 484.55 for 10.02 s (nx-a3-s1 474.17 + "to." 9.58 + 0.8; ends on nx-a3-s3 "Didn't" 8.98 = 494.57).
     Brief briefs/a3/g-a3-map-homes.md. Comp-local a3-s3 time = word start + 1.04 (nx-a3-s3 485.59 - host 484.55).
     Part A has 1.04 s, not the >= 2.5 s the brief asks the orchestrator to keep: scan and chip are compressed (A_IN below).
     Base: the g-intro-map BASEMAP block, copied verbatim with ids re-prefixed g-master-map- -> g-a3-map-homes- (no geography added);
       grid, city, streets, path on from frame 0 (CSS); sirens, places (both empty, Open 2 / Open 4), ring and below-ground line off.
       Track and main city outline get non-scaling strokes here (CSS) so the 4.46x push keeps them at 2 px.
     HOUSES: media/g-a3-map-homes/houses.py, seed 20110522 (numbers only, pasted): 51 houses inside the path within the city limits,
       >= 14 px (screen, at Z) from the path edge and the city line, >= 15 px from the track, centres >= 34 px apart; 44 / 6 / 1 hold
       1 / 2 / 3 dots (59, H9). No source figure for residential positions (Open): "Schematic · not to scale".
       Glyph 22 x 21 px (brief 18 x 16 cannot hold 3 dots of 7 px: 27 px), drawn in map units at 1/Z so it reads 22 px at the push end.
     PUSH: Z = 4.46 fits the house bbox + 80 px into x 96-1600, y 180-900 (chip above, rail below, presenter corner clear);
       a pure zoom about the fixed point (FX, FY) with the scale log-interpolated (helpers.js logLerpScale), then a 6 px/s drift left. -->
<template>
<style>
  #g-a3-map-homes-root { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif;

  .gamh-svg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  /* base layers on from frame 0 (CSS beats the copied presentation attributes) */
  #g-a3-map-homes-l-streets, #g-a3-map-homes-l-path, #g-a3-map-homes-city-rest { opacity:1; }
  #g-a3-map-homes-city, #g-a3-map-homes-track { stroke-dasharray:none; stroke-dashoffset:0; vector-effect:non-scaling-stroke; }
  #g-a3-map-homes-l-ring, #g-a3-map-homes-l-sirens, #g-a3-map-homes-l-places, #g-a3-map-homes-l-below { display:none; }
  .gamh-hout { fill:#06090d; fill-opacity:0.78; stroke:#dfe7ee; stroke-width:1.5; stroke-linejoin:round;
    vector-effect:non-scaling-stroke; opacity:0; }
  .gamh-dot { fill:#c0392b; opacity:0; }
  #g-a3-map-homes-scan { position:absolute; left:0; top:180px; width:2px; height:610px; opacity:1;

  .gamh-chiptxt { font:900 52px/56px 'Arial Black', Arial, sans-serif; letter-spacing:-1px; color:#f2f5f8; white-space:nowrap; }
  .gamh-src { position:absolute; left:96px; top:996px; height:38px; box-sizing:border-box; padding:0 16px;

    backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);

  #g-a3-map-homes-schem { font:700 19px/38px Arial, sans-serif; color:#93a3b2; }
  /* rail: one line building left to right; the glass is clipped to the text so far (houses.py widths, Arial 700 30 px) */
  #g-a3-map-homes-rail { position:absolute; left:96px; top:922px; width:1140px; height:54px; box-sizing:border-box; padding:0 24px;

    opacity:0; visibility:hidden; }
  #g-a3-map-homes-r1, #g-a3-map-homes-r2, #g-a3-map-homes-r3 { display:inline-block; }
  #g-a3-map-homes-r2, #g-a3-map-homes-r3 { opacity:0; visibility:hidden; }
</style>
<div id="g-a3-map-homes-root" data-composition-id="g-a3-map-homes" data-width="1920" data-height="1080" data-duration="10.02">
  <svg class="gamh-svg" viewBox="0 0 1920 1080">
    <g id="g-a3-map-homes-cam">
@@BASEMAP@@
      <g id="g-a3-map-homes-houses"></g>
    </g>
  </svg>
  <div id="g-a3-map-homes-scan"></div>
  <div id="g-a3-map-homes-chipa" class="gamh-chip"><span id="g-a3-map-homes-chipa-t" class="gamh-chiptxt">NO PUBLIC SHELTER</span></div>
  <div id="g-a3-map-homes-chipb" class="gamh-chip"><span id="g-a3-map-homes-chipb-t" class="gamh-chiptxt">59 LOST IN HOUSES</span></div>
  <div id="g-a3-map-homes-srca" class="gamh-src"><span id="g-a3-map-homes-srca-t">No community shelters or safe rooms · city or county · Finding 20</span></div>
  <div id="g-a3-map-homes-srcb" class="gamh-src"><span id="g-a3-map-homes-srcb-t">NIST Sec. 4.6.2.2 · Table 4-3</span><span id="g-a3-map-homes-schem">Schematic · not to scale</span></div>
  <div id="g-a3-map-homes-rail"><span id="g-a3-map-homes-r1">59 people · 51 homes</span><span id="g-a3-map-homes-r2"> · 54 lost in demolished homes</span><span id="g-a3-map-homes-r3"> · 50 in one-story homes</span></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-a3-map-homes", P = "#g-a3-map-homes-", NS = "http://www.w3.org/2000/svg";
  const S3 = 1.04; /* nx-a3-s3 485.59 - host 484.55 */
  const END = 10.02;
  const A_IN = S3 >= 2.5 ? 0.8 : 0.15; /* brief: chip at 0.8 with >= 2.5 s of Part A; the mount gives 1.04 s */
  /* houses.py: [x, y, dots] in map units, west -> east; Z, camera B (tx, ty at scale Z) */
  const HOUSES = [[723.77,608.69,1],[735.08,603.87,1],[736.57,594.67,1],[785.07,592.88,2],[792.37,583.62,1],[798.74,588.53,1],[800.81,611.7,1],[810.01,615.41,1],[814.93,588.16,1],[815.8,575.93,1],[817.9,603.2,1],[828.92,566.86,1],[831.91,600.36,1],[832.95,581.6,1],[836.6,571.66,2],[838.6,591.2,1],[841.39,580.54,1],[845.52,598.94,1],[848.49,575.33,1],[851.26,567.3,1],[857.93,603.74,2],[859.04,571.92,1],[865.7,576.08,2],[867.75,585.51,2],[868.19,565.54,1],[881.97,549.77,1],[882.57,594.11,1],[889.95,580.3,1],[893.92,567.78,1],[895.07,557.22,1],[896.82,549.5,1],[900.74,542.8,1],[906.3,565.06,1],[912.02,572.29,1],[914.54,547.66,1],[916.26,557.35,1],[922.14,570.87,1],[930.66,564.83,1],[935.72,552.97,1],[938.14,569.25,1],[948.69,577.81,1],[949.11,561.98,1],[957.68,584.04,2],[966.15,583.13,1],[969.67,553.88,1],[977.45,587.13,3],[986.25,569.98,1],[987.36,582.5,1],[997.37,564.62,1],[1008.22,572.49,1],[1020.18,575.12,1]];
  const Z = 4.46, TXB = -3041.01, TYB = -2042.31;
  const GLYPH = [[-11, 10], [11, 10], [11, -1], [0, -11], [-11, -1]];
  const DOTS = { 1: [[0, 4]], 2: [[-5, 4], [5, 4]], 3: [[-5, 4], [5, 4], [0, -3.5]] };
  const R = 3.5 / Z;
  const PUSH = 1.2, HOLD0 = S3 + PUSH, DRIFT = 6; /* px/s, content moves left */
  const D = DRIFT * (END - HOLD0);
  const FX = (TXB + D / 2) / (1 - Z), FY = TYB / (1 - Z); /* the map point that stays put through the zoom */
  const tl = gsap.timeline({ paused: true });

  /* houses: glyph + dots in map units at 1/Z (numbers only from houses.py; shapes, no text) */
  const layer = document.getElementById("g-a3-map-homes-houses");
  const outs = [], dots = [];
  HOUSES.forEach(function (h) {
    const g = document.createElementNS(NS, "g");
    const p = document.createElementNS(NS, "path");
    p.setAttribute("class", "gamh-hout");
    p.setAttribute("d", "M" + GLYPH.map(function (q) { return (h[0] + q[0] / Z).toFixed(3) + "," + (h[1] + q[1] / Z).toFixed(3); }).join(" L") + " Z");
    g.appendChild(p);
    const ds = DOTS[h[2]].map(function (q) {
      const c = document.createElementNS(NS, "circle");
      c.setAttribute("class", "gamh-dot");
      c.setAttribute("cx", (h[0] + q[0] / Z).toFixed(3));
      c.setAttribute("cy", (h[1] + q[1] / Z).toFixed(3));
      c.setAttribute("r", R.toFixed(4));
      g.appendChild(c);
      return c;
    });
    layer.appendChild(g);
    outs.push(p);
    dots.push(ds);
  });

  /* camera: a pure function of comp time, so any seek order lands the same frame */
  const camEl = document.getElementById("g-a3-map-homes-cam");
  const ease = gsap.parseEase("power2.inOut");
  function camAt(t) {
    let s = 1, tx = 0, ty = 0;
    if (t > S3) {
      const u = ease(Math.min(1, (t - S3) / PUSH));
      s = Math.exp(Math.log(Z) * u); /* logLerpScale(1, Z, u) */
      tx = FX * (1 - s) - DRIFT * Math.max(0, t - HOLD0);
      ty = FY * (1 - s);
    }
    camEl.setAttribute("transform", "translate(" + tx.toFixed(2) + "," + ty.toFixed(2) + ") scale(" + s.toFixed(5) + ")");
  }
  camAt(0);
  tl.to({ t: 0 }, { t: 1, duration: END, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* ---- PART A, host 0.00 (no spoken trigger: A3-S2 was cut). City view from frame 0. No shelter layer exists: nothing pings. ---- */
  /* scan line sweeps the city limits west -> east (city x 579.2-1120.8, +-10 px) */
  tl.set(P + "scan", { x: 569 }, 0);
  tl.fromTo(P + "scan", { x: 569 }, { x: 1131, duration: Math.min(2.5, S3), ease: "none" }, 0);
  tl.to(P + "scan", { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, Math.min(2.5, S3) - 0.1);
  tl.fromTo(P + "chipa", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, A_IN);
  tl.fromTo(P + "srca", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, A_IN);

  /* ---- PART B ---- */
  /* FIFTY a3-s3 0.00: chip and source swap (old out 0.3 s, new in), push starts (1.2 s) */
  tl.to(P + "chipa", { autoAlpha: 0, x: -60, duration: 0.3, ease: "power3.in" }, S3);
  tl.to(P + "srca", { autoAlpha: 0, y: 10, duration: 0.3, ease: "power3.in" }, S3);
  tl.fromTo(P + "chipb", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S3 + 0.3);
  tl.fromTo(P + "srcb", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, S3 + 0.3);

  /* FIFTY 0.00 -> HOUSES, 2.20: outlines and dots light west -> east, one every 0.035 s, done by 2.20 */
  HOUSES.forEach(function (h, i) {
    const at = S3 + 0.15 + i * 0.035;
    tl.fromTo(outs[i], { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
    tl.fromTo(dots[i], { opacity: 0, attr: { r: 0 } }, { opacity: 1, attr: { r: R }, duration: 0.3, ease: "back.out(2)" }, at + 0.05);
  });

  /* HOUSES, a3-s3 2.20: running label "59 people · 51 homes" */
  tl.fromTo(P + "rail", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, S3 + 2.2);
  /* FLATTENED. a3-s3 5.16: " · 54 lost in demolished homes" (glass grows to the new text end, then the words) */
  tl.fromTo(P + "rail", { clipPath: "inset(0px 789px 0px 0px round 20px)" },
    { clipPath: "inset(0px 355px 0px 0px round 20px)", duration: 0.4, ease: "power3.out" }, S3 + 5.16);
  tl.fromTo(P + "r2", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, S3 + 5.2);
  /* PATH a3-s3 7.22: " · 50 in one-story homes" */
  tl.fromTo(P + "rail", { clipPath: "inset(0px 355px 0px 0px round 20px)" },
    { clipPath: "inset(0px 0px 0px 0px round 20px)", duration: 0.4, ease: "power3.out" }, S3 + 7.22);
  tl.fromTo(P + "r3", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, S3 + 7.26);

  /* hold: dots blip in small groups (r x1.35 and back), 1.2 s apart; the camera drifts 6 px/s (camAt). Cut to the clip on the host end. */
  for (let k = 0, at = S3 + 2.5; at < END - 0.6; k++, at += 1.2) {
    const grp = [];
    dots.forEach(function (ds, i) { if (i % 6 === k % 6) grp.push.apply(grp, ds); });
    tl.to(grp, { attr: { r: R * 1.35 }, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, at);
  }

  window.__timelines[ID] = tl;
})();
</script>
</template>
