<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#a3t-";
  const EXIT = 11.4;            /* "up?" a3-s5 17.16 -> local 11.38; exit 0.6 s, gone 12.0, host ends 12.18 */
  const BREATH = 1.3;           /* one-way breathing tween, y +-2 about the pip's resting top */
  const PITCH = 56, GRID_X = 708, GRID_TOPS = [150, 214, 278];
  const sel = c => P + "p" + c;
  const startOf = c => [GRID_X + PITCH * +c[1], GRID_TOPS[+c[0]]];

  /* pip assignment: every grid slot appears once (11 + 3 + 5 + 7 + 1 grey = 27) */
  const BASEMENT = ["00","10","20","01","11","21","02","12","22","03","13"];
  const CLOSET   = ["04","14","24"];
  const HALL     = ["05","15","25","06","16"];
  const BATH     = ["26","07","17","27","08","18","28"];
  const GREY     = "23";
  const ALL = ["00","01","02","03","04","05","06","07","08","10","11","12","13","14","15","16","17","18","20","21","22","23","24","25","26","27","28"];

  /* bin slots: rows of m pips centred in a box of width w, nominal tops per row; resting top = nominal - 2 (breath is +-2 about it) */
  function slots(x0, w, counts, tops, pitch) {
    const out = [];
    counts.forEach(function(m, r) {
      const x = x0 + (w - ((m - 1) * pitch + 36)) / 2;
      for (let j = 0; j < m; j++) out.push([x + j * pitch, tops[r] - 2]);
    });
    return out;
  }
  /* travel: x leads (power3.out), y follows (power2.inOut); the pip then breathes until the exit */
  function sort(codes, sl, t0, dur, stag, fullAlphaOnLand) {
    codes.forEach(function(c, i) {
      const el = sel(c), s = startOf(c), d = sl[i];
      const at = t0 + i * stag, land = at + dur;
      tl.to(el, {x: d[0] - s[0], duration: dur, ease: "power3.out"}, at);
      tl.to(el, {y: d[1] - s[1], duration: dur, ease: "power2.inOut"}, at);
      if (fullAlphaOnLand) tl.to(el, {autoAlpha: 1, duration: 0.3, ease: "power2.out"}, land - 0.3);
      const b0 = land + 0.05 + (i % 4) * 0.17;
      const n = Math.max(1, Math.floor((EXIT - b0) / BREATH));
      tl.to(el, {y: d[1] + 4 - s[1], duration: BREATH, ease: "sine.inOut", yoyo: true, repeat: n - 1}, b0);
    });
  }
  /* box outline draws on (dash length = ceil(perimeter) + 1) */
  function drawBin(id, w, h, at) {
    const L = Math.ceil(2 * (w + h)) + 1;
    tl.set(P + id, {strokeDasharray: L, strokeDashoffset: L}, 0);
    tl.to(P + id, {autoAlpha: 1, duration: 0.01}, at);
    tl.to(P + id, {strokeDashoffset: 0, duration: 0.6, ease: "power2.out"}, at);
  }
  function labelIn(id, at) {
    tl.fromTo(P + id, {autoAlpha: 0, y: 16}, {autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out"}, at);
  }

  /* "27," a3-s5 6.00 -> local 0.22: 27 pips pop in (all in by 1.1), chip and eyebrow in */
  ALL.forEach(function(c, i) {
    tl.fromTo(sel(c), {scale: 0.6, autoAlpha: 0}, {scale: 1, autoAlpha: 0.55, duration: 0.3, ease: "back.out(2)"}, 0.22 + i * 0.02);
  });
  tl.fromTo(P + "chip", {autoAlpha: 0, x: -40}, {autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out"}, 0.22);
  labelIn("eyebrow", 0.35);

  /* "11" 7.10 -> 1.32: 11 pips travel below the grade line; bin draws; count 0 -> 11 lands with "Basement" at 8.0 -> 2.22 */
  tl.fromTo(P + "bfill", {autoAlpha: 0}, {autoAlpha: 1, duration: 0.6, ease: "power2.out"}, 1.32);
  drawBin("bin-base", 560, 240, 1.32);
  sort(BASEMENT, slots(300, 560, [6, 5], [710, 800], 80), 1.32, 0.9, 0.04, false);
  tl.set(P + "n11", {autoAlpha: 1}, 1.32);
  const cnt = {v: 0};
  tl.to(cnt, {v: 11, duration: 0.9, ease: "power4.out", onUpdate: function() { document.getElementById("a3t-n11").textContent = Math.round(cnt.v); }}, 1.32);
  labelIn("basement", 2.22);

  /* "lived." 9.72 -> 3.94: the 11 go full amber 2, one pulse */
  const BASE_EL = BASEMENT.map(sel);
  tl.to(BASE_EL, {autoAlpha: 1, color: "#e8c56a", duration: 0.3, ease: "power2.out"}, 3.94);
  tl.to(BASE_EL, {scale: 1.18, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1}, 3.94);

  /* "closet," 12.74 -> 6.96: box, 3 pips (land by 7.64), label once the last pip is past the label row */
  drawBin("bin-closet", 260, 120, 6.96);
  sort(CLOSET, slots(940, 260, [2, 1], [484, 536], 56), 6.96, 0.6, 0.04, true);
  labelIn("l-closet", 7.6);
  /* "hallway," 13.50 -> 7.72: box, 5 pips (land by 8.48), label 8.4 */
  drawBin("bin-hall", 260, 120, 7.72);
  sort(HALL, slots(1220, 260, [3, 2], [484, 536], 56), 7.72, 0.6, 0.04, true);
  labelIn("l-hall", 8.4);
  /* "bathroom." 14.28 -> 8.50: box, 7 pips (land by 9.34), label 9.3; 14.68 -> 8.90 group label in, the last grid pip greys */
  drawBin("bin-bath", 260, 120, 8.5);
  sort(BATH, slots(1500, 260, [4, 3], [484, 536], 56), 8.5, 0.6, 0.04, true);
  labelIn("l-bath", 9.3);
  labelIn("l-group", 8.9);
  tl.to(sel(GREY), {color: "#4a5560", autoAlpha: 1, duration: 0.4, ease: "power2.out"}, 8.9);

  /* "up?" 17.16 -> 11.38: chip and source out, labels, pips and ground fade through (0.6 s) */
  tl.to(P + "chip", {x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, EXIT);
  tl.to(P + "src", {x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in"}, EXIT);
  tl.to([P + "labels", P + "pips", P + "lines", P + "ground"], {autoAlpha: 0, duration: 0.6, ease: "power2.in"}, EXIT);
  tl.set(P + "ground", {autoAlpha: 0}, 12.18);
  window.__timelines["g-a3-tally"] = tl;
})();
