<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#gsb-";
  const END = 4.46;
  const q = (sel) => Array.from(document.querySelectorAll(sel));

  /* ticks: every Monday from 1 Jan 2007 (a Monday) to 16 May 2011, x = 200 + days x 1520/1612, band y 550 to 590 */
  const D0 = Date.UTC(2007, 0, 1), LAST = Date.UTC(2011, 4, 16), DAY = 86400000, K = 1520 / 1612;
  let d = "", n = 0;
  for (let t = D0; t <= LAST; t += 7 * DAY) { d += "M" + (200 + (t - D0) / DAY * K).toFixed(2) + " 550V590"; n++; }
  if (n !== 229) throw new Error("g-intro-strip-back: " + n + " ticks; brief says 229");
  document.querySelector(P + "ticks").setAttribute("d", d);

  const pulses = [P + "p07", P + "p08", P + "p09", P + "p11"];
  const tl = gsap.timeline({ paused: true });

  /* frame 0: finished strip, ticks at 70 % */
  tl.set(P + "ticks", { opacity: 0.7 }, 0);

  /* the strip floats 3 px over the whole 4.46 s: four half-cycles of END / 4, ends back at rest */
  tl.to(P + "fl", { y: -3, duration: END / 4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

  /* SIRENS i1-s9 1.58: the comb of tests fades back 70 % -> 25 % */
  tl.to(P + "ticks", { opacity: 0.25, duration: 0.6, ease: "power2.inOut" }, 1.58);

  /* HARDLY i1-s9 2.02: marks pulse 1 -> 1.18 -> 1 (0.5 s, stagger 0.1) and stay lit; source line in; chip (the S2 claim, wording as g-intro-strip) in */
  tl.to(pulses, { scale: 1.18, transformOrigin: "50% 50%", duration: 0.25, ease: "power2.inOut", yoyo: true, repeat: 1, stagger: 0.1 }, 2.02);
  tl.to(q(".gsb-halo"), { opacity: 0.3, duration: 0.3, ease: "power2.out", stagger: 0.1 }, 2.02);
  tl.fromTo(P + "chip", { autoAlpha: 0, y: -24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.02);
  tl.fromTo(P + "src", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.02);

  /* REAL i1-s9 3.56: label in */
  tl.fromTo(P + "out", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.56);

  /* cut to CLIP 3 on the host end (4.46); the float carries the hold */
  window.__timelines["g-intro-strip-back"] = tl;
})();
</script>
