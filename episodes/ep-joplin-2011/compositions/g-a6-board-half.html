  /* source line, bottom-left (the presenter circle owns x >= 1600, y >= 680) */
  #bh-src { position:absolute; inset:auto; left:96px; bottom:60px; padding:5px 12px; border-radius:14px; font-family:Arial,sans-serif; font-size:20px;
    letter-spacing:.5px; color:#c8d3e0; background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15);

<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const Q = "#bh-";
  const tiles = ["1","2","3","4","5","6","8","9","10","11","12","13","14","15","16"].map(n => Q + "t" + n).join(",");

  /* the lifted state: 15 tiles at scale 0.96 around their own centres (opacity .25 is on the grid in CSS) */
  tl.set(tiles, { scale: 0.96, transformOrigin: "50% 50%" }, 0);
  tl.set(Q+"m3-fill", { transformOrigin: "50% 50%", scale: 1 }, 0);
  tl.set([Q+"m1", Q+"m2", Q+"m3", Q+"m4"], { transformOrigin: "50% 50%" }, 0);

  /* four sub-rows land on "nothing" a6-s4 1.68 (local 0.00), stagger 0.15, R3 order: apartments, stores, schools, assembly */
  tl.fromTo(Q+"r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);    /* NOTHING 1.68 */
  tl.fromTo(Q+"r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.15);
  tl.fromTo(Q+"r3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3);
  tl.fromTo(Q+"r4", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.45);

  /* SCHOOLS mark fills and ticks: cue "says" 1.88 (local 0.20), but the SCHOOLS row is not on screen until it lands at 0.30, so the fill starts at 0.45 */
  tl.fromTo(Q+"m3-fill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.45); /* SAYS 1.88 */
  tl.to(Q+"m3-tick", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.55);
  tl.to(Q+"l3", { color: "#f2f5f8", duration: 0.3, ease: "power2.out" }, 0.45);

  /* chip and source line on "storm" 3.14 (local 1.46) */
  tl.fromTo(Q+"chip", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.46); /* STORM 3.14 */
  tl.fromTo(Q+"src", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.46);  /* STORM 3.14 */

  /* STORES mark pulses on "stores" 4.30 (local 2.62), APARTMENTS mark on "homes" 4.76 (local 3.08); ASSEMBLY never pulses */
  tl.to(Q+"m2", { scale: 1.15, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 2.62); /* STORES 4.30 */
  tl.to(Q+"m1", { scale: 1.15, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 3.08); /* HOMES 4.76 */

  /* hold with float (6 px) from 0.85 to 6.35; chip floats 4 px from 1.9 to 6.3 */
  tl.to(Q+"board", { y: -6, duration: 2.75, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.85);
  tl.to(Q+"chip", { y: -4, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.9);

  /* exit 8.06 to 8.66 (local 6.38 to 6.98): tile and chip slide out, board, ground and source fade, onto the West Tower photograph */
  tl.to(Q+"lift", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 6.38);  /* ends before REMEMBER 8.66 */
  tl.to(Q+"chip", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 6.38);
  tl.to(Q+"grid", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 6.38);
  tl.to(Q+"src", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 6.38);
  tl.to(Q+"ground", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 6.38);

  window.__timelines["g-a6-board-half"] = tl;
})();
</script>
