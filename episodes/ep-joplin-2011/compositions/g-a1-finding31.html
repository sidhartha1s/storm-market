<script>
window.__timelines = window.__timelines || {};
(function() {
  const HOST = 13.26; /* a1-s6 wav 12.96 + seam 0.30 */
  const tl = gsap.timeline({ paused: true });
  const P = "#f31-";
  /* ground drifts the whole host window (also holds the timeline to the host end through the seam) */
  tl.to(P+"ground", { scale: 1.03, duration: HOST, ease: "none" }, 0);
  /* page in on frame 0 */
  tl.fromTo(P+"paper", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
  /* RECORD a1-s6 1.60: source line rises */
  tl.fromTo(P+"src", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.6);
  /* slow push 0.60 to 12.96, continuous */
  tl.to(P+"paper", { scale: 1.03, duration: 12.36, ease: "none" }, 0.6);
  /* stroke 1 DESPITE a1-s6 2.68 to BELIEVED 3.24 + 0.4 */
  tl.fromTo(P+"bar1", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.96, ease: "power1.inOut" }, 2.68);
  /* stroke 2 NO a1-s6 5.34 to EVIDENCE 5.74 + 0.4 */
  tl.fromTo(P+"bar2", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.8, ease: "power1.inOut" }, 5.34);
  /* stroke 3 JOPLIN'S a1-s6 6.46 to PROBLEM. 8.74 + 0.3 = 9.04, one bar per line at one pen speed (638 + 398 px) */
  tl.fromTo(P+"bar3a", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 1.59, ease: "none" }, 6.46);
  tl.fromTo(P+"bar3b", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.99, ease: "none" }, 8.05);
  /* chip PROBLEM. a1-s6 8.74 */
  tl.fromTo(P+"chip", { autoAlpha: 0, y: -26 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 8.74);
  /* exit 12.36 to 12.96: page, chip and source line fade through to the ground */
  tl.to([P+"paper", P+"chip", P+"src"], { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 12.36);
  window.__timelines["g-a1-finding31"] = tl;
})();
