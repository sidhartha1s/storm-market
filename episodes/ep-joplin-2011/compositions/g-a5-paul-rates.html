     Local t = media/paul/ins-paul-5/raw-01.words.json time - 1.12. Transparent root: Paul's full-frame clip (ins-paul-5) sits on a lower track for the whole host window;
     the presenter circle is off. Two chips stacked in a left column beside Paul (left 96, tops 380 and 500), source chip under the second.
     The rate spans line up on one x (fixed group width) so 8 and 2 compare at a glance. Column ends left of x 900; the Flow logo patch
     (x 1692 to 1788, y 852 to 948) stays empty. If Paul's face is on the left of the real clip, mirror: swap left:96 for right:96 and set DIR = 1. */
  #a5pr-root { position:absolute; inset:0; overflow:hidden; background:transparent; font-family:Arial,sans-serif; }

  /* floats carry the y drift so each element keeps its own entrance and exit tweens */
  .a5pr-float { position:absolute; inset:auto; left:96px; }
  #a5pr-c1float { top:380px; }
  #a5pr-c2float { top:500px; }
  #a5pr-srcfloat { top:611px; }
  .a5pr-chip { position:relative; display:table; box-sizing:border-box; padding:16px 36px 16px 44px; border-radius:14px; overflow:hidden;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14); box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
    visibility:hidden; opacity:0; white-space:nowrap; }
  .a5pr-bar { position:absolute; inset:auto; left:0; top:0; bottom:0; width:8px; background:#d0121f; }
  .a5pr-g, .a5pr-r { display:inline-block; font-family:Arial,sans-serif; font-weight:700; font-size:40px; line-height:56px; letter-spacing:1px;

  .a5pr-r { font-size:52px; color:#f2f5f8; visibility:hidden; opacity:0; }
  #a5pr-src { display:table; box-sizing:border-box; padding:8px 16px; border-radius:14px;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14);
    font-family:Arial,sans-serif; font-weight:400; font-size:21px; line-height:26px; letter-spacing:.5px; color:#c8d3e0; white-space:nowrap;
    visibility:hidden; opacity:0; }
</style>
<div id="a5pr-root" data-composition-id="g-a5-paul-rates" data-duration="8.38" data-width="1920" data-height="1080">

  </div>

<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const Q = "#a5pr-";
  const DIR = -1; /* exit slide direction: away from Paul's face (column on the left, so out to the left) */

  /* "60" @1.12 (local 0.00): chip 1 group + source chip land together */
  tl.fromTo(Q + "c1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
  tl.fromTo(Q + "src", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);

  /* "8" @3.28 (local 2.16): chip 1 rate */
  tl.fromTo(Q + "c1r", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.16);

  /* "under" @7.22 (local 6.10): chip 2 with its group */
  tl.fromTo(Q + "c2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.10);

  /* "2." @8.58 (local 7.46): chip 2 rate */
  tl.fromTo(Q + "c2r", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.46);

  /* hold: slow float y +-4 px from each element's own landing to the exit, so the 3.94 s between the two rates is never still */
  tl.fromTo(Q + "c1float", { y: 0 }, { y: -4, duration: 1.06, ease: "sine.inOut", yoyo: true, repeat: 6, immediateRender: false }, 0.4);
  tl.fromTo(Q + "srcfloat", { y: 0 }, { y: -4, duration: 1.06, ease: "sine.inOut", yoyo: true, repeat: 6, immediateRender: false }, 0.4);
  tl.fromTo(Q + "c2float", { y: 0 }, { y: -4, duration: 0.86, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 6.10);

  /* exit: "2." ends @8.94 (local 7.82); the host ends at the clip cut (local 8.38), so the exit runs 7.82 to 8.38 (0.56 s, not the brief's 0.6) */
  tl.to([Q + "c1", Q + "c2", Q + "src"], { x: DIR * 60, autoAlpha: 0, duration: 0.56, ease: "power3.in" }, 7.82);

  window.__timelines["g-a5-paul-rates"] = tl;
})();
</script>
