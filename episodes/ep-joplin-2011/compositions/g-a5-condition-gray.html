      <!-- beds: 90 x 44 body centred on the group origin; GSAP places and moves each group -->
      <g id="a5cg-bed0" class="a5cg-hid"><rect x="-45" y="-22" width="90" height="44" rx="10" fill="#dfe7ee" fill-opacity=".85"/><rect x="-39" y="-15" width="20" height="30" rx="6" fill="#93a3b2"/></g>
      <g id="a5cg-bed1" class="a5cg-hid"><rect x="-45" y="-22" width="90" height="44" rx="10" fill="#dfe7ee" fill-opacity=".85"/><rect x="-39" y="-15" width="20" height="30" rx="6" fill="#93a3b2"/></g>

<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const Q = "#a5cg-";
  const root = document.getElementById("a5cg-root");
  /* stroke draw-on: dash = ceil(len) + 1, measured, never typed */
  function draw(id, at, dur, ease) {
    const el = root.querySelector(Q + id);
    /* the dash pattern restarts on every subpath, so the dash is the longest subpath (a whole-path length would finish each piece in the first few percent) */
    const probe = document.createElementNS("http://www.w3.org/2000/svg", "path");
    const pieces = el.tagName === "path" ? el.getAttribute("d").split("M").filter(Boolean).map(function (s) { return "M" + s; }) : [null];
    const len = Math.ceil(Math.max.apply(null, pieces.map(function (s) {
      if (!s) return el.getTotalLength();
      probe.setAttribute("d", s);
      return probe.getTotalLength();
    }))) + 1;
    tl.set(el, { strokeDasharray: len, strokeDashoffset: len }, 0);
    tl.set(el, { autoAlpha: 1 }, at);
    tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
  }

  /* bed i: room centre -> straight down/up through its door gap to the hallway row -> slide to its parked x.
     Numbers computed from the brief table: rooms 2,3,4,5,6,7 centre x 425,575,725,875,1025,1175; top y 385, bottom y 735; parked x 300..1150 step 170. */
  const BEDS = [[425, 385, 300], [575, 735, 470], [725, 385, 640], [875, 735, 810], [1025, 385, 980], [1175, 735, 1150]];
  const ROW = 557; /* hallway row y 560 -3, so the +-3 float spans 557 to 563 */

  tl.set(Q + "cam", { scale: 1, transformOrigin: "800px 560px" }, 0);
  BEDS.forEach(function (b, i) { tl.set(Q + "bed" + i, { x: b[0], y: b[1], rotation: 90, transformOrigin: "50% 50%" }, 0); }); /* GSAP's SVG default origin is the bbox corner, which swung the rotated bed 70 px off its room centre */
  tl.set([Q + "label1", Q + "label2"], { y: 0 }, 0);

  /* camera: slow push 1.00 -> 1.04 from frame 0 to 20.20, then "What" a5-s2 20.20: push to 1.25 until 22.76 (under 1.5x, so plain scale) */
  tl.to(Q + "cam", { scale: 1.04, duration: 20.2, ease: "none" }, 0);
  tl.to(Q + "cam", { scale: 1.25, duration: 2.56, ease: "power2.inOut" }, 20.2);

  /* clock hand: 360 deg per 12 s for the whole host, the comp's always-moving element once the card is in */
  tl.fromTo(Q + "hand", { rotation: 0, svgOrigin: "78 75" }, { rotation: 360 * 23.36 / 12, svgOrigin: "78 75", duration: 23.36, ease: "none" }, 0);

  /* "hospital" a5-s2 1.54: outer wall 1.2 s, rooms and hallway walls 0.2 s later; fills ease in under them */
  draw("outer", 1.54, 1.2);
  draw("wallsT", 1.74, 1.2);
  draw("wallsB", 1.74, 1.2);
  tl.to([Q + "roomsT", Q + "roomsB", Q + "hallfill"], { autoAlpha: 1, duration: 0.7, ease: "power1.out" }, 2.0);
  /* beds fade in over their rooms with the plan, 0.1 s apart */
  BEDS.forEach(function (b, i) { tl.fromTo(Q + "bed" + i, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 2.1 + 0.1 * i); });
  tl.fromTo(Q + "schem", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.3);

  /* "Condition" a5-s2 2.60: label, source line */
  tl.fromTo([Q + "label1", Q + "label2"], { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.6);
  tl.fromTo(Q + "src", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 2.6);

  /* "sirens" a5-s2 5.82: hallway band brightens #2a3644 -> #5a768f over 0.6 s */
  tl.to(Q + "hallfill", { fill: "#5a768f", duration: 0.6, ease: "power1.inOut" }, 5.82);

  /* "moved" a5-s2 7.50: beds roll through the door gaps, 0.15 s apart; leg 1 0.55 s, leg 2 0.38 s; last parks 9.18 <= "hallways." 8.62 + 0.6 */
  BEDS.forEach(function (b, i) {
    const t0 = 7.5 + 0.15 * i;
    tl.to(Q + "bed" + i, { y: ROW, duration: 0.55, ease: "power2.inOut" }, t0);
    tl.to(Q + "bed" + i, { x: b[2], rotation: 0, duration: 0.38, ease: "power2.out" }, t0 + 0.55);
    /* bed float 557 <-> 563 through the hold and the push (finite: 16 half-cycles of 0.85 s from 9.30 + 0.12 i end past the host) */
    tl.to(Q + "bed" + i, { y: 563, duration: 0.85, ease: "sine.inOut", yoyo: true, repeat: 15 }, 9.3 + 0.12 * i);
  });

  /* "538." a5-s2 13.48: clock card in (dial hand already turning) */
  tl.fromTo(Q + "clock", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 13.48);

  /* "five" a5-s2 16.72: chip and its source chip land together (brief section 4 truth 4: never the chip without its source) */
  tl.fromTo(Q + "chip", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.72);
  tl.fromTo(Q + "fine", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 16.72);
  tl.to([Q + "chip", Q + "fine"], { y: -4, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 17.2);

  /* before the push (20.20): chip and fine line slide out left (the right exit would cross the presenter corner), clock and label fade; HUD never rides the move */
  tl.to([Q + "chip", Q + "fine"], { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 19.55);
  tl.to(Q + "clock", { x: -40, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 19.65);
  tl.to([Q + "label1", Q + "label2", Q + "schem"], { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, 19.65);

  window.__timelines["g-a5-condition-gray"] = tl;
})();
</script>
