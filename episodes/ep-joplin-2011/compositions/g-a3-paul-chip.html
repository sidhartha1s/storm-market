<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-a3-paul-chip: A3-S8 overlay, host 539.27 for 5.84 s (nx-a3-s8 538.17 + "71" 1.10 to + "three." 6.04 + 0.9). Local t = a3-s8 words.json time - 1.10.
     Transparent root: Paul's full-frame clip (ins-paul-4) sits on a lower track for the whole host window.
     Cues come from the TTS wav; if Paul's clip carries its own audio, re-time "71" and "three." from its transcript.
     Chip left 96 / bottom 150, source chip left 96 / bottom 54; both end left of x 900; x >= 1600, y >= 680 (the logo) stays empty. */
  #a3pc-root { position:absolute; inset:0; overflow:hidden; background:transparent; font-family:Arial,sans-serif; }

  /* floats carry the y drift so each element keeps its own entrance and exit tweens */
  #a3pc-chipfloat { position:absolute; inset:auto; left:96px; bottom:150px; }
  #a3pc-chip { position:relative; display:table; box-sizing:border-box; padding:18px 40px 18px 46px; border-radius:14px; overflow:hidden;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14); box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
    visibility:hidden; opacity:0; }
  #a3pc-bar { position:absolute; inset:auto; left:0; top:0; bottom:0; width:8px; background:#d0121f; }
  #a3pc-gloss { position:absolute; inset:auto; top:0; bottom:0; left:-220px; width:140px;
    background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.22), rgba(255,255,255,0)); }
  #a3pc-text { position:relative; display:block; font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:52px; line-height:60px;
    letter-spacing:1px; color:#f2f5f8; white-space:nowrap; text-shadow:0 2px 14px rgba(0,0,0,.7); }

  #a3pc-srcfloat { position:absolute; inset:auto; left:96px; bottom:54px; }
  #a3pc-src { display:table; box-sizing:border-box; padding:8px 16px; border-radius:14px;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14);
    font-family:Arial,sans-serif; font-weight:400; font-size:20px; line-height:26px; letter-spacing:.5px; color:#c8d3e0; white-space:nowrap;
    visibility:hidden; opacity:0; }
</style>
<div id="a3pc-root" data-composition-id="g-a3-paul-chip" data-width="1920" data-height="1080">
  <div id="a3pc-chipfloat">
    <div id="a3pc-chip">
      <div id="a3pc-bar"></div>
      <div id="a3pc-gloss"></div>
      <span id="a3pc-text">71 LOST AT HOME</span>
    </div>
  </div>
  <div id="a3pc-srcfloat">
    <div id="a3pc-src">NIST Sec. 4.6.2.2</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const Q = "#a3pc-";
  tl.set(Q + "bar", { scaleY: 0, transformOrigin: "center top" }, 0);

  /* 71 @1.10 (local 0.00): chip in from the left, accent bar draws, one gloss sweep (local 0.30 to 0.90) */
  tl.fromTo(Q + "chip", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
  tl.to(Q + "bar", { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.05);
  tl.fromTo(Q + "gloss", { x: 0 }, { x: 1100, duration: 0.6, ease: "power1.inOut" }, 0.3);

  /* source chip a3-s8 1.40 (local 0.30) */
  tl.fromTo(Q + "src", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.3);

  /* hold a3-s8 1.60 to 6.30 (local 0.50 to 5.20): both float y +-3 px, 4 legs of 1.175 s, back at y 0 for the exit */
  tl.fromTo(Q + "chipfloat", { y: 0 }, { y: -3, duration: 1.175, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.5);
  tl.fromTo(Q + "srcfloat", { y: 0 }, { y: -3, duration: 1.175, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 0.5);

  /* exit a3-s8 6.30 to 6.94 (local 5.20 to 5.84 = host end): slide out x -40, alpha 0; Paul holds alone after */
  tl.to(Q + "chip", { x: -40, autoAlpha: 0, duration: 0.64, ease: "power3.in" }, 5.2);
  tl.to(Q + "src", { x: -40, autoAlpha: 0, duration: 0.64, ease: "power3.in" }, 5.2);

  window.__timelines["g-a3-paul-chip"] = tl;
})();
</script>
</template>
</body>
</html>
