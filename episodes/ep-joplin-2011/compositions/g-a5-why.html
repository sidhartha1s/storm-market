<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const Q = "#why-";

  /* 0.00: NIST page, its heading and the source line are on from frame 0 (no empty ground after the cut); the page push runs the whole NIST span so no 4 s still precedes the first underline */

  /* underline draw: dash length measured from the path, never typed */
  function draw(id, t, d) {
    const el = document.querySelector(Q + id);
    const L = Math.ceil(el.getTotalLength()) + 1;
    tl.set(el, { strokeDasharray: L, autoAlpha: 1 }, t);
    tl.fromTo(el, { strokeDashoffset: L }, { strokeDashoffset: 0, duration: d, ease: "power2.inOut" }, t);
  }

  /* "warning"@4.50: underline 1 (info flow), two printed lines; "reached"@5.30: chip LESS WORD */
  draw("u1a", 4.50, 0.20);
  draw("u1b", 4.70, 0.60);
  tl.fromTo(Q + "c1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.30);

  /* "fewer"@7.74: underline 2 (social networks); "help,"@8.78: chip LESS HELP */
  draw("u2a", 7.74, 0.62);
  draw("u2b", 8.36, 0.40);
  tl.fromTo(Q + "c2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.78);

  /* "take"@10.86: underline 3 (withstand or recover); "recover"@11.72: chip HARDER TO RECOVER */
  draw("u3a", 10.86, 0.66);
  draw("u3b", 11.52, 0.20);
  tl.fromTo(Q + "c3", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.72);

  /* hold: slow float y 4 px from each chip's landing to the swap (finite repeats) */
  tl.fromTo(Q + "c1float", { y: 0 }, { y: -4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: false }, 5.70);
  tl.fromTo(Q + "c2float", { y: 0 }, { y: -4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 9.18);
  tl.fromTo(Q + "c3float", { y: 0 }, { y: -4, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 12.12);

  /* "And"@13.20: swap. NIST page, chips and source line leave left on one ease and one travel (their spacing never changes); the NWS page follows from the right once the NIST page has cleared it */
  tl.to([Q + "nist-slide", Q + "c1", Q + "c2", Q + "c3", Q + "src1"], { x: -980, autoAlpha: 0, duration: 0.42, ease: "power3.in" }, 13.20);
  tl.fromTo([Q + "nws-slide", Q + "src2"], { x: 980 }, { x: 0, duration: 0.36, ease: "power3.out" }, 13.46);

  tl.to(Q + "nws-page", { scale: 1.03, duration: 4.26, ease: "none" }, 13.80);

  /* "disabled"@13.78: underline "elderly, infirm, or disabled" */
  draw("u4", 13.78, 0.72);

  /* exit: fade-through, wav ends 17.76, host ends 18.06 (the brief's 18.36 is clamped by g-a5-recs-board) */
  tl.to([Q + "nws-slide", Q + "src2"], { autoAlpha: 0, duration: 0.30, ease: "power1.inOut" }, 17.76);

  window.__timelines["g-a5-why"] = tl;
})();
