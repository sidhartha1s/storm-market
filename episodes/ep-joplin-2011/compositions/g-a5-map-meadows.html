<script>

(function () {
  const ID = "g-a5-map-meadows", P = "#g-a5-map-meadows-";
  const END = 11.08;
  const Z0 = 15, Z1 = 12;
  const C0 = [811.6, 598.8], M = [787.8, 618.6];  /* St. John's / Greenbriar midpoint -> Meadows (map units) */
  const A0 = [960, 540], A1 = [760, 540];          /* where each sits on screen */
  const MOVE0 = 0.60, MOVE1 = 1.78;                /* SECOND a5-s7 0.60 -> HOME, 1.18 + 0.6 */
  const R = 7 / Z1;
  const tl = gsap.timeline({ paused: true });

  /* camera: a pure function of comp time (log zoom, focus and anchor lerp), so any seek order lands the same frame */
  const camEl = document.getElementById("g-a5-map-meadows-cam");
  const ease = gsap.parseEase("power2.inOut");
  function camAt(t) {
    const u = ease(Math.max(0, Math.min(1, (t - MOVE0) / (MOVE1 - MOVE0))));
    const s = Math.exp(Math.log(Z0) + (Math.log(Z1) - Math.log(Z0)) * u);
    const fx = C0[0] + (M[0] - C0[0]) * u, fy = C0[1] + (M[1] - C0[1]) * u;
    const ax = A0[0] + (A1[0] - A0[0]) * u, ay = A0[1] + (A1[1] - A0[1]) * u;
    camEl.setAttribute("transform", "translate(" + (ax - fx * s).toFixed(2) + "," + (ay - fy * s).toFixed(2) + ") scale(" + s.toFixed(5) + ")");
  }
  camAt(0);
  tl.to({ t: 0 }, { t: 1, duration: END, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* MEADOWS a5-s7 1.84: outline lights, name label, source line */

  /* EF1. a5-s7 3.38: band fades in under the outline, its label, chip span 1 */

  tl.fromTo(P + "ef1", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.5);
  tl.fromTo(P + "chip", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.38);

  /* TWO a5-s7 4.76: 2 dots land, chip span 2 (glass grows to the new text end, then the words) */

  tl.fromTo(P + "chip", { clipPath: "inset(0px 248px 0px 0px round 14px)" },
    { clipPath: "inset(0px 0px 0px 0px round 14px)", duration: 0.4, ease: "power3.out" }, 4.76);
  tl.fromTo(P + "c2", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 4.8);

  /* hold: chip floats, dots blip 1.2 s apart */
  tl.to(P + "chip", { y: -6, duration: 1.25, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.3);
  for (let at = 5.5; at < 10.4; at += 1.2) {
    tl.to([P + "d1", P + "d2"], { attr: { r: R * 1.35 }, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 1 }, at);
  }

  /* LIVES a5-s7 6.28: source line exits (the counter card carries its own); band edge shimmer crawls under the counter's hold */
  tl.to(P + "src", { autoAlpha: 0, y: 10, duration: 0.3, ease: "power3.in" }, 6.28);
  tl.fromTo([P + "shim-n", P + "shim-s"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 6.28);
  tl.fromTo([P + "shim-n", P + "shim-s"], { strokeDashoffset: 0 }, { strokeDashoffset: -12, duration: 4.2, ease: "none" }, 6.28);

  /* wav end 10.48: chip slides out; the map holds to the cut into Paul's clip (A5-S8) */
  tl.to(P + "chip", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 10.48);

  window.__timelines[ID] = tl;
