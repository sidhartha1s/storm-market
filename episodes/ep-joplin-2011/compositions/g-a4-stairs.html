  for (let i = 1; i <= 7; i++) W.push([HEAD + 27.5 * i, FRONT + 42.5 * i]);
  W.push([1000, 900]);                                              /* W1..W7 tread centres, W8 basement floor */
  const WX0 = [724, 702, 680, 658, 636, 614, 592, 556, 528, 497, 468, 440, 411, 382, 354];   /* x before the floor walk */
  const WY0 = [560, 560, 560, 560, 560, 560, 560, 546, 546, 546, 546, 546, 546, 546, 546];
  const BX = [1244, 1208, 1172, 1136, 1100, 1064, 1028, 1262, 1226, 1190, 1154, 1118, 1082, 1046, 1010];  /* basement: back row y 884, front row y 900 */
  const E0 = 5.04 + (HEAD - WX0[0]) / V;
  for (let k = 0; k < 15; k++) {
    const id = Q + "w" + (k < 10 ? "0" : "") + k;
    const e = E0 + k * GAP;                                         /* head point W0 */
    const fl = (HEAD - WX0[k]) / V;
    tl.to(id, { x: HEAD, y: FRONT, duration: fl, ease: "none" }, e - fl);
    for (let i = 0; i < 8; i++) tl.to(id, { x: W[i][0], y: W[i][1], duration: LEG, ease: "none" }, e + i * LEG);
    const by = k < 7 ? 884 : 900;
    const bd = Math.max(0.05, (Math.abs(1000 - BX[k]) + (900 - by)) / V);
    tl.to(id, { x: BX[k], y: by, duration: bd, ease: "none" }, e + 8 * LEG);
  }

  /* THREE a4-s10 8.14: three figures turn red (director, one at each side of the hall), a hop each */
  [["d", 746, 560], ["c20", 1151, 560], ["c03", 283, 560]].forEach(([id, x, y], j) => {
    const at = 8.14 + j * 0.1;
    tl.to(Q + id + " use", { fill: "#c0392b", duration: 0.4, ease: "power2.out" }, at);
    tl.to(Q + id, { y: y - 8, duration: 0.16, ease: "power2.out" }, at);
    tl.to(Q + id, { y: y, duration: 0.3, ease: "bounce.out" }, at + 0.16);
  });

  /* BASEMENT a4-s10 9.30: basement outline pulses once, nothing red inside */
  tl.to(Q + "base", { stroke: "#7fb2e5", attr: { "stroke-width": 7 }, duration: 0.25, ease: "power2.out" }, 9.3);
  tl.to(Q + "base", { stroke: "#5a768f", attr: { "stroke-width": 3 }, duration: 0.5, ease: "power2.inOut" }, 9.55);
  tl.to(Q + "basefill", { opacity: 0.6, duration: 0.25, ease: "power2.out" }, 9.3);
  tl.to(Q + "basefill", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.55);

  /* DIRECTOR a4-s10 11.34: label drops in, leader draws to her head */
  tl.fromTo(Q + "dirlab", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 11.34);
  tl.to(Q + "dirline", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 11.5);

  /* hold: every figure floats 2 px, from the end of the entrance to the exit */
  FIG.forEach(([id], i) => {
    const dur = 0.9 + (i % 5) * 0.07, at = 2.0 + (i % 7) * 0.13;
    const legs = Math.floor((END - 0.7 - at) / dur);
    tl.to(Q + id + " .a4sti-fl", { y: -2, duration: dur, ease: "sine.inOut", yoyo: true, repeat: legs - 1 }, at);
  });
  tl.to(Q + "chip1float", { y: -3, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 15 }, 2.4);
  tl.to(Q + "chip2float", { y: -3, duration: 0.75, ease: "sine.inOut", yoyo: true, repeat: 11 }, 5.6);
  tl.to(Q + "srcfloat", { y: -3, duration: 1.0, ease: "sine.inOut", yoyo: true, repeat: 7 }, 5.8);

  /* exit, last 0.6 s: chips and source slide out left, the diagram and its ground fade through to the next picture */
  tl.to(Q + "chip1", { x: -1000, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, END - 0.6);
  tl.to(Q + "chip2", { x: -1000, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, END - 0.6);
  tl.to(Q + "src", { x: -1000, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, END - 0.6);
  tl.to(Q + "cam", { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, END - 0.5);
  tl.to(Q + "ground", { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, END - 0.5);

  window.__timelines["g-a4-stairs"] = tl;
})();
