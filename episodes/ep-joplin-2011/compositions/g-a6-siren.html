<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const MOUTH = "629.7 410";
  const ARC = ["#sr-arc1", "#sr-arc2", "#sr-arc3"];

  /* SIRENS? s5 9.86 (host 0): icon pops in, arcs start; icon holds a 4 px float to the exit */

  ARC.forEach((a, i) => {
    tl.fromTo(a, { scale: 0.9, autoAlpha: 0.9, svgOrigin: MOUTH }, { scale: 1.05, autoAlpha: 0, svgOrigin: MOUTH, duration: 1.2, ease: "power1.out", repeat: 3, repeatDelay: 0 }, 0.4 * i);

  tl.fromTo("#sr-arc1", { scale: 0.9, autoAlpha: 0.9, svgOrigin: MOUTH }, { scale: 1.05, autoAlpha: 0, svgOrigin: MOUTH, duration: 1.2, ease: "power1.out", repeat: 7, repeatDelay: 0.15 }, 4.95);
  tl.fromTo("#sr-arc2", { scale: 0.9, autoAlpha: 0.9, svgOrigin: MOUTH }, { scale: 1.05, autoAlpha: 0, svgOrigin: MOUTH, duration: 1.2, ease: "power1.out", repeat: 5, repeatDelay: 0.45 }, 5.65);
  tl.fromTo("#sr-arc3", { scale: 0.9, autoAlpha: 0.9, svgOrigin: MOUTH }, { scale: 1.05, autoAlpha: 0, svgOrigin: MOUTH, duration: 1.2, ease: "power1.out", repeat: 5, repeatDelay: 0.30 }, 5.9);

  /* STANDARD s6 2.54 (host 3.66): chip 1 and the source line slide in */
  tl.fromTo("#sr-chip1", { x: 60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 3.66);
  tl.fromTo("#sr-src", { x: -40, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 3.66);

  /* ALL s6 6.40 (host 7.52): arcs dim to 0.4, no all-clear chip */
  tl.to("#sr-arcs", { autoAlpha: 0.4, duration: 0.5, ease: "power2.out" }, 7.52);

  /* EXIT s6 13.96 (host 15.08) to "The" 14.56 (host 15.68): icon, arcs, chip and source line slide out */
  tl.to(["#sr-stage", "#sr-chip1", "#sr-src"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 15.08);

  window.__timelines["g-a6-siren"] = tl;
})();
</script>
