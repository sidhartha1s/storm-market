<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-a2-map-close", P = "#a2mc-", M = "#a2mc-mm-";
  const D = 20.9;                                       /* host data-duration */
  const S10 = -14.62, S11 = 3.40, S12 = 12.90;          /* nx-a2-sN data-start - host 452.37 */
  const CX = 874.1, CY = 505.7, ORG = CX + " " + CY;
  const PX = 1097.6, PY = 578.4;                        /* push origin: residential centroid on screen (calc.mjs) */
  const tl = gsap.timeline({ paused: true });
  const cam = (s) => ({ attr: { transform: "translate(" + (CX * (1 - s)).toFixed(3) + "," + (CY * (1 - s)).toFixed(3) + ") scale(" + s + ")" } });
  const pan = (x, y) => ({ attr: { transform: "translate(" + x + "," + y + ")" } });
  const push = (k) => ({ attr: { transform: "translate(" + (PX * (1 - k)).toFixed(3) + "," + (PY * (1 - k)).toFixed(3) + ") scale(" + k + ")" } });

  /* camera still until "best" (labels sit on the HUD, never on a move); push(1) is the identity, so frame 0 needs no set */
  tl.set(P + "push", push(1), 0);
  tl.set(P + "strike", { rotation: 45, scaleX: 0, transformOrigin: "left center" }, 0);

  /* AND a2-s10 14.62 = 0: ground up from frame 0 (CSS), under g-a2-doc-cues' exit */
  /* SECOND a2-s10 15.18: ring A draws 0.4 s with its stamp; pulse (three copies, 1.2 s + 0.4 s rest, staggered 0.4 s) through a2-s11 */
  tl.fromTo(M + "ring-a-c", { strokeDashoffset: 2640 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, S10 + 15.18);
  tl.fromTo(P + "stamp", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, S10 + 15.18 + 0.2);
  tl.set(M + "ring-a-pulses", { autoAlpha: 1 }, S10 + 15.58);
  for (let i = 1; i <= 3; i++) {
    tl.fromTo(M + "ring-a-p" + i, { autoAlpha: 0.8, scale: 1, svgOrigin: ORG },
      { autoAlpha: 0, scale: 1.18, svgOrigin: ORG, duration: 1.2, ease: "power1.out", repeat: 6, repeatDelay: 0.4, immediateRender: false },
      S10 + 15.58 + (i - 1) * 0.4);
  }
  /* DEPENDED a2-s11 0.42: source line */
  tl.fromTo(P + "src", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S11 + 0.42);
  /* WORSE a2-s11 3.02: west leader draws 0.35 s, chip lands at its end */
  tl.fromTo(P + "lead-w", { strokeDashoffset: 141 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, S11 + 3.02);
  tl.fromTo(P + "tag-w", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S11 + 3.02 + 0.2);
  /* ALL a2-s11 5.02: east leader, chip "All clear" */
  tl.fromTo(P + "lead-e", { strokeDashoffset: 141 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, S11 + 5.02);
  tl.fromTo(P + "tag-e", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S11 + 5.02 + 0.2);
  /* ALL a2-s11 8.02: crossed siren icon in, strike draws corner to corner 0.35 s */
  tl.fromTo(P + "icon", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, S11 + 8.02);
  tl.to(P + "strike", { scaleX: 1, duration: 0.35, ease: "power2.out" }, S11 + 8.02 + 0.15);
  /* SIGNAL. a2-s11 8.48: chip */
  tl.fromTo(P + "chip", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S11 + 8.48);

  /* 538, a2-s12 0.76: labels, icon, chip and source exit 0.5 s; leaders retract; ring pulses once more */
  const OUT = S12 + 0.76;
  tl.to([P + "tag-w", P + "tag-e", P + "icon", P + "chip", P + "src"], { autoAlpha: 0, y: -20, duration: 0.5, ease: "power3.in" }, OUT);
  tl.to([P + "lead-w", P + "lead-e"], { strokeDashoffset: 141, duration: 0.5, ease: "power3.in" }, OUT);
  tl.fromTo(M + "ring-a-p1", { autoAlpha: 0.8, scale: 1, svgOrigin: ORG },
    { autoAlpha: 0, scale: 1.18, svgOrigin: ORG, duration: 1.2, ease: "power1.out", immediateRender: false }, OUT);
  /* stamp leaves before the push (no text rides a move) */
  tl.to(P + "stamp", { autoAlpha: 0, y: -14, duration: 0.3, ease: "power3.in" }, S12 + 2.46 - 0.35);

  /* BEST a2-s12 2.46: residential dots light west to east (0.05 s steps, 0.6 s total); push 1.00 -> 1.12, ending 1.0 s before host end */
  const dots = Array.from(document.querySelectorAll("#a2mc-res .a2mc-dot"));
  const xs = dots.map((d) => +d.getAttribute("cx")), x0 = Math.min(...xs), x1 = Math.max(...xs);
  dots.forEach((d, i) => {
    const step = Math.min(10, Math.floor(11 * (xs[i] - x0) / (x1 - x0)));
    tl.fromTo(d, { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%" },
      { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", duration: 0.1, ease: "back.out(2)" }, S12 + 2.46 + step * 0.05);
  });
  tl.to(P + "push", Object.assign(push(1.12), { duration: (D - 1.0) - (S12 + 2.46), ease: "power2.inOut" }), S12 + 2.46);
  /* UNDERNEATH a2-s12 6.36: below-ground line draws L to R 0.8 s, label rises (HUD, at the line's end-of-push position) */
  tl.fromTo(M + "below", { strokeDashoffset: 1301 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, S12 + 6.36);
  tl.fromTo(P + "below-lab", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, S12 + 6.36 + 0.35);
  /* SPOT. a2-s12 7.22: hold on the finished state, drift only; the editor's chapter blackout follows */
  tl.to(P + "push", Object.assign(push(1.125), { duration: 1.0, ease: "none" }), D - 1.0);

  window.__timelines[ID] = tl;
})();
