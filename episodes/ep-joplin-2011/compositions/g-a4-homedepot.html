<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<template>
<style>
  /* g-a4-homedepot: A4-S5, host 667.307 to 684.167 (16.86 s). nx-a4-s5 starts 662.747 = host start - 4.56, so local t = a4-s5 words.json time - 4.56.
     Full-frame plan on its own ground, same plan family as g-a4-walmart (plan x 260-1260, y 200-800, rail x 1320+). SCHEMATIC, NOT TO SCALE (Open 4). */
  #g-a4-homedepot-root { position:absolute; inset:0; overflow:hidden; background:transparent; font-family:Arial,sans-serif; }
  #hd-ground { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, #0b1016, #030507 78%); }
  #hd-cam { position:absolute; inset:0; }
  #hd-svg { position:absolute; inset:0; width:1920px; height:1080px; }
  .hd-hid { opacity:0; visibility:hidden; }

  #hd-sch { position:absolute; inset:auto; left:96px; top:72px; font-family:Arial,sans-serif; font-weight:700; font-size:22px; line-height:26px;
    letter-spacing:3px; color:#93a3b2; white-space:nowrap; opacity:0; visibility:hidden; }
  #hd-eye { position:absolute; inset:auto; left:1320px; top:157px; font-family:Arial,sans-serif; font-weight:700; font-size:22px; line-height:26px;
    letter-spacing:4px; color:#93a3b2; white-space:nowrap; opacity:0; visibility:hidden; }

  .hd-float { position:absolute; inset:auto; }
  .hd-chip { position:relative; display:table; box-sizing:border-box; padding:3px 22px 3px 28px; border-radius:12px; overflow:hidden;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14); box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
    visibility:hidden; opacity:0; }
  .hd-bar { position:absolute; inset:auto; left:0; top:0; bottom:0; width:8px; background:#d8a13a; }
  .hd-chiptext { position:relative; display:block; font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:36px; line-height:38px;
    letter-spacing:0; color:#f2f5f8; white-space:nowrap; text-shadow:0 2px 14px rgba(0,0,0,.7); }

  #hd-r1float { left:1320px; top:246px; }
  #hd-r1 { display:block; width:504px; }
  #hd-r1 .hd-chiptext { white-space:normal; }
  #hd-lfloat { left:1320px; top:414px; }
  #hd-lost { display:table; padding:4px 26px 4px 30px; }
  #hd-lost .hd-chiptext { font-size:72px; line-height:76px; color:#e74c3c; }

  #hd-srcfloat { left:96px; bottom:54px; }
  #hd-src { display:block; box-sizing:border-box; max-width:1404px; padding:6px 12px; border-radius:14px;
    background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,.14); visibility:hidden; opacity:0; }
  #hd-srcline { display:block; font-family:Arial,sans-serif; font-weight:400; font-size:20px; line-height:26px; letter-spacing:0;
    color:#c8d3e0; white-space:normal; }

  #hd-black { position:absolute; inset:0; background:#000; opacity:0; visibility:hidden; }
</style>
<div id="g-a4-homedepot-root" data-composition-id="g-a4-homedepot" data-width="1920" data-height="1080">
  <div id="hd-ground"></div>
  <div id="hd-cam">
    <svg id="hd-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="hd-blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="14"/></filter>
      </defs>

      <!-- PLAN: back wall = top edge, front wall = bottom edge. Floor outside the training room (brightens on "Out") -->
      <g id="hd-plan">
        <path id="hd-floor" class="hd-hid" fill-rule="evenodd" d="M260 200 H1260 V800 H260 Z M300 200 H540 V330 H300 Z" fill="#dfe7ee" fill-opacity="0.08"/>
        <rect id="hd-rglow" class="hd-hid" x="300" y="200" width="240" height="130" fill="#d8a13a" filter="url(#hd-blur)"/>
        <rect id="hd-rfill" class="hd-hid" x="300" y="200" width="240" height="130" fill="#d8a13a"/>
        <rect id="hd-rband" class="hd-hid" x="300" y="200" width="240" height="130" fill="none" stroke="#d8a13a" stroke-width="2" stroke-dasharray="8 6"/>
        <path id="hd-pout" d="M260 200 H1260 V800 H260 Z" fill="none" stroke="#dfe7ee" stroke-width="4" stroke-dasharray="3201" stroke-dashoffset="3201"/>
        <g id="hd-dots"></g>
        <g id="hd-bpan"></g>
        <path id="hd-path" class="hd-hid" d="M1160 760 H420" fill="none" stroke="#d8a13a" stroke-width="5"/>
        <g id="hd-fpan"></g>
        <polygon id="hd-arr" class="hd-hid" points="0,0 24,-13 24,13" fill="#d8a13a"/>
      </g>
      <g id="hd-entg" class="hd-hid">
        <path d="M1160 790 V810 M1220 790 V810" fill="none" stroke="#d8a13a" stroke-width="4"/>
        <path d="M1160 800 H1220" fill="none" stroke="#d8a13a" stroke-width="7"/>
      </g>
      <g id="hd-backg" class="hd-hid"><text id="hd-back" x="760" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#93a3b2">BACK</text></g>
      <g id="hd-frontg" class="hd-hid"><text id="hd-front" x="760" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#93a3b2">FRONT</text></g>
      <g id="hd-rlabg" class="hd-hid"><text id="hd-rlab" x="420" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#93a3b2">TRAINING ROOM</text></g>
      <g id="hd-entlabg" class="hd-hid"><text id="hd-entlab" x="1190" y="880" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#93a3b2">LUMBER ENTRANCE</text></g>
    </svg>
  </div>

  <div id="hd-sch">SCHEMATIC &#183; NOT TO SCALE</div>
  <div id="hd-eye">HOME DEPOT</div>
  <div id="hd-r1float" class="hd-float">
    <div id="hd-r1" class="hd-chip"><div class="hd-bar"></div><span class="hd-chiptext">ABOUT 35 IN THE TRAINING ROOM</span></div>
  </div>
  <div id="hd-lfloat" class="hd-float">
    <div id="hd-lost" class="hd-chip"><div class="hd-bar"></div><span class="hd-chiptext">8 LOST</span></div>
  </div>
  <div id="hd-srcfloat" class="hd-float">
    <div id="hd-src"><span id="hd-srcline">8 per death certificates &#183; 7 inside per survivors &#183; lumber entrance and front wall per store management &#183; NIST Sec. 4.6.2.1 &#183; Sec. 1.2</span></div>
  </div>
  <div id="hd-black"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const Q = "#hd-";
  const END = 16.86;                       /* host length; a4-s5 words.json time - 4.56 = comp-local time */
  const NS = "http://www.w3.org/2000/svg";
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  /* THE 35 DOTS: [x, y, float x, float y, float dur, float delay]. Computed once (inline python3, 18 Oct 26, random.Random(20110522)):
     35 points inside the training room (x 300-540, y 200-330), dot centre 16 px clear of every room wall (8 px dot = 12 px edge clearance
     before the float), 22 px or more apart. */
  const D = [[460,314,-2.2,-2.7,1.68,0.34],[325,272,2.2,1.5,1.53,0.56],[450,268,0.3,-0.8,1.51,0.99],[517,218,2.8,1.5,1.51,0.54],[480,246,1.5,-1.4,1.8,0.89],[375,244,0.3,1.9,1.45,0.36],[395,258,0.9,-2.5,1.29,0.07],[483,219,-2.2,0.0,1.01,0.96],[429,280,-0.1,0.5,1.25,0.21],[364,267,0.5,-0.1,1.23,0.95],[512,267,1.9,1.3,1.62,0.38],[324,217,2.6,1.2,1.42,0.78],[371,294,-2.3,2.2,1.19,0.45],[413,307,0.8,-1.5,1.45,0.3],[332,299,-2.7,1.9,1.01,0.83],[388,311,0.7,-1.9,1.25,0.98],[439,229,-0.1,2.2,1.78,0.39],[500,234,0.3,1.0,1.73,0.79],[483,271,-1.8,0.6,1.4,0.77],[520,246,-2.7,-2.2,1.84,0.4],[345,253,0.5,0.5,1.52,0.76],[352,314,-2.7,2.0,1.23,0.76],[398,287,2.6,-1.4,1.8,0.74],[438,310,0.3,2.2,1.36,0.92],[404,219,2.6,-0.3,1.28,0.04],[422,250,1.5,1.4,1.35,0.1],[502,291,-1.6,0.0,1.06,0.09],[521,307,0.7,2.9,1.66,0.57],[354,223,2.7,-1.2,1.47,0.67],[466,287,-2.9,0.8,1.41,0.82],[460,219,-1.5,-0.6,1.88,0.21],[318,249,-0.9,1.1,1.27,0.06],[376,219,1.6,2.9,1.44,0.18],[484,305,-1.4,2.8,1.73,0.16],[456,244,-2.8,0.9,1.37,0.88]];

  /* build the 35 dots: pos group (x, y) > float group (+-3 px) > 8 px circle (pop) */
  const layer = document.getElementById("hd-dots");
  D.forEach((d, i) => {
    const g = mk("g", { class: "hd-hid" }), f = mk("g"), c = mk("circle", { r: 4, fill: "#dfe7ee", "fill-opacity": 0.85 });
    f.appendChild(c); g.appendChild(f); layer.appendChild(g);
    const t0 = 0.16 + ((i * 13) % 35) / 35 * 0.6;                  /* 35 a4-s5 4.72: pops spread over 0.6 s */
    tl.set(g, { x: d[0], y: d[1] }, 0);
    tl.set(c, { scale: 0 }, 0);
    tl.to(g, { autoAlpha: 1, duration: 0.2, ease: "power1.out" }, t0);
    tl.to(c, { scale: 1, duration: 0.3, ease: "back.out(2)" }, t0);
    const fs = t0 + 0.35 + d[5];                                   /* seeded float, whole time, finite repeats */
    tl.to(f, { x: d[2], y: d[3], duration: d[4], ease: "sine.inOut", yoyo: true, repeat: Math.floor((END - 0.7 - fs) / d[4]) - 1 }, fs);
  });

  /* PANELS (computed): 4 back panels x 300-540, 60 wide, y 120-200 (outside, above the back wall); 13 front panels 60 wide, 4 px gaps,
     x 300 + 64 i (last ends 300 + 12 x 64 + 60 = 1128), y 720-800 (inside, over the path). Crimson 0.7, grown by scaleY from the wall line. */
  const bp = [], fp = [];
  for (let i = 0; i < 4; i++) {
    const r = mk("rect", { class: "hd-hid", x: 300 + 60 * i, y: 120, width: 60, height: 80, fill: "#8e2020", "fill-opacity": 0.7, stroke: "#04070c", "stroke-width": 2 });
    document.getElementById("hd-bpan").appendChild(r); bp.push(r);
    tl.set(r, { svgOrigin: (330 + 60 * i) + " 200", scaleY: 0 }, 0);
  }
  for (let i = 0; i < 13; i++) {
    const r = mk("rect", { class: "hd-hid", x: 300 + 64 * i, y: 720, width: 60, height: 80, fill: "#8e2020", "fill-opacity": 0.7 });
    document.getElementById("hd-fpan").appendChild(r); fp.push(r);
    tl.set(r, { svgOrigin: (330 + 64 * i) + " 800", scaleY: 0 }, 0);
  }

  /* WALKING PATH dash: 31 dashes of 14 with gaps of 10 (744 px >= the 740 px path), then a 0 dash and an 800 px gap, so a dashoffset
     of 744 hides all of it and 4 shows all of it; the head sits at x = 1160 - 744 p. */
  const seg = []; for (let k = 0; k < 31; k++) seg.push(14, 10); seg.push(0, 800);
  const path = document.getElementById("hd-path");
  path.setAttribute("stroke-dasharray", seg.join(" "));
  tl.set(path, { strokeDashoffset: 744 }, 0);
  tl.set(Q + "arr", { x: 1160, y: 760 }, 0);
  tl.set(Q + "entg", { svgOrigin: "1190 800", scaleX: 0 }, 0);

  /* frame 0: ground on, outline starts to draw. About a4-s5 4.56 to 5.30 */
  tl.to(Q + "pout", { strokeDashoffset: 0, duration: 0.74, ease: "power1.inOut" }, 0);

  /* 35 a4-s5 4.72: dots pop (above), the room's dashed outline marks where they stand. Eyebrow + BACK, FRONT, SCHEMATIC at a4-s5 5.06 */
  tl.to(Q + "rband", { autoAlpha: 0.6, duration: 0.5, ease: "power1.out" }, 0.2);
  tl.fromTo(Q + "eye", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.5);
  tl.fromTo(Q + "backg", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.5);
  tl.fromTo(Q + "frontg", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.5);
  tl.fromTo(Q + "sch", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.5);

  /* TRAINING a4-s5 6.08: room lights amber + its label; ROOM a4-s5 6.32: row 1 */
  tl.to(Q + "rfill", { autoAlpha: 0.35, duration: 0.5, ease: "power2.out" }, 1.52);
  tl.to(Q + "rglow", { autoAlpha: 0.3, duration: 0.6, ease: "power2.out" }, 1.52);
  tl.fromTo(Q + "rlabg", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.52);
  tl.fromTo(Q + "r1", { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 1.76);
  tl.fromTo(Q + "r1 .hd-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.out", transformOrigin: "center top" }, 1.84);

  /* FELL a4-s5 9.62 to OUTWARD 9.92 + 0.6 s: the four back panels fall outward, each grown up from the wall line (y 200) to y 120, away from the room */
  bp.forEach((r, i) => {
    tl.to(r, { autoAlpha: 1, duration: 0.1, ease: "none" }, 5.06 + i * 0.1);
    tl.to(r, { scaleY: 1, duration: 0.6, ease: "power3.in" }, 5.06 + i * 0.1);
  });
  /* AWAY a4-s5 10.58: room glow pulses */
  tl.to(Q + "rglow", { autoAlpha: 0.7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.02);

  /* OUT a4-s5 12.06: training room dims to 0.5, rest of the floor brightens */
  tl.to(Q + "rfill", { autoAlpha: 0.175, duration: 0.5, ease: "power2.inOut" }, 7.5);
  tl.to(Q + "rglow", { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" }, 7.5);
  tl.to(Q + "rband", { autoAlpha: 0.3, duration: 0.5, ease: "power2.inOut" }, 7.5);
  tl.to(Q + "floor", { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 7.5);

  /* EIGHT a4-s5 13.44: row 2 (rail only, no marker on the plan) */
  tl.fromTo(Q + "lost", { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 8.88);
  tl.fromTo(Q + "lost .hd-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power2.out", transformOrigin: "center top" }, 8.96);

  /* THE a4-s5 15.04: source line */
  tl.fromTo(Q + "src", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 10.48);

  /* LUMBER a4-s5 17.30: entrance marker + label */
  tl.to(Q + "entg", { autoAlpha: 1, scaleX: 1, duration: 0.45, ease: "back.out(2)" }, 12.74);
  tl.fromTo(Q + "entlabg", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 12.74);

  /* WALKING a4-s5 18.54 to WALL 19.62: the dashed path draws from the entrance leftward; the arrowhead rides its head (both linear) */
  tl.to(path, { autoAlpha: 1, duration: 0.1, ease: "none" }, 13.98);
  tl.to(Q + "arr", { autoAlpha: 1, duration: 0.1, ease: "none" }, 13.98);
  tl.to(path, { strokeDashoffset: 4, duration: 1.08, ease: "none" }, 13.98);
  tl.to(Q + "arr", { x: 420, duration: 1.08, ease: "none" }, 13.98);

  /* CAME a4-s5 20.28 to 20.90: the 13 front panels fall inward from the wall line (y 800) to y 720, right to left, over the path */
  fp.slice().reverse().forEach((r, j) => {
    tl.to(r, { autoAlpha: 1, duration: 0.1, ease: "none" }, 15.72 + j * 0.012);
    tl.to(r, { scaleY: 1, duration: 0.48, ease: "power3.in" }, 15.72 + j * 0.012);
  });

  /* hold: chip wrappers float 3 px (dots float all along) */
  const FL = (id, at, dur) => tl.to(Q + id, { y: -3, duration: dur, ease: "sine.inOut", yoyo: true, repeat: Math.floor((END - 0.7 - at) / dur) - 1 }, at);
  FL("r1float", 2.3, 0.75); FL("lfloat", 9.4, 0.75); FL("srcfloat", 10.95, 1.0);

  /* exit, last 0.6 s: rail slides right, source slides left, the whole picture fades through to black */
  ["eye", "r1", "lost"].forEach(id => tl.to(Q + id, { x: 1000, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, END - 0.6));
  tl.to(Q + "src", { x: -1000, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, END - 0.6);
  tl.to(Q + "sch", { autoAlpha: 0, duration: 0.5, ease: "power1.in" }, END - 0.5);
  tl.to(Q + "black", { autoAlpha: 1, duration: 0.6, ease: "power1.in" }, END - 0.6);

  window.__timelines["g-a4-homedepot"] = tl;
})();
</script>
</template>
</body>
