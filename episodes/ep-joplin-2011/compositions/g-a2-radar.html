<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#a2rd-";
  const D = 23.22;                 /* host data-duration (22.92 + the 0.3 s seam to ins-paul-3, 18 Oct 26); the exit is its last 0.6 s */
  const EXIT = D - 0.6;
  const tl = gsap.timeline({ paused: true });

  tl.set(P + "img", { scale: 1, transformOrigin: "50% 50%" }, 0);

  /* The a2-s8 0.00: still in, push starts (1.00 to 1.06, ease none, whole host), clock card in on 5:17 PM, source line */
  tl.fromTo(P + "plate", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0);
  tl.fromTo(P + "still", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0);
  tl.fromTo(P + "credit", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0);
  tl.to(P + "img", { scale: 1.06, duration: D, ease: "none" }, 0);

  /* clock hand: 360 deg per 12 s for the whole host, the comp's always-moving element (as g-a2-countdown) */
  tl.fromTo(P + "hand", { rotation: 0, svgOrigin: "78 75" }, { rotation: 360 * D / 12, svgOrigin: "78 75", duration: D, ease: "none" }, 0);

  /* swaps: the old leaf leaves 0.25 s (clock) / 0.2 s (chip) before the cue, so two never show at once */
  const timeIn = (id, at) => tl.fromTo(P + id, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, at);
  const timeOut = (id, at) => tl.to(P + id, { autoAlpha: 0, y: -40, duration: 0.45, ease: "power3.out" }, at);
  const roll = (from, to, at) => { timeOut(from, at - 0.25); timeIn(to, at); };
  const chipIn = (id, at) => tl.fromTo(P + id, { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, at);

  tl.fromTo(P + "clock", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0);
  timeIn("t517", 0.15);
  tl.fromTo(P + "src", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.15);

  /* 529, @4.44: clock rolls to 5:29 PM */
  roll("t517", "t529", 4.44);
  /* 534, @6.24: clock rolls to 5:34 PM and stays (never past 5:34) */
  roll("t529", "t534", 6.24);

  /* wrapped @8.88: chip RAIN-WRAPPED */
  chipIn("chip1", 8.88);
  /* tornado @11.92: chip NO TORNADO EMERGENCY replaces it */
  tl.to(P + "chip1", { autoAlpha: 0, y: -20, duration: 0.3, ease: "power3.out" }, 11.92 - 0.2);
  chipIn("chip2", 11.92);

  /* fast, @16.04: comment card slides in; "moving?" @22.10 is the hold */
  tl.fromTo(P + "card", { x: 660, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 16.04);

  /* exit, the last 0.6 s: comment card and chip slide out, still, plate, clock and source fade */
  tl.to([P + "card", P + "chip2"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);
  tl.to([P + "still", P + "plate", P + "credit", P + "clock", P + "src"], { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, EXIT);

  window.__timelines["g-a2-radar"] = tl;
})();
