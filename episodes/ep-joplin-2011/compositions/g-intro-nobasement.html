<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-intro-nobasement", P = "#gnb-", H = "#gnb-h-", M = "#gnb-mm-";
  const root = document.getElementById("g-intro-nobasement-root");
  const tl = gsap.timeline({ paused: true });
  /* stroke draw-on: dash = ceil(len) + 1, measured, never typed */
  function draw(sel, at, dur, ease) {
    root.querySelectorAll(sel).forEach(function (el) {
      const len = Math.ceil(el.getTotalLength()) + 1;
      tl.set(el, { strokeDasharray: len, strokeDashoffset: len }, 0);
      tl.set(el, { autoAlpha: 1 }, at);
      tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power2.inOut" }, at);
    });
  }
  const swapIn = (sel, at) => tl.fromTo(sel, { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, at);
  const swapOut = (sel, at) => tl.to(sel, { autoAlpha: 0, duration: 0.15, ease: "power1.in" }, at);

  /* ---- frame 0: ground, grade line and "Ground" on; transforms start here ---- */
  tl.set(P + "bar", { scaleY: 0, transformOrigin: "center top" }, 0);
  tl.set(P + "card", { x: 660 }, 0);

  /* SCENE A push 1.00 -> 1.03 about the frame centre, linear, to the fade-through */
  tl.to(P + "hsvg", { scale: 1.03, transformOrigin: "960px 540px", duration: 2.82, ease: "none" }, 0);

  /* ABOUT i1-s1 3.52 (0.00): house draws, walls 0.5 s then roof 0.3 s */
  tl.to(H + "found", { autoAlpha: 1, duration: 0.4 }, 0);
  draw(H + "wallL, " + H + "wallR, " + H + "floor, " + H + "ceil", 0, 0.5);
  tl.to(H + "wallfills", { autoAlpha: 1, duration: 0.3 }, 0.3);
  draw(H + "roof", 0.5, 0.3);
  tl.to(H + "rooffill", { autoAlpha: 1, duration: 0.3 }, 0.6);

  /* 8 i1-s1 3.62 (0.10): chip in, accent bar draws, one gloss sweep */
  tl.fromTo(P + "chip", { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.10);
  tl.to(P + "bar", { scaleY: 1, duration: 0.45, ease: "power2.out" }, 0.15);
  tl.fromTo(P + "gloss", { x: 0 }, { x: 1100, duration: 0.6, ease: "power1.inOut" }, 0.40);

  /* NONE. i1-s1 4.62 (1.10): ghost dashes draw on 0.8 s, label; source line at +0.2 */
  tl.set(H + "ghost", { autoAlpha: 1 }, 1.10);
  draw(H + "ghostdraw", 1.10, 0.8, "power1.inOut");
  tl.fromTo(H + "ghostlabel", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.30);
  tl.fromTo(P + "src1", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.30);

  /* AND i1-s1 6.14 (2.62): chip out, source out, fade-through 0.4 s to the map */
  tl.to(P + "chip", { autoAlpha: 0, y: -20, duration: 0.3, ease: "power3.in" }, 2.62);
  swapOut(P + "src1", 2.62);
  tl.to(P + "house", { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, 2.62);
  tl.to(P + "map", { autoAlpha: 1, duration: 0.2, ease: "power1.out" }, 2.82);

  /* SINGLE i1-s1 6.74 -> 8.00 (3.22 -> 4.48): scan sweeps x 200 -> 1500, finds nothing */
  tl.set(P + "scan", { autoAlpha: 1, x: 140 }, 3.22);
  tl.to(P + "scan", { x: 1440, duration: 1.26, ease: "none" }, 3.22);
  tl.to(P + "scan", { autoAlpha: 0, duration: 0.15, ease: "none" }, 4.48);

  /* SHELTER i1-s1 7.40 (3.88): shelter label, source line */
  tl.fromTo(P + "shelter", { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.88);
  swapIn(P + "src2", 3.88);

  /* TOWN i1-s1 8.08 (4.56): "Joplin"; 50 i1-s1 8.68 (5.16): population line */
  tl.fromTo(P + "cityname", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 4.56);
  tl.fromTo(P + "citypop", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.16);

  /* ,000. i1-s1 9.10 (5.58): shelter label out; path polygon in 0.3 s, centre line draws W to E 1.3 s; source swaps */
  tl.to(P + "shelter", { autoAlpha: 0, y: -16, duration: 0.3, ease: "power3.in" }, 5.58);
  swapOut(P + "src2", 5.58);
  swapIn(P + "src3", 5.73);
  tl.to(M + "l-path", { opacity: 1, duration: 0.3, ease: "power1.out" }, 5.58);
  tl.fromTo(M + "track", { strokeDashoffset: 1036 }, { strokeDashoffset: 0, duration: 1.3, ease: "power1.inOut" }, 5.58);

  /* 9.90 / 10.30 unspoken (6.38 / 6.78): path labels, after the draw has left the city */
  tl.fromTo(P + "lab1", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.38);
  tl.fromTo(P + "lab2", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.78);

  /* EVEN i1-s1 10.62 + 0.3 (7.40): path labels out 0.3 s */
  tl.to([P + "lab1", P + "lab2"], { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 7.40);

  /* HAD i1-s1 11.34 (7.82): inset card slides in, map dims to 40 %, source swaps; map drifts +1 % to the host end */
  tl.set(P + "card", { autoAlpha: 1 }, 7.82);
  tl.to(P + "card", { x: 0, duration: 0.7, ease: "power3.out" }, 7.82);
  tl.to(P + "map", { opacity: 0.4, duration: 0.5, ease: "power1.out" }, 7.82);
  tl.to(P + "map", { scale: 1.01, transformOrigin: "960px 540px", duration: 11.34 - 7.82, ease: "none" }, 7.82);
  swapOut(P + "src3", 7.82);
  swapIn(P + "src4", 7.97);

  /* BASEMENT i1-s1 11.66 (8.14): basement lit, label */
  tl.to(P + "i-lit", { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, 8.14);
  tl.fromTo(P + "baselab", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.14);

  /* DOWN i1-s1 12.64 (9.12): a soft light pulse runs down the stair, 0.6 s */
  (function () {
    const el = root.querySelector(P + "i-pulse");
    const len = Math.ceil(el.getTotalLength()) + 1, seg = 40;
    tl.set(el, { strokeDasharray: seg + " " + (len + seg), strokeDashoffset: seg }, 0);
    tl.set(el, { autoAlpha: 1 }, 9.12);
    tl.to(el, { strokeDashoffset: -len, duration: 0.6, ease: "power1.in" }, 9.12);
    tl.set(el, { autoAlpha: 0 }, 9.72);
  })();

  /* hold to the host end (14.56 + seam = 11.34): card floats y 0 -> -3 -> 0, two cycles; cut on the host end */
  tl.to(P + "card", { y: -3, duration: 0.68, ease: "sine.inOut", yoyo: true, repeat: 3 }, 8.60);

  window.__timelines[ID] = tl;
})();
