<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-a6-saferoom", P = "#sr-";
  /* cues: audio/a6-s2.words.json; the host starts on "Since" @5.92, so host-local time = word start - 5.92 */
  const CUES = {
    since: 0.00,    /* Since @5.92: ground + shell draw on; label and source line are on from frame 0 */
    school: 1.72,   /* School @7.64 */
    built: 2.48,    /* built @8.40: safe room rises */
    safe: 3.24,     /* safe @9.16: SAFE ROOM label */
    rooms: 3.56,    /* rooms, @9.48: people fade up */
    winds: 4.74,    /* winds @10.66: arrows in, dashes travel to the end */
    live: 8.76,     /* live @14.68: house draws */
    nowhere: 9.58,  /* nowhere @15.50: path draws to the door */
    you: 10.70,     /* you @16.62: chip */
    fade: 11.78,    /* fade-through 0.4 s into g-a6-usmap at a6-s3 0.00 */
    end: 12.18
  };
  const tl = gsap.timeline({ paused: true });

  /* Since @5.92: ground and shell draw on (0.8 s) */
  [document.querySelector(P + "gnd"), document.querySelector(P + "shell"), document.querySelector(P + "house")].forEach(function (p) {
    const L = Math.ceil(p.getTotalLength()) + 1;
    tl.set(p, { autoAlpha: 1, strokeDasharray: L, strokeDashoffset: L }, 0);
  });
  tl.to([P + "gnd", P + "shell"], { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, CUES.since);

  /* School @7.64 */
  tl.set(P + "lb-school", { autoAlpha: 0, y: 10 }, 0);
  tl.to(P + "lb-school", { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.5);   /* with the shell, not on "School": the shell held empty for 1.7 s in draft-v1 */

  /* built @8.40: the room rises from the ground line */
  tl.set(P + "room", { autoAlpha: 0, scaleY: 0, svgOrigin: "900 820" }, 0);
  tl.to(P + "room", { autoAlpha: 1, scaleY: 1, duration: 0.5, ease: "power3.out" }, CUES.built);

  /* safe @9.16 */
  tl.set(P + "lb-room", { autoAlpha: 0, y: 10 }, 0);
  tl.to(P + "lb-room", { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.safe);

  /* rooms, @9.48: six people, stagger 0.08 */
  tl.set(".sr-p", { autoAlpha: 0, y: 14 }, 0);
  tl.to(".sr-p", { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.08 }, CUES.rooms);

  /* winds @10.66: four arrows in, dashes then travel right to left until the cut (the comp's continuous motion) */
  tl.set(".sr-aw", { autoAlpha: 0, y: 14 }, 0);
  tl.to(".sr-aw", { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, CUES.winds);
  gsap.utils.toArray(".sr-wl").forEach(function (l, i) {
    const ph = -i * 14;
    tl.set(l, { strokeDashoffset: ph }, 0);
    tl.to(l, { strokeDashoffset: ph - 58 * 17, duration: CUES.end - CUES.winds, ease: "none" }, CUES.winds);
  });

  /* camera push 2.5 % about the room's base from winds to the cut: the thin dashes alone read as a freeze (freeze_scan 18 Oct);
     at 1.025 the arrow tails reach x 1576, clear of the presenter corner (x >= 1600) */
  tl.to(P + "cam", { scale: 1.01, svgOrigin: "900 820", duration: CUES.winds, ease: "none" }, 0);   /* slow push from frame 0, so the opening never sits still */
  tl.to(P + "cam", { scale: 1.025, svgOrigin: "900 820", duration: CUES.end - CUES.winds, ease: "sine.inOut" }, CUES.winds);

  /* live @14.68: house draws */
  tl.to(P + "house", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, CUES.live);

  /* nowhere @15.50: dashed path is uncovered left to right, reaching the door as "go," ends */
  tl.set(P + "pclip-r", { attr: { width: 0 } }, 0);
  tl.to(P + "npath", { autoAlpha: 1, duration: 0.05, ease: "none" }, CUES.nowhere);
  tl.to(P + "pclip-r", { attr: { width: 460 }, duration: 1.0, ease: "power2.inOut" }, CUES.nowhere);

  /* you @16.62: chip */
  tl.set(P + "chip", { autoAlpha: 0, y: 24 }, 0);
  tl.to(P + "chip", { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUES.you);

  tl.to(P + "root", { autoAlpha: 0, duration: CUES.end - CUES.fade, ease: "power1.inOut" }, CUES.fade);
