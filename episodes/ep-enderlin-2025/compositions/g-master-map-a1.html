  const DUR = 55.197;
  const EXIT = 54.587; /* spec exit 365.7 */

  tl.set([P + "eb1", P + "hl1", P + "r1", P + "s1", P + "eb2", P + "hl2", P + "r2", P + "s2"], { autoAlpha: 0 }, 0);

  /* ambient, whole window */
  tl.fromTo(P + "scan", { y: 40 }, { y: 1040, duration: 10, ease: "none", repeat: 5, yoyo: true }, 0);
  tl.fromTo(P + "drift", { x: 0, y: 0 }, { x: -16, y: 10, duration: DUR, ease: "none" }, 0);

  tl.fromTo(P + "belts", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, CUES.shelter);
  tl.fromTo(P + "t-belt", { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUES.shelter + 0.1);

  tl.fromTo(P + "q", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.18, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 5 }, CUES.fastened);

  tl.fromTo(P + "eb1", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, CUES.june);

  tl.fromTo(P + "s1", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, CUES.ceiling);
