  tl.set([P + "storm", P + "funnel", P + "zone", P + "t-not", P + "notarrow", P + "gap", P + "t-beam", P + "hl", P + "debris", P + "flat"], { autoAlpha: 0 }, 0);

  tl.fromTo(P + "storm", { x: 30 }, { x: -20, duration: DUR, ease: "none" }, 0);
  tl.fromTo(P + "funnelsw", { skewX: -3, svgOrigin: "1640 640" }, { skewX: 3, duration: 1.4, ease: "sine.inOut", repeat: 10, yoyo: true }, 0);

  tl.fromTo(P + "t-beam", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.higher);

  /* the earth curves away: a flat reference line, then the gap under the beam */

  tl.fromTo(P + "earth", { attr: { "stroke-width": 3 } }, { attr: { "stroke-width": 6 }, duration: 0.5, ease: "power2.out", yoyo: true, repeat: 1 }, CUES.earth + 0.16);

  tl.fromTo(P + "funnel", { autoAlpha: 0, scaleY: 0, svgOrigin: "1640 640" }, { autoAlpha: 1, scaleY: 1, duration: 0.6, ease: "power3.out" }, CUES.radar + 0.3);
