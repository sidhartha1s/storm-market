  tl.fromTo(".dta1-tick", { autoAlpha: 0, scaleY: 0 }, { autoAlpha: 1, scaleY: 1, duration: 0.2, ease: "power3.out", stagger: 0.04 }, 0.3);

  /* Moore 2013, the last mark @367.0 */
  tl.to(P+"mark", { scaleY: 1, duration: 0.4, ease: "back.out(1.8)" }, 367.0 - H);
  tl.fromTo(P+"mlab", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 367.1 - H);
  /* the empty bar starts drawing @371.0 and is still drawing when the blackout cuts in */
