<!-- g-verdict: fixed HUD over g-tornado-verdict (0 -> 5.841). Owner-approved hook cut (demo-hook-h2, eval3-h2,

     spoken "E F five" (1.72). Then "four months" draws the arrow, and "called it E F three" thumps the struck EF3.
     Cues: h1-s1 mounts at 0, so local = word time (words.json: changed 0.94, EF5 1.68, four 3.10 [silence ends 3.03],

<template>
<style>

  .vd-bolt { position:absolute; left:0; top:0; width:1920px; height:1080px; pointer-events:none; }
  .vd-scrim { position:absolute; width:760px; height:560px; border-radius:50%;

  .vd-ef5 { font-size:200px; color:#d0121f; border-color:#d0121f; text-shadow:0 0 38px rgba(208,18,31,0.55), 0 6px 26px rgba(0,0,0,0.8); }

  <div class="vd-gap" id="vd-gap">4 Months Later</div>
  <div class="vd-group" id="vd-g5" style="left:1010px; top:360px; width:560px;">

  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const P = "#vd-";
  const bolt = document.getElementById("vd-bolt");
  const BL = Math.ceil(bolt.getTotalLength()) + 1;
  const arrow = document.getElementById("vd-arrowline");
  const AL = Math.ceil(arrow.getTotalLength()) + 1;
  bolt.style.strokeDasharray = BL; arrow.style.strokeDasharray = AL;
  tl.set([P+"flash-a", P+"flash-b", P+"bolt", P+"card", P+"title", P+"when", P+"ef3", P+"sub3", P+"strike", P+"gap",
          P+"arrowline", P+"arrowhead", P+"ef5", P+"sub5", P+"scrim3", P+"scrim5"], { autoAlpha: 0 }, 0);
  tl.set(P+"strike", { scaleX: 0, rotation: -5, transformOrigin: "left center" }, 0);
  tl.set(P+"arrowline", { strokeDashoffset: AL }, 0);
  tl.set(P+"bolt", { strokeDashoffset: BL }, 0);
  tl.set(P+"g3", { x: 0, y: 0, scale: 1 }, 0);
  tl.set(P+"g5", { x: 0, y: 0 }, 0);
  tl.set(P+"card", { x: 0 }, 0);

  /* ambient: sky glow drifts across the whole window so nothing is ever still */
  tl.fromTo(P+"glowdrift", { x: 0, y: 0 }, { x: 900, y: 60, duration: 5.841, ease: "none" }, 0);

  /* cold open: a flash is the first frame, the wedge is named at once */
  tl.fromTo(P+"flash-a", { autoAlpha: 0.9 }, { autoAlpha: 0, duration: 0.35, ease: "power2.out" }, 0);
  tl.to(P+"flash-a", { autoAlpha: 0.55, duration: 0.04 }, 0.42);
  tl.to(P+"flash-a", { autoAlpha: 0, duration: 0.3 }, 0.46);
  tl.fromTo(P+"card", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
  tl.fromTo(P+"title", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.05);
  tl.fromTo(P+"when", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.25);

  /* THE WEATHER SERVICE @0.29 (voice onset): the old rating is already on the board */
  tl.to(P+"scrim3", { autoAlpha: 1, duration: 0.4 }, 0.35);
  tl.fromTo(P+"ef3", { autoAlpha: 0, scale: 1.12, rotation: 0 }, { autoAlpha: 1, scale: 1, rotation: -3, duration: 0.35, ease: "power3.out" }, 0.45);

  /* CHANGED @0.94: the strike goes through EF3 */
  tl.to(P+"strike", { autoAlpha: 1, scaleX: 1, duration: 0.28, ease: "power3.out" }, 0.97);
  tl.to(P+"ef3", { opacity: 0.6, duration: 0.4 }, 1.15);

  /* E F FIVE @1.68 (whisper; envelope ~1.72): the verdict slams, bolt + flash ride the stamp hit */
  tl.to(P+"scrim5", { autoAlpha: 1, duration: 0.3 }, 1.42);
  tl.fromTo(P+"ef5", { autoAlpha: 0, scale: 1.45, rotation: -10 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.2, ease: "power4.in" }, 1.52);
  tl.to(P+"bolt", { autoAlpha: 1, strokeDashoffset: 0, duration: 0.08, ease: "none" }, 1.64);
  tl.fromTo(P+"flash-b", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.05 }, 1.70);
  tl.to(P+"flash-b", { autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 1.76);
  tl.fromTo(P+"g5", { y: 0 }, { y: 9, duration: 0.07, ease: "power1.out", yoyo: true, repeat: 1 }, 1.72);
  tl.to(P+"bolt", { autoAlpha: 0, duration: 0.4 }, 1.92);
  /* FIVE @2.20: the red stamp breathes */
  tl.fromTo(P+"ef5", { scale: 1 }, { scale: 1.05, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.20);
  /* the breath after "five" (silence 2.65 - 3.03): what EF5 means */
  tl.fromTo(P+"sub5", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.62);

  /* FOUR @3.06 MONTHS @3.28: the arrow draws from the old rating to the new */
  tl.to(P+"arrowline", { autoAlpha: 1, strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 3.06);
  tl.fromTo(P+"arrowhead", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.2, ease: "power2.out" }, 3.50);
  tl.fromTo(P+"gap", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.28);
  tl.fromTo(P+"g5", { scale: 1 }, { scale: 1.03, duration: 1.6, ease: "sine.inOut" }, 3.60);

  /* CALLED IT @4.04, E F THREE @4.42: the struck stamp thumps once more */
  tl.to(P+"ef3", { opacity: 1, duration: 0.3 }, 4.10);
  tl.fromTo(P+"g3", { scale: 1 }, { scale: 1.08, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 4.46);
  tl.fromTo(P+"sub3", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.62);

  /* exit: the verdict lifts on the cut to the night scene (voice ends 5.53, host ends 5.841) */
  tl.to([P+"g3", P+"g5", P+"gap", P+"arrowline", P+"arrowhead"], { y: -40, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 5.30);
  tl.to(P+"card", { x: -700, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 5.30);
  tl.to([P+"scrim3", P+"scrim5"], { autoAlpha: 0, duration: 0.5 }, 5.30);
  window.__timelines["g-verdict"] = tl;
})();
</script>
</template>
