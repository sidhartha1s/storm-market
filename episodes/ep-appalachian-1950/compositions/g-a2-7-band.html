  got more than 28 in; Youngstown's 30.6 in made November 1950 its snowiest November. A snow-amount band inside
  PA/OH/WV only: no track, no low, nothing toward the coast (L1 open).

    Lake Erie's south shore and Lake Michigan's east/south shores reuse those same vertices; Lake Erie's Ontario shore,
    the Atlantic coast, Delaware Bay and Chesapeake Bay are coarse hand-projected lon/lat points (formula below).
    MD, DE, VA have no lines of their own (their WV, PA, KY edges come from those states). Swap in the master
    BASEMAP block if a frame read finds the coarse coast wrong.

<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#b7-";
  const $ = function (n) { return document.getElementById("b7-" + n); };
  const proj = function (lon, lat) { return [3841 * (lon + 97.576), -5585 * (lat - 46.6213)]; };
  const PIT = proj(-79.9959, 40.4406), ERIE = proj(-80.0851, 42.1292), YNG = proj(-80.6495, 41.0998);
  const DUR = 19.32;                                                          /* 18.92 + 0.40 */

  /* camera: A2-P (s 0.08, PIT at 900,520) -> A2-B (s 0.032, PIT at 900,440), 0.84 to 2.84, expo.inOut */
  const MOVE0 = 0.84, MOVE1 = 2.84;
  const expo = gsap.parseEase("expo.inOut");
  function logLerpScale(fromScale, toScale, t) {                              /* helpers.js logZoom */
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  const camEl = $("cam");
  const pins = [[$("pit-at"), PIT], [$("erie-at"), ERIE], [$("yng-at"), YNG]];
  function camAt(t) {
    const u = t <= MOVE0 ? 0 : (t >= MOVE1 ? 1 : expo((t - MOVE0) / (MOVE1 - MOVE0)));
    const s = logLerpScale(0.08, 0.032, u), px = 900, py = 520 + (440 - 520) * u;
    const tx = PIT[0] - px / s, ty = PIT[1] - py / s;                          /* frame top-left, map units */
    camEl.setAttribute("transform", "translate(" + (-tx * s).toFixed(2) + "," + (-ty * s).toFixed(2) + ") scale(" + s.toFixed(6) + ")");
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i][1];
      pins[i][0].setAttribute("transform", "translate(" + ((p[0] - tx) * s).toFixed(2) + "," + ((p[1] - ty) * s).toFixed(2) + ")");
    }
  }
  camAt(0);

  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* transforms start in set() at 0 (file contract) */
  tl.set([P + "plate", P + "cap", P + "chip30", P + "card", P + "st28", P + "st306", P + "src", P + "credit"], { x: 0, y: 0 }, 0);
  tl.set([P + "pitlab0", P + "pitlab", P + "erielab", P + "ynglab"], { x: 0, y: 0 }, 0);
  tl.set([P + "pit", P + "erie", P + "yng"], { scale: 1, svgOrigin: "0 0", smoothOrigin: false }, 0);

  /* snow: every flake falls 70-119 px/s for the whole comp, finite repeats */
  Array.prototype.slice.call($("flakes").querySelectorAll("circle")).forEach(function (c, i) {
    const v = 70 + (i * 13) % 50, cy0 = +c.getAttribute("cy");
    const first = (1100 - cy0) / v, loop = 1120 / v;
    const rep = Math.max(0, Math.ceil((DUR - first) / loop) - 1);
    tl.fromTo(c, { attr: { cy: cy0 } }, { attr: { cy: 1100 }, duration: first, ease: "none" }, 0);
    tl.fromTo(c, { attr: { cy: -20 } }, { attr: { cy: 1100 }, duration: loop, ease: "none", repeat: rep, immediateRender: false }, first);
  });

  /* PITTSBURGH @0.00: frame A2-P, pin + label on, flakes falling */
  /* DEEPEST @0.84: label out before the camera moves; pull-back A2-P -> A2-B (camAt), 2.0 s, arrives 2.84; pin 16 -> 14 px */
  tl.to(P + "pitlab0", { autoAlpha: 0, x: -12, duration: 0.3, ease: "power2.in" }, 0.84);
  tl.fromTo(P + "pit", { scale: 1, svgOrigin: "0 0", smoothOrigin: false },
    { scale: 0.875, svgOrigin: "0 0", smoothOrigin: false, duration: 2.0, ease: "expo.inOut" }, 0.84);

  /* OVER @2.86: NCEI plate + caption slide in */
  tl.fromTo([P + "plate", P + "cap"], { autoAlpha: 0, x: 660 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, 2.86);
  /* 30 @3.02: 30+ IN chip in, leader draws */
  tl.fromTo(P + "chip30", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.02);
  tl.fromTo(P + "leader", { autoAlpha: 0, strokeDashoffset: 133 }, { autoAlpha: 1, strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 3.12);
  /* camera settled: PITTSBURGH label returns at its A2-B spot */
  tl.fromTo(P + "pitlab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 3.60);

  /* BAND @4.28: reveal starts at the north tip, down to about lat 41.0 */
  tl.to(P + "reveal-r", { attr: { height: 5595 }, duration: 1.1, ease: "power2.out" }, 4.28);
  /* ERIE @5.44: Erie pin pops, label in */
  tl.fromTo(P + "erie", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false },
    { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.45, ease: "back.out(2)" }, 5.44);
  tl.fromTo(P + "erielab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 5.54);

  /* SOUTH @8.02: reveal sweeps south, reaching the south tip at VIRGINIA @9.40 */
  tl.to(P + "reveal-r", { attr: { height: 19000 }, duration: 1.38, ease: "power2.inOut" }, 8.02);

  /* ERIE @10.54: Erie pulse */
  tl.fromTo(P + "erie-pulse", { opacity: 0.9, attr: { r: 7 } }, { opacity: 0, attr: { r: 30 }, duration: 1.0, ease: "power2.out", immediateRender: false }, 10.54);
  /* YOUNGSTOWN @10.90: pin + label in */
  tl.fromTo(P + "yng", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false },
    { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.45, ease: "back.out(2)" }, 10.90);
  tl.fromTo(P + "ynglab", { autoAlpha: 0, x: 12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 11.00);

  /* 28 @12.82: one card for both cities */
  tl.fromTo(P + "card", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 12.82);
  /* YOUNGSTOWN @13.76: Youngstown pulse */
  tl.fromTo(P + "yng-pulse", { opacity: 0.9, attr: { r: 7 } }, { opacity: 0, attr: { r: 30 }, duration: 1.0, ease: "power2.out", immediateRender: false }, 13.76);
  /* 30.6 @15.40: same card swaps to Youngstown's November total */
  tl.to(P + "st28", { autoAlpha: 0, y: -20, duration: 0.35, ease: "power3.in" }, 15.40);
  tl.fromTo(P + "st306", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 15.50);

  /* 15.40 to 17.90: one shimmer pass north to south along the band */
  tl.fromTo(P + "shim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "none" }, 15.40);
  tl.fromTo(P + "shim-r", { attr: { y: 24500 } }, { attr: { y: 44800 }, duration: 2.5, ease: "power1.inOut" }, 15.40);
  tl.to(P + "shim", { autoAlpha: 0, duration: 0.2, ease: "none" }, 17.70);

  /* EXIT @18.40: everything but the band and the three dots leaves; last frame = bare A2-B for g-a2-8 */
  tl.to([P + "plate", P + "cap", P + "chip30", P + "pitlab", P + "erielab"], { x: 980, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 18.40);
  tl.to([P + "card", P + "ynglab", P + "src", P + "credit"], { x: -60, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 18.40);
  tl.to([P + "leader", P + "flakes"], { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 18.40);

  window.__timelines["g-a2-7-band"] = tl;
})();
