<script>
window.__timelines = window.__timelines || {};
(function () {
  var P = "#a3t-";
  var track = document.getElementById("a3t-track");
  var gmask = document.getElementById("a3t-gmaskpath");
  var head = document.getElementById("a3t-head");
  var tLen = track.getTotalLength(), TL = Math.ceil(tLen) + 1;
  var GL = Math.ceil(gmask.getTotalLength()) + 1;
  var tl = gsap.timeline({ paused: true });

  // head point and tangent angle at a length along the red track; angles unwrapped so rotation never spins
  var lastR = null;
  function headAt(len) {
    var p = track.getPointAtLength(len);
    var a = track.getPointAtLength(Math.max(0, len - 1)), b = track.getPointAtLength(Math.min(tLen, len + 1));
    var r = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    if (lastR !== null) { while (r - lastR > 180) r -= 360; while (r - lastR < -180) r += 360; }
    lastR = r;
    return { x: p.x, y: p.y, r: r };
  }
  // the arrowhead follows the dash head in n linear legs sampled on the same ease as the draw
  function ride(p0, p1, start, dur, ease, n) {
    var e = gsap.parseEase(ease);
    for (var k = 1; k <= n; k++) {
      var h = headAt(tLen * (p0 + (p1 - p0) * e(k / n)));
      tl.to(head, { x: h.x, y: h.y, rotation: h.r, duration: dur / n, ease: "none" }, start + dur * (k - 1) / n);
    }
  }

  /* THE @0.00: chart dimmed, scan line running, source line on */
  var h0 = headAt(0);
  tl.set(track, { strokeDasharray: TL + " " + TL, strokeDashoffset: TL }, 0);
  tl.set(gmask, { strokeDasharray: GL + " " + GL, strokeDashoffset: GL }, 0);
  tl.set(head, { x: h0.x, y: h0.y, rotation: h0.r, transformOrigin: "100% 50%" }, 0);
  tl.set(P + "pin", { svgOrigin: "1238 660", scale: 0.4 }, 0);
  tl.set(P + "ghostheadg", { svgOrigin: "1768 160", scale: 0.5 }, 0);
  tl.to(P + "scan", { y: 1080, duration: 18, ease: "none" }, 0); // 60 px/s, one finite pass covers the 16.14 s host

  /* LOW @0.16 */
  tl.fromTo(P + "headline", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 0.16);

  /* NORTHWEST @0.66: red stub tease 0 -> 12 % */
  tl.set([track, head], { autoAlpha: 1 }, 0.66);
  tl.to(track, { strokeDashoffset: TL - 0.12 * tLen, duration: 0.4, ease: "power2.out" }, 0.66);
  ride(0, 0.12, 0.66, 0.4, "power2.out", 8);

  /* CENTER @3.50: Carolinas pin in */
  tl.fromTo(P + "pin", { svgOrigin: "1238 660", scale: 0.4, autoAlpha: 0 }, { svgOrigin: "1238 660", scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.6)" }, 3.5);
  tl.fromTo(P + "pulse", { attr: { r: 17 }, opacity: 0.8 }, { attr: { r: 34 }, opacity: 0, duration: 1.4, ease: "power2.out", repeat: 7 }, 3.9); // pulse every 1.4 s, ends 15.10

  /* CAROLINAS @6.32: pin chip in */
  tl.fromTo(P + "pinchip", { x: -16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 6.32);

  /* RIDES @8.38: ghost draws up the coast, reaching the sea end on "out" @10.42 */
  tl.set(P + "ghost", { autoAlpha: 0.55 }, 8.38);
  tl.to(gmask, { strokeDashoffset: 0, duration: 2.04, ease: "power1.inOut" }, 8.38);

  /* OUT @10.42: ghost arrowhead + THE USUAL PATH chip in, headline dims */
  tl.fromTo(P + "ghostheadg", { svgOrigin: "1768 160", scale: 0.5 }, { svgOrigin: "1768 160", scale: 1, duration: 0.35, ease: "back.out(2)" }, 10.42);
  tl.fromTo(P + "ghosthead", { autoAlpha: 0 }, { autoAlpha: 0.55, duration: 0.25 }, 10.42);
  tl.fromTo(P + "usualchip", { x: 16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 10.42);
  tl.to(P + "headline", { autoAlpha: 0.35, duration: 0.4 }, 10.42);

  /* TURNED @11.88: ghost dims (kept for g-a3-4), red track draws 12 % -> 100 %, landing on "Ohio." @15.38 */
  tl.to([P + "ghost", P + "ghosthead", P + "usualchip"], { autoAlpha: 0.3, duration: 0.4 }, 11.88);
  tl.to(track, { strokeDashoffset: 0, duration: 3.5, ease: "power2.inOut" }, 11.88);
  ride(0.12, 1, 11.88, 3.5, "power2.inOut", 48);

  /* OHIO @15.38: label in, flash at the track end, headline back to 1 */
  tl.fromTo(P + "ohio", { x: 16, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 15.38);
  tl.fromTo(P + "endflash", { attr: { r: 17 }, autoAlpha: 1 }, { attr: { r: 35 }, autoAlpha: 0, duration: 0.5, ease: "power2.out" }, 15.38);
  tl.to(P + "headline", { autoAlpha: 1, duration: 0.25 }, 15.38);

  /* EXIT @15.64 (host end - 0.5): headline and pin chip slide out; g-a3-2 opens on chart + track + ghost + OHIO */
  tl.to([P + "headline", P + "pinchip"], { x: -60, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 15.64);

  // self-check: the arrowhead sits on the dash head at three times (mid stub, mid draw, end)
  [0.86, 13.6, 15.38].forEach(function (t) {
    tl.seek(t);
    var drawn = TL - parseFloat(gsap.getProperty(track, "strokeDashoffset"));
    var p = track.getPointAtLength(Math.min(tLen, drawn));
    var dx = gsap.getProperty(head, "x") - p.x, dy = gsap.getProperty(head, "y") - p.y;
    if (Math.sqrt(dx * dx + dy * dy) > 4) console.error("g-a3-1-track: arrowhead off the track head at " + t + " s by " + Math.sqrt(dx * dx + dy * dy).toFixed(1) + " px");
  });

  window.__timelines["g-a3-1-track"] = tl;
