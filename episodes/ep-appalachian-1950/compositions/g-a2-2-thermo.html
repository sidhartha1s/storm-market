<script>

(function () {

  tl.fromTo("#t2-lq", { scaleY: 0, ...LQ }, { scaleY: 0.78, ...LQ, duration: 0.8, ease: "power3.out", immediateRender: false }, 5.26);

  /* MIDNIGHT @7.12: hour hand 8 -> 12, label swap (old out fully before new in) */

  tl.fromTo("#t2-l2", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 7.32);

  /* 20 @7.70: liquid drains to 20F, amber to blue, value swap */

  tl.to("#t2-l2", { autoAlpha: 0, y: -20, duration: 0.2, ease: "power2.in" }, 8.56);
  tl.fromTo("#t2-l3", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.76);

  tl.fromTo(["#t2-fg1", "#t2-fg2", "#t2-fg3"], { y: 6 }, { y: -6, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 2, stagger: 0.1 }, 10.44);

  /* exit: last 0.6 s, the card slides off left */
  tl.to("#t2-card", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 11.94);

  window.__timelines["g-a2-2-thermo"] = tl;
})();
</script>
