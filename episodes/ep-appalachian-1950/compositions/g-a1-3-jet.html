  (general mechanism, no place tied to it). Across New England the wind brought down trees and knocked out power.

<script>
window.__timelines = window.__timelines || {};
(function() {
  const P = "#jt3-";
  const $ = (id) => document.getElementById("jt3-" + id);

  /* ---- wisps: dash length = ceil(len) + 1, measured, never typed ---- */
  const wisps = [1, 2, 3, 4].map((n) => {
    const path = $("w" + n);
    const L = Math.ceil(path.getTotalLength()) + 1;
    return { path: path, L: L, a: $("a" + n + "a"), b: $("a" + n + "b"), pr: { p: 0 } };
  });
  function placeArrow(el, path, len) {
    const l = Math.max(2, len);
    const q = path.getPointAtLength(l), r = path.getPointAtLength(l - 2);
    const ang = Math.atan2(q.y - r.y, q.x - r.x) * 180 / Math.PI;
    el.setAttribute("transform", "translate(" + q.x.toFixed(1) + " " + q.y.toFixed(1) + ") rotate(" + ang.toFixed(1) + ")");
  }
  /* arrowheads ride the drawn dash: one near its head (92 %), one at its middle (50 %); a pure function of the proxy */
  function rideArrows(w) { const d = w.pr.p * (w.L - 1); placeArrow(w.a, w.path, d * 0.92); placeArrow(w.b, w.path, d * 0.5); }
  wisps.forEach(rideArrows);

  const tl = gsap.timeline({ paused: true });

  /* ---- time 0: hidden states (also hidden in CSS) and transform starts ---- */
  tl.set([P+"band", P+"s2", P+"bracket", P+"chip", P+"warm", P+"map", P+"region", P+"legend", P+"src2", P+"credit",
          ".jt3-tree", ".jt3-bolt", ".jt3-wisp", ".jt3-arrow"], { autoAlpha: 0 }, 0);
  tl.set(P+"band", { scaleX: 0, transformOrigin: "0% 50%" }, 0);
  tl.set(P+"bracket", { scaleY: 0, transformOrigin: "50% 100%" }, 0);
  tl.set(P+"chip", { x: -60 }, 0);
  tl.set(P+"map", { scale: 1.08, transformOrigin: "50% 50%" }, 0);
  tl.set([".jt3-tree", ".jt3-bolt"], { scale: 0, transformOrigin: "50% 50%" }, 0);
  wisps.forEach((w) => tl.set(w.path, { strokeDasharray: w.L, strokeDashoffset: w.L }, 0));
  /* THAT @0.00: sky, ridge, rooftops, ground, tag and source line are on from frame 0 (no tween needed) */

  /* STREAM @1.14: band wipes in left to right; streak set 1 at 420 px/s (1920 px per 4.571 s, 2 cycles, ends 10.28) */
  tl.set(P+"band", { autoAlpha: 1 }, 1.14);
  tl.fromTo(P+"band", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.out" }, 1.14);
  tl.fromTo(P+"s1", { x: 0 }, { x: 1920, duration: 1920 / 420, ease: "none", repeat: 1 }, 1.14);

  /* FAST @1.88: second, faster streak set fades in over the first; 560 px/s (3.429 s per cycle, 3 cycles, ends 12.17) */
  tl.fromTo(P+"s2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, 1.88);
  tl.fromTo(P+"s2", { x: 0 }, { x: 1920, duration: 1920 / 560, ease: "none", repeat: 2 }, 1.88);

  /* MILE @3.46: bracket draws up from the ground; chip in */
  tl.set(P+"bracket", { autoAlpha: 1 }, 3.46);
  tl.fromTo(P+"bracket", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power2.out" }, 3.46);
  tl.fromTo(P+"chip", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 3.46);

  /* WARM @5.66: warm layer fades up, then a slow shimmer (y 0 -> -6 yoyo, 4 legs, ends 10.46) */
  tl.fromTo(P+"warm", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8, ease: "power1.out" }, 5.66);
  tl.fromTo(P+"warm", { y: 0 }, { y: -6, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.66);

  /* MIX @7.76: four wisps draw down, staggered 0.2 s, 0.8 s each; arrowheads ride each dash */
  wisps.forEach((w, i) => {
    const t = 7.76 + 0.2 * i;
    tl.set(w.path, { autoAlpha: 1 }, t);
    tl.fromTo(w.path, { strokeDashoffset: w.L }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, t);
    tl.fromTo(w.pr, { p: 0 }, { p: 1, duration: 0.8, ease: "power2.inOut", onUpdate: () => rideArrows(w) }, t);
    tl.set([w.a, w.b], { autoAlpha: 1 }, t + 0.12);
  });

  /* ACROSS @8.72: chip exits; HUD fades; camera pulls up and through: cutaway down and out, map lands under it */
  tl.to(P+"chip", { x: -60, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 8.72);
  tl.to([P+"tag", P+"src1"], { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, 8.72);
  tl.to(P+"cut", { y: 400, autoAlpha: 0, duration: 0.8, ease: "power2.in" }, 8.72);
  tl.fromTo(P+"map", { autoAlpha: 0, scale: 1.08 }, { autoAlpha: 1, scale: 1, duration: 0.9, ease: "power2.out" }, 8.72);
  /* slow map drift so the hold never idles (about 6.4 px/s, ends on the last frame 12.84) */
  tl.fromTo(P+"mapmove", { x: 0, y: 0 }, { x: -20, y: -6, duration: 12.84 - 9.62, ease: "none" }, 9.62);

  /* ENGLAND @9.34: region label, legend card and map source lines in */
  tl.fromTo(P+"region", { y: 16, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 9.34);
  tl.fromTo(P+"legend", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.6, ease: "power3.out" }, 9.34);
  tl.fromTo([P+"src2", P+"credit"], { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 9.34);

  /* TREES @10.88: 9 tree markers pop */
  tl.fromTo(".jt3-tree", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 10.88);

  /* KNOCKED @11.52: 9 outage markers pop, then blink 1 -> .4 -> 1 (one 0.8 s cycle, ends on the last frame 12.84) */
  tl.fromTo(".jt3-bolt", { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 11.52);
  tl.fromTo(".jt3-boltg", { opacity: 1 }, { opacity: 0.4, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 12.04);

  window.__timelines["g-a1-3-jet"] = tl;
})();
