<script>

(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#nl7-";

  tl.fromTo(P+"win", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.38);

  /* 1938 @10.86 / CAROL @12.36 / SANDY @12.82 */
