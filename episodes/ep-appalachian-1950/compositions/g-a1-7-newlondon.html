<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#nl7-";
  const HIDE = ["title","sub","ref","val","gw1","gw2","gw3","l1","l2","l3","l4","win","src1","baseline","src2","bm","chip","pin"].map(function(k){ return P + k; });

  tl.set(P+"baseline", { transformOrigin: "0% 50%", scaleX: 0 }, 0);
  tl.set(P+"map", { autoAlpha: 0 }, 0);

  /* ON @0.00: baseline draws, whole card drifts */
  tl.to(P+"baseline", { autoAlpha: 1, scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.0);
  tl.fromTo(P+"src1", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);
  tl.to(P+"drift", { y: -10, duration: 13.84, ease: "none" }, 0.0);

  /* NEWLONDON @1.02 */
  tl.fromTo(P+"title", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.02);

  /* 7 @2.62: the 1950 bar rises, value counts to 7.58 landing 3.72, NOV 1950 label in */
  tl.to(P+"b4", { scaleY: 1, duration: 0.8, ease: "power4.out" }, 2.62);
  tl.fromTo(P+"val", { autoAlpha: 0, y: 530 }, { autoAlpha: 1, y: 0, duration: 0.8, ease: "power4.out" }, 2.62);
  const cnt = { v: 0 };
  tl.to(cnt, { v: 7.58, duration: 1.1, ease: "power3.out", onUpdate: function() {
    const el = document.getElementById("nl7-val"); if (el) el.textContent = cnt.v.toFixed(2) + " FT";
  } }, 2.62);
  tl.fromTo(P+"l4", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.62);

  /* HUNDRED @4.78: sub line in, reference line draws */
  tl.fromTo(P+"sub", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.78);
  tl.to(P+"ref", { autoAlpha: 1, scaleX: 1, duration: 0.9, ease: "power2.out" }, 4.78);

  /* THREE @6.66: the three hurricane bars rise together past the line */

  /* HURRICANES @9.38: glyphs in and spinning, WINTER STORM under the 1950 bar */
  tl.fromTo([P+"gw1", P+"gw2", P+"gw3"], { autoAlpha: 0, scale: 0.4 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 9.38);
  tl.set([P+"g1", P+"g2", P+"g3"], { transformOrigin: "50% 50%" }, 0);
  tl.to([P+"g1", P+"g2", P+"g3"], { rotation: 360, duration: 2, ease: "none", repeat: 1 }, 9.38);
  tl.fromTo(P+"win", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.38);

  /* 1938 @10.86 / CAROL @12.36 / SANDY @12.82 */

  tl.fromTo(P+"l2", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.36);
  tl.fromTo(P+"l3", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 12.82);

  /* NEWYORK @13.84: card slides up and out, map rises in */

  tl.fromTo(P+"map", { y: 200, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 13.84);
  tl.fromTo(P+"src2", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 14.2);
  tl.fromTo(P+"bm", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 14.2);
  /* Albany pin */
  tl.set(P+"pin", { svgOrigin: "1000 500" }, 0);
  tl.fromTo(P+"pin", { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 14.54);
  tl.fromTo(P+"ring", { attr: { r: 8 }, opacity: 0.8 }, { attr: { r: 30 }, opacity: 0, duration: 1.2, ease: "power2.out", repeat: 2 }, 15.0);

  /* hold: state fill breathes, map drifts */
  tl.to(P+"ny", { opacity: 1, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 3 }, 14.5);
  tl.to(P+"mapdrift", { x: -16, duration: 4.46, ease: "none" }, 14.5);

  /* 20 @16.26: chip in (from 15.84 so it is settled well before the exit), $0 to $20 */
  tl.fromTo(P+"chip", { autoAlpha: 0, scale: 0.9 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 15.84);

  /* exit: chip slides out, map fades; chip has been settled since about 16.86 (1.5 s) */
  tl.to(P+"chip", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 18.36);
  tl.to(P+"map", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 18.36);

  window.__timelines["g-a1-7-newlondon"] = tl;
