<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#x14-";
  const $ = function (n) { return document.getElementById("x14-" + n); };
  const proj = function (lon, lat) { return [3841 * (lon + 97.576), -5585 * (lat - 46.6213)]; };
  const NWK = proj(-74.1724, 40.7357), PIT = proj(-79.9959, 40.4406), BUF = proj(-78.8784, 42.8864);
  const DUR = 11.46;                                                          /* 11.06 "together." end + 0.40 */

  /* NCEI 18 in+ footprint (lon, lat), clockwise from the Lake Erie shore east of Erie */
  const FP = [
    [-79.70, 42.24], [-79.25, 42.00], [-78.99, 41.37], [-78.78, 40.69], [-78.73, 40.21], [-78.94, 39.79],
    [-78.60, 39.06], [-79.05, 38.29], [-79.65, 37.87], [-80.36, 37.52], [-81.15, 37.42], [-81.57, 37.81],
    [-82.02, 38.25], [-82.41, 38.63], [-82.68, 39.02], [-83.15, 39.29], [-83.47, 39.63], [-83.07, 40.02],
    [-82.55, 40.31], [-82.28, 40.79], [-81.76, 41.21], [-81.15, 41.60], [-80.57, 41.94], [-80.15, 42.05]
  ];
  /* coast band centreline (lon, lat), 8 px seaward: Cape May -> NJ shore -> NY harbour -> CT/RI shore -> Boston */
  const COAST = [
    [-74.86, 38.90], [-74.73, 39.00], [-74.50, 39.27], [-74.35, 39.35], [-74.25, 39.45], [-74.16, 39.58],
    [-74.03, 39.77], [-73.99, 39.95], [-73.97, 40.08], [-73.92, 40.22], [-73.91, 40.32], [-73.93, 40.45],
    [-74.00, 40.55], [-74.04, 40.62], [-74.03, 40.68], [-73.97, 40.73], [-73.93, 40.78], [-73.80, 40.81],
    [-73.68, 40.86], [-73.54, 40.99], [-73.40, 41.04], [-73.18, 41.10], [-73.05, 41.17], [-72.90, 41.21],
    [-72.68, 41.22], [-72.35, 41.23], [-72.08, 41.26], [-71.86, 41.26], [-71.49, 41.32], [-71.30, 41.42],
    [-71.17, 41.43], [-71.05, 41.46], [-70.90, 41.52], [-70.70, 41.66], [-70.58, 41.75], [-70.52, 41.83],
    [-70.58, 41.96], [-70.63, 42.06], [-70.68, 42.20], [-70.86, 42.30], [-71.00, 42.35], [-71.04, 42.36]
  ];
  const pathD = function (pts, close) {
    return pts.map(function (p, i) { const m = proj(p[0], p[1]); return (i ? "L" : "M") + m[0].toFixed(1) + "," + m[1].toFixed(1); }).join(" ") + (close ? " Z" : "");
  };
  const fpD = pathD(FP, true), coastD = pathD(COAST, false);
  ["fp", "fp-c", "glow"].forEach(function (n) { $(n).setAttribute("d", fpD); });
  ["band", "band-m", "streak"].forEach(function (n) { $(n).setAttribute("d", coastD); });
  const BAND_LEN = Math.ceil($("band").getTotalLength()) + 1;                 /* map units */

  /* camera frames [s, top-left x, top-left y] -> centre form [s, cx, cy] */
  const fr = function (s, tx, ty) { return [s, tx + 960 / s, ty + 540 / s]; };
  const D = fr(0.04024, 59078.1, 18954.6), X = fr(0.03, 42191.8, 15852.5);
  const PUSH_PT = [42191.8 + 1100 / 0.03, 15852.5 + 450 / 0.03];              /* map point under screen (1100, 450) at A2-X */
  const expo = gsap.parseEase("expo.inOut");
  const lerp = function (a, b, u) { return a + (b - a) * u; };
  function logLerpScale(fromScale, toScale, t) {                              /* helpers.js logZoom */
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  /* centre that puts map point p at screen (px, py) at scale s */
  const anchor = function (p, px, py, s) { return [s, p[0] - (px - 960) / s, p[1] - (py - 540) / s]; };
  function state(t) {
    if (t < 0.10) return D;                                                    /* THAT: frame D held */
    if (t < 1.70) {                                                            /* D -> A2-X, 1.6 s, expo.inOut, log scale */
      const u = expo((t - 0.10) / 1.6);
      return [logLerpScale(D[0], X[0], u), lerp(D[1], X[1], u), lerp(D[2], X[2], u)];
    }
    if (t < 8.80) return X;
    return anchor(PUSH_PT, 1100, 450, X[0] * (1 + 0.04 * Math.min(1, (t - 8.80) / (DUR - 8.80))));   /* NOTHING: 4 % push, linear */
  }
  const camEl = $("cam");
  const pins = [[$("nwk-at"), $("nwkpill-at"), NWK], [$("pit-at"), $("pitpill-at"), PIT], [$("buf-at"), $("bufpill-at"), BUF]];
  function camAt(t) {
    const c = state(t), s = c[0], cx = c[1], cy = c[2];
    camEl.setAttribute("transform", "translate(" + (960 - cx * s).toFixed(2) + "," + (540 - cy * s).toFixed(2) + ") scale(" + s.toFixed(6) + ")");
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i][2], x = (960 + (p[0] - cx) * s).toFixed(2), y = (540 + (p[1] - cy) * s).toFixed(2);
      pins[i][0].setAttribute("transform", "translate(" + x + "," + y + ")");
      pins[i][1].style.transform = "translate(" + x + "px," + y + "px)";
    }
  }
  camAt(0);

  /* basemap paint order as g-intro-2: coast under-stroke (half hidden by the fills), then fills with state lines.
     shortcut: skips ids the BASEMAP TODO has not filled yet; once filled both exist. */
  ["ca", "us"].map($).filter(Boolean).forEach(function (el) {
    const coast = el.cloneNode(false);
    coast.removeAttribute("id");
    coast.setAttribute("fill", "none"); coast.setAttribute("stroke", "#4a5560"); coast.setAttribute("stroke-width", "3.2");
    camEl.insertBefore(coast, camEl.firstChild);
  });

  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* transforms and dash state start in set() at 0 (file contract) */
  tl.set([P + "nwkpill", P + "pitpill", P + "bufpill", P + "snowpill", P + "wind", P + "source"], { x: 0, y: 0 }, 0);
  tl.set([P + "nwklab0", P + "pitlab0"], { x: 0, y: 0 }, 0);
  tl.set(P + "buf", { scale: 0, svgOrigin: "0 0", smoothOrigin: false }, 0);
  tl.set([P + "band", P + "band-m"], { strokeDasharray: BAND_LEN + " " + BAND_LEN, strokeDashoffset: BAND_LEN }, 0);
  tl.set(P + "streak", { strokeDashoffset: 0 }, 0);
  tl.set([P + "snowg", P + "coastg"], { filter: "brightness(1)" }, 0);

  /* THAT @0.00: frame D, NEWARK and PITTSBURGH labels on; at 0.10 they fade (0.3 s) and the move D -> A2-X starts (camAt) */
  tl.to([P + "nwklab0", P + "pitlab0"], { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 0.10);

  /* MAP @1.38: camera settling; labels return as pills beside the A2-X pins at 1.70, source line with them */
  tl.fromTo(P + "nwkpill", { autoAlpha: 0, x: 12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.70);
  tl.fromTo(P + "pitpill", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.70);
  tl.fromTo(P + "source", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 1.70);

  /* FIVE @2.40: snow footprint sweeps in north to south (Erie first), 1.2 s */
  tl.set(P + "snowg", { autoAlpha: 1 }, 2.40);
  tl.to(P + "sweep-r", { attr: { height: 27800 }, duration: 1.2, ease: "power2.inOut" }, 2.40);
  /* VIRGINIA @3.58: SNOW label */
  tl.fromTo(P + "snowpill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.58);
  /* inner glow breathes to the end (6 cycles of 1.2 s, 3.60 to 10.80) */
  tl.fromTo(P + "glow", { opacity: 0.35 }, { opacity: 0.85, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 11 }, 3.60);

  /* HURRICANE @4.54: coast band draws Cape May -> Boston (1.4 s); streaks run NE on the drawn band only (mask) */
  tl.set([P + "band", P + "streak"], { autoAlpha: 1 }, 4.54);
  tl.to([P + "band", P + "band-m"], { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut" }, 4.54);
  /* 120 px/s = 4000 map units/s; one 3000-unit dash period per 0.75 s; 9 periods, 4.54 to 11.29 */
  tl.to(P + "streak", { strokeDashoffset: -3000, duration: 0.75, ease: "none", repeat: 8 }, 4.54);
  /* WIND @5.28 */
  tl.fromTo(P + "wind", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.28);

  /* BOTH @6.86: both fills pulse once together; nothing drawn between them */
  tl.to([P + "snowg", P + "coastg"], { filter: "brightness(1.25)", duration: 0.4, ease: "power1.inOut", yoyo: true, repeat: 1 }, 6.86);

  /* SATURDAY @7.64: Buffalo pin pops, its pill follows */
  tl.fromTo(P + "buf", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(2)" }, 7.64);
  tl.fromTo(P + "bufpill", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 7.74);

  /* NOTHING @8.80: 4 % push toward the empty land between the fills (camAt), ease none, to the end.
     WHY @10.10 .. TOGETHER @10.70: streaks and glow keep moving, nothing added. Exit: hard cut to ins-paul-4. */

  window.__timelines["g-a2-14-bothsides"] = tl;
})();
</script>
