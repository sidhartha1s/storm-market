  <svg id="j5-svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="j5-clip"><rect x="860" y="160" width="760" height="400"/></clipPath>
      <radialGradient id="j5-g1" cx="0.40" cy="0.5" r="0.55"><stop offset="0" stop-color="#f2f5f8" stop-opacity="0.9"/><stop offset="0.6" stop-color="#f2f5f8" stop-opacity="0.45"/><stop offset="1" stop-color="#f2f5f8" stop-opacity="0"/></radialGradient>
      <radialGradient id="j5-g2" cx="0.55" cy="0.45" r="0.5"><stop offset="0" stop-color="#f2f5f8" stop-opacity="0.9"/><stop offset="0.6" stop-color="#f2f5f8" stop-opacity="0.45"/><stop offset="1" stop-color="#f2f5f8" stop-opacity="0"/></radialGradient>
      <radialGradient id="j5-g3" cx="0.70" cy="0.55" r="0.5"><stop offset="0" stop-color="#f2f5f8" stop-opacity="0.9"/><stop offset="0.6" stop-color="#f2f5f8" stop-opacity="0.45"/><stop offset="1" stop-color="#f2f5f8" stop-opacity="0"/></radialGradient>
      <linearGradient id="j5-ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15202b" stop-opacity="0.9"/><stop offset="1" stop-color="#15202b" stop-opacity="0"/></linearGradient>

    <g id="j5-scene">
      <rect x="900" y="540" width="660" height="24" fill="url(#j5-ground)"/>
      <line x1="900" y1="540" x2="1560" y2="540" stroke="#5a768f" stroke-width="3" stroke-opacity="0.6"/>
      <g id="j5-posts" stroke="#f2f5f8" stroke-opacity="0.85" stroke-width="10" stroke-linecap="square" fill="none">
        <line x1="1060" y1="470" x2="1400" y2="470"/>
        <line x1="1060" y1="180" x2="1060" y2="470"/>
        <line x1="1400" y1="180" x2="1400" y2="470"/>

<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const S = "#j5-";
  const END = 14.06, EXIT = 13.46;

  /* flakes: deterministic precomputed field, left to right at 140-220 px/s, one linear tween each over the whole window */
  const NS = "http://www.w3.org/2000/svg";
  const fl = document.getElementById("j5-flakes");
  let seed = 51950;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
  const flakes = [];
  for (let i = 0; i < 90; i++) {
    const sp = 140 + rnd() * 80, D = sp * END;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", 860); c.setAttribute("cy", (160 + rnd() * 400).toFixed(1));
    c.setAttribute("r", (1.5 + rnd() * 2).toFixed(2)); c.setAttribute("fill-opacity", (0.5 + rnd() * 0.45).toFixed(2));
    fl.appendChild(c);
    flakes.push({ el: c, x0: 860 - D + rnd() * (D + 760), D: D, dy: (rnd() - 0.5) * 60 });
  }
  flakes.forEach(f => tl.fromTo(f.el, { x: f.x0 - 860, y: 0 }, { x: f.x0 - 860 + f.D, y: f.dy, duration: END, ease: "none" }, 0));

  /* trail: dash length from the real path length */
  const trail = document.getElementById("j5-trail");
  const len = Math.ceil(trail.getTotalLength()) + 1;
  trail.style.strokeDasharray = len + " " + len;
  trail.style.strokeDashoffset = len;

  tl.set(S + "pol", { rotation: -2 }, 0);
  tl.set(S + "veil", { opacity: 0.45 }, 0);

  /* snow veil drifting the whole window (finite sine repeats, each ~14 s) */
  tl.fromTo(S + "v1", { x: -40 }, { x: 40, duration: 2.8, ease: "sine.inOut", repeat: 4, yoyo: true }, 0);
  tl.fromTo(S + "v2", { x: 40 }, { x: -40, duration: 3.5, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
  tl.fromTo(S + "v3", { x: -40 }, { x: 40, duration: 4.7, ease: "sine.inOut", repeat: 2, yoyo: true }, 0);

  /* VIC @1.76 (Janowicz @1.96): portrait card in, caption lines after */
  tl.fromTo(S + "pol", { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.76);
  tl.fromTo(S + "cap1", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.06);
  tl.fromTo(S + "cap2", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 2.26);

  /* KICKED @2.90 .. snow. @4.30: ball along the arc by per-leg attr tweens, fading to 15 % */
  const pts = [[980,700],[1029.7,554.5],[1075.1,437.3],[1116.4,348.4],[1153.5,288],[1186.4,255.9],[1215.1,252.3],[1239.7,276.9],[1260,330]];
  const dur = [0.13,0.14,0.15,0.16,0.18,0.19,0.21,0.24];
  const cum = [153.7,279.4,377.4,448.3,494.3,523.2,558,614.8];
  tl.set(S + "ball", { autoAlpha: 1 }, 2.90);
  tl.set(S + "trail", { autoAlpha: 1 }, 2.90);
  tl.to(S + "ball", { opacity: 0.15, duration: 1.4, ease: "power1.out" }, 2.90);
  tl.to(S + "trail", { opacity: 0.3, duration: 1.4, ease: "power1.out" }, 2.90);
  let t = 2.90;
  for (let i = 0; i < 8; i++) {
    tl.to(S + "ball", { attr: { cx: pts[i+1][0], cy: pts[i+1][1] }, duration: dur[i], ease: "none" }, t);
    tl.to(S + "trail", { strokeDashoffset: len * (1 - cum[i] / 614.8), duration: dur[i], ease: "none" }, t);
    t += dur[i];
  }

  /* ARGUED @5.90: posts flicker in the veil */
  tl.to(S + "veil", { opacity: 0.60, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.90);
  /* SEE @8.38: veil to its max */
  tl.to(S + "veil", { opacity: 0.65, duration: 1.0, ease: "sine.inOut" }, 8.38);
  /* GAVE @10.18: chip in, veil clears so the posts read */
  tl.fromTo(S + "chip", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 10.18);
  tl.to(S + "veil", { opacity: 0.35, duration: 0.6, ease: "power2.out" }, 10.18);

  /* 11.32 to exit: portrait floats */
  tl.to(S + "pol", { y: -6, duration: 2.1, ease: "sine.inOut" }, 11.32);

  /* exit: last 0.6 s, everything leaves together */
  tl.to(S + "chip", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);
  tl.to(S + "pol", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);
  tl.to(S + "scene", { autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);
  tl.to(S + "src", { autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);

  window.__timelines["g-a2-5-janowicz"] = tl;
})();
</script>
