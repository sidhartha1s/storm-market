<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#a53-";
  const $ = function (n) { return document.getElementById("a53-" + n); };
  const DUR = 17.4;                                   /* last cue 16.72 (northwest) + land time, brief host duration */
  /* camera frames (brief §2): transform = translate(-TL * s) scale(s) */
  const CAM_N = "translate(925.73,443.58) scale(0.00645)";      /* N  s 0.00645  TL (-143524.0, -68772.7) */
  const CAM_N2 = "translate(561.40,229.81) scale(0.008385)";    /* N2 s 0.008385 TL (-66952.8, -27407.5) */
  const RIP = "1009 455", CORE = "494 250", MID = "960 540";    /* svgOrigins: ripple, mass core (frame-N px), frame centre */
  const camEl = $("cam");
  camEl.setAttribute("transform", CAM_N);                       /* frame N on the exact first frame */

  /* basemap paint order: coast under-stroke (half hidden by the fills), then fills with state lines */
  [$("ca"), $("us")].forEach(function (el) {
    const coast = el.cloneNode(false);
    coast.removeAttribute("id");
    coast.setAttribute("fill", "none"); coast.setAttribute("stroke", "#4a5560"); coast.setAttribute("stroke-width", "3.2");
    camEl.insertBefore(coast, camEl.firstChild);
  });

  const tl = gsap.timeline({ paused: true });

  /* start states at 0 (file contract): camera on N, transforms and hidden states set, every one also hidden in CSS */
  tl.set(P + "cam", { attr: { transform: CAM_N } }, 0);
  tl.set(P + "drift", { scale: 1, svgOrigin: MID }, 0);
  tl.set(P + "eyebrow", { autoAlpha: 0, x: -20 }, 0);
  tl.set(P + "ripchip", { autoAlpha: 0, x: -16 }, 0);
  tl.set(P + "arcchip", { autoAlpha: 0, y: 16 }, 0);
  tl.set(P + "ripple", { autoAlpha: 0, scale: 0.6, svgOrigin: RIP }, 0);
  tl.set(P + "swirl", { rotation: 0, svgOrigin: RIP }, 0);
  tl.set(P + "pulse", { autoAlpha: 0, attr: { r: 34 } }, 0);
  tl.set(P + "mass", { autoAlpha: 0, scale: 0.4, svgOrigin: CORE }, 0);

  /* ambient, whole comp: scan line top to bottom at 60 px/s (1044 px / 17.4 s); ripple swirl counterclockwise
     -30 deg/s (-522 deg / 17.4 s, one tween, no repeat); slow drift 1.00 -> 1.02 until the push */
  tl.fromTo(P + "scan", { y: -10 }, { y: 1034, duration: DUR, ease: "none" }, 0);
  tl.fromTo(P + "swirl", { rotation: 0, svgOrigin: RIP }, { rotation: -522, svgOrigin: RIP, duration: DUR, ease: "none" }, 0);
  tl.to(P + "drift", { scale: 1.02, svgOrigin: MID, duration: 11.4, ease: "none" }, 0);

  /* REBUILT @2.98: eyebrow in */
  tl.fromTo(P + "eyebrow", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 2.98);

  /* WEAK @5.70: ripple fades up over Minnesota */
  tl.fromTo(P + "ripple", { autoAlpha: 0, scale: 0.6, svgOrigin: RIP }, { autoAlpha: 0.65, scale: 1, svgOrigin: RIP, duration: 0.6, ease: "power2.out" }, 5.70);
  /* RIPPLE @5.92: chip in */
  tl.fromTo(P + "ripchip", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "back.out(1.4)" }, 5.92);

  /* MINNESOTA @7.32: one pulse, ring 34 -> 60 px, 0.6 -> 0 (set, then to: seek-safe in both orders) */
  tl.set(P + "pulse", { autoAlpha: 0.6, attr: { r: 34 } }, 7.32);
  tl.to(P + "pulse", { autoAlpha: 0, attr: { r: 60 }, duration: 0.8, ease: "power2.out" }, 7.32);

  /* ARCTIC @8.44: WEAK RIPPLE dims to 0.35 (one reading target); the mass grows from its core, tip on the ripple at 9.44 */
  tl.to(P + "ripchip", { opacity: 0.35, duration: 0.3, ease: "power2.out" }, 8.44);
  tl.fromTo(P + "mass", { autoAlpha: 0, scale: 0.4, svgOrigin: CORE }, { autoAlpha: 1, scale: 1, svgOrigin: CORE, duration: 1.0, ease: "power2.out" }, 8.44);

  /* SOUTHWESTERN @9.96: ARCTIC AIR in, only after WEAK RIPPLE sits at 0.35 (8.74) */
  tl.fromTo(P + "arcchip", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "back.out(1.4)" }, 9.96);

  /* THE LOW @11.46: both chips and the eyebrow out (done 11.76), before the push starts at 11.80: no text rides it */
  tl.to([P + "eyebrow", P + "ripchip", P + "arcchip"], { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 11.46);

  /* 11.80-13.30: push N -> N2 (1.3x, under 1.5x so linear power2.inOut); the drift eases back to 1.00 with it,
     so the camera lands exactly on N2. LATER @12.72 */
  tl.to(P + "cam", { attr: { transform: CAM_N2 }, duration: 1.5, ease: "power2.inOut" }, 11.80);
  tl.to(P + "drift", { scale: 1, svgOrigin: MID, duration: 1.5, ease: "power2.inOut" }, 11.80);

  /* 13.30-16.72: slow drift on N2 (+2 %), mass edge breathing 0.55 -> 0.45 (sine); the Carolinas (1150,760) stay
     empty. CAROLINAS @14.34, NORTHWEST @16.38 */
  tl.to(P + "drift", { scale: 1.02, svgOrigin: MID, duration: 3.42, ease: "none" }, 13.30);
  tl.fromTo(P + "massfill", { attr: { "fill-opacity": 0.55 } }, { attr: { "fill-opacity": 0.45 }, duration: 0.855, ease: "sine.inOut", repeat: 3, yoyo: true }, 13.30);
  /* END: hold to 17.40 (swirl and scan still moving), cut to g-a5-4 */

  window.__timelines["g-a5-3-startmap"] = tl;
