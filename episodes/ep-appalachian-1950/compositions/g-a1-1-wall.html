<body>
<!--
  g-a1-1-wall (A1-S1, standard): chapter card "THE SIDE NOBODY REMEMBERS", then a blurred viewer-comment wall. Full-frame designed card, track 2.
  Host: data-start = A1-S1 start, data-duration 17.00 (wav 16.602 + 0.40). Cue times are seconds from the A1-S1 start (audio/a1-s1.words.json).
  Wall = 39 rows (14 + 15 + 10), not 48: the brief's 3 x 16 grid minus the rows under the chip (column 1 starts at y 254, column 2 at y 202) and the corner rows (column 3 ends at y 618, so nothing at x >= 1600, y >= 680). Pitch 52 px on one grid (y = 150 + 52 i).
  Ratio kept: 2 blue / 39 = 5 %. 28 lit white, 9 left dim. Row numbers in the brief count the rows that exist in each column.
  Rows are paraphrased and blurred 5 px; no username, no avatar, no count on screen.
-->
<template>
<style>

  /* wall */

  .w1-row { position:absolute; width:500px; height:36px; opacity:0; visibility:hidden; }
  .w1-c1 { left:140px; } .w1-c2 { left:700px; } .w1-c3 { left:1260px; }
  .w1-in { position:absolute; left:0; top:0; display:flex; align-items:center; gap:14px; white-space:nowrap; filter:blur(5px); }
  .w1-dot { font-family:Arial, sans-serif; font-size:26px; line-height:36px; color:#5b6671; }
  .w1-tx { font-family:Georgia, 'Times New Roman', serif; font-size:26px; line-height:36px; color:#dfe7ee; }

  .w1-wd .w1-bar { background:#7fb2e5; }
  .w1-gl { position:absolute; left:-6px; top:0; width:440px; height:36px; border-radius:18px; background:rgba(127,178,229,0.08); box-shadow:0 0 18px rgba(127,178,229,0.6); opacity:0; visibility:hidden; }
  .w1-ol { position:absolute; left:-16px; top:-6px; width:472px; height:44px; border:2px solid #ffffff; border-radius:8px; opacity:0; visibility:hidden; }

  /* chip + source */
  #w1-chip { position:absolute; left:110px; top:70px; padding:18px 30px; border-radius:28px; box-sizing:border-box; white-space:nowrap;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); box-shadow:0 30px 90px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.10);
    font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:52px; line-height:56px; color:#f2f5f8; opacity:0; visibility:hidden; }
  #w1-src { position:absolute; left:110px; bottom:60px; white-space:nowrap; font-family:Arial, sans-serif; font-weight:700; font-size:19px; line-height:24px; letter-spacing:2px; color:#c8d3e0; opacity:0; visibility:hidden; }
</style>
<div id="w1-root" data-composition-id="g-a1-1-wall" data-width="1920" data-height="1080">

    <div class="w1-row w1-c2" id="w1-b1" style="top:202px"><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">never saw snow like it again</span></div></div>

    <div class="w1-row w1-c2" id="w1-b3" style="top:306px"><div class="w1-ol"></div><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">a newborn driven home in it</span></div></div>
    <div class="w1-row w1-c2" id="w1-b4" style="top:358px"><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">the whole street went silent</span></div></div>

    <div class="w1-row w1-c2" id="w1-b8" style="top:566px"><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">mom said we were lucky</span></div></div>

    <div class="w1-row w1-c2" id="w1-b12" style="top:774px"><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">first snow day of my life</span></div></div>

    <!-- column 3: 10 rows, x 1260, y 150 to 618; row 4 = wind; nothing below y 654 (corner clear) -->
    <div class="w1-row w1-c3" id="w1-c1" style="top:150px"><div class="w1-bar"></div><div class="w1-in"><span class="w1-dot">&#9679;</span><span class="w1-tx">snow right after the holiday</span></div></div>

  <div id="w1-chip">MOST MEMORIES: SNOW</div>

<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  /* 28 snow rows lit white; 9 stay dim (a3 a9 a12 b5 b11 b14 c2 c7 c10); 2 wind rows b9 c4 */
  const SNOW = ["a1","a2","a4","a5","a6","a7","a8","a10","a11","a13","a14","b1","b2","b3","b4","b6","b7","b8","b10","b12","b13","b15","c1","c3","c5","c6","c8","c9"].map(function(k) { return "#w1-" + k; });
  const WIND = ["#w1-b9", "#w1-c4"];
  const sub = function(list, s) { return list.map(function(id) { return id + " " + s; }); };

  /* UNDER @0.00: chapter card on (eyebrow is on from frame 0, the blackout ends on this frame) */
  tl.fromTo("#w1-title", {autoAlpha:0, y:30}, {autoAlpha:1, y:0, duration:0.6, ease:"power3.out"}, 0);
  tl.fromTo("#w1-rule", {autoAlpha:0, scaleX:0}, {autoAlpha:1, scaleX:1, duration:0.5, ease:"power3.out"}, 0.1);

  /* STORM @1.34: card exits, wall rows rise in by column (rows start 0.16 s later so the card is already fading) */
  tl.to("#w1-card", {y:-40, autoAlpha:0, duration:0.5, ease:"power3.in"}, 1.34);
  /* rows a4 a5 a6 sit under the title block (y 462-538): they wait until the card is gone (1.84) so the title never overlaps blurred text */
  tl.fromTo("#w1-wall .w1-row:not(#w1-a4):not(#w1-a5):not(#w1-a6)", {autoAlpha:0, y:24}, {autoAlpha:0.35, y:0, duration:0.5, stagger:0.02, ease:"power3.out"}, 1.5);
  tl.fromTo(["#w1-a4", "#w1-a5", "#w1-a6"], {autoAlpha:0, y:24}, {autoAlpha:0.35, y:0, duration:0.5, stagger:0.02, ease:"power3.out"}, 1.84);
  tl.fromTo("#w1-src", {autoAlpha:0, y:12}, {autoAlpha:1, y:0, duration:0.5, ease:"power3.out"}, 2.1);

  /* MEMORY @2.70: the whole wall drifts up 40 px for the rest of the host */
  tl.to("#w1-wall", {y:-40, duration:14.3, ease:"none"}, 2.7);

  /* SNOW @3.96: snow rows light white, chip in */
  tl.to(SNOW, {autoAlpha:1, duration:0.4, stagger:0.03, ease:"power2.out"}, 3.96);
  tl.to(sub(SNOW, ".w1-tx"), {color:"#f2f5f8", duration:0.4, stagger:0.03}, 3.96);
  tl.to(sub(SNOW, ".w1-bar"), {autoAlpha:1, duration:0.4, stagger:0.03}, 3.96);
  tl.fromTo("#w1-chip", {autoAlpha:0, x:-60}, {autoAlpha:1, x:0, duration:0.6, ease:"power3.out"}, 3.96);

  /* PITTSBURGH @6.68: highlight on (row a6, still blurred) */
  tl.to("#w1-a6", {scale:1.06, transformOrigin:"0% 50%", duration:0.4, ease:"power3.out"}, 6.68);
  tl.to("#w1-a6 .w1-ol", {autoAlpha:1, duration:0.3}, 6.68);

  /* BABY @8.20: Pittsburgh off, N.C. row (b3) on */
  tl.to("#w1-a6", {scale:1, duration:0.4, ease:"power2.inOut"}, 8.2);
  tl.to("#w1-a6 .w1-ol", {autoAlpha:0, duration:0.3}, 8.2);
  tl.to("#w1-b3", {scale:1.06, transformOrigin:"0% 50%", duration:0.4, ease:"power3.out"}, 8.2);
  tl.to("#w1-b3 .w1-ol", {autoAlpha:1, duration:0.3}, 8.2);

  /* SNOW @11.12: highlight off */
  tl.to("#w1-b3", {scale:1, duration:0.4, ease:"power2.inOut"}, 11.12);
  tl.to("#w1-b3 .w1-ol", {autoAlpha:0, duration:0.3}, 11.12);

  /* WIND @13.38: the two wind rows light blue with a pulse */
  tl.to(WIND, {autoAlpha:1, duration:0.3}, 13.38);
  tl.to(sub(WIND, ".w1-tx"), {color:"#7fb2e5", duration:0.3}, 13.38);
  tl.to(sub(WIND, ".w1-bar"), {autoAlpha:1, duration:0.3}, 13.38);
  tl.to(sub(WIND, ".w1-gl"), {autoAlpha:0.6, duration:0.3}, 13.38);
  tl.to(WIND, {scale:1.08, transformOrigin:"0% 50%", duration:0.25, ease:"sine.inOut", yoyo:true, repeat:1}, 13.38);

  /* COAST @14.44: every white row dims, blue rows stay lit */
  tl.to(SNOW, {autoAlpha:0.25, duration:0.4, ease:"power2.out"}, 14.44);

  /* WIND @15.42: blue rows pulse again, glow grows */
  tl.to(WIND, {scale:1.08, duration:0.25, ease:"sine.inOut", yoyo:true, repeat:1}, 15.42);
  tl.to(sub(WIND, ".w1-gl"), {autoAlpha:1, scale:1.12, transformOrigin:"0% 50%", duration:0.5, ease:"power2.out"}, 15.42);

  /* EXIT, last 0.6 s (host ends 17.00): chip slides out, wall and source fade to the ground */
  tl.to("#w1-chip", {x:-60, autoAlpha:0, duration:0.6, ease:"power3.in"}, 16.4);
  tl.to("#w1-wall", {autoAlpha:0, duration:0.6, ease:"power2.in"}, 16.4);
  tl.to("#w1-src", {autoAlpha:0, duration:0.6, ease:"power2.in"}, 16.4);

  window.__timelines["g-a1-1-wall"] = tl;
})();
</script>
