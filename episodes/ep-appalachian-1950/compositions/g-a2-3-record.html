<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#r3-";

  /* BY @0.00: ground and source line on (CSS); calendar card waits above frame */
  tl.set(P+"cal", {y:-700}, 0);

  /* SATURDAY @0.62: card with top band drops in */
  tl.to(P+"cal", {y:0, autoAlpha:1, duration:0.5, ease:"back.out(1.4)"}, 0.62);

  /* SEVEN @2.16: 7.5 stamps, card shakes */
  tl.fromTo(P+"num", {scale:1.4, autoAlpha:0, transformOrigin:"50% 50%"}, {scale:1, autoAlpha:1, duration:0.3, ease:"power4.out"}, 2.16);
  tl.to(P+"cal", {x:6, duration:0.05, ease:"none"}, 2.16);
  tl.to(P+"cal", {x:-6, duration:0.05, ease:"none"}, 2.21);
  tl.to(P+"cal", {x:4, duration:0.05, ease:"none"}, 2.26);
  tl.to(P+"cal", {x:-4, duration:0.05, ease:"none"}, 2.31);
  tl.to(P+"cal", {x:0, duration:0.05, ease:"none"}, 2.36);
  /* 0.2 s later: IN, then COLUMBUS, OHIO */
  tl.fromTo(P+"in", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.3, ease:"power3.out"}, 2.36);
  tl.fromTo(P+"city", {autoAlpha:0, y:20}, {autoAlpha:1, y:0, duration:0.3, ease:"power3.out"}, 2.5);

  /* NOVEMBER @4.70: NWS cite card slides in */
  tl.fromTo(P+"cite", {x:660, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.7, ease:"power3.out"}, 4.70);

  /* SINCE @6.18: chip arrives (readable 6.58 to exit at 17.08, over 10 s) */
  tl.fromTo(P+"chip", {y:20, autoAlpha:0}, {y:0, autoAlpha:1, duration:0.4, ease:"power3.out"}, 6.18);

  /* 7.08 hold: snow drifts (50 to 90 px/s over 10 s), calendar card floats */
  tl.to(P+"ga", {autoAlpha:1, duration:0.6, ease:"power1.out"}, 7.08);
  tl.to(P+"gb", {autoAlpha:1, duration:0.6, ease:"power1.out"}, 7.08);
  tl.to(P+"gc", {autoAlpha:1, duration:0.6, ease:"power1.out"}, 7.08);
  tl.to(P+"gd", {autoAlpha:1, duration:0.6, ease:"power1.out"}, 7.08);
  tl.to(P+"ga", {y:500, duration:10, ease:"none"}, 7.08);   /* 50 px/s */
  tl.to(P+"gb", {y:650, duration:10, ease:"none"}, 7.08);   /* 65 px/s */
  tl.to(P+"gc", {y:750, duration:10, ease:"none"}, 7.08);   /* 75 px/s */
  tl.to(P+"gd", {y:900, duration:10, ease:"none"}, 7.08);   /* 90 px/s */
  tl.to(P+"ga", {x:24, duration:2.5, ease:"sine.inOut", yoyo:true, repeat:3}, 7.08);
  tl.to(P+"gb", {x:-20, duration:2.5, ease:"sine.inOut", yoyo:true, repeat:3}, 7.08);
  tl.to(P+"gc", {x:16, duration:2.5, ease:"sine.inOut", yoyo:true, repeat:3}, 7.08);
  tl.to(P+"gd", {x:-28, duration:2.5, ease:"sine.inOut", yoyo:true, repeat:3}, 7.08);
  tl.to(P+"cal", {y:-6, duration:2.5, ease:"sine.inOut", yoyo:true, repeat:3}, 7.08);  /* 4 legs, ends at y 0 at 17.08 */

  /* AND @13.00: the beat turns to the crowd, cite card and chip dim to 60 % */
  tl.to(P+"cite", {autoAlpha:0.6, duration:0.5, ease:"power2.inOut"}, 13.00);
  tl.to(P+"chip", {autoAlpha:0.6, duration:0.5, ease:"power2.inOut"}, 13.00);

  /* EXIT last 0.6 s (host 17.68): snow fades, cards slide out */
  tl.to([P+"ga", P+"gb", P+"gc", P+"gd"], {autoAlpha:0, duration:0.5, ease:"power1.in"}, 16.58);
  tl.to([P+"cite", P+"chip"], {x:980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 17.08);
  tl.to(P+"cal", {x:-980, autoAlpha:0, duration:0.6, ease:"power3.in"}, 17.08);

  window.__timelines["g-a2-3-record"] = tl;
})();
