<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-a2-13-river (A2-S13): the Ohio River rises, Pittsburgh then Cincinnati. Prefix v13-.
  Two gauges, each on its OWN scale (Pittsburgh 16 px/ft, 0 ft at y 880; Cincinnati 8 px/ft, 0 ft at y 880).
  Pittsburgh: crest 28.5 ft = y 424, flood stage 24.5 ft = y 488. Cincinnati: crest 56 ft = y 432, flood stage 52 ft = y 464.
  Exit: fade-through to #04070c from 12.52 to 13.12 ("56 FT" at 12.32 reads 0.2 s before the exit starts; host cut to 13.12 s).
-->
<template>
<style>
  #v13-root { position:absolute; inset:0; overflow:hidden; font-family: Arial, sans-serif; }
  #v13-bg { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 45%, #0b1016, #030507 78%); }
  #v13-svg { position:absolute; left:0; top:0; }
  #v13-fade { position:absolute; inset:0; background:#04070c; opacity:0; visibility:hidden; }
  .v13-eyebrow { font-family: Arial, sans-serif; font-weight:700; font-size:22px; letter-spacing:6px; fill:#93a3b2; }
  .v13-head { font-family: 'Arial Black', Arial, sans-serif; font-weight:900; font-size:52px; fill:#f2f5f8; }
  .v13-tick { font-family: Arial, sans-serif; font-weight:700; font-size:22px; fill:#93a3b2; text-anchor:end; stroke:#04070c; stroke-width:4px; paint-order:stroke; }
  .v13-flab { font-family: Arial, sans-serif; font-weight:700; font-size:22px; letter-spacing:4px; fill:#e74c3c; }
  .v13-big { font-family: 'Arial Black', Arial, sans-serif; font-weight:900; font-size:58px; fill:#f2f5f8; }
  .v13-sub { font-family: Arial, sans-serif; font-weight:700; font-size:26px; letter-spacing:2px; fill:#e74c3c; }
  .v13-name { font-family: Arial, sans-serif; font-weight:700; font-size:26px; letter-spacing:4px; fill:#dfe7ee; text-anchor:middle; }
  .v13-src { font-family: Arial, sans-serif; font-weight:700; font-size:19px; letter-spacing:2px; fill:#c8d3e0; }
  .v13-hid { opacity:0; visibility:hidden; }
</style>
<div id="v13-root" data-composition-id="g-a2-13-river" data-width="1920" data-height="1080">
  <div id="v13-bg"></div>
  <svg id="v13-svg" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="v13-pclip"><rect x="300" y="0" width="340" height="880"/></clipPath>
      <clipPath id="v13-cclip"><rect x="1060" y="0" width="340" height="880"/></clipPath>
    </defs>

    <!-- title -->
    <text id="v13-eyebrow" class="v13-eyebrow v13-hid" x="110" y="92">OHIO RIVER · AFTER THE STORM</text>
    <text id="v13-head" class="v13-head v13-hid" x="110" y="146">THE MELT REACHES THE RIVER</text>

    <!-- ===== Pittsburgh gauge ===== -->
    <g id="v13-pg">
      <line x1="240" y1="881.5" x2="700" y2="881.5" stroke="#2a3644" stroke-width="3"/>
      <g clip-path="url(#v13-pclip)">
        <g id="v13-pw">
          <rect x="300" y="14" width="340" height="900" fill="#5a768f" fill-opacity="0.85"/>
          <g id="v13-pwave">
            <path d="M240 0 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V14 H240 Z" fill="#5a768f" fill-opacity="0.85"/>
            <path d="M240 0 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#7fb2e5" stroke-width="3"/>
          </g>
        </g>
        <!-- 12 melting flakes -->
        <circle id="v13-f1" class="v13-hid" cx="330" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f2" class="v13-hid" cx="560" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f3" class="v13-hid" cx="395" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f4" class="v13-hid" cx="610" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f5" class="v13-hid" cx="360" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f6" class="v13-hid" cx="545" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f7" class="v13-hid" cx="310" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f8" class="v13-hid" cx="580" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f9" class="v13-hid" cx="380" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f10" class="v13-hid" cx="625" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f11" class="v13-hid" cx="345" cy="530" r="4" fill="#f2f5f8"/>
        <circle id="v13-f12" class="v13-hid" cx="595" cy="530" r="4" fill="#f2f5f8"/>
      </g>
      <!-- 4 ft band between flood line and crest -->
      <rect id="v13-pband" class="v13-hid" x="300" y="424" width="340" height="64" fill="#e74c3c" fill-opacity="0.25"/>
      <!-- staff board -->
      <rect x="420" y="400" width="100" height="480" fill="#15202b" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="880" x2="420" y2="880" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="800" x2="420" y2="800" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="720" x2="420" y2="720" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="640" x2="420" y2="640" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="560" x2="420" y2="560" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="480" x2="420" y2="480" stroke="#93a3b2" stroke-width="2"/>
      <line x1="410" y1="400" x2="420" y2="400" stroke="#93a3b2" stroke-width="2"/>
      <text class="v13-tick" x="405" y="888">0</text>
      <text class="v13-tick" x="405" y="808">5</text>
      <text class="v13-tick" x="405" y="728">10</text>
      <text class="v13-tick" x="405" y="648">15</text>
      <text class="v13-tick" x="405" y="568">20</text>
      <text class="v13-tick" x="405" y="488">25</text>
      <text class="v13-tick" x="405" y="408">30</text>
      <!-- flood stage line (24.5 ft = y 488), starts right of the tick labels so "25" is never struck through -->
      <rect id="v13-pfl" class="v13-hid" x="412" y="486.5" width="268" height="3" fill="#c0392b"/>
      <text id="v13-pflab" class="v13-flab v13-hid" x="690" y="495">FLOOD STAGE</text>
      <!-- readout -->
      <text id="v13-p285" class="v13-big v13-hid" x="700" y="418">28.5 FT</text>
      <text id="v13-p4" class="v13-sub v13-hid" x="700" y="452">4 FT OVER</text>
      <text id="v13-pname" class="v13-name" style="opacity:0.45" x="470" y="910">PITTSBURGH</text>
    </g>

    <!-- ===== Cincinnati gauge ===== -->
    <g id="v13-cg" class="v13-hid">
      <line x1="1020" y1="881.5" x2="1440" y2="881.5" stroke="#2a3644" stroke-width="3"/>
      <g clip-path="url(#v13-cclip)">
        <g id="v13-cw">
          <rect x="1060" y="14" width="340" height="900" fill="#5a768f" fill-opacity="0.85"/>
          <g id="v13-cwave">
            <path d="M1000 0 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V14 H1000 Z" fill="#5a768f" fill-opacity="0.85"/>
            <path d="M1000 0 q15 -7 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0" fill="none" stroke="#7fb2e5" stroke-width="3"/>
          </g>
        </g>
      </g>
      <rect x="1180" y="400" width="100" height="480" fill="#15202b" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="880" x2="1180" y2="880" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="800" x2="1180" y2="800" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="720" x2="1180" y2="720" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="640" x2="1180" y2="640" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="560" x2="1180" y2="560" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="480" x2="1180" y2="480" stroke="#93a3b2" stroke-width="2"/>
      <line x1="1170" y1="400" x2="1180" y2="400" stroke="#93a3b2" stroke-width="2"/>
      <text class="v13-tick" x="1165" y="888">0</text>
      <text class="v13-tick" x="1165" y="808">10</text>
      <text class="v13-tick" x="1165" y="728">20</text>
      <text class="v13-tick" x="1165" y="648">30</text>
      <text class="v13-tick" x="1165" y="568">40</text>
      <text class="v13-tick" x="1165" y="488">50</text>
      <text class="v13-tick" x="1165" y="408">60</text>
      <!-- flood stage line (52 ft = y 464), no text label -->
      <rect id="v13-cfl" class="v13-hid" x="1040" y="462.5" width="380" height="3" fill="#c0392b"/>
      <text id="v13-c56" class="v13-big v13-hid" x="1230" y="382" text-anchor="middle">56 FT</text>
      <text class="v13-name" x="1230" y="910">CINCINNATI</text>
    </g>

    <text class="v13-src" x="110" y="1020">Source: NOAA NCEI</text>
  </svg>
  <div id="v13-fade"></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const P = "#v13-";

  /* start state */
  tl.set([P+"eyebrow",P+"head",P+"pfl",P+"pflab",P+"p285",P+"p4",P+"pband",P+"cfl",P+"c56",P+"fade"], {autoAlpha:0}, 0);
  tl.set(P+"pname", {autoAlpha:0.45}, 0);
  tl.set(P+"pw", {y:752}, 0);   /* Pittsburgh water at 8 ft */
  tl.set(P+"cw", {y:640}, 0);   /* Cincinnati water at 30 ft */
  tl.set(P+"cg", {x:660, autoAlpha:0}, 0);

  /* ambient: surface ripples at 30 px/s the whole window (one period = 60 px per 2 s) */
  /* host is 13.12 s: whole periods, then a partial one so neither wave runs past it (60 px = one period, so the 0 restart is seamless) */
  tl.to(P+"pwave", {x:-60, duration:2, ease:"none", repeat:5}, 0);
  tl.fromTo(P+"pwave", {x:0}, {x:-33.6, duration:1.12, ease:"none", immediateRender:false}, 12);
  tl.to(P+"cwave", {x:-60, duration:2, ease:"none"}, 10.5);
  tl.fromTo(P+"cwave", {x:0}, {x:-18.6, duration:0.62, ease:"none", immediateRender:false}, 12.5);

  /* THEN @0.00: flakes melt into the Pittsburgh water (12 flakes fall 215 px to the 8 ft surface and fade) */
  tl.set(P+"f1", {autoAlpha:0.9}, 0.10);  tl.to(P+"f1", {y:215, duration:1.3, ease:"none"}, 0.10);  tl.to(P+"f1", {autoAlpha:0, duration:0.3}, 1.10);
  tl.set(P+"f2", {autoAlpha:0.9}, 0.35);  tl.to(P+"f2", {y:215, duration:1.3, ease:"none"}, 0.35);  tl.to(P+"f2", {autoAlpha:0, duration:0.3}, 1.35);
  tl.set(P+"f3", {autoAlpha:0.9}, 0.60);  tl.to(P+"f3", {y:215, duration:1.3, ease:"none"}, 0.60);  tl.to(P+"f3", {autoAlpha:0, duration:0.3}, 1.60);
  tl.set(P+"f4", {autoAlpha:0.9}, 0.90);  tl.to(P+"f4", {y:215, duration:1.3, ease:"none"}, 0.90);  tl.to(P+"f4", {autoAlpha:0, duration:0.3}, 1.90);
  tl.set(P+"f5", {autoAlpha:0.9}, 1.15);  tl.to(P+"f5", {y:215, duration:1.3, ease:"none"}, 1.15);  tl.to(P+"f5", {autoAlpha:0, duration:0.3}, 2.15);
  tl.set(P+"f6", {autoAlpha:0.9}, 1.40);  tl.to(P+"f6", {y:215, duration:1.3, ease:"none"}, 1.40);  tl.to(P+"f6", {autoAlpha:0, duration:0.3}, 2.40);
  tl.set(P+"f7", {autoAlpha:0.9}, 1.70);  tl.to(P+"f7", {y:215, duration:1.3, ease:"none"}, 1.70);  tl.to(P+"f7", {autoAlpha:0, duration:0.3}, 2.70);
  tl.set(P+"f8", {autoAlpha:0.9}, 1.95);  tl.to(P+"f8", {y:215, duration:1.3, ease:"none"}, 1.95);  tl.to(P+"f8", {autoAlpha:0, duration:0.3}, 2.95);
  tl.set(P+"f9", {autoAlpha:0.9}, 2.20);  tl.to(P+"f9", {y:215, duration:1.3, ease:"none"}, 2.20);  tl.to(P+"f9", {autoAlpha:0, duration:0.3}, 3.20);
  tl.set(P+"f10", {autoAlpha:0.9}, 2.50); tl.to(P+"f10", {y:215, duration:1.3, ease:"none"}, 2.50); tl.to(P+"f10", {autoAlpha:0, duration:0.3}, 3.50);
  tl.set(P+"f11", {autoAlpha:0.9}, 2.75); tl.to(P+"f11", {y:215, duration:1.3, ease:"none"}, 2.75); tl.to(P+"f11", {autoAlpha:0, duration:0.3}, 3.75);
  tl.set(P+"f12", {autoAlpha:0.9}, 3.00); tl.to(P+"f12", {y:215, duration:1.3, ease:"none"}, 3.00); tl.to(P+"f12", {autoAlpha:0, duration:0.3}, 4.00);

  /* MELTED @2.72: title */
  tl.fromTo(P+"eyebrow", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.4, ease:"power2.out"}, 2.72);
  tl.fromTo(P+"head", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.4, ease:"power2.out"}, 2.92);

  /* RIVERS @4.36: slow rise 8 ft to 20 ft (y 752 to 560); 2.26 s, not 2.6 s, so it meets the ROSE cue at 6.62 */
  tl.to(P+"pw", {y:560, duration:2.26, ease:"none"}, 4.36);

  /* PITTSBURGH @5.42: name brightens, flood line draws left to right, then its label */
  tl.to(P+"pname", {autoAlpha:1, duration:0.4}, 5.42);
  tl.fromTo(P+"pfl", {scaleX:0, autoAlpha:0, svgOrigin:"412 488", smoothOrigin:false}, {scaleX:1, autoAlpha:1, svgOrigin:"412 488", smoothOrigin:false, duration:0.5, ease:"power2.out"}, 5.42);
  tl.fromTo(P+"pflab", {autoAlpha:0, x:-12}, {autoAlpha:1, x:0, duration:0.3, ease:"power2.out"}, 5.80);

  /* ROSE @6.62: to 28.5 ft (y 424), passing the red line */
  tl.to(P+"pw", {y:424, duration:1.0, ease:"power2.out"}, 6.62);

  /* 28.5 @7.12 */
  tl.fromTo(P+"p285", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.35, ease:"power2.out"}, 7.12);

  /* 4 @8.82: readout, band flash */
  tl.fromTo(P+"p4", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.35, ease:"power2.out"}, 8.82);
  tl.fromTo(P+"pband", {autoAlpha:0}, {autoAlpha:1, duration:0.2}, 8.82);
  tl.to(P+"pband", {autoAlpha:0, duration:0.4}, 9.02);

  /* DOWNSTREAM @10.68: Cincinnati slides in (water at 30 ft), Pittsburgh dims to 60 % */
  tl.fromTo(P+"cg", {x:660, autoAlpha:0}, {x:0, autoAlpha:1, duration:0.7, ease:"power3.out"}, 10.68);
  tl.to(P+"pg", {autoAlpha:0.6, duration:0.5}, 10.68);

  /* CINCINNATI @11.30: rises to 56 ft (y 432); flood line draws as the water nears it */
  tl.to(P+"cw", {y:432, duration:1.0, ease:"power2.out"}, 11.30);
  tl.fromTo(P+"cfl", {scaleX:0, autoAlpha:0, svgOrigin:"1040 464", smoothOrigin:false}, {scaleX:1, autoAlpha:1, svgOrigin:"1040 464", smoothOrigin:false, duration:0.4, ease:"power2.out"}, 11.45);

  /* 56 @12.32 */
  tl.fromTo(P+"c56", {autoAlpha:0, y:16}, {autoAlpha:1, y:0, duration:0.35, ease:"power2.out"}, 12.32);

  /* EXIT: fade-through to #04070c to hand off to g-a2-14; "56 FT" has been readable for 1.5 s+ before this starts */
  /* no exit fade: hard cut at the 13.12 host end so "56 FT" (12.32) reads 0.8 s (STATE decision 28 Oct) */

  window.__timelines["g-a2-13-river"] = tl;
})();
</script>
</template>
</body>
</html>
