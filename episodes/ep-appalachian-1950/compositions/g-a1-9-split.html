  // seeded generator: positions are fixed at build time, never at seek time

  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

  var wrapS = gsap.utils.wrap(-200, 1160);
  var wrapX = gsap.utils.wrap(900, 1960);

  function streaks(hostId, n) {

    for (var i = 0; i < n; i++) {

      var y = 40 + Math.round(rnd() * 1000);
      var x0 = -200 + Math.round(rnd() * 1360);
      var d = document.createElement("div");
      d.className = "sp9-streak";
      d.style.width = len + "px";
      d.style.top = y + "px";
      host.appendChild(d);
      tl.fromTo(d, { x: x0 }, { x: x0 + 7000, duration: 14, ease: "none", modifiers: { x: mS } }, 0);
    }
  }

  streaks("sp9-streaks2", 30);

  // snow: 2 to 5 px flakes, 60 to 120 px/s down, +40 to +90 px/s east, wrapped inside the (clipped) right half

      var y0 = Math.round(rnd() * 1080);
      var vy = 60 + rnd() * 60;
      var vx = 40 + rnd() * 50;
      var d = document.createElement("div");
      d.className = "sp9-flake";
      d.style.width = sz + "px";
      d.style.height = sz + "px";
      d.style.opacity = op;
      host.appendChild(d);
      tl.fromTo(d, { x: x0, y: y0 }, { x: x0 + vx * 14, y: y0 + vy * 14, duration: 14, ease: "none", modifiers: { x: mX, y: mY } }, 0);
