<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#a3c-";
  const $ = function (n) { return document.getElementById("a3c-" + n); };
  const proj = function (lon, lat) { return [3841 * (lon + 97.576), -5585 * (lat - 46.6213)]; };
  const DUR = 6.40;                                                           /* 6.00 "reached." end + 0.40 */

  /* frame screen px -> map units */
  const fromAX = function (x, y) { return [42191.8 + x / 0.03, 15852.5 + y / 0.03]; };
  const fromT = function (x, y) { return [-4474.8 + x / 0.0125, 16919.2 + y / 0.0125]; };
  const NWK = proj(-74.1724, 40.7357), PIT = proj(-79.9959, 40.4406), BUF = proj(-78.8784, 42.8864);

  /* g-a3-9-exit's track, copied from its file (A2-X px), extended south off-frame to the Carolinas point (T px).
     Loop: radius 30 px at A2-X = 1000 map units, centre (621,265). */
  const CAR = fromT(967, 565);
  const TRK = [[1080, 1100], [1080, 650], [1080, 570], [1010, 500], [900, 492], [820, 486], [750, 515], [700, 520],
    [660, 520], [651, 420], [651, 265]].map(function (p) { return fromAX(p[0], p[1]); });
  const LOOP_W = fromAX(591, 265), LOOP_R = 1000;
  const EXIT = [fromAX(637.5, 239.9), fromAX(1125, -500)];
  const ARROW_AT = fromAX(651, 265);                                          /* loop arrowhead rest point (g-a3-9) */
  /* connectors as g-a3-9: [element, from, to] */
  const CON = [[$("con-nwk"), fromAX(1080, 700), fromAX(1415, 520)], [$("con-pit"), fromAX(752, 511), fromAX(759, 543)],
    [$("con-buf"), fromAX(648.6, 253.2), fromAX(872, 157.3)]];

  /* cold arrows (T px): start on the Ohio / Lake Erie latitudes, quadratic control, end well south of the snow edge.
     [start, control, end, t0, dur]. 3 and 4 draw with the camera (COLD @0.26, cross the Ohio River near "Ohio," 1.16);
     5, 1, 2 at SOUTH @2.58, stagger 0.25, 0.76 s each, heads in by 3.84. Arrow 2 is the Florida Panhandle one. */
  const AR = [
    [fromT(520, 170), fromT(520, 450), fromT(505, 680), 2.83, 0.76],          /* 1 west Alabama */
    [fromT(610, 150), fromT(600, 520), fromT(560, 880), 3.08, 0.76],          /* 2 Florida Panhandle (y 880) */
    [fromT(700, 130), fromT(690, 440), fromT(640, 730), 0.26, 2.20],          /* 3 east Alabama */
    [fromT(790, 190), fromT(770, 460), fromT(720, 700), 0.26, 2.20],          /* 4 Atlanta area */
    [fromT(870, 250), fromT(850, 500), fromT(800, 730), 2.58, 0.76]           /* 5 east Georgia */
  ];
  const arEls = AR.map(function (a, i) { return [$("ar" + (i + 1)), $("cv" + (i + 1)), $("hd" + (i + 1))]; });

  /* camera frames [s, top-left x, top-left y] -> centre form [s, cx, cy] */
  const fr = function (s, tx, ty) { return [s, tx + 960 / s, ty + 540 / s]; };
  const AX = fr(0.03, 42191.8, 15852.5), FT = fr(0.0125, -4474.8, 16919.2);
  const p2io = gsap.parseEase("power2.inOut"), p1io = gsap.parseEase("power1.inOut");
  const lerp = function (a, b, u) { return a + (b - a) * u; };
  const clamp = function (v) { return v < 0 ? 0 : (v > 1 ? 1 : v); };
  function logLerpScale(fromScale, toScale, t) {                              /* helpers.js logZoom */
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  function state(t) {
    if (t < 0.26) return AX;                                                   /* BUT: frame A2-X held */
    if (t < 2.26) {                                                            /* COLD: A2-X -> T, 2.0 s, log scale */
      const u = p2io((t - 0.26) / 2.0);
      return [logLerpScale(AX[0], FT[0], u), lerp(AX[1], FT[1], u), lerp(AX[2], FT[2], u)];
    }
    return FT;
  }

  const camEl = $("cam"), trackEl = $("track"), glowEl = $("trackglow"), exitEl = $("exit");
  const pins = [[$("nwk-at"), NWK], [$("pit-at"), PIT], [$("buf-at"), BUF]];
  function camAt(t) {
    const c = state(t), s = c[0], cx = c[1], cy = c[2], k = s / 0.03;
    const sc = function (p) { return (960 + (p[0] - cx) * s).toFixed(2) + "," + (540 + (p[1] - cy) * s).toFixed(2); };
    camEl.setAttribute("transform", "translate(" + (960 - cx * s).toFixed(2) + "," + (540 - cy * s).toFixed(2) + ") scale(" + s.toFixed(6) + ")");
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i][1];
      pins[i][0].setAttribute("transform", "translate(" + sc(p) + ") scale(" + k.toFixed(4) + ")");
    }
    const r = (LOOP_R * s).toFixed(2);
    const td = "M" + TRK.map(sc).join(" L") + " A" + r + " " + r + " 0 1 1 " + sc(LOOP_TOP) + " A" + r + " " + r + " 0 1 1 " + sc(TRK[4]);
    trackEl.setAttribute("d", td);
    glowEl.setAttribute("d", td);
    exitEl.setAttribute("d", "M" + EXIT.map(sc).join(" L"));
    for (let i = 0; i < CON.length; i++) CON[i][0].setAttribute("d", "M" + sc(CON[i][1]) + " L" + sc(CON[i][2]));
    for (let i = 0; i < AR.length; i++) {
      const a = AR[i], el = arEls[i];
      const d = "M" + sc(a[0]) + " Q" + sc(a[1]) + " " + sc(a[2]);
      const p = p1io(clamp((t - a[3]) / a[4]));
      el[0].setAttribute("d", d);
      el[0].setAttribute("stroke-dashoffset", (1 - p).toFixed(4));
      el[1].setAttribute("d", d);
      el[1].setAttribute("opacity", (0.75 * clamp((t - a[3] - a[4]) / 0.3)).toFixed(3));
      el[1].setAttribute("stroke-dashoffset", (-90 * t).toFixed(1));      /* conveyor 90 px/s toward the head */
      const L = el[0].getTotalLength(), at = p * L;
      const h = el[0].getPointAtLength(at), b = el[0].getPointAtLength(Math.max(0, at - 2)), f = el[0].getPointAtLength(Math.min(L, Math.max(at, 2)));
      const ang = Math.atan2(f.y - b.y, f.x - b.x) * 180 / Math.PI;
      el[2].setAttribute("transform", "translate(" + h.x.toFixed(2) + "," + h.y.toFixed(2) + ") rotate(" + ang.toFixed(2) + ")");
      el[2].setAttribute("opacity", clamp(p * 20).toFixed(3));
    }
  }
  camAt(0);

  /* basemap paint order as g-a4-1: coast under-stroke (half hidden by the fills), then fills with state lines */
  [$("ca"), $("us")].forEach(function (el) {
    const coast = el.cloneNode(false);
    coast.removeAttribute("id");
    coast.setAttribute("fill", "none"); coast.setAttribute("stroke", "#4a5560"); coast.setAttribute("stroke-width", "3.2");
    camEl.insertBefore(coast, camEl.firstChild);
  });

  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* transforms and dash state start in set() at 0 (file contract) */
  tl.set([P + "chip", P + "src", P + "src0", P + "nwklab", P + "pitlab", P + "buflab"], { x: 0, y: 0 }, 0);
  tl.set(P + "scan", { y: 0 }, 0);
  tl.set(P + "leader", { strokeDasharray: "103 103", strokeDashoffset: 103 }, 0);
  tl.set(P + "exit", { strokeDashoffset: 0 }, 0);

  /* ambient: scan line down at 60 px/s for the whole comp (384 px), fades in as the camera starts */
  tl.to(P + "scan", { y: 384, duration: DUR, ease: "none" }, 0);
  tl.to(P + "scan", { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.26);
  /* carried over from g-a3-9: Newark pulse ring every 1.4 s, Pittsburgh glow breathes, exit dots march */
  tl.fromTo(P + "nwk-pulse", { opacity: 0.8, attr: { r: 17 } }, { opacity: 0, attr: { r: 40 }, duration: 1.4, ease: "power2.out", repeat: 3 }, 0);
  tl.fromTo(P + "pit-glow", { opacity: 0.6 }, { opacity: 1, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);
  tl.to(P + "exit", { strokeDashoffset: -14, duration: 0.5, ease: "none", repeat: 11 }, 0);

  /* BUT @0.00: frame 0 = g-a3-9 last frame; pin labels and g-a3-9's source line fade out before the move (0.26 s) */
  tl.to([P + "nwklab", P + "pitlab", P + "buflab", P + "src0"], { autoAlpha: 0, duration: 0.26, ease: "power2.in" }, 0);

  /* COLD @0.26: camera A2-X -> T starts (camAt, logZoom, power2.inOut, lands 2.26); arrows 3 and 4 start drawing south
     (camAt, 2.2 s); the track dims to 0.4 */
  tl.to(P + "trackg", { opacity: 0.4, duration: 1.0, ease: "power1.inOut" }, 0.26);
  /* OHIO @1.16: arrows 3 and 4 cross the Ohio River line (about 32 % of their length) */
  /* 1.26: pins settle to 0.5 as the map pulls out (no labels) */
  tl.to(P + "pins", { opacity: 0.5, duration: 1.0, ease: "power1.inOut" }, 1.26);
  /* 2.26: camera lands on frame T; new source line in */
  tl.fromTo(P + "src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 2.26);

  /* SOUTH @2.58: arrows 5, 1, 2 draw on (camAt), stagger 0.25, 0.76 s each, heads in by 3.84 (riser starts in index.html) */
  /* GET @3.14: snow fill fades in (0.6 s), edge line draws west to east (0.6 s) */
  tl.to(P + "fillg", { autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 3.14);
  tl.to(P + "edgeclip-r", { attr: { width: 300 }, duration: 0.6, ease: "power2.inOut" }, 3.14);

  /* A LOT FARTHER @4.08 (brief cue "farther" @4.32, moved to the phrase's first word so the chip reads 1.5 s before the
     exit): chip in x 30 -> 0 with its leader */
  tl.fromTo(P + "chip", { autoAlpha: 0, x: 30 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 4.08);
  tl.set(P + "leader", { autoAlpha: 1 }, 4.08);
  tl.to(P + "leader", { strokeDashoffset: 0, duration: 0.35, ease: "power3.out" }, 4.08);

  /* REACHED @5.68: riser ends (index.html); conveyors keep running (camAt) */
  /* EXIT @5.95: the whole map fades through to #04070c (0.45 s, power2.in) into the chapter blackout */
  tl.to(P + "black", { autoAlpha: 1, duration: 0.45, ease: "power2.in" }, 5.95);

  window.__timelines["g-a3-10-south"] = tl;
})();
</script>
