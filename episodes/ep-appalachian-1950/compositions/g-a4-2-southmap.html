    [-79.9, 34.2], [-83.2, 33.6], [-81.6, 33.5], [-82.3, 32.9], [-80.6, 32.9], [-84.8, 34.2], [-81.0, 34.8],
    [-82.0, 31.3], [-80.5, 33.8], [-84.6, 31.0], [-81.9, 34.4], [-81.9, 32.4], [-83.6, 32.9]];
  const glints = Array.prototype.slice.call($("glints").querySelectorAll("circle"));
  glints.forEach(function (c, i) { const p = proj(GL[i][0], GL[i][1]); c.setAttribute("cx", p[0].toFixed(0)); c.setAttribute("cy", p[1].toFixed(0)); });

  const tl = gsap.timeline({ paused: true });
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* transforms start in set() at 0 (file contract) */
  const VALS = [P + "ashval", P + "atlval", P + "birval"];
  tl.set([P + "ashlab", P + "atllab", P + "birlab", P + "buflab", P + "penlab", P + "bufval", P + "penval", P + "cropchip", P + "crop2"], { x: 0, y: 0 }, 0);
  tl.set([P + "ashval", P + "atlval", P + "penval"], { scale: 1, transformOrigin: "0% 50%", smoothOrigin: false }, 0);
  tl.set(P + "birval", { scale: 1, transformOrigin: "100% 50%", smoothOrigin: false }, 0);
  tl.set([P + "ash", P + "atl", P + "bir", P + "pen"], { scale: 1, transformOrigin: "50% 50%", smoothOrigin: false }, 0);

  /* ambient: scan line top to bottom, three passes (about 94 px/s); Buffalo glow breathes 0.5-0.7, 2 s period */
  tl.fromTo(P + "scan", { y: -10 }, { y: 1090, duration: DUR / 3, ease: "none", repeat: 2 }, 0);
  tl.fromTo(P + "bufglow", { opacity: 0.5 }, { opacity: 0.7, duration: 1.0, ease: "sine.inOut", repeat: 34, yoyo: true }, 0);

  /* CROSSED THE MOUNTAINS @0.00: pull-out P2s -> P4 (camAt), fill edge 36.4 -> 35.4 by 2.40 (edgeLat);
     Kentucky pins become 12 px dots at 0.6, Chicago dot arrives, the three Southeast rings land */
  tl.to(".a42-kring", { opacity: 0, duration: 1.2, ease: "power2.inOut" }, S4 + 0.30);
  tl.to(".a42-kcore", { attr: { r: 6 }, duration: 1.2, ease: "power2.inOut" }, S4 + 0.30);
  tl.to(".a42-ky", { opacity: 0.6, duration: 1.2, ease: "power2.inOut" }, S4 + 0.30);
  tl.fromTo(P + "chi", { autoAlpha: 0 }, { autoAlpha: 0.6, duration: 0.6, ease: "power1.out" }, S4 + 0.90);
  [P + "ash", P + "atl", P + "bir"].forEach(function (id, i) {
    tl.fromTo(id, { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%", smoothOrigin: false },
      { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", smoothOrigin: false, duration: 0.4, ease: "back.out(2)" }, S4 + 1.50 + 0.10 * i);
  });

  function turnBlue(n, at) {                                                   /* core sweeps top to bottom, ring to white, label in */
    tl.to(P + n + "clip-r", { attr: { height: 18 }, duration: 0.5, ease: "power2.inOut" }, at);
    tl.to(P + n + "-ring", { attr: { stroke: "#dfe7ee" }, duration: 0.5, ease: "power2.inOut" }, at);
    tl.fromTo(P + n + "lab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, at);
  }
  function valueIn(id, origin, at) {
    tl.fromTo(id, { autoAlpha: 0, scale: 0.9, transformOrigin: origin, smoothOrigin: false },
      { autoAlpha: 1, scale: 1, transformOrigin: origin, smoothOrigin: false, duration: 0.4, ease: "back.out(1.4)" }, at);
  }
  /* ASHEVILLE @2.64 */
  turnBlue("ash", S4 + 2.64);
  /* ONE ABOVE @4.54 */
  valueIn(P + "ashval", "0% 50%", S4 + 4.54);
  /* fill edge 35.4 -> 33.3, 4.60 to 5.80 (edgeLat). ATLANTA @5.88 */
  turnBlue("atl", S4 + 5.88);
  /* THREE ABOVE @6.62: Asheville dims (one reading target) */
  valueIn(P + "atlval", "0% 50%", S4 + 6.62);
  tl.to([P + "ashlab", P + "ashval"], { opacity: 0.6, duration: 0.3, ease: "power2.out" }, S4 + 6.62);
  /* BIRMINGHAM @8.42 */
  turnBlue("bir", S4 + 8.42);
  /* FIVE ABOVE @10.40: Atlanta dims */
  valueIn(P + "birval", "100% 50%", S4 + 10.40);
  tl.to([P + "atllab", P + "atlval"], { opacity: 0.6, duration: 0.3, ease: "power2.out" }, S4 + 10.40);
  /* SAME WEEKEND @11.46: every Southeast label and value at 0.6; drift up 20 px to 16.1 (camAt) */
  tl.to([P + "birlab", P + "birval"], { opacity: 0.6, duration: 0.3, ease: "power2.out" }, S4 + 11.46);
  /* BUFFALO @12.72: one strong pulse (ring 30 -> 70 px), label in */
  tl.fromTo(P + "bufpulse", { opacity: 0.9, attr: { r: 15 } }, { opacity: 0, attr: { r: 35 }, duration: 1.0, ease: "power1.out", immediateRender: false }, S4 + 12.72);
  tl.fromTo(P + "buflab", { autoAlpha: 0, x: -12 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, S4 + 12.72);
  /* 40S @15.58 */
  tl.fromTo(P + "bufval", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, S4 + 15.58);

  /* DIDNT STOP @0.00 (S5): every label and value out; P4 -> P0 (camAt); fill edge 33.3 -> 30.2 from 0.30 to 1.82, front bright */
  tl.to([P + "ashlab", P + "ashval", P + "atllab", P + "atlval", P + "birlab", P + "birval", P + "buflab", P + "bufval"],
    { autoAlpha: 0, duration: 0.4, ease: "power3.in" }, S5 + 0.00);
  tl.to(P + "src4", { autoAlpha: 0, duration: 0.3, ease: "power1.inOut" }, S5 + 0.00);
  tl.fromTo(P + "src5", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power1.inOut" }, S5 + 0.00);
  tl.to(P + "front", { opacity: 1, duration: 0.3, ease: "power1.out" }, S5 + 0.30);
  /* GULF @1.82: front flashes once and fades to 0; Pensacola ring lands */
  tl.to(P + "front", { attr: { fill: "#f2f5f8" }, duration: 0.12, ease: "power1.out" }, S5 + 1.82);
  tl.to(P + "front", { opacity: 0, duration: 0.8, ease: "power2.in" }, S5 + 1.94);
  tl.fromTo(P + "pen", { autoAlpha: 0, scale: 0.3, transformOrigin: "50% 50%", smoothOrigin: false },
    { autoAlpha: 1, scale: 1, transformOrigin: "50% 50%", smoothOrigin: false, duration: 0.4, ease: "back.out(2)" }, S5 + 1.82);
  /* PENSACOLA @2.98: pale blue */
  turnBlue("pen", S5 + 2.98);
  /* 22 DEGREES @6.80 */
  valueIn(P + "penval", "0% 50%", S5 + 6.80);
  /* S5 8.30 to 13.4: hold, ring pulse every 1.4 s (4 pulses), 2 % push (camAt) */
  tl.fromTo(P + "penpulse", { opacity: 0.8, attr: { r: 15 } }, { opacity: 0, attr: { r: 35 }, duration: 1.0, ease: "power1.out", repeat: 3, repeatDelay: 0.4, immediateRender: false }, S5 + 8.30);
  /* GEORGIA @13.50: Pensacola dims; rows fade in over GA then SC */
  tl.to([P + "penlab", P + "penval"], { opacity: 0.6, duration: 0.3, ease: "power2.out" }, S5 + 13.50);
  tl.to(P + "rows-ga", { opacity: 1, duration: 0.4, ease: "power1.out" }, S5 + 13.50);
  tl.to(P + "rows-sc", { opacity: 1, duration: 0.4, ease: "power1.out" }, S5 + 13.75);
  /* RECORD COLD @15.58: frost sweeps north to south (lat 35.3 -> 30.3); glints start, 0.13 s apart, each a 0.4 s blink */
  tl.to(P + "frostsweep-r", { attr: { height: latY(30.3) - latY(35.3) }, duration: 1.2, ease: "power1.in" }, S5 + 15.58);
  glints.forEach(function (c, i) {
    tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, S5 + 15.70 + 0.13 * i);
  });
  /* WIDESPREAD @16.74: crop chip in (0.4 s, so line 1 reads 1.5 s before the end); line 2 at 16.90, 0.26 s before
     "crop" (17.16), so it is fully on 1.52 s before the end (the brief's 17.16 would leave 1.16 s) */
  tl.fromTo(P + "cropchip", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, S5 + 16.74);
  tl.fromTo(P + "crop2", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "power3.out" }, S5 + 16.90);
  /* to the end: glints and scan line keep moving; no exit (the edit cuts to Paul's clip 5 on frame P0) */

  window.__timelines["g-a4-2-southmap"] = tl;
})();
