  <div class="s9-card s9-hide" id="s9-ctr">
    <span id="s9-ctrlab">SNOW FALLING</span>
    <span id="s9-date">NOV 22</span>
    <div id="s9-track"></div>
    <div id="s9-fill"></div>
    <div class="s9-tick" style="left:34px"></div>
    <div class="s9-tick" style="left:90.25px"></div>
    <div class="s9-tick" style="left:146.5px"></div>
    <div class="s9-tick" style="left:202.75px"></div>
    <div class="s9-tick" style="left:259px"></div>
    <div class="s9-tick" style="left:315.25px"></div>
    <div class="s9-tick" style="left:371.5px"></div>
    <div class="s9-tick" style="left:427.75px"></div>
    <div class="s9-tick" style="left:484px"></div>
  </div>
  <div class="s9-card s9-hide" id="s9-chip">
    <span class="s9-cl" id="s9-chip1">SNOW FOR</span>
    <span class="s9-cl" id="s9-chip2">ABOUT A WEEK</span>
  </div>
  <!-- source: frame 0 carries g-a2-8's line (identical cut), swapped when the Kentucky figures arrive -->
  <div class="s9-src" id="s9-src0">Source: NWS Charleston WV; NOAA NCEI</div>
  <div class="s9-src s9-hide" id="s9-src1">Source: NWS Charleston WV; NWS Jackson KY; NOAA NCEI</div>
  <div class="s9-credit" id="s9-credit">Basemap: Natural Earth</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const P = "#s9-";
  const $ = function (n) { return document.getElementById("s9-" + n); };
  const proj = function (lon, lat) { return [3841 * (lon + 97.576), -5585 * (lat - 46.6213)]; };
  const PKB = proj(-81.5615, 39.2667), CKB = proj(-80.3445, 39.2806), ELK = proj(-79.8467, 38.9262);
  const CHS = proj(-81.6326, 38.3498), HUN = proj(-82.4452, 38.4192);
  const PAI = proj(-82.8071, 37.8145), HAZ = proj(-83.1932, 37.2498);

  /* band (lon, lat), clockwise from the north tip: g-a2-7's V1 to V18, so frame 0 matches its band */
  const BAND_LL = [[-80.15, 41.95], [-79.80, 41.80], [-79.62, 41.40], [-79.55, 40.90], [-79.45, 40.40], [-79.50, 39.95],
    [-79.55, 39.55], [-79.62, 39.10], [-79.90, 38.75], [-80.35, 38.62], [-80.75, 38.75], [-80.95, 39.10],
    [-80.85, 39.55], [-80.75, 40.00], [-80.70, 40.50], [-80.62, 41.00], [-80.45, 41.50], [-80.35, 41.75]];
  /* KY-WV line, north to south: Big Sandy mouth (Catlettsburg), Louisa / Fort Gay, Tug Fork via Crum, Kermit,
     Williamson, Matewan, to the Virginia corner */
  const KYWV_LL = [[-82.598, 38.418], [-82.604, 38.115], [-82.50, 38.02], [-82.44, 37.90], [-82.409, 37.838],
    [-82.277, 37.674], [-82.167, 37.624], [-81.968, 37.544]];
  const pts = function (ll) { return ll.map(function (p) { const m = proj(p[0], p[1]); return m[0].toFixed(1) + "," + m[1].toFixed(1); }).join(" "); };
  $("band").setAttribute("points", pts(BAND_LL));
  $("kyline").setAttribute("points", pts(KYWV_LL));

  const DUR = 15.74;                                                          /* week. ends 15.34 + 0.40 */
  /* camera frames: [s, centre x, centre y] from scale + top-left */
  const fr = function (s, tx, ty) { return [s, tx + 960 / s, ty + 540 / s]; };
  const SW = 0.075, TLW = [54186.2, 35931.1], SS = 0.042, TLS = [37429.1, 35005.9];
  const W = fr(SW, TLW[0], TLW[1]), S = fr(SS, TLS[0], TLS[1]);
  /* the pull-out's fixed point: (FX - TLW) * SW = (FX - TLS) * SS */
  const FX = [(TLS[0] * SS - TLW[0] * SW) / (SS - SW), (TLS[1] * SS - TLW[1] * SW) / (SS - SW)];
  const FS = [(FX[0] - TLW[0]) * SW, (FX[1] - TLW[1]) * SW];
  const T_Z0 = 0.14, T_Z1 = 1.74, T_D1 = 15.34, DRIFT = 600;                 /* REACHED @0.14 -> lands 1.74 */

  const expo = gsap.parseEase("expo.inOut");
  function logLerpScale(fromScale, toScale, t) {                              /* helpers.js logZoom */
    return Math.exp(Math.log(fromScale) + (Math.log(toScale) - Math.log(fromScale)) * t);
  }
  function state(t) {
    if (t < T_Z0) return W;
    if (t < T_Z1) {
      const s = logLerpScale(SW, SS, expo((t - T_Z0) / (T_Z1 - T_Z0)));
      return [s, FX[0] + (960 - FS[0]) / s, FX[1] + (540 - FS[1]) / s];
    }
    if (t < T_D1) return [SS, S[1], S[2] + DRIFT * (t - T_Z1) / (T_D1 - T_Z1)];
    return [SS, S[1], S[2] + DRIFT];
  }
  const camEl = $("cam");
  const pins = [[$("pkb-at"), PKB], [$("ckb-at"), CKB], [$("elk-at"), ELK], [$("chs-at"), CHS], [$("hun-at"), HUN],
    [$("pai-at"), PAI], [$("haz-at"), HAZ]];
  const anchors = [[$("chs-pa"), CHS], [$("hun-pa"), HUN], [$("pai-pa"), PAI], [$("haz-pa"), HAZ]];
  function camAt(t) {
    const c = state(t), s = c[0], cx = c[1], cy = c[2];
    camEl.setAttribute("transform", "translate(" + (960 - cx * s).toFixed(2) + "," + (540 - cy * s).toFixed(2) + ") scale(" + s.toFixed(6) + ")");
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i][1];
      pins[i][0].setAttribute("transform", "translate(" + (960 + (p[0] - cx) * s).toFixed(2) + "," + (540 + (p[1] - cy) * s).toFixed(2) + ")");
    }
    for (let i = 0; i < anchors.length; i++) {
      const p = anchors[i][1];
      anchors[i][0].style.transform = "translate(" + (960 + (p[0] - cx) * s).toFixed(2) + "px," + (540 + (p[1] - cy) * s).toFixed(2) + "px)";
    }
  }
  camAt(0);

  const tl = gsap.timeline({ paused: true });
  /* camera spine over the whole window (pull-out, drift, hold) */
  tl.to({ t: 0 }, { t: 1, duration: DUR, ease: "none", onUpdate: function () { camAt(this.time()); } }, 0);

  /* transforms start in set() at 0 (file contract) */
  tl.set([P + "chs", P + "hun", P + "pai", P + "haz"], { scale: 1, svgOrigin: "0 0", smoothOrigin: false }, 0);
  tl.set([P + "chspill", P + "hunpill", P + "paipill", P + "hazpill", P + "ctr", P + "chip", P + "src1"], { x: 0, y: 0 }, 0);
  tl.set(P + "chsval", { scale: 1, transformOrigin: "center center" }, 0);
  tl.set(P + "fill", { scaleX: 0, transformOrigin: "left center" }, 0);

  /* ambient: g-a2-8's flake motion (35-65 px/s from the frame-0 height to y 950, then once more from the top) */
  const FALL0 = -20, FALL1 = 950;
  Array.prototype.slice.call($("flakes").querySelectorAll("circle")).forEach(function (c, i) {
    const cy0 = +c.getAttribute("cy"), v = 35 + (i * 11) % 31, d0 = (FALL1 - cy0) / v;
    tl.fromTo(c, { attr: { cy: cy0 } }, { attr: { cy: FALL1 }, duration: d0, ease: "none" }, 0);
    if (d0 < DUR) {
      const d1 = Math.min((FALL1 - FALL0) / v, DUR - d0);
      tl.fromTo(c, { attr: { cy: FALL0 } }, { attr: { cy: FALL0 + v * d1 }, duration: d1, ease: "none", immediateRender: false }, d0);
    }
  });

  /* REACHED @0.14: pull-out W -> S (camAt); the three WV dots fade during the zoom (Elkins would sit under the card) */
  tl.to([P + "pkb", P + "ckb", P + "elk"], { autoAlpha: 0, duration: 0.8, ease: "power1.in" }, T_Z0);

  /* CHARLESTON @2.58: pin pops, pill in */
  tl.fromTo(P + "chs", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(1.7)" }, 2.58);
  tl.fromTo(P + "chspill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.58);
  /* VIRGINIA @3.30: Huntington pin + pill (on screen only) */
  tl.fromTo(P + "hun", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(1.7)" }, 3.30);
  tl.fromTo(P + "hunpill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.30);
  /* 25 @4.18: Charleston value pulse */
  tl.to(P + "chsval", { scale: 1.08, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1 }, 4.18);
  /* KENTUCKY @6.48: KY-WV line glows 0.6 s */
  tl.fromTo(P + "kyline", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out", yoyo: true, repeat: 1 }, 6.48);
  /* source swap before the Kentucky figures: old out 8.40-8.60, new in 8.62-8.92 (never both visible) */
  tl.to(P + "src0", { autoAlpha: 0, duration: 0.2, ease: "power1.in" }, 8.40);
  tl.fromTo(P + "src1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power1.out" }, 8.62);
  /* PAINTSVILLE @8.94 */
  tl.fromTo(P + "pai", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(1.7)" }, 8.94);
  tl.fromTo(P + "paipill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.94);
  /* HAZARD @9.60 */
  tl.fromTo(P + "haz", { autoAlpha: 0, scale: 0, svgOrigin: "0 0", smoothOrigin: false }, { autoAlpha: 1, scale: 1, svgOrigin: "0 0", smoothOrigin: false, duration: 0.4, ease: "back.out(1.7)" }, 9.60);
  tl.fromTo(P + "hazpill", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.60);

  /* PARTS @12.86: counter card in, reading NOV 22 */
  tl.fromTo(P + "ctr", { autoAlpha: 0, x: 660 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, 12.86);
  /* OF @13.06: days run NOV 22 -> NOV 30 with the fill, landing 14.08 with the chip (floor: never past 30, 30 only at the end) */
  const dateEl = $("date"), ctr = { v: 0 };
  tl.to(ctr, { v: 8, duration: 1.02, ease: "power2.out", onUpdate: function () {
    dateEl.textContent = "NOV " + (22 + Math.min(8, Math.max(0, Math.floor(ctr.v + 1e-6))));
  } }, 13.06);
  tl.fromTo(P + "fill", { scaleX: 0 }, { scaleX: 1, duration: 1.02, ease: "power2.out" }, 13.06);
  /* SNOW @13.68: chip in, lands 14.08 (1.66 s readable before the cut at 15.74) */
  tl.fromTo(P + "chip", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.68);
  /* WEEK @15.18: voice lands on the settled card; drift ends 15.34; hold, hard cut at 15.74 */

  window.__timelines["g-a2-9-south"] = tl;
})();
</script>
</template>
