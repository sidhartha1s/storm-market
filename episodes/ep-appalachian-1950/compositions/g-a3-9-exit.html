  g-a3-9-exit · A3-S7 (host starts A3-S7 + 14.60, 4.70 s) · ep-appalachian-1950 · STANDARD (Sonnet) · brief: briefs/a3/g-a3-9-exit.md
  Claim: the storm finally weakened and slid off into Canada on 29 and 30 Nov; one track joins the wind side (Newark),
  the snow side (Pittsburgh) and warm Buffalo. Exit direction is SCHEMATIC (NWS Jackson gives no heading).
  PROJECTION: X = 3841 * (lon + 97.576), Y = -5585 * (lat - 46.6213). Frame A2-X: s 0.03, top-left (42191.8, 15852.5);
    screen = (map - TL) * 0.03 = matrix(0.03 0 0 0.03 -1265.754 -475.575) on #a3x-maps.
    Newark (1431,511) Pittsburgh (760,560) Buffalo (889,150) Lake Erie centre (621,265): same values as the hook, g-intro-2-hookmap.
  BASEMAP: Natural Earth 50m admin-1 (public domain). Every vertex below is copied verbatim from the US path (#ih2-us) and the
    Canada path (#ih2-ca) of g-intro-2-hookmap.html, which holds the library/inhouse/master-map-us-canada.html data. Whole
    subpaths: OH PA NY NJ DE MD VA WV KY IN VT NH MA CT RI, Long Island, Staten Island, small islands. Cut to the in-frame run and
    closed with off-frame corners (never on screen, as g-a1-5-ct): Michigan lower peninsula (closing edge at map y ~15500),
    Maine (closing corners x 107000, y 7413), Ontario (closing corners y 5000). Painted as in the hook: coast under-stroke
    (3.2 px #4a5560) under the fills, state lines #2a3644 1.2 px on top (both stroke widths in map units, / 0.03).
  DEVIATIONS from the brief:
    - Track runs up x 1080 (brief: x 900): at x 900 it would cross the PITTSBURGH label (x 802-977, y 550-569). It then passes
      east of and above Pittsburgh (closest approach 50 px) and swings left to (700,520), up to the loop at Lake Erie.
    - Chip top 56 (brief 70): at 70 its bottom edge (y ~132) touches the Buffalo ring top (y ~131).
    - Chip has NO exit tween: it lands at 3.22 and the host ends at 4.70, so an exit in the last 0.5 s would leave it
      readable 0.58 s; the map and chip hold to the host end and g-a3-10 opens on this frame.
    - Type tiers: chip 40, labels 26, source 19 = two px tiers by the gate's thresholds (big >= 52 absent): root declares
      data-type-ok. A 52 px chip would run to x ~1416 (brief: right edge <= 1300).
    - Exit line is one straight line (637.5,239.9) to (1125,-500): passes (760,54), and its head crosses the frame top at 2.48.
