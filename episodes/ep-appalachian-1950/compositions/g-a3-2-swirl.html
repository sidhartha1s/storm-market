<script>
window.__timelines = window.__timelines || {};
(function () {
  var P = "#a3w-", END = 16.96, SPEED = 80, HEAD = 24, DASH = 70;
  var $ = function (id) { return document.getElementById("a3w-" + id); };
  var tl = gsap.timeline({ paused: true });

  // point and tangent angle at a length along a path; angles unwrapped so a rider never spins
  function tracer(path) {
    var L = path.getTotalLength(), lastR = null;
    return { path: path, L: L, at: function (len) {
      var p = path.getPointAtLength(len);
      var a = path.getPointAtLength(Math.max(0, len - 1)), b = path.getPointAtLength(Math.min(L, len + 1));
      var r = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      if (lastR !== null) { while (r - lastR > 180) r -= 360; while (r - lastR < -180) r += 360; }
      lastR = r;
      return { x: p.x, y: p.y, r: r };
    } };
  }
  // a head follows the reveal in n linear legs sampled on the same ease as the mask
  function ride(tr, head, l0, l1, start, dur, ease, n) {
    var e = gsap.parseEase(ease);
    for (var k = 1; k <= n; k++) {
      var h = tr.at(l0 + (l1 - l0) * e(k / n));
      tl.to(head, { x: h.x, y: h.y, rotation: h.r, duration: dur / n, ease: "none" }, start + dur * (k - 1) / n);
    }
  }
  // one air arrow: mask draws the shaft (stopping TIP px short of the tip), head rides, dashes run to the host end
  var arrows = [];
  function arrow(name, start, dur) {
    var path = $(name), mask = $(name + "-m"), head = $(name + "-h");
    var tr = tracer(path), ML = Math.ceil(tr.L) + 1, p = tr.at(TIP);
    tl.set(mask, { strokeDasharray: ML + " " + ML, strokeDashoffset: ML }, 0);
    tl.set(head, { x: p.x, y: p.y, rotation: p.r, transformOrigin: "100% 50%" }, 0);
    tl.set([path, head], { autoAlpha: 0.9 }, start);
    tl.to(mask, { strokeDashoffset: ML - (tr.L - TIP), duration: dur, ease: "power2.out" }, start);
    ride(tr, head, TIP, tr.L, start, dur, "power2.out", 24);
    tl.fromTo(path, { strokeDashoffset: 0 }, { strokeDashoffset: -SPEED * (END - start), duration: END - start, ease: "none" }, start);
    arrows.push({ name: name, tr: tr, mask: mask, head: head, ML: ML, start: start, dur: dur });
  }

  /* NOW @0.00: g-a3-1's last frame; scan line continues from y 968.4 (g-a3-1: 60 px/s over its 16.14 s host) */
  var trk = tracer($("track")), TL = Math.ceil(trk.L) + 1, h = trk.at(trk.L);
  tl.set(P + "head", { x: h.x, y: h.y, rotation: h.r, transformOrigin: "100% 50%" }, 0);
  tl.set(P + "hl", { strokeDasharray: "140 " + (TL + 140) }, 0);
  var RL = Math.ceil($("ringpath").getTotalLength()) + 1;
  tl.set(P + "ringpath", { strokeDasharray: RL + " " + RL, strokeDashoffset: RL }, 0);
  tl.fromTo(P + "scan", { y: 968.4 }, { y: 1080, duration: 1.86, ease: "none" }, 0);
  tl.fromTo(P + "scan", { y: 0 }, { y: 905.9, duration: END - 1.86, ease: "none", immediateRender: false }, 1.86);

  /* LINE @0.82: one bright pass along the red track, Carolinas pin to the Ohio end */
  tl.set(P + "hl", { autoAlpha: 1 }, 0.82);
  tl.fromTo(P + "hl", { strokeDashoffset: 140 }, { strokeDashoffset: -TL, duration: 0.8, ease: "power1.inOut" }, 0.82);
  tl.set(P + "hl", { autoAlpha: 0 }, 1.62);

  /* AIR @1.76: halo breathes in round the printed low */
  tl.fromTo(P + "halo", { attr: { r: 100 }, autoAlpha: 0 }, { attr: { r: 160 }, autoAlpha: 1, duration: 1.2, ease: "power2.out" }, 1.76);

  /* COUNTERCLOCKWISE @3.70: headline in, g-a3-1's usual-path chip out, ring draws on and turns CCW to the host end */
  tl.fromTo(P + "headline", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 3.7);
  tl.fromTo(P + "usualchip", { x: 0, autoAlpha: 0.3 }, { x: 16, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 3.7);
  tl.set(P + "ring", { autoAlpha: 1 }, 3.7);
  tl.to(P + "ringpath", { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, 3.7);
  tl.fromTo(P + "ringheads", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, 4.3);
  tl.fromTo(P + "ring", { rotation: 0, svgOrigin: "1284 576", smoothOrigin: false },
    { rotation: -360 * (END - 3.7) / 8, svgOrigin: "1284 576", smoothOrigin: false, duration: END - 3.7, ease: "none" }, 3.7); // -360 per 8 s

  /* A LOW @4.88 (Whisper "below."): halo pulses once */
  tl.to(P + "halo", { attr: { r: 185 }, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.88);

  /* EAST @6.24: W1 */
  arrow("w1", 6.24, 1.0);

  /* WARM @8.14: W2 + warm chip */
  arrow("w2", 8.14, 1.0);
  tl.fromTo(P + "warmchip", { scale: 0.9, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.4)" }, 8.14);

  /* ATLANTIC @9.82: W3 comes ashore at Newark */
  arrow("w3", 9.82, 1.0);

  /* NORTHWEST @11.20: warm arrowheads pulse once about their tips */
  tl.to([P + "w1-h", P + "w2-h", P + "w3-h"], { scale: 1.25, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 11.2);

  /* INLAND @12.70: headline exits early so it is gone before C1 starts under it at 13.20 */
  tl.to(P + "headline", { x: -60, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 12.7);

  /* WEST @13.20: C1, warm chip dims */
  arrow("c1", 13.2, 1.0);
  tl.to(P + "warmchip", { autoAlpha: 0.35, duration: 0.4 }, 13.2);

  /* ARCTIC @14.80: C2 + arctic chip */
  arrow("c2", 14.8, 1.0);
  tl.fromTo(P + "coldchip", { scale: 0.9, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: 0.4, ease: "back.out(1.4)" }, 14.8);

  /* CANADA @16.32: C3 */
  arrow("c3", 16.32, 0.5);

  /* EXIT @16.70: both chips out in the last 0.26 s (arctic chip readable 15.20 to 16.70); g-a3-3 opens on chart + track + arrows + ring */
  tl.to([P + "warmchip", P + "coldchip"], { scale: 0.94, autoAlpha: 0, duration: 0.26, ease: "power2.in" }, 16.7);

  // self-check: each arrowhead sits TIP px ahead of its revealed shaft at three times in its draw
  arrows.forEach(function (a) {
    [a.start + a.dur * 0.3, a.start + a.dur * 0.7, a.start + a.dur].forEach(function (t) {
      tl.seek(t);
      var shown = a.ML - parseFloat(gsap.getProperty(a.mask, "strokeDashoffset"));
      var p = a.tr.path.getPointAtLength(Math.min(a.tr.L, shown + TIP));
      var dx = gsap.getProperty(a.head, "x") - p.x, dy = gsap.getProperty(a.head, "y") - p.y, d = Math.sqrt(dx * dx + dy * dy);
      if (d > 4) console.error("g-a3-2-swirl: " + a.name + " head off its shaft at " + t.toFixed(2) + " s by " + d.toFixed(1) + " px");
    });
  });
  tl.seek(0);

  window.__timelines["g-a3-2-swirl"] = tl;
})();
</script>
