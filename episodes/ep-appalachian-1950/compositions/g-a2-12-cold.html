<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const DUR = 12.36;

  /* ghost outlines: dashed pattern (10 on, 6 off) long enough to cover the path, then one gap of the path length,
     so dashoffset still draws the dashed outline up the tube. Returns the hidden offset. */
  const ghostSetup = (id) => {
    const p = document.getElementById(id);
    const L = Math.ceil(p.getTotalLength()) + 1;
    const k = Math.ceil((L + 60) / 16);
    const a = [];
    for (let i = 0; i < k; i++) { a.push(10, 6); }
    a[a.length - 1] = L;
    p.style.strokeDasharray = a.join(" ");
    return 16 * k - 6;
  };
  const GE = ghostSetup("c12-gh-e"), GC = ghostSetup("c12-gh-c"), GH = ghostSetup("c12-gh-h");

  tl.set(["#c12-eb", "#c12-hd", "#c12-grid", "#c12-tube-e", "#c12-tube-c", "#c12-tube-h",
          "#c12-nm-e", "#c12-nm-c", "#c12-nm-h", "#c12-brk", "#c12-brkl",
          "#c12-v-e", "#c12-v-c", "#c12-v-h", "#c12-n-e", "#c12-n-c", "#c12-n-h",
          "#c12-gh-e", "#c12-gh-c", "#c12-gh-h"], { autoAlpha: 0 }, 0);
  tl.set("#c12-gh-e", { strokeDashoffset: GE }, 0);
  tl.set("#c12-gh-c", { strokeDashoffset: GC }, 0);
  tl.set("#c12-gh-h", { strokeDashoffset: GH }, 0);
  tl.set("#c12-lq-e", { scaleY: 0, svgOrigin: "560 890", smoothOrigin: false }, 0);
  tl.set("#c12-lq-c", { scaleY: 0, svgOrigin: "900 890", smoothOrigin: false }, 0);
  tl.set("#c12-lq-h", { scaleY: 0, svgOrigin: "1240 890", smoothOrigin: false }, 0);
  tl.set("#c12-brk", { scaleY: 0, svgOrigin: "610 780", smoothOrigin: false }, 0);

  /* ambient, whole window: frost glints drift up-left and twinkle */
  tl.to(["#c12-gl1", "#c12-gl2", "#c12-gl3", "#c12-gl4", "#c12-gl5", "#c12-gl6", "#c12-gl7", "#c12-gl8", "#c12-gl9", "#c12-gl10", "#c12-gl11", "#c12-gl12"],
        { x: -60, y: -36, duration: DUR, ease: "none" }, 0);
  tl.to(["#c12-gl1", "#c12-gl4", "#c12-gl7", "#c12-gl10"], { opacity: 0.15, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
  tl.to(["#c12-gl2", "#c12-gl5", "#c12-gl8", "#c12-gl11"], { opacity: 0.15, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.4);
  tl.to(["#c12-gl3", "#c12-gl6", "#c12-gl9", "#c12-gl12"], { opacity: 0.15, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0.8);

  /* THE @0.00: ground, gridlines, three empty tubes, city names on */
  tl.fromTo("#c12-grid", { autoAlpha: 0, x: -60 }, { autoAlpha: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0);
  tl.fromTo(["#c12-tube-e", "#c12-tube-c", "#c12-tube-h"], { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 0);
  tl.fromTo(["#c12-n-e", "#c12-n-c", "#c12-n-h"], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 0.3);

  /* SATURDAY @2.66: eyebrow + headline in */
  tl.fromTo("#c12-eb", { autoAlpha: 0, x: -50 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.66);
  tl.fromTo("#c12-hd", { autoAlpha: 0, x: -50 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, 2.78);

  /* ELKINS @4.02: name brightens. 10 @5.40: liquid to 10F, label in */
  tl.to("#c12-n-e", { fill: "#f2f5f8", duration: 0.3 }, 4.02);
  tl.fromTo("#c12-lq-e", { scaleY: 0, svgOrigin: "560 890", smoothOrigin: false }, { scaleY: 1, svgOrigin: "560 890", smoothOrigin: false, duration: 0.6, ease: "power3.out" }, 5.4);
  tl.fromTo("#c12-v-e", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.4);

  /* CHARLESTON @6.88: name brightens. 12 @7.90: liquid to 12F, label in */
  tl.to("#c12-n-c", { fill: "#f2f5f8", duration: 0.3 }, 6.88);
  tl.fromTo("#c12-lq-c", { scaleY: 0, svgOrigin: "900 890", smoothOrigin: false }, { scaleY: 1, svgOrigin: "900 890", smoothOrigin: false, duration: 0.6, ease: "power3.out" }, 7.9);
  tl.fromTo("#c12-v-c", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.9);

  /* BOTH @8.74: Huntington liquid to 15F + label; the three ghost bars draw up, stagger 0.15 */
  tl.to("#c12-n-h", { fill: "#f2f5f8", duration: 0.3 }, 8.74);
  tl.fromTo("#c12-lq-h", { scaleY: 0, svgOrigin: "1240 890", smoothOrigin: false }, { scaleY: 1, svgOrigin: "1240 890", smoothOrigin: false, duration: 0.6, ease: "power3.out" }, 8.74);
  tl.fromTo("#c12-v-h", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 8.74);
  tl.set("#c12-gh-e", { autoAlpha: 1 }, 8.74);
  tl.set("#c12-gh-c", { autoAlpha: 1 }, 8.89);
  tl.set("#c12-gh-h", { autoAlpha: 1 }, 9.04);
  tl.to("#c12-gh-e", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 8.74);
  tl.to("#c12-gh-c", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 8.89);
  tl.to("#c12-gh-h", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 9.04);

  /* 40 @9.60: NORMAL labels in; Elkins bracket draws up, "ABOUT 40° COLDER" in */
  tl.fromTo(["#c12-nm-e", "#c12-nm-c", "#c12-nm-h"], { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.1 }, 9.6);
  tl.set("#c12-brk", { autoAlpha: 1 }, 9.6);
  tl.fromTo("#c12-brk", { scaleY: 0, svgOrigin: "610 780", smoothOrigin: false }, { scaleY: 1, svgOrigin: "610 780", smoothOrigin: false, duration: 0.5, ease: "power3.out" }, 9.6);
  tl.fromTo("#c12-brkl", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 9.9);

  /* 10.64 to exit: ghost dashes crawl 10 px/s, liquid tops quiver +-2 px */
  tl.fromTo(["#c12-gh-e", "#c12-gh-c", "#c12-gh-h"], { strokeDashoffset: 0 }, { strokeDashoffset: 17.2, duration: 1.72, ease: "none", immediateRender: false }, 10.64);
  tl.to(["#c12-q-e", "#c12-q-c", "#c12-q-h"], { y: -2, duration: 0.3, ease: "sine.inOut" }, 10.64);
  tl.to(["#c12-q-e", "#c12-q-c", "#c12-q-h"], { y: 2, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 10.94);

  /* exit: last 0.6 s, the card slides off left */
  tl.to("#c12-card", { x: -980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 11.76);

  window.__timelines["g-a2-12-cold"] = tl;
