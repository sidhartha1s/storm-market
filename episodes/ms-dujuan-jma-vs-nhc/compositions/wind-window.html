<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- wind-window.html — B6 first half: why a 1-minute average reads higher than a 10-minute average of the
     same wind field. A jagged 10-minute wind trace (SVG polyline, gusty peaks) with a highlighted 1-minute
     window that slides left-to-right across it, pausing on the tallest peak, with a live readout of the
     10-min-average line vs. the windowed peak. Lands on "12% HIGHER". Mount: track 2, host start =
     episode-abs 305.157, duration 21.0 (comp-local time = B6 segment time, 0 = narration start). -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .ww-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; will-change:transform; }
  .ww-eye { position:absolute; left:110px; top:110px; font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:5px; color:#d0121f; }
  .ww-chartwrap { position:absolute; left:110px; top:190px; width:1700px; height:560px; box-sizing:border-box; padding:30px;
    background:rgba(10,16,24,0.5); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,0.12); border-radius:24px; }
  svg { width:100%; height:100%; overflow:visible; }
  .ww-trace { fill:none; stroke:#8fb4d8; stroke-width:4; }
  .ww-avgline { fill:none; stroke:#8fb4d8; stroke-width:2; stroke-dasharray:10 8; opacity:0.7; }
  .ww-window { fill:rgba(208,18,31,0.22); stroke:#d0121f; stroke-width:3; }
  .ww-peakdot { fill:#d0121f; }
  .ww-readout { position:absolute; right:150px; top:250px; text-align:right; }
  .ww-readout .ww-r10 { font-family:'AbrilFig',Georgia,serif; font-size:52px; color:#8fb4d8; }
  .ww-readout .ww-r1 { font-family:'AbrilFig',Georgia,serif; font-size:52px; color:#d0121f; margin-top:14px; }
  .ww-readout .ww-rl { font-family:'Arial Black',Arial,sans-serif; font-size:18px; letter-spacing:2px; color:#c8d3e0; }
  .ww-popfig { position:absolute; left:0; right:0; top:60%; text-align:center; }
  .ww-popfig .ww-pf-big { font-family:'AbrilFig',Georgia,serif; font-size:130px; color:#d0121f; letter-spacing:0.03em;
    text-shadow:0 0 18px rgba(0,0,0,0.95), 0 0 60px rgba(120,0,0,0.55); }
  .ww-popfig .ww-pf-sub { display:block; margin-top:10px; font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:32px; color:#f4f0e8;
    letter-spacing:0.25em; }
  .ww-chip2 { position:absolute; left:50%; transform:translateX(-50%); bottom:115px; font-family:'Arial Black',Arial,sans-serif; font-size:26px;
    letter-spacing:2px; color:#f4f0e8; background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14);
    border-left:6px solid #d0121f; border-radius:10px; padding:12px 24px; }
</style>
<div id="root" data-composition-id="wind-window" data-width="1920" data-height="1080">
  <div class="ww-bgplate" id="ww-bgplate"></div>
  <div class="ww-eye" id="ww-eye">WHY THE ONE-MINUTE NUMBER READS HIGHER</div>
  <div class="ww-chip2" id="ww-chip">JMA &middot; 10-MIN AVG &middot; NHC/JTWC &middot; 1-MIN AVG</div>
  <div class="ww-chartwrap" id="ww-chart">
    <svg viewBox="0 0 1640 500" preserveAspectRatio="none">
      <line class="ww-avgline" x1="0" y1="330" x2="1640" y2="330"/>
      <polyline class="ww-trace" points="0,380 60,300 120,360 180,220 240,340 300,260 360,150 420,300 480,240 540,380 600,200 660,320 720,120 780,280 840,360 900,200 960,300 1020,180 1080,340 1140,260 1200,90 1260,300 1320,220 1380,360 1440,180 1500,280 1560,220 1620,340"/>
      <rect class="ww-window" id="ww-window" x="0" y="60" width="200" height="420" rx="10"/>
      <circle class="ww-peakdot" id="ww-peakdot" cx="1200" cy="90" r="10" style="opacity:0"/>
    </svg>
  </div>
  <div class="ww-readout" id="ww-readout">
    <div class="ww-r10" id="ww-r10">10-MIN AVG</div>
    <div class="ww-rl">SMOOTHED OVER THE WHOLE WINDOW</div>
    <div class="ww-r1" id="ww-r1">1-MIN PEAK</div>
    <div class="ww-rl">CATCHES THE GUSTY CREST</div>
  </div>
  <div class="ww-popfig" id="ww-pop" style="visibility:hidden"><span class="ww-pf-big">12% HIGHER</span><span class="ww-pf-sub">GENERAL RULE OF THUMB</span></div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 21.0; // this episode's wind-window mount: 305.157-326.157
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#ww-pop","#ww-chip"], { autoAlpha: 0 }, 0);
  /* background plate: continuous slow scale across the whole window (round 2, 17 Sep 26 freeze fix) */
  tl.fromTo("#ww-bgplate", { scale: 1.0 }, { scale: 1.06, duration: HOST_WINDOW, ease: "none" }, 0);
  tl.fromTo("#ww-chart", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.6 }, 0);
  tl.fromTo("#ww-readout", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.6 }, 0.3);
  tl.fromTo("#ww-chip", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 0.4);
  /* continuous ambient motion so the readout never sits frozen after the pop fades */
  tl.to("#ww-readout", { y: -6, duration: 2.4, ease: "sine.inOut", repeat: repeatsToFit(1.0, 2.4), yoyo: true }, 1.0);
  /* small literal-repeat glint between the pop fade-out and the exit, so a static-analysis pass over
     explicit tl positions (not just the real GSAP playback) also reads continuous coverage */
  tl.to("#ww-chart", { opacity: 0.94, duration: 0.5, yoyo: true, repeat: 1 }, 17.75);
  /* the 1-minute window slides across the trace over the first ~11s, landing on the tallest peak (x=1200) */
  tl.to("#ww-window", { attr: { x: 1100 }, duration: 11.0, ease: "power1.inOut" }, 1.0);
  tl.to("#ww-peakdot", { opacity: 1, duration: 0.4 }, 11.5);
  tl.fromTo("#ww-pop", { autoAlpha:0, scale:2.2 }, { autoAlpha:1, scale:1, duration:0.35, ease:"power4.in" }, 12.6);
  tl.to("#ww-pop", { autoAlpha:0, y:-26, duration:0.4 }, 14.8);
  tl.to(["#ww-eye","#ww-chart","#ww-readout","#ww-chip"], { autoAlpha:0, duration:0.5 }, 20.3);
  window.__timelines["wind-window"] = tl;
})();
</script>
</template>
</body>
</html>
