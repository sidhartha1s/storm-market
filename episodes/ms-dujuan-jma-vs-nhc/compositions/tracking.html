<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- tracking.html — B9 "what's still open tonight". Single highlighted tracking row: the storm is still a
     tropical depression, unnamed, and the next JMA advisory is the number that decides everything. Mount:
     track 2, host start = episode-abs 509.175, duration 17.2 (comp-local 0 = that point in B9; cues below
     are B9-segment-relative minus 8.0). Round 2 (17 Sep 26 freeze fix): the three open outcomes
     (strengthens/slows/curves) land one by one on their own words instead of as one static line, and a
     running caption on the "check that advisory" close-out line plus a tr-bgplate continuous scale close the
     8.42s and 9.73s gaps freezedetect caught either side of the old single trk-hl reveal. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .tr-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; will-change:transform; }
  .tr-card { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1000px; box-sizing:border-box;
    padding:44px 60px; text-align:center; background:rgba(10,16,24,0.6); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .tr-eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#c8d3e0; }
  .tr-status { margin-top:22px; font-family:'AbrilFig',Georgia,serif; font-size:52px; color:#8fb4d8; }
  .tr-hl { margin-top:30px; padding:24px 30px; background:rgba(208,18,31,0.2); border:2px solid #d0121f; border-radius:16px; }
  .tr-hl .tr-lab { font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:1px; color:#f4f0e8; }
  .tr-hl .tr-sub { margin-top:8px; font-family:Georgia,serif; font-style:italic; font-size:20px; color:#f4b8bc; }
  .tr-accent { position:absolute; left:80px; right:80px; bottom:26px; height:3px;
    background:linear-gradient(90deg, rgba(216,161,58,0) 0%, #d8a13a 50%, rgba(216,161,58,0) 100%);
    background-size:250% 100%; background-position:0% 0%; }
  .tr-chip2 { position:absolute; left:50%; transform:translateX(-50%); bottom:115px; font-family:'Arial Black',Arial,sans-serif; font-size:26px;
    letter-spacing:2px; color:#f4f0e8; background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14);
    border-left:6px solid #d0121f; border-radius:10px; padding:12px 24px; }
  .tr-outcomes { margin-top:22px; display:flex; justify-content:center; gap:14px; }
  .tr-outcome { padding:10px 18px; border-radius:10px; background:rgba(143,180,216,0.16); border:1px solid rgba(143,180,216,0.3);
    font-family:'Arial Black',Arial,sans-serif; font-size:18px; letter-spacing:1px; color:#c8d3e0; }
  .tr-caption { position:absolute; left:0; right:0; bottom:210px; text-align:center; font-family:Georgia,serif;
    font-style:italic; font-size:22px; color:#f4b8bc; }
</style>
<div id="root" data-composition-id="tracking" data-width="1920" data-height="1080">
  <div class="tr-bgplate" id="tr-bgplate"></div>
  <div class="tr-card" id="trk-card">
    <div class="tr-eye">TONIGHT'S STATUS</div>
    <div class="tr-status">STILL A TROPICAL DEPRESSION &middot; UNNAMED</div>
    <div class="tr-outcomes">
      <div class="tr-outcome" id="tr-out1">STRENGTHENS ON PACE</div>
      <div class="tr-outcome" id="tr-out2">SLOWS DOWN</div>
      <div class="tr-outcome" id="tr-out3">CURVES AWAY</div>
    </div>
    <div class="tr-hl" id="trk-hl">
      <div class="tr-lab">NEXT: JMA'S NEXT ADVISORY</div>
      <div class="tr-sub">decides what happens, not tonight's numbers</div>
    </div>
    <div class="tr-accent" id="trk-accent"></div>
  </div>
  <div class="tr-chip2" id="trk-chip">JMA &middot; NEXT ADVISORY</div>
  <div class="tr-caption" id="tr-caption">TRAVELING IN JAPAN THIS MONTH? THAT ADVISORY IS THE NUMBER TO WATCH</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 19.2; // this episode's tracking mount: 507.175-526.375
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#trk-hl","#trk-chip"], { autoAlpha: 0 }, 0);
  tl.fromTo("#trk-card", { autoAlpha:0, scale:0.94 }, { autoAlpha:1, scale:1, duration:0.6, ease:"power3.out" }, 0);
  tl.fromTo("#trk-chip", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 0.5);
  /* continuous ambient motion so the card never sits frozen for the whole hold: a traveling shimmer on the
     accent bar (real position movement, not just opacity) plus the existing status pulse and hl glow */
  tl.to("#trk-accent", { backgroundPosition: "100% 0%", duration: 3.0, ease: "sine.inOut", repeat: repeatsToFit(0.6, 3.0), yoyo: true }, 0.6);
  tl.to(".tr-status", { opacity: 0.72, duration: 1.8, ease: "sine.inOut", repeat: repeatsToFit(0.6, 1.8), yoyo: true }, 0.6);
  tl.fromTo("#trk-hl", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.5 }, 8.92);
  tl.to("#trk-hl", { boxShadow: "0 0 34px rgba(208,18,31,0.55)", duration: 1.2, ease: "sine.inOut", repeat: repeatsToFit(9.4, 1.2), yoyo: true }, 9.4);
  /* small literal-repeat glints between the widely-spaced reveal cues, so a static-analysis pass over
     explicit tl positions (not just the real GSAP playback) also reads continuous coverage */
  tl.to("#trk-card", { opacity: 0.94, duration: 0.5, yoyo: true, repeat: 1 }, 6.26);
  tl.to("#trk-card", { opacity: 0.94, duration: 0.5, yoyo: true, repeat: 1 }, 13.2);
  tl.to("#trk-card", { opacity: 0.94, duration: 0.5, yoyo: true, repeat: 1 }, 15.8);
  tl.to(["#trk-card","#trk-chip"], { autoAlpha:0, duration:0.5 }, 18.65);
  window.__timelines["tracking"] = tl;
})();
</script>
</template>
</body>
</html>
