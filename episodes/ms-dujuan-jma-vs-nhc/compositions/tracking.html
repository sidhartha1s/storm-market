<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- tracking.html — B9 "what's still open tonight". Single highlighted tracking row: the storm is still a
     tropical depression, unnamed, and the next JMA advisory is the number that decides everything. Mount:
     track 2, host start = episode-abs 509.175, duration 17.2 (comp-local 0 = that point in B9; cues below
     are B9-segment-relative minus 8.0). -->
<template>
<style>
  @font-face { font-family:'AbrilFig'; src:url('../fonts/AbrilFatface-Regular.ttf'); }
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; }
  .card { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:1000px; box-sizing:border-box;
    padding:44px 60px; text-align:center; background:rgba(10,16,24,0.6); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#c8d3e0; }
  .status { margin-top:22px; font-family:'AbrilFig',Georgia,serif; font-size:52px; color:#8fb4d8; }
  .hl { margin-top:30px; padding:24px 30px; background:rgba(208,18,31,0.2); border:2px solid #d0121f; border-radius:16px; }
  .hl .lab { font-family:'Arial Black',Arial,sans-serif; font-size:30px; letter-spacing:1px; color:#f4f0e8; }
  .hl .sub { margin-top:8px; font-family:Georgia,serif; font-style:italic; font-size:20px; color:#f4b8bc; }
</style>
<div id="root" data-composition-id="tracking" data-width="1920" data-height="1080">
  <div class="card" id="trk-card">
    <div class="eye">TONIGHT'S STATUS</div>
    <div class="status">STILL A TROPICAL DEPRESSION &middot; UNNAMED</div>
    <div class="hl" id="trk-hl">
      <div class="lab">NEXT: JMA'S NEXT ADVISORY</div>
      <div class="sub">strengthens on pace &middot; slows down &middot; curves away</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set("#trk-hl", { autoAlpha: 0 }, 0);
  tl.fromTo("#trk-card", { autoAlpha:0, scale:0.94 }, { autoAlpha:1, scale:1, duration:0.6, ease:"power3.out" }, 0);
  tl.fromTo("#trk-hl", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.5 }, 6.92);
  tl.to("#trk-card", { autoAlpha:0, duration:0.5 }, 16.4);
  window.__timelines["tracking"] = tl;
})();
</script>
</template>
