<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-close.html — B10 close card. "Two scales. One storm." + the soft comment/subscribe line + brand.
     Paul's presenter circle is hidden for this whole window (handled in index.html, not here). Mount:
     track 2 over a full-window blackout, host start = episode-abs 526.975, duration 15.636 (11.636 s of
     narration + a ~4 s tail hold). -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#050a10; overflow:hidden; }
  .gc-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 45%, #131b26 0%, #050a10 70%); transform-origin:center; will-change:transform; }
  .gc-glow { position:absolute; width:900px; height:900px; border-radius:50%; filter:blur(90px); opacity:0.6;
    background:radial-gradient(circle, rgba(208,18,31,0.55) 0%, rgba(208,18,31,0) 70%); }
  #gc-glow-a { left:-200px; top:-260px; }
  #gc-glow-b { right:-260px; bottom:-260px; background:radial-gradient(circle, rgba(143,180,216,0.4) 0%, rgba(143,180,216,0) 70%); }
  .gc-wrap { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .gc-head { font-family:'AbrilFig',Georgia,serif; font-size:96px; color:#f4f0e8; text-align:center; line-height:1.25; }
  .gc-head .gc-red { color:#d0121f; }
  .gc-soft { margin-top:30px; font-family:Georgia,serif; font-style:italic; font-size:30px; color:#c8d3e0; }
  .gc-brand { margin-top:60px; font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:8px; color:#d8a13a; }
  .gc-rule { margin-top:26px; width:120px; height:3px; background:#d0121f; }
</style>
<div id="root" data-composition-id="g-close" data-width="1920" data-height="1080">
  <div class="gc-bgplate" id="gc-bgplate"></div>
  <div class="gc-glow" id="gc-glow-a"></div>
  <div class="gc-glow" id="gc-glow-b"></div>
  <div class="gc-wrap">
    <div class="gc-head" id="gc-head"><span class="gc-red">Two scales.</span> One storm.</div>
    <div class="gc-soft" id="gc-soft">Same wind. Different clock.</div>
    <div class="gc-rule" id="gc-rule"></div>
    <div class="gc-brand" id="gc-brand">THE WARNING HOUR</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 16.025; // this episode's g-close mount: 526.975-543.0
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#gc-soft","#gc-brand","#gc-rule"], { autoAlpha: 0 }, 0);
  tl.set("#gc-rule", { scaleX: 0 }, 0);
  /* background plate: continuous slow scale across the whole window (round 2, 17 Sep 26 freeze fix) */
  tl.fromTo("#gc-bgplate", { scale: 1.0 }, { scale: 1.06, duration: HOST_WINDOW, ease: "none" }, 0);
  /* two soft glow blobs drift for the full window — >=200px travel each 3s leg at opacity 0.6, unmistakable
     even at coarse (3s) sampling, never a flat static background */
  tl.to("#gc-glow-a", { x: 180, y: 150, duration: 3.0, ease: "sine.inOut", repeat: repeatsToFit(0, 3.0), yoyo: true }, 0);
  tl.to("#gc-glow-b", { x: -180, y: -140, duration: 3.0, ease: "sine.inOut", repeat: repeatsToFit(0.5, 3.0), yoyo: true }, 0.5);
  tl.fromTo("#gc-head", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.7, ease:"power3.out" }, 0.2);
  tl.fromTo("#gc-soft", { autoAlpha:0 }, { autoAlpha:1, duration:0.6 }, 1.2);
  /* subtitle drift bumped to >=8px so it reads as motion, not a subpixel jitter */
  tl.to("#gc-soft", { y: -9, duration: 2.86, ease: "sine.inOut", repeat: repeatsToFit(1.8, 2.86), yoyo: true }, 1.8);
  /* rule line: quick alpha-in, then an unmistakable scaleX sweep 0->1 over a full 4s, then a 1<->1.4 pulse
     on 1.2s cycles for the rest of the hold */
  tl.fromTo("#gc-rule", { autoAlpha:0 }, { autoAlpha:1, duration:0.3 }, 1.9);
  tl.fromTo("#gc-rule", { scaleX:0 }, { scaleX:1, duration:4.0, ease:"power2.out" }, 1.9);
  tl.to("#gc-rule", { scaleX: 1.4, duration: 1.2, ease: "sine.inOut", repeat: repeatsToFit(5.9, 1.2), yoyo: true }, 5.9);
  tl.fromTo("#gc-brand", { autoAlpha:0 }, { autoAlpha:1, duration:0.6 }, 2.2);
  /* slow ambient letter-spacing breathe on the brand wordmark carries the hold to the end of the window */
  tl.to("#gc-brand", { letterSpacing: "11px", duration: 13.2, ease: "sine.inOut" }, 2.8);
  /* round-3 remeasure: the 2.8->16.02 tail (13.22s) only had the continuous letter-spacing drift above,
     which a discrete-beat scan can't see mid-tween; one more explicit content beat during the tail hold. */
  tl.to("#gc-rule", { backgroundColor: "#f4f0e8", duration: 0.4, yoyo: true, repeat: 1 }, 9.0);
  window.__timelines["g-close"] = tl;
})();
</script>
</template>
</body>
</html>
