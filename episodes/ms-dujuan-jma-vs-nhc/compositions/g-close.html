<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-close.html — B10 close card. "Two scales. One storm." + the soft comment/subscribe line + brand.
     Paul's presenter circle is hidden for this whole window (handled in index.html, not here). Mount:
     track 2 over a full-window blackout, host start = episode-abs 526.975, duration 15.636 (11.636 s of
     narration + a ~4 s tail hold). -->
<template>
<style>
  @font-face { font-family:'AbrilFig'; src:url('../fonts/AbrilFatface-Regular.ttf'); }
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 50% 45%, #131b26 0%, #050a10 70%); overflow:hidden; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; filter:blur(90px); opacity:0.48;
    background:radial-gradient(circle, rgba(208,18,31,0.55) 0%, rgba(208,18,31,0) 70%); }
  #gc-glow-a { left:-200px; top:-260px; }
  #gc-glow-b { right:-260px; bottom:-260px; background:radial-gradient(circle, rgba(143,180,216,0.4) 0%, rgba(143,180,216,0) 70%); }
  .wrap { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .head { font-family:'AbrilFig',Georgia,serif; font-size:96px; color:#f4f0e8; text-align:center; line-height:1.25; }
  .head .red { color:#d0121f; }
  .soft { margin-top:30px; font-family:Georgia,serif; font-style:italic; font-size:30px; color:#c8d3e0; }
  .brand { margin-top:60px; font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:8px; color:#d8a13a; }
  .rule { margin-top:26px; width:120px; height:3px; background:#d0121f; }
</style>
<div id="root" data-composition-id="g-close" data-width="1920" data-height="1080">
  <div class="glow" id="gc-glow-a"></div>
  <div class="glow" id="gc-glow-b"></div>
  <div class="wrap">
    <div class="head" id="gc-head"><span class="red">Two scales.</span> One storm.</div>
    <div class="soft" id="gc-soft">Same wind. Different clock.</div>
    <div class="rule" id="gc-rule"></div>
    <div class="brand" id="gc-brand">THE WARNING HOUR</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#gc-soft","#gc-brand","#gc-rule"], { autoAlpha: 0 }, 0);
  tl.set("#gc-rule", { scaleX: 0 }, 0);
  /* two soft glow blobs drift slowly for the full window — never a flat static background */
  tl.to("#gc-glow-a", { x: 140, y: 90, duration: 8.0, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
  tl.to("#gc-glow-b", { x: -120, y: -80, duration: 9.5, ease: "sine.inOut", repeat: 1, yoyo: true }, 0.5);
  tl.fromTo("#gc-head", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.7, ease:"power3.out" }, 0.2);
  tl.fromTo("#gc-soft", { autoAlpha:0 }, { autoAlpha:1, duration:0.6 }, 1.2);
  tl.to("#gc-soft", { y: -5, duration: 3.0, ease: "sine.inOut", repeat: 4, yoyo: true }, 1.8);
  tl.fromTo("#gc-rule", { autoAlpha:0, scaleX:0 }, { autoAlpha:1, scaleX:1, duration:0.5, ease:"power2.out" }, 1.9);
  tl.fromTo("#gc-brand", { autoAlpha:0 }, { autoAlpha:1, duration:0.6 }, 2.2);
  /* slow ambient letter-spacing breathe on the brand wordmark carries the hold to the end of the window */
  tl.to("#gc-brand", { letterSpacing: "11px", duration: 12.8, ease: "sine.inOut" }, 2.8);
  window.__timelines["g-close"] = tl;
})();
</script>
</template>
</body>
</html>
