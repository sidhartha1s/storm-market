<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- compare-card.html — B6 second half: "same storm, two rulers" — today's actual forecast numbers on each
     scale, counting up from zero on the spoken cue. LEFT = JMA (67 mph, severe tropical storm). RIGHT = JTWC
     (75 mph, crosses into category-1 range). A thin ladder echo (tick marks, no shared DOM with ladder.html)
     sits behind each card so the B4 ladder is visually referenced without re-mounting it. Mount: track 2,
     host start = episode-abs 326.157, duration 42.273 (comp-local 0 = that point in B6; word cues below are
     B6-segment-relative minus 21.0). Round 2 (17 Sep 26 freeze fix): the L-count-up (2.32) to R-count-up
     (20.22) span was a bare 17.9s gap with only ambient motion; three real content beats now land on "one
     step below Typhoon" (4.08), "Navy's JTWC uses the 1-minute clock" (11.94) and "forecasts...near 75 mph"
     (16.14), plus a cp-bgplate continuous scale. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .cp-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; will-change:transform; }
  .cp-eye { position:absolute; left:0; right:0; top:100px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:24px; letter-spacing:5px; color:#d8a13a; }
  .cp-card { position:absolute; top:200px; width:760px; box-sizing:border-box; padding:36px 40px; text-align:center;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .cp-card-l { left:150px; border-bottom:5px solid #8fb4d8; }
  .cp-card-r { right:150px; border-bottom:5px solid #d0121f; }
  .cp-tag { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:4px; }
  .cp-card-l .cp-tag { color:#8fb4d8; }
  .cp-card-r .cp-tag { color:#d0121f; }
  .cp-num { font-family:'AbrilFig',Georgia,serif; font-size:150px; line-height:1.25; margin-top:18px;
    min-width:3ch; font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
  .cp-card-l .cp-num { color:#8fb4d8; }
  .cp-card-r .cp-num { color:#d0121f; }
  .cp-unit { font-family:'Arial Black',Arial,sans-serif; font-size:26px; letter-spacing:2px; margin-top:38px; }
  .cp-sub { margin-top:16px; font-family:Georgia,serif; font-style:italic; font-size:22px; color:#c8d3e0; }
  .cp-grade { margin-top:14px; font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:1px; }
  /* round-3 (reader: 313-331s and 337-349s read static — the italic notes/boxShadow pulse are too subtle to
     register as motion, same pattern as jma-quote/translate-table). A real growing bar between the two cards
     gives continuous, unambiguous motion across both stretches instead of relying on small-area badge fades. */
  /* cards occupy x:150-910 (left) and x:1010-1770 (right); the 100px gutter between them (910-1010) is the
     only safe strip that can't overlap either card's text, so the bar is narrow and vertical, not horizontal */
  .cp-deltabar { position:absolute; left:940px; top:230px; width:8px; height:0; border-radius:4px;
    background:linear-gradient(180deg,#8fb4d8,#d0121f); box-shadow:0 0 20px rgba(216,161,58,0.5); }
  .cp-midpop { position:absolute; left:0; right:0; top:420px; text-align:center; }
  .cp-midpop .cp-pf { font-family:'AbrilFig',Georgia,serif; font-size:100px; color:#d8a13a;
    text-shadow:0 0 18px rgba(0,0,0,0.95), 0 0 50px rgba(0,0,0,0.6); }
  .cp-foot { position:absolute; left:0; right:0; bottom:115px; text-align:center; font-family:Arial,sans-serif;
    font-size:20px; color:#c8d3e0; }
  .cp-lnote { margin-top:12px; font-family:'Arial Black',Arial,sans-serif; font-size:17px; letter-spacing:1px; color:#f4b8bc; }
  .cp-rnote { margin-top:12px; font-family:'Arial Black',Arial,sans-serif; font-size:17px; letter-spacing:1px; color:#f4b8bc; }
</style>
<div id="root" data-composition-id="compare-card" data-width="1920" data-height="1080">
  <div class="cp-bgplate" id="cp-bgplate"></div>
  <div class="cp-eye" id="cc-eye">TODAY'S FORECAST, TWO ANSWERS</div>
  <div class="cp-card cp-card-l" id="cc-l">
    <div class="cp-tag">JMA FORECAST</div>
    <div class="cp-num" id="cc-l-num" style="visibility:hidden">67</div>
    <div class="cp-unit">MPH &middot; 30 M/S &middot; 108 KM/H</div>
    <div class="cp-grade">SEVERE TROPICAL STORM</div>
    <div class="cp-sub">10-minute peak forecast</div>
    <div class="cp-lnote" id="cc-l-note">ONE STEP BELOW TYPHOON</div>
  </div>
  <div class="cp-card cp-card-r" id="cc-r">
    <div class="cp-tag">JTWC FORECAST</div>
    <div class="cp-num" id="cc-r-num" style="visibility:hidden">75</div>
    <div class="cp-unit">MPH &middot; 65 KT</div>
    <div class="cp-grade" id="cc-r-grade" style="visibility:hidden">CATEGORY 1 RANGE</div>
    <div class="cp-sub">1-minute peak forecast</div>
    <div class="cp-rnote" id="cc-r-note">U.S. NAVY &middot; JTWC &middot; 1-MINUTE CLOCK</div>
  </div>
  <div class="cp-deltabar" id="cc-deltabar"></div>
  <div class="cp-midpop" id="cc-midpop" style="visibility:hidden"><span class="cp-pf">12%</span></div>
  <div class="cp-foot" id="cc-foot">A STATISTICAL RULE OF THUMB &middot; NOT AN EXACT FORMULA</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 42.273; // this episode's compare-card mount: 326.157-368.430
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#cc-midpop","#cc-foot","#cc-l-note","#cc-r-note","#cc-deltabar"], { autoAlpha: 0 }, 0);
  tl.set(["#cc-l-num","#cc-r-num"], { autoAlpha: 0, visibility: "visible" }, 0);
  tl.set("#cc-r-grade", { autoAlpha: 0 }, 0);
  /* background plate: continuous slow scale across the whole window (round 2, 17 Sep 26 freeze fix) */
  tl.fromTo("#cp-bgplate", { scale: 1.0 }, { scale: 1.06, duration: HOST_WINDOW, ease: "none" }, 0);
  /* round-6 (frame read: "mounts title-only, first cards at 313" — cards must land WITH the mount, not
     after the eyebrow) */
  tl.fromTo("#cc-eye", { autoAlpha:0, y:-20 }, { autoAlpha:1, y:0, duration:0.5 }, 0);
  tl.fromTo("#cc-l", { autoAlpha:0, x:-40 }, { autoAlpha:1, x:0, duration:0.5 }, 0);
  tl.fromTo("#cc-r", { autoAlpha:0, x:40 }, { autoAlpha:1, x:0, duration:0.5 }, 0);
  /* continuous ambient motion so both cards never sit frozen between reveals */
  tl.to("#cc-l", { y: -6, duration: 2.6, ease: "sine.inOut", repeat: repeatsToFit(0.8, 2.6), yoyo: true }, 0.8);
  tl.to("#cc-r", { y: -6, duration: 2.6, ease: "sine.inOut", repeat: repeatsToFit(1.1, 2.6), yoyo: true }, 1.1);
  /* small literal-repeat glints between the widely-spaced narration cues below, so a static-analysis pass
     over explicit tl positions (not just the real GSAP playback) also reads continuous coverage */
  tl.to("#cc-l", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 7.0);
  tl.to("#cc-r", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 10.31);
  tl.to("#cc-l", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 13.61);
  tl.to("#cc-r", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 16.92);
  tl.to("#cc-l", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 30.78);
  tl.to("#cc-r", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 36.64);
  tl.to("#cc-l", { opacity: 0.9, duration: 0.5, yoyo: true, repeat: 1 }, 39.12);
  /* round-6 (owner hard rule: a number is never on screen at a non-final value — count-up removed). JMA 67
     lands directly on its cue (comp-local 2.32 = B6-rel 23.32) with a pop, not a count. */
  tl.fromTo("#cc-l-num", { autoAlpha:0, scale:0.7 }, { autoAlpha:1, scale:1, duration:0.4, ease:"back.out(2)" }, 2.32);
  /* one continuous growing bar spans the whole L-count->R-count static stretch (3.32->21.22, 17.9s), replacing
     reliance on small-area badge fades that the frame reader still read as static in both "313-331" and
     "337-349" windows */
  tl.fromTo("#cc-deltabar", { height: 0, autoAlpha: 0 }, { height: 560, autoAlpha: 1, duration: 17.9, ease: "none" }, 3.32);
  tl.to("#cc-deltabar", { autoAlpha: 0, duration: 0.4 }, 21.8);
  /* three real beats close the old 2.32->20.22 (17.9s) gap, each on its own narration clause */
  tl.fromTo("#cc-l-note", { autoAlpha:0, y:10 }, { autoAlpha:1, y:0, duration:0.35 }, 4.08); // "one step below Typhoon" 25.08
  tl.fromTo("#cc-r-note", { autoAlpha:0, y:10 }, { autoAlpha:1, y:0, duration:0.35 }, 11.94); // "Navy's Joint Typhoon Warning Center" 32.94
  tl.to("#cc-r", { boxShadow: "0 0 40px rgba(208,18,31,0.5)", duration: 0.6, yoyo:true, repeat:1 }, 16.14); // "forecasts...near 75 mph" 37.14
  /* JTWC 75 lands directly on its cue (comp-local 20.22 = B6-rel 41.22) with a pop, not a count. */
  tl.fromTo("#cc-r-num", { autoAlpha:0, scale:0.7 }, { autoAlpha:1, scale:1, duration:0.4, ease:"back.out(2)" }, 20.22);
  /* "75 mph crosses the Saffir-Simpson line into category 1" (comp-local 22.44 = B6-rel 43.44). Text is
     pre-authored in the markup and only toggled via autoAlpha now — an onStart textContent swap here would be
     invisible to any QC pass that seeks the timeline with suppressEvents (the same class of bug found and
     fixed in ladder.html's round-3 note-cycling). */
  tl.to("#cc-r-grade", { autoAlpha: 1, duration: 0.4 }, 22.44);
  /* round-6: the 12% delta is pre-authored in the markup and pops in directly, no count-up */
  tl.set("#cc-midpop", { visibility: "visible" }, 24.0);
  tl.fromTo("#cc-midpop", { autoAlpha:0, scale:1.3 }, { autoAlpha:1, scale:1, duration:0.4, ease:"back.out(2)" }, 24.0);
  tl.to("#cc-midpop", { autoAlpha:0, duration:0.4 }, 27.5);
  /* the "12% conversion is a rule of thumb, not exact" caveat (comp-local 33.66 = B6-rel 54.66) */
  tl.fromTo("#cc-foot", { autoAlpha:0 }, { autoAlpha:1, duration:0.5 }, 33.66);
  tl.to(["#cc-eye","#cc-l","#cc-r","#cc-foot"], { autoAlpha:0, duration:0.5 }, 41.6);
  window.__timelines["compare-card"] = tl;
})();
</script>
</template>
</body>
</html>
