<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- translate-table.html — B7 "same animal, different name". Top: three-basin naming chip row (Pacific =
     typhoon, Atlantic = hurricane, Indian Ocean = cyclone), reveal on cue. Bottom: JMA-grade-to-US-read
     translation table (Strong -> Cat 1 start, Very Strong -> near Cat 2 top, Violent -> into Cat 3), reveal
     on cue. Mount: track 2, host start = episode-abs 359.491, duration 63.127 (comp-local 0 = that point in
     B7; cues below are B7-segment-relative minus 6.0, the real lead-in from nx-b7s1's 353.491 start to this
     comp's mount — this comment previously said 377.030/8.0, stale from before the CTA-move retiming; the
     actual tl cue numbers below were already computed against the correct 6.0 offset). Round 2 (17 Sep 26 freeze fix): each row's grade name
     and its US translation now land as two separate word-synced beats with a moving highlight sweep between
     them, plus a closing caption on the B7-S1 close-out line and a tt-bgplate continuous scale. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .tt-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; will-change:transform; }
  /* round-3 (draft 2 freezedetect still flags 0-7.2s and 8.4-16.6s local as holds): the blurred glow drift
     is too low-contrast for freezedetect's frame-diff floor. A solid full-width scan line gives real
     per-frame pixel delta across the whole window, independent of how sparse the basin/table reveals are. */
  .tt-sweep { position:absolute; left:0; right:0; top:-6px; height:4px; background:rgba(216,161,58,0.4);
    box-shadow:0 0 24px 6px rgba(216,161,58,0.3); }
  .tt-glow { position:absolute; width:760px; height:760px; border-radius:50%; filter:blur(110px); opacity:0.3; pointer-events:none; }
  #tt-glow-a { left:-180px; top:-200px; background:radial-gradient(circle, rgba(208,18,31,0.5) 0%, rgba(208,18,31,0) 70%); }
  #tt-glow-b { right:-220px; bottom:-220px; background:radial-gradient(circle, rgba(143,180,216,0.4) 0%, rgba(143,180,216,0) 70%); }
  .tt-eye { position:absolute; left:0; right:0; top:70px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:22px; letter-spacing:5px; color:#d8a13a; }
  .tt-basinrow { position:absolute; left:0; right:0; top:130px; display:flex; justify-content:center; gap:28px; }
  .tt-bchip { padding:18px 34px; border-radius:14px; text-align:center; box-sizing:border-box;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.14); }
  .tt-bchip .tt-ocean { font-family:'Arial Black',Arial,sans-serif; font-size:20px; letter-spacing:2px; color:#c8d3e0; }
  .tt-bchip .tt-term { font-family:'AbrilFig',Georgia,serif; font-size:56px; color:#d0121f; margin-top:10px; line-height:1.2; }
  .tt-table { position:absolute; left:280px; right:280px; top:320px; box-sizing:border-box; padding:36px 50px;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; }
  .tt-thead { display:flex; justify-content:space-between; font-family:'Arial Black',Arial,sans-serif; font-size:20px;
    letter-spacing:3px; color:#d8a13a; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,0.16); }
  .tt-trow { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid rgba(255,255,255,0.1);
    background-image:linear-gradient(90deg, transparent 0%, rgba(216,161,58,0.35) 50%, transparent 100%);
    background-size:220% 100%; background-position:-120% 0; background-repeat:no-repeat; }
  .tt-trow:last-child { border-bottom:none; }
  .tt-trow .tt-jma { font-family:'Arial Black',Arial,sans-serif; font-size:28px; width:38%; }
  .tt-trow .tt-us { font-family:Georgia,serif; font-style:italic; font-size:24px; color:#f2f5f8; width:62%; }
  .tt-trow .tt-us .tt-arrow { color:#d0121f; font-style:normal; margin-right:8px; }
  .tt-caption { position:absolute; left:0; right:0; bottom:170px; text-align:center; font-family:'Arial Black',Arial,sans-serif;
    font-size:22px; letter-spacing:2px; color:#d8a13a; }
</style>
<div id="root" data-composition-id="translate-table" data-width="1920" data-height="1080">
  <div class="tt-bgplate" id="tt-bgplate"></div>
  <div class="tt-sweep" id="tt-sweep"></div>
  <div class="tt-eye" id="tt-eye">SAME STORM &middot; DIFFERENT NAME</div>
  <div class="tt-glow" id="tt-glow-a"></div>
  <div class="tt-glow" id="tt-glow-b"></div>
  <div class="tt-basinrow">
    <div class="tt-bchip" id="tt-b1"><div class="tt-ocean">WESTERN PACIFIC</div><div class="tt-term">TYPHOON</div></div>
    <div class="tt-bchip" id="tt-b2"><div class="tt-ocean">ATLANTIC &amp; E. PACIFIC</div><div class="tt-term">HURRICANE</div></div>
    <div class="tt-bchip" id="tt-b3"><div class="tt-ocean">INDIAN OCEAN</div><div class="tt-term">CYCLONE</div></div>
  </div>
  <div class="tt-table" id="tt-table">
    <div class="tt-thead"><span id="tt-thead-jp">JAPAN'S GRADE</span><span>&nbsp;</span><span>AMERICAN READ</span></div>
    <div class="tt-trow" id="tt-r1"><div class="tt-jma" id="tt-r1-jma">STRONG TYPHOON</div><div class="tt-us" id="tt-r1-us"><span class="tt-arrow">&rarr;</span>Category 1 start</div></div>
    <div class="tt-trow" id="tt-r2"><div class="tt-jma" id="tt-r2-jma">VERY STRONG TYPHOON</div><div class="tt-us" id="tt-r2-us"><span class="tt-arrow">&rarr;</span>Near the top of Category 2</div></div>
    <div class="tt-trow" id="tt-r3"><div class="tt-jma" id="tt-r3-jma">VIOLENT TYPHOON</div><div class="tt-us" id="tt-r3-us"><span class="tt-arrow">&rarr;</span>Well into Category 3, and climbing</div></div>
  </div>
  <div class="tt-caption" id="tt-caption">THE GRADE IS THE MEASUREMENT &middot; NOT THE WORD</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 63.127; // this episode's translate-table mount: 375.030-438.157
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#tt-b1","#tt-b2","#tt-b3","#tt-r1-jma","#tt-r1-us","#tt-r2-jma","#tt-r2-us","#tt-r3-jma","#tt-r3-us","#tt-caption"], { autoAlpha: 0 }, 0);
  tl.set("#tt-eye", { autoAlpha: 0 }, 0);
  tl.set(["#tt-r1","#tt-r2","#tt-r3"], { autoAlpha: 1 }, 0); // row shells mount with the table; jma/us cells reveal individually below
  /* background plate: continuous slow scale across the whole window (round 2, 17 Sep 26 freeze fix) */
  tl.fromTo("#tt-bgplate", { scale: 1.0 }, { scale: 1.06, duration: HOST_WINDOW, ease: "none" }, 0);
  /* solid full-width scan sweep, bounded repeat, covers the whole window including the two spans between
     basin-chip reveals that freezedetect still read as frozen in draft 2 */
  tl.fromTo("#tt-sweep", { top: -6 }, { top: 1086, duration: 3.4, ease: "none", repeat: repeatsToFit(0, 3.4) }, 0);
  /* two soft glow blobs drift for the full window — always-on kinetic motion, never a flat frame */
  tl.to("#tt-glow-a", { x: 130, y: 80, duration: 9.0, ease: "sine.inOut", repeat: repeatsToFit(0, 9.0), yoyo: true }, 0);
  tl.to("#tt-glow-b", { x: -140, y: -70, duration: 10.5, ease: "sine.inOut", repeat: repeatsToFit(0.5, 10.5), yoyo: true }, 0.5);
  tl.fromTo("#tt-b1", { autoAlpha:0, y:-20 }, { autoAlpha:1, y:0, duration:0.4 }, 5.22);   // "western" 11.22
  tl.fromTo("#tt-b2", { autoAlpha:0, y:-20 }, { autoAlpha:1, y:0, duration:0.4 }, 10.7);   // "the" (Atlantic) 16.7
  tl.fromTo("#tt-b3", { autoAlpha:0, y:-20 }, { autoAlpha:1, y:0, duration:0.4 }, 15.72);  // "the" (Indian) 21.72
  /* continuous ambient motion from mount through the table reveal */
  tl.to(".tt-basinrow", { y: -12, duration: 2.4, ease: "sine.inOut", repeat: repeatsToFit(0.3, 2.4), yoyo: true }, 0.3);
  tl.fromTo("#tt-table", { autoAlpha:0, y:30 }, { autoAlpha:1, y:0, duration:0.6 }, 22.0);
  /* continuous ambient motion so the table never sits frozen between reveals */
  tl.to("#tt-table", { y: -10, duration: 3.0, ease: "sine.inOut", repeat: repeatsToFit(22.8, 3.0), yoyo: true }, 22.8);
  /* row 1: grade name lands on "Strong typhoon" (35.64), the US translation and its highlight sweep land on
     "That is the same starting line" (41.72) — two beats, not one block */
  tl.fromTo("#tt-r1-jma", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 29.64);
  tl.fromTo("#tt-r1", { backgroundPosition:"-120% 0" }, { backgroundPosition:"220% 0", duration:0.8, ease:"power1.inOut" }, 35.72);
  tl.fromTo("#tt-r1-us", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 35.72); // "That is the same starting line" 41.72
  /* row 2: grade name on "Very strong typhoon" (45.12), translation + sweep on "Category 2" (48.76) */
  tl.fromTo("#tt-r2-jma", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 39.12);
  tl.fromTo("#tt-r2", { backgroundPosition:"-120% 0" }, { backgroundPosition:"220% 0", duration:0.8, ease:"power1.inOut" }, 42.76);
  tl.fromTo("#tt-r2-us", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 42.76); // "Category" 48.76
  /* row 3: grade name on "Violent typhoon," (51.1), translation + sweep on "Category 3" (55.14) */
  tl.fromTo("#tt-r3-jma", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 45.1);
  tl.fromTo("#tt-r3", { backgroundPosition:"-120% 0" }, { backgroundPosition:"220% 0", duration:0.8, ease:"power1.inOut" }, 49.14);
  tl.fromTo("#tt-r3-us", { autoAlpha:0, x:20 }, { autoAlpha:1, x:0, duration:0.4 }, 49.14); // "Category" 55.14
  /* bridges the r3->caption gap on "The word typhoon alone tells...almost nothing about size" (57.89) */
  tl.to("#tt-thead-jp", { color:"#f4b8bc", duration:0.4, yoyo:true, repeat:1 }, 52.44);
  /* frame-reader finding (draft 1 contact sheet): 53.51-59.51 read as static with the table locked; a real
     beat closes it on "reader almost nothing about size" (59.86) with a full-table border-glow flash */
  tl.to("#tt-table", { boxShadow: "0 0 40px rgba(216,161,58,0.55)", duration: 0.6, yoyo: true, repeat: 1 }, 54.5);
  /* closing caption lands on "Neither word...is a measurement on its own." (64.7) */
  tl.fromTo("#tt-caption", { autoAlpha:0, y:14 }, { autoAlpha:1, y:0, duration:0.4 }, 58.7);
  tl.to(["#tt-b1","#tt-b2","#tt-b3","#tt-table","#tt-caption"], { autoAlpha:0, duration:0.5 }, 62.4);
  window.__timelines["translate-table"] = tl;
})();
</script>
</template>
</body>
</html>
