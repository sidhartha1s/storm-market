<script>
window.__timelines = window.__timelines || {};
(function () {

  /* Ambient tweens use a BOUNDED repeat, never repeat:-1/300: an infinite/huge repeat runs past this
     paused/seeked timeline's frame-by-frame playhead and desyncs headless capture (see blank_scan.mjs).
     repeatsToFit() sizes each repeat count so its own tween ends at or just under HOST_WINDOW. For a
     stagger()'d multi-target tween, GSAP repeats the WHOLE staggered block per cycle, so cycle must
     include the stagger span: stagger * (targetCount - 1) + duration. */
  const HOST_WINDOW = 49.782; // this episode's ladder mount: 186.866-236.648
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }

  /* rung bob: stagger 0.4 across 5 targets -> cycle = 0.4*4 + 3.4 = 5.0 */
