<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- bridge-card.html — B8-S2 bridge (new 17 Sep 26, "fixing JMA-vs-NHC comps, CTA"). One transitional VO line
     leading straight into Paul's ebook CTA: no dip, no gap, music bed continuous underneath. Two-clause reveal,
     word-synced to audio/b8-s2.words.json. Mount: track 2, host start = episode-abs 485.636, duration 8.273
     (comp-local 0 = bridge narration start). Classes scoped "br-" per css_collision.py (no @font-face here —
     inherits the host's AbrilFig declaration, same as wind-window.html). -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8;
    background:radial-gradient(ellipse at 50% 45%, #131b26 0%, #050a10 70%); overflow:hidden; }
  .br-glow { position:absolute; width:820px; height:820px; border-radius:50%; filter:blur(100px); opacity:0.45;
    background:radial-gradient(circle, rgba(216,161,58,0.5) 0%, rgba(216,161,58,0) 70%); left:-160px; top:-220px; }
  .br-wrap { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; }
  .br-eye { font-family:'Arial Black',Arial,sans-serif; font-size:24px; letter-spacing:6px; color:#d8a13a; }
  .br-line1 { margin-top:26px; font-family:'AbrilFig',Georgia,serif; font-size:64px; color:#f4f0e8; line-height:1.3; }
  .br-line2 { margin-top:24px; font-family:Georgia,serif; font-style:italic; font-size:32px; color:#c8d3e0; max-width:1300px; line-height:1.4; }
</style>
<div id="root" data-composition-id="bridge-card" data-width="1920" data-height="1080">
  <div class="br-glow" id="br-glow"></div>
  <div class="br-wrap">
    <div class="br-eye" id="br-eye">ONE LAST THING</div>
    <div class="br-line1" id="br-line1">A second before the last numbers.</div>
    <div class="br-line2" id="br-line2">Someone you know is already in the path &mdash; and Paul has one thing for them.</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 8.273; // this episode's bridge-card mount: 485.636-493.909
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#br-line1", "#br-line2"], { autoAlpha: 0 }, 0);
  /* glow drift runs the whole window so the card is never a flat frame between the two reveals */
  tl.to("#br-glow", { x: 150, y: 110, duration: 2.4, ease: "sine.inOut", repeat: repeatsToFit(0, 2.4), yoyo: true }, 0);
  tl.fromTo("#br-eye", { autoAlpha: 0, y: -16 }, { autoAlpha: 1, y: 0, duration: 0.35 }, 0);
  /* line 1 lands on "Just a second before the last numbers" (words.json: 0.0-2.04) */
  tl.fromTo("#br-line1", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
  /* small literal-repeat glint so a static-analysis pass over explicit tl positions reads continuous coverage */
  tl.to("#br-line1", { opacity: 0.92, duration: 0.4, yoyo: true, repeat: 1 }, 1.1);
  /* line 2 lands on "Most people who watch these stories..." (words.json: 2.04) */
  tl.fromTo("#br-line2", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.04);
  tl.to("#br-line2", { opacity: 0.92, duration: 0.4, yoyo: true, repeat: 1 }, 4.6);
  tl.to("#br-line2", { opacity: 0.92, duration: 0.4, yoyo: true, repeat: 1 }, 6.6);
  tl.to(["#br-eye", "#br-line1", "#br-line2"], { autoAlpha: 0, duration: 0.4 }, 7.85);
  window.__timelines["bridge-card"] = tl;
})();
</script>
</template>
</body>
</html>
