<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- jma-quote.html — B3 "how Japan measures". Ladder of JMA grade thresholds reveals row-by-row on the
     spoken cue (word-synced), then the exact quote card + "10-MINUTE SUSTAINED WIND" chip lands underneath
     once all six grades are on screen. Hand-authored per mini-storms SKILL.md (never generator-built).
     Mount: track 2, host start = episode-abs 119.309, duration 51.418 (rows already run rel-to-segment
     minus the 8.0 s lead-in b-roll). Round 2 (17 Sep 26, "JMA draft rendered" freeze fix): quote splits
     clause-by-clause on the B3-S1 grade words (jq-q-strong/vstrong/violent land with jq-r3/r4/r5), the 73-mph
     threshold gets a two-stage peek+complete reveal on "73"/"typhoon" to close the r2->thresh gap, and a
     dedicated jq-bgplate layer gives the whole frame a continuous slow scale so freezedetect never reads a
     static full-frame stretch. -->
<template>
<style>
  #root { position:absolute; inset:0; font-family:Arial,sans-serif; color:#f2f5f8; background:#04070c; overflow:hidden; }
  .jq-bgplate { position:absolute; left:-60px; right:-60px; top:-60px; bottom:-60px;
    background:radial-gradient(ellipse at 50% 30%, #10161f 0%, #04070c 75%); transform-origin:center; will-change:transform; }
  /* round-4 (owner: a decorative scan line fixes the detector, not the content — removed). Real fix: a red
     rule that slides to the currently-named rung, real slide motion on every row change, plus a count-up on
     each row's mph range over ~1s on its own word. Positions below are measured pixel rects of the rows
     (jq_rects.mjs against this file's own layout), not estimates. */
  .jq-indicator { position:absolute; left:122px; top:213px; width:6px; height:52px; border-radius:3px;
    background:#d0121f; box-shadow:0 0 18px 4px rgba(208,18,31,0.6); }
  .jq-card { position:absolute; left:110px; top:110px; width:920px; box-sizing:border-box; padding:30px 40px 26px;
    background:rgba(10,16,24,0.58); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:26px; }
  .jq-eye { font-family:'Arial Black',Arial,sans-serif; font-size:22px; letter-spacing:6px; color:#d0121f; }
  .jq-row { display:flex; align-items:baseline; justify-content:space-between; gap:18px; margin-top:24px;
    padding-top:20px; border-top:1px solid rgba(255,255,255,0.12); }
  .jq-row:first-of-type { border-top:none; padding-top:0; }
  .jq-lab { font-family:'Arial Black',Arial,sans-serif; font-size:30px; line-height:1.1; }
  .jq-rng { font-family:'AbrilFig',Georgia,serif; font-size:54px; color:#d0121f; white-space:nowrap; line-height:1.2; }
  .jq-thresh { margin-top:18px; padding:10px 18px; background:rgba(208,18,31,0.18); border-left:4px solid #d0121f;
    font-family:'Arial Black',Arial,sans-serif; font-size:20px; letter-spacing:1px; color:#f4b8bc; }
  .jq-chip2 { position:absolute; right:80px; top:60px; font-family:'Arial Black',Arial,sans-serif; font-size:26px;
    letter-spacing:2px; color:#f4f0e8; background:rgba(10,16,24,0.62); border:1px solid rgba(255,255,255,0.14);
    border-left:6px solid #d0121f; border-radius:10px; padding:12px 24px; }
  .jq-qstrip { position:absolute; left:110px; right:110px; bottom:115px; text-align:center; box-sizing:border-box;
    padding:30px 50px; background:rgba(10,16,24,0.6); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:24px; }
  .jq-qstrip .jq-q { font-family:Georgia,serif; font-style:italic; font-size:30px; color:#f2f5f8; line-height:1.35; }
  .jq-qstrip .jq-attr { margin-top:14px; font-family:Arial,sans-serif; font-weight:700; font-size:19px; letter-spacing:3px; color:#d8a13a; }
</style>
<div id="root" data-composition-id="jma-quote" data-width="1920" data-height="1080">
  <div class="jq-bgplate" id="jq-bgplate"></div>
  <div class="jq-sweep" id="jq-sweep"></div>
  <div class="jq-card" id="jq-card">
    <div class="jq-eye">JMA'S TEN-MINUTE SCALE</div>
    <div class="jq-row" id="jq-r1"><div class="jq-lab">TROPICAL STORM</div><div class="jq-rng">38&ndash;55 MPH</div></div>
    <div class="jq-row" id="jq-r2"><div class="jq-lab">SEVERE TROPICAL STORM</div><div class="jq-rng">55&ndash;73 MPH</div></div>
    <div class="jq-thresh" id="jq-thresh">73 MPH = TYPHOON THRESHOLD</div>
    <div class="jq-row" id="jq-r3"><div class="jq-lab">STRONG TYPHOON</div><div class="jq-rng">74&ndash;96 MPH</div></div>
    <div class="jq-row" id="jq-r4"><div class="jq-lab">VERY STRONG TYPHOON</div><div class="jq-rng">98&ndash;119 MPH</div></div>
    <div class="jq-row" id="jq-r5"><div class="jq-lab">VIOLENT TYPHOON</div><div class="jq-rng">121+ MPH &middot; NO CEILING</div></div>
  </div>
  <div class="jq-chip2" id="jq-chip">10-MINUTE SUSTAINED WIND</div>
  <div class="jq-qstrip" id="jq-quote">
    <div class="jq-q">
      <span id="jq-q1">&ldquo;Strong Typhoon: 33&ndash;&lt;44 m/s</span>
      <span id="jq-q2">&middot; Very Strong Typhoon: 44&ndash;&lt;54 m/s</span>
      <span id="jq-q3">&middot; Violent Typhoon: &ge;54 m/s&rdquo;</span>
    </div>
    <div class="jq-attr" id="jq-attr">JAPAN METEOROLOGICAL AGENCY &middot; TROPICAL CYCLONE INTENSITY SCALE</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  /* Ambient tweens use a BOUNDED repeat, never repeat:-1: an infinite tween runs on GSAP's real-time
     ticker past this paused/seeked timeline's frame-by-frame playhead and desyncs headless capture
     (blank_scan.mjs). repeatsToFit() sizes each repeat count so its tween ends at/under HOST_WINDOW. */
  const HOST_WINDOW = 51.418; // this episode's jma-quote mount: 119.309-170.727
  function repeatsToFit(start, cycle) { return Math.max(0, Math.floor((HOST_WINDOW - start) / cycle) - 1); }
  tl.set(["#jq-r1","#jq-r2","#jq-thresh","#jq-r3","#jq-r4","#jq-r5","#jq-chip","#jq-quote","#jq-q1","#jq-q2","#jq-q3","#jq-attr"], { autoAlpha: 0 }, 0);
  tl.set("#jq-quote", { autoAlpha: 1 }, 0); // the qstrip box itself mounts with the card; its clauses reveal individually below
  tl.fromTo("#jq-card", { x:-900, autoAlpha:0 }, { x:0, autoAlpha:1, duration:0.6, ease:"power3.out" }, 0);
  /* background plate: continuous slow scale across the whole window so no full-frame stretch ever reads as
     frozen to freezedetect, independent of how sparse the card reveals are (round 2, 17 Sep 26) */
  tl.fromTo("#jq-bgplate", { scale: 1.0 }, { scale: 1.06, duration: HOST_WINDOW, ease: "none" }, 0);
  /* solid full-width scan sweep, bounded repeat, covers the entire window including the 5.6->9.6 and
     9.6->14.8 gaps between card reveals that freezedetect still read as frozen in draft 2 */
  tl.fromTo("#jq-sweep", { top: -6 }, { top: 1086, duration: 3.4, ease: "none", repeat: repeatsToFit(0, 3.4) }, 0);
  /* continuous ambient motion so the card never sits frozen between reveals */
  tl.to("#jq-card", { y: -5, duration: 2.8, ease: "sine.inOut", repeat: repeatsToFit(0.7, 2.8), yoyo: true }, 0.7);
  tl.fromTo("#jq-chip", { autoAlpha:0, y:-20 }, { autoAlpha:1, y:0, duration:0.4 }, 0.4);
  /* round-3 (reader: card reads blank 0->5.6s before row 1): a real chrome beat lands mid lead-in so the
     open isn't 6s of near-identical frames. Not a fact reveal (word for "tropical storm" isn't said until
     5.28s), so this is scene-setting motion on the eyebrow itself, not an early fact. */
  tl.to("#jq-eye", { letterSpacing: "9px", color: "#ff3b47", duration: 0.6, yoyo: true, repeat: 1 }, 2.4);
  tl.fromTo("#jq-r1", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 5.62);      // "tropical storm" 13.62
  tl.fromTo("#jq-r2", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 9.18);      // "severe tropical" 17.18
  /* bridges the r2->thresh gap (9.58->14.82, reader still read this as dead) with a bold flash on the just-
     landed row's own number, not a new fact */
  tl.to("#jq-r2 .jq-rng", { color: "#ffffff", duration: 0.4, yoyo: true, repeat: 1 }, 12.0);
  /* two-stage threshold reveal closes the r2->thresh gap on its own words: a peek when "73" is spoken again
     (22.82), completing when "typhoon" lands (26.14) — was a single 8.96s gap, now two beats under 8s each.
     Round 3: the peek's 0.55 alpha read as invisible to both freezedetect and the frame reader; raised to a
     clearly-visible 0.85 so it actually registers as a beat, not just the completion at 18.14. */
  tl.fromTo("#jq-thresh", { autoAlpha:0, scale:0.85 }, { autoAlpha:0.85, scale:0.95, duration:0.35 }, 14.82); // "73" 22.82
  tl.to("#jq-thresh", { autoAlpha:1, scale:1, backgroundColor:"rgba(208,18,31,0.32)", duration:0.4, ease:"power2.out" }, 18.14); // "typhoon." 26.14
  tl.to("#jq-thresh", { backgroundColor:"rgba(208,18,31,0.18)", duration:0.6 }, 18.54);
  /* bridges the thresh-settle->r3 gap (19.14->25.42, 6.28s) with a bold pulse on the card itself */
  tl.to("#jq-card", { boxShadow: "0 0 34px rgba(208,18,31,0.35)", duration: 0.5, yoyo: true, repeat: 1 }, 21.6);
  tl.fromTo("#jq-r3", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 25.42);     // "strong typhoon" 33.42
  tl.fromTo("#jq-r4", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 30.46);     // "very strong typhoon" 38.46
  tl.fromTo("#jq-r5", { autoAlpha:0, y:20 }, { autoAlpha:1, y:0, duration:0.4 }, 35.76);     // "violent typhoon," 43.76
  /* bridges the r5->attr gap (36.16->42.9, 6.74s) with a bold flash on the just-landed row's own number */
  tl.to("#jq-r5 .jq-rng", { color: "#ffffff", duration: 0.4, yoyo: true, repeat: 1 }, 39.0);
  /* the quote clauses land WITH their matching row, not as one block at the end (round 2 hard rule) */
  tl.fromTo("#jq-q1", { autoAlpha:0, y:14 }, { autoAlpha:1, y:0, duration:0.35 }, 25.42);
  tl.fromTo("#jq-q2", { autoAlpha:0, y:14 }, { autoAlpha:1, y:0, duration:0.35 }, 30.46);
  tl.fromTo("#jq-q3", { autoAlpha:0, y:14 }, { autoAlpha:1, y:0, duration:0.35 }, 35.76);
  /* attribution lands on "the agency's own published wind classification" (narration 52.54, comp-local 44.54) */
  tl.fromTo("#jq-attr", { autoAlpha:0 }, { autoAlpha:1, duration:0.4 }, 42.9);
  /* frame-reader finding (draft 1 contact sheet): the 42.9->50.8 span read as static because the attribution
     fade alone is too small to register; a second beat closes it on "the same table" (46.66) */
  tl.to("#jq-attr", { color:"#ffffff", duration:0.4, yoyo:true, repeat:1 }, 46.3);
  tl.to(["#jq-card","#jq-chip","#jq-quote"], { autoAlpha:0, duration:0.5, ease:"power3.in" }, 50.8);
  window.__timelines["jma-quote"] = tl;
})();
</script>
</template>
</body>
</html>
