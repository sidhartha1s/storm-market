<script>

  const tl = gsap.timeline({ paused: true });
  const AMBER = "#d8a13a", COLD = "#7fb2e5";
  const MERC = ["#ff-merc", "#ff-bulb"];
  function merc(T) { const y = 640 - (T - 20) * 20; return { attr: { y: y, height: 662 - y } }; }

  /* rest states at 0 (transforms only here, never in CSS or markup) */

  tl.to("#ff-l32", { scaleY: 2, svgOrigin: "1560 400", duration: 0.2, ease: "power2.out" }, 3.32);

  /* "The rain" @4.32: flashback. HUD -> OVERNIGHT; readout out (gone by 4.44, before the mercury crosses 400) */

  tl.set(MERC, { attr: { fill: AMBER } }, 4.465);

  /* "roads" @5.42: ASPHALT names the road; film shimmer sweeps every 1.4 s, 7 passes (ends 15.22) */
  tl.fromTo("#ff-lab-asph", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.42);
  tl.fromTo("#ff-lead-asph", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 5.42);
  tl.set("#ff-shimmer", { autoAlpha: 1 }, 5.42);
  tl.fromTo("#ff-shimmer", { x: 0 }, { x: 1240, duration: 1.4, ease: "none", repeat: 6 }, 5.42);

  /* "37" @6.78: readout 37 TO 39F; mercury breathes 37 <-> 39 (y 300 <-> 260), back to 38 by "When"'s front */
  tl.fromTo("#ff-read-warm", { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power3.out" }, 6.78);
  tl.to("#ff-merc", Object.assign({ duration: 0.6, ease: "sine.inOut" }, merc(37)), 6.78);
  tl.to("#ff-merc", Object.assign({ duration: 1.2, ease: "sine.inOut" }, merc(39)), 7.38);
  tl.to("#ff-merc", Object.assign({ duration: 0.96, ease: "sine.inOut" }, merc(38)), 8.58);

  /* "When" @9.02: HUD -> BEHIND THE FRONT; readout out; front enters (bottom of its edge at x 400) */

  tl.fromTo("#ff-hud-front", { autoAlpha: 0, x: -24 }, { autoAlpha: 1, x: 0, duration: 0.3, ease: "power3.out" }, 9.02);

  tl.fromTo("#ff-ice", { scaleX: 0 }, { scaleX: 1, svgOrigin: "400 626", duration: 0.8, ease: "power2.inOut" }, 15.34);
  tl.to("#ff-shimmer", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 15.34);
  tl.to(["#ff-rain1", "#ff-rain2"], { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 15.34);

  tl.to("#ff-snowlayer", { scaleY: 1, svgOrigin: "920 612", duration: 1.2, ease: "power2.out" }, 17.10);
