<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const $ = (id) => "#af-" + id;

  /* Product text, character for character; only the line breaks are ours. cw = glyph pitch in px. */
  const LINES = [
    { id: "h1", text: "Area Forecast Discussion",                 at: 1.32, dur: 0.38, cw: 17.6 },
    { id: "h2", text: "National Weather Service Buffalo NY",      at: 1.70, dur: 0.40, cw: 17.6 },
    { id: "h3", text: "410 AM EST Sun Dec 18 2022",               at: 2.10, dur: 0.60, cw: 17.6 },
    { id: "l1", text: "...a very large and powerful storm system", at: 5.02, dur: 1.88, cw: 22.6, top: 430 },
    { id: "l2", text: "will impact the bulk of the eastern half",  at: 7.12, dur: 1.12, cw: 22.6, top: 494 },
    { id: "l3", text: "of the country later in the week.",         at: 8.24, dur: 1.16, cw: 22.6, top: 558 }
  ];
  LINES.forEach(function (L) { L.st = { n: 0 }; });

  /* One leaf span per line + the cursor, painted from the line states (any seek order gives the same frame). */
  function paint() {
    let cx = 260, cy = 442;
    LINES.forEach(function (L) {
      const el = document.getElementById("af-" + L.id);
      const k = Math.round(L.st.n);
      if (el) el.textContent = L.text.slice(0, k);
      if (L.top && k > 0) { cx = 260 + k * L.cw; cy = L.top + 12; }
    });
    const c = document.getElementById("af-cur");
    if (c) { c.style.left = cx + "px"; c.style.top = cy + "px"; }
  }
  tl.eventCallback("onUpdate", paint);
  paint();

  /* "Five" @0.00: ground is on from frame 0 (CSS); chip enters */
  tl.fromTo($("chip"), { autoAlpha: 0, scale: 1.2, transformOrigin: "left center" },
    { autoAlpha: 1, scale: 1, duration: 0.4, ease: "power4.out" }, 0.05);

  /* "out," @0.44: panel in, source in, cursor in and blinking to the end (32 legs x 0.42 = 13.44 -> 13.88) */
  tl.fromTo($("panel"), { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.44);
  tl.fromTo($("source"), { y: 12, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.44);
  tl.fromTo($("cur"), { y: 40, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.44);
  tl.fromTo($("curb"), { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.42, ease: "steps(1)", yoyo: true, repeat: 31,
    immediateRender: false }, 0.44);

  /* "Sunday" @1.32 ... "Christmas," ends 2.34: header types line by line */
  LINES.forEach(function (L) {
    tl.fromTo(L.st, { n: 0 }, { n: L.text.length, duration: L.dur, ease: "none", immediateRender: false }, L.at);
  });
  /* body: L1 "a very large and powerful storm system" @5.02-7.12, L2 "would hit the eastern half" @7.12-8.24 (voice ends
     8.24, so typing ends with it), L3 "of the country later that week." @8.24-9.94 (typing ends 9.40) */

  /* "Buffalo's" @2.82: header line 2 brightens, divider draws */
  tl.to($("h2"), { color: "#f2f5f8", duration: 0.3, ease: "power2.out" }, 2.82);
  tl.fromTo($("divider"), { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 2.82);

  /* gap 9.40-10.5: product id lands, panel drifts 1 -> 1.02 over 9.4 -> 13.9 (continuous) */
  tl.fromTo($("id"), { y: 10, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 9.4);
  tl.to($("card"), { scale: 1.02, duration: 4.5, ease: "none" }, 9.4);

  /* "forecast" @10.86: amber rule under "very large and powerful" */
  tl.fromTo($("rule"), { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.5, ease: "power2.out" }, 10.86);

  /* "early" @11.62: chip pulse */
  tl.to($("chip"), { scale: 1.08, duration: 0.25, ease: "power2.out" }, 11.62);
  tl.to($("chip"), { scale: 1, duration: 0.25, ease: "power2.in" }, 11.87);

  /* "found outside in the snow?" @13.48-15.12: slow fade of everything, ground included, to black (ends 15.5) */
