<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-a5-8-brunch-chip (A5-S7, standard): glass chip "CHRISTMAS DAY · 2022" over the brunch photo only, plus two credit pills (C1 brunch photo, C2 DVIDS photo).
  Overlay on two stills (mounted by the orchestrator); root transparent. Comp duration 14.04 s (a5-s7.wav).
  Cue times are seconds from the START of A5-S7 (audio/a5-s7.words.json). Family base: g-a4-3-day-chip.
  Picture cut at S7 +9.74 ("Across the same city,"): C1 off and C2 on, hard swap on that frame. If the cut moves, move both sets.
  Chip is fully gone (autoAlpha 0) at 9.56, 0.18 s before the cut; visible 5.84 to 8.96 (3.1 s settled).
  Fallback if the table sits lower-left at 6.5 s: change .bc-chip to left:auto; right:400px (orchestrator call).
  No place name on screen. Nothing in x >= 1600, y >= 680.
-->
<template>
<style>
  #g-a5-8-brunch-chip-root { position:absolute; inset:0; overflow:hidden; pointer-events:none; background:transparent; font-family:Arial, sans-serif; }
  #bc-stack { position:absolute; inset:0; }
  .bc-chip { position:absolute; left:110px; bottom:110px; display:table; box-sizing:border-box; padding:22px 34px;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; opacity:0; visibility:hidden; }
  .bc-row { display:flex; flex-direction:row; align-items:baseline; white-space:nowrap; }
  .bc-date { display:block; font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:52px; line-height:1; color:#f2f5f8; }
  .bc-dot { display:block; font-family:Arial, sans-serif; font-weight:700; font-size:38px; line-height:1; color:#93a3b2; white-space:pre; }
  .bc-year { display:block; font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:38px; line-height:1; color:#e8c56a; }
  .bc-src { position:absolute; right:96px; top:54px; display:table; box-sizing:border-box; padding:5px 12px; white-space:nowrap;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:14px;
    font-family:Arial, sans-serif; font-weight:400; font-size:19px; line-height:1.3; color:#c8d3e0; opacity:0; visibility:hidden; }
</style>
<div id="g-a5-8-brunch-chip-root" data-composition-id="g-a5-8-brunch-chip" data-width="1920" data-height="1080">
  <div id="bc-stack">
    <div class="bc-chip" id="bc-chip"><div class="bc-row"><span class="bc-date" id="bc-date">CHRISTMAS DAY</span><span class="bc-dot" id="bc-dot"> · </span><span class="bc-year" id="bc-year">2022</span></div></div>
    <div class="bc-src" id="bc-c1">Photo: Andre Carrotflower / Wikimedia Commons / CC BY-SA 4.0</div>
    <div class="bc-src" id="bc-c2">New York National Guard, DVIDS</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#bc-chip", "#bc-c1", "#bc-c2"], { autoAlpha: 0 }, 0);

  /* whole-window float so something always moves: 10 x 1.5 s = 15 s >= 14.04 */
  tl.fromTo("#bc-stack", { y: 0 }, { y: -4, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);

  /* C1 in. "Four years ago this week," @0.00 */
  tl.fromTo("#bc-c1", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.10);

  /* chip in on "Christmas brunch table." @5.44 */
  tl.fromTo("#bc-chip", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 5.44);
  tl.fromTo("#bc-year", { scale: 1.25 }, { scale: 1, duration: 0.35, ease: "power4.out", transformOrigin: "left center", immediateRender: false }, 5.60);

  /* CHRISTMAS DAY brightens on "blizzard ran outside." @7.86 */
  tl.to("#bc-date", { color: "#ffffff", duration: 0.5, ease: "power2.out" }, 7.86);

  /* chip out after "outside." @8.92; gone 9.56, 0.18 s before the cut */
  tl.to("#bc-chip", { x: -80, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 8.96);

  /* picture cut "Across the same city," @9.74: hard credit swap on the cut frame */
  tl.set("#bc-c1", { autoAlpha: 0 }, 9.74);
  tl.set("#bc-c2", { autoAlpha: 1, y: 0 }, 9.74);

  /* C2 out after "loved." @13.84 (host end 14.04 - 0.6) */
  tl.to("#bc-c2", { autoAlpha: 0, y: -10, duration: 0.6, ease: "power3.in" }, 13.44);

  window.__timelines["g-a5-8-brunch-chip"] = tl;
})();
</script>
</template>
</body>
</html>
