<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-intro-2-toll-chips (H1-S2, standard): four glass chips, one at a time, 46 / 12 / 18 OF 46 / +4, plus the WIVB source pill.
  Overlay on the DVIDS 7576030 still (mounted by the orchestrator on a lower track). Comp duration 13.5 s.
  Cue times are seconds from the START of H1-S2 (audio/h1-s2.words.json). PROVISIONAL hook: redone if the owner picks another hook shape.
  Family base for g-intro-5-wind-chips: copy this file and swap the strings.
  Chip 2 reads "WITHOUT POWER OR HEAT" (never "at home", never "final", never "most").
-->
<template>
<style>
  #g-intro-2-toll-chips-root { position:absolute; inset:0; overflow:hidden; pointer-events:none; background:transparent; font-family:Arial, sans-serif; }
  #tc-stack { position:absolute; inset:0; }
  .tc-chip { position:absolute; left:110px; bottom:110px; display:table; box-sizing:border-box; padding:22px 34px;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; opacity:0; visibility:hidden; }
  .tc-row { display:flex; flex-direction:row; align-items:baseline; white-space:nowrap; }
  .tc-num { display:block; font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:84px; line-height:1; color:#f2f5f8; margin-right:16px; }
  .tc-red { color:#e74c3c; }
  .tc-lab { display:block; position:relative; font-family:Arial, sans-serif; font-weight:700; font-size:30px; line-height:1; color:#dfe7ee; letter-spacing:1px; }
  .tc-out { position:relative; display:inline-block; }
  #tc-rule { position:absolute; left:0; right:0; bottom:-10px; height:4px; background:#e74c3c; transform-origin:left center; opacity:0; visibility:hidden; }
  .tc-src { position:absolute; left:110px; bottom:54px; display:table; box-sizing:border-box; padding:5px 12px; white-space:nowrap;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:14px;
    font-family:Arial, sans-serif; font-weight:400; font-size:19px; line-height:1.3; color:#c8d3e0; opacity:0; visibility:hidden; }
</style>
<div id="g-intro-2-toll-chips-root" data-composition-id="g-intro-2-toll-chips" data-width="1920" data-height="1080">
  <div id="tc-stack">
    <div class="tc-chip" id="tc-c1"><div class="tc-row"><span class="tc-num" id="tc-n1">46</span><span class="tc-lab" id="tc-l1">IN ERIE COUNTY</span></div></div>
    <div class="tc-chip" id="tc-c2"><div class="tc-row"><span class="tc-num" id="tc-n2">12</span><span class="tc-lab" id="tc-l2">WITHOUT POWER OR HEAT</span></div></div>
    <div class="tc-chip" id="tc-c3"><div class="tc-row"><span class="tc-num tc-red" id="tc-n3">18</span><span class="tc-lab" id="tc-l3">OF 46 FOUND <span class="tc-out">OUTSIDE<span id="tc-rule"></span></span></span></div></div>
    <div class="tc-chip" id="tc-c4"><div class="tc-row"><span class="tc-num" id="tc-n4">+4</span><span class="tc-lab" id="tc-l4">IN THEIR CARS</span></div></div>
  </div>
  <div class="tc-src" id="tc-src">Erie County Executive Mark Poloncarz, last reported count (3 cases pending), via WIVB</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const chips = ["#tc-c2", "#tc-c3", "#tc-c4"];
  tl.set(chips.concat(["#tc-src", "#tc-rule"]), { autoAlpha: 0 }, 0);

  /* whole-window float so something always moves: 6 x 1.5625 s = 9.375 s (host cut) */
  tl.fromTo("#tc-stack", { y: 0 }, { y: -4, duration: 1.5625, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);

  /* C2 + source in. "12" @0.00 */
  tl.fromTo("#tc-c2", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 0);
  tl.fromTo("#tc-src", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
  tl.fromTo("#tc-n2", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", transformOrigin: "left center" }, 0);
  /* C2 out after "group," ends 3.38, before "18," @3.82 */
  tl.to("#tc-c2", { x: -80, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 3.4);

  /* C3 in. "18," @3.82 */
  tl.fromTo("#tc-c3", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 3.82);
  tl.fromTo("#tc-n3", { scale: 1.3 }, { scale: 1, duration: 0.45, ease: "power4.out", transformOrigin: "left center" }, 3.82);
  /* red rule under OUTSIDE. "outside" @5.06 */
  tl.set("#tc-rule", { autoAlpha: 1 }, 5.06);
  tl.fromTo("#tc-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 5.06);
  /* C3 out, after "snow." ends 6.58, before "Four" @7.26 */
  tl.to("#tc-c3", { x: -80, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 6.65);

  /* C4 in. "Four" @7.26 */
  tl.fromTo("#tc-c4", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 7.26);
  tl.fromTo("#tc-n4", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(1.6)", transformOrigin: "left center" }, 7.26);
  /* C4 + source out, after "cars." ends 8.78; done 9.35, under host cut 9.375 */
  tl.to(["#tc-c4", "#tc-src"], { x: -80, autoAlpha: 0, duration: 0.5, ease: "power3.in" }, 8.85);

  window.__timelines["g-intro-2-toll-chips"] = tl;
})();
</script>
</template>
</body>
</html>
