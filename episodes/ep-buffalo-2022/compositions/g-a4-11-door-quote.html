<!doctype html>

<body>

  Cue times are seconds from the START of A4-S10 (audio/a4-s10.words.json). Card and chip never on screen together.
  From 13.04 ("So what happened") only the photo, the credit and S-B remain.
  Fallbacks if a frame at 6.6 s / 10.0 s shows the card or chip over the door: .dq-card bottom:300px, or .dq-chip left:auto; right:400px (orchestrator call).
-->
<template>
<style>

  #dq-stack { position:absolute; inset:0; }
  .dq-card { position:absolute; inset:auto; left:260px; right:400px; bottom:150px; box-sizing:border-box; padding:28px 48px; text-align:center;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; opacity:0; visibility:hidden; }
  .dq-q { white-space:nowrap; font-family:Georgia, 'Times New Roman', serif; font-style:italic; font-size:44px; line-height:1.35; color:#f2f5f8; }

  .dq-chip { position:absolute; inset:auto; left:110px; bottom:110px; display:table; box-sizing:border-box; padding:22px 34px;

    <div class="dq-card" id="dq-card">
      <div class="dq-q"><span class="dq-word" id="dq-w1">&ldquo;may</span> <span class="dq-word" id="dq-w2">have</span> <span class="dq-word" id="dq-w3">perished</span> <span class="dq-word" id="dq-w4">living</span> <span class="dq-word" id="dq-w5">alone.&rdquo;</span></div>
      <div class="dq-attr" id="dq-attr">MARK POLONCARZ &middot; ERIE COUNTY EXECUTIVE</div>
    </div>
    <div class="dq-chip" id="dq-chip"><div class="dq-row"><span id="dq-c1">TRAVEL IS</span><span id="dq-c2"> STRONGLY DISCOURAGED</span></div></div>

</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  /* credit is NOT hidden: it is there from frame 0 */
  tl.set(["#dq-card", "#dq-chip", "#dq-sa", "#dq-sb", "#dq-c2"], { autoAlpha: 0 }, 0);
  tl.set([1,2,3,4,5].map(function(i) { return "#dq-w" + i; }), { autoAlpha: 0 }, 0);

  /* whole-window float so something always moves: 10 x 1.51 s = 15.1 s >= 15.03 */
  tl.fromTo("#dq-stack", { y: 0 }, { y: -3, duration: 1.51, ease: "sine.inOut", yoyo: true, repeat: 9 }, 0);

  /* "Polonkars" @3.52: card shell + attribution in, quote words hidden; S-A in */
  tl.fromTo("#dq-card", { y: 24, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 3.52);
  tl.fromTo("#dq-sa", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.52);

  /* words: may 5.02, have 5.72, perished 5.94, living 6.32, alone. 6.60 */
  const T = [5.02, 5.72, 5.94, 6.32, 6.60];
  T.forEach(function(t, i) {
    tl.fromTo("#dq-w" + (i + 1), { autoAlpha: 0, y: 6 }, { autoAlpha: 1, y: 0, duration: 0.14, ease: "power2.out" }, t);
  });

  /* before "The Weather Service" @7.50: card + S-A out */
  tl.to(["#dq-card", "#dq-sa"], { x: 980, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 7.10);

  /* "Weather Service warning" @7.60: S-B in */
  tl.fromTo("#dq-sb", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 7.60);

  /* "travel" @8.94: chip in with TRAVEL IS */
  tl.fromTo("#dq-chip", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 8.94);
  /* "strongly discouraged" @9.60 */
  tl.fromTo("#dq-c2", { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power2.out" }, 9.60);

  /* after "advice." @12.04: chip out; S-B stays over the question */
  tl.to("#dq-chip", { x: -80, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 12.30);

  /* after "home?" @14.54: S-B and credit fade as the index fades toward the Act 5 blackout (host end 15.03) */
  tl.to(["#dq-sb", "#dq-credit"], { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 14.43);

  window.__timelines["g-a4-11-door-quote"] = tl;
})();
</script>
