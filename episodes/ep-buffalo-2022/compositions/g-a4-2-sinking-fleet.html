  /* "same thing on the emergency side" @4.24 to 5.34: 8 plows sink in index order */

  /* "froze" @8.36: frost rings + sheen on all 10 engines */
  frost.forEach((el, i) => tl.fromTo(el, { autoAlpha: 0, scale: 0.6 }, { autoAlpha: 1, scale: 1, svgOrigin: (E_X[i] + 55) + " 624", duration: 0.4, ease: "back.out(1.4)" }, 8.36 + 0.03 * i));

  /* "most" @11.06: chip in, MOST punches */
  tl.fromTo("#sf-chip", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.45, ease: "power3.out" }, 11.06);
  tl.fromTo("#sf-chip-a", { scale: 1.3 }, { scale: 1, transformOrigin: "left center", duration: 0.4, ease: "power4.out" }, 11.06);

  /* "most of the Buffalo Fire Department's own trucks were stuck too" @11.20 to 13.18: 7 engines sink */
  const puff2 = [$("sf-pa2"), $("sf-pb2")];
  E_SINK.forEach((i, k) => sink(eIn[i], E_X[i] + 55, 656, E_T[k], k, puff2, "#8e2020"));  /* @11.20 + 0.33 k */

  /* "Buffalo" @11.46: row 2 label */
  tl.fromTo("#sf-lab2", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.46);

  /* after "too." @13.48: chip + source out */
  tl.to(["#sf-chip", "#sf-src"], { x: -80, autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 13.90);

  /* "If" @14.22: rows and drifts dim, labels out */
  tl.to(["#sf-row1", "#sf-row2"], { opacity: 0.18, duration: 0.5, ease: "power2.inOut" }, 14.22);
  tl.to(["#sf-lab1", "#sf-lab2"], { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" }, 14.22);

  /* "plow" @14.48: lane, mound and half-buried plow */
  tl.fromTo("#sf-street", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 14.48);

  /* "ambulance" @16.38: drives in, front edge 120 -> 840 */
  tl.fromTo("#sf-amb", { x: -720, autoAlpha: 0, rotation: 0 }, { x: 0, autoAlpha: 1, rotation: 0, svgOrigin: "757.5 600", duration: 0.56, ease: "power3.out" }, 16.38);
  /* "no way" @16.94: a small rock as it stops */
  tl.to("#sf-amb", { rotation: -1.5, svgOrigin: "757.5 600", duration: 0.15, ease: "power2.out" }, 16.94);
  tl.to("#sf-amb", { rotation: 0, svgOrigin: "757.5 600", duration: 0.15, ease: "power2.in" }, 17.09);

  /* wav end 17.90: hard cut into the S3 footage */
  tl.to({}, { duration: 0.01 }, 17.89);

  window.__timelines["g-a4-2-sinking-fleet"] = tl;
