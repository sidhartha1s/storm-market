<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-a4-3-day-chip (A4-S3, standard): one glass chip "DEC 26 · DAY 4" plus the DVIDS source pill.
  Overlay on DVIDS 7572837 (mounted by the orchestrator). Comp duration 12.26 s (a4-s3.wav).
  Cue times are seconds from the START of A4-S3 (audio/a4-s3.words.json). Family base: g-intro-2-toll-chips.
  Fallback if the ambulance sits lower-left at 3.0 s: change .dc-chip to left:auto; right:400px (orchestrator call).
-->
<template>
<style>
  #g-a4-3-day-chip-root { position:absolute; inset:0; overflow:hidden; pointer-events:none; background:transparent; font-family:Arial, sans-serif; }
  #dc-stack { position:absolute; inset:0; }
  .dc-chip { position:absolute; left:110px; bottom:110px; display:table; box-sizing:border-box; padding:22px 34px;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; opacity:0; visibility:hidden; }
  .dc-row { display:flex; flex-direction:row; align-items:baseline; white-space:nowrap; }
  .dc-date { display:block; font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:52px; line-height:1; color:#f2f5f8; }
  .dc-dot { display:block; font-family:Arial, sans-serif; font-weight:700; font-size:38px; line-height:1; color:#93a3b2; white-space:pre; }
  .dc-day { display:block; font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:38px; line-height:1; color:#e8c56a; }
  .dc-src { position:absolute; left:110px; bottom:54px; display:table; box-sizing:border-box; padding:5px 12px; white-space:nowrap;
    background:rgba(10,16,24,0.55); backdrop-filter:blur(18px) saturate(1.15); -webkit-backdrop-filter:blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:14px;
    font-family:Arial, sans-serif; font-weight:400; font-size:19px; line-height:1.3; color:#c8d3e0; opacity:0; visibility:hidden; }
</style>
<div id="g-a4-3-day-chip-root" data-composition-id="g-a4-3-day-chip" data-width="1920" data-height="1080">
  <div id="dc-stack">
    <div class="dc-chip" id="dc-chip"><div class="dc-row"><span class="dc-date" id="dc-date">DEC 26</span><span class="dc-dot" id="dc-dot"> · </span><span class="dc-day" id="dc-day">DAY 4</span></div></div>
    <div class="dc-src" id="dc-src">New York National Guard, DVIDS</div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  tl.set(["#dc-chip", "#dc-src"], { autoAlpha: 0 }, 0);

  /* whole-window float so something always moves: 9 x 1.5 s = 13.5 s >= 12.26 */
  tl.fromTo("#dc-stack", { y: 0 }, { y: -4, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 8 }, 0);

  /* chip + pill in. "National Guard" @0.00 / 0.44 */
  tl.fromTo("#dc-chip", { x: -60, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.4, ease: "power3.out" }, 0.05);
  tl.fromTo("#dc-src", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);

  /* DAY 4 lands as the ambulance is named. "ambulance" @2.42 */
  tl.fromTo("#dc-day", { scale: 1.25 }, { scale: 1, duration: 0.35, ease: "power4.out", transformOrigin: "left center", immediateRender: false }, 2.42);

  /* chip out after "anyone." @7.02; pill stays */
  tl.to("#dc-chip", { x: -80, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 6.8);

  /* pill out after "in." @11.92 (host end 12.26 - 0.6) */
  tl.to("#dc-src", { autoAlpha: 0, y: 10, duration: 0.6, ease: "power3.in" }, 11.66);

  window.__timelines["g-a4-3-day-chip"] = tl;
})();
</script>
</template>
</body>
</html>
