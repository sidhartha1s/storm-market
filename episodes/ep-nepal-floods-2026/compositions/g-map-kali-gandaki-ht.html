<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-map-kali-gandaki-ht", P = "#g-map-kali-gandaki-ht-";
  /* estimated at 175 wpm; HOST starts at CUE "The same storm" @est 4.1 (paragraph seconds). Local seconds: */
  const CUES = {
    himlung: 3.4, /* CUE "Himlung Himal" @est 3.4 */
    tibet: 5.5,   /* CUE "Tibet" @est 5.5 */
    camp: 10.0    /* CUE "base camp" @est 10.0 (cut to the WION clip) */
  };
  const DUR = 10.0;
  const tl = gsap.timeline({ paused: true });
  const kg = document.querySelector(P + "kg"), kgg = document.querySelector(P + "kgglow");
  const KLEN = Math.ceil(kg.getTotalLength()) + 1;
  /* camera: zoom about the Himlung pin; a string attr tween, as g-master-map does */
  const cam = (z) => ({ attr: { transform: "translate(" + (1162.1 - 1162.1 * z).toFixed(2) + "," + (383.9 - 383.9 * z).toFixed(2) + ") scale(" + z + ")" } });

  /* ---- initial state ---- */
  tl.set(P + "cam", cam(1), 0);
  tl.set([kg, kgg], { strokeDasharray: KLEN, strokeDashoffset: KLEN }, 0);
  tl.set([P + "t-nepal", P + "t-tibet", P + "t-river", P + "t-himlung", P + "pin", P + "ring"], { autoAlpha: 0 }, 0);

  /* ---- ambient, whole window ---- */
  tl.fromTo(P + "scan", { y: 40 }, { y: 1040, duration: 5, ease: "none", repeat: 1, yoyo: true }, 0);
  tl.to(P + "cam", Object.assign(cam(1.05), { duration: DUR, ease: "none" }), 0);
  tl.fromTo(P + "nepal", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);
  tl.fromTo(P + "src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 0.3);

  /* ---- river draws north ---- */
  tl.to([kg, kgg], { strokeDashoffset: 0, duration: 2.4, ease: "power2.inOut" }, 0.2);
  tl.fromTo(kgg, { attr: { "stroke-opacity": 0.22 } }, { attr: { "stroke-opacity": 0.5 }, duration: 1.2, ease: "sine.inOut", repeat: 5, yoyo: true }, 2.6);
  tl.fromTo(P + "t-nepal", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.6);
  tl.fromTo(P + "t-river", { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 1.2);

  /* ---- Himlung pin lands ---- */
  tl.fromTo(P + "pin", { autoAlpha: 0, y: -60 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "bounce.out" }, CUES.himlung);
  tl.fromTo(P + "ring", { autoAlpha: 0.9, attr: { r: 10 } }, { autoAlpha: 0, attr: { r: 46 }, duration: 1.1, ease: "power2.out", repeat: 4, repeatDelay: 0.2 }, CUES.himlung + 0.4);
  tl.fromTo(P + "t-himlung", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, CUES.himlung + 0.15);

  /* ---- Tibet: the border lights and marches ---- */
  tl.to(P + "border", { attr: { "stroke-opacity": 1 }, duration: 0.4, ease: "power2.out" }, CUES.tibet);
  tl.fromTo(P + "border", { strokeDashoffset: 0 }, { strokeDashoffset: -64, duration: DUR - CUES.tibet, ease: "none" }, CUES.tibet);
  tl.fromTo(P + "t-tibet", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUES.tibet + 0.1);

  window.__timelines[ID] = tl;
})();
</script>
