<script>
window.__timelines = window.__timelines || {};
(function () {
  /* 4 x 4 worker icons, 64 px in a 90 px cell (rail-local x 0-334, y 310-644) */
  const box = document.getElementById("sc-icons");
  const icons = [], shapes = [];
  for (let i = 0; i < 16; i++) {
    const el = document.createElement("div");
    el.className = "sc-ic";
    el.style.left = ((i % 4) * 90) + "px";
    el.style.top = (Math.floor(i / 4) * 90) + "px";
    el.innerHTML = '<svg viewBox="0 0 64 64"><circle cx="32" cy="15" r="11" fill="#dfe7ee" stroke="#dfe7ee" stroke-width="0"/>' +
                   '<path d="M14 62 Q14 32 32 30 Q50 32 50 62 Z" fill="#dfe7ee" stroke="#dfe7ee" stroke-width="0"/></svg>';
    box.appendChild(el);
    icons.push(el);
    shapes.push(Array.from(el.querySelectorAll("circle, path")));
  }
  const found = icons.slice(0, 4), missing = icons.slice(4);
  const foundShapes = [].concat(...shapes.slice(0, 4)), missShapes = [].concat(...shapes.slice(4));

  const tl = gsap.timeline({ paused: true });
  const DUR = 19.735;
  const dash = (id) => { const p = document.getElementById(id); return Math.ceil(p.getTotalLength()) + 1; };
  const GL = dash("sc-ground"), DV = dash("sc-dimv");
  tl.set(["#sc-heli", "#sc-dig1", "#sc-dig2", "#sc-dig3", "#sc-lcamp", "#sc-dim", "#sc-l6", "#sc-hdim", "#sc-dimline",
          "#sc-cnum", "#sc-clab", "#sc-r1", "#sc-r2", "#sc-human"], { autoAlpha: 0 }, 0);
  tl.set(icons, { autoAlpha: 0 }, 0);
  tl.set("#sc-ground", { strokeDasharray: GL, strokeDashoffset: GL }, 0);
  tl.set("#sc-dimv", { strokeDasharray: DV, strokeDashoffset: DV }, 0);
  tl.set("#sc-snow", { scaleY: 0, svgOrigin: "700 880" }, 0);
  tl.set("#sc-ghost", { autoAlpha: 0 }, 0);
  tl.set("#sc-trench", { scaleY: 0, svgOrigin: "680 552" }, 0);
  tl.set("#sc-heli", { x: 1900, y: 220, rotation: 0 }, 0);

  /* ambient, whole window: grid + glow drift, snow flecks falling through the left scene */
  tl.fromTo("#sc-grid", { x: 0 }, { x: 240, duration: DUR, ease: "none" }, 0);
  tl.fromTo("#sc-glow", { x: 0, y: 0 }, { x: 160, y: -40, duration: DUR, ease: "none" }, 0);
  ["#sc-f1", "#sc-f2", "#sc-f3", "#sc-f4", "#sc-f5", "#sc-f6", "#sc-f7", "#sc-f8", "#sc-f9", "#sc-f10", "#sc-f11", "#sc-f12"].forEach((f, i) => {
    const d = 2.6 + (i % 4) * 0.45;
    tl.fromTo(f, { y: 60 + (i % 3) * 30, x: 0 }, { y: 860, x: (i % 2 ? 26 : -22), duration: d, ease: "none", repeat: Math.floor((DUR - 0.2 - i * 0.2) / d) - 1 }, 0.1 + i * 0.2);
  });

  /* the buried camp builds: ground, tents, then snow rising over them (0.1-1.5); BASE CAMP label on CAMP @1.42 */
  tl.to("#sc-ground", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.05);
  tl.fromTo("#sc-tents", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.2);
  tl.to("#sc-snow", { scaleY: 1, svgOrigin: "700 880", duration: 1.0, ease: "power2.out" }, 0.6);
  tl.to("#sc-ghost", { autoAlpha: 1, duration: 0.3 }, 1.4);
  tl.fromTo("#sc-human", { autoAlpha: 0, y: -30 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 1.3);
  tl.fromTo("#sc-lcamp", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.42);

  /* HELICOPTER @0.36: flies in from x 1900 to x 900 along y 220 (1.5 s), hovers with a rotor wobble, leaves on NEXT DAY @3.40 */
  tl.set("#sc-heli", { autoAlpha: 1 }, 0.36);
  tl.to("#sc-heli", { x: 900, duration: 1.5, ease: "power2.out" }, 0.36);
  tl.fromTo("#sc-helibody", { rotation: -8, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 1.5, ease: "power2.out" }, 0.36);
  tl.fromTo("#sc-rotor", { scaleX: 1, svgOrigin: "0 -54" }, { scaleX: 0.15, svgOrigin: "0 -54", duration: 0.07, ease: "none", yoyo: true, repeat: 59 }, 0.36);
  tl.to("#sc-heli", { y: 234, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.86);
  tl.to("#sc-heli", { x: -300, y: 120, duration: 1.1, ease: "power2.in" }, 3.4);
  tl.set("#sc-heli", { autoAlpha: 0 }, 4.5);

  /* GROUND TEAM @4.32: three diggers drop onto the snow top; DUG @6.44 the trench opens down to DEEP @8.18 */
  tl.fromTo(["#sc-dig1", "#sc-dig2", "#sc-dig3"], { autoAlpha: 0, y: -40 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out", stagger: 0.14 }, 4.32);
  tl.fromTo("#sc-sh1", { rotation: 0, svgOrigin: "592 470" }, { rotation: 18, svgOrigin: "592 470", duration: 0.32, ease: "sine.inOut", yoyo: true, repeat: 29 }, 6.3);
  tl.fromTo("#sc-sh2", { rotation: 0, svgOrigin: "768 470" }, { rotation: -18, svgOrigin: "768 470", duration: 0.36, ease: "sine.inOut", yoyo: true, repeat: 25 }, 6.44);
  tl.fromTo("#sc-sh3", { rotation: 0, svgOrigin: "872 470" }, { rotation: 16, svgOrigin: "872 470", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 29 }, 6.6);
  tl.to("#sc-trench", { scaleY: 1, svgOrigin: "680 552", duration: 1.74, ease: "power1.inOut" }, 6.44);
  /* ABOUT 15 FEET @7.54-7.96: the dimension line grows the full snow height, the label and the 6 ft reference */
  tl.set("#sc-dimline", { autoAlpha: 1 }, 7.54);
  tl.to("#sc-dimv", { strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, 7.54);
  tl.fromTo("#sc-dim", { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power4.out" }, 7.96);
  tl.fromTo(["#sc-hdim", "#sc-l6"], { autoAlpha: 0, x: -10 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 8.18);

  /* 16 @9.16: the rail's 4 x 4 workers and the counter (opens at 1, lands on 16 by 9.9) */
  tl.fromTo(icons, { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "back.out(2)", stagger: 0.04 }, 9.16);
  tl.fromTo(["#sc-cnum", "#sc-clab"], { autoAlpha: 0, x: 60 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 9.16);
  const c = { v: 1 };
  tl.to(c, { v: 16, duration: 0.74, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("sc-cnum"); if (e) e.textContent = Math.round(c.v);
  } }, 9.16);
  tl.to(icons, { y: -4, duration: 0.8, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: { each: 0.05, from: "random" } }, 10.2);

  /* FOUND 4 @13.66: four icons turn blue, the row lands */
  tl.to(foundShapes, { fill: "#7fb2e5", stroke: "#7fb2e5", duration: 0.35, ease: "power2.out" }, 13.66);
  tl.fromTo(found, { scale: 1 }, { scale: 1.15, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 13.66);
  tl.fromTo("#sc-r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 13.66);
  /* 12 ... MISSING @14.68-15.62: twelve icons take a red outline, the row lands */
  tl.to(missShapes, { fill: "rgba(231,76,60,0.16)", stroke: "#e74c3c", strokeWidth: 4, duration: 0.4, ease: "power2.out", stagger: 0.02 }, 14.68);
  tl.fromTo("#sc-r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 14.68);
  tl.to(missing, { y: -5, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 1, stagger: { each: 0.03, from: "random" } }, 15.4);
  /* SURVIVAL WAS VERY UNLIKELY @17.90: the twelve dim to 40 % over 1.5 s */
  tl.to(missing, { opacity: 0.4, duration: 1.5, ease: "power1.inOut" }, 17.9);

  /* exit: fade-through over the last 0.6 s */
  tl.to("#sc-all", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, DUR - 0.6);
  window.__timelines["g-search-card"] = tl;
})();
</script>
