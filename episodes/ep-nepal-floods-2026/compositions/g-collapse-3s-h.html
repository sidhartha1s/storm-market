<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-collapse-3s-h (Hook): a 3-second timer over the viral Kali Gandaki clip, timed to the VISIBLE slide, landing
     "3 SECONDS". Brief: mg_specs/g-collapse-3s-h.md; factcheck-A row 1 CONFIRMED ~3 s collapse.
     REDO 29 Sep 26: index.html must mount host-collapse-3s-h at data-start="22.0" data-duration="4.6" (was 19.9/4.2).
     The clip (v-h-collapse, 19.3-28.013) shows the slope intact until ~22.4 and sliding to ~25.3, so the fill and
     count now run abs 22.4-25.4 (local 0.4-3.4) ON the slide instead of before it. The pf-date popfig ends 22.5,
     so the chip (top-left) only fades in under its last 0.35 s, in a different zone.
     Layout: one glass chip row in the top-left zone (x 96-896, y 70-160); bar + 40 px readout inside it;
     "3 SECONDS" 96 px Abril at left 110, top 190 (x 110-~610), clear of the slide at x 656-1264. -->
<template>
<style>
  .c3h-wrap { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif; pointer-events:none; }
  .c3h-chip { position:absolute; left:96px; top:70px; width:800px; height:90px; box-sizing:border-box;
    border-radius:28px; background:rgba(10,16,24,.55); backdrop-filter:blur(18px) saturate(1.15);
    -webkit-backdrop-filter:blur(18px) saturate(1.15); border:1px solid rgba(255,255,255,.14); }
  .c3h-track { position:absolute; left:128px; top:105px; width:560px; height:20px; border-radius:10px; background:rgba(147,163,178,.28); }
  .c3h-fill { position:absolute; left:128px; top:105px; width:560px; height:20px; border-radius:10px; background:#d0121f; }
  .c3h-read { position:absolute; left:716px; top:91px; font-family:'Courier New', monospace; font-weight:700; font-size:40px; line-height:48px;
    color:#f2f5f8; white-space:nowrap; }
  .c3h-land { position:absolute; left:110px; top:190px; font-family:'AbrilFig', Georgia, serif; font-size:96px; line-height:1.1; color:#d0121f;
    text-shadow:0 4px 18px rgba(0,0,0,.7); white-space:nowrap; }
</style>
<div class="c3h-wrap" data-composition-id="g-collapse-3s-h" data-width="1920" data-height="1080" data-duration="4.6">
  <div class="c3h-chip" id="c3h-chip"></div>
  <div class="c3h-track" id="c3h-track"></div>
  <div class="c3h-fill" id="c3h-fill"></div>
  <div class="c3h-read" id="c3h-read">0.0 S</div>
  <div class="c3h-land" id="c3h-land">3 SECONDS</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const D = 4.6;
  const state = { t: 0 };
  const CHIP = ["#c3h-chip", "#c3h-track", "#c3h-fill", "#c3h-read"];

  tl.set(CHIP, { autoAlpha: 0, y: 0 }, 0);
  tl.set("#c3h-land", { autoAlpha: 0, scale: 1.4, y: 0, transformOrigin: "left center" }, 0);
  tl.set("#c3h-fill", { scaleX: 0, transformOrigin: "left center" }, 0);

  /* chip in @0.15 (abs 22.15), slides down 12 px as it lands */
  tl.fromTo(CHIP, { autoAlpha: 0, y: -12 }, { autoAlpha: 1, y: 0, duration: 0.25, ease: "power3.out" }, 0.15);

  /* fill + count 0.4-3.4 (abs 22.4-25.4): the slide itself, monotonic, readout matched every frame */
  tl.to("#c3h-fill", { scaleX: 1, duration: 3.0, ease: "none" }, 0.4);
  tl.to(state, {
    t: 3.0, duration: 3.0, ease: "none",
    onUpdate: function () {
      const el = document.getElementById("c3h-read");
      if (el) el.textContent = state.t.toFixed(1) + " S";
    }
  }, 0.4);

  /* "3 SECONDS" lands @3.45, after the readout reads 3.0 S, and holds to 4.1 */
  tl.fromTo("#c3h-land", { autoAlpha: 0, scale: 1.4 }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power4.out" }, 3.45);
  tl.to("#c3h-land", { scale: 1.05, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 1 }, 3.72);

  /* exit 4.1-4.5: everything slides up and fades, done 0.1 s before D */
  tl.to(CHIP.concat("#c3h-land"), { y: -24, autoAlpha: 0, duration: 0.4, ease: "power3.in" }, 4.1);
  tl.to({}, { duration: 0.01 }, D - 0.01);
  window.__timelines["g-collapse-3s-h"] = tl;
})();
</script>
</template>
</body>
</html>
