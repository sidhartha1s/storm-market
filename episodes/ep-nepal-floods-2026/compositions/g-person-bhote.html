<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-person-bhote (A3): text-only person card in the RIGHT RAIL, track 4, host 427.9 + 11.36 (nx-a3-s4), over the full-frame
     g-basecamp-diagram. Rebuilt 29 Sep 26 (redo list): the card used to sit lower-left on top of the buried tents and the
     BASE CAMP label the previous line described, and laid a full-frame grid over the diagram; both are gone. It now takes
     the rail the diagram vacates at 32.9 (diagram-local), so the diagram's camp stays visible.
     Placement: left 1250, width 574, padding 34/40 (494 inner). The redo list gives top 560 AND "nothing enters the
     corner x>=1600, y>=680"; a 574-wide card at top 560 would reach y ~790 inside that corner, so the card sits at top 430
     (bottom ~ 675) to keep the corner clear. No photo, no monogram (mg-quickref person-card rule).
     Cues (retime-sheet g-person-bhote): Pasang 1.14, climbing 2.61, east 3.93, Nepal 4.46. Exit x 980 on the host end. -->
<template>
<style>
  .pb-wrap { position:absolute; inset:0; overflow:hidden; font-family: Arial, sans-serif; color:#f2f5f8; }
  .pb-card { position:absolute; left:1250px; top:430px; width:574px; padding:34px 40px; box-sizing:border-box; overflow:hidden;
    background: rgba(10,16,24,0.55); backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15);
    border:1px solid rgba(255,255,255,0.14); border-radius:28px; box-shadow:0 30px 90px rgba(0,0,0,0.5); }
  .pb-name { font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:60px; line-height:70px; color:#f2f5f8; white-space:nowrap; }
  .pb-role { font-family: Georgia, 'Times New Roman', serif; font-style:italic; font-size:32px; line-height:40px; color:#d8a13a; margin-top:6px; white-space:nowrap; }
  .pb-org { font-weight:700; font-size:26px; line-height:32px; color:#93a3b2; margin-top:10px; white-space:nowrap; }
  .pb-under { height:3px; margin-top:16px; background:#7fb2e5; }
  .pb-beam { position:absolute; top:0; bottom:0; left:0; width:160px; background:linear-gradient(90deg, transparent, rgba(127,178,229,0.13), transparent); }
</style>
<div class="pb-wrap" data-composition-id="g-person-bhote" data-width="1920" data-height="1080" data-duration="11.36">
  <div class="pb-card" id="pb-card">
    <div class="pb-beam" id="pb-beam"></div>
    <div class="pb-name" id="pb-name">Pasang Bhote</div>
    <div class="pb-role" id="pb-role">Climbing guide</div>
    <div class="pb-org" id="pb-org">From the far east of Nepal</div>
    <div class="pb-under" id="pb-under"></div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const DUR = 11.36;
  tl.set(["#pb-card", "#pb-role", "#pb-org"], { autoAlpha: 0 }, 0);
  tl.set("#pb-under", { scaleX: 0, transformOrigin: "left center" }, 0);

  /* PASANG @1.14: the card slides into the rail with the name (in by 1.44) */
  tl.fromTo("#pb-card", { x: 660, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.74);
  /* ambient: the beam sweeps the card for the rest of the window, the card floats */
  tl.fromTo("#pb-beam", { x: -160 }, { x: 600, duration: 2.0, ease: "none", repeat: 4 }, 1.3);
  tl.to("#pb-card", { y: -6, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.6);
  /* CLIMBING @2.61 */
  tl.fromTo("#pb-role", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 2.61);
  /* EAST @3.93: the origin line, the underline draws 3.9-5.5 */
  tl.fromTo("#pb-org", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.93);
  tl.to("#pb-under", { scaleX: 1, duration: 1.6, ease: "power1.inOut" }, 3.9);

  /* exit: slide out on the host end (D - 0.6 -> D) */
  tl.to("#pb-card", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, DUR - 0.6);
  window.__timelines["g-person-bhote"] = tl;
})();
</script>
</template>
</body>
</html>
