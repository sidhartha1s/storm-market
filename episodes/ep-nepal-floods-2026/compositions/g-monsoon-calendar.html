<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-monsoon-calendar (A2 open): June-October bar, onset mid-June, normal withdrawal early October, a red pin
     lands on Sept 27 near the tail of the season (mg_specs/g-monsoon-calendar.md). Facts: factcheck-B#2 (normal
     onset ~June 13, normal withdrawal ~Oct 2, DHM-derived). Axis: 360 px/month, June=240 .. Oct=1680.
     Retimed to real words, retime-sheet g-monsoon-calendar host now 229.001 plus 17.391 (0.2s earlier start at the
     blackout end, voice still starts at comp-local 0.2, so every sheet word time +0.2). Duration 17.391s declared. -->
<template>
<style>
  #gmc-root { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 50% 45%, #0b1016 0%, #030507 78%); }
  .gmc-svg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
  .gmc-mo { font-family:Arial, sans-serif; font-weight:700; font-size:22px; fill:#93a3b2; letter-spacing:3px; }
  .gmc-tag { font-family:Arial, sans-serif; font-weight:700; font-size:28px; letter-spacing:3px; }
  .gmc-pinlab { font-family:'Arial Black', Arial, sans-serif; font-size:52px; fill:#f2f5f8; }
</style>
<div id="gmc-root" data-composition-id="g-monsoon-calendar" data-width="1920" data-height="1080" data-duration="17.391">
  <svg class="gmc-svg" viewBox="0 0 1920 1080">
    <rect id="gmc-wetband" x="420" y="770" width="1284" height="20" fill="rgba(90,118,143,0.18)"/>
    <line id="gmc-axis" x1="240" y1="780" x2="1680" y2="780" stroke="#5a768f" stroke-width="3"/>
    <rect id="gmc-sweep" x="240" y="768" width="46" height="24" rx="6" fill="#bcd6ef" opacity="0.55"/>
    <g id="gmc-ticks">
      <line x1="240" y1="770" x2="240" y2="790" stroke="#3d5366" stroke-width="2"/>
      <line x1="600" y1="770" x2="600" y2="790" stroke="#3d5366" stroke-width="2"/>
      <line x1="960" y1="770" x2="960" y2="790" stroke="#3d5366" stroke-width="2"/>
      <line x1="1320" y1="770" x2="1320" y2="790" stroke="#3d5366" stroke-width="2"/>
      <line x1="1680" y1="770" x2="1680" y2="790" stroke="#3d5366" stroke-width="2"/>
    </g>
    <text class="gmc-mo" x="240" y="820" text-anchor="middle">JUNE</text>
    <text class="gmc-mo" x="600" y="820" text-anchor="middle">JULY</text>
    <text class="gmc-mo" x="960" y="820" text-anchor="middle">AUG</text>
    <text class="gmc-mo" x="1320" y="820" text-anchor="middle">SEPT</text>
    <text class="gmc-mo" x="1680" y="820" text-anchor="middle">OCT</text>

    <line id="gmc-onsettick" x1="420" y1="740" x2="420" y2="780" stroke="#7fb2e5" stroke-width="4"/>
    <text class="gmc-tag" id="gmc-onsetlab" x="420" y="720" text-anchor="middle" fill="#7fb2e5">ONSET</text>

    <line id="gmc-withtick" x1="1704" y1="740" x2="1704" y2="780" stroke="#d8a13a" stroke-width="4"/>
    <text class="gmc-tag" id="gmc-withlab" x="1704" y="720" text-anchor="end" fill="#d8a13a">NORMAL WITHDRAWAL</text>

    <path id="gmc-pin" d="M1644,600 C1644,600 1614,650 1644,690 C1674,650 1644,600 1644,600 Z" fill="#d0121f"/>
    <circle id="gmc-pindot" cx="1644" cy="628" r="8" fill="#f2f5f8"/>
    <text class="gmc-pinlab" id="gmc-pinlab" x="1644" y="570" text-anchor="middle">SEPT 27</text>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-monsoon-calendar", P = "#gmc-";
  const DUR = 17.391;
  const tl = gsap.timeline({ paused: true });
  tl.set([P+"onsettick", P+"onsetlab", P+"withtick", P+"withlab", P+"pin", P+"pindot", P+"pinlab", P+"wetband"], { autoAlpha: 0 }, 0);
  tl.set([P+"axis", P+"wetband"], { scaleX: 0, transformOrigin: "left center" }, 0);
  tl.set(P+"ticks", { autoAlpha: 0 }, 0);
  tl.set(P+"pin", { y: -60, svgOrigin: "1644 690" }, 0);
  tl.set(P+"sweep", { autoAlpha: 0, x: 0 }, 0);

  /* whole window: the wet band breathes slowly */
  tl.to(P+"wetband", { opacity: 0.12, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 6 }, 3.2);

  /* ambient: a highlight sweeps the axis end-to-end, continuously, so the 6.5-14.5s hold (between the
     withdrawal-tag reveal and the pin drop) is never pixel-static */
  tl.to(P+"sweep", { autoAlpha: 0.55, duration: 0.3 }, 1.0);
  tl.to(P+"sweep", { x: 1394, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 1.0);

  /* real word "Nepal" @0.20 (host now starts 0.2s earlier at blackout end, voice still @comp-local 0.2): Nepal
     gets most of its rain from the summer monsoon */
  tl.to(P+"axis", { scaleX: 1, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.2);
  tl.to(P+"wetband", { scaleX: 1, autoAlpha: 1, duration: 0.7, ease: "power3.out" }, 0.4);
  tl.fromTo(P+"ticks", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 0.8);

  /* real words "mid" @4.38 / "-June," @4.56: which usually arrives in mid June */
  tl.fromTo([P+"onsettick", P+"onsetlab"], { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.41);

  /* real words "early" @6.28 / "October." @6.56: and starts leaving in early October */
  tl.fromTo([P+"withtick", P+"withlab"], { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.41);

  /* real word "hillsides" @9.26: the hillsides have been soaking for more than three months */
  tl.to(P+"wetband", { opacity: 0.4, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 9.11);

  /* real word "holding" @14.20: holding more water than at any other time — the pin drops */
  tl.to(P+"pin", { autoAlpha: 1, y: 0, duration: 0.5, ease: "bounce.out" }, 14.05);
  tl.to(P+"pindot", { autoAlpha: 1, duration: 0.3 }, 14.35);
  tl.fromTo(P+"pinlab", { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 14.45);

  /* exit, finishes by D - 0.1 */
  tl.to([P+"axis", P+"wetband", P+"ticks", P+"onsettick", P+"onsetlab", P+"withtick", P+"withlab", P+"pin", P+"pindot", P+"pinlab", P+"sweep"],
        { x: 660, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 16.65);
  window.__timelines[ID] = tl;
})();
</script>
</template>
</body>
</html>
