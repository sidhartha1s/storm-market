     REDO 29 Sep 26: the old lone triangle left the right 750 px empty. This now uses g-basecamp-diagram-z's full-width
     ridge geometry (same far ridge, ridge path, summit (760,150), snow cap, avalanche tongue, 5 tents at the base), so the
     cut into z at 754.452 reads as the same mountain with the light changing. Dawn: a warm light band sweeps the ridge
     face left to right over the 3 s (gradient rect clipped to the ridge), spindrift streams off the summit (finite
     repeats), tent windows glow. Only text: "CAMP 1" (26 px) at a ring on the ridge. No exit: it cuts straight to z. -->
<template>

      <linearGradient id="gbda6-band" x1="0" y1="0" x2="1" y2="0">

      <clipPath id="gbda6-ridgeclip">

      <path d="M0,720 L90,610 L170,640 L260,520 L350,560 L450,400 L540,430 L640,260 L700,200 L760,150 L820,210 L880,250 L950,330 L1010,300 L1090,380 L1180,360 L1290,450 L1400,420 L1520,520 L1640,490 L1760,580 L1920,540 L1920,1080 L0,1080 Z"

<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-basecamp-diagram-a6", P = "#gbda6-";
  const DUR = 3;
  const tl = gsap.timeline({ paused: true });
  const FLECKS = gsap.utils.toArray(P + "drift circle");

  /* whole 3 s: slow drift so the frame never sits still; everything is revealed at t=0 (a hold, not a build) */
  tl.fromTo(P + "scene", { scale: 1, x: 0, svgOrigin: "760 600" }, { scale: 1.02, x: -8, duration: DUR, ease: "none" }, 0);
  /* dawn band crosses the ridge face left to right, x -520 -> 1920 over the 3 s */
  tl.fromTo(P + "band", { x: -520 }, { x: 1920, duration: DUR, ease: "none" }, 0);
  /* the summit snow warms as the light arrives */
  tl.fromTo(P + "cap", { fill: "#f4e9d8" }, { fill: "#f6cf94", duration: 1.6, ease: "sine.inOut" }, 0.4);
  /* tent windows flicker, lit */
  tl.fromTo(".gbda6-win", { opacity: 1 }, { opacity: 0.7, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: 0.12 }, 0);  /* last ends 2.48 */
  /* spindrift streams east off the summit: each fleck 0.9 s, repeat 2, staggered 0.03 -> last ends 2.97 */
  FLECKS.forEach(function (c, i) {
    tl.fromTo(c, { x: 0, y: 0, opacity: 0.9 },
      { x: 150 + (i % 4) * 30, y: -14 + (i % 3) * 12, opacity: 0, duration: 0.9, ease: "power1.out", repeat: 2 }, i * 0.03);
  });
  window.__timelines[ID] = tl;
})();
</script>
