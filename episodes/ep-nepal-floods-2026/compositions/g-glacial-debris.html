     Cues (retime-sheet g-glacial-debris): Kaligandaki's 0.52, walls 1.38, covered 4.44, glacial 5.18, debris 5.60,
     ancient 8.28, glaciers 8.62, dragged 9.02, downhill 9.44, melted 10.72, never 12.22, cemented 12.22-12.72, solid 12.88,

<div class="gd-wrap" data-composition-id="g-glacial-debris" data-width="1920" data-height="1080" data-duration="17.771">

      <path d="M60 420 L300 560 M40 640 L480 820 M120 900 L560 1000 M1860 420 L1620 560 M1880 640 L1440 820" stroke="rgba(147,163,178,0.12)" stroke-width="3" fill="none"/>

    <g id="gd-c2"><polygon points="305,390 500,568 540,524 345,346" fill="url(#gd-tan)" stroke="#b89565" stroke-width="2"/><g id="gd-p2" fill="#c9a877" stroke="#6b4f2c" stroke-width="2"></g></g>
    <g id="gd-c3"><polygon points="500,568 695,745 735,701 540,524" fill="url(#gd-tan)" stroke="#b89565" stroke-width="2"/><g id="gd-p3" fill="#c9a877" stroke="#6b4f2c" stroke-width="2"></g></g>

    <!-- water streaks racing down through the mantle only -->

<script>
window.__timelines = window.__timelines || {};
(function () {
  /* 20 pebbles on the mantle's mid-line M(t) = (130 + 780t, 191 + 709t), t 0.06-0.96, jittered along the normal;
     each goes into the chunk it lies on so it slumps with it */
  const pebs = [];
  for (let i = 0; i < 20; i++) {
    const t = 0.06 + i * 0.0474;
    const j = ((i * 7) % 5 - 2) * 4;               // -8..8 px along the outward normal
    const cx = 130 + 780 * t + j * 0.67, cy = 191 + 709 * t - j * 0.74;
    const chunk = Math.min(4, Math.floor(t / 0.25) + 1);
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", cx.toFixed(1)); c.setAttribute("cy", cy.toFixed(1)); c.setAttribute("r", String(7 + (i % 3) * 2));
    document.getElementById("gd-p" + chunk).appendChild(c);
    pebs.push(c);
  }

  const tl = gsap.timeline({ paused: true });
  const D = 17.771;
  const CH = ["#gd-c1", "#gd-c2", "#gd-c3", "#gd-c4"];
  const ST = gsap.utils.toArray("#gd-streaks .gd-st");
  const lead = document.getElementById("gd-lead"); const LL = Math.ceil(lead.getTotalLength()) + 1;
  tl.set(["#gd-head", "#gd-ldeb", "#gd-lbed", "#gd-lgla", "#gd-schem", "#gd-river", "#gd-glacier", "#gd-hatchl", "#gd-leaddot", "#gd-dust"], { autoAlpha: 0 }, 0);
  tl.set(CH, { autoAlpha: 0 }, 0);
  tl.set(pebs, { autoAlpha: 0 }, 0);
  tl.set(ST, { autoAlpha: 0 }, 0);
  tl.set("#gd-lead", { strokeDasharray: LL, strokeDashoffset: LL }, 0);
  tl.set("#gd-glacier", { scaleY: 0, svgOrigin: "960 925" }, 0);

  /* ambient, whole window: glow drift, river highlights flowing */
  tl.fromTo("#gd-glow", { x: 0, y: 0 }, { x: -140, y: -30, duration: D, ease: "none" }, 0);
  tl.fromTo("#gd-rhl", { x: 0 }, { x: 80, duration: 0.9, ease: "none", repeat: 17 }, 1.4);
  tl.fromTo("#gd-rhl2", { x: 90 }, { x: 0, duration: 1.2, ease: "none", repeat: 12 }, 1.5);

  /* KALIGANDAKI'S @0.52: the name; WALLS @1.38: both walls reveal top to bottom (0.8 s), the river fills */
  tl.fromTo("#gd-head", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.52);
  tl.to("#gd-wallrect", { attr: { height: 1080 }, duration: 0.8, ease: "power2.inOut" }, 1.38);
  tl.fromTo("#gd-river", { autoAlpha: 0, scaleX: 0, svgOrigin: "960 952" }, { autoAlpha: 1, scaleX: 1, svgOrigin: "960 952", duration: 0.5, ease: "power3.out" }, 1.9);
  tl.fromTo("#gd-schem", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, 2.4);

  /* GLACIAL @5.18 / DEBRIS @5.60: the mantle drapes down the left face chunk by chunk, the label in the open air */
  tl.fromTo(CH, { autoAlpha: 0, x: 40, y: -44 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.18 }, 5.18);
  tl.fromTo("#gd-ldeb", { autoAlpha: 0, y: -14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 5.6);
  tl.to("#gd-lead", { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, 5.7);
  tl.fromTo("#gd-leaddot", { autoAlpha: 0, scale: 0, svgOrigin: "556 546" }, { autoAlpha: 1, scale: 1, svgOrigin: "556 546", duration: 0.25, ease: "back.out(3)" }, 6.05);

  /* ANCIENT GLACIERS @8.28-8.62: a translucent glacier fills the gorge to y 420; DRAGGED DOWNHILL @9.02-9.44: it slides
     down-valley (x +300, y +80); MELTED @10.72: it fades and drops its 20 pebbles onto the face */
  tl.to("#gd-glacier", { autoAlpha: 1, scaleY: 1, svgOrigin: "960 925", duration: 0.6, ease: "power3.out" }, 8.28);
  tl.fromTo("#gd-lgla", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 8.62);
  tl.to("#gd-lgla", { autoAlpha: 0, duration: 0.25 }, 8.95);
  tl.to("#gd-glacier", { x: 300, y: 80, duration: 1.2, ease: "power2.inOut" }, 9.02);
  tl.to("#gd-glacier", { autoAlpha: 0, duration: 0.8, ease: "power1.in" }, 10.72);
  tl.fromTo(pebs, { autoAlpha: 0, x: 70, y: -110 }, { autoAlpha: 1, x: 0, y: 0, duration: 0.5, ease: "power2.in", stagger: 0.035 }, 10.72);

  /* NEVER CEMENTED @12.22-12.72: the pebbles jiggle loose; INTO SOLID ROCK @12.88-13.24: the bedrock hatches, its label */
  tl.to(pebs, { x: 3, y: -3, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 11, stagger: { each: 0.02, from: "random" } }, 12.22);
  tl.to("#gd-hatchl", { autoAlpha: 1, duration: 0.5, ease: "power1.out" }, 12.88);
  tl.fromTo("#gd-lbed", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 13.24);

  /* WATER MOVES THROUGH IT FAST @14.20-15.20: eight blue streaks race down the mantle only (0.55 s per pass) */
  ST.forEach(function (s, i) {
    tl.set(s, { autoAlpha: 1 }, 14.2 + i * 0.07);
    tl.fromTo(s, { x: 0, y: 0 }, { x: 790, y: 718, duration: 0.55, ease: "power1.in", repeat: 2 }, 14.2 + i * 0.07);
    tl.set(s, { autoAlpha: 0 }, 14.2 + i * 0.07 + 1.65);
  });

  /* GIVES WAY FAST @16.06-16.64: the mantle slumps down-face into the river, bottom chunk first, dust puffs */
  tl.to("#gd-c4", { x: 70, y: 64, rotation: 6, svgOrigin: "812 812", duration: 0.45, ease: "power2.in" }, 16.06);
  tl.to("#gd-c3", { x: 150, y: 136, rotation: 8, svgOrigin: "617 634", duration: 0.55, ease: "power2.in" }, 16.14);
  tl.to("#gd-c2", { x: 210, y: 190, rotation: 5, svgOrigin: "422 457", duration: 0.6, ease: "power2.in" }, 16.22);
  tl.to("#gd-c1", { x: 250, y: 226, rotation: 4, svgOrigin: "227 280", duration: 0.62, ease: "power2.in" }, 16.3);
  tl.to(["#gd-ldeb", "#gd-lead", "#gd-leaddot"], { autoAlpha: 0, duration: 0.3 }, 16.1);
  tl.fromTo(["#gd-d1", "#gd-d2", "#gd-d3"], { autoAlpha: 0.9, scale: 0.3, transformOrigin: "50% 50%" }, { autoAlpha: 0, scale: 2.4, duration: 1.0, ease: "power2.out", stagger: 0.08 }, 16.45);
  tl.set("#gd-dust", { autoAlpha: 1 }, 16.44);

  /* exit: fade-through over the last 0.6 s */
  tl.to("#gd-all", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, D - 0.6);
  window.__timelines["g-glacial-debris"] = tl;
})();
</script>
