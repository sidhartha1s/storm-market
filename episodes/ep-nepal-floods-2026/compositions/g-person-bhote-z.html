<script>
window.__timelines = window.__timelines || {};
(function () {

  tl.set("#pbz-rule", { scaleX: 0, transformOrigin: "left center" }, 0);

  tl.fromTo("#pbz-beam", { x: -140 }, { x: 700, duration: 1.6, ease: "none", repeat: 1 }, 0.3);

  /* card in, then PASANG @0.73: the name lands on the word; role and origin follow */
