<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!-- g-toll-counter (I, "What fell", 0:22): RHS stat panel over Lallantop river/rescue b-roll, muted.
     Source: episodes/ep-nepal-floods-2026/mg_specs/g-toll-counter.md. Library base: library/inhouse/stat-panel.html,
     retuned to two counter rows (agency count, then the moved press count).
     Redo 29 Sep 26 (Opus): row 1 split so MISSING never shows a false 0 (hidden until 6.05, lands 7 on "seven" 6.32);
     every counter opens on 1, never 0; headline weight 900 (render host substitutes 'Arial Black');
     hard-edged amber beam replaced by a soft centre-weighted band.
     Cues (retime sheet, host 21.359+10.901): headline 0.3, LIVES LOST 3.17 -> "12" @3.68, MISSING 6.05 -> "seven" @6.32,
     row 2 7.87 ("Later" 8.02) -> "24." @9.70, exit 10.2-10.8. Duration 10.901s. -->
<template>
<style>
  #toll-counter-root { position:absolute; inset:0; font-family: Arial, sans-serif; color:#f2f5f8; }
  .tc-panel { position:absolute; right:0; top:0; bottom:0; width:820px; box-sizing:border-box; overflow:hidden;
    background: linear-gradient(270deg, rgba(6,9,13,0.94) 72%, rgba(6,9,13,0)); padding: 90px 96px 0 170px; }
  .tc-hl { font-family:'Arial Black',Arial,sans-serif; font-weight:900; font-size:52px; color:#f2f5f8; line-height:1.05; }
  .tc-row { position:absolute; left:170px; }
  .tc-r1 { top:360px; } .tc-r2 { top:620px; }
  .tc-cnum { display:inline-block; font-family:'Courier New',monospace; font-weight:700; font-size:84px; color:#e74c3c; }
  .tc-clab { font-weight:700; font-size:20px; letter-spacing:6px; color:#c8d3e0; }
  .tc-cwrap { display:inline-block; margin-right:60px; text-align:left; vertical-align:top; }
  .tc-src { font-weight:700; font-size:19px; letter-spacing:4px; color:#93a3b2; margin-top:14px; }
  .tc-r2lab { font-weight:700; font-size:28px; letter-spacing:5px; color:#c8d3e0; margin-bottom:6px; }
  .tc-band { position:absolute; top:0; bottom:0; left:0; width:300px; pointer-events:none;
    background:linear-gradient(90deg, transparent, rgba(232,197,106,0.08) 50%, transparent); }
</style>
<div id="toll-counter-root" data-composition-id="g-toll-counter" data-width="1920" data-height="1080" data-duration="10.901">
  <div class="tc-panel" id="tc-panel">
    <div class="tc-band" id="tc-band"></div>
    <div class="tc-hl" id="tc-hl">What the day counted.</div>
    <div class="tc-row tc-r1" id="tc-r1">
      <span class="tc-cwrap" id="tc-w1"><span class="tc-cnum" id="tc-v1">1</span><div class="tc-clab">LIVES LOST</div></span><span class="tc-cwrap" id="tc-w2"><span class="tc-cnum" id="tc-v2">1</span><div class="tc-clab">MISSING</div></span>
      <div class="tc-src" id="tc-src1">NEPAL DISASTER AGENCY &middot; SEPT 27</div>
    </div>
    <div class="tc-row tc-r2" id="tc-r2">
      <div class="tc-r2lab" id="tc-r2lab">PRESS COUNTS UP TO</div>
      <span class="tc-cnum" id="tc-v3">1</span>
      <div class="tc-src" id="tc-src2">SEPT 28</div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const tl = gsap.timeline({ paused: true });
  const DUR = 10.901;
  tl.set(["#tc-hl", "#tc-r1", "#tc-w2", "#tc-r2"], { autoAlpha: 0 }, 0);

  /* panel entrance; a soft band drifts across the panel for the whole hold (no hard edge) */
  tl.fromTo("#tc-panel", { x: 660 }, { x: 0, duration: 0.7, ease: "power3.out" }, 0.0);
  tl.fromTo("#tc-band", { x: -300 }, { x: 820, duration: 3.2, ease: "none", repeat: 2 }, 0.7);

  tl.fromTo("#tc-hl", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.3);

  /* row 1 = LIVES LOST only, on "counted" @3.32; counter opens on 1 and lands "12" ON the word "12" @3.68 */
  tl.fromTo("#tc-r1", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 3.17);
  const c1 = { v: 1 }, c2 = { v: 1 }, c3 = { v: 1 };
  tl.to(c1, { v: 12, duration: 0.51, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("tc-v1"); if (e) e.textContent = Math.round(c1.v);
  } }, 3.17);
  /* the landed 12 breathes while the voice runs "people who didn't survive the storm" */
  tl.to("#tc-v1", { scale: 1.06, duration: 0.55, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "left center" }, 4.2);

  /* MISSING stays hidden until "with" 5.74 -> enters 6.05, counter opens on 1 and lands "7" ON "seven" @6.32 */
  tl.fromTo("#tc-w2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 6.05);
  tl.to(c2, { v: 7, duration: 0.27, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("tc-v2"); if (e) e.textContent = Math.round(c2.v);
  } }, 6.05);

  /* row 2 reveals on "Later" (8.02); counter opens on 1, "24" lands ON the spoken word "24." @9.70 */
  tl.fromTo("#tc-r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.87);
  tl.to(c3, { v: 24, duration: 1.2, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("tc-v3"); if (e) e.textContent = Math.round(c3.v);
  } }, 8.5);

  /* hold: counter breathes so nothing idles between the landed count and the exit */
  tl.to("#tc-v3", { scale: 1.05, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1, transformOrigin: "left center" }, 9.75);

  /* exit, finishing by D-0.1 = 10.801 */
  tl.to("#tc-panel", { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 10.2);
  tl.to({}, { duration: 0.01 }, DUR - 0.01);
  window.__timelines["g-toll-counter"] = tl;
})();
</script>
</template>
</body>
</html>
