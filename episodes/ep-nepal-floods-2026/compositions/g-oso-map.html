  <div class="oso-chip" id="g-oso-map-c3" style="top:304px">FULL OF WATER</div>
  <div class="oso-src" id="g-oso-map-src">Map data: Natural Earth</div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-oso-map", P = "#g-oso-map-";
  /* Redo 29 Sep 26 (Opus). Real word times from retime-sheet.md (host 322.600+22.246).
     0-7.1 the Washington map, the date in the rail on "March", the pin on "Oso". "hillside" 7.18: the camera pushes x4 into
     the pin and crossfades to a SCHEMATIC side profile of the Oso slope (tan glacial sediment over bedrock, river at the toe).
     "collapsed" 8.96: the failure wedge morphs into a debris tongue that crosses the river (same 5-point polygon, attr tween).
     "Kaligandaki" 15.66: the rail leaves and the Kali Gandaki wall (g-glacial-debris' left face, x0.62) joins on the right.
     The three recipe chips are ONE centred column (one instance of each fact; a copy on each half would trip overlap_check
     dup-fact), and each one lights the same feature in BOTH drawings at once: pebbles, angle arcs, rising water. */
  const CUES = {
    march: 3.76,   /* "March" @3.76 */
    oso: 5.43,     /* "Oso," @5.58 */
    hill: 7.10,    /* "hillside" @7.18 */
    sed: 8.39,     /* "sediment" @8.54 */
    coll: 8.96,    /* "collapsed" @8.96 */
    rain: 9.71,    /* "weeks" @9.86 */
    n43: 11.20,    /* "43" @11.68 */
    kg: 15.66,     /* "Kaligandaki" @15.66 "wall" @16.32 */
    recipe: 17.36, /* "recipe," @17.36 */
    loose: 18.54,  /* "loose" @18.54 */
    steep: 20.10,  /* "steep" @20.10 */
    water: 20.96   /* "full" @20.96 "water." @21.32 */
  };
  const DUR = 22.246;
  const tl = gsap.timeline({ paused: true });
  const osoArc = document.querySelector(P + "osoarc"), kgArc = document.querySelector(P + "kgarc");
  const AL = Math.ceil(Math.max(osoArc.getTotalLength(), kgArc.getTotalLength())) + 1;

  /* rain on the Oso slope: 24 streaks, finite repeats */
  const rEl = document.querySelector(P + "orain"), RAIN = [];
  for (let i = 0; i < 24; i++) {
    const x = 130 + i * 32 + ((i * 13) % 11);
    const y = 400 + ((i * 29) % 60);
    const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
    ln.setAttribute("id", "g-oso-map-r" + i);
    ln.setAttribute("x1", x); ln.setAttribute("y1", y); ln.setAttribute("x2", x - 7); ln.setAttribute("y2", y + 30);
    if (rEl) rEl.appendChild(ln);
    RAIN.push(ln);
  }

  /* ---- initial state ---- */
  tl.set([P + "ring", P + "pin", P + "t-oso", P + "sea", P + "t-sea", P + "t-wa", P + "t-or", P + "t-bc", P + "bar", P + "eb",
    P + "r-date", P + "r-datelab", P + "r-count", P + "oso", P + "kg", P + "scar", P + "t-osoname", P + "t-sed", P + "t-bed",
    P + "t-riv", P + "t-rain", P + "orain", P + "t-kgname", P + "reb", P + "c1", P + "c2", P + "c3", P + "osopeb", P + "kgpeb",
    P + "osoref", P + "kgref"], { autoAlpha: 0 }, 0);
  tl.set(P + "cam", { scale: 1, svgOrigin: "467.1 365.3" }, 0);
  tl.set([osoArc, kgArc], { strokeDasharray: AL, strokeDashoffset: AL }, 0);

  /* ---- ambient over the map ---- */
  tl.fromTo(P + "src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 0.3);
  tl.fromTo(P + "wa", { attr: { "stroke-opacity": 0.35 } }, { attr: { "stroke-opacity": 0.8 }, duration: 1.2, ease: "sine.inOut", repeat: 3, yoyo: true }, 0);
  tl.fromTo([P + "t-wa", P + "t-bc", P + "t-or", P + "sea", P + "t-sea"], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.45, stagger: 0.15, ease: "power3.out" }, 0.2);
  tl.fromTo(P + "bar", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.0);

  /* ---- "March" @3.76: the rail headline date ---- */
  tl.fromTo(P + "r-date", { autoAlpha: 0, scale: 0.8, transformOrigin: "0% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, CUES.march);

  /* ---- "Oso," @5.58: pin, ring, name ---- */
  tl.fromTo(P + "pin", { autoAlpha: 0, scale: 0, svgOrigin: "467.1 365.3" }, { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, CUES.oso);
  tl.fromTo(P + "ring", { autoAlpha: 0.95, attr: { r: 10 } }, { autoAlpha: 0, attr: { r: 52 }, duration: 1.0, ease: "power2.out", repeat: 1, repeatDelay: 0.1 }, CUES.oso + 0.3);
  tl.fromTo(P + "t-oso", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.oso + 0.15);
  tl.fromTo(P + "eb", { autoAlpha: 0, x: -30 }, { autoAlpha: 1, x: 0, duration: 0.5, ease: "power3.out" }, CUES.oso);

  /* ---- "hillside" @7.18: labels clear, the camera pushes x4 into the pin, crossfade to the Oso profile ---- */
  tl.to([P + "t-oso", P + "t-sea", P + "t-wa", P + "t-or", P + "t-bc", P + "bar", P + "src"], { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 6.80);
  tl.to(P + "cam", { scale: 4, duration: 1.2, ease: "power2.inOut" }, CUES.hill);
  tl.to(P + "mapscene", { autoAlpha: 0, duration: 0.45, ease: "power1.in" }, 7.90);
  tl.fromTo(P + "oso", { autoAlpha: 0, scale: 1.08, svgOrigin: "480 700" }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 7.95);
  tl.fromTo([P + "t-osoname", P + "t-bed", P + "t-riv"], { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, stagger: 0.08, ease: "power3.out" }, 8.20);
  tl.fromTo(P + "t-sed", { autoAlpha: 0, x: -14 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, CUES.sed);

  /* ---- "collapsed" @8.96: the wedge fails and runs out as a tongue across the river ---- */
  tl.to(P + "scar", { autoAlpha: 1, duration: 0.2 }, CUES.coll);
  tl.to(P + "wedge", { attr: { points: "540,850 892,902 760,906 640,890 560,872" }, duration: 0.95, ease: "power2.in" }, CUES.coll);
  tl.fromTo(P + "r-datelab", { autoAlpha: 0, x: 20 }, { autoAlpha: 1, x: 0, duration: 0.4, ease: "power3.out" }, CUES.coll);

  /* ---- "weeks of heavy rain" @9.86-10.58 ---- */
  tl.to(P + "orain", { autoAlpha: 1, duration: 0.3 }, CUES.rain);
  RAIN.forEach(function (ln, i) {
    const d = 0.7 + (i % 5) * 0.08;
    const at = CUES.rain + (i % 7) * 0.08;
    const reps = Math.floor((15.3 - at) / d) - 1;
    tl.fromTo(ln, { y: 0 }, { y: 300, duration: d, ease: "none", repeat: reps }, at);
  });
  tl.fromTo(P + "t-rain", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 9.90);

  /* ---- "43" @11.68: the count in the rail, opening on 1 ---- */
  tl.fromTo(P + "r-count", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUES.n43);
  const o = { v: 1 };
  tl.to(o, { v: 43, duration: 0.48, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("g-oso-map-cv"); if (e) e.textContent = Math.round(o.v);
  } }, CUES.n43);
  tl.to(P + "cv", { scale: 1.06, transformOrigin: "left center", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 12.4);

  /* ---- "Kaligandaki" @15.66 "wall" @16.32: the rail leaves, the Kali Gandaki wall joins on the right ---- */
  tl.to([P + "eb", P + "r-date", P + "r-count", P + "railbg"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, 15.10);
  tl.to([P + "orain", P + "t-rain"], { autoAlpha: 0, duration: 0.4 }, 15.20);
  tl.fromTo(P + "kg", { autoAlpha: 0, x: 160 }, { autoAlpha: 1, x: 0, duration: 0.7, ease: "power3.out" }, CUES.kg);
  tl.fromTo(P + "t-kgname", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 16.25);

  /* ---- "same recipe" @17.36 ---- */
  tl.to(P + "t-sed", { autoAlpha: 0, duration: 0.3 }, 17.10);
  tl.fromTo(P + "reb", { autoAlpha: 0, y: -10 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.recipe);
  tl.to([P + "ososed", P + "kgman"], { attr: { "stroke-width": 7 }, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 }, CUES.recipe + 0.1);

  /* ---- "loose glacial material" @18.54: pebbles in both tan bodies ---- */
  tl.fromTo(P + "c1", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.loose);
  tl.fromTo([P + "osopeb", P + "kgpeb"], { autoAlpha: 0, scale: 0.6, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, CUES.loose + 0.1);
  tl.to([P + "osopeb", P + "kgpeb"], { y: -4, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 19.1);

  /* ---- "steep slope" @20.10: the angle arc draws on both ---- */
  tl.fromTo(P + "c2", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.steep);
  tl.to([P + "osoref", P + "kgref"], { autoAlpha: 1, duration: 0.2 }, CUES.steep);
  tl.to([osoArc, kgArc], { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, CUES.steep + 0.1);

  /* ---- "full of water" @20.96: blue rises in both mantles ---- */
  tl.fromTo(P + "c3", { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, CUES.water);
  tl.to(P + "osowater", { attr: { y: 470 }, duration: 0.6, ease: "power2.out" }, CUES.water);
  tl.to(P + "kgwater", { attr: { y: 445 }, duration: 0.6, ease: "power2.out" }, CUES.water);

  /* ---- exit: fade-through ---- */
  tl.to([P + "oso", P + "kg", P + "reb", P + "c1", P + "c2", P + "c3"], { autoAlpha: 0, duration: 0.45, ease: "power1.in" }, DUR - 0.55);
  tl.to({}, { duration: 0.01 }, DUR - 0.01);

  window.__timelines[ID] = tl;
})();
</script>
</template>
