<!doctype html>

<body>
<!-- g-basecamp-diagram-z (Z close): "g-basecamp-diagram fades to the single camp" (script Z picture line). Starts
     from g-basecamp-diagram-a6's dawn end-state and thins to one glowing tent under the returning name card
     (name card itself is an index.html overlay, not authored here). mg_specs/g-basecamp-diagram-z.md. -->
<template>
<style>
  #gbdz-root { position:absolute; inset:0; overflow:hidden; font-family:Arial, sans-serif;
    background:radial-gradient(ellipse at 40% 35%, #2a2118 0%, #0b0806 78%); }
  .gbdz-svg { position:absolute; left:0; top:0; width:1920px; height:1080px; }
</style>
<div id="gbdz-root" data-composition-id="g-basecamp-diagram-z" data-width="1920" data-height="1080" data-duration="8">
  <svg class="gbdz-svg" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="gbdz-rockgrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b5a45"/><stop offset="1" stop-color="#2a3644"/></linearGradient>
      <linearGradient id="gbdz-avagrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0dcc0" stop-opacity="0"/><stop offset="1" stop-color="#f0dcc0" stop-opacity="0.5"/></linearGradient>
      <radialGradient id="gbdz-glowgrad" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#e8c56a" stop-opacity="0.55"/><stop offset="1" stop-color="#e8c56a" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="gbdz-scene">
      <path id="gbdz-massif" d="M700,150 L1170,830 L230,830 Z" fill="url(#gbdz-rockgrad)" stroke="#8a7048" stroke-width="2"/>
      <path id="gbdz-snowcap" d="M700,150 L790,330 L610,330 Z" fill="#f4e9d8" opacity="0.92"/>
      <path id="gbdz-avalanche" d="M700,230 L760,230 L650,780 L380,780 Z" fill="url(#gbdz-avagrad)"/>
      <path id="gbdz-rope" d="M500,790 L830,430" fill="none" stroke="#f4e9d8" stroke-width="3" stroke-dasharray="8 6" opacity="0.85"/>
      <circle id="gbdz-c1ring" cx="830" cy="430" r="14" fill="none" stroke="#f4e9d8" stroke-width="4"/>
      <circle id="gbdz-glow" cx="380" cy="806" r="70" fill="url(#gbdz-glowgrad)"/>
      <path id="gbdz-tent1" d="M360,822 L380,790 L400,822 Z" fill="#e8c56a"/>
      <path id="gbdz-tent2" d="M420,822 L440,790 L460,822 Z" fill="#d8a13a"/>
      <path id="gbdz-tent3" d="M480,822 L500,790 L520,822 Z" fill="#d8a13a"/>
      <path id="gbdz-tent4" d="M540,822 L560,790 L580,822 Z" fill="#d8a13a"/>
      <path id="gbdz-tent5" d="M600,822 L620,790 L640,822 Z" fill="#d8a13a"/>
    </g>
  </svg>
</div>
<script>
window.__timelines = window.__timelines || {};
(function () {
  const ID = "g-basecamp-diagram-z", P = "#gbdz-";
  const DUR = 8;
  const tl = gsap.timeline({ paused: true });
  /* continuous from the a6 hold: everything visible at t=0 except the glow (only around the survivor tent) */
  tl.set([P+"massif", P+"snowcap", P+"avalanche", P+"rope", P+"c1ring", P+"tent1", P+"tent2", P+"tent3", P+"tent4", P+"tent5"], { autoAlpha: 1 }, 0);
  tl.set(P+"glow", { autoAlpha: 0, scale: 0.6, svgOrigin: "380 806" }, 0);

  /* whole window: the drift continues */
  tl.fromTo(P+"scene", { scale: 1.015, x: -6, svgOrigin: "700 500" }, { scale: 1.045, x: -18, duration: DUR, ease: "none" }, 0);

  /* RE-ANCHORED: the script line this brief was written against ("the ones on the mountain" / "Pasang Bhote was
     among the first two" / "under fresh snow") is not spoken in this host window any more — the real words here
     are "The climbers from the United Arab Emirates were due in Kathmandu on Thursday, October 1. Their
     expedition didn't go ahead. The guides..." (that Pasang Bhote line now lands in g-person-bhote-z instead).
     This comp carries no on-screen text (brief: "silent visual, narration carries the words"), so the state
     changes are re-anchored to the nearest words that carry the same idea — the clients who never arrived
     letting go of the summit-route marker, then the guides who stayed being the one camp left lit. */

  /* 2.35 (0.15s before "due" @2.50): were due in Kathmandu — the rope and Camp 1 marker let go first */
  tl.to([P+"rope", P+"c1ring"], { autoAlpha: 0, duration: 0.6 }, 2.35);

  /* 5.45 (0.15s before "Their" @5.60): Their expedition didn't go ahead — four tents fade, one stays and glows */
  tl.to([P+"tent2", P+"tent3", P+"tent4", P+"tent5"], { autoAlpha: 0, duration: 0.7, ease: "power2.out", stagger: 0.1 }, 5.45);
  tl.to(P+"glow", { autoAlpha: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 5.65);
  tl.fromTo(P+"tent1", { scale: 1, svgOrigin: "380 806" }, { scale: 1.12, duration: 0.35, ease: "power2.out" }, 5.85);

  /* 7.3 (nearest word "guides" @7.90 is cut off by D=8.0; pulled in so nothing tweens past D) — avalanche
     dims into the background, the remaining camp stays the read into the hard cut to g-outro */
  tl.to(P+"avalanche", { opacity: 0.15, duration: 0.5, ease: "power2.out" }, 7.3);
  tl.to(P+"glow", { scale: 1.15, duration: 0.35, ease: "sine.inOut" }, 7.3);
  window.__timelines[ID] = tl;
})();
</script>
</template>
