<script>

(function () {

  /* IN AUGUST @0.44: the slope; LANGTANG SLOPE @2.28 its label (a slow breath on the relief keeps it alive) */

  tl.fromTo(P+"slopelab", { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.28);
  tl.fromTo(P+"lgrp", { scale: 1 }, { scale: 1.03, svgOrigin: "640 880", duration: 12.4, ease: "none" }, 0.4);

  /* SATELLITE @8.52: the satellite crosses the top (x 200 -> 1100, 1.5 s), its beam sweeping the slope */

  tl.fromTo(P+"beam", { rotation: -14, svgOrigin: "0 30" }, { rotation: 14, svgOrigin: "0 30", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 8.52);

  const TAIL = ["760 488", "830 530", "900 580", "720 540", "790 600", "860 650"];   /* each arrow grows from its tail */
  AR.forEach(function (a, i) { tl.fromTo(a, { autoAlpha: 0, scale: 0, svgOrigin: TAIL[i] }, { autoAlpha: 1, scale: 1, svgOrigin: TAIL[i], duration: 0.3, ease: "back.out(2)" }, 10.2 + i * 0.07); });
  AR.forEach(function (a, i) { tl.to(a, { x: 10, y: 8, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.8 + i * 0.05); });

  /* 12 @10.70 -> INCHES @11.20: the rail opens with the counter (opens at 1) and its label */

  tl.fromTo([P+"cnt", P+"cntlab"], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 10.7);
