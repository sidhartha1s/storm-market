<script>
window.__timelines = window.__timelines || {};
(function () {

  const CUES = {
    river: 4.5,   /* CUE "whole river" @est 4.5 */
    debris: 5.1,  /* CUE "Debris that lands" @est 5.1 */
    dam: 8.9,     /* CUE "natural dam" @est 8.9 */
    lake: 11.0,   /* CUE "lake behind it" @est 11.0 */
    gives: 12.0,  /* CUE "When that dam" @est 12.0 */
    surge: 16.1,  /* CUE "surge of mud" @est 16.1 */
    sept28: 17.1, /* CUE "By the twenty eighth" @est 17.1 */
    cut: 23.7     /* CUE "cut through again" @est 23.7 */
  };
  const DUR = 25.7;
  const EXIT = 25.1;
  const tl = gsap.timeline({ paused: true });
  const lenOf = (id) => Math.ceil(document.querySelector(P + id).getTotalLength()) + 1;
  const LAKE = lenOf("lake"), DEB = lenOf("debline"), UP = lenOf("upline"), DN = lenOf("dnline");
  const cam = (z) => ({ attr: { transform: "translate(" + (538 - 538 * z).toFixed(2) + "," + (550 - 550 * z).toFixed(2) + ") scale(" + z + ")" } });

  /* ---- initial state ---- */
  tl.set(P + "cam", cam(0.82), 0);
  tl.set(P + "lake", { strokeDasharray: LAKE, strokeDashoffset: -LAKE }, 0);
  tl.set(P + "debline", { strokeDasharray: DEB, strokeDashoffset: DEB }, 0);
  tl.set(P + "upline", { strokeDasharray: UP, strokeDashoffset: UP }, 0);
  tl.set(P + "dnline", { strokeDasharray: DN, strokeDashoffset: DN }, 0);
  tl.set([P + "debhead", P + "uphead", P + "dnhead", P + "dam", P + "t-deb", P + "t-up", P + "t-dn",
    P + "pk-dh", P + "pk-an", P + "lete", P + "jom", P + "t-dh", P + "t-an", P + "t-lete", P + "t-jom", P + "bar", P + "t-bar",
    P + "eb", P + "r1", P + "r2", P + "note"], { autoAlpha: 0 }, 0);

  tl.fromTo(P + "src", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5 }, 0.3);

  tl.fromTo([P + "t-dh", P + "t-an", P + "t-lete", P + "t-jom"], { autoAlpha: 0, y: 10 }, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.12, ease: "power3.out" }, 1.8);

  /* ---- the lake backs up: blocked ---- */
  tl.to(P + "lake", { strokeDashoffset: 0, duration: 2.2, ease: "power1.out" }, CUES.lake);
  tl.to(P + "upline", { strokeDashoffset: 0, duration: 0.6, ease: "power3.out" }, CUES.lake + 0.3);
  tl.fromTo(P + "uphead", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.15 }, CUES.lake + 0.8);

  tl.to(P + "dam", { x: 3, duration: 0.08, ease: "none", repeat: 11, yoyo: true }, CUES.gives);

  tl.fromTo(P + "t-dn", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, CUES.surge + 0.3);

  tl.to(P + "lake", { strokeDashoffset: -LAKE * 0.7, duration: 1.4, ease: "power2.inOut" }, CUES.cut + 0.2);
  tl.fromTo(P + "r2", { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "power3.out" }, CUES.cut + 0.2);

  /* ---- exit: rail text slides out; map holds its drift ---- */
  tl.to([P + "eb", P + "r1", P + "r2"], { x: 980, autoAlpha: 0, duration: 0.6, ease: "power3.in" }, EXIT);
