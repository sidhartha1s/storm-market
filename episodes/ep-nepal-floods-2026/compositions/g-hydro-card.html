<script>
window.__timelines = window.__timelines || {};
(function () {
  /* 10 columns x 12 rows = 120 house icons at 28 px in a 44 x 34 cell (each = 1,000 homes, SCHEMATIC) */
  const grid = document.getElementById("hc-grid");
  const icons = [];
  for (let r = 0; r < 12; r++) {
    for (let c = 0; c < 10; c++) {
      const el = document.createElement("div");
      el.className = "hc-icon";
      el.style.left = (c * 44 + 8) + "px";
      el.style.top = (r * 34 + 5) + "px";
      el.innerHTML = '<svg viewBox="0 0 26 22" width="28" height="24"><path d="M13 0 L26 10 L22 10 L22 22 L4 22 L4 10 L0 10 Z" fill="#7fb2e5"/></svg>';
      grid.appendChild(el);
      icons.push(el);
    }
  }

  const tl = gsap.timeline({ paused: true });
  const DUR = 17.845;
  tl.set(["#hc-eb", "#hc-head", "#hc-sub", "#hc-rlab", "#hc-rval", "#hc-meter", "#hc-leg", "#hc-cnum", "#hc-clab", "#hc-stamp"], { autoAlpha: 0 }, 0);
  tl.set(icons, { autoAlpha: 0 }, 0);
  tl.set("#hc-mfill", { scaleX: 0, transformOrigin: "left center" }, 0);

  /* panel in */
  tl.fromTo("#hc-panel", { x: 660 }, { x: 0, duration: 0.7, ease: "power3.out" }, 0);
  /* eyebrow names the plant @0.4 */
  tl.fromTo("#hc-eb", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.4);
  /* POWER @2.66: the output row and its meter arrive together, labelled from the first frame */
  tl.fromTo(["#hc-rlab", "#hc-rval", "#hc-meter"], { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 2.66);
  tl.to("#hc-mfill", { scaleX: 1, duration: 0.5, ease: "power3.out" }, 2.8);
  /* ambient: a glint runs along the live meter until the shutdown */
  tl.fromTo("#hc-mglint", { x: -90 }, { x: 560, duration: 1.4, ease: "none", repeat: 8 }, 3.3);
  /* LARGEST @4.12, 2002 @5.90 */
  tl.fromTo("#hc-head", { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.45, ease: "power3.out" }, 4.12);
  tl.fromTo("#hc-sub", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 5.9);
  /* MAKES @7.88: the legend, then the grid fills row by row (120 x 0.028 s = 3.36 s, done 11.24) */
  tl.fromTo("#hc-leg", { autoAlpha: 0, x: -20 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "power3.out" }, 7.88);
  tl.fromTo(icons, { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.18, ease: "back.out(2)", stagger: 0.028 }, 7.88);
  /* 120 @9.40: the counter opens on its first tick (1,000) with its label, lands on HOMES @11.36 */
  tl.fromTo(["#hc-cnum", "#hc-clab"], { autoAlpha: 0, y: 20 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, 9.4);
  const cnt = { v: 1000 };
  tl.to(cnt, { v: 120000, duration: 1.96, ease: "power3.out", onUpdate: function () {
    const e = document.getElementById("hc-cnum"); if (e) e.textContent = (Math.round(cnt.v / 1000) * 1000).toLocaleString("en-US");
  } }, 9.4);
  tl.to("#hc-cnum", { scale: 1.04, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 3 }, 11.5);
  tl.to(icons, { y: -3, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3, stagger: { each: 0.01, from: "random" } }, 11.6);
  /* SHUT @15.50: the meter drains to 0 MW (15.50-16.20), the homes go dark; DOWN @15.76: the stamp lands */
  tl.to("#hc-mfill", { scaleX: 0, duration: 0.7, ease: "power2.in" }, 15.5);
  const mw = { v: 144 };
  tl.to(mw, { v: 0, duration: 0.7, ease: "power2.in", onUpdate: function () {
    const e = document.getElementById("hc-rnum"); if (e) e.textContent = Math.round(mw.v);
  } }, 15.5);
  tl.to("#hc-rval", { color: "#e74c3c", duration: 0.3 }, 15.9);
  tl.to(icons, { autoAlpha: 0.2, duration: 0.5, ease: "power2.out", stagger: { each: 0.003, from: "end" } }, 15.5);
  tl.fromTo("#hc-stamp", { autoAlpha: 0, scale: 2.2, rotation: -10 }, { autoAlpha: 1, scale: 1, rotation: -4, duration: 0.35, ease: "power4.in" }, 15.76);
  tl.to("#hc-stamp", { scale: 1.04, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 1 }, 16.2);

  /* exit on the host end: slide 17.19 -> 17.845 */
  tl.to("#hc-panel", { x: 980, autoAlpha: 0, duration: 0.655, ease: "power3.in" }, 17.19);  /* ends 17.845 = host end */
  window.__timelines["g-hydro-card"] = tl;
})();
</script>
