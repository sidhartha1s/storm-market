<!doctype html>
<html>
<head><meta charset="UTF-8"></head>
<body>
<!--
  g-a5-9-title (A5-S9, standard): closing title "THE WARNING HOUR" + 2 px red rule, over g-a5-8-splitmap (map fading 1.0 to 0.25 in its S9 window). Track 3.
  Host: data-start = A5-S9 audio start + 2.84 (first mark "Today,"), data-duration 10.88 (to A5-S9 13.72). Cue times below are LOCAL (segment time - 2.84); segment times in the comments.
  Text only: no number, URL or call to action. One text tier by design (brief section 3). No card behind the title; text-shadow carries it. If the frame read shows the map competing, add a radial scrim rgba(3,5,8,0.55) 1100 x 360 behind the title (never a box).
  Layout: title block top 430, centred x 960, 120 px Arial Black; rule 520 px wide, 22 px under the title. Corner (x >= 1600, y >= 680) kept empty.
-->
<template>
<style>
  #g-a5-9-title-root { position:absolute; inset:0; overflow:hidden; pointer-events:none; background:transparent; }
  /* timed wrapper (exit) > float layer > title + rule */
  #a59-block { position:absolute; left:96px; top:430px; width:1728px; height:164px; opacity:0; visibility:hidden; }
  #a59-float { position:absolute; inset:0; }
  #a59-title { position:absolute; left:0; right:0; top:0; text-align:center; white-space:nowrap; transform-origin:50% 50%;
    font-family:'Arial Black', Arial, sans-serif; font-weight:900; font-size:120px; line-height:120px; letter-spacing:0.06em; color:#f2f5f8;
    text-shadow:0 3px 26px rgba(0,0,0,0.9);
    opacity:0; visibility:hidden; }
  /* local scrim (brief section 3): soft radial, never a box */
  #a59-scrim { position:absolute; left:314px; top:-98px; width:1100px; height:360px; opacity:0; visibility:hidden;
    background:radial-gradient(ellipse at 50% 50%, rgba(3,5,8,0.55) 0%, rgba(3,5,8,0) 70%); }
  #a59-rule { position:absolute; left:700px; top:142px; width:520px; height:2px; background:#d0121f; transform-origin:50% 50%;
    opacity:0; visibility:hidden; }
</style>
<div id="g-a5-9-title-root" data-composition-id="g-a5-9-title" data-width="1920" data-height="1080" data-type-ok="title card: single line by design">
  <div id="a59-block" data-start="0" data-duration="10.88" data-track-index="1">
    <div id="a59-float">
      <div id="a59-scrim"></div>
      <div id="a59-title">THE WARNING HOUR</div>
      <div id="a59-rule"></div>
    </div>
  </div>
</div>
<script>
window.__timelines = window.__timelines || {};
(function() {
  const tl = gsap.timeline({ paused: true });
  const B = "#a59-";
  tl.set(B+"block", {autoAlpha:1}, 0);
  tl.set([B+"title", B+"rule", B+"scrim"], {autoAlpha:0}, 0);
  tl.fromTo(B+"scrim", {autoAlpha:0, scale:0.9}, {autoAlpha:1, scale:1, duration:0.8, ease:"power3.out"}, 0);
  /* TODAY @2.84 (local 0.00): title in, fully on at 0.80, long before "This was" @10.34 (local 7.50) */
  tl.fromTo(B+"title", {autoAlpha:0, y:30, scale:0.96}, {autoAlpha:1, y:0, scale:1, duration:0.8, ease:"power3.out"}, 0);
  /* rule draws 0.3 s later from the centre (local 0.30), 0.6 s */
  tl.fromTo(B+"rule", {autoAlpha:0, scaleX:0}, {autoAlpha:1, scaleX:1, duration:0.6, ease:"power3.out"}, 0.3);
  /* hold 3.70..10.30 (local 0.86..7.46): slow breath, title and rule float together */
  tl.to(B+"float", {y:-10, scale:1.02, duration:6.6, ease:"none"}, 0.86);
  /* WARNING @11.04 (local 8.20): rule brightness pulse, 0.5 s; title letter-spacing never tweened */
  tl.to(B+"rule", {opacity:0.5, duration:0.25, ease:"sine.inOut", yoyo:true, repeat:1}, 8.2);
  /* Hour. ends @11.38 (local 8.54); hold to local 10.08, then fade through with g-a5-8's fade to black, ends @13.72 (local 10.88) */
  tl.to(B+"block", {autoAlpha:0, duration:0.8, ease:"power2.inOut"}, 10.08);
  window.__timelines["g-a5-9-title"] = tl;
})();
</script>
</template>
</body>
