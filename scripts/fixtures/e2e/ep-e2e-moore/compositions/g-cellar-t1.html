    $(ids[1]).setAttribute('points', pts([at(hw, ya, 0), at(hw, yb, 0), at(hw, yb, T), at(hw, ya, T)]));
    const tt = up ? T + 0.02 : -0.02;
    let d = '';
    for (const f of [0.22, 0.5, 0.78]) {
      const y = ya + (yb - ya) * f, p0 = P(...at(0.5, y, tt)), p1 = P(...at(hw - 0.5, y, tt));
      d += `M${p0[0].toFixed(1)},${p0[1].toFixed(1)}L${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    }
    $(ids[2]).setAttribute('d', d);
  }
  leaf(-1, 0, ['gct-lLface', 'gct-lLedge', 'gct-lLrib']);
  leaf(1, 0, ['gct-lRface', 'gct-lRedge', 'gct-lRrib']);
  /* leader from the label to Grady's east edge */
  const gp = GEO.Grady.map(q => P(q[0], q[1])).filter(q => q[1] > 330 && q[1] < 420);
  const east = gp.reduce((m, q) => q[0] > m[0] ? q : m, [0, 0]);
  const ld = $('gct-lead'); ld.setAttribute('x1', 1184); ld.setAttribute('y1', 345); ld.setAttribute('x2', east[0] + 6); ld.setAttribute('y2', east[1]);
  const glen = Math.ceil($('gct-glit').getTotalLength()) + 1;
  const llen = Math.ceil(Math.hypot(1184 - east[0] - 6, 345 - east[1])) + 1;

  /* clock beside the cellar, east of the collar on the ground; ticks drawn once */
  const ck = P(ow + 8.5, DY - 4.5, 0);
  $('gct-clockpos').setAttribute('transform', `translate(${ck[0].toFixed(1)},${ck[1].toFixed(1)})`);
  let td = ''; for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6, c = Math.cos(a), n = Math.sin(a);
    td += `M${(c * 30).toFixed(1)},${(n * 30).toFixed(1)}L${(c * 36).toFixed(1)},${(n * 36).toFixed(1)}`; }
  $('gct-ticks').setAttribute('d', td);
  const HOLE = P(0, DY + 1.5, H - 3 * SH);       /* push target: the stairwell, below the rim */
  const RIM = P(0, DY, H);

  const tl = gsap.timeline({ paused: true });
  /* leaf angles (deg) live on a proxy; the timeline-level onUpdate redraws both leaves after every seek */
  const A = { l: 0, r: 0 };
  const draw = () => { leaf(-1, A.l, ['gct-lLface', 'gct-lLedge', 'gct-lLrib']); leaf(1, A.r, ['gct-lRface', 'gct-lRedge', 'gct-lRrib']); };
  tl.eventCallback('onUpdate', draw);
  tl.set('#gct-cam', { transformOrigin: HOLE[0].toFixed(1) + 'px ' + HOLE[1].toFixed(1) + 'px', scale: 1 }, 0);
  tl.set('#gct-shake', { x: 0, y: 0 }, 0);
  tl.set(['#gct-glit', '#gct-gfill', '#gct-lab', '#gct-src', '#gct-lead'], { autoAlpha: 1 }, 0);
  tl.set('#gct-debris rect', { autoAlpha: 0, x: RIM[0] - 10, y: RIM[1] - 4, rotation: 0, transformOrigin: '50% 50%' }, 0);
  tl.set('#gct-streaks line', { autoAlpha: 0, x: -420 }, 0);
  tl.set('#gct-clock', { autoAlpha: 0, scale: 0.4, transformOrigin: '50% 50%' }, 0);
  tl.set(['#gct-mh', '#gct-hh'], { rotation: 0, svgOrigin: '0 0' }, 0);
  tl.set('#gct-dark', { autoAlpha: 0 }, 0);

  /* hold drift for the whole window */
  tl.to('#gct-cam', { scale: 1.04, duration: 6.0, ease: 'none' }, 0);
  /* wind first: streaks race across from the start, the closed leaves rattle */
  [0.15, 0.32, 0.5, 0.26, 0.6, 0.42, 0.08, 0.55, 0.36, 0.2].forEach((d, i) => {
    const sel = `#gct-streaks line:nth-child(${i + 1})`;
    tl.to(sel, { autoAlpha: 1, duration: 0.1, ease: 'none' }, d);
    const sd = 0.62 + (i % 4) * 0.09;   /* finite repeats that end before the push at 6.0 */
    tl.fromTo(sel, { x: -420 }, { x: 2200, duration: sd, ease: 'none', repeat: Math.floor((6.0 - d) / sd) - 1 }, d);
  });
  tl.to(A, { l: 3, r: 2.5, duration: 0.09, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0.38);
  tl.to('#gct-seamglow', { opacity: 0.9, duration: 0.18, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0.38);

  /* "pulled" @0.76 (t1-s1 3.38): both leaves wrenched open past upright, then held; they stay on their hinges */
  tl.to(A, { l: 146, duration: 0.4, ease: 'power4.out' }, 0.76);
  tl.to(A, { r: 140, duration: 0.42, ease: 'power4.out' }, 0.82);
  tl.to(A, { l: 124, r: 120, duration: 0.55, ease: 'back.out(2.2)' }, 1.24);
  tl.to(A, { l: 129, r: 114, duration: 0.34, ease: 'sine.inOut', yoyo: true, repeat: 11 }, 1.8);
  tl.to(['#gct-seam', '#gct-seamglow'], { autoAlpha: 0, duration: 0.2, ease: 'power2.out' }, 0.8);
  tl.fromTo('#gct-glow', { opacity: 0.55 }, { opacity: 1, duration: 0.6, ease: 'power2.out' }, 0.85);
  tl.to('#gct-shake', { x: 11, y: -6, duration: 0.05, ease: 'none', yoyo: true, repeat: 7 }, 0.76);
  /* debris burst out of the opening, carried up and east by the wind */
  const rnd = (i, k) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
  document.querySelectorAll('#gct-debris rect').forEach((el, i) => {
    const at = 0.8 + i * 0.035, dur = 1.1 + rnd(i, 1) * 0.7;
    const dx = -260 + rnd(i, 2) * 980, dy = -(240 + rnd(i, 3) * 480);
    tl.to(el, { autoAlpha: 1, duration: 0.06, ease: 'none' }, at);
    tl.to(el, { x: RIM[0] - 10 + dx, y: RIM[1] - 4 + dy, rotation: (rnd(i, 4) - 0.5) * 900, duration: dur, ease: 'power2.out' }, at);
    tl.to(el, { autoAlpha: 0, duration: 0.35, ease: 'power1.in' }, at + dur - 0.35);
  });

  /* "clock" @5.88 (t1-s1 8.50): a small clock fades in beside the cellar, hands running */
  tl.to('#gct-clock', { autoAlpha: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 5.88);
  tl.to('#gct-mh', { rotation: 540, svgOrigin: '0 0', duration: 0.72, ease: 'none' }, 5.88);
  tl.to('#gct-hh', { rotation: 45, svgOrigin: '0 0', duration: 0.72, ease: 'none' }, 5.88);

  /* exit: HUD text leaves, then the camera pushes into the dark stairwell (log zoom 1.04 to 9) to the cut at 6.601 */
  tl.to(['#gct-lab', '#gct-lead'], { autoAlpha: 0, y: -16, duration: 0.3, ease: 'power3.in' }, 5.6);
  tl.to('#gct-src', { autoAlpha: 0, y: -30, duration: 0.3, ease: 'power3.in' }, 5.65);
  const z = { t: 0 };
  tl.to(z, { t: 1, duration: 0.601, ease: 'power2.in',   /* a to(): a fromTo would render its onUpdate at build time */
    onUpdate: () => gsap.set('#gct-cam', { scale: 1.04 * Math.pow(9 / 1.04, z.t) }) }, 6.0);
  tl.to('#gct-glow', { opacity: 0.25, duration: 0.5, ease: 'power1.in' }, 6.05);
  tl.to('#gct-dark', { autoAlpha: 1, duration: 0.25, ease: 'power1.in' }, 6.35);
  draw();

  window.__timelines['g-cellar-t1'] = tl;
})();
</script>
</template>
